<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>시드니 여행 스케줄</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#E8741E;--primary-hover:#D4681A;--primary-light:#FFF3EB;
  --bg:#F5F5F5;--white:#FFFFFF;
  --grey50:#FAFAFA;--grey100:#F2F4F6;--grey200:#E5E8EB;--grey300:#D1D6DB;
  --grey500:#8B95A1;--grey700:#4E5968;--black:#191F28;
}
html,body{height:100%}
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar{display:none;width:0;height:0}
@supports (height: 100dvh){ html,body{height:100dvh} }
body{background:var(--bg);color:var(--black);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;overflow-x:hidden;display:flex;justify-content:center}
body.sheet-open{overflow:hidden}
.app{width:100%;max-width:500px;min-height:100vh;position:relative;padding-bottom:calc(112px + env(safe-area-inset-bottom))}
@supports (height: 100dvh){ .app{min-height:100dvh} }
.hl{color:var(--primary)}

/* fixed top bar: day sub-tabs (left) + 일정/숙소 switcher (right), one line */
.top-bar{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:468px;display:flex;align-items:center;z-index:25}

/* 일정 / 숙소 switcher — compact floating pill with a sliding active thumb */
.top-tabs{position:relative;margin-left:auto;flex-shrink:0;background:var(--white);border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.1);display:flex;padding:3px}
.tt-thumb{position:absolute;top:3px;left:3px;width:calc((100% - 6px) / 2);height:calc(100% - 6px);background:var(--primary);border-radius:12px;box-shadow:0 3px 10px rgba(232,116,30,0.35);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:0}
.top-tab{position:relative;z-index:1;border:none;background:none;padding:7px 14px;border-radius:12px;font-size:12px;font-weight:700;color:var(--grey500);cursor:pointer;font-family:inherit;transition:color .2s;white-space:nowrap}
.top-tab.on{color:#fff}

.i-bd{padding:calc(64px + env(safe-area-inset-top)) 20px 20px}

@keyframes slideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.content-anim{animation:slideUp .45s cubic-bezier(.2,.8,.2,1)}

/* accommodation register CTA */
.acc-register-btn{position:relative;width:100%;height:150px;border-radius:18px;border:1.5px dashed var(--grey300);background:var(--grey50);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--grey500);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;margin-bottom:16px}
.acc-register-btn .ic{font-size:26px}
.acc-register-btn:active{transform:scale(.98)}

.acc-card-label{position:absolute;top:14px;left:16px;z-index:1;font-size:16px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.acc-card-label-empty{color:var(--grey700);text-shadow:none}

/* day sub tabs — left-aligned, sized to their own text (평일 / 토요일 / 일요일) */
.sub-tabs{display:flex;gap:8px}
.sub-tab{border:none;background:var(--white);color:var(--grey500);padding:9px 16px;border-radius:14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.sub-tab.on{background:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(232,116,30,0.35)}
.sub-empty{font-size:13px;color:var(--grey500);text-align:center;padding:28px 0}

/* place / accommodation photo cards */
.ph-gr{display:flex;flex-direction:column;gap:10px}
.pl-row{display:flex;gap:10px;align-items:stretch}
.pl-time-col{width:74px;flex-shrink:0;padding-top:14px}
.pl-row .ph-cd{flex:1;cursor:pointer}
.time-select-row{display:flex;align-items:center;gap:2px}
.time-select{border:none;background:transparent;font-size:13px;font-weight:700;color:var(--primary);font-family:inherit;padding:0;-webkit-appearance:none;appearance:none}
.time-select:focus{outline:none}
.time-sep{font-size:13px;font-weight:700;color:var(--primary)}
.ph-cd{border-radius:18px;overflow:hidden;position:relative;height:150px;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.ph-cd img{width:100%;height:100%;object-fit:cover;display:block;background:var(--grey100)}
.ph-cd::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.28);pointer-events:none}
.ph-ov{position:absolute;bottom:0;left:0;right:0;padding:12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.65));z-index:1}
.ph-nm{font-size:14px;font-weight:700;color:#fff}
.ph-note{font-size:11px;color:rgba(255,255,255,.85);margin-top:2px}
.ph-del{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.35);color:#fff;font-size:13px;cursor:pointer;backdrop-filter:blur(4px);z-index:1}

/* preset picker — dimmed backdrop + bottom sheet */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes sheetSlideUp{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
@keyframes sheetSlideDown{from{transform:translateY(0)}to{transform:translateY(30px)}}
.picker-backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s ease}
.picker-backdrop.closing{animation:fadeOut .18s ease forwards}
.picker-backdrop.closing .picker-sheet{animation:sheetSlideDown .18s cubic-bezier(.4,0,1,1) forwards}
.picker-sheet{width:100%;max-width:500px;max-height:75vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--white);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:sheetSlideUp .3s cubic-bezier(.2,.8,.2,1);scrollbar-width:none;-ms-overflow-style:none}
.picker-sheet::-webkit-scrollbar{display:none;width:0;height:0}
.picker-sheet-title{font-size:16px;font-weight:700;margin-bottom:14px}
.picker-detail-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.picker-back-btn{background:var(--grey100);color:var(--grey700);border:none;width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0}
.picker-time-row{display:flex;align-items:center;gap:10px;background:var(--grey100);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.picker-time-lb{font-size:13px;font-weight:700;color:var(--grey700)}
.picker-note-input{width:100%;border:1.5px solid var(--grey200);background:var(--white);border-radius:14px;padding:11px 14px;font-size:14px;font-family:inherit;color:var(--black);margin-bottom:14px}
.picker-note-input:focus{outline:none;border-color:var(--primary)}
.preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.preset-chip{position:relative;height:92px;border-radius:14px;overflow:hidden;border:none;cursor:pointer;padding:0;background:var(--grey100) center/cover no-repeat;font-family:inherit}
.preset-chip:active{transform:scale(.95)}
.preset-chip::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.28);pointer-events:none}
.preset-chip .ov{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:8px 4px;background:linear-gradient(transparent 35%, rgba(0,0,0,.65));color:#fff;font-size:11px;font-weight:700;text-align:center}
.preset-emoji{font-size:18px}

/* bottom nav — floating pill bar with a sliding active thumb */
.bottom-nav{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:468px;background:var(--white);border-radius:24px;box-shadow:0 4px 20px rgba(0,0,0,0.1);display:flex;padding:8px;z-index:20}
.bn-thumb{position:absolute;top:8px;left:8px;height:calc(100% - 16px);background:var(--primary-light);border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:0}
.nav-item{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:8px 4px;border-radius:16px;font-family:inherit;color:var(--grey500);min-height:44px}
.nav-item .n-ic{width:24px;height:24px;border-radius:50%;background:var(--grey100);color:var(--grey500);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:.2s}
.nav-item .n-lb{font-size:10px;font-weight:600}
.nav-item.on .n-ic{background:var(--primary);color:#fff}
.nav-item.on .n-lb{color:var(--primary)}

/* floating add-place button */
.fab-wrap{position:fixed;bottom:calc(104px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:468px;height:0;pointer-events:none;z-index:19}
.fab{position:absolute;right:0;bottom:0;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:26px;font-weight:400;line-height:1;box-shadow:0 4px 20px rgba(232,116,30,0.35);cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.fab:active{transform:scale(.94)}
.fab.open{transform:rotate(45deg)}
.fab.open:active{transform:rotate(45deg) scale(.94)}

/* accommodation expand sheet — Airbnb-style detail / register page */
@keyframes sheetIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes sheetOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.94)}}
.acc-sheet-backdrop{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;justify-content:center;animation:sheetIn .32s cubic-bezier(.2,.8,.2,1)}
.acc-sheet-backdrop.closing{animation:sheetOut .2s cubic-bezier(.4,0,1,1) forwards}
.acc-sheet{width:100%;max-width:500px;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--white);scrollbar-width:none;-ms-overflow-style:none}
.acc-sheet::-webkit-scrollbar{display:none;width:0;height:0}

.acc-sheet-hero{position:relative;height:300px;background:var(--grey100) center/cover no-repeat;display:flex}
.acc-sheet-hero::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.25);pointer-events:none}
.acc-sheet-hero-fallback{flex:1;display:flex;align-items:center;justify-content:center;font-size:56px;background:var(--primary-light);color:var(--primary);z-index:1}
.acc-sheet-back{position:absolute;top:calc(16px + env(safe-area-inset-top));left:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;border:none;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);z-index:2}
.acc-sheet-body{background:var(--white);border-radius:28px 28px 0 0;margin-top:-20px;position:relative;padding:24px 20px 40px;min-height:120px}
.acc-sheet-title{font-size:20px;font-weight:800;line-height:1.4}
.acc-sheet-loc{font-size:14px;color:var(--grey500);margin-top:8px;white-space:pre-wrap;line-height:1.6}
.acc-sheet-details{font-size:14px;color:var(--grey700);line-height:1.7;margin-top:16px;white-space:pre-wrap}
.acc-sheet-link{display:block;text-align:center;margin-top:24px;background:var(--primary);color:#fff;border-radius:16px;padding:16px;font-weight:700;text-decoration:none}
.acc-sheet-link:active{background:var(--primary-hover)}
.acc-sheet-actions{display:flex;gap:8px;margin-top:12px}
.acc-sheet-actions button{flex:1;padding:14px;border-radius:14px;border:none;font-weight:700;font-family:inherit;cursor:pointer;font-size:14px}
.acc-sheet-edit-btn{background:var(--grey100);color:var(--grey700)}
.acc-sheet-del-btn{background:var(--grey100);color:var(--grey500)}

/* accommodation shown inline under the 숙소 tab (same look, not a full-screen sheet) */
.acc-inline-hero{border-radius:24px 24px 0 0}
.acc-inline-body{border-radius:0 0 24px 24px;box-shadow:0 2px 12px rgba(0,0,0,0.06)}

/* place detail sheet info rows (same sheet shell as accommodation) */
.place-info-rows{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.place-info-row{display:flex;gap:12px;align-items:flex-start}
.pi-ic{font-size:18px;flex-shrink:0;margin-top:1px}
.pi-lb{font-size:12px;color:var(--grey500);font-weight:600;margin-bottom:2px}
.pi-val{font-size:14px;color:var(--black);line-height:1.6;font-weight:500}

/* accommodation register / edit form (inside the same sheet) */
.acc-form-hdr{display:flex;align-items:center;gap:14px;padding:20px;border-bottom:1px solid var(--grey100)}
.acc-form-hdr button{background:none;border:none;font-size:18px;color:var(--grey700);cursor:pointer;padding:4px}
.acc-form-hdr .t{font-size:16px;font-weight:700}
.acc-form-body{padding:20px;display:flex;flex-direction:column;gap:10px}
.acc-form-body input,.acc-form-body textarea{border:1.5px solid var(--grey200);background:var(--white);border-radius:14px;padding:12px 14px;font-size:14px;font-family:inherit;color:var(--black);width:100%}
.acc-form-body input:focus,.acc-form-body textarea:focus{outline:none;border-color:var(--primary)}
.acc-form-body textarea{min-height:90px;resize:vertical}
.acc-form-fetch-row{display:flex;gap:8px}
.acc-form-fetch-row input{flex:1}
.acc-form-fetch-btn{background:var(--grey100);color:var(--grey700);border:none;border-radius:14px;padding:0 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.acc-form-fetch-btn:active{transform:scale(.96)}
.acc-form-preview{width:100%;height:160px;border-radius:14px;object-fit:cover;background:var(--grey100)}
.acc-form-save{background:var(--primary);color:#fff;border:none;border-radius:14px;padding:15px;font-weight:700;font-size:15px;cursor:pointer;margin-top:4px;font-family:inherit}
.acc-form-save:active{background:var(--primary-hover)}
.acc-form-label{font-size:12px;color:var(--grey500);font-weight:600;margin:2px 2px -2px}
</style>
</head>
<body>
<div class="app">
  <div class="top-bar" id="topBar">
    <div id="tabsWrap"></div>
    <div class="top-tabs" id="topTabs"></div>
  </div>

  <div class="i-bd">
    <div id="scheduleTab">
      <div id="placesWrap"></div>
    </div>
    <div id="accTab" style="display:none"></div>
  </div>
</div>

<div class="fab-wrap"><button class="fab" id="fabBtn" onclick="togglePicker()">+</button></div>
<div class="bottom-nav" id="bottomNav"></div>
<div id="accSheetRoot"></div>
<div id="pickerSheetRoot"></div>

<script>
const START='2026-07-22';
const END='2026-08-17';
const STORE_KEY='sydneyScheduleV3';

function toDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function fmt(d){const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();return `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;}

function buildWeeks(){
  const start=toDate(START),end=toDate(END);
  const days=[];
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)) days.push(fmt(new Date(d)));
  const weeks=[];
  for(let i=0;i<days.length;i+=7) weeks.push(days.slice(i,i+7));
  return weeks;
}
const WEEKS=buildWeeks();

function weekLabel(week){
  const s=toDate(week[0]),e=toDate(week[week.length-1]);
  const sameMonth=s.getMonth()===e.getMonth();
  return sameMonth
    ? `${s.getMonth()+1}.${s.getDate()}-${e.getDate()}`
    : `${s.getMonth()+1}.${s.getDate()}-${e.getMonth()+1}.${e.getDate()}`;
}
// ─── place images (auto-matched by keyword, same spots as tour.html) ───
const PH={
  opera:'https://images.pexels.com/photos/4062614/pexels-photo-4062614.jpeg?auto=compress&cs=tinysrgb&w=600&h=400&fit=crop',
  bridge:'https://images.pexels.com/photos/6262898/pexels-photo-6262898.jpeg?auto=compress&cs=tinysrgb&w=600&h=400&fit=crop',
  bluemtn:'https://images.pexels.com/photos/26825285/pexels-photo-26825285.jpeg?auto=compress&cs=tinysrgb&w=600&h=400&fit=crop',
  koala:'https://images.pexels.com/photos/2590768/pexels-photo-2590768.jpeg?auto=compress&cs=tinysrgb&w=600&h=400&fit=crop',
  bondi:'https://images.pexels.com/photos/2607832/pexels-photo-2607832.jpeg?auto=compress&cs=tinysrgb&w=600&h=400&fit=crop',
  darling:'https://images.pexels.com/photos/995764/pexels-photo-995764.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  garden:'https://images.pexels.com/photos/2253275/pexels-photo-2253275.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  manly:'https://images.pexels.com/photos/1032650/pexels-photo-1032650.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  cafe:'https://images.pexels.com/photos/312418/pexels-photo-312418.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  sunset:'https://images.pexels.com/photos/2531237/pexels-photo-2531237.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  rocks:'https://images.pexels.com/photos/2416600/pexels-photo-2416600.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  zoo:'https://images.pexels.com/photos/1661535/pexels-photo-1661535.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  train:'https://images.pexels.com/photos/2790396/pexels-photo-2790396.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  surf:'https://images.pexels.com/photos/1654489/pexels-photo-1654489.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  food:'https://images.pexels.com/photos/67468/pexels-photo-67468.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  shop:'https://images.pexels.com/photos/135620/pexels-photo-135620.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  art:'https://images.pexels.com/photos/3004909/pexels-photo-3004909.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  ferry:'https://images.pexels.com/photos/2549018/pexels-photo-2549018.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  plane:'https://images.pexels.com/photos/358319/pexels-photo-358319.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop'
};
function plImg(name){
  const s=name.toLowerCase();
  if(s.includes('공항')||s.includes('airport')||s.includes('✈')) return PH.plane;
  if(s.includes('오페라')) return PH.opera;
  if(s.includes('하버브릿지')||s.includes('bridgeclimb')||s.includes('bridge')) return PH.bridge;
  if(s.includes('블루마운틴')||s.includes('scenic')||s.includes('echo')||s.includes('katoomba')||s.includes('leura')) return PH.bluemtn;
  if(s.includes('코알라')||s.includes('페더데일')||s.includes('캥거루')) return PH.koala;
  if(s.includes('본다이')||s.includes('bondi')||s.includes('브론테')||s.includes('쿠지')) return PH.bondi;
  if(s.includes('타롱가')||s.includes('taronga')) return PH.zoo;
  if(s.includes('달링')) return PH.darling;
  if(s.includes('보타닉')||s.includes('정원')) return PH.garden;
  if(s.includes('맨리')||s.includes('manly')||s.includes('셸리')) return PH.manly;
  if(s.includes('록스')||s.includes('rocks')) return PH.rocks;
  if(s.includes('서핑')||s.includes('surf')||s.includes('카약')) return PH.surf;
  if(s.includes('페리')||s.includes('ferry')) return PH.ferry;
  if(s.includes('기차')||s.includes('central역')) return PH.train;
  if(s.includes('카페')||s.includes('브런치')) return PH.cafe;
  if(s.includes('점심')||s.includes('저녁')||s.includes('디너')||s.includes('레스토랑')||s.includes('맛집')) return PH.food;
  if(s.includes('쇼핑')||s.includes('기념품')||s.includes('마켓')) return PH.shop;
  if(s.includes('미술')||s.includes('갤러리')) return PH.art;
  if(s.includes('일몰')||s.includes('일출')||s.includes('sunset')) return PH.sunset;
  return PH.opera;
}

// ─── preset places (same spots tour.html already built itineraries around) ───
const PRESETS=[
  {name:'오페라하우스', emoji:'🎭'},
  {name:'하버브릿지', emoji:'🌉'},
  {name:'블루마운틴', emoji:'⛰️'},
  {name:'페더데일 동물원', emoji:'🐨'},
  {name:'타롱가 동물원', emoji:'🦁'},

function loadData(){
  let d=null;
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw) d=JSON.parse(raw);
  }catch(e){}
  if(!d){
    d={
      accommodations:{},
      plans:{
        '0-weekday':[{name:'✈️ 시드니 공항 도착', time:'09:00'}],
        '3-weekday':[{name:'✈️ 시드니 공항 출발', time:'20:30'}]
      }
    };
  }
  // migrate plan entries saved as plain strings (pre-time-field versions) to {name,time}
  Object.keys(d.plans||{}).forEach(k=>{
    d.plans[k]=(d.plans[k]||[]).map(item=>typeof item==='string' ? {name:item, time:''} : item);
  });
  // migrate the old combined "weekend" tab into "sat" now that it's split into 토요일/일요일
  Object.keys(d.plans||{}).forEach(k=>{
    const m=k.match(/^(\d+)-weekend$/);
    if(!m) return;
    const satKey=`${m[1]}-sat`;
    d.plans[satKey]=(d.plans[satKey]||[]).concat(d.plans[k]);
    delete d.plans[k];
  });
  return d;
}

async function fetchPreview(url){
  try{
    const res=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url));
    const html=await res.text();
    const titleM=html.match(/<meta[^>]*property="og:title"[^>]*content="([^"]*)"/i)
      || html.match(/<meta[^>]*content="([^"]*)"[^>]*property="og:title"/i);
    const imgM=html.match(/<meta[^>]*property="og:image"[^>]*content="([^"]*)"/i)
      || html.match(/<meta[^>]*content="([^"]*)"[^>]*property="og:image"/i);
    const descM=html.match(/<meta[^>]*property="og:description"[^>]*content="([^"]*)"/i)
      || html.match(/<meta[^>]*content="([^"]*)"[^>]*property="og:description"/i);
    return {
      title:titleM?decodeEntities(titleM[1]):null,
      image:imgM?decodeEntities(imgM[1]):null,
      location:descM?decodeEntities(descM[1]):null
    };
  }catch(e){
    return {title:null, image:null, location:null};
  }
}

function scaledDims(w, h, maxDim){
  if(w<=maxDim && h<=maxDim) return {w, h};
  return w>h ? {w:maxDim, h:Math.round(h*maxDim/w)} : {w:Math.round(w*maxDim/h), h:maxDim};
}

function drawToJpeg(source, w, h, quality){
  const canvas=document.createElement('canvas');
  canvas.width=w; canvas.height=h;
  canvas.getContext('2d').drawImage(source,0,0,w,h);
  return canvas.toDataURL('image/jpeg', quality);
}

// card art only ever renders at a few hundred px, so a small target
// keeps both the native decode and the base64 encode fast on mobile
function resizeImageFile(file, maxDim, quality){
  maxDim=maxDim||640; quality=quality||0.7;
  if('createImageBitmap' in window){
    return createImageBitmap(file).then(bitmap=>{
      const {w,h}=scaledDims(bitmap.width, bitmap.height, maxDim);
      const out=drawToJpeg(bitmap, w, h, quality);
      bitmap.close && bitmap.close();
      return out;
    }).catch(()=>resizeImageFileLegacy(file, maxDim, quality));
  }
  return resizeImageFileLegacy(file, maxDim, quality);
}

function resizeImageFileLegacy(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const {w,h}=scaledDims(img.width, img.height, maxDim);
        resolve(drawToJpeg(img, w, h, quality));
      };
      img.onerror=()=>reject(new Error('invalid image'));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

async function handleImgUpload(event){

        <img src="${plImg(p.name)}">
        <button class="ph-del" onclick="event.stopPropagation();removePlace(${i})">✕</button>
        <div class="ph-ov"><div class="ph-nm">${p.name}</div>${p.note?`<div class="ph-note">${p.note}</div>`:''}</div>
      </div>
    </div>`).join('')}</div>`;
}

function setPlaceTime(idx, value){
  const key=planKey();
  if(data.plans[key] && data.plans[key][idx]){
    data.plans[key][idx].time=value;
    saveData();
  }
}

function updatePlaceTimeFromSelect(idx){
  setPlaceTime(idx, readTimeSelect('plTime'+idx));
}

function syncFab(){
  document.getElementById('fabBtn').classList.toggle('open', pickerOpen);
}

function togglePicker(){
  if(pickerOpen) closePicker();
  else openPicker();
}

let pickerSelected=null;

function openPicker(){
  pickerOpen=true;
  pickerSelected=null;
  syncFab();
  document.body.classList.add('sheet-open');
  renderPickerGridStep();
}

function renderPickerGridStep(){
  const existingNames=(data.plans[planKey()]||[]).map(p=>p.name);
  const available=PRESETS.filter(p=>!existingNames.includes(p.name));
  const gridHtml=available.length
    ? `<div class="preset-grid">${available.map(p=>`
        <button class="preset-chip" style="background-image:url('${plImg(p.name)}')" onclick="selectPreset('${p.name}')">
          <span class="ov"><span class="preset-emoji">${p.emoji}</span>${p.name}</span>
        </button>`).join('')}</div>`
    : `<div class="sub-empty">이미 모든 장소를 추가했어요</div>`;
  document.getElementById('pickerSheetRoot').innerHTML=`<div class="picker-backdrop" onclick="if(event.target===this) closePicker()">
    <div class="picker-sheet">
      <div class="picker-sheet-title">어디로 갈까요?</div>
      ${gridHtml}
    </div>
  </div>`;
}

function selectPreset(name){
  pickerSelected=name;
  renderPickerDetailStep();
}

function renderPickerDetailStep(){
  const name=pickerSelected;
  document.getElementById('pickerSheetRoot').innerHTML=`<div class="picker-backdrop" onclick="if(event.target===this) closePicker()">
    <div class="picker-sheet">
      <div class="picker-detail-hdr">
        <button class="picker-back-btn" onclick="backToPickerGrid()">←</button>
        <div class="picker-sheet-title" style="margin:0">${name}</div>
      </div>
      <div class="preset-chip picker-detail-photo" style="background-image:url('${plImg(name)}');height:120px;margin-bottom:16px">
        <span class="ov"><span class="preset-emoji">📍</span>${name}</span>
      </div>
      <div class="picker-time-row">
        <span class="picker-time-lb">시간</span>
        ${timeSelectHtml('picker', '')}
      </div>
      <input type="text" id="pickerNote" class="picker-note-input" placeholder="메모 (선택, 예: 예약 확인, 같이 갈 사람)">
      <button class="acc-form-save" onclick="confirmAddPlace()">추가하기</button>
    </div>
  </div>`;
}

function backToPickerGrid(){
  pickerSelected=null;
  renderPickerGridStep();
}

function confirmAddPlace(){
  const key=planKey();
  const noteInput=document.getElementById('pickerNote');
  if(!data.plans[key]) data.plans[key]=[];
  data.plans[key].push({name:pickerSelected, time:readTimeSelect('picker'), note:noteInput?noteInput.value.trim():''});
  saveData();
  renderPlacesWrap();
  closePicker();
}

function closePicker(){
  pickerOpen=false;
  pickerSelected=null;
  syncFab();
  document.body.classList.remove('sheet-open');
  const root=document.getElementById('pickerSheetRoot');
  const backdrop=root.querySelector('.picker-backdrop');
  if(backdrop){
    backdrop.classList.add('closing');
    setTimeout(()=>{ root.innerHTML=''; }, 200);
  }else{
    root.innerHTML='';
  }
}

function removePlace(idx){
  const rows=document.querySelectorAll('#placesWrap .pl-row');
  const row=rows[idx];
  if(!row){
    data.plans[planKey()].splice(idx,1);
    saveData();
    renderPlacesWrap();
    return;
  }
  const h=row.offsetHeight;
  row.style.overflow='hidden';
  row.style.maxHeight=h+'px';
  row.style.transition='opacity .25s ease, max-height .28s ease .02s';
  void row.offsetHeight;
  requestAnimationFrame(()=>{
    row.style.opacity='0';
    row.style.maxHeight='0px';
  });
  setTimeout(()=>{
    data.plans[planKey()].splice(idx,1);
    saveData();
    renderPlacesWrap();
  }, 280);
}

function renderPlacesWrap(animate){
  const el=document.getElementById('placesWrap');
  el.innerHTML = renderPlaces();
  if(animate){
    el.classList.remove('content-anim');
    void el.offsetWidth;
    el.classList.add('content-anim');
  }
}

renderBottomNav();
renderTabs();
renderPlacesWrap();
renderTopTabs();
goTopTab('schedule');
</script>
</body>
</html>
