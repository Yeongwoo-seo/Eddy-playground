<script>
const TRIP_START=new Date(2026,6,22);
function updateDday(){
  const today=new Date();
  today.setHours(0,0,0,0);
  const diff=Math.round((TRIP_START-today)/86400000);
  const el=document.getElementById('ddayBadge');
  if(diff>0) el.textContent=`✈️ 출발까지 D-${diff}`;
  else if(diff===0) el.textContent='✈️ 오늘 출발!';
  else el.textContent=`✈️ 여행 시작 ${Math.abs(diff)}일째`;
}
updateDday();
setInterval(updateDday, 60000);

<script>
// weather: Open-Meteo needs no API key, so it's safe to call directly
// from this static page. Forecast only covers ~16 days out, so most of
// the 7/22-8/17 trip has no real data yet this early — those days just
// show '-' rather than a guessed number, until it gets closer.
const SYD_LAT=-33.8688, SYD_LON=151.2093;
const TRIP_START_STR='2026-07-22', TRIP_END_STR='2026-08-17';

function wmoIcon(code){
  if(code===0) return '☀️';
  if(code===1) return '🌤️';
  if(code===2) return '⛅';
  if(code===3) return '☁️';
  if(code===45||code===48) return '🌫️';
  if([51,53,55,56,57].includes(code)) return '🌦️';
  if([61,63,65,66,67,80,81,82].includes(code)) return '🌧️';
  if([71,73,75,77,85,86].includes(code)) return '🌨️';
  if([95,96,99].includes(code)) return '⛈️';
  return '⛅';
}

function getWeatherCache(){
  try{ return JSON.parse(localStorage.getItem('weatherCacheV1')||'null'); }catch(e){ return null; }
}
function setWeatherCache(data){
  try{ localStorage.setItem('weatherCacheV1', JSON.stringify(data)); }catch(e){}
}

let weatherData=getWeatherCache();

function renderWidget(){
  if(!weatherData) return;
  const tempEl=document.getElementById('weatherTemp');
  if(!tempEl) return;
  document.getElementById('weatherIcon').textContent=wmoIcon(weatherData.current.code);
  tempEl.textContent=Math.round(weatherData.current.temp)+'°';
  const today=weatherData.daily[0];
  if(today) document.getElementById('weatherRange').textContent=`${Math.round(today.tmax)}° / ${Math.round(today.tmin)}°`;
}

async function fetchWeather(){
  try{
    const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${SYD_LAT}&longitude=${SYD_LON}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Australia%2FSydney&forecast_days=16`);
    if(!res.ok) return;
    const json=await res.json();
    const daily=json.daily.time.map((date,i)=>({
      date, code:json.daily.weather_code[i],
      tmax:json.daily.temperature_2m_max[i], tmin:json.daily.temperature_2m_min[i]
    }));
    weatherData={
      current:{temp:json.current.temperature_2m, code:json.current.weather_code},
      daily
    };
    setWeatherCache(weatherData);
    renderWidget();
    if(document.getElementById('weatherSheetRoot').innerHTML) renderWeatherSheet();
  }catch(e){}
}

function dateStr(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function findForecast(ds){
  return weatherData ? (weatherData.daily.find(d=>d.date===ds) || null) : null;
}

function monthGridHtml(year, month){
  const startDow=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const todayStr=dateStr(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
  const cells=[];
  for(let i=0;i<startDow;i++) cells.push('<div class="wk-cell empty"></div>');
  for(let d=1; d<=daysInMonth; d++){
    const ds=dateStr(year,month,d);
    const isTrip=ds>=TRIP_START_STR && ds<=TRIP_END_STR;
    const isToday=ds===todayStr;
    const fc=findForecast(ds);
    const icon=fc ? wmoIcon(fc.code) : '';
    const temp=fc ? `<b>${Math.round(fc.tmax)}°</b>/${Math.round(fc.tmin)}°` : '-';
    cells.push(`<div class="wk-cell${isTrip?' trip':''}${isToday?' today':''}">
      ${fc?'<span class="wk-forecast-dot"></span>':''}
      <div class="wk-date">${d}</div>
      <div class="wk-ic">${icon}</div>
      <div class="wk-temp">${temp}</div>
    </div>`);
  }
  const dow=['일','월','화','수','목','금','토'].map(d=>`<div class="wk-dow">${d}</div>`).join('');
  return `<div class="wk-grid">${dow}${cells.join('')}</div>`;
}

function renderWeatherSheet(){
  document.getElementById('weatherSheetRoot').innerHTML=`<div class="weather-sheet-backdrop">
    <div class="weather-sheet-hdr">
      <button onclick="closeWeatherSheet()">←</button>
      <div class="t">시드니 날씨</div>
    </div>
    <div class="weather-sheet-body">
      <div class="wk-legend">
        <span><span class="wk-legend-dot" style="background:#3182F6"></span>실시간 예보</span>
        <span><span class="wk-legend-dot" style="background:var(--primary)"></span>여행 기간</span>
        <span><span class="wk-legend-dot today-dot"></span>오늘</span>
      </div>
      <div class="wk-month-title">7월</div>
      ${monthGridHtml(2026,6)}
      <div class="wk-month-title">8월</div>
      ${monthGridHtml(2026,7)}
    </div>
  </div>`;
}

function openWeatherSheet(){
  document.body.classList.add('sheet-open');
  renderWeatherSheet();
}
function closeWeatherSheet(){
  document.body.classList.remove('sheet-open');
  document.getElementById('weatherSheetRoot').innerHTML='';
}

renderWidget();
fetchWeather();
</script>
<script>
// notification settings: multiple content+time rules, stored locally.
// Fires while the app is open/foregrounded (checked on an interval and
// on visibilitychange) — there's no push server behind this static site,
// so a rule set for a time the app never gets opened around will just
// fire the next time the app is opened after that time has passed.
const NOTIF_KEY='tripNotificationsV1';

// Cloudflare Worker that delivers these notifications via Web Push even
// when the app is fully closed — see worker/README.md for deployment.
// Leave blank to fall back to the foreground-only local check below.
const PUSH_API_URL='';
const VAPID_PUBLIC_KEY='BBVVH_C7elBHMMbAYAyrrrN0eLesVlhxEhjyjc4qUHuHhEqg3G4HHic36Zp5Wq-RPs2VVuWcFmESr7eO_kcssIs';

let pushActive=false;

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4 - base64String.length % 4) % 4);
  const base64=(base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);
  const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}

async function ensurePushSubscription(){
  if(!PUSH_API_URL || !('serviceWorker' in navigator) || !('PushManager' in window)) return;
  if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    await fetch(PUSH_API_URL+'/subscribe', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(sub.toJSON())
    });
    pushActive=true;
    syncRulesToServer();
  }catch(e){
    pushActive=false;
  }
}

function syncRulesToServer(){
  if(!PUSH_API_URL || !pushActive) return;
  fetch(PUSH_API_URL+'/rules', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ rules: getNotifRules() })
  }).catch(()=>{});
}

function getNotifRules(){
  try{ return JSON.parse(localStorage.getItem(NOTIF_KEY)||'[]'); }catch(e){ return []; }
}
function setNotifRules(rules){
  try{ localStorage.setItem(NOTIF_KEY, JSON.stringify(rules)); }catch(e){}
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toLocalInputValue(d){
  const pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function openNotifModal(){
  document.body.classList.add('sheet-open');
  if(typeof Notification!=='undefined' && Notification.permission==='default'){
    Notification.requestPermission().then(()=>ensurePushSubscription());
  }else{
    ensurePushSubscription();
  }
  renderNotifModal();
}
function closeNotifModal(){
  document.body.classList.remove('sheet-open');
  document.getElementById('notifModalRoot').innerHTML='';
}

function addNotifRule(){
  const rules=getNotifRules();
  const d=new Date();
  d.setDate(d.getDate()+1);
  d.setHours(9,0,0,0);
  rules.push({
    id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
    content:'',
    datetime: toLocalInputValue(d),
    fired:false
  });
  setNotifRules(rules);
  syncRulesToServer();
  renderNotifModal();
}
function updateNotifRule(id, field, value){
  const rules=getNotifRules();
  const r=rules.find(x=>x.id===id);
  if(!r) return;
  r[field]=value;
  if(field==='datetime') r.fired=false;
  setNotifRules(rules);
  syncRulesToServer();
}
function deleteNotifRule(id){
  setNotifRules(getNotifRules().filter(x=>x.id!==id));
  syncRulesToServer();
  renderNotifModal();
}

function renderNotifModal(){
  const rules=getNotifRules();
  const rowsHtml = rules.length ? rules.map(r=>`
    <div class="notif-row">
      <div class="notif-row-fields">
        <input type="text" class="notif-input-text" placeholder="알림 내용 (예: 여권 챙기기!)" value="${escapeHtml(r.content)}" oninput="updateNotifRule('${r.id}','content',this.value)">
        <input type="datetime-local" class="notif-input-dt" value="${r.datetime}" onchange="updateNotifRule('${r.id}','datetime',this.value)">
      </div>
      <button class="notif-del-btn" onclick="deleteNotifRule('${r.id}')">✕</button>
    </div>
  `).join('') : `<div class="notif-empty">아직 설정된 알림이 없어요</div>`;

  document.getElementById('notifModalRoot').innerHTML = `
    <div class="notif-modal-overlay" onclick="closeNotifModal()">
      <div class="notif-modal" onclick="event.stopPropagation()">
        <div class="notif-modal-hdr">
          <div class="notif-modal-title">🔔 알림 설정</div>
          <button class="notif-modal-x" onclick="closeNotifModal()">✕</button>
        </div>
        <div class="notif-modal-body">
          <div class="notif-list">${rowsHtml}</div>
          <button class="notif-add-btn" onclick="addNotifRule()">+ 알림 추가</button>
          <div class="notif-hint">${pushActive ? '앱이 꺼져 있어도 알림이 울려요' : '앱을 열어둔 상태에서만 알림이 울려요'}</div>
        </div>
        <button class="notif-confirm-btn" onclick="closeNotifModal()">확인</button>
      </div>
    </div>
  `;
}

function fireNotification(text){
  if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
  const body=text || '여행 알림';
  if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
    navigator.serviceWorker.getRegistration().then(reg=>{
      if(reg) reg.showNotification('강낭콩 투어', { body, icon:'icons/icon-192.png' });
      else new Notification('강낭콩 투어', { body, icon:'icons/icon-192.png' });
    }).catch(()=>{ try{ new Notification('강낭콩 투어', { body, icon:'icons/icon-192.png' }); }catch(e){} });
  }else{
    try{ new Notification('강낭콩 투어', { body, icon:'icons/icon-192.png' }); }catch(e){}
  }
}

function checkNotifRules(){
  if(pushActive) return; // the Worker's scheduled push already covers this
  const rules=getNotifRules();
  if(!rules.length) return;
  const now=new Date();
  let changed=false;
  rules.forEach(r=>{
    if(r.fired || !r.datetime) return;
    if(new Date(r.datetime)<=now){
      fireNotification(r.content);
      r.fired=true;
      changed=true;
    }
  });
  if(changed) setNotifRules(rules);
}

ensurePushSubscription();
checkNotifRules();
setInterval(checkNotifRules, 30000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkNotifRules(); });
</script>
<script>
// scope covers the whole site so navigating between schedule.html (home),
// planner.html, pack.html, arrival.html, secret.html stays inside the
// installed standalone app instead of kicking out to the browser
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', { scope: '.' });
}
</script>
