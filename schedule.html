<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>시드니 여행 스케줄</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#E8741E;--primary-hover:#D4681A;--primary-light:#FFF3EB;
  --bg:#F5F5F5;--white:#FFFFFF;
  --grey50:#FAFAFA;--grey100:#F2F4F6;--grey200:#E5E8EB;--grey300:#D1D6DB;
  --grey500:#8B95A1;--grey700:#4E5968;--black:#191F28;
  --green:#1DB847;--blue:#3182F6;
}
html,body{height:100%}
body{background:var(--bg);color:var(--black);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:500px;min-height:100vh;background:var(--bg);position:relative;padding-bottom:96px}
.hl{color:var(--primary)}

/* header */
.pg-hdr{padding:20px 16px 16px;background:var(--white)}
.pg-title{font-size:22px;font-weight:700;letter-spacing:-.3px}
.pg-sub{font-size:13px;color:var(--grey500);font-weight:500;margin-top:6px;line-height:1.6}

/* week tab strip (also mirrored in bottom nav) */
.week-strip{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;background:var(--white);-webkit-overflow-scrolling:touch}
.week-strip::-webkit-scrollbar{display:none}
.week-chip{flex-shrink:0;padding:8px 14px;border-radius:20px;background:var(--grey100);color:var(--grey500);font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;white-space:nowrap;transition:.2s}
.week-chip.on{background:var(--primary);color:var(--white)}

.content{padding:20px 16px}

/* accommodation card */
.acc-card{background:var(--white);border-radius:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:20px;margin-bottom:20px}
.card-label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--grey700);margin-bottom:12px}
.card-label .dot{width:6px;height:6px;border-radius:50%;background:var(--primary)}
.acc-input-row{display:flex;gap:8px}
.acc-input{flex:1;border:none;background:var(--grey100);border-radius:14px;padding:12px 14px;font-size:14px;font-family:inherit;color:var(--black)}
.acc-input:focus{outline:2px solid var(--primary)}
.acc-btn{background:var(--primary);color:var(--white);border:none;border-radius:14px;padding:0 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s}
.acc-btn:active{background:var(--primary-hover);transform:scale(.97)}
.acc-preview{display:flex;gap:12px;margin-top:14px;background:var(--grey50);border-radius:16px;padding:12px;align-items:center;text-decoration:none;color:inherit}
.acc-thumb{width:56px;height:56px;border-radius:12px;background:var(--primary-light);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.acc-thumb img{width:100%;height:100%;object-fit:cover}
.acc-txt{flex:1;min-width:0}
.acc-name{font-size:13px;font-weight:700;color:var(--black);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-link{font-size:11px;color:var(--grey500);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-remove{background:none;border:none;color:var(--grey300);font-size:16px;cursor:pointer;flex-shrink:0;padding:6px}
.acc-empty{font-size:12px;color:var(--grey500);margin-top:4px}

/* sub tabs (weekday / weekend) */
.sub-tabs{display:flex;gap:6px;background:var(--grey100);border-radius:16px;padding:4px;margin-bottom:16px}
.sub-tab{flex:1;border:none;background:none;padding:10px 0;border-radius:12px;font-size:14px;font-weight:700;color:var(--grey500);cursor:pointer;font-family:inherit;transition:.2s}
.sub-tab.on{background:var(--white);color:var(--primary);box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.sub-empty{font-size:13px;color:var(--grey500);text-align:center;padding:24px 0}

/* day cards */
.day-card{background:var(--white);border-radius:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:20px;margin-bottom:14px}
.day-hdr{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.day-date{font-size:18px;font-weight:700}
.day-dow{font-size:13px;font-weight:600;color:var(--primary)}
.day-badge{margin-left:auto;background:var(--primary-light);color:var(--primary);font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
.plan-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.plan-item{display:flex;align-items:center;gap:10px;background:var(--grey100);border-radius:12px;padding:12px 14px}
.plan-item .txt{flex:1;font-size:14px;font-weight:500;color:var(--black)}
.plan-item .del{background:none;border:none;color:var(--grey500);font-size:15px;cursor:pointer;padding:4px}
.plan-empty{font-size:13px;color:var(--grey500);padding:6px 2px}
.add-row{display:flex;gap:8px}
.add-input{flex:1;border:1.5px solid var(--grey200);background:var(--white);border-radius:14px;padding:11px 14px;font-size:14px;font-family:inherit;color:var(--black)}
.add-input:focus{outline:none;border-color:var(--primary)}
.add-btn{background:var(--grey100);color:var(--grey700);border:none;border-radius:12px;padding:0 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.add-btn:active{transform:scale(.96)}

/* bottom nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:var(--white);border-top:1px solid var(--grey200);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:8px 2px;font-family:inherit;color:var(--grey500);min-height:44px}
.nav-item .n-ic{width:22px;height:22px;border-radius:50%;background:var(--grey100);color:var(--grey500);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:.2s}
.nav-item .n-lb{font-size:10px;font-weight:600}
.nav-item.on .n-ic{background:var(--primary);color:var(--white)}
.nav-item.on .n-lb{color:var(--primary)}
</style>
</head>
<body>
<div class="app">
  <div class="pg-hdr">
    <div class="pg-title">시드니 여행 <span class="hl">스케줄</span></div>
    <div class="pg-sub">7월 22일 09:00 시드니 공항 도착 → 8월 17일 20:30 시드니 공항 출발</div>
  </div>

  <div class="week-strip" id="weekStrip"></div>

  <div class="content" id="content"></div>
</div>

<div class="bottom-nav" id="bottomNav"></div>

<script>
const START='2026-07-22';
const END='2026-08-17';
const STORE_KEY='sydneyScheduleV1';

function toDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function fmt(d){const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();return `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;}
const DOW=['일','월','화','수','목','금','토'];

function buildWeeks(){
  const start=toDate(START),end=toDate(END);
  const days=[];
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)) days.push(fmt(new Date(d)));
  const weeks=[];
  for(let i=0;i<days.length;i+=7) weeks.push(days.slice(i,i+7));
  return weeks;
}
const WEEKS=buildWeeks();

function weekLabel(week){
  const s=toDate(week[0]),e=toDate(week[week.length-1]);
  const sameMonth=s.getMonth()===e.getMonth();
  return sameMonth
    ? `${s.getMonth()+1}.${s.getDate()}-${e.getDate()}`
    : `${s.getMonth()+1}.${s.getDate()}-${e.getMonth()+1}.${e.getDate()}`;
}

function loadData(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {accommodations:{}, plans:{
    [START]:['✈️ 시드니 공항 도착 (09:00)'],
    [END]:['✈️ 시드니 공항 출발 (20:30)']
  }};
}
function saveData(){ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }

let data = loadData();
let curWeek = 0;
let curSub = 'weekday';

function renderWeekStrip(){
  const el=document.getElementById('weekStrip');
  el.innerHTML=WEEKS.map((w,i)=>`<button class="week-chip ${i===curWeek?'on':''}" onclick="goWeek(${i})">${i+1}주차 ${weekLabel(w)}</button>`).join('');
}

function renderBottomNav(){
  const el=document.getElementById('bottomNav');
  el.innerHTML=WEEKS.map((w,i)=>`
    <button class="nav-item ${i===curWeek?'on':''}" onclick="goWeek(${i})">
      <div class="n-ic">${i+1}</div>
      <div class="n-lb">${weekLabel(w)}</div>
    </button>
  `).join('');
}

function goWeek(i){
  curWeek=i;
  curSub='weekday';
  renderWeekStrip();
  renderBottomNav();
  renderContent();
}

function goSub(type){
  curSub=type;
  renderContent();
}

function isWeekend(dateStr){
  const dow=toDate(dateStr).getDay();
  return dow===0 || dow===6;
}

function renderSubTabs(week){
  const weekdayCount=week.filter(d=>!isWeekend(d)).length;
  const weekendCount=week.filter(isWeekend).length;
  return `<div class="sub-tabs">
    <button class="sub-tab ${curSub==='weekday'?'on':''}" onclick="goSub('weekday')">평일여행 (${weekdayCount})</button>
    <button class="sub-tab ${curSub==='weekend'?'on':''}" onclick="goSub('weekend')">주말여행 (${weekendCount})</button>
  </div>`;
}

async function fetchPreview(url){
  try{
    const res=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url));
    const html=await res.text();
    const titleM=html.match(/<meta property="og:title" content="([^"]*)"/i);
    const imgM=html.match(/<meta property="og:image" content="([^"]*)"/i);
    return {title:titleM?titleM[1]:null, image:imgM?imgM[1]:null};
  }catch(e){
    return {title:null, image:null};
  }
}

function renderAccCard(weekIdx){
  const acc=data.accommodations[weekIdx];
  let html=`<div class="acc-card">
    <div class="card-label"><span class="dot"></span>숙소 (Airbnb)</div>`;
  if(acc && acc.url){
    html+=`<a class="acc-preview" href="${acc.url}" target="_blank" rel="noopener">
      <div class="acc-thumb">${acc.image?`<img src="${acc.image}">`:'🏠'}</div>
      <div class="acc-txt">
        <div class="acc-name">${acc.title||'Airbnb 숙소'}</div>
        <div class="acc-link">${acc.url}</div>
      </div>
      <button class="acc-remove" onclick="event.preventDefault();removeAcc(${weekIdx})">✕</button>
    </a>`;
  }else{
    html+=`<div class="acc-input-row">
      <input class="acc-input" id="accInput${weekIdx}" placeholder="Airbnb 링크 붙여넣기">
      <button class="acc-btn" onclick="addAcc(${weekIdx})">추가</button>
    </div>
    <div class="acc-empty">등록된 숙소가 없어요</div>`;
  }
  html+=`</div>`;
  return html;
}

async function addAcc(weekIdx){
  const input=document.getElementById('accInput'+weekIdx);
  const url=input.value.trim();
  if(!url) return;
  data.accommodations[weekIdx]={url, title:'불러오는 중...', image:null};
  saveData();
  renderContent();
  const preview=await fetchPreview(url);
  data.accommodations[weekIdx]={url, title:preview.title||'Airbnb 숙소', image:preview.image};
  saveData();
  if(curWeek===weekIdx) renderContent();
}

function removeAcc(weekIdx){
  delete data.accommodations[weekIdx];
  saveData();
  renderContent();
}

function renderDayCard(dateStr){
  const d=toDate(dateStr);
  const plans=data.plans[dateStr]||[];
  const isStart=dateStr===START, isEnd=dateStr===END;
  return `<div class="day-card">
    <div class="day-hdr">
      <div class="day-date">${d.getMonth()+1}월 ${d.getDate()}일</div>
      <div class="day-dow">${DOW[d.getDay()]}요일</div>
      ${isStart?'<div class="day-badge">도착일</div>':isEnd?'<div class="day-badge">출발일</div>':''}
    </div>
    <div class="plan-list">
      ${plans.length? plans.map((p,i)=>`
        <div class="plan-item">
          <span class="txt">${p}</span>
          <button class="del" onclick="removePlan('${dateStr}',${i})">✕</button>
        </div>`).join('') : '<div class="plan-empty">아직 계획이 없어요</div>'}
    </div>
    <div class="add-row">
      <input class="add-input" id="add-${dateStr}" placeholder="어디 갈지 적어보세요" onkeydown="if(event.key==='Enter')addPlan('${dateStr}')">
      <button class="add-btn" onclick="addPlan('${dateStr}')">추가</button>
    </div>
  </div>`;
}

function addPlan(dateStr){
  const input=document.getElementById('add-'+dateStr);
  const val=input.value.trim();
  if(!val) return;
  if(!data.plans[dateStr]) data.plans[dateStr]=[];
  data.plans[dateStr].push(val);
  saveData();
  renderContent();
}
function removePlan(dateStr, idx){
  data.plans[dateStr].splice(idx,1);
  saveData();
  renderContent();
}

function renderContent(){
  const week=WEEKS[curWeek];
  const el=document.getElementById('content');
  const filtered=week.filter(d=>curSub==='weekend'?isWeekend(d):!isWeekend(d));
  el.innerHTML = renderAccCard(curWeek)
    + renderSubTabs(week)
    + (filtered.length ? filtered.map(renderDayCard).join('') : `<div class="sub-empty">${curSub==='weekend'?'주말':'평일'}에 해당하는 날짜가 없어요</div>`);
}

renderWeekStrip();
renderBottomNav();
renderContent();
</script>
</body>
</html>
