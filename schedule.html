<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>시드니 여행 스케줄</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#E8741E;--primary-hover:#D4681A;--primary-light:#FFF3EB;
  --bg:#F5F5F5;--white:#FFFFFF;
  --grey50:#FAFAFA;--grey100:#F2F4F6;--grey200:#E5E8EB;--grey300:#D1D6DB;
  --grey500:#8B95A1;--grey700:#4E5968;--black:#191F28;
}
html,body{height:100%}
body{background:var(--bg);color:var(--black);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;overflow-x:hidden;display:flex;justify-content:center}
.app{width:100%;max-width:500px;min-height:100vh;position:relative;padding-bottom:112px}
.hl{color:var(--primary)}

/* header */
.pg-hdr{padding:24px 20px 16px}
.pg-title{font-size:22px;font-weight:700;letter-spacing:-.3px}

.i-bd{padding:4px 20px 20px}

@keyframes slideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.content-anim{animation:slideUp .45s cubic-bezier(.2,.8,.2,1)}

/* accommodation card (fixed above weekday/weekend tabs) */
.acc-card{background:var(--white);border-radius:20px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:18px;margin-bottom:16px}
.acc-lb{font-size:13px;font-weight:700;color:var(--grey700);margin-bottom:12px}
.acc-input-row{display:flex;gap:8px}
.acc-input{flex:1;border:none;background:var(--grey100);border-radius:14px;padding:12px 14px;font-size:14px;font-family:inherit;color:var(--black)}
.acc-input:focus{outline:2px solid var(--primary)}
.acc-btn{background:var(--primary);color:#fff;border:none;border-radius:14px;padding:0 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s}
.acc-btn:active{background:var(--primary-hover);transform:scale(.96)}
.acc-preview{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.acc-thumb{width:60px;height:60px;border-radius:14px;background:var(--primary-light);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.acc-thumb img{width:100%;height:100%;object-fit:cover}
.acc-txt{flex:1;min-width:0}
.acc-name{font-size:14px;font-weight:700;color:var(--black);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-loc{font-size:12px;color:var(--grey500);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-remove{background:none;border:none;color:var(--grey300);font-size:16px;cursor:pointer;flex-shrink:0;padding:6px}
.acc-empty{font-size:12px;color:var(--grey500);margin-top:8px}

/* weekday / weekend sub tabs */
.sub-tabs{display:flex;gap:6px;background:var(--grey100);border-radius:14px;padding:4px;margin-bottom:16px}
.sub-tab{flex:1;border:none;background:none;padding:11px 0;border-radius:11px;font-size:14px;font-weight:700;color:var(--grey500);cursor:pointer;font-family:inherit;transition:.2s}
.sub-tab.on{background:var(--white);color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.sub-empty{font-size:13px;color:var(--grey500);text-align:center;padding:28px 0}

/* place photo cards */
.ph-gr{display:flex;flex-direction:column;gap:10px}
.ph-cd{border-radius:18px;overflow:hidden;position:relative;height:150px;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.ph-cd img{width:100%;height:100%;object-fit:cover;display:block;background:var(--grey100)}
.ph-ov{position:absolute;bottom:0;left:0;right:0;padding:12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.ph-nm{font-size:14px;font-weight:700;color:#fff}
.ph-del{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.35);color:#fff;font-size:13px;cursor:pointer;backdrop-filter:blur(4px)}

.add-row{display:flex;gap:8px;margin-top:14px}
.add-input{flex:1;border:1.5px solid var(--grey200);background:var(--white);border-radius:14px;padding:12px 14px;font-size:14px;font-family:inherit;color:var(--black)}
.add-input:focus{outline:none;border-color:var(--primary)}
.add-btn{background:var(--grey100);color:var(--grey700);border:none;border-radius:14px;padding:0 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.add-btn:active{transform:scale(.96)}

/* bottom nav — floating pill bar */
.bottom-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:468px;background:var(--white);border-radius:24px;box-shadow:0 4px 20px rgba(0,0,0,0.1);display:flex;padding:8px;z-index:20}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:8px 4px;border-radius:16px;font-family:inherit;color:var(--grey500);min-height:44px;transition:background .2s}
.nav-item .n-ic{width:24px;height:24px;border-radius:50%;background:var(--grey100);color:var(--grey500);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:.2s}
.nav-item .n-lb{font-size:10px;font-weight:600}
.nav-item.on{background:var(--primary-light)}
.nav-item.on .n-ic{background:var(--primary);color:#fff}
.nav-item.on .n-lb{color:var(--primary)}
</style>
</head>
<body>
<div class="app">
  <div class="pg-hdr">
    <div class="pg-title">시드니 여행 <span class="hl">스케줄</span></div>
  </div>

  <div class="i-bd" id="content"></div>
</div>

<div class="bottom-nav" id="bottomNav"></div>

<script>
const START='2026-07-22';
const END='2026-08-17';
const STORE_KEY='sydneyScheduleV2';

function toDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function fmt(d){const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();return `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;}

function buildWeeks(){
  const start=toDate(START),end=toDate(END);
  const days=[];
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)) days.push(fmt(new Date(d)));
  const weeks=[];
  for(let i=0;i<days.length;i+=7) weeks.push(days.slice(i,i+7));
  return weeks;
}
const WEEKS=buildWeeks();

function weekLabel(week){
  const s=toDate(week[0]),e=toDate(week[week.length-1]);
  const sameMonth=s.getMonth()===e.getMonth();
  return sameMonth
    ? `${s.getMonth()+1}.${s.getDate()}-${e.getDate()}`
    : `${s.getMonth()+1}.${s.getDate()}-${e.getMonth()+1}.${e.getDate()}`;
}
function isWeekend(dateStr){
  const dow=toDate(dateStr).getDay();
  return dow===0 || dow===6;
}

// ─── place images (auto-matched by keyword, same spots as tour.html) ───
const PH={
  opera:'https://images.pexels.com/photos/4062614/pexels-photo-4062614.jpeg?auto=compress&cs=tinysrgb&w=600&h=400&fit=crop',
  bridge:'https://images.pexels.com/photos/6262898/pexels-photo-6262898.jpeg?auto=compress&cs=tinysrgb&w=600&h=400&fit=crop',
  bluemtn:'https://images.pexels.com/photos/26825285/pexels-photo-26825285.jpeg?auto=compress&cs=tinysrgb&w=600&h=400&fit=crop',
  koala:'https://images.pexels.com/photos/2590768/pexels-photo-2590768.jpeg?auto=compress&cs=tinysrgb&w=600&h=400&fit=crop',
  bondi:'https://images.pexels.com/photos/2607832/pexels-photo-2607832.jpeg?auto=compress&cs=tinysrgb&w=600&h=400&fit=crop',
  darling:'https://images.pexels.com/photos/995764/pexels-photo-995764.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  garden:'https://images.pexels.com/photos/2253275/pexels-photo-2253275.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  manly:'https://images.pexels.com/photos/1032650/pexels-photo-1032650.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  cafe:'https://images.pexels.com/photos/312418/pexels-photo-312418.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  sunset:'https://images.pexels.com/photos/2531237/pexels-photo-2531237.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  rocks:'https://images.pexels.com/photos/2416600/pexels-photo-2416600.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  zoo:'https://images.pexels.com/photos/1661535/pexels-photo-1661535.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  train:'https://images.pexels.com/photos/2790396/pexels-photo-2790396.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  surf:'https://images.pexels.com/photos/1654489/pexels-photo-1654489.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  food:'https://images.pexels.com/photos/67468/pexels-photo-67468.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  shop:'https://images.pexels.com/photos/135620/pexels-photo-135620.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  art:'https://images.pexels.com/photos/3004909/pexels-photo-3004909.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  ferry:'https://images.pexels.com/photos/2549018/pexels-photo-2549018.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  plane:'https://images.pexels.com/photos/358319/pexels-photo-358319.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop'
};
function plImg(name){
  const s=name.toLowerCase();
  if(s.includes('공항')||s.includes('airport')||s.includes('✈')) return PH.plane;
  if(s.includes('오페라')) return PH.opera;
  if(s.includes('하버브릿지')||s.includes('bridgeclimb')||s.includes('bridge')) return PH.bridge;
  if(s.includes('블루마운틴')||s.includes('scenic')||s.includes('echo')||s.includes('katoomba')||s.includes('leura')) return PH.bluemtn;
  if(s.includes('코알라')||s.includes('페더데일')||s.includes('캥거루')) return PH.koala;
  if(s.includes('본다이')||s.includes('bondi')||s.includes('브론테')||s.includes('쿠지')) return PH.bondi;
  if(s.includes('타롱가')||s.includes('taronga')) return PH.zoo;
  if(s.includes('달링')) return PH.darling;
  if(s.includes('보타닉')||s.includes('정원')) return PH.garden;
  if(s.includes('맨리')||s.includes('manly')||s.includes('셸리')) return PH.manly;
  if(s.includes('록스')||s.includes('rocks')) return PH.rocks;
  if(s.includes('서핑')||s.includes('surf')||s.includes('카약')) return PH.surf;
  if(s.includes('페리')||s.includes('ferry')) return PH.ferry;
  if(s.includes('기차')||s.includes('central역')) return PH.train;
  if(s.includes('카페')||s.includes('브런치')) return PH.cafe;
  if(s.includes('점심')||s.includes('저녁')||s.includes('디너')||s.includes('레스토랑')||s.includes('맛집')) return PH.food;
  if(s.includes('쇼핑')||s.includes('기념품')||s.includes('마켓')) return PH.shop;
  if(s.includes('미술')||s.includes('갤러리')) return PH.art;
  if(s.includes('일몰')||s.includes('일출')||s.includes('sunset')) return PH.sunset;
  return PH.opera;
}

function loadData(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    accommodations:{},
    plans:{
      '0-weekday':['✈️ 시드니 공항 도착 (7/22 09:00)'],
      '3-weekday':['✈️ 시드니 공항 출발 (8/17 20:30)']
    }
  };
}
function saveData(){ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }

let data = loadData();
let curWeek = 0;
let curSub = 'weekday';

function renderBottomNav(){
  const el=document.getElementById('bottomNav');
  el.innerHTML=WEEKS.map((w,i)=>`
    <button class="nav-item ${i===curWeek?'on':''}" onclick="goWeek(${i})">
      <div class="n-ic">${i+1}</div>
      <div class="n-lb">${weekLabel(w)}</div>
    </button>
  `).join('');
}

function goWeek(i){
  curWeek=i;
  curSub='weekday';
  renderBottomNav();
  renderContent();
}

function goSub(type){
  curSub=type;
  renderContent();
}

function renderSubTabs(){
  return `<div class="sub-tabs">
    <button class="sub-tab ${curSub==='weekday'?'on':''}" onclick="goSub('weekday')">평일여행</button>
    <button class="sub-tab ${curSub==='weekend'?'on':''}" onclick="goSub('weekend')">주말여행</button>
  </div>`;
}

async function fetchPreview(url){
  try{
    const res=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url));
    const html=await res.text();
    const titleM=html.match(/<meta property="og:title" content="([^"]*)"/i);
    const imgM=html.match(/<meta property="og:image" content="([^"]*)"/i);
    const descM=html.match(/<meta property="og:description" content="([^"]*)"/i);
    return {
      title:titleM?titleM[1]:null,
      image:imgM?imgM[1]:null,
      location:descM?descM[1]:null
    };
  }catch(e){
    return {title:null, image:null, location:null};
  }
}

function renderAccCard(weekIdx){
  const acc=data.accommodations[weekIdx];
  let html=`<div class="acc-card"><div class="acc-lb">🏠 이번 주 숙소 (Airbnb)</div>`;
  if(acc && acc.url){
    html+=`<a class="acc-preview" href="${acc.url}" target="_blank" rel="noopener">
      <div class="acc-thumb">${acc.image?`<img src="${acc.image}">`:'🏠'}</div>
      <div class="acc-txt">
        <div class="acc-name">${acc.title||'Airbnb 숙소'}</div>
        <div class="acc-loc">${acc.location||acc.url}</div>
      </div>
      <button class="acc-remove" onclick="event.preventDefault();removeAcc(${weekIdx})">✕</button>
    </a>`;
  }else{
    html+=`<div class="acc-input-row">
      <input class="acc-input" id="accInput${weekIdx}" placeholder="Airbnb 링크 붙여넣기">
      <button class="acc-btn" onclick="addAcc(${weekIdx})">추가</button>
    </div>
    <div class="acc-empty">등록된 숙소가 없어요</div>`;
  }
  html+=`</div>`;
  return html;
}

async function addAcc(weekIdx){
  const input=document.getElementById('accInput'+weekIdx);
  const url=input.value.trim();
  if(!url) return;
  data.accommodations[weekIdx]={url, title:'불러오는 중...', image:null, location:null};
  saveData();
  renderContent();
  const preview=await fetchPreview(url);
  data.accommodations[weekIdx]={url, title:preview.title||'Airbnb 숙소', image:preview.image, location:preview.location};
  saveData();
  if(curWeek===weekIdx) renderContent();
}

function removeAcc(weekIdx){
  delete data.accommodations[weekIdx];
  saveData();
  renderContent();
}

function planKey(){ return `${curWeek}-${curSub}`; }

function renderPlaces(){
  const key=planKey();
  const places=data.plans[key]||[];
  if(!places.length) return `<div class="sub-empty">${curSub==='weekend'?'주말':'평일'}에 갈 곳을 추가해보세요</div>`;
  return `<div class="ph-gr">${places.map((p,i)=>`
    <div class="ph-cd">
      <img src="${plImg(p)}">
      <button class="ph-del" onclick="removePlace(${i})">✕</button>
      <div class="ph-ov"><div class="ph-nm">${p}</div></div>
    </div>`).join('')}</div>`;
}

function addPlace(){
  const key=planKey();
  const input=document.getElementById('placeInput');
  const val=input.value.trim();
  if(!val) return;
  if(!data.plans[key]) data.plans[key]=[];
  data.plans[key].push(val);
  saveData();
  renderContent();
}
function removePlace(idx){
  data.plans[planKey()].splice(idx,1);
  saveData();
  renderContent();
}

function renderContent(){
  const el=document.getElementById('content');
  el.innerHTML = renderAccCard(curWeek)
    + renderSubTabs()
    + renderPlaces()
    + `<div class="add-row">
        <input class="add-input" id="placeInput" placeholder="어디 갈지 적어보세요" onkeydown="if(event.key==='Enter')addPlace()">
        <button class="add-btn" onclick="addPlace()">추가</button>
      </div>`;
  el.classList.remove('content-anim');
  void el.offsetWidth;
  el.classList.add('content-anim');
}

renderBottomNav();
renderContent();
</script>
</body>
</html>
