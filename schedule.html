     these exact device-resolution media queries, so we generate one per
     common iPhone size instead of relying on a single generic image -->

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#E8741E;--primary-hover:#D4681A;--primary-light:#FFF3EB;
  --bg:#F5F5F5;--white:#FFFFFF;
  --grey100:#F2F4F6;--grey300:#D1D6DB;--grey500:#8B95A1;--grey700:#4E5968;--black:#191F28;
}
html,body{height:100%}
body{background:var(--bg);color:var(--black);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center}
body.sheet-open{overflow:hidden}
.app{width:100%;max-width:500px;min-height:100vh;padding:16px}
.hl{color:var(--primary)}

.pg-hdr{padding:28px 4px 20px}
.pg-hdr-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pg-hdr-main{flex:1;min-width:0}
.pg-title{font-size:28px;font-weight:800;letter-spacing:-.3px}
.pg-sub{font-size:14px;color:var(--grey500);font-weight:500;margin-top:8px;line-height:1.6}
.dday{display:inline-flex;align-items:center;gap:6px;background:var(--primary-light);color:var(--primary);font-size:13px;font-weight:700;padding:6px 14px;border-radius:20px;margin-top:14px}

.weather-widget{flex-shrink:0;background:var(--white);border:none;border-radius:18px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:inherit;margin-top:2px}
.weather-widget:active{transform:scale(.96)}
.weather-ic{font-size:22px;line-height:1}
.weather-temp{font-size:16px;font-weight:800;color:var(--black)}
.weather-range{font-size:11px;color:var(--grey500);font-weight:600;white-space:nowrap}

/* full-screen weather calendar sheet */
@keyframes wSheetIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.weather-sheet-backdrop{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:wSheetIn .28s cubic-bezier(.2,.8,.2,1)}
.weather-sheet-hdr{display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 20px 16px}
.weather-sheet-hdr button{background:var(--white);color:var(--grey700);border:none;width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;font-family:inherit;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.weather-sheet-hdr .t{font-size:16px;font-weight:700}
.weather-sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 32px}

.wk-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:11.5px;color:var(--grey500);font-weight:600;margin-bottom:18px}
.wk-legend span{display:inline-flex;align-items:center;gap:5px}
.wk-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.wk-month-title{font-size:16px;font-weight:800;margin:20px 4px 10px}
.wk-month-title:first-child{margin-top:0}
.wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wk-dow{text-align:center;font-size:11px;color:var(--grey500);font-weight:600;padding-bottom:4px}
.wk-cell{position:relative;aspect-ratio:1;border-radius:12px;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.wk-cell.empty{background:transparent;box-shadow:none}
.wk-cell.trip{background:var(--primary-light)}
.wk-cell.today{box-shadow:0 0 0 2px var(--black) inset}
.wk-forecast-dot{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:#3182F6}
.wk-date{font-size:11px;font-weight:700;color:var(--grey700)}
.wk-cell.trip .wk-date{color:var(--primary)}
.wk-cell.today .wk-date{color:var(--black)}
.today-dot{background:var(--white);box-shadow:0 0 0 2px var(--black) inset}
.wk-ic{font-size:14px;line-height:1}
.wk-temp{font-size:9.5px;color:var(--grey500);font-weight:600}
.wk-temp b{color:var(--black);font-weight:700}

.nav-list{display:flex;flex-direction:column;gap:14px}
.nav-card{position:relative;display:block;height:150px;border-radius:24px;overflow:hidden;background:var(--grey100) center/cover no-repeat;text-decoration:none;box-shadow:0 2px 12px rgba(0,0,0,0.06);transition:transform .15s}
.nav-card:active{transform:scale(.98)}
.nav-card::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.15) 40%, rgba(0,0,0,.75) 100%)}
.nav-body{position:absolute;left:20px;right:20px;bottom:18px;z-index:1;color:#fff}
.nav-emoji{font-size:22px;margin-bottom:4px;display:block}
.nav-name{font-size:18px;font-weight:800}
.nav-desc{font-size:12.5px;color:rgba(255,255,255,.85);font-weight:500;margin-top:4px;line-height:1.5}
.dday-inline{color:var(--primary);font-weight:800}
.nav-card.locked{cursor:not-allowed;filter:grayscale(.35) brightness(.85)}
.nav-card.locked:active{transform:none}

.pg-ftr{text-align:center;font-size:12px;color:var(--grey500);padding:28px 0 12px}
</style>
</head>
<body>
<div class="app">
  <div class="pg-hdr">
    <div class="pg-hdr-row">
      <div class="pg-hdr-main">
        <div class="pg-title">우리의 <span class="hl">시드니</span> 여행</div>
        <div class="pg-sub">2026.7.22 - 8.17, 출발 전 준비부터 일정까지</div>
        <div class="dday" id="ddayBadge">D-day 계산 중...</div>
      </div>
      <button class="weather-widget" onclick="openWeatherSheet()">
        <div class="weather-ic" id="weatherIcon">⛅</div>
        <div class="weather-temp" id="weatherTemp">--°</div>
        <div class="weather-range" id="weatherRange">--° / --°</div>
      </button>
    </div>
  </div>

  <div class="nav-list">
    <a class="nav-card" href="pack.html" style="background-image:url('https://images.pexels.com/photos/9186152/pexels-photo-9186152.jpeg?auto=compress&cs=tinysrgb&w=800&h=500&fit=crop')">
      <div class="nav-body">
        <span class="nav-emoji">🧳</span>
        <div class="nav-name">짐싸기</div>
        <div class="nav-desc">출국 전에 챙겨야 할 것들 체크리스트</div>
      </div>
    </a>

    <a class="nav-card" href="arrival.html" style="background-image:url('https://images.pexels.com/photos/20139504/pexels-photo-20139504.jpeg?auto=compress&cs=tinysrgb&w=800&h=500&fit=crop')">
      <div class="nav-body">
        <span class="nav-emoji">🛬</span>
        <div class="nav-name">입국준비</div>
        <div class="nav-desc">비자·입국신고서·세관까지 미리 알아두기</div>
      </div>
    </a>

    <a class="nav-card" href="planner.html" style="background-image:url('https://images.pexels.com/photos/4062614/pexels-photo-4062614.jpeg?auto=compress&cs=tinysrgb&w=800&h=500&fit=crop')">
      <div class="nav-body">
        <span class="nav-emoji">🗓️</span>
        <div class="nav-name">여행</div>
        <div class="nav-desc">주차별 일정과 갈 곳을 계획해요</div>
      </div>
    </a>

    <a class="nav-card" id="secretCard" href="secret.html" onclick="return handleSecretClick(event)" style="background-image:url('https://images.pexels.com/photos/15225161/pexels-photo-15225161.jpeg?auto=compress&cs=tinysrgb&w=800&h=500&fit=crop')">
      <div class="nav-body">
        <span class="nav-emoji">🔒</span>
        <div class="nav-name">???</div>
        <div class="nav-desc" id="secretDesc">궁금하지? 비밀이야</div>
      </div>
    </a>
  </div>

  <div class="pg-ftr">우리의 시드니 여행</div>
</div>
<div id="weatherSheetRoot"></div>
<script>
const TRIP_START=new Date(2026,6,22);
function updateDday(){
  const today=new Date();
  today.setHours(0,0,0,0);
  const diff=Math.round((TRIP_START-today)/86400000);
  const el=document.getElementById('ddayBadge');
  if(diff>0) el.textContent=`✈️ 출발까지 D-${diff}`;
  else if(diff===0) el.textContent='✈️ 오늘 출발!';
  else el.textContent=`✈️ 여행 시작 ${Math.abs(diff)}일째`;

  const secretCard=document.getElementById('secretCard');
  const secretDesc=document.getElementById('secretDesc');
  if(diff>0){
    secretCard.classList.add('locked');
    secretDesc.innerHTML=`공개까지 <span class="dday-inline">D-${diff}</span>`;
  }else{
    secretCard.classList.remove('locked');
    secretDesc.textContent='궁금하지? 비밀이야';
  }
}
updateDday();

// ??? stays locked (not enterable) until the reveal date — checked here
// too, not just via the .locked visual, so it can't be opened by tapping
// mid-transition before updateDday's class gets applied
function handleSecretClick(e){
  const today=new Date();
  today.setHours(0,0,0,0);
  if(today<TRIP_START){
    e.preventDefault();
    return false;
  }
  return true;
}
</script>
<script>
// weather: Open-Meteo needs no API key, so it's safe to call directly
// from this static page. Forecast only covers ~16 days out, so most of
// the 7/22-8/17 trip has no real data yet this early — those days just
// show '-' rather than a guessed number, until it gets closer.
const SYD_LAT=-33.8688, SYD_LON=151.2093;
const TRIP_START_STR='2026-07-22', TRIP_END_STR='2026-08-17';

function wmoIcon(code){
  if(code===0) return '☀️';
  if(code===1) return '🌤️';
  if(code===2) return '⛅';
  if(code===3) return '☁️';
  if(code===45||code===48) return '🌫️';
  if([51,53,55,56,57].includes(code)) return '🌦️';
  if([61,63,65,66,67,80,81,82].includes(code)) return '🌧️';
  if([71,73,75,77,85,86].includes(code)) return '🌨️';
  if([95,96,99].includes(code)) return '⛈️';
  return '⛅';
}

function getWeatherCache(){
  try{ return JSON.parse(localStorage.getItem('weatherCacheV1')||'null'); }catch(e){ return null; }
}
function setWeatherCache(data){
  try{ localStorage.setItem('weatherCacheV1', JSON.stringify(data)); }catch(e){}
}

let weatherData=getWeatherCache();

function renderWidget(){
  if(!weatherData) return;
  const tempEl=document.getElementById('weatherTemp');
  if(!tempEl) return;
  document.getElementById('weatherIcon').textContent=wmoIcon(weatherData.current.code);
  tempEl.textContent=Math.round(weatherData.current.temp)+'°';
  const today=weatherData.daily[0];
  if(today) document.getElementById('weatherRange').textContent=`${Math.round(today.tmax)}° / ${Math.round(today.tmin)}°`;
}

async function fetchWeather(){
  try{
    const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${SYD_LAT}&longitude=${SYD_LON}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Australia%2FSydney&forecast_days=16`);
    if(!res.ok) return;
    const json=await res.json();
    const daily=json.daily.time.map((date,i)=>({
      date, code:json.daily.weather_code[i],
      tmax:json.daily.temperature_2m_max[i], tmin:json.daily.temperature_2m_min[i]
    }));
    weatherData={
      current:{temp:json.current.temperature_2m, code:json.current.weather_code},
      daily
    };
    setWeatherCache(weatherData);
    renderWidget();
    if(document.getElementById('weatherSheetRoot').innerHTML) renderWeatherSheet();
  }catch(e){}
}

function dateStr(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function findForecast(ds){
  return weatherData ? (weatherData.daily.find(d=>d.date===ds) || null) : null;
}

function monthGridHtml(year, month){
  const startDow=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const todayStr=dateStr(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
  const cells=[];
  for(let i=0;i<startDow;i++) cells.push('<div class="wk-cell empty"></div>');
  for(let d=1; d<=daysInMonth; d++){
    const ds=dateStr(year,month,d);
    const isTrip=ds>=TRIP_START_STR && ds<=TRIP_END_STR;
    const isToday=ds===todayStr;
    const fc=findForecast(ds);
    const icon=fc ? wmoIcon(fc.code) : '';
    const temp=fc ? `<b>${Math.round(fc.tmax)}°</b>/${Math.round(fc.tmin)}°` : '-';
    cells.push(`<div class="wk-cell${isTrip?' trip':''}${isToday?' today':''}">
      ${fc?'<span class="wk-forecast-dot"></span>':''}
      <div class="wk-date">${d}</div>
      <div class="wk-ic">${icon}</div>
      <div class="wk-temp">${temp}</div>
    </div>`);
  }
  const dow=['일','월','화','수','목','금','토'].map(d=>`<div class="wk-dow">${d}</div>`).join('');
  return `<div class="wk-grid">${dow}${cells.join('')}</div>`;
}

function renderWeatherSheet(){
  document.getElementById('weatherSheetRoot').innerHTML=`<div class="weather-sheet-backdrop">
    <div class="weather-sheet-hdr">
      <button onclick="closeWeatherSheet()">←</button>
      <div class="t">시드니 날씨</div>
    </div>
    <div class="weather-sheet-body">
      <div class="wk-legend">
        <span><span class="wk-legend-dot" style="background:#3182F6"></span>실시간 예보</span>
        <span><span class="wk-legend-dot" style="background:var(--primary)"></span>여행 기간</span>
        <span><span class="wk-legend-dot today-dot"></span>오늘</span>
      </div>
      <div class="wk-month-title">7월</div>
      ${monthGridHtml(2026,6)}
      <div class="wk-month-title">8월</div>
      ${monthGridHtml(2026,7)}
    </div>
  </div>`;
}

function openWeatherSheet(){
  document.body.classList.add('sheet-open');
  renderWeatherSheet();
}
function closeWeatherSheet(){
  document.body.classList.remove('sheet-open');
  document.getElementById('weatherSheetRoot').innerHTML='';
}

renderWidget();
fetchWeather();
</script>
<script>
// scope covers the whole site so navigating between schedule.html (home),
// planner.html, pack.html, arrival.html, secret.html stays inside the
// installed standalone app instead of kicking out to the browser
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', { scope: '.' });
}
</script>
</body>
</html>
