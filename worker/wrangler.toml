name = "gangnangkong-tour-push"
main = "src/index.js"
compatibility_date = "2025-01-01"

# create with: npx wrangler kv namespace create PUSH_KV
# then paste the returned id below
kv_namespaces = [
  { binding = "PUSH_KV", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

# fires every minute and delivers any due-and-unfired notification rules
[triggers]
crons = ["* * * * *"]

