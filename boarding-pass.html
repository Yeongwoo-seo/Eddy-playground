<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>탑승권</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E8741E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="탑승권">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#E8741E;--primary-hover:#D4681A;--primary-light:#FFF3EB;
  --bg:#F5F5F5;--white:#FFFFFF;
  --grey100:#F2F4F6;--grey300:#D1D6DB;--grey500:#8B95A1;--grey700:#4E5968;--black:#191F28;
}
html,body{height:100%}
body{background:var(--bg);color:var(--black);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center}
body.sheet-open{overflow:hidden}
.app{width:100%;max-width:500px;min-height:100vh;padding:16px 16px 40px}
.hl{color:var(--primary)}

.top-bar{display:flex;align-items:center;gap:12px;padding:8px 0 20px}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--white);box-shadow:0 2px 12px rgba(0,0,0,0.06);border:none;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--grey700);flex-shrink:0}
.top-title{font-size:20px;font-weight:800}
.top-sub{font-size:13px;color:var(--grey500);font-weight:500;margin:-14px 0 18px 2px}

.group{margin-bottom:20px}
.group-title{font-size:15px;font-weight:700;color:var(--grey700);margin-bottom:8px;padding-left:2px}
.group-title .dday{color:var(--primary);font-weight:800}
.seg-card{background:var(--white);border-radius:20px;box-shadow:0 2px 12px rgba(0,0,0,0.06);overflow:hidden}
.seg-item{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--grey100);cursor:pointer;font-family:inherit;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.seg-item:last-child{border-bottom:none}
.seg-item:active{background:var(--grey100)}
.seg-ic{font-size:20px;flex-shrink:0;width:26px;text-align:center}
.seg-txt{flex:1;min-width:0}
.seg-route{font-size:14.5px;font-weight:700}
.seg-status{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;flex-shrink:0}
.seg-status.done{background:var(--primary-light);color:var(--primary)}
.seg-status.pending{background:var(--grey100);color:var(--grey500)}
.seg-arrow{color:var(--grey300);font-size:16px;flex-shrink:0}

@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.pdf-sheet-overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center}
.pdf-sheet{width:100%;max-width:500px;height:88vh;background:var(--white);border-radius:28px 28px 0 0;box-shadow:0 8px 32px rgba(0,0,0,0.12);display:flex;flex-direction:column;animation:sheetUp .3s cubic-bezier(.2,.8,.2,1)}
.pdf-sheet-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 18px 10px;flex-shrink:0}
.pdf-sheet-title-wrap{min-width:0}
.pdf-sheet-title{font-size:16px;font-weight:800}
.pdf-sheet-date{font-size:12px;color:var(--grey500);font-weight:600;margin-top:2px}
.pdf-sheet-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.reupload-btn{background:var(--grey100);color:var(--grey700);border:none;border-radius:20px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.reupload-btn:active{background:var(--grey300)}
.pdf-sheet-x{background:var(--grey100);color:var(--grey700);border:none;width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;flex-shrink:0}
.pdf-sheet-body{flex:1;overflow:hidden;padding:0 16px 16px;display:flex;flex-direction:column;min-height:0}

.empty-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:20px}
.empty-ic{font-size:44px}
.empty-title{font-size:15px;font-weight:700}
.empty-sub{font-size:13px;color:var(--grey500);font-weight:500;line-height:1.6;max-width:300px}
.upload-btn{background:var(--primary);color:#fff;border:none;border-radius:16px;padding:14px 28px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.upload-btn:active{background:var(--primary-hover)}
.upload-error{color:#D94141;font-size:12.5px;font-weight:600;margin-top:4px}
.upload-progress{font-size:12.5px;color:var(--grey500);font-weight:600;margin-top:4px}

.pdf-wrap{position:relative;flex:1;border-radius:16px;overflow:auto;min-height:0;background:var(--grey100);touch-action:pan-x pan-y}
.pdf-wrap iframe{width:100%;height:100%;border:none}
.pdf-pages{display:flex;flex-direction:column;gap:8px;padding:8px;transform-origin:0 0}
.pdf-pages canvas{display:block;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.pdf-loading,.pdf-error{padding:40px 16px;text-align:center;font-size:13px;color:var(--grey500);font-weight:600}
.offline-note{background:var(--primary-light);color:var(--primary-hover);font-size:12px;font-weight:600;border-radius:12px;padding:8px 12px;margin-bottom:10px;flex-shrink:0;text-align:center}
.zoom-label{position:absolute;top:10px;right:10px;background:rgba(25,31,40,0.72);color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .2s}
.zoom-label.show{opacity:1}
.file-name-row{font-size:11.5px;color:var(--grey500);font-weight:600;text-align:center;margin-top:10px;flex-shrink:0}
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <button class="back-btn" onclick="location.href='arrival.html'">←</button>
    <div class="top-title">🎫 <span class="hl">탑승권</span></div>
  </div>
  <div class="top-sub">구간을 눌러 PDF를 올리거나 확인해요</div>

  <div id="groupList"></div>
</div>
<div id="sheetRoot"></div>
<input type="file" id="fileInput" accept="application/pdf" style="display:none">
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.min.js" defer></script>
<script>
// 왕복 경유 포함 4개 구간 — 7.22 출국 2구간(서울-상하이, 상하이-시드니),
// 8.17 귀국 2구간(시드니-상하이, 상하이-서울)으로 묶어서 보여준다.
const GROUPS = [
  { date: '7.22', label: '출국', segments: [
    { id: 'sel-pvg', icon: '🛫', route: '서울 → 상하이' },
    { id: 'pvg-syd', icon: '🛫', route: '상하이 → 시드니' },
  ] },
  { date: '8.17', label: '귀국', segments: [
    { id: 'syd-pvg', icon: '🛬', route: '시드니 → 상하이' },
    { id: 'pvg-sel', icon: '🛬', route: '상하이 → 서울' },
  ] },
];
const SEGMENTS = GROUPS.flatMap(g => g.segments.map(s => ({ ...s, date: g.date })));

// 탑승권 PDF는 Supabase Storage(dev-assets 버킷 — planner.html/dev 페이지들과
// 같은 프로젝트)에 올려서 같은 URL을 보는 사람이면 누구나 볼 수 있게 한다.
// 브라우저 IndexedDB에만 저장하면 올린 사람 기기에서만 보였던 게 원래 문제.
// 구간별 저장 경로를 boarding-pass/<segId>.pdf 로 고정해두면 재업로드가
// 그냥 같은 경로를 덮어쓰는 것(upsert)이라, 목록/삭제 API 없이 GET/HEAD
// 만으로 존재 확인과 조회가 끝난다.
// IndexedDB는 계속 쓰지만 이제는 "오프라인 사본" 캐시 용도다 — sw.js가 이
// 페이지를 프리캐시하는 이유도 기내 와이파이 없이 탑승권을 봐야 하는
// 순간 때문이라, 서버에 닿지 않을 때는 마지막으로 받아둔 사본을 보여준다.
const SUPABASE_URL = 'https://dhtstqnksjoyyshnhksv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRodHN0cW5rc2pveXlzaG5oa3N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5NjIyNzQsImV4cCI6MjA5ODUzODI3NH0.FMZdCXntYJKxQeYNwfrsy1liJcHIkD2inJ4NzbwLzd4';
const BUCKET = 'dev-assets';

function segPath(segId) { return `boarding-pass/${segId}.pdf`; }
function segPublicUrl(segId) { return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${segPath(segId)}`; }

// HEAD나 Range 헤더는 안 쓴다 — HEAD는 Supabase Storage의 public object
// 라우트가 지원하는지 보장이 안 되고, Range 같은 커스텀 헤더는 브라우저가
// preflight(OPTIONS)를 먼저 보내는데 버킷 CORS 설정에 그 헤더가 허용돼
// 있지 않으면 요청 자체가 막혀버린다(실제로 이것 때문에 상태 확인이 계속
// 실패해서 탭해도 아무것도 안 열렸다). 그냥 GET을 보내고 본문은 필요 없을
// 때 바로 취소해서, preflight 없이도 존재 여부만 가볍게 확인한다.
async function remoteHead(segId) {
  const res = await fetch(`${segPublicUrl(segId)}?t=${Date.now()}`, { cache: 'no-store' });
  if (res.status === 404 || res.status === 400) {
    if (res.body) res.body.cancel().catch(() => {});
    return null;
  }
  if (!res.ok) {
    if (res.body) res.body.cancel().catch(() => {});
    throw new Error(`상태 확인 실패 (${res.status})`);
  }
  const updatedAt = res.headers.get('last-modified');
  if (res.body) res.body.cancel().catch(() => {});
  return { updatedAt };
}

async function remoteFetchBlob(segId) {
  const res = await fetch(`${segPublicUrl(segId)}?t=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`다운로드 실패 (${res.status})`);
  return res.blob();
}

async function remoteUpload(segId, file) {
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${segPath(segId)}`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': file.type || 'application/pdf',
      'x-upsert': 'true',
    },
    body: file,
  });
  if (!res.ok) throw new Error(`업로드 실패 (${res.status}): ${await res.text()}`);
}

// 오프라인일 때 마지막으로 받아둔 사본을 보여주기 위한 캐시일 뿐 —
// 진짜 저장소는 위 Supabase Storage 쪽이다.
const DB_NAME = 'boardingPassDB';
const STORE_NAME = 'pdfs';
let dbPromise = null;
function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function dbGet(id) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function dbSet(id, value) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(value, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

const el = {
  groupList: document.getElementById('groupList'),
  sheetRoot: document.getElementById('sheetRoot'),
  fileInput: document.getElementById('fileInput'),
};

let activeSegId = null;
let activeObjectUrl = null; // pdf.js를 못 쓸 때의 iframe fallback에서만 쓰인다
let sheetRenderToken = 0; // 겹쳐 들어오는 renderSheet 호출 중 가장 마지막 것만 그리게 막는다
let currentRenderBlob = null; // 핀치로 확대한 뒤 다시 렌더링할 때 쓰는 현재 PDF
let pdfZoom = 1;
let pinch = null; // 두 손가락 확대 제스처 진행 중 상태
const ZOOM_MIN = 1, ZOOM_MAX = 3;
// Boarding-pass PDFs (often the full e-ticket, not just the pass page) run
// a few MB each — 20MB comfortably covers that with headroom.
const MAX_PDF_BYTES = 20 * 1024 * 1024;

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function getSegStatus(segId) {
  try {
    return { has: !!(await remoteHead(segId)) };
  } catch (e) {
    return { has: !!(await dbGet(segId)) };
  }
}

async function renderGroupList() {
  const statuses = await Promise.all(SEGMENTS.map(seg => getSegStatus(seg.id)));
  const statusById = new Map(SEGMENTS.map((seg, i) => [seg.id, statuses[i].has]));
  el.groupList.innerHTML = GROUPS.map(g => `
    <div class="group">
      <div class="group-title"><span class="dday">${escapeHtml(g.date)}</span> · ${escapeHtml(g.label)}</div>
      <div class="seg-card">
        ${g.segments.map(seg => {
          const has = statusById.get(seg.id);
          return `
            <button type="button" class="seg-item" data-id="${seg.id}">
              <div class="seg-ic">${seg.icon}</div>
              <div class="seg-txt">
                <div class="seg-route">${escapeHtml(seg.route)}</div>
              </div>
              <div class="seg-status ${has ? 'done' : 'pending'}">${has ? '등록됨' : '미등록'}</div>
              <div class="seg-arrow">›</div>
            </button>
          `;
        }).join('')}
      </div>
    </div>
  `).join('');
  el.groupList.querySelectorAll('.seg-item').forEach(btn => {
    btn.addEventListener('click', () => openSheet(btn.dataset.id));
  });
}

function openSheet(segId) {
  activeSegId = segId;
  pdfZoom = 1;
  document.body.classList.add('sheet-open');
  renderSheet();
}
function closeSheet() {
  activeSegId = null;
  document.body.classList.remove('sheet-open');
  el.sheetRoot.innerHTML = '';
  if (activeObjectUrl) { URL.revokeObjectURL(activeObjectUrl); activeObjectUrl = null; }
}

async function renderSheet(statusText) {
  const seg = SEGMENTS.find(s => s.id === activeSegId);
  if (!seg) return;
  const myToken = ++sheetRenderToken;

  let rec = null; // { blob, updatedAt }
  let unreachable = false;
  try {
    const meta = await remoteHead(seg.id);
    if (meta) {
      const blob = await remoteFetchBlob(seg.id);
      rec = { blob, updatedAt: meta.updatedAt };
      dbSet(seg.id, rec).catch(() => {}); // 오프라인 사본 갱신 — 실패해도 화면엔 영향 없음
    }
  } catch (e) {
    unreachable = true;
    rec = await dbGet(seg.id);
  }
  if (myToken !== sheetRenderToken) return; // 그 사이 더 최신 렌더가 시작됨

  if (activeObjectUrl) { URL.revokeObjectURL(activeObjectUrl); activeObjectUrl = null; }

  const updatedLabel = rec && rec.updatedAt
    ? new Date(rec.updatedAt).toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })
    : '';

  el.sheetRoot.innerHTML = `
    <div class="pdf-sheet-overlay" onclick="if(event.target===this) closeSheet()">
      <div class="pdf-sheet" onclick="event.stopPropagation()">
        <div class="pdf-sheet-hdr">
          <div class="pdf-sheet-title-wrap">
            <div class="pdf-sheet-title">${seg.icon} ${escapeHtml(seg.route)}</div>
            <div class="pdf-sheet-date">${escapeHtml(seg.date)}</div>
          </div>
          <div class="pdf-sheet-actions">
            ${rec ? `<button class="reupload-btn" onclick="el.fileInput.click()">다시 올리기</button>` : ''}
            <button class="pdf-sheet-x" onclick="closeSheet()">✕</button>
          </div>
        </div>
        <div class="pdf-sheet-body">
          ${rec ? `
            ${unreachable ? `<div class="offline-note">⚠️ 오프라인 상태라 마지막으로 저장된 사본을 보여드려요.</div>` : ''}
            <div class="pdf-wrap" id="pdfWrap">
              <div class="pdf-pages" id="pdfPages"><div class="pdf-loading">불러오는 중...</div></div>
              <div class="zoom-label" id="zoomLabel"></div>
            </div>
            ${updatedLabel ? `<div class="file-name-row">최근 업데이트 · ${escapeHtml(updatedLabel)}</div>` : ''}
          ` : `
            <div class="empty-wrap">
              <div class="empty-ic">${seg.icon}</div>
              <div class="empty-title">아직 등록된 탑승권이 없어요</div>
              <div class="empty-sub">이 구간의 항공권 PDF를 올려두면 같이 보는 사람도 바로 확인할 수 있어요.<br>이 기기에는 오프라인용 사본도 함께 저장돼요.</div>
              ${unreachable
                ? `<div class="upload-error">지금은 오프라인이라 서버에 저장된 탑승권을 확인할 수 없어요. 인터넷에 연결한 뒤 다시 열어봐 주세요.</div>`
                : `<button class="upload-btn" onclick="el.fileInput.click()">📎 PDF 올리기</button>`}
              ${statusText && statusText.error ? `<div class="upload-error">${escapeHtml(statusText.error)}</div>` : ''}
              ${statusText && statusText.busy ? `<div class="upload-progress">업로드하는 중...</div>` : ''}
            </div>
          `}
        </div>
      </div>
    </div>
  `;

  if (rec) {
    currentRenderBlob = rec.blob;
    const wrapEl = el.sheetRoot.querySelector('#pdfWrap');
    const pagesEl = el.sheetRoot.querySelector('#pdfPages');
    pagesEl.addEventListener('dblclick', () => setZoom(pdfZoom > 1 ? 1 : 2));
    attachPinchHandlers(wrapEl, pagesEl);
    renderPdfIntoContainer(rec.blob, pagesEl, myToken, pdfZoom);
  }
}

let zoomLabelHideTimer = null;
function showZoomLabel(zoomValue) {
  const label = el.sheetRoot.querySelector('#zoomLabel');
  if (!label) return;
  label.textContent = `${Math.round((zoomValue != null ? zoomValue : pdfZoom) * 100)}%`;
  label.classList.add('show');
  clearTimeout(zoomLabelHideTimer);
  zoomLabelHideTimer = setTimeout(() => label.classList.remove('show'), 900);
}

function setZoom(z) {
  pdfZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(z * 100) / 100));
  showZoomLabel();
  const pagesEl = el.sheetRoot.querySelector('#pdfPages');
  if (pagesEl && currentRenderBlob) {
    const myToken = ++sheetRenderToken; // 겹쳐서 들어오면 오래된 렌더가 나중에 덮어쓰지 않게
    renderPdfIntoContainer(currentRenderBlob, pagesEl, myToken, pdfZoom);
  }
}

// 두 손가락 핀치로 확대/축소한다. 손가락이 움직이는 동안은 CSS transform으로만
// 반응해서 버벅이지 않게 하고, 손을 떼는 순간에만 pdf.js로 실제 배율에 맞춰
// 다시 그려서 확대해도 바코드/QR이 흐려지지 않게 한다.
function attachPinchHandlers(wrapEl, pagesEl) {
  function touchDist(t0, t1) {
    return Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
  }
  wrapEl.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 2) { pinch = null; return; }
    const rect = pagesEl.getBoundingClientRect();
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
    pagesEl.style.transformOrigin = `${midX}px ${midY}px`;
    pinch = { startDist: touchDist(e.touches[0], e.touches[1]), startZoom: pdfZoom, liveZoom: pdfZoom };
  }, { passive: true });

  wrapEl.addEventListener('touchmove', (e) => {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault(); // 브라우저가 자체적으로 페이지를 확대하려는 것을 막는다
    const d = touchDist(e.touches[0], e.touches[1]);
    const raw = pinch.startZoom * (d / pinch.startDist);
    pinch.liveZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, raw));
    pagesEl.style.transform = `scale(${pinch.liveZoom / pdfZoom})`;
    showZoomLabel(pinch.liveZoom);
  }, { passive: false });

  function endPinch() {
    if (!pinch) return;
    const liveZoom = pinch.liveZoom;
    pinch = null;
    pagesEl.style.transform = '';
    if (liveZoom !== pdfZoom) setZoom(liveZoom);
  }
  wrapEl.addEventListener('touchend', endPinch);
  wrapEl.addEventListener('touchcancel', endPinch);
}

// 탑승권 페이지는 대부분 landscape라, iframe에 그냥 맡기면 뷰어마다
// 자르거나 확대해서 보여줘 전체가 안 보이는 게 원래 문제였다. pdf.js로
// 캔버스에 직접 그려서 폭을 컨테이너에 맞추면(가로 맞춤) 어떤 브라우저에서든
// 페이지 전체가 항상 보인다.
// zoom=1이면 컨테이너 폭에 딱 맞춰 그리고(가로 맞춤), 1보다 크면 그만큼
// 넓게 다시 그려서 pdf-wrap이 가로/세로로 스크롤되게 한다. CSS로 확대(transform)
// 하지 않고 그때그때 다시 렌더링하는 이유는 탑승권의 바코드/QR이 확대해도
// 흐려지지 않고 선명하게 나와야 하기 때문.
async function renderPdfIntoContainer(blob, container, token, zoom) {
  if (!container) return;
  zoom = zoom || 1;
  if (!window.pdfjsLib) {
    // CDN을 못 불러왔을 때만 브라우저 기본 PDF 뷰어로 대체한다.
    activeObjectUrl = URL.createObjectURL(blob);
    container.innerHTML = `<iframe src="${activeObjectUrl}" title="탑승권 PDF"></iframe>`;
    return;
  }
  if (!pdfjsLib.GlobalWorkerOptions.workerSrc) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.worker.min.js';
  }
  try {
    const buf = await blob.arrayBuffer();
    if (token !== sheetRenderToken) return;
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    if (token !== sheetRenderToken) return;
    container.innerHTML = '';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const baseWidth = container.clientWidth || 300;
    const targetWidth = baseWidth * zoom;
    for (let i = 1; i <= pdf.numPages; i++) {
      if (token !== sheetRenderToken) return;
      const page = await pdf.getPage(i);
      const baseViewport = page.getViewport({ scale: 1 });
      const fitScale = targetWidth / baseViewport.width;
      const viewport = page.getViewport({ scale: fitScale * dpr });
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      canvas.style.width = `${targetWidth}px`;
      canvas.style.height = 'auto';
      container.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    }
  } catch (e) {
    if (token !== sheetRenderToken) return;
    container.innerHTML = `<div class="pdf-error">탑승권을 표시하지 못했어요.</div>`;
  }
}

async function handleFile(file) {
  if (!file || !activeSegId) return;
  if (file.type !== 'application/pdf') { renderSheet({ error: 'PDF 파일만 올릴 수 있어요.' }); return; }
  if (file.size > MAX_PDF_BYTES) { renderSheet({ error: `파일이 너무 커요 (최대 ${Math.floor(MAX_PDF_BYTES / 1024 / 1024)}MB).` }); return; }
  const segId = activeSegId;
  try {
    renderSheet({ busy: true });
    await remoteUpload(segId, file);
    await dbSet(segId, { blob: file, updatedAt: new Date().toISOString() });
    await renderSheet();
    await renderGroupList();
  } catch (err) {
    renderSheet({ error: '업로드에 실패했어요: ' + (err && err.message ? err.message : err) });
  }
}

el.fileInput.addEventListener('change', (e) => { handleFile(e.target.files[0]); e.target.value = ''; });

renderGroupList();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', { scope: '.' });
}
</script>
