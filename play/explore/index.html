function renderExitListRows(container, exitDefs, emptyText) {
  container.innerHTML = exitDefs.length ? exitDefs.map(exitDef =>
    `<button class="topic-row" data-exit="${exitDef.id}"><div class="topic-row-main">→ ${escapeHtml(exitDef.name)}</div></button>`
  ).join('') : (emptyText ? `<div class="empty-note">${emptyText}</div>` : '');
  container.querySelectorAll('[data-exit]').forEach(btn => btn.addEventListener('click', () => {
    // 시트는 여기서 안 닫는다 — moveTo()의 암전 트랜지션이 화면을 다 덮은
    // 뒤에 자기가 직접 닫는다(§신규 수정, moveTo 참고).
    moveTo(btn.dataset.exit);
  }));
}

// #moveMapSheet slides up/down (see its CSS) instead of the other sheets'
// plain hidden-class toggle — removing .hidden and adding .show in the same
// tick would let the browser coalesce both style changes into one frame and
// skip the transition entirely, so the opening side needs the initial
// (hidden-just-removed) state to actually paint before .show is added
// — hence the double rAF. Closing plays the transition first and only adds
// .hidden back (pulling it out of layout) once that's had time to finish.
function showMoveMapSheet() {
  // A stray leftover inline transform (e.g. a drag ended via a missed
  // pointercancel) would otherwise override the CSS class-driven open
  // transition below — always start from a clean slate.
  el.moveMapSheetBody.classList.remove('dragging');
  el.moveMapSheetBody.style.transform = '';
  el.moveMapSheet.classList.remove('hidden');
  requestAnimationFrame(() => requestAnimationFrame(() => el.moveMapSheet.classList.add('show')));
}
function hideMoveMapSheet() {
  el.moveMapSheet.classList.remove('show');
  setTimeout(() => el.moveMapSheet.classList.add('hidden'), 300);
}

// 이동하기 지도 시트 — 아래로 스와이프해서 닫기(§신규). 핀 버튼(.move-pin)이나
// 그만두기/목적지 리스트 버튼 위에서 시작한 제스처는 그 자체의 탭 동작이
// 우선이라 드래그를 시작하지 않고, 시트가 (목적지가 많아) 스크롤된 상태라면
// 위로 당기는 제스처가 그 스크롤부터 먼저 소비하게 둔다(scrollTop 가드).
// 손가락을 따라가는 동안은 .dragging(transition:none)으로 즉시 반응하다가,
// 놓는 순간 그 클래스를 떼 시트 자체의 .3s 트랜지션이 다시 살아나게 하고
// 그 트랜지션 하나로 스냅백/닫기 애니메이션을 모두 처리한다 — 드래그 위치
// 그대로에서 이어지므로 다시 위로 튀었다 사라지는 끊김이 없다.
const MAP_DRAG_DISMISS_PX = 120;
let mapDragStartY = null;
let mapDragActive = false;
let mapDragDelta = 0;
el.moveMapSheetBody.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.move-pin, .action-btn, button')) return;
  if (el.moveMapSheetBody.scrollTop > 0) return;
  mapDragActive = true;
  mapDragStartY = e.clientY;
  mapDragDelta = 0;
  el.moveMapSheetBody.setPointerCapture(e.pointerId);
});
el.moveMapSheetBody.addEventListener('pointermove', (e) => {
  if (!mapDragActive) return;
  const delta = e.clientY - mapDragStartY;
  if (delta <= 0) { mapDragDelta = 0; el.moveMapSheetBody.style.transform = ''; return; }
  mapDragDelta = delta;
  el.moveMapSheetBody.classList.add('dragging');
  el.moveMapSheetBody.style.transform = `translateY(${delta}px)`;
});
function endMoveMapDrag() {
  if (!mapDragActive) return;
  mapDragActive = false;
  el.moveMapSheetBody.classList.remove('dragging');
  if (mapDragDelta > MAP_DRAG_DISMISS_PX) {
    el.moveMapSheetBody.style.transform = 'translateY(100%)';
    el.moveMapSheet.classList.remove('show');
    setTimeout(() => {
      el.moveMapSheet.classList.add('hidden');
      el.moveMapSheetBody.style.transform = '';
    }, 300);
  } else {
    el.moveMapSheetBody.style.transform = '';
  }
  mapDragDelta = 0;
}
el.moveMapSheetBody.addEventListener('pointerup', endMoveMapDrag);
el.moveMapSheetBody.addEventListener('pointercancel', endMoveMapDrag);

// 이동하기 — 같은 phase 안이면 지금 있는 곳과 무관하게 어디든 바로 갈 수
// 있다(더 이상 locationDefs.js의 exits로 인접한 곳만 보여주지 않는다 — 그
// 필드는 이제 참고용 기록일 뿐, see locationDefs.js 상단 주석). phaseMaps
// 정의가 있고 mapPosition을 가진 "지도급" 장소가 하나라도 있으면 지도+핀으로,
// 그렇지 않은 phase(용의자 탐문/재검증처럼 좁은 구역을 도는 phase)는 기존
// 리스트 시트 그대로 보여준다.
function openMoveSheet() {
  const currentId = ExplorationState.getCurrentLocationId();
  const phase = ExplorationState.getCurrentPhase();
  const destDefs = Object.values(locationDefs).filter(l => l.id !== currentId && (l.phases || []).includes(phase));
  const phaseMap = (typeof phaseMaps !== 'undefined') ? phaseMaps[phase] : null;
  const mapDests = phaseMap ? destDefs.filter(d => resolveByPhase(d.mapPosition, phase)) : [];
  if (phaseMap && mapDests.length) {
    openMoveMapSheet(phaseMap, mapDests, destDefs.filter(d => !resolveByPhase(d.mapPosition, phase)));
  } else {
    el.listSheetTitle.textContent = '이동하기';
    renderExitListRows(el.listSheetBody, destDefs, '지금은 이동할 곳이 없습니다.');
    el.listSheet.classList.remove('hidden');
  }
}

async function openMoveMapSheet(phaseMap, mapDests, listDests) {
  const currentId = ExplorationState.getCurrentLocationId();
  const currentDef = locationDefs[currentId];
  el.moveMapPins.innerHTML = '';
  el.moveMapWrap.style.backgroundImage = '';
  showMoveMapSheet();

  // 좌표는 locationDefs.js의 정적 mapPosition이 기본값, /dev/upload 탐색허브
  // 탭의 지도 핀 편집기가 저장한 override(AssetDB.getMapPins)가 있으면 그게
  // 우선한다 — 코드 수정 없이 실제 생성된 지도 그림 보면서 미세 조정 가능.
  const pinOverrides = await AssetDB.getMapPins().catch(() => ({}));
  // mapPosition can be phase-keyed (§신규 저작 관습) — e.g. w2-hub-plaza/
  // w2-adrian-spot need different coordinates on the two different phase map
  // images. pinOverrides itself isn't phase-aware yet (keyed by plain
  // location id in /dev/upload's 지도 핀 편집기), so a manually-tuned override
  // still applies to every phase that location appears in.
  function pinPosition(locDef) { return pinOverrides[locDef.id] || resolveByPhase(locDef.mapPosition, ExplorationState.getCurrentPhase()); }

  // 현재 위치도 그 phase 지도에 좌표가 있으면 (cyan) 핀으로 같이 찍어 방향
  // 감각을 준다 — mapDests엔 없으니 분리해서 그린다.
  const currentPos = currentDef && pinPosition(currentDef);
  if (currentPos) {
    const cur = document.createElement('div');
    cur.className = 'move-pin current';
    cur.style.left = currentPos.x + '%';
    cur.style.top = currentPos.y + '%';
    cur.innerHTML = `<span class="move-pin-label">현재 위치</span>`;
    el.moveMapPins.appendChild(cur);
  }
  mapDests.forEach(destDef => {
    const pos = pinPosition(destDef);
    const btn = document.createElement('button');
    btn.className = 'move-pin';
    btn.style.left = pos.x + '%';
    btn.style.top = pos.y + '%';
    btn.innerHTML = `<span class="move-pin-label">${escapeHtml(destDef.name)}</span>`;
    // 지도 시트는 여기서 안 닫는다 — moveTo()의 암전 트랜지션이 화면을 다
    // 덮은 뒤에 자기가 직접 닫는다(§신규 수정, moveTo 참고).
    btn.addEventListener('click', () => {
      moveTo(destDef.id);
    });
    el.moveMapPins.appendChild(btn);
  });

  if (listDests.length) {
    el.moveMapListWrap.innerHTML = '<div class="move-map-listnote">그 밖의 이동 가능한 곳</div>';
    const rows = document.createElement('div');
    el.moveMapListWrap.appendChild(rows);
    renderExitListRows(rows, listDests);
  } else {
    el.moveMapListWrap.innerHTML = '';
  }

  const assetId = await DevGameState.getBackgroundId(phaseMap.id).catch(() => null);
  const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
  if (asset && asset.dataUrl) {
    // Same defensive preloadImage() call applyLocationBackground makes
    // before setting el.locImg.src — preloadPhaseAssets already warms this
    // exact URL at phase entry, so in the normal case this resolves
    // instantly, but without it there's nothing here actually guaranteeing
    // the decode finished before paint if that phase-wide warm ever falls
    // short (a swallowed fetch error, a future call site that opens this
    // sheet before preloadPhaseAssets settles, ...). Every other "show a
    // photo" spot in this file makes this call right before setting
    // src/background-image; this one was the one exception.
    await AssetDB.preloadImage(asset.dataUrl).catch(() => {});
    paintWarm(asset.dataUrl);
    el.moveMapWrap.style.backgroundImage = `url(${asset.dataUrl})`;
  }
}
el.moveMapCloseBtn.addEventListener('click', () => hideMoveMapSheet());

// 대화하기 — casual topics and 'minigame'-type hand-offs (하버 포토, §12.3)
// share one list instead of a separate "말 걸기" quick-pick step. 심문하기류
// (isInterrogation)는 여기서 빠진다 — bottom-bar 위 플로팅 버튼(interrogateBtn,
// renderInterrogateBtn)으로 따로 뜨므로 목록에 묻혀 있을 필요가 없다.
function openTopicList(characterId) {
  const locationId = ExplorationState.getCurrentLocationId();
  const topics = ExplorationState.getInteractionsForCharacter(characterId, locationId).filter(i => (i.type === 'topic' || i.type === 'minigame') && !i.isInterrogation);
  // 나눌 잡담(topic)은 아직 없고 심문할 거리만 있는 인물이 꽤 있다 — 이 경우
  // "대화하기"를 눌렀는데 "아직 나눌 이야기가 없습니다"만 뜨면 막다른 골목처럼
  // 느껴진다. 그래서 잡담 주제가 하나도 없을 때는 대화하기가 곧 심문하기를
  // 대신하도록, 시트를 열지 않고 가능한 심문 항목을 바로 재생한다. 그 심문을
  // 거쳐 실제 잡담 주제가 생기면 이후엔 대화하기/심문하기가 각자 정상적으로
  // 따로 뜬다(대화하기는 잡담이 있을 때만, 심문하기는 renderInterrogateBtn이
  // 독립적으로 계속 띄움).
  if (!topics.length) {
    const interrogation = getInterrogationInteraction(characterId);
    if (interrogation) { playInteraction(interrogation.id); return; }
  }
  el.listSheetTitle.textContent = '대화하기';
  el.listSheetBody.innerHTML = topics.length ? topics.map(t => `
    <button class="topic-row" data-topic="${t.id}"${t.state === 'locked' ? ' disabled' : ''}>
      <div class="topic-row-main">${t.icon ? t.icon + ' ' : ''}${escapeHtml(t.label || t.id)}</div>
      <span class="topic-state state-${t.state}">${STATE_LABEL[t.state] || t.state}</span>
    </button>
  `).join('') : '<div class="empty-note">아직 나눌 이야기가 없습니다.</div>';
  el.listSheetBody.querySelectorAll('[data-topic]').forEach(btn => btn.addEventListener('click', () => {
    el.listSheet.classList.add('hidden');
    playInteraction(btn.dataset.topic);
  }));
  el.listSheet.classList.remove('hidden');
}

// 제시하기 (spec §8 + §Phase 4 CaseEntry 재설계, was 증거 제시 + 대화하기 안의
// "다른 사람에 대해 묻기") — 3열 타일 그리드는 철회하고, 대화 중 제시
// 시트(play/game/index.html)와 같은 CaseEntryUI 리스트형 ces-card로 통일했다.
// 인물 탭도 같은 카드 모양(casePersonCardHtml)으로 그려 시각 언어를 하나로
// 맞춘다. 인물 탭은 되돌릴 필요 없는 저위험 액션이라 기존처럼 즉시
// 반응하고, 증거/증언 쪽만 탭-선택-확인(§9.4 오탭 방지)을 적용한다.
// presentEvidenceRules/defaultPresentReaction은 dev/data/interactionDefs.js에
// 그대로 두고(result 5분류·페널티 없음 원칙도 그대로, §8.2/§8.4).
const CASE_ENTRY_PRESENT_TABS_EXPLORE = [
  { id: 'related', label: '관련 항목' },
  { id: 'evidence', label: '증거' },
  { id: 'testimony', label: '증언' },
  { id: 'all', label: '전체' },
  { id: 'person', label: '인물' },
];
let presentTab = 'related';
let presentSelectedEntryId = null;

// 증거 하나를 실제로 제시했을 때의 공통 처리 — data-present-confirm(플레이어가
// 직접 골라 확인) 경로와 아래 정답 제시 테스트 버튼 경로가 똑같이 쓴다.
function presentEvidenceToCharacter(characterId, evidenceId) {
  const rule = presentEvidenceRules.find(r => r.characterId === characterId && r.evidenceId === evidenceId && (!r.phase || r.phase === ExplorationState.getCurrentPhase()));
  const outcome = rule || defaultPresentReaction;
  if (rule && (rule.result === 'correct' || rule.result === 'partial')) (rule.effects || []).forEach(applyLocalEffect);
  // already_used 파생 판정용(§9.5) — scorePresentRelevance의 "이미 같은
  // NPC에게 제시했으며 변화 없음 -3"(§9.3)이 이 플래그를 읽는다.
  CaseFileState.setFlag('presented:' + characterId + ':' + evidenceId, true);
  showToastLine(characterId, outcome.reactionText);
}

// 정답 제시 (§테스트용) — presentEvidenceRules에 등록된 이 인물+phase의
// result:'correct' 룰을 찾아 곧바로 제시한다. 심문마다 정답 증거를 목록에서
// 직접 찾아 고르지 않고도 correct 반응/effects 경로를 바로 확인할 수 있는
// 개발용 지름길 — 등록된 정답 룰이 없는 인물·phase면 그렇다고 알려준다.
function presentTestCorrectAnswer(characterId) {
  const rule = presentEvidenceRules.find(r => r.characterId === characterId && r.result === 'correct' && (!r.phase || r.phase === ExplorationState.getCurrentPhase()));
  presentSelectedEntryId = null;
  el.listSheet.classList.add('hidden');
  if (!rule) { showToastLine(characterId, '[테스트] 이 인물·phase엔 등록된 정답 룰이 없습니다.'); return; }
  presentEvidenceToCharacter(characterId, rule.evidenceId);
}

function renderPresentTiles(characterId) {
  CaseEntryUI.injectCaseEntryUIStyles();
  const testBtn = `<button class="present-test-answer-btn" id="presentTestAnswerBtn" type="button">🧪 정답 제시 (테스트용)</button>`;
  // 증거 DB 노트 v1.1 — 기존 관련도 스코어링 시트는 그대로 두고, 훑어보며
  // 고르고 싶을 때만 전환할 수 있는 대안 진입점만 추가한다. 제출 판정은
  // 이 시트의 data-present-confirm과 완전히 같은 presentEvidenceToCharacter
  // 하나를 공유(§0 원칙: 정답 판정 로직은 절대 중복 구현하지 않는다).
  const notebookBtn = (typeof EvidenceNotebook !== 'undefined') ? `<button class="present-test-answer-btn present-notebook-btn" id="presentNotebookBtn" type="button">📓 수첩에서 고르기</button>` : '';
  const tabBar = `<div class="cm-tabbar ces-tabbar">${CASE_ENTRY_PRESENT_TABS_EXPLORE.map(t => `<button class="cm-tab${presentTab === t.id ? ' cm-tab-active' : ''}" data-tab="${t.id}">${t.label}</button>`).join('')}</div>`;
  if (presentTab === 'person') {
    const persons = CaseFileState.getPersons().filter(p => p.id !== characterId);
    el.listSheetBody.innerHTML = testBtn + notebookBtn + tabBar + (persons.length ? `<div class="ces-grid">${persons.map(p => CaseEntryUI.casePersonCardHtml(p)).join('')}</div>` : '<div class="cm-empty">아직 물어볼 만한 인물이 없습니다.</div>');
    el.listSheetBody.querySelectorAll('[data-present-person]').forEach(btn => btn.addEventListener('click', () => {
      el.listSheet.classList.add('hidden');
      showToastLine(characterId, '음, 그 사람에 대해서는 딱히 할 말이 없는데.');
    }));
    Promise.all(persons.map(async (p) => {
      const assetId = await Promise.resolve(DevGameState.getCharacterAssetId(p.id, 'neutral')).catch(() => null);
      const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
      const host = document.querySelector(`[data-person-icon="${p.id}"]`);
      if (host && asset && asset.dataUrl) host.innerHTML = `<img src="${asset.dataUrl}" alt="" class="ces-icon-img">`;
    }));
  } else {
    const ctx = {
      npcId: characterId, topicTags: [],
      week: (typeof ExplorationState !== 'undefined' && ExplorationState.getCurrentWeek) ? ExplorationState.getCurrentWeek() : null,
      activeTab: presentTab, selectedId: presentSelectedEntryId, maxSuggested: 6,
    };
    el.listSheetBody.innerHTML = testBtn + notebookBtn + tabBar + CaseEntryUI.renderPresentGridHtml(CaseFileState.getCaseEntries(), ctx);
    CaseEntryUI.hydrateCaseEntryIcons(el.listSheetBody);
    el.listSheetBody.querySelectorAll('[data-present-entry]').forEach(btn => btn.addEventListener('click', () => {
      presentSelectedEntryId = presentSelectedEntryId === btn.dataset.presentEntry ? null : btn.dataset.presentEntry;
      renderPresentTiles(characterId);
    }));
    el.listSheetBody.querySelectorAll('[data-present-confirm]').forEach(btn => btn.addEventListener('click', () => {
      const entryId = btn.dataset.presentConfirm;
      presentSelectedEntryId = null;
      el.listSheet.classList.add('hidden');
      presentEvidenceToCharacter(characterId, entryId);
    }));
  }
  el.listSheetBody.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', () => {
    presentTab = btn.dataset.tab;
    presentSelectedEntryId = null;
    renderPresentTiles(characterId);
  }));
  el.listSheetBody.querySelector('#presentTestAnswerBtn').addEventListener('click', () => presentTestCorrectAnswer(characterId));
  const notebookBtnEl = el.listSheetBody.querySelector('#presentNotebookBtn');
  if (notebookBtnEl) notebookBtnEl.addEventListener('click', () => {
    el.listSheet.classList.add('hidden');
    EvidenceNotebook.open({
      mode: 'present',
      npcId: characterId,
      onPresent: (entryId) => presentEvidenceToCharacter(characterId, entryId),
    });
  });
}
function openPresentSheet(characterId) {
  presentTab = 'related'; // §9.2 매번 새로 열 때 "관련 항목"으로 초기화
  presentSelectedEntryId = null;
  el.listSheetTitle.textContent = '제시하기';
  renderPresentTiles(characterId);
  el.listSheet.classList.remove('hidden');
}

/* ===== 조사하기 (§신규) =====
   The background is already pannable/zoomable at all times (§263's ambient
   loc-stage/loc-canvas above) — 조사하기 doesn't need a second, duplicate
   pan/zoom stage on top of it, just a toggle that surfaces "here's what's
   actually tappable" as marker buttons layered into the *same* #locCanvas,
   so they inherit its live pan/zoom transform for free. Hotspots come from
   locationDefs[id].investigateHotspots (optional, point {x,y,interactionId,
   icon} or area {x1,y1,x2,y2,interactionId} in %, see that file's header
   comment and .investigate-hotspot/.is-rect above) — a location with none
   authored yet still toggles the mode on, it just has nothing to mark and no hint
   text either (조사하기 자체가 핫스팟 유무를 알려주는 게 아니라 순수히
   핫스팟을 찾는 도구라, "여긴 특별히 없다"는 안내는 스포일러에 가깝다).
   locStage's own pointerdown (a few lines up) is
   patched to ignore taps on `.investigate-hotspot` so tapping a marker
   doesn't also start a pan-drag underneath it. investigateMode itself is
   declared up with the pan/zoom state above, since that stage's own
   handlers gate on it too (조사하기 off = 화면 이동 잠금). */
function clearInvestigateHotspots() { el.locCanvas.querySelectorAll('.investigate-hotspot').forEach(n => n.remove()); }
function renderInvestigateHotspots() {
  clearInvestigateHotspots();
  const def = locationDefs[ExplorationState.getCurrentLocationId()];
  const hotspots = (!locCanvasW || !locCanvasH) ? [] : ((def && def.investigateHotspots) || []).filter(h => ExplorationState.getInteractionState(h.interactionId) !== 'locked');
  hotspots.forEach(h => {
    const btn = document.createElement('button');
    btn.className = 'investigate-hotspot';
    if (h.x1 !== undefined) {
      // 영역(사각형) 핫스팟 — x1/y1/x2/y2는 %, 정규화 안 돼 있어도(x1>x2 등)
      // Math.min/max로 항상 올바른 좌상단 기준 박스가 되게 한다.
      btn.classList.add('is-rect');
      const left = (Math.min(h.x1, h.x2) / 100) * locCanvasW;
      const top = (Math.min(h.y1, h.y2) / 100) * locCanvasH;
      const width = (Math.abs(h.x2 - h.x1) / 100) * locCanvasW;
      const height = (Math.abs(h.y2 - h.y1) / 100) * locCanvasH;
      btn.style.left = left + 'px';
      btn.style.top = top + 'px';
      btn.style.width = width + 'px';
      btn.style.height = height + 'px';
    } else {
      // 레거시 점(x,y) 핫스팟 — 40px 원형 탭존 그대로 유지(기존 w2-adrian-spot 등).
      btn.style.left = ((h.x / 100) * locCanvasW) + 'px';
      btn.style.top = ((h.y / 100) * locCanvasH) + 'px';
    }
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      playInvestigateHotspot(h.interactionId);
    });
    el.locCanvas.appendChild(btn);
  });
  el.investigateHint.textContent = hotspots.length ? '화면을 둘러보며 눌러보세요.' : '';
}

// 조사하기 중 핫스팟 하나를 탭했을 때 — playInteraction과 달리 investigate
// 모드/줌 위치/마커를 그대로 둔다(§신규). 예전엔 탭하자마자 조사하기가
// 꺼지고 화면이 기본 프레임으로 재배치됐는데, 그러면 핫스팟 하나 볼 때마다
// 다시 조사하기를 켜야 해서 여러 개를 연달아 둘러보기 불편했다. 배경은
// 그대로 둔 채 대사창(bottom-bar)만 그 위에 잠깐 나타났다 사라진다 —
// scene/minigame 타입 핫스팟은 어차피 화면을 완전히 떠나므로(페이지 이동/
// 인라인 씬 재생) 기존 playInteraction에 그대로 위임한다.
function playInvestigateHotspot(interactionId) {
  const def = interactionDefs[interactionId];
  if (!def) return;
  if (def.type !== 'topic') { playInteraction(interactionId); return; }
  el.bottomBar.classList.remove('hidden');
  playInteractionLines(def.lines || [], () => {
    ExplorationState.completeInteraction(interactionId);
    (def.effects || []).forEach(applyLocalEffect);
    el.bottomBar.classList.add('hidden');
  });
}
function setInvestigateMode(on) {
  investigateMode = on;
  el.investigateBtn.classList.toggle('active', on);
  el.investigateHint.classList.toggle('show', on);
  // 조사하기 중엔 하단 메뉴(bottom-bar)를 통째로 치워 배경을 스와이프/줌으로
  // 온전히 볼 수 있게 한다 — 그 안의 조사하기 토글도 같이 사라지므로, 대신
  // 뜨는 investigateCloseBtn으로 끌 수 있다.
  el.bottomBar.classList.toggle('hidden', on);
  el.investigateCloseBtn.classList.toggle('hidden', !on);
  // 캐릭터가 배경 위에 서 있으면 핫스팟을 가리고 몰입도 깨므로, 조사하기 중엔
  // 잠깐 숨겼다가 끌 때 다시 페이드인시킨다.
  el.locCharStage.classList.toggle('show', !on && !!currentCharacterId);
  if (on) {
    renderInvestigateHotspots();
  } else {
    clearInvestigateHotspots();
    if (locCanvasW) fitLocStage(); // 화면 이동 잠금으로 돌아갈 때 팬/줌 위치도 기본 프레임으로 리셋
  }
}
el.investigateBtn.addEventListener('click', () => setInvestigateMode(!investigateMode));
el.investigateCloseBtn.addEventListener('click', () => setInvestigateMode(false));

// Lightweight single-line reaction (증거 제시/인물에 대해 묻기의 기본 반응처럼
// 대화 재생기까지 띄울 필요는 없는 짧은 피드백) — the dialogue layer with a
// single narration line, tap to dismiss.
function showToastLine(characterId, text) {
  playInteractionLines([{ speaker: '', text, characterId: null }], () => {});
}

/* ===== Dialogue playback (spec §7.3/§7.4 — reuses vnPlayer.js) =====
   대사에 등장하는 인물 그림은 대기 상태와 같은 loc-char-stage를 그대로 쓴다
   (별도의 대화용 캐릭터 레이어를 두지 않음) — 그래서 대화가 시작돼도 인물이
   커지거나 자리가 튀지 않고, 그 인물의 위치(resolveCharPos)도 대기 때와
   똑같이 적용된다.

   locCharStageToken(setLocCharStage 선언부, §651)을 그대로 재사용한다 —
   이 함수도 같은 el.locCharStageImg를 쓰는 만큼 같은 토큰 카운터를 공유해야,
   대화가 끝나 대기 화면으로 돌아가며 setLocCharStage가 호출된 뒤에도 아직
   안 끝난 이전 대사 줄의 비동기 이미지 조회가 나중에 도착해 화면을 덮어쓰는
   일이 없다(§신규 수정 — 두 함수가 토큰을 따로 썼을 때 "대화는 지수인데
   사진은 영우로 나온다"는 증상으로 재현됨: 서로의 요청을 무효화하지
   못해 느린 쪽이 이기는 경쟁 상태였다). */
async function applyDialogueCharacter(characterId, expression) {
  const requestToken = ++locCharStageToken;
  if (!characterId) { el.locCharStage.classList.remove('show'); return; }
  const assetId = await Promise.resolve(DevGameState.getCharacterAssetId(characterId, expression)).catch(() => null);
  const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
  if (requestToken !== locCharStageToken) return;
  applyCharPosOffset(await resolveCharPos(ExplorationState.getCurrentLocationId(), characterId));
  refreshCharPosEditorUI();
  if (asset && asset.dataUrl) { el.locCharStageImg.src = asset.dataUrl; el.locCharStage.classList.add('show'); }
  else { el.locCharStageImg.removeAttribute('src'); el.locCharStage.classList.remove('show'); }
}

function playInteraction(interactionId) {
  const def = interactionDefs[interactionId];
  if (!def) return;
  // type:'scene' (심문 씬 허브 인라인 재생, §신규) — def.sceneId가 가리키는
  // dev/dialogueData.js의 기존 씬(라운드·선택지·가설·미니게임 임베드 그대로)을
  // 페이지 이동 없이 이 허브 안에서 재생한다. see playSceneInline below.
  if (def.type === 'scene' && def.sceneId) {
    playSceneInline(def.sceneId, interactionId);
    return;
  }
  if (def.type === 'minigame' && def.route) {
    // Same hand-off contract routeOnEnter locations use — the minigame's own
    // "계속하기" reads this to come straight back to this exact hub spot.
    ExplorationState.completeInteraction(interactionId);
    sessionStorage.setItem('mkShopReturnUrl', `/play/explore/?phase=${encodeURIComponent(ExplorationState.getCurrentPhase())}&location=${encodeURIComponent(ExplorationState.getCurrentLocationId())}`);
    location.href = def.route;
    return;
  }
  playInteractionLines(def.lines || [], () => {
    ExplorationState.completeInteraction(interactionId);
    (def.effects || []).forEach(applyLocalEffect);
    renderLocation();
  });
}

// Small effect vocabulary — deliberately narrower than game/index.html's
// applyEffect (this hub content only ever needs setFlag/addFact/addEvidence/
// addQuestion so far); extend in lockstep with what interactionDefs.js
// actually authors.
function applyLocalEffect(effect) {
  if (effect.type === 'setFlag') CaseFileState.setFlag(effect.key, effect.value);
  else if (effect.type === 'addFact') { if (CaseFileState.addFact(effect.fact)) ExplorationState.refreshInteractionsByFact(effect.fact.id); }
  else if (effect.type === 'addEvidence') { if (CaseFileState.addEvidence(effect.evidence)) caseMenu.notifyEvidence(effect.evidence); }
  else if (effect.type === 'addQuestion') CaseFileState.addQuestion(effect.question);
}

// One persistent click listener delegating to whichever player is currently
// loaded — playInteractionLines can be called many times in a session (every
// topic/observe/toast line), and re-adding a fresh listener on the shared
// dlgPanel each time would stack up duplicate handlers, making later taps
// advance multiple players' worth of state at once. Bound on locationView
// (not just dlgPanel) so tapping the background/character behind the dialogue
// box also advances it, same as play/game's own VN screen — choice/evidence
// buttons already call stopPropagation() on their own click handlers, so
// they never reach here and double-advance.
let currentDialoguePlayer = null;
el.locationView.addEventListener('click', () => {
  if (!currentDialoguePlayer || el.dlgPanel.classList.contains('hidden')) return;
  currentDialoguePlayer.tap();
});

// 대화하기가 실제 대사를 재생할 때, 화면에 새 팝업을 띄우는 대신 하단
// bottom-bar 자신의 내용을 조사/대화/이동/제시 그리드(#hubPanel)에서 대사창
// (#dlgPanel)으로 바꿔친다 — 같은 박스가 그대로 유지되므로 "팝업이 떴다"가
// 아니라 "이 판이 대화창으로 바뀌었다"로 보인다(setDialogueMode). 그 "같은
// 박스" 약속을 지키려면 실제 세로 크기도 같아야 한다 — dlg-text에 따로
// min-height를 주면 짧은 대사 한 줄에도 대화창이 hub-panel보다 훌쩍 커져,
// 그 아래로 가려지는 배경 사진의 노출 범위가 달라져 버린다("탐색허브랑
// 대화 중 배경 위치가 달라 보인다"). 대신 대화 시작 직전(hub-panel이 아직
// 보이는 마지막 순간) 그 실측 높이를 bottom-bar의 min-height로 고정해
// dlg-panel이 얼마나 짧든 그 이하로 줄어들지 않게 한다 — 사진 노출 범위가
// hub 화면과 그대로 맞아떨어진다. 대사가 그보다 길면 자연스럽게 더
// 커지는 것까지는 막지 않는다(기존 has-interactive의 max-height 캡과 별개).
function setDialogueMode(on) {
  // bottomBar's own height (not hubPanel's) — hubPanel's content-box height
  // alone is missing bottomBar's own padding, which under-measured the
  // target by ~30px and left dlg-panel *shorter* than hub-panel instead of
  // matching it.
  if (on) el.bottomBar.style.minHeight = el.bottomBar.getBoundingClientRect().height + 'px';
  else el.bottomBar.style.minHeight = '';
  el.hubPanel.classList.toggle('hidden', on);
  el.dlgPanel.classList.toggle('hidden', !on);
  el.interrogateBtn.classList.toggle('hidden', on || !getInterrogationInteraction(currentCharacterId));
}

function playInteractionLines(lines, onComplete) {
  setDialogueMode(true);
  currentDialoguePlayer = createVNPlayer({
    pageFit: { textEl: el.dlgText },
    onLineChange: (line) => { el.dlgName.textContent = line.speaker || ''; applyDialogueCharacter(line.characterId, line.expression); },
    onTextUpdate: (text) => { el.dlgText.textContent = text; },
    onArrow: (show) => el.dlgArrow.classList.toggle('show', show),
    onComplete: () => {
      setDialogueMode(false);
      currentDialoguePlayer = null;
      setLocCharStage(currentCharacterId);
      onComplete();
    },
  });
  currentDialoguePlayer.load(lines);
}

// Every routed page this hub hands off to (shop/wardrobe, and the save-slot
// hub sentinel below) needs the *live* location/phase, never location.search
// — this is a single-page app that never touches the address bar after
// boot, so location.search is permanently stuck on whatever ?phase=/&location=
// the player originally deep-linked in with (same class of bug fixed in
// moveTo()'s routeOnEnter handling above).
function currentHubUrl() {
  return `/play/explore/?phase=${encodeURIComponent(ExplorationState.getCurrentPhase() || '')}&location=${encodeURIComponent(ExplorationState.getCurrentLocationId() || '')}`;
}

/* =====================================================================
   심문 씬 인라인 재생 (§신규) — 예전엔 심문하기가 play/game/index.html로
   완전히 이동해서 그 씬(week2-scene-006 등)을 재생했지만, 이제 같은 씬
   데이터(dev/dialogueData.js, 손대지 않음)를 이 허브의 하단 패널 위에서
   그대로 재생한다. 아래 evaluateCondition/applyEffect는 play/game/index.html
   것과 같은 로직의 사본이다 — 심문 씬이 선택지 condition과 setHypothesis/
   addFact 같은 §6/§7 추론 이펙트를 실제로 쓰므로, 허브의 기존 좁은
   applyLocalEffect(setFlag/addFact/addEvidence/addQuestion만 지원)로는
   부족하다. 두 파일이 갈라질 위험은 있지만 vnPlayer.js 엔진 자체는 이미
   공유되고 있고, 씬 재생 UI(선택지/증거 제시)를 공유 모듈로 통째로 뽑는 건
   더 큰 리팩터라 이번 1차 구현 범위 밖으로 남겨둔다.
   ===================================================================== */

// 2주차 장편 확장 v2 §22 — a choice's optional `condition` gates whether
// it's even offered. Mirrors play/game/index.html's evaluateCondition exactly.
function evaluateCondition(cond) {
  if (!cond) return true;
  if (cond.hasEvidence) {
    const ids = new Set(CaseFileState.getEvidence().map(e => e.id));
    if (!cond.hasEvidence.every(id => ids.has(id))) return false;
  }
  if (cond.flags && !cond.flags.every(f => CaseFileState.hasFlag(f))) return false;
  if (cond.flagAtLeast && !((Number(CaseFileState.getFlag(cond.flagAtLeast.key)) || 0) >= cond.flagAtLeast.min)) return false;
  if (cond.flagBelow && !((Number(CaseFileState.getFlag(cond.flagBelow.key)) || 0) < cond.flagBelow.lessThan)) return false;
  if (cond.flagEquals && CaseFileState.getFlag(cond.flagEquals.key) !== cond.flagEquals.value) return false;
  if (cond.personStatus) {
    const persons = CaseFileState.getPersons();
    for (const personId in cond.personStatus) {
      const p = persons.find(p => p.id === personId);
      if (!p || p.status !== cond.personStatus[personId]) return false;
    }
  }
  return true;
}

// A scene author's `effects` array is the same host-defined vocabulary
// play/game/index.html's applyEffect understands — an interrogation scene
// played inline here needs the full switch (setHypothesis/addFact/
// addPerson/...), not just the hub's narrow applyLocalEffect.
let activeInlineSceneId = null;
function applyInlineSceneEffect(effect) {
  switch (effect.type) {
    case 'addEvidence':
      if (CaseFileState.addEvidence(effect.evidence)) caseMenu.notifyEvidence(effect.evidence);
      break;
    // [탐색허브 재도입] week2-scene-010b(레오 재접근)처럼 이제 허브 안에서
    // 인라인 재생되는 씬도 "증거 갱신" 내레이션 비트를 쓴다 — play/game/
    // index.html의 같은 case와 동일하게 맞춘다.
    case 'updateEvidence':
      CaseFileState.updateEvidence(effect.id, { summary: effect.summary, status: effect.status });
      break;
    case 'addQuestion': {
      const added = CaseFileState.addQuestion(effect.question);
      if (added) caseMenu.notifyNewQuestion(effect.question.title);
      break;
    }
    case 'setQuestionStatus':
      CaseFileState.setQuestionStatus(effect.id, effect.status, effect.resolutionText);
      break;
    case 'addPerson':
      CaseFileState.addPerson(effect.person);
      break;
    case 'setPersonStatus':
      CaseFileState.setPersonStatus(effect.id, effect.status, effect.patch);
      break;
    case 'addInventoryItem':
      CaseFileState.addInventoryItem(effect.id);
      break;
    case 'unlockMapLocation':
      CaseFileState.unlockMapLocation(effect.id);
      break;
    case 'setFlag':
      CaseFileState.setFlag(effect.key, effect.value);
      break;
    case 'incrementFlag':
      CaseFileState.incrementFlag(effect.key);
      break;
    case 'setHypothesis':
      CaseFileState.setHypothesis(effect.questionId, effect.hypothesis);
      caseMenu.notifyHypothesis(effect.hypothesis.text);
      break;
    case 'addFact': {
      const added = CaseFileState.addFact(effect.fact);
      if (added) caseMenu.notifyFact(effect.fact.title);
      break;
    }
    case 'invalidateHypothesis':
      CaseFileState.invalidateCurrentHypothesis(effect.questionId, effect.factId);
      break;
    case 'setFlagIfAll':
      if (effect.flags.every(f => CaseFileState.hasFlag(f))) CaseFileState.setFlag(effect.key, true);
      break;
    case 'addPoints': {
      const meta = { source: effect.source || effect.rewardId || activeInlineSceneId };
      let paid;
      if (effect.policy === 'chapter_capped') {
        paid = EconomyState.claimChapterCappedReward(effect.chapterId || activeInlineSceneId, effect.sourceType || effect.rewardId || 'reward', effect.amount, effect.weeklyCap || effect.amount, meta);
      } else if (effect.rewardId) {
        paid = EconomyState.claimReward(effect.rewardId, effect.amount, meta);
      } else {
        EconomyState.addPoints(effect.amount, meta);
        paid = effect.amount;
      }
      if (paid > 0) {
        CaseFileState.setFlag('pointsUiIntroduced', true);
        caseMenu.notifyPoints(paid);
      }
      updatePointBalance();
      break;
    }
    case 'spendPoints':
      EconomyState.spendPoints(effect.amount, { source: effect.source || activeInlineSceneId });
      updatePointBalance();
      break;

    // [탐색허브 재도입] 여행 만족도 / 영우 호감도 — 연출용 게이지(§
    // relationshipState.js). 수사 로직·엔딩 분기는 절대 이 값을 읽지 않는다.
    // play/game/index.html의 applyEffect와 같은 case.
    case 'addSatisfaction':
      RelationshipState.addSatisfaction(effect.amount);
      if (effect.amount) caseMenu.notifySatisfaction(effect.amount);
      updateRelationshipGauges();
      break;
    case 'addAffection':
      RelationshipState.addAffection(effect.amount);
      if (effect.amount) caseMenu.notifyAffection(effect.amount);
      updateRelationshipGauges();
      break;

    // 2주차 라이프 게이지(§ lifeGaugeState.js) — 심문 선택지 오답의
    // effects에 넣어 쓴다(경중은 severity). 허브의 자유 '제시하기'
    // (presentEvidenceToCharacter)는 설계상 이 이펙트를 절대 쓰지 않는다.
    case 'damageLife':
      applyLifeDamage(effect.severity);
      break;
    case 'unlockShop':
      ShopState.unlockShop();
      updatePointBalance();
      break;
    case 'unlockShopItem':
      ShopState.unlockShopItem(effect.itemId);
      break;
    case 'unlockShopItems':
      ShopState.unlockShopItems(effect.itemIds);
      break;
    case 'unlockWardrobe':
      WardrobeState.unlockWardrobe();
      break;
    case 'purchaseOutfit':
      ShopState.purchaseShopItem(effect.itemId);
      updatePointBalance();
      break;
    case 'equipOutfit':
      WardrobeState.equipOutfit(effect.itemId);
      break;
    case 'enterExplorationPhase':
      ExplorationState.enterExplorationPhase(effect.phaseId, effect.startLocationId);
      break;
    case 'unlockLocation':
      ExplorationState.unlockLocation(effect.locationId);
      break;
    case 'moveToLocation':
      ExplorationState.moveToLocation(effect.locationId);
      break;
    case 'setInteractionState':
      ExplorationState.setInteractionState(effect.interactionId, effect.state);
      break;
    case 'refreshInteraction':
      ExplorationState.refreshInteractionsByFact(effect.factId);
      break;
    // Ends the current inline scene and lands back on the hub in place
    // (mirrors onInlineSceneComplete's own no-nextSceneId branch) — every
    // scene using this effect now plays inline (playSceneInline) on this
    // same page, so a full location.href reload just to come straight back
    // to where we already are would reintroduce the reload flash inline
    // playback exists to avoid. (play/game/index.html keeps its own
    // navigating version of this case for scenes that still play there.)
    case 'returnToExploration':
      if (effect.phaseId && effect.phaseId !== ExplorationState.getCurrentPhase()) {
        ExplorationState.enterExplorationPhase(effect.phaseId, effect.locationId);
      } else if (effect.locationId) {
        ExplorationState.unlockLocation(effect.locationId);
        ExplorationState.moveToLocation(effect.locationId);
      }
      currentDialoguePlayer = null;
      activeInlineSceneId = null;
      clearInteractiveLayers();
      setDialogueMode(false);
      setLocCharStage(currentCharacterId);
      renderLocation();
      showView('location');
      break;
  }
}

function clearInteractiveLayers() {
  el.dlgPanel.classList.remove('has-interactive');
  el.choiceLayer.classList.add('hidden');
  el.choiceLayer.innerHTML = '';
  el.sceneDim.classList.remove('show');
  el.dlgText.classList.remove('is-question');
  el.evidenceCta.classList.add('hidden');
}

// .choice-layer's `bottom` has to match bottom-bar's actual rendered height
// (not a fixed vh guess) — while in dialogue mode that's just dlg-panel's
// height, which varies with its text — so the choice area (top:0 to this
// bottom) is exactly "area A" and the centered button stack's vertical
// center lands on A's real center. Same reasoning as play/game/index.html's
// syncChoiceLayerBottom.
function syncChoiceLayerBottom() {
  el.choiceLayer.style.bottom = el.bottomBar.offsetHeight + 'px';
}
window.addEventListener('resize', () => {
  if (!el.choiceLayer.classList.contains('hidden')) syncChoiceLayerBottom();
});

function showChoices(allChoices) {
  const choices = allChoices.filter(c => evaluateCondition(c.condition));
  el.choiceLayer.innerHTML = '';
  choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.style.animationDelay = (i * 260) + 'ms';
    btn.textContent = choice.label;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      clearInteractiveLayers();
      currentDialoguePlayer.choose(choice.id);
    });
    el.choiceLayer.appendChild(btn);
  });
  syncChoiceLayerBottom();
  el.choiceLayer.classList.remove('hidden');
  el.sceneDim.classList.add('show');
  el.dlgText.classList.add('is-question');
}

let evidenceToastTimer = null;
function showEvidenceToast(text, correct) {
  el.evidenceToast.textContent = text;
  el.evidenceToast.classList.toggle('correct', correct);
  el.evidenceToast.classList.toggle('wrong', !correct);
  el.evidenceToast.classList.add('show');

  evidenceToastTimer = setTimeout(() => el.evidenceToast.classList.remove('show'), 1800);

// A finished interrogation scene's nextSceneId (see dev/dialogueData.js)
// almost always resolves through MINIGAME_ROUTES (dev/data/sceneRoutes.js)
// back to this same hub (e.g. a suspect-interview-return virtual id ->
// a hub-plaza location) — those cases move in place instead of a full page
// reload, since we never actually left the hub. A route to a real
// standalone page (e.g. the timeline minigame) still navigates away, same
// hand-off contract playInteraction's type:'minigame' branch already uses.
//
// [2주차 v4 재설계] week2Scenes는 더 이상 이 허브로 진입/복귀하지 않는다 —
// 위 예시는 다른 주차/향후 허브 사용을 위해 남겨둔 일반 설명이다.
function onInlineSceneComplete(sceneData) {
  currentDialoguePlayer = null;
  activeInlineSceneId = null;
  clearInteractiveLayers();
  const nextSceneId = sceneData.nextSceneId;
  if (!nextSceneId) {
    setDialogueMode(false);
    setLocCharStage(currentCharacterId);
    renderLocation();
    return;
  }
  const route = MINIGAME_ROUTES[nextSceneId];
  if (route && route.indexOf('/play/explore/') === 0) {
    const target = new URL(route, location.origin).searchParams;
    const targetPhase = target.get('phase');
    const targetLocation = target.get('location');
    setDialogueMode(false);
    if (targetPhase && targetPhase !== ExplorationState.getCurrentPhase()) {
      ExplorationState.enterExplorationPhase(targetPhase, targetLocation);
      renderLocation();
      showView('location');
    } else if (targetLocation) {
      moveTo(targetLocation);
    } else {
      renderLocation();
      showView('location');
    }
    return;
  }
  if (route) {
    sessionStorage.setItem('mkShopReturnUrl', currentHubUrl());
    location.href = route;
    return;
  }
  if (allScenes.some(s => s.id === nextSceneId)) {
    // A nextSceneId chaining into another plain VN scene has no inline
    // player of its own here — falls back to the standalone scene page,
    // same as before this scene had an inline mode at all.
    location.href = `/play/game/?scene=${encodeURIComponent(nextSceneId)}`;
    return;
  }
  setDialogueMode(false);
  renderLocation();
}

// Plays an existing dev/dialogueData.js scene (rounds/choices/evidence
// prompts/hypothesis effects, all untouched) inline inside this hub's
// dlg-panel instead of navigating to play/game/index.html — see
// interactionDefs.js's isInterrogation entries (type:'scene'/sceneId).
// sceneIdOrData is either a dialogueData.js scene id (string, looked up via
// allScenes) or an already-resolved { id, lines } object — a
// type:'phaseIntro' interactionDefs entry (see performMove) has no
// dialogueData.js scene of its own and no nextSceneId to chain into, so it's
// passed straight through; onInlineSceneComplete's own no-nextSceneId branch
// already does exactly what a phase intro needs (close dialogue, show hub).
// interactionId is optional — only meaningful when it differs from
// sceneData.id (nothing currently needs that, but keeps the two concerns
// separate).
function playSceneInline(sceneIdOrData, interactionId) {
  const sceneData = typeof sceneIdOrData === 'string' ? allScenes.find(s => s.id === sceneIdOrData) : sceneIdOrData;
  if (!sceneData) { console.error('[탐색허브] 알 수 없는 씬', sceneIdOrData); return; }
  // Matches the old type:'minigame' hand-off's timing exactly (completed
  // the moment the interaction launches, not once the scene finishes) so
  // interaction-state tracking behaves the same as before.
  if (interactionId) ExplorationState.completeInteraction(interactionId);
  activeInlineSceneId = sceneData.id;
  const lines = sceneData.lines.map(l => Object.assign({}, l));
  setDialogueMode(true);
  currentDialoguePlayer = createVNPlayer({
    pageFit: { textEl: el.dlgText },
    onLineChange: (line) => {
      // A choice's effects (onEffect below) can end the scene outright —
      // e.g. returnToExploration — before vnPlayer's own choose() finishes
      // resolving where the *next* line would have been. That leftover
      // showLine still fires this callback once more on its way out; without
      // this guard it would re-paint loc-char-stage with whatever character
      // was mid-line right as the hub view underneath becomes visible again.
      if (activeInlineSceneId !== sceneData.id) return;
      clearInteractiveLayers();
      el.dlgName.textContent = line.speaker || '';
      applyDialogueCharacter(line.characterId, line.expression);
    },
    onTextUpdate: (text) => { if (activeInlineSceneId === sceneData.id) el.dlgText.textContent = text; },
    onArrow: (show) => el.dlgArrow.classList.toggle('show', show),
    onEffect: (effects) => { (Array.isArray(effects) ? effects : [effects]).forEach(applyInlineSceneEffect); },
    onChoicePrompt: (choices) => showChoices(choices),
    onEvidencePrompt: () => showEvidenceCta(),
    onEvidenceResult: (correct, evidenceId, line) => {
      if (correct) {
        CaseFileState.markEvidenceReviewed(evidenceId);
        el.evidenceCta.classList.add('hidden');
        showEvidenceToast('✓ 제시했습니다.', true);
      } else {
        const attempt = CaseFileState.incrementFlag('wrong:' + line.id);
        const texts = Array.isArray(line.wrongText) ? line.wrongText : [line.wrongText || '그건 아닌 것 같아요...'];
        showEvidenceToast(texts[Math.min(attempt - 1, texts.length - 1)], false);
        // line.wrongSeverity('minor'|'major')는 opt-in — 심문 씬 저자가
        // 명시한 줄에만 라이프 게이지가 깎인다(§ play/game/index.html과 동일).
        if (line.wrongSeverity) applyLifeDamage(line.wrongSeverity);
      }
    },
    onSceneTransition: (transition) => applyLocationBackground(transition.backgroundKey),
    onComplete: () => onInlineSceneComplete(sceneData),
  });
  currentDialoguePlayer.load(lines);
}

    });

// Phase-wide preload (§신규, 확장판) — a phase's locations share one small
// pool of art (backgrounds, standing characters, dialogue portraits, the
// phase overview map), so warming all of it up front in one batched
// metadata fetch + parallel decodes (same AssetDB.preloadImage the per-week
// VN preloader already uses — see weekPreloader.js) means no hub action
// (이동하기/대화하기/제시하기) ever shows a bare flash while it fetches an
// image for the first time on tap. Originally this only warmed location
// backgrounds (preloadPhaseBackgrounds); characters/dialogue portraits/map
// were still lazy-loaded per button press, which is the stutter this
// broadens the preload to close. Runs exactly once per page load (the only
// caller is init(), below) — no session-persisted "already warmed" gate:
// that used to skip this on a later full navigation into the same phase,
// but the actual decoded bitmaps never survive a navigation either way, so
// skipping just left that later page's images genuinely un-warmed while
// believing otherwise (see AssetDB.preloadImage's own note on this).

// Wardrobe-aware variant of the plain getCharacterAssetId lookup below — a
// dev/dialogueData.js scene (unlike a topic-type interactionDefs entry) can
// have its lines resolve to an outfit-specific portrait via WardrobeState,
// so preloading only the bare characterId would leave the *actual* asset
// the scene shows still cold. Mirrors weekPreloader.js's own
// collectCharacterAssetIds exactly (same fallback-to-base-id reasoning).
async function addSceneCharacterAssetIds(ids, scene) {
  await Promise.all((scene.lines || []).map(async line => {
    if (!line.characterId) return;
    const expression = line.expression || 'neutral';
    let resolvedCharacterId = line.characterId;
    if (typeof WardrobeState !== 'undefined') {
      try {
        const resolution = WardrobeState.resolveOutfitForScene(line.characterId, {
          outfitMode: scene.outfitMode, storyOutfitId: scene.storyOutfitId,
        });
        if (resolution.hidden) return;
        if (resolution.characterId) resolvedCharacterId = resolution.characterId;
      } catch (e) { /* fall back to the base characterId below */ }
    }
    const outfitAssetId = await Promise.resolve(DevGameState.getCharacterAssetId(resolvedCharacterId, expression)).catch(() => null);
    if (outfitAssetId) ids.add(outfitAssetId);
    const baseAssetId = await Promise.resolve(DevGameState.getCharacterAssetId(line.characterId, expression)).catch(() => null);
    if (baseAssetId) ids.add(baseAssetId);
  }));
}

// Every character portrait a phase's hub content could show: each location's
// standing character(s) (loc-char-chip/loc-char-stage, 'neutral'), every
// expression a topic-type (or phaseIntro-type — same { lines } shape)
// interactionDefs entry's lines use (대화하기 / Phase 최초 진입 도입 대화),
// every portrait a type:'scene' interactionDefs entry's inline-played
// dialogueData scene uses (심문하기 등 — see playSceneInline), and every
// person already on file (제시하기's 인물 탭 isn't scoped to a location, it
// lists CaseFileState.getPersons() as-is).
async function collectPhaseCharacterAssetIds(phaseId, locationIds) {
  const ids = new Set();
  const charAssignmentOverrides = await AssetDB.getCharAssignments().catch(() => ({}));
  await Promise.all(locationIds.map(async id => {
    const chars = charAssignmentOverrides[id] || resolveByPhase(locationDefs[id].characters, phaseId) || [];
    await Promise.all(chars.map(async charId => {
      const assetId = await Promise.resolve(DevGameState.getCharacterAssetId(charId, 'neutral')).catch(() => null);
      if (assetId) ids.add(assetId);
    }));
  }));
  await Promise.all(Object.values(interactionDefs).map(async def => {
    if (!(def.phases || []).includes(phaseId)) return;
    await Promise.all((def.lines || []).map(async line => {
      if (!line.characterId) return;
      const assetId = await Promise.resolve(DevGameState.getCharacterAssetId(line.characterId, line.expression || 'neutral')).catch(() => null);
      if (assetId) ids.add(assetId);
    }));
    if (def.type === 'scene' && def.sceneId && typeof allScenes !== 'undefined') {
      const scene = allScenes.find(s => s.id === def.sceneId);
      if (scene) await addSceneCharacterAssetIds(ids, scene);
    }
  }));
  await Promise.all((typeof CaseFileState !== 'undefined' ? CaseFileState.getPersons() : []).map(async p => {
    const assetId = await Promise.resolve(DevGameState.getCharacterAssetId(p.id, 'neutral')).catch(() => null);
    if (assetId) ids.add(assetId);
  }));
  return [...ids];
}

async function preloadPhaseAssets(phaseId) {
  if (!phaseId) return;
  const locationIds = Object.keys(locationDefs).filter(id => (locationDefs[id].phases || []).includes(phaseId));
  if (!locationIds.length) return;
  LoadingOverlay.show('장소를 준비하는 중');
  try {
    const backgroundIds = (await Promise.all(locationIds.map(id => DevGameState.getBackgroundId(id).catch(() => null)))).filter(Boolean);
    const phaseMap = (typeof phaseMaps !== 'undefined') ? phaseMaps[phaseId] : null;
    const mapAssetId = phaseMap ? await DevGameState.getBackgroundId(phaseMap.id).catch(() => null) : null;
    // 이동하기 지도 시트가 열릴 때 처음으로 AssetDB.getMapPins()를 부르면 그
    // 자리에서 핀 좌표 JSON을 새로 받아오느라 지도가 한 박자 늦게 뜬다
    // (mapPinsCache는 세션스토리지가 아니라 페이지 인스턴스 수명인 메모리
    // 캐시라, 새 phase로 넘어오는 매 페이지 로드마다 다시 비어 있음) — 배경
    // 사진들과 함께 여기서 미리 데워 둔다.
    if (phaseMap) AssetDB.getMapPins().catch(() => {});
    const characterAssetIds = await collectPhaseCharacterAssetIds(phaseId, locationIds);
    const assetIds = [...new Set([...backgroundIds, ...(mapAssetId ? [mapAssetId] : []), ...characterAssetIds])];
    const assets = assetIds.length ? await AssetDB.getAssetsByIds(assetIds) : [];
    await Promise.all(assets.map(async (a) => {
      if (!a || !a.dataUrl) return;
      await AssetDB.preloadImage(a.dataUrl);
      paintWarm(a.dataUrl);
    }));
  } finally {
    LoadingOverlay.hide();
  }
}

/* ===== Boot ===== */
(async function init() {
  updatePointBalance();
  updateRelationshipGauges();
  const params = new URLSearchParams(location.search);
  const bootPhase = params.get('phase');
  const bootLocation = params.get('location');
  const phaseChanged = !!bootPhase && ExplorationState.getCurrentPhase() !== bootPhase;
  if (bootPhase) ExplorationState.enterExplorationPhase(bootPhase);
  updateLifeGauge();
  // dev/week2의 허브 칸 "⚙ 허브 설정" 버튼과 같은 목적지(§'/dev/hub/?phase=')
  // — 지금 있는 phase 기준으로 바로 그 phase의 탐색허브 설정 화면으로 들어간다.
  el.settingsLink.href = `/dev/hub/?phase=${encodeURIComponent(ExplorationState.getCurrentPhase() || '')}`;
  const [gameSettings] = await Promise.all([
    AssetDB.getGameSettings().catch(() => AssetDB.DEFAULT_GAME_SETTINGS),
    preloadPhaseAssets(ExplorationState.getCurrentPhase()),
  ]);
  applyMoveFadeSettings(gameSettings);
  // The `|| phaseChanged` half of this guard matters as soon as there's more
  // than one phase in play: a returning player already has *some*
  // currentLocationId left over from an earlier phase (e.g. still parked at
  // a Phase 1 tourism spot), so the original "only if nothing set yet" check
  // silently no-oped every phase handoff (week2-scene-005b -> 탐문 허브,
  // week2-scene-010 -> 재검증 허브, ...) past the very first one — it just
  // re-rendered the stale old location instead of moving into the new phase.
  // Only ever hit in real continuous play, not the fresh-profile Playwright
  // runs used to test each phase in isolation, which is how it went unnoticed.
  if (bootLocation && (phaseChanged || !ExplorationState.getCurrentLocationId())) {
    moveTo(bootLocation); // handles firstVisitFlag/unlock/render/routeOnEnter itself
    return;
  }
  if (ExplorationState.getCurrentLocationId()) {
    renderLocation();
    showView('location');
  } else {
    renderMap();
    showView('map');
  }
})();
</script>
