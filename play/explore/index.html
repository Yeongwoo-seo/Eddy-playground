<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MISSING KEY · 탐색</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/play/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}
.frame{position:relative;width:100%;max-width:430px;height:100dvh;height:100vh;height:var(--vh100,100vh);overflow:hidden;background:#0d1114;display:flex;flex-direction:column}

/* ===== Shared top bar ===== */
.topbar{position:absolute;top:0;left:0;right:0;z-index:6;padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px;display:flex;justify-content:space-between;align-items:center}
.vn-btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#fff;background:rgba(8,10,12,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.point-balance{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--amber);background:rgba(214,168,75,.14);border:1px solid rgba(214,168,75,.4);border-radius:20px;padding:8px 12px}
.point-balance.hidden{display:none}
.topbar-left{display:flex;gap:8px;align-items:center}
#caseMenuMount{display:flex}
/* 증거노트 배지 — play/game/index.html의 evnBadgeBtn과 같은 스타일. 탐색허브는
   2주차부터만 쓰이는 화면이라(§week1은 이 페이지에 오지 않음) 항상 노출한다. */
.evn-badge-btn{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--amber);background:rgba(214,168,75,.14);border:1px solid rgba(214,168,75,.4);border-radius:20px;padding:9px 14px;min-height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.evn-badge-btn:active{opacity:.8}

/* ===== MAP VIEW (spec §7.2) ===== */
.map-view{position:absolute;inset:0;overflow-y:auto;padding:calc(80px + env(safe-area-inset-top,0)) 16px calc(24px + env(safe-area-inset-bottom,0));display:none}
.map-view.active{display:block}
.map-title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:14px}
.loc-card{position:relative;background:var(--surface-1);border:1px solid var(--divider);border-radius:16px;padding:16px 18px;margin-bottom:12px;cursor:pointer}
.loc-card.locked{opacity:.45}
.loc-card.current{border-color:rgba(89,184,200,.5)}
.loc-name{font-size:15px;font-weight:700}
.loc-meta{font-size:12px;color:var(--text-secondary);margin-top:6px;line-height:1.5}
.loc-badge{position:absolute;top:14px;right:16px;font-family:var(--mono);font-size:10.5px;font-weight:700;color:#06181c;background:var(--cyan);border-radius:10px;padding:3px 8px}
.loc-current-tag{font-family:var(--mono);font-size:10px;color:var(--cyan);margin-top:6px}

/* ===== 여행 만족도 / 영우 호감도 게이지 — play/game/index.html의
   .relation-gauges와 동일(§ relationshipState.js). 상시 표시, 연출용(스토리/
   엔딩에 관여하지 않음). 허브에서 인라인 재생되는 심문 씬도 게임 페이지와
   같은 addSatisfaction/addAffection 이펙트를 쓸 수 있으므로[탐색허브 재도입],
   허브를 벗어나도 값이 끊기지 않게 이 페이지에도 둔다. */
.relation-gauges{position:absolute;top:calc(58px + env(safe-area-inset-top,0));right:16px;z-index:6;display:flex;gap:10px;background:transparent}
.relation-gauges.hidden{display:none}
.gauge-pill{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent}
.gauge-icon{font-size:12px;line-height:1}
.gauge-track{width:6px;height:64px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.gauge-fill{width:100%;border-radius:3px;transition:height .3s cubic-bezier(.2,.8,.2,1)}
.gauge-fill.satisfaction{background:var(--cyan)}
.gauge-fill.affection{background:#E8749E}

/* ===== 2주차 라이프 게이지 — 심문 중 증거 오답 제시/선택지 오답 시 경중에
   따라 깎이는 판정용 게이지(§ lifeGaugeState.js). 허브의 자유 '제시하기'는
   설계상(§8.2/§8.4, 오답도 페널티 없음) 이 게이지를 절대 건드리지 않는다 —
   씬 저자가 명시적으로 위험하다고 표시한 지점(line.wrongSeverity/
   choice effects의 damageLife)에서만 깎인다. .relation-gauges 바로 위에
   가로 막대로 얹는다 — play/game/index.html과 같은 우상단 세로 스택. */
.life-gauge{position:absolute;top:calc(12px + env(safe-area-inset-top,0));right:16px;z-index:6;display:flex;align-items:center;gap:6px}
.life-gauge.hidden{display:none}
.life-gauge-icon{font-size:12px;line-height:1}
.life-gauge-track{position:relative;width:84px;height:7px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden}
.life-gauge-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--signal-red);transition:width .35s cubic-bezier(.2,.8,.2,1),background-color .35s ease}
.life-gauge-flash{position:absolute;top:0;bottom:0;border-radius:4px;background:#fff;pointer-events:none}
.life-gauge-flash.hidden{display:none}
.life-gauge-flash.blinking{animation:lifeGaugeBlink .18s steps(1) infinite}
@keyframes lifeGaugeBlink{0%,100%{opacity:.9}50%{opacity:.2}}

.life-gameover-overlay{position:fixed;inset:0;z-index:23;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px}
.life-gameover-overlay.hidden{display:none}
.life-gameover-sheet{width:100%;max-width:340px;background:rgba(8,14,18,.97);border:1px solid rgba(217,65,65,.4);border-radius:20px;padding:28px 22px;text-align:center}
.life-gameover-icon{font-size:34px;margin-bottom:10px}
.life-gameover-title{font-size:18px;font-weight:800;color:#fff;margin-bottom:8px}
.life-gameover-desc{font-size:13px;color:rgba(255,255,255,.68);line-height:1.6;margin-bottom:20px}
.life-gameover-retry-btn{width:100%;padding:13px;border-radius:14px;border:none;background:var(--signal-red);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.life-gameover-retry-btn:active{opacity:.8}

/* ===== LOCATION VIEW (spec §7.1) ===== */
.location-view{position:absolute;inset:0;display:none;flex-direction:column}
.location-view.active{display:flex}
/* 배경 사진을 그냥 CSS background-image로 꽉 채우던 것 대신, 팬/핀치줌
   가능한 스테이지+캔버스로 바꿨다 — minigame-phone-search와 같은 방식(§패닝
   탐색 요청). 18:16처럼 세로 화면보다 가로로 넓게 만든 배경을 좌우로
   둘러볼 수 있게 하기 위함. 사진이 없을 때(placeholder)는 그냥 그라데이션만
   보여주고 팬/줌은 비활성. */
.loc-stage{position:absolute;inset:0;overflow:hidden;touch-action:none;background-color:#0d1114}
.loc-stage.placeholder{background-image:linear-gradient(160deg,#171c22 0%,#0d1114 60%,#080a0c 100%)}
.loc-canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.loc-canvas img{display:block;-webkit-user-drag:none;user-select:none}
.bottom-bar{position:relative;z-index:3;margin-top:auto;background:rgba(5,7,10,.86);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.1);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0));transition:transform .25s ease,opacity .25s ease}
.bottom-bar.hidden{transform:translateY(100%);opacity:0;pointer-events:none}
/* ===== 대화 패널 (§신규) — 대화하기가 실제 대사를 재생할 때, 화면 위에 새
   팝업 박스를 띄우는 대신 이 bottom-bar 자기 자신의 내용을 대사창으로
   바꿔친다: 조사/대화/이동/제시 그리드 등 평소 내용은 #hubPanel에 몰아넣고,
   대화 중엔 그걸 숨기고 옆에 있던 #dlgPanel을 보여주는 식(setDialogueMode).
   같은 박스(같은 배경/테두리/자리)가 그대로 유지되니 "팝업이 떴다"가 아니라
   "이 판이 대화창으로 바뀌었다"로 보인다. */
.hub-panel.hidden{display:none}
.dlg-panel.hidden{display:none}
.dlg-name{font-size:15px;font-weight:700;color:var(--cyan);margin-bottom:8px}
.dlg-name:empty{display:none}
.dlg-text{font-size:16px;line-height:1.65;color:#fff;white-space:pre-wrap;word-break:keep-all;cursor:pointer;transition:color .2s ease;max-height:34vh;overflow-y:auto}
.dlg-text.is-question{color:var(--cyan)}
.dlg-foot{display:flex;justify-content:flex-end;padding-top:6px}
.dlg-arrow{font-size:13px;color:var(--text-secondary);visibility:hidden}
@keyframes arrowBob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.dlg-arrow.show{visibility:visible;animation:arrowBob 1.1s ease-in-out infinite}
/* ===== 심문 씬 인라인 재생 (§신규) — 예전엔 심문하기가 play/game/index.html로
   완전히 페이지 이동했지만, 이제 그 씬의 선택지/증거 제시 기능을 하단
   dlg-panel 위에 그대로 얹어 허브를 벗어나지 않고 재생한다(playSceneInline).
   scene-dim/choice-layer/evidence-cta는 play/game/index.html의 같은 이름
   레이어와 동일한 배치·애니메이션(선택지 패널이 대사창 위 영역 한가운데,
   그 뒤 장면은 어둡게)을 그대로 따른다 — 두 플레이어를 같은 느낌으로 유지하기
   위함. .choice-layer의 bottom은 dlg-panel을 포함한 bottom-bar의 실제 렌더
   높이에 syncChoiceLayerBottom으로 맞춘다(play/game의 dlgLayer.offsetHeight와
   동일한 이유 — dlg-panel 높이가 텍스트에 따라 달라지므로 고정값을 쓸 수
   없다). */
.scene-dim{position:absolute;inset:0;z-index:2;background:rgba(0,0,0,.78);opacity:0;pointer-events:none;transition:opacity .25s ease}
.scene-dim.show{opacity:1}
.choice-layer{position:absolute;left:0;right:0;top:0;bottom:34vh;z-index:3;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px 20px;pointer-events:none;transform:translateY(48px)}
.choice-layer.hidden{display:none}
@keyframes choiceIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.choice-btn{pointer-events:auto;flex-shrink:0;background:rgba(8,10,12,.88);border:1px solid rgba(89,184,200,.5);color:var(--text-primary);border-radius:14px;padding:14px 16px;font-size:14.5px;font-weight:600;font-family:var(--sans);text-align:center;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35);opacity:0;animation:choiceIn 1.2s cubic-bezier(0.2,0.8,0.2,1) forwards}
.choice-btn:active{opacity:.7;background:rgba(89,184,200,.2)}
.evidence-cta{padding-top:10px;display:flex;gap:8px}
.evidence-cta.hidden{display:none}
.evidence-cta button{flex:1;font-family:var(--mono);font-size:12.5px;letter-spacing:.05em;color:#06181c;background:var(--cyan);border:none;border-radius:14px;padding:12px;font-weight:700;cursor:pointer}
.evidence-cta button:active{opacity:.8}
.evidence-cta .evidence-back-btn{background:var(--surface-2);color:var(--text-primary);border:1px solid var(--divider)}
.dlg-panel.has-interactive .dlg-text{max-height:30vh;overflow-y:auto}
.evidence-sheet-list{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow-y:auto;touch-action:pan-y;margin-bottom:14px}
.evidence-card{background:var(--surface-2);border:1px solid var(--divider);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font-family:inherit}
.evidence-card:active{opacity:.7}
.evidence-card .ec-code{font-family:var(--mono);font-size:10px;color:var(--cyan);letter-spacing:.06em}
.evidence-card .ec-title{font-size:14px;font-weight:700;color:var(--text-primary);margin-top:2px}
.evidence-empty{font-family:var(--mono);font-size:12px;color:var(--text-muted);text-align:center;padding:20px 0}
.evidence-toast{position:absolute;left:50%;bottom:26vh;transform:translateX(-50%) translateY(8px);z-index:21;background:rgba(8,10,12,.94);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 16px;font-size:13px;color:#fff;opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;max-width:80%;text-align:center}
.evidence-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.evidence-toast.wrong{border-color:rgba(217,65,65,.5);color:#ffb4b4}
.evidence-toast.correct{border-color:rgba(29,184,71,.5);color:#9EF0B0}
/* 심문하기 — bottom-bar(대화창) 바로 위에 떠 있는 버튼. 지금 선택된 인물에게
   심문 가능한 interactionDefs 항목(isInterrogation, see interactionDefs.js)이
   있을 때만 뜬다 — 대화 주제 목록에 묻히지 않고 바로 보이도록 별도로 뺐다
   (renderInterrogateBtn). bottom-bar가 position:relative라 top의 음수값으로
   그 위에 얹힌다 — bottom-bar 자체 높이(goal-line 길이 등)와 무관하게 항상
   같은 자리. */
.interrogate-fab{position:absolute;left:50%;top:-54px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:6px;background:var(--amber);color:#191206;border:none;border-radius:20px;padding:12px 22px;font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);white-space:nowrap}
.interrogate-fab:active{transform:translateX(-50%) scale(.96)}
.interrogate-fab.hidden{display:none}
.goal-line{font-size:13px;color:var(--text-secondary);line-height:1.5;margin-bottom:10px;word-break:keep-all}
.goal-line:empty{display:none;margin-bottom:0}
.goal-line b{color:var(--cyan)}

/* ===== Location-name toast (§신규) — 장소에 들어오면 그 이름을 하단 goal-
   line 대신 상단에 잠깐 떴다 사라지는 토스트로 보여준다(showLocationToast,
   renderLocation에서 호출). topbar 바로 아래, investigate-hint/char-pos-
   slider와 같은 상단 자리 관례를 따른다. */
.location-toast{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top,0));transform:translate(-50%,-6px);z-index:7;max-width:calc(100% - 32px);text-align:center;font-size:13px;font-weight:700;color:var(--text-primary);background:rgba(8,10,12,.75);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:9px 18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:0;transition:opacity .25s ease,transform .25s ease}
.location-toast.show{opacity:1;transform:translate(-50%,0)}
.enter-scene-btn{background:var(--amber);color:#191206;font-weight:700;text-align:center;border:none}
.enter-scene-btn.hidden{display:none}

/* ===== Hub action bar — 조사/대화/제시/이동, replaces the old map/케이스
   buttons. Plain 2x2 text-only grid (no icons/emoji, no raised FAB) — every
   action reads as an equal peer. ===== */
.hub-actions{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hub-act-btn{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px 6px;color:var(--text-primary);font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer}
.hub-act-btn:active{transform:scale(.97);background:#1c2530}

/* ===== Move (다크→라이트) transition — a cover while performMove() swaps
   the background/goal line underneath, so a mid-load frame never shows.
   The transition length/curve below is just the pre-DB fallback — init()
   overwrites el.moveFade.style.transition from AssetDB.getGameSettings()
   .moveFade (edited from /dev/settings/) once that loads, see
   applyMoveFadeSettings. Matches AssetDB.DEFAULT_GAME_SETTINGS.moveFade and
   the design system's own default transition (CLAUDE.md: "0.3s
   cubic-bezier(0.2, 0.8, 0.2, 1)").

   z-index 25 — above .sheet-overlay(20) so 이동하기 리스트/지도 시트가 열려
   있는 채로 탭해도 암전이 그 위를 그대로 덮는다(§신규 — 시트를 탭 즉시
   닫지 않고 암전이 화면을 다 덮은 뒤에 닫는다, moveTo 참고). ===== */
.move-fade{position:absolute;inset:0;z-index:25;background:#000;opacity:0;pointer-events:none;transition:opacity .3s cubic-bezier(0.2,0.8,0.2,1)}
.move-fade.show{opacity:1;pointer-events:auto}

/* ===== 조사하기 — toggles hotspot markers over the location's own loc-
   canvas instead of opening a second, duplicate pan/zoom stage: the
   background is already pannable/zoomable at all times (§263's ambient
   loc-stage above), so 조사하기 only needs to add the "here's what's
   actually tappable" layer on top of it. Hotspots come from locationDefs[id]
   .investigateHotspots (optional, in %, see that file) — either a point
   {x,y,interactionId,icon} (legacy, renders a fixed 40px circular tap
   zone) or an area {x1,y1,x2,y2,interactionId} (§신규, same rectangle
   shape as play/minigame-phone-search's room hotspots, renders sized to
   the box — see .investigate-hotspot.is-rect above and
   renderInvestigateHotspots below); a location with none defined still
   toggles investigate mode on
   (so the button always does *something*), it just shows the roam hint
   text instead of any marker. Markers are appended as children of
   #locCanvas so they inherit its pan/zoom transform for free. ===== */
.hub-act-btn.active{background:rgba(89,184,200,.22);border-color:rgba(89,184,200,.5)}
/* No visible marker — a plain invisible tap zone (§신규). 조사하기가 정확히
   어디를 찾아야 하는지 보여주지 않는 편이 실제 "둘러보다 발견한다"는
   느낌에 가깝다는 판단으로, 이전의 반짝이는 원형 아이콘 마커를 없앴다. */
.investigate-hotspot{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:transparent;border:none;cursor:pointer;padding:0}
/* 영역 지정(x1/y1/x2/y2) 핫스팟 — 핸드폰 찾기 미니게임(play/minigame-
   phone-search)의 사각형/폴리곤 판정 방식과 같은 스키마. locationDefs.js의
   investigateHotspots 항목이 점(x,y) 대신 사각형(x1,y1,x2,y2)이면 이
   .is-rect 변형을 쓴다 — 중앙 정렬 margin 없이 left/top/width/height를
   그대로 영역 크기로 채운다(§신규, /dev/upload 에디터 연결은 아직 없어
   지금은 좌표를 직접 채워 넣는다). */
.investigate-hotspot.is-rect{width:auto;height:auto;margin:0;border-radius:8px}
.investigate-hint{position:absolute;left:16px;right:16px;top:calc(96px + env(safe-area-inset-top,0));z-index:2;text-align:center;font-size:13px;color:var(--text-secondary);background:rgba(8,10,12,.65);border-radius:14px;padding:10px 14px;pointer-events:none;opacity:0;transition:opacity .2s ease}
.investigate-hint:empty{display:none}
.investigate-hint.show{opacity:1}
/* 조사하기가 켜지면 bottom-bar(하단 메뉴)를 통째로 치워 배경을 스와이프/줌으로
   온전히 볼 수 있게 한다 — 그 안에 있던 조사하기 토글 버튼도 같이 사라지므로,
   꺼서 원래 화면으로 돌아갈 별도의 떠 있는 버튼이 필요하다. */
.investigate-close-btn{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);z-index:3;font-family:var(--sans);font-size:13px;font-weight:700;color:var(--text-primary);background:rgba(8,10,12,.75);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:11px 22px;cursor:pointer}
.investigate-close-btn:active{background:#1c2530}
.investigate-close-btn.hidden{display:none}

/* ===== Location character chips — who's actually standing here, shown
   above the goal line so presence isn't hidden behind the 대화 sheet. A
   location can list more than one character (§신규); the first one is the
   default selection (currentCharacterId, see renderLocationCharacters) —
   except 영우, who only auto-picks on the phase's first location since he
   turns up almost everywhere. A chip switches which one 대화하기/증거 제시
   act on — see selectLocationCharacter. ===== */
.loc-characters{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto}
.loc-characters:empty{display:none;margin-bottom:0}
.loc-char-chip{flex-shrink:0;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:5px 12px 5px 5px;color:var(--text-primary);font-family:inherit;cursor:pointer}
.loc-char-chip:active{background:#1c2530}
.loc-char-chip.active{background:rgba(89,184,200,.18);border-color:rgba(89,184,200,.5)}
.loc-char-portrait{width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--surface-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-secondary)}
.loc-char-portrait img{width:100%;height:100%;object-fit:cover;object-position:top}
.loc-char-name{font-size:12.5px;font-weight:700}

/* ===== Character stage — the currently-selected (default: first) character
   stands over the location background, between loc-stage and the bottom
   bar. This one element is now shared by both the idle hub view *and*
   dialogue playback (playInteractionLines/applyDialogueCharacter just swap
   its image and re-apply that speaker's saved position) instead of a second
   dialogue-only copy, so a conversation starting never jumps or duplicates
   the standing character — see §대화 패널 note below on .bottom-bar for the
   matching change to the text side. Switching character (chip tap) fades the
   old one out before swapping the image and fading the new one in — see
   setLocCharStage — rather than a hard cut. */
.loc-char-stage{position:absolute;inset:0;z-index:1;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s ease}
.loc-char-stage.show{opacity:1}
.loc-char-stage img{max-height:74%;max-width:88%;object-fit:contain;object-position:bottom}

/* ===== DEV · 인물 위치 조정 모드 (§신규) — el.locCharStageImg를 직접
   드래그해 그 장소·인물의 charPositions override(AssetDB.setCharPos)를
   저장한다. 평소엔 .loc-char-stage 전체가 pointer-events:none이라 뒤의
   배경 팬/줌 제스처를 가리지 않는데, 이 모드일 땐 이미지에만 다시 켠다
   (touch-action:none으로 드래그 중 화면 스크롤/줌 제스처와 충돌 방지). */
.loc-char-stage.pos-edit img{pointer-events:auto;cursor:grab;touch-action:none;outline:2px dashed rgba(89,184,200,.6);outline-offset:4px}
.char-pos-editor{position:absolute;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0));z-index:6;background:rgba(8,10,12,.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 14px}
.char-pos-editor.hidden{display:none}
.char-pos-editor-title{font-size:12.5px;font-weight:700;color:var(--text-primary);margin-bottom:6px}
.char-pos-editor-coords{font-family:var(--mono);font-size:11px;color:var(--cyan);margin-bottom:10px}
.char-pos-editor-row{display:flex;gap:8px}
.char-pos-editor-row button{flex:1;font-family:inherit;font-size:12.5px;font-weight:700;border-radius:12px;padding:9px 8px;cursor:pointer}
.char-pos-editor-row .cpe-reset{background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--divider)}
.char-pos-editor-row .cpe-save{background:rgba(89,184,200,.18);color:var(--cyan);border:1px solid rgba(89,184,200,.5)}
.char-pos-editor-row .cpe-done{background:none;color:var(--text-muted);border:none}
.char-pos-editor-status{font-size:11px;color:var(--text-muted);margin-top:6px;min-height:14px}

/* ===== Bottom-sheet family (character menu / topic list / evidence / persons) ===== */
.sheet-overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet-overlay.hidden{display:none}
.sheet{width:100%;max-width:430px;background:var(--surface-1);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0));border-top:1px solid var(--divider);max-height:78vh;overflow-y:auto}

.sheet-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-title-row .sheet-title{margin-bottom:0}
.sheet-notebook-btn{font-family:var(--mono);font-size:11px;font-weight:700;color:#e9c467;background:rgba(214,168,75,.12);border:1px solid rgba(214,168,75,.4);border-radius:20px;padding:8px 12px;cursor:pointer;min-height:36px}
.sheet-notebook-btn:active{opacity:.8}

/* 이동하기 지도 시트만 슬라이드업으로 뜬다(showMoveMapSheet/hideMoveMapSheet) —
   .hidden(display:none)을 뗀 직후 바로 .show를 붙이면 브라우저가 두 스타일
   변화를 한 프레임에 묶어버려 트랜지션이 안 보이므로, 시작 상태(opacity:0 +
   시트 translateY(100%))가 먼저 한 번 페인트된 뒤에 .show를 붙여야 한다(더블
   rAF). 닫을 때는 반대로 .show를 먼저 떼 애니메이션을 재생시키고, 그 트랜지션
   길이(.3s)만큼 기다린 뒤에야 .hidden을 붙여 레이아웃에서 뺀다. */
#moveMapSheet{opacity:0;transition:opacity .3s cubic-bezier(0.2,0.8,0.2,1)}
#moveMapSheet .sheet{transform:translateY(100%);transition:transform .3s cubic-bezier(0.2,0.8,0.2,1);touch-action:pan-y}
#moveMapSheet.show{opacity:1}
#moveMapSheet.show .sheet{transform:translateY(0)}
/* 드래그 중엔 트랜지션을 끄고 손가락을 그대로 따라가야 하므로(§신규,
   setupMoveMapSheetDrag) 이 클래스가 붙어 있는 동안은 위 트랜지션을
   덮어쓴다 — 드래그가 끝나면(스냅백/닫기 모두) 다시 뗀다. */
#moveMapSheet .sheet.dragging{transition:none}

/* ===== 이동하기 지도 — phaseMaps(dev/data/locationDefs.js)가 정의된 phase는
   exit 목록을 리스트 대신 지도 그림 위 원형 핀으로 보여준다(openMoveMapSheet).
   loc-canvas처럼 픽셀 단위 팬/줌은 필요 없는 정적 오버뷰라, 고정 aspect-ratio
   박스에 %로 위치만 잡으면 된다 — 사진이 아직 배정 전이면 placeholder 그라데이션
   위에도 핀은 그대로 뜬다(좌표는 이미지가 아니라 박스 기준 %이므로). ===== */
.move-map-wrap{position:relative;width:100%;aspect-ratio:4/5;border-radius:16px;overflow:hidden;margin-bottom:12px;background-color:#171c22;background-image:linear-gradient(160deg,#171c22 0%,#0d1114 60%,#080a0c 100%);background-size:cover;background-position:center}
.move-map-pins{position:absolute;inset:0}
.move-pin{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid var(--amber);background:rgba(214,168,75,.3);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.move-pin::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--amber)}
.move-pin:active{transform:scale(.92)}
.move-pin.current{border-color:var(--cyan);background:rgba(89,184,200,.3);cursor:default}
.move-pin.current::after{background:var(--cyan)}
.move-pin-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;font-weight:700;margin-top:4px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.9)}
.move-map-listnote{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;margin:2px 0 8px}
.action-btn{width:100%;text-align:left;background:var(--surface-2);color:var(--text-primary);border:1px solid var(--divider);border-radius:12px;padding:14px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:8px}
.action-btn:active{background:#1c2530}
.action-btn.cancel{color:var(--text-muted);background:none;border:none;text-align:center;margin-top:4px}
.present-test-answer-btn{width:100%;text-align:center;background:rgba(214,168,75,.12);color:var(--amber);border:1px dashed rgba(214,168,75,.5);border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:700;font-family:var(--mono);cursor:pointer;margin-bottom:12px}
.present-notebook-btn{background:linear-gradient(135deg,#2a3552,#1a2338);border:1px solid rgba(216,169,61,.4);border-style:solid}
.present-test-answer-btn:active{background:rgba(214,168,75,.22)}
.topic-row{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface-2);border:1px solid var(--divider);border-radius:12px;padding:13px 14px;color:var(--text-primary);font-size:13.5px;cursor:pointer;text-align:left;font-family:inherit;margin-bottom:8px}
.topic-row[disabled]{opacity:.4;cursor:default}

.state-new{color:#06181c;background:var(--cyan)}

/* ===== Exploration hub (The Missing Key v1 §7) — a single page that swaps
   between map/location/sheet/dialogue "views" instead of separate routed
   pages, so hub state (current location, open sheet) stays trivially in
   sync without round-tripping through sessionStorage the way the shop
   hand-off does. Content is read entirely from locationDefs/interactionDefs
   + ExplorationState — this file has no hardcoded Week 2 knowledge beyond
   the initial ?phase=/&location= boot params. */

// ?phase=/&location= boot params are applied from init() at the bottom of
// this script (via moveTo(), not duplicated here) — moveTo needs `el` and
// renderLocation/showView to already exist, and reusing it (rather than
// calling ExplorationState directly) means a deep-linked boot location gets
// the exact same firstVisitFlag/routeOnEnter handling a normal in-hub move does.

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ===== 화면 밖 페인트 워밍 (낚시 미니게임 preloadFishIcons와 같은 기법) =====
// AssetDB.preloadImage(new Image().decode())는 디코드까지만 끝내둘 뿐이라,
// el.locImg/el.locCharStageImg/el.moveMapWrap처럼 실제로 화면에 그려지는
// 건 여전히 그 순간 처음 일어난다 — 그래서 preloadPhaseAssets로 미리
// 디코드해둬도 이동/대화 전환 때 살짝 밀리는 느낌이 남았다. 화면이
// 열리기 전에 실제 <img>로 화면 밖(-9999px)에 한 번 그려 페인트까지
// 끝내두면, 실제 전환은 이미 그려둔 같은 url을 그대로 옮기는 것뿐이라
// 즉시 뜬다.
function getPaintWarmHost() {
  let host = document.getElementById('paintWarmHost');
  if (!host) {
    host = document.createElement('div');
    host.id = 'paintWarmHost';
    host.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:0;height:0;overflow:hidden;pointer-events:none';
    host.setAttribute('aria-hidden', 'true');
    document.body.appendChild(host);
  }
  return host;
}
function paintWarm(dataUrl) {
  if (!dataUrl) return;
  const img = document.createElement('img');
  img.src = dataUrl;
  img.alt = '';
  getPaintWarmHost().appendChild(img);
}

/* ===== 라이프 게이지 (2주차부터 도입, § lifeGaugeState.js) — play/game/
   index.html의 같은 이름 함수와 짝(§ 이 파일 헤더의 "두 파일이 갈라질 위험"
   관례 그대로). 허브는 지금 W2_* phase로만 쓰이지만, 3주차·4주차도 같은
   W<n>_ 네이밍으로 허브를 이어갈 예정이라 phase 접두어를 'W2_'로 고정하지
   않고 "1주차 계열(W1_*)만 아니면 표시"로 일반화해둔다. */
const LIFE_FLASH_MS = 650;
function lifeGaugeColor(value) {
  if (value <= 25) return 'var(--signal-red)';
  if (value <= 55) return 'var(--amber)';
  return 'var(--cyan)';
}
function updateLifeGauge() {
  const phase = ExplorationState.getCurrentPhase() || '';
  el.lifeGauge.classList.toggle('hidden', !phase || phase.startsWith('W1_'));
  const value = LifeGaugeState.getValue();
  el.lifeGaugeFill.style.width = value + '%';
  el.lifeGaugeFill.style.backgroundColor = lifeGaugeColor(value);
}
// severity: 'minor' | 'major'. 깎일 구간을 먼저 반짝이게 보여주고
// (LIFE_FLASH_MS) 그 뒤에야 fill을 줄인다 — play/game/index.html과 동일한
// 예고 연출.
function applyLifeDamage(severity) {
  const { from, to, amount } = LifeGaugeState.damage(severity);
  if (!amount) return;
  el.lifeGaugeFlash.style.left = to + '%';
  el.lifeGaugeFlash.style.width = (from - to) + '%';
  el.lifeGaugeFlash.classList.remove('hidden');
  el.lifeGaugeFlash.classList.add('blinking');
  setTimeout(() => {
    el.lifeGaugeFlash.classList.add('hidden');
    el.lifeGaugeFlash.classList.remove('blinking');
    el.lifeGaugeFill.style.width = to + '%';
    el.lifeGaugeFill.style.backgroundColor = lifeGaugeColor(to);
    if (LifeGaugeState.isDepleted()) setTimeout(showLifeGameOver, 350);
  }, LIFE_FLASH_MS);
}
function showLifeGameOver() {
  el.lifeGameoverOverlay.classList.remove('hidden');
}
el.lifeGameoverRetryBtn.addEventListener('click', () => {
  LifeGaugeState.reset();
  el.lifeGameoverOverlay.classList.add('hidden');
  updateLifeGauge();
  // 진행 중이던 인라인 씬을 처음부터 다시 재생 — 없으면(비정상 상태)
  // 허브 자체를 새로고침해 안전하게 되돌린다.
  if (currentDialoguePlayer) currentDialoguePlayer.restart();
  else location.reload();
});

const STATE_LABEL = { locked: '잠김', new: 'NEW', available: '가능', in_progress: '진행 중', exhausted: '완료', updated: 'UPDATED', resolved: '해결됨' };

/* ===== View switching ===== */
let currentView = 'map';
function showView(name) {
  currentView = name;
  el.mapView.classList.toggle('active', name === 'map');
  el.locationView.classList.toggle('active', name === 'location');
  // Every caller does renderLocation() (which fits the background via
  // applyLocationBackground -> fitLocStage) and only calls showView('location')
  // afterward — but fitLocStage() reads #locStage's real rendered size, and
  // while .location-view is still the *previous* (or no) view, it's
  // display:none, so getBoundingClientRect() returns all zeros and
  // fitLocStage() silently no-ops (see its own rect.width/height guard).
  // The background then renders unscaled at its raw top-left corner instead
  // of centered/cover-fit, until something else happens to re-trigger a fit
  // (a resize event, moving elsewhere and back). Only ever visible on this
  // view's very first activation this session (once .location-view is
  // already .active, later fitLocStage() calls during the awaited
  // renderLocation() chain get a real rect and work fine) — re-fitting here,
  // now that the container is guaranteed to have real layout, closes that gap.
  if (name === 'location' && locCanvasW) fitLocStage();
}

/* ===== Map view (spec §7.2) ===== */
async function renderMap() {
  const locations = ExplorationState.getAllLocationStates();
  const charAssignmentOverrides = await AssetDB.getCharAssignments().catch(() => ({}));
  el.mapList.innerHTML = locations.map(loc => {
    const cls = ['loc-card'];
    if (!loc.unlocked) cls.push('locked');
    if (loc.current) cls.push('current');
    const charIds = charAssignmentOverrides[loc.id] || resolveByPhase(loc.characters, ExplorationState.getCurrentPhase()) || [];
    const chars = charIds.map(c => (dialogueCharacters.find(d => d.id === c) || { name: c }).name).join(', ');
    return `
      <div class="${cls.join(' ')}" data-goto="${loc.unlocked ? loc.id : ''}">
        ${loc.newInteractionCount ? `<div class="loc-badge">NEW ${loc.newInteractionCount}</div>` : ''}
        <div class="loc-name">${escapeHtml(loc.name)}</div>
        <div class="loc-meta">${chars ? escapeHtml(chars) : (loc.unlocked ? '현재 아무도 없음' : '아직 갈 수 없는 장소')}</div>
        ${loc.current ? '<div class="loc-current-tag">현재 위치</div>' : ''}
      </div>
    `;
  }).join('');
  el.mapList.querySelectorAll('[data-goto]').forEach(card => card.addEventListener('click', () => {
    const id = card.dataset.goto;
    if (id) moveTo(id);
  }));
}

/* ===== Location photo pan/zoom — same pan+pinch+wheel math as
   minigame-phone-search's photo stage, just without hotspot hit-testing
   (탐색허브 위치는 캐릭터 chip으로만 상호작용하지, 사진 위 특정 지점을
   탭하는 구조가 아니다). Lets a wide 18:16 background actually be explored
   by panning/zooming instead of a static full-bleed CSS crop. baseScale is
   the "cover" fit (same starting view as the old CSS background-size:cover),
   so a wide photo already overflows horizontally at rest and can be panned
   left/right immediately, or pinch/wheel-zoomed in further. ===== */
let locCanvasW = 0, locCanvasH = 0;
let locScale = 1, locBaseScale = 1, locTx = 0, locTy = 0;
const locPointers = new Map();
let locPanStart = null;
// 조사하기(핫스팟 모드)일 때만 배경을 밀거나 확대할 수 있다 — 평소엔 화면이
// 고정되어 있고, 조사하기를 켜야 화면 이동 잠금이 풀리는 식 (아래 pointerdown/
// pointermove/wheel 핸들러들이 이 값을 확인). 실제 선언은 §조사하기 섹션에
// 있지만, 여기 있는 핸들러들이 참조하므로 위치만 앞당겨 선언한다.
let investigateMode = false;
let locPinchStartDist = 0, locPinchStartScale = 1;
const LOC_MAX_SCALE_MULT = 3;

function locDist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function locMid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
function clampLocScale(s) { return Math.min(Math.max(s, locBaseScale), locBaseScale * LOC_MAX_SCALE_MULT); }
function clampLocPan() {
  const rect = el.locStage.getBoundingClientRect();
  const scaledW = locCanvasW * locScale, scaledH = locCanvasH * locScale;
  locTx = scaledW <= rect.width ? (rect.width - scaledW) / 2 : Math.min(0, Math.max(rect.width - scaledW, locTx));
  locTy = scaledH <= rect.height ? (rect.height - scaledH) / 2 : Math.min(0, Math.max(rect.height - scaledH, locTy));
}
function applyLocTransform() { clampLocPan(); el.locCanvas.style.transform = `translate(${locTx}px, ${locTy}px) scale(${locScale})`; }
function fitLocStage() {
  const rect = el.locStage.getBoundingClientRect();
  if (!rect.width || !rect.height || !locCanvasW || !locCanvasH) return;
  locBaseScale = Math.max(rect.width / locCanvasW, rect.height / locCanvasH);
  locScale = locBaseScale;
  locTx = (rect.width - locCanvasW * locScale) / 2;
  locTy = (rect.height - locCanvasH * locScale) / 2;
  applyLocTransform();
}
window.addEventListener('resize', () => { if (locCanvasW) fitLocStage(); });
window.addEventListener('orientationchange', () => { if (locCanvasW) fitLocStage(); });

el.locStage.addEventListener('pointerdown', (e) => {
  if (!locCanvasW || !investigateMode) return; // 조사하기가 켜져 있을 때만 화면 이동(팬/줌) 허용 — 그 전엔 화면 잠금
  if (e.target.closest('.investigate-hotspot')) return; // let the marker's own click fire instead of starting a pan under it
  el.locStage.setPointerCapture(e.pointerId);
  locPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (locPointers.size === 1) {
    locPanStart = { x: e.clientX, y: e.clientY, tx: locTx, ty: locTy };
  } else if (locPointers.size === 2) {
    locPanStart = null;
    const pts = [...locPointers.values()];
    locPinchStartDist = locDist(pts[0], pts[1]);
    locPinchStartScale = locScale;
  }
});
el.locStage.addEventListener('pointermove', (e) => {
  if (!locCanvasW || !investigateMode || !locPointers.has(e.pointerId)) return;
  locPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (locPointers.size === 1 && locPanStart) {
    locTx = locPanStart.tx + (e.clientX - locPanStart.x);
    locTy = locPanStart.ty + (e.clientY - locPanStart.y);
    applyLocTransform();
  } else if (locPointers.size === 2) {
    const pts = [...locPointers.values()];
    const d = locDist(pts[0], pts[1]);
    const newScale = clampLocScale(locPinchStartScale * (d / locPinchStartDist));
    const rect = el.locStage.getBoundingClientRect();
    const midNow = locMid(pts[0], pts[1]);
    const stageX = midNow.x - rect.left, stageY = midNow.y - rect.top;
    const ratio = newScale / locScale;
    locTx = stageX - (stageX - locTx) * ratio;
    locTy = stageY - (stageY - locTy) * ratio;
    locScale = newScale;
    applyLocTransform();
  }
});
['pointerup', 'pointercancel'].forEach(evt => el.locStage.addEventListener(evt, (e) => {
  locPointers.delete(e.pointerId);
  if (locPointers.size < 2) locPinchStartDist = 0;
  if (locPointers.size === 0) locPanStart = null;
}));
el.locStage.addEventListener('wheel', (e) => {
  if (!locCanvasW || !investigateMode) return;
  e.preventDefault();
  const rect = el.locStage.getBoundingClientRect();
  const stageX = e.clientX - rect.left, stageY = e.clientY - rect.top;
  const newScale = clampLocScale(locScale * (e.deltaY < 0 ? 1.1 : 0.9));
  const ratio = newScale / locScale;
  locTx = stageX - (stageX - locTx) * ratio;
  locTy = stageY - (stageY - locTy) * ratio;
  locScale = newScale;
  applyLocTransform();
}, { passive: false });

/* ===== Location view (spec §7.1) ===== */
async function applyLocationBackground(locationId) {
  let asset = null;
  // 탐색허브 위치도 장소 DB 카탈로그에 배정할 수 있다(/dev/upload의 탐색허브
  // 탭이 배경 DB 탭과 같은 장소-배정 UI를 씀) — getBackgroundId가 배정 여부를
  // 먼저 확인하고, 아직 배정 전이면 기존 레거시 sceneId 직접 조회로 폴백한다.
  const assetId = await DevGameState.getBackgroundId(locationId);
  if (assetId) asset = await AssetDB.getAsset(assetId).catch(() => null);
  locPointers.clear();
  locPanStart = null;
  if (asset && asset.dataUrl) {
    el.locStage.classList.remove('placeholder');
    await AssetDB.preloadImage(asset.dataUrl).catch(() => {});
    paintWarm(asset.dataUrl);
    el.locImg.src = asset.dataUrl;
    locCanvasW = asset.width;
    locCanvasH = asset.height;
    Object.assign(el.locImg.style, { width: locCanvasW + 'px', height: locCanvasH + 'px' });
    fitLocStage();
  } else {
    el.locStage.classList.add('placeholder');
    el.locImg.removeAttribute('src');
    el.locImg.style.width = '';
    el.locImg.style.height = '';
    locCanvasW = 0;
    locCanvasH = 0;
    el.locCanvas.style.transform = 'none';
  }
}

function renderLocation() {
  const id = ExplorationState.getCurrentLocationId();
  const def = locationDefs[id];
  if (!def) return Promise.resolve();
  setInvestigateMode(false); // a new location's canvas/hotspots start clean, not mid-투어 from wherever the player last toggled 조사 on
  const bgReady = applyLocationBackground(id);
  const charsReady = renderLocationCharacters();

  // A location can hand off back into the VN (spec §12.2's soft-gate) — e.g.
  // 빈티지 전시장 입구's enterSceneId leaves the hub for good and resumes
  // week2-scene-003, unlike an `exits` chip which just moves within the hub.
  // enterSceneId/enterSceneLabel can be phase-keyed (§신규 저작 관습) — e.g.
  // w2-hub-plaza only offers "사건을 재구성한다" during W2_REVERIFICATION.
  const phase = ExplorationState.getCurrentPhase();
  const enterSceneId = resolveByPhase(def.enterSceneId, phase);
  el.enterSceneBtn.classList.toggle('hidden', !enterSceneId);
  if (enterSceneId) {
    el.enterSceneBtn.textContent = resolveByPhase(def.enterSceneLabel, phase) || '들어간다';
    el.enterSceneBtn.onclick = () => { location.href = `/play/game/?scene=${encodeURIComponent(enterSceneId)}`; };
  }

  const goal = phaseGoals[ExplorationState.getCurrentPhase()];
  if (goal && goal.requiredFactIds && goal.requiredFactIds.length) {
    const p = ExplorationState.checkPhaseCompletion(goal.requiredFactIds);
    el.goalLine.innerHTML = `현재 목표: <b>${p.done}/${p.total}</b> 확인함`;
  } else {
    el.goalLine.textContent = ''; // 장소명은 더 이상 여기 안 뜬다 — showLocationToast가 대신한다
  }
  // renderLocation()은 실제 이동뿐 아니라 대화/상호작용이 끝난 뒤 지금 있는
  // 같은 장소를 그냥 새로고침하려고도 호출된다(예: playInteraction의
  // onComplete, onInlineSceneComplete) — 매번 토스트를 띄우면 대화 하나
  // 끝날 때마다 장소명이 다시 뜨는 스팸이 된다. 그래서 "진짜 새 장소로
  // 들어왔는지"는 지난번 토스트를 띄운 장소 id와 다른지로 판단한다 — 다른
  // 장소로 나갔다 같은 곳으로 돌아와도 실제로 "들어온" 것이므로 다시 뜬다.
  if (id !== lastToastedLocationId) {
    showLocationToast(def.name);
    lastToastedLocationId = id;
  }
  // moveTo's .move-fade only fades back in once this resolves (§신규, see
  // performMove) — background만 기다리면 인물 초상/스테이지 그림이 아직
  // 디코딩 중인 프레임이 암전 뒤에서 새어나올 수 있어 캐릭터 쪽도 같이 묶는다.
  return Promise.all([bgReady, charsReady]);
}

// 장소명 토스트 (§신규) — hub-panel의 goal-line 자리를 차지하던 장소명을
// 대신 상단에 잠깐 떴다 사라지는 토스트로 보여준다.
const LOCATION_TOAST_MS = 2200;
let lastToastedLocationId = null;
let locationToastTimer = null;
function showLocationToast(name) {
  if (!name) return;
  clearTimeout(locationToastTimer);
  el.locationToast.textContent = name;
  el.locationToast.classList.remove('show');
  void el.locationToast.offsetWidth; // reflow — 같은 이름이 연달아 떠도 트랜지션이 다시 재생되게
  el.locationToast.classList.add('show');
  locationToastTimer = setTimeout(() => el.locationToast.classList.remove('show'), LOCATION_TOAST_MS);
}

// §신규 이동 트랜지션 — covers the state swap below with a brief .move-fade
// so a mid-load frame never shows. performMove kicks off the instant the
// button is pressed, in parallel with the fade-in — but now that
// preloadPhaseAssets actually warms every location for real (see AssetDB.
// preloadImage's note on the sessionStorage bug that used to fake this),
// performMove often resolves within the same frame it started, before the
// fade-in's own CSS transition has had a chance to actually paint a fully
// black frame. Removing 'show' that fast reads as no fade at all rather
// than a quick one, so MOVE_FADE_MS floors the cover's visible time at
// (at least) its own .move-fade transition duration — long enough to
// register as a real dark→light beat, not a hold that waits on anything.
//
// Both this and .move-fade's CSS transition used to be hardcoded here; now
// they're read from AssetDB.getGameSettings().moveFade (edited from
// /dev/settings/, §게임환경설정) at boot via applyMoveFadeSettings below —
// the values below are just the pre-DB fallback (same numbers as the
// shipped default) for the brief window before that fetch resolves, or if
// it fails.
let MOVE_FADE_MS = 340;
// durationMs alone (no holdMs) — the moment the opacity transition itself
// finishes and the screen is genuinely fully black, as opposed to
// MOVE_FADE_MS which also includes the extra hold time before fading back.
// This is when it's safe to close a still-open 이동하기 리스트/지도 시트
// (§신규 — closing it any earlier let the old background flash back into
// view for a frame before the fade caught up).
let MOVE_FADE_COVER_MS = 300;
function applyMoveFadeSettings(settings) {
  const mf = (settings && settings.moveFade) || AssetDB.DEFAULT_GAME_SETTINGS.moveFade;
  el.moveFade.style.transition = `opacity ${(mf.durationMs / 1000).toFixed(3)}s cubic-bezier(${mf.x1},${mf.y1},${mf.x2},${mf.y2})`;
  MOVE_FADE_MS = mf.durationMs + mf.holdMs;
  MOVE_FADE_COVER_MS = mf.durationMs;
}
function moveTo(locationId) {
  el.moveFade.classList.add('show');
  setTimeout(() => {
    // 화면이 완전히 암전된 시점 — 이동하기 리스트/지도 시트가 열려 있었다면
    // 이제 닫는다(안 열려 있었다면 그냥 no-op). hideMoveMapSheet()의 300ms
    // 슬라이드다운 트랜지션을 그대로 타면 암전이 다시 밝아지기 시작하는
    // 시점(MOVE_FADE_MS)보다 늦게 끝나 시트가 채 안 사라진 채로 화면이
    // 밝아지는 걸 볼 수 있다 — 이미 화면이 새까만 지금은 어차피 안 보이니
    // 애니메이션 없이 즉시 감춘다.
    el.listSheet.classList.add('hidden');
    el.moveMapSheet.classList.remove('show');
    el.moveMapSheet.classList.add('hidden');
  }, MOVE_FADE_COVER_MS);
  Promise.all([performMove(locationId), new Promise(r => setTimeout(r, MOVE_FADE_MS))]).then(() => {
    requestAnimationFrame(() => el.moveFade.classList.remove('show'));
  });
}

// The one interactionDefs entry (if any) that auto-plays the moment a phase
// is entered for the first time — see the 'w2-phase1-intro' entry's own
// comment in dev/data/interactionDefs.js for why this replaced the old
// firstVisitSceneId/dialogueData.js scene approach.
function findPhaseIntro(phaseId) {
  return Object.values(interactionDefs).find(def => def.type === 'phaseIntro' && (def.phases || []).includes(phaseId));
}

// 처음 만나는 용의자는 심문하기 버튼을 누르지 않아도 그 장소에 들어가는
// 순간 심문 씬이 자동 재생된다 — phaseIntro와 같은 "낯선 도입부는 자동
// 재생" 원칙을 phase 단위가 아니라 장소 단위로 적용한 것(§신규,
// autoPlayOnFirstVisit — see interactionDefs.js의 w1suspect-*-interview 항목
// 주석). 위치가 여러 phase에 걸쳐 재사용되는 경우(w2-adrian-spot 등)가 있어
// ExplorationState.isLocationVisited(위치 단위)로는 "이번 phase에서 처음"을
// 구분할 수 없으므로, phaseIntro와 똑같이 그 interaction 자신의 state로
// 판별한다 — 한 번 재생되면 completeInteraction으로 'new'를 벗어나 다시는
// 자동 재생되지 않고, 대화하기/심문하기 버튼으로만 다시 열어볼 수 있다.
function findAutoInterrogation(locationId, phaseId) {
  return Object.values(interactionDefs).find(def =>
    def.autoPlayOnFirstVisit && (def.locationIds || []).includes(locationId) && (def.phases || []).includes(phaseId));
}

async function performMove(locationId) {
  const def = locationDefs[locationId];
  if (!def) return;
  const firstVisit = !ExplorationState.isLocationVisited(locationId);
  if (firstVisit && def.firstVisitFlag) CaseFileState.setFlag(def.firstVisitFlag, true);
  if (def.routeOnEnter) {
    // A routeOnEnter location (e.g. the boutique) has no hub content of its
    // own — it's a pure hand-off, so it never becomes "current". The return
    // URL has to be built from ExplorationState's live location/phase, not
    // location.search: this is a single-page app that never touches the
    // address bar after boot, so location.search is stuck on whatever the
    // player originally deep-linked in with, not where they actually are now.
    const returnLocationId = ExplorationState.getCurrentLocationId();
    const returnPhase = ExplorationState.getCurrentPhase();
    sessionStorage.setItem('mkShopReturnUrl', `/play/explore/?phase=${encodeURIComponent(returnPhase)}&location=${encodeURIComponent(returnLocationId)}`);
    ExplorationState.unlockLocation(locationId);
    ExplorationState.markLocationVisited(locationId);
    location.href = def.routeOnEnter;
    return;
  }
  ExplorationState.unlockLocation(locationId);
  ExplorationState.moveToLocation(locationId);
  await renderLocation();
  showView('location');
  // Phase 최초 진입 시 자동 재생되는 도입 대화 (§신규, 예전 firstVisitSceneId
  // 자리를 대신함— see interactionDefs.js의 'w2-phase1-intro' 주석) —
  // 특정 장소가 아니라 phase 단위로 "이미 봤는지"를 추적하므로
  // completeInteraction 여부로 판별한다. 허브가 이미 렌더링된 뒤 그 위에
  // 대화 패널을 띄우는 것이라 (playInteraction과 동일한 순서), 끝나면
  // renderLocation()이 다시 불려 액션바가 뜬다.
  const phaseIntro = findPhaseIntro(ExplorationState.getCurrentPhase());
  if (phaseIntro && ExplorationState.getInteractionState(phaseIntro.id) === 'new') {
    playSceneInline(phaseIntro, phaseIntro.id);
    return;
  }
  // 처음 만나는 용의자 자동 심문 (§신규, see findAutoInterrogation 위) —
  // 심문하기를 직접 눌렀을 때와 같은 경로(playInteraction)로 재생해, 씬
  // 흐름(completeInteraction 시점 등)이 수동 진입과 완전히 똑같다.
  const autoInterrogation = findAutoInterrogation(locationId, ExplorationState.getCurrentPhase());
  if (autoInterrogation && ExplorationState.getInteractionState(autoInterrogation.id) === 'new') {
    playInteraction(autoInterrogation.id);
  }
}

/* ===== Hub action bar (조사/대화/제시/이동) =====
   Replaces the old per-character chip + action-sheet flow: each location
   carries at most one person, but a location can list several (§신규) —
   currentCharacterId tracks which one 대화/제시 currently act on, switchable
   via a chip tap (selectLocationCharacter). */
// phase-keyed 필드 (§신규 저작 관습, dev/data/locationDefs.js 상단 주석 참고) —
// 같은 실제 장소가 phase마다 값이 달라야 할 때(characters/enterSceneId/
// enterSceneLabel/mapPosition 등), 평범한 값 대신 `{ __byPhase: true, [phase]:
// value }` 객체로 쓸 수 있게 한다. `__byPhase` 마커를 명시적으로 요구하는 이유 —
// mapPosition의 "평범한" 값 자체가 이미 `{x,y}` 순수 객체라, "배열이 아닌
// 객체면 phase-keyed"로 단순 판별하면 평범한 좌표까지 phase-keyed로 오인해
// 엉뚱한 phase 키를 찾다가 null이 되어버린다 — 마커가 있을 때만 phase-keyed로
// 취급해야 값 자체의 모양과 무관하게 안전하다.
function resolveByPhase(value, phase) {
  if (value == null) return null;
  if (value && typeof value === 'object' && value.__byPhase) return value[phase] ?? null;
  return value;
}

let currentCharacterId = null;
// AssetDB.getCharAssignments() override(/dev/hub/index.html의 인물 배정
// 패널)가 있으면 locationDefs.js의 정적 characters보다 우선한다 — 지도 핀/
// 인물 위치 override(pinPosition/resolveCharPos)와 같은 결.
async function locationCharacters() {
  const locationId = ExplorationState.getCurrentLocationId();
  const overrides = await AssetDB.getCharAssignments().catch(() => ({}));
  if (overrides[locationId]) return overrides[locationId];
  const def = locationDefs[locationId];
  if (!def) return [];
  return resolveByPhase(def.characters, ExplorationState.getCurrentPhase()) || [];
}

// ===== 장소에 있는 사람 캐릭터 표시 (§신규) — 지금 이 장소에 누가 있는지
// 초상화 chip으로 보여준다. chip을 누르면 선택이 그 인물로 바뀌고(active
// 표시), 화면 중앙의 캐릭터도 페이드아웃 후 그 인물로 페이드인한다
// (selectLocationCharacter/setLocCharStage). 대화하기/증거 제시는 지금
// 선택된 인물을 대상으로 한다.
//
// 자동 선택은 기본적으로 그 장소의 첫 번째 인물이지만, 영우는 예외 —
// 영우는 그 phase가 시작하는 장소에서만 기본 선택이다. 그 밖의 어떤
// 장소에서든(용의자/참고인과 달리 영우는 phase 내 여러 장소에 계속
// 등장하므로) 기본 선택이 아니다 — chip을 직접 눌러서 그 자리에서 말을
// 걸 수는 있지만, 그 선택은 그 장소에 한정될 뿐 다음 장소로 넘어가면서
// 다시 기본 선택이 되지는 않는다(장소를 옮기면 무조건 선택 없음으로
// 리셋). phase가 시작하는 장소인지는 youngwooAutoPickPhase로 "이 phase는
// 이미 시작 장소를 지나왔다"를 기억해서 판단한다. 영우가 아닌 인물은
// 예전 그대로 매번 그 장소의 첫 번째 인물로 자동 선택되고, 선택도 다음
// 장소로 자연스럽게 넘어간다. */
const CHAR_NOT_DEFAULT_OUTSIDE_PHASE_START = 'youngwoo';
let youngwooAutoPickPhase = null;
async function renderLocationCharacters() {
  const chars = await locationCharacters();
  const phase = ExplorationState.getCurrentPhase();
  const isPhaseStartLocation = phase !== youngwooAutoPickPhase;
  youngwooAutoPickPhase = phase;
  if (currentCharacterId === CHAR_NOT_DEFAULT_OUTSIDE_PHASE_START && !isPhaseStartLocation) currentCharacterId = null;
  if (!chars.includes(currentCharacterId)) {
    const fallback = chars[0] || null;
    currentCharacterId = (fallback === CHAR_NOT_DEFAULT_OUTSIDE_PHASE_START && !isPhaseStartLocation) ? null : fallback;
  }
  el.locCharacters.innerHTML = chars.map(charId => {
    const person = dialogueCharacters.find(d => d.id === charId) || { name: charId };
    return `
      <button class="loc-char-chip${charId === currentCharacterId ? ' active' : ''}" data-char="${charId}">
        <span class="loc-char-portrait" id="locCharPortrait-${charId}">${escapeHtml((person.name || '?')[0])}</span>
        <span class="loc-char-name">${escapeHtml(person.name)}</span>
      </button>
    `;
  }).join('');
  el.locCharacters.querySelectorAll('[data-char]').forEach(chip => {
    chip.addEventListener('click', () => selectLocationCharacter(chip.dataset.char));
  });
  const chipsReady = Promise.all(chars.map(async (charId) => {
    const assetId = await Promise.resolve(DevGameState.getCharacterAssetId(charId, 'neutral')).catch(() => null);
    const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
    if (asset && asset.dataUrl) await AssetDB.preloadImage(asset.dataUrl).catch(() => {});
    const host = document.getElementById(`locCharPortrait-${charId}`);
    if (host && asset && asset.dataUrl) host.innerHTML = `<img src="${asset.dataUrl}" alt="">`;
  }));
  const stageReady = setLocCharStage(currentCharacterId);
  renderInterrogateBtn();
  // renderLocation()이 이 promise를 move-fade 암전 해제 조건에 묶는다(§신규) —
  // 초상/스테이지 그림 디코딩이 끝나기 전에 화면이 밝아지지 않게.
  return Promise.all([chipsReady, stageReady]);
}
function selectLocationCharacter(charId) {
  if (charId === currentCharacterId) return;
  currentCharacterId = charId;
  el.locCharacters.querySelectorAll('[data-char]').forEach(chip => chip.classList.toggle('active', chip.dataset.char === charId));
  setLocCharStage(charId);
  renderInterrogateBtn();
}

// 심문하기 (§신규) — bottom-bar 위에 떠 있는 버튼. 지금 선택된 인물에게
// isInterrogation 플래그가 붙은 interactionDefs 항목(locked 아님)이 있을
// 때만 뜨고, 눌리면 대화 목록을 거치지 않고 바로 그 항목을 재생한다
// (playInteraction이 minigame형 route 처리를 이미 알아서 함).
function getInterrogationInteraction(characterId) {
  if (!characterId) return null;
  const locationId = ExplorationState.getCurrentLocationId();
  return ExplorationState.getInteractionsForCharacter(characterId, locationId).find(i => i.isInterrogation && i.state !== 'locked') || null;
}
// openTopicList가 실제로 재는 "나눌 잡담이 있는지"와 완전히 같은 기준 —
// 여기서는 목록 자체가 아니라 있는지 여부만 필요해 별도 헬퍼로 뺐다.
function hasCasualTopics(characterId) {
  if (!characterId) return false;
  const locationId = ExplorationState.getCurrentLocationId();
  return ExplorationState.getInteractionsForCharacter(characterId, locationId).some(i => (i.type === 'topic' || i.type === 'minigame') && !i.isInterrogation);
}
function renderInterrogateBtn() {
  const interrogation = getInterrogationInteraction(currentCharacterId);
  const topicsAvailable = hasCasualTopics(currentCharacterId);
  // 나눌 잡담이 없으면 "대화하기"가 이미 그 심문을 대신 재생하므로
  // (openTopicList 참고), 같은 심문으로 이어지는 별도 심문하기 버튼을 또
  // 띄우지 않는다 — 잡담이 있어야 심문하기가 대화하기와 구별되는 선택지다.
  const showSeparateBtn = !!interrogation && topicsAvailable;
  el.interrogateBtn.classList.toggle('hidden', !showSeparateBtn);
  if (showSeparateBtn) {
    el.interrogateBtn.textContent = (interrogation.icon ? interrogation.icon + ' ' : '') + (interrogation.label || '심문하기');
    el.interrogateBtn.onclick = () => playInteraction(interrogation.id);
  }
  // 잡담이 없고 심문만 있을 땐 "대화하기" 버튼 자체가 심문하기 역할을
  // 대신한다는 걸 라벨로도 보여준다 — 눌렀을 때 실제로 그렇게 동작한다.
  el.talkBtn.textContent = (interrogation && !topicsAvailable)
    ? (interrogation.icon ? interrogation.icon + ' ' : '') + (interrogation.label || '심문하기')
    : '대화하기';
}

// 화면 중앙의 "지금 선택된 인물" 서있는 그림 — 대화 중에도(applyDialogueCharacter)
// 이 같은 요소를 그대로 쓰는 자리라, 대화 중이 아닐 때도(허브를 둘러보는 동안)
// 늘 떠 있다. 이미 떠 있는 상태에서 다른 인물로 바뀌면 CSS transition 시간만큼
// 기다렸다 이미지를 바꿔서, 컷 전환이 아니라 페이드아웃→페이드인처럼 보이게 한다.
const LOC_CHAR_STAGE_FADE_MS = 250;
// applyDialogueCharacter(아래 §Dialogue playback)도 같은 el.locCharStageImg를
// 쓰는 만큼 이 토큰을 공유한다 — 서로 다른 카운터를 썼을 때 상대방의 요청을
// 무효화하지 못해 느리게 도착한 쪽이 화면을 덮어써버리는 경쟁 상태가 있었다.
let locCharStageToken = 0;
async function setLocCharStage(charId) {
  const token = ++locCharStageToken;
  if (el.locCharStage.classList.contains('show')) {
    el.locCharStage.classList.remove('show');
    await new Promise(r => setTimeout(r, LOC_CHAR_STAGE_FADE_MS));
    if (token !== locCharStageToken) return;
  }
  if (!charId) { el.locCharStageImg.removeAttribute('src'); return; }
  const assetId = await Promise.resolve(DevGameState.getCharacterAssetId(charId, 'neutral')).catch(() => null);
  const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
  if (token !== locCharStageToken) return;
  if (asset && asset.dataUrl) {
    // Same defensive preloadImage() call applyLocationBackground makes — a
    // data URL is already local, but its bitmap still needs decoding before
    // paint is free, and that decode is what performMove's caller (moveTo)
    // is actually waiting on to lift the move-fade cover.
    await AssetDB.preloadImage(asset.dataUrl).catch(() => {});
    paintWarm(asset.dataUrl);
    if (token !== locCharStageToken) return;
    el.locCharStageImg.src = asset.dataUrl;
    el.locCharStage.classList.add('show');
  } else {
    el.locCharStageImg.removeAttribute('src');
  }
  applyCharPosOffset(await resolveCharPos(ExplorationState.getCurrentLocationId(), charId));
  refreshCharPosEditorUI();
}

// 허브에서 대화하는 모든 캐릭터가 서는 자리 — 장소/인물마다 따로 정의하지
// 않는 한 전부 이 자리로 통일된다(§신규 코드 기본값 확정: 더 록스 골목·영우
// 슬라이더로 맞췄던 y:-150을 허브 전체 기본값으로 승격). locationDefs.js의
// charPositions로 장소별 예외를 코드에 직접 정의할 수 있다(resolveCharPos).
// 대기 화면(setLocCharStage)과 대화 화면(applyDialogueCharacter)이 같은
// 함수를 공유하는 유일한 좌표 소스라, 어느 화면에서든 항상 같은 자리로
// 통일된다.
const DEFAULT_HUB_CHAR_POS = { x: 0, y: -150 };
// AssetDB.getCharPositions() override(DEV · 인물 위치 조정 모드, 아래 참고)가
// 있으면 locationDefs.js의 정적 charPositions/DEFAULT_HUB_CHAR_POS보다
// 우선한다 — 지도 핀 override(openMoveMapSheet의 pinPosition)와 같은 결.
async function resolveCharPos(locationId, characterId) {
  const overrides = await AssetDB.getCharPositions().catch(() => ({}));
  const def = locationDefs[locationId];
  const pos = (overrides[locationId] && overrides[locationId][characterId])
    || (def && def.charPositions && def.charPositions[characterId])
    || DEFAULT_HUB_CHAR_POS;
  return { x: pos.x || 0, y: pos.y || 0 };
}
function applyCharPosOffset(pos) {
  el.locCharStageImg.style.transform = (pos.x || pos.y) ? `translate(${pos.x}px, ${pos.y}px)` : '';
}

/* ===== DEV · 인물 위치 조정 모드 =====
   지금 서 있는 인물(currentCharacterId)의 이미지를 이 장소 위에서 직접
   드래그해 charPositions override를 저장한다. setLocCharStage/
   applyDialogueCharacter가 인물을 새로 그릴 때마다 refreshCharPosEditorUI를
   같이 불러, 인물 chip을 바꾸거나 대사가 다른 화자로 넘어가도 편집기가 그
   인물 기준으로 따라간다. */
let charPosEditMode = false;
let charPosDragStart = null; // { pointerX, pointerY, baseX, baseY }
let charPosCurrent = { x: 0, y: 0 };

function currentCharPosKey() {
  const locationId = ExplorationState.getCurrentLocationId();
  return (locationId && currentCharacterId) ? { locationId, characterId: currentCharacterId } : null;
}

async function refreshCharPosEditorUI() {
  if (!charPosEditMode) return;
  const key = currentCharPosKey();
  if (!key) { el.charPosEditor.classList.add('hidden'); return; }
  el.charPosEditor.classList.remove('hidden');
  el.charPosEditorStatus.textContent = '';
  charPosCurrent = await resolveCharPos(key.locationId, key.characterId);
  el.charPosEditorCoords.textContent = `x ${charPosCurrent.x}, y ${charPosCurrent.y}`;
}

function enterCharPosEditMode() {
  charPosEditMode = true;
  el.locCharStage.classList.add('pos-edit');
  refreshCharPosEditorUI();
}
function exitCharPosEditMode() {
  charPosEditMode = false;

el.locCharStageImg.addEventListener('pointerdown', (e) => {

el.locCharStageImg.addEventListener('pointermove', (e) => {

el.locCharStageImg.addEventListener('pointercancel', endCharPosDrag);
