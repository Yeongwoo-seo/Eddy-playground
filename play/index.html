<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MISSING KEY · PLAY</title>
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/play/manifest.json">
<link rel="apple-touch-icon" href="https://dhtstqnksjoyyshnhksv.supabase.co/storage/v1/object/public/dev-assets/app-icon/play-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Missing Key">
<!-- iOS shows a plain white launch screen unless matched against one of
     these exact device-resolution media queries, so we generate one per
     common iPhone size instead of relying on a single generic image -->
<link rel="apple-touch-startup-image" href="/icons/splash-750x1334.jpg" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
<link rel="apple-touch-startup-image" href="/icons/splash-1242x2208.jpg" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="/icons/splash-1125x2436.jpg" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="/icons/splash-828x1792.jpg" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)">
<link rel="apple-touch-startup-image" href="/icons/splash-1242x2688.jpg" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="/icons/splash-1170x2532.jpg" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="/icons/splash-1284x2778.jpg" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="/icons/splash-1179x2556.jpg" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="/icons/splash-1290x2796.jpg" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="/icons/splash-1206x2622.jpg" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="/icons/splash-1320x2868.jpg" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{background:#000;display:flex;justify-content:center;min-height:100dvh}

/* Real play environment — no dev chrome at all. Background image/position
   and the 시작하기 hit-zone's position/size are read straight from the same
   localStorage keys /dev/start/ writes to, so whatever was configured there
   shows up here exactly as a player would see it. */
.frame{position:relative;width:100%;max-width:430px;min-height:100dvh;min-height:100vh;overflow:hidden;touch-action:none}

.bg-layer{position:absolute;inset:0;background-size:cover;background-color:#0d1114;background-image:linear-gradient(160deg,#171c22 0%,#0d1114 60%,#080a0c 100%);opacity:0;transition:opacity 1.8s ease}
.bg-layer.show{opacity:1}

.hit-zone{position:absolute;transform:translate(-50%,-50%);background:transparent;border:none;padding:0;touch-action:none;cursor:pointer;transition:background-color .1s}
.hit-zone.pressed{background:rgba(0,0,0,.55)}

/* 게임 스타트 → 주차 선택 화면. /schedule.html 홈 카드와 같은 스타일의
   세로 카드 리스트(1~4주차 + 미니게임). 2/3/4주차는 아직 구현되지 않아
   ???로 잠가둔다. */
.week-select{position:absolute;inset:0;z-index:10;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.week-select.show{display:flex}
.week-grid{display:flex;flex-direction:column;gap:14px;width:100%;max-width:360px}
.week-tile{position:relative;height:120px;border-radius:24px;overflow:hidden;background:linear-gradient(135deg,#1b2a4a 0%,#0d1420 100%);background-size:cover;background-position:center}
.week-tile::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.2) 40%,rgba(0,0,0,.85) 100%)}
.week-tile.active{cursor:pointer;transition:transform .15s}
.week-tile.active:active{transform:scale(.98)}
.week-tile.locked{cursor:not-allowed;background:linear-gradient(135deg,#14171c 0%,#000 100%);filter:grayscale(.2)}
.week-tile.minigame{background:linear-gradient(135deg,#2a1b3d 0%,#120d20 100%);background-size:cover;background-position:center}
.week-tile.shop{background:linear-gradient(135deg,#4a2a12 0%,#1f1109 100%);background-size:cover;background-position:center}
.week-tile.continue{background:linear-gradient(135deg,#0f4d54 0%,#082024 100%)}
.week-tile-body{position:absolute;right:18px;bottom:16px;z-index:1;color:#fff;text-align:right}
.week-tile-name{font-size:18px;font-weight:800}
.week-tile-desc{font-size:12px;color:rgba(255,255,255,.75);font-weight:500;margin-top:3px}

/* 미니게임 + 옷가게 — 한 행을 절반씩 나눠 쓰는 2칸짜리 타일. 나머지
   week-tile은 세로로 쌓이는 전체 폭 카드라서, 이 행만 flex row로 감싸고
   .half로 폭/텍스트 크기를 줄인다. */
.week-tile-row{display:flex;gap:14px}
.week-tile.half{flex:1;min-width:0}
.week-tile.half .week-tile-body{right:14px;bottom:14px}
.week-tile.half .week-tile-name{font-size:15px}
.week-tile.half .week-tile-desc{font-size:11px}

.minigame-select{position:absolute;inset:0;z-index:11;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.minigame-select.show{display:flex}
.minigame-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.minigame-item{background:#171C22;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px 18px;color:#EDF1F4;font-weight:700;font-size:15px;text-align:center;cursor:pointer}
.minigame-item:active{background:#232B34}
.week-back{background:none;border:none;color:#929BA5;font-size:13px;padding:8px;cursor:pointer}

/* Shown instead of the real start screen when this page wasn't launched from
   its own /play/ home-screen icon — see the install-gate script below for
   why display-mode:standalone alone can't tell that apart from being linked
   into from the 강낭콩 투어 app, which is also standalone. */
.install-gate{position:fixed;inset:0;z-index:200;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.install-gate.show{display:flex}
.install-icon{font-size:44px;margin-bottom:18px}
.install-title{color:#EDF1F4;font-size:20px;font-weight:700;letter-spacing:.04em}
.install-desc{color:#929BA5;font-size:14px;margin-top:12px;line-height:1.6;max-width:280px}
.install-btn{margin-top:28px;background:#EDF1F4;color:#080A0C;border:none;padding:14px 28px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;display:none;font-family:inherit}
.install-btn:active{opacity:.85}
.install-ios-guide{margin-top:28px;color:#929BA5;font-size:13px;line-height:1.8;max-width:280px;display:none}
.install-ios-guide b{color:#EDF1F4}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="bg-layer" id="bgLayer"></div>
  <button class="hit-zone" id="startBtn" aria-label="시작하기"></button>

  <div class="week-select" id="weekSelect">
    <div class="week-grid" id="weekGrid"></div>
  </div>

  <div class="minigame-select" id="minigameSelect">
    <button class="week-back" id="minigameBackBtn">‹ 뒤로</button>
    <div class="minigame-list" id="minigameList"></div>
  </div>
</div>

<div class="install-gate" id="installGate">
  <div class="install-icon">🔑</div>
  <div class="install-title">MISSING KEY</div>
  <div class="install-desc">이 앱은 홈 화면에 설치한 뒤,<br>그 아이콘으로 열어야 시작할 수 있어요.</div>
  <button class="install-btn" id="installBtn">홈 화면에 추가</button>
  <div class="install-ios-guide" id="iosGuide">
    Safari 하단의 <b>공유</b> 버튼을 누르고<br><b>홈 화면에 추가</b>를 선택해주세요.
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/play/sw.js', { scope: '/play/' });
}
</script>
<script src="/realPlayMode.js"></script>
<script src="/dev/assetDb.js"></script>
<script src="/dev/caseFileState.js"></script>
<script src="/dev/state/economyState.js"></script>
<script src="/dev/state/relationshipState.js"></script>
<script src="/dev/state/wardrobeState.js"></script>
<script src="/dev/state/shopState.js"></script>
<script src="/dev/state/explorationState.js"></script>
<script>
const BG_IMG_KEY = 'mkDevStartScreenBg';
const BG_POS_KEY = 'mkDevStartScreenBgPos';
const BTN_POS_KEY = 'mkDevStartScreenBtnPos';

const el = {
  bgLayer: document.getElementById('bgLayer'),
  startBtn: document.getElementById('startBtn'),
  weekSelect: document.getElementById('weekSelect'),
  weekGrid: document.getElementById('weekGrid'),
  minigameSelect: document.getElementById('minigameSelect'),
  minigameList: document.getElementById('minigameList'),
  minigameBackBtn: document.getElementById('minigameBackBtn'),
};

function loadBgPos() {
  try { return Object.assign({ x: 50, y: 50 }, JSON.parse(localStorage.getItem(BG_POS_KEY))); }
  catch (e) { return { x: 50, y: 50 }; }
}
function renderBg(pos, imgUrl) {
  el.bgLayer.style.backgroundPosition = `${pos.x}% ${pos.y}%`;
  el.bgLayer.style.backgroundImage = imgUrl ? `url("${imgUrl}")` : '';
}
// localStorage 캐시로 먼저 즉시 그린다(네트워크 왕복 없이) — /dev/start/에서
// 이 기기로 마지막에 동기화됐던 값. 실제 원본은 AssetDB.getGameSettings()의
// startScreen 필드(Supabase)라서, 아래에서 그 값을 받아오는 대로 다시 한 번
// 덮어써 다른 기기에서 바꾼 배경도 뜨게 한다(#기기 간 배경 동기화).
renderBg(loadBgPos(), localStorage.getItem(BG_IMG_KEY));
// 같은 프레임에서 opacity 스타일과 show 클래스를 함께 바꾸면 브라우저가
// 트랜지션 시작점을 병합해버려 페이드 없이 바로 나타나 보인다 — 다음
// 프레임으로 미뤄야 실제로 재생된다.
requestAnimationFrame(() => requestAnimationFrame(() => el.bgLayer.classList.add('show')));

function loadStartPos() {
  const defaults = { x: 50, y: 80, w: 46, h: 7 };
  try {
    const saved = JSON.parse(localStorage.getItem(BTN_POS_KEY));
    return Object.assign({}, defaults, saved && saved.start);
  } catch (e) {
    return defaults;
  }
}
function renderStartPos(pos) {
  el.startBtn.style.left = pos.x + '%';
  el.startBtn.style.top = pos.y + '%';
  el.startBtn.style.width = pos.w + '%';
  el.startBtn.style.height = pos.h + '%';
}
renderStartPos(loadStartPos());

(async () => {
  try {
    const settings = await AssetDB.getGameSettings();
    const s = settings.startScreen || {};
    let imgUrl = null;
    if (s.bgAssetId) {
      const asset = await AssetDB.getAsset(s.bgAssetId);
      imgUrl = asset && asset.dataUrl;
    }
    const bgPos = Object.assign({ x: 50, y: 50 }, s.bgPos);
    const startPos = Object.assign({ x: 50, y: 80, w: 46, h: 7 }, s.btnPos);
    renderBg(bgPos, imgUrl);
    renderStartPos(startPos);
    // 로컬 캐시도 최신으로 갱신 — 다음에 오프라인이어도 이번에 받은 값으로
    // 즉시 그릴 수 있게.
    localStorage.setItem(BG_POS_KEY, JSON.stringify(bgPos));
    localStorage.setItem(BTN_POS_KEY, JSON.stringify({ start: startPos }));
    if (imgUrl) localStorage.setItem(BG_IMG_KEY, imgUrl);
    else localStorage.removeItem(BG_IMG_KEY);
  } catch (e) {
    // 오프라인/네트워크 실패 — 위에서 이미 그려둔 로컬 캐시 그대로 유지.
    console.error('시작화면 배경을 서버에서 불러오지 못했습니다', e);
  }
})();

// Straight into the prologue's first scene (internal week1, ARRIVAL), not
// the /dev/week1 scene picker — a real player who picks 1주차 plays through
// the story from the top, not to browse individual scenes for testing.
// 새 플레이 시작 — 이전 테스트/플레이에서 남은 증거수첩(증거·의문점)을
// 들고 시작하면 1주차인데 2주차 증거가 보이는 등 앞뒤가 안 맞으므로,
// 저장 슬롯과 무관하게 매번 초기화하고 들어간다.
function goToRealStart() { CaseFileState.resetAll(); RealPlayMode.mark(); location.href = '/play/game/?scene=week1-scene-flight'; }

// "이어하기" — 저장 슬롯을 실제로 불러와(CaseFileState.loadSlot) 조사 상태/
// 포인트/옷장/탐색 허브 상태를 전부 복원한 뒤, 저장된 씬(또는 탐색 허브
// 위치)으로 이동한다. play/game/index.html의 CASE FILE 메뉴 "불러오기"가
// 하는 것과 동일한 절차 — 거기서도 로드 직후 페이지를 이동하면 새로 뜨는
// 페이지는 이미 복원된 localStorage를 그대로 읽는다.
async function goToContinue() {
  if (!continueSlot) return;
  const loaded = await CaseFileState.loadSlot(continueSlot.slotNum);
  if (!loaded) return;
  RealPlayMode.mark();
  if (loaded.sceneId === '__EXPLORE_HUB__') {
    const phase = (loaded.explorationState && loaded.explorationState.currentPhase) || 'W2_TOURISM';
    const loc = (loaded.explorationState && loaded.explorationState.currentLocationId) || 'w2-circular-quay';
    location.href = `/play/explore/?phase=${encodeURIComponent(phase)}&location=${encodeURIComponent(loc)}`;
  } else {
    location.href = `/play/game/?scene=${encodeURIComponent(loaded.sceneId)}&line=${loaded.lineIndex || 0}`;
  }
}

// Same tap-feedback sequence as /dev/start/: hold the darken 0.2s, clear it,
// pause 0.1s, then show the 주차 select screen — otherwise it appears before
// the darken is ever seen.
let pressedTimer = null;
el.startBtn.addEventListener('pointerdown', (e) => {
  el.startBtn.setPointerCapture(e.pointerId);
  clearTimeout(pressedTimer);
  el.startBtn.classList.add('pressed');
});
['pointerup', 'pointercancel'].forEach(evt => el.startBtn.addEventListener(evt, () => {
  clearTimeout(pressedTimer);
  pressedTimer = setTimeout(() => {
    el.startBtn.classList.remove('pressed');
    setTimeout(showWeekSelect, 100);
  }, 200);
}));

// 게임 스타트 → 검은 화면에 /schedule.html 홈과 같은 스타일의 세로 카드
// 리스트(1~4주차 + 미니게임). 2/3/4주차는 아직 구현되지 않아 ???로 잠가둔다.
const WEEK_TILES = [
  { key: 'week1', label: '1주차', bg: 'https://images.pexels.com/photos/20636564/pexels-photo-20636564.jpeg?auto=compress&cs=tinysrgb&w=800&h=500&fit=crop', locked: false },
  { key: 'week2', label: '???', locked: true },
  { key: 'week3', label: '???', locked: true },
  { key: 'week4', label: '???', locked: true },
];

// 미니게임과 나란히 놓이는 옷가게 진입 타일 — 한 행에 절반씩. 둘 다 완료
// 여부와 무관하게 처음부터 열려 있다.
const MINIGAME_SHOP_TILES = [
  {
    key: 'minigame', label: '미니게임',
    bg: 'https://images.pexels.com/photos/12380741/pexels-photo-12380741.jpeg?auto=compress&cs=tinysrgb&w=800&h=500&fit=crop',
    locked: false,
  },
  {
    key: 'shop', label: '옷가게',
    bg: 'https://images.pexels.com/photos/994523/pexels-photo-994523.jpeg?auto=compress&cs=tinysrgb&w=800&h=500&fit=crop',
    locked: false,
  },
];

// 미니게임 목록은 완료 여부가 아니라 "그 주차가 지금 플레이 가능한가"
// (WEEK_TILES의 locked)로 걸러진다 — 1주차만 열려 있으면 1주차 미니게임만,
// 2주차까지 열리면 2주차 미니게임도 함께 보인다.
const MINIGAMES_BY_WEEK = {
  week1: [
    { name: '지하철 역 찾기', route: '/play/minigame-eastwood/' },
    { name: '핸드폰을 찾아라', route: '/play/minigame-phone-search/' },
    { name: '낚시', route: '/play/minigame-fishing/' },
    { name: '레이튼 퀴즈', route: '/play/minigame-layton/' },
  ],
  week2: [
    { name: '사진 속 인물 찾기', route: '/play/minigame-photo-zoom/' },
    { name: '시간대 정리', route: '/play/minigame-timeline/' },
  ],
  week3: [],
  week4: [],
};
function availableMinigames() {
  return WEEK_TILES
    .filter(t => !t.locked)
    .flatMap(t => MINIGAMES_BY_WEEK[t.key] || []);
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function formatSaveTime(ms) {
  if (!ms) return '';
  const d = new Date(ms);
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

// 저장된 기록이 있으면 주차 선택 화면 맨 위에 "이어하기" 타일을 추가로
// 보여준다 — 3개 저장 슬롯(CaseFileState.saveSlot/loadSlot) 중 가장 최근에
// 저장된 것을 고른다. 로컬 캐시로 먼저 즉시 그리고(listSlotsLocalSync),
// 서버(Supabase) 병합본이 도착하면(listSlots) 그 사이 기록된 다른 기기의
// 저장도 반영해 다시 그린다.
let continueSlot = null;
function pickMostRecentSlot(slots) {
  const occupied = slots.filter(s => s.occupied);
  if (!occupied.length) return null;
  return occupied.reduce((a, b) => (b.updatedAt || 0) > (a.updatedAt || 0) ? b : a);
}

function tileHtml(t, half) {
  const extraClass = (t.key === 'minigame' || t.key === 'shop') ? ` ${t.key}` : '';
  return `
    <div class="week-tile${half ? ' half' : ''} ${t.locked ? 'locked' : 'active'}${extraClass}" data-key="${t.key}"${t.bg ? ` style="background-image:url('${t.bg}')"` : ''}>
      <div class="week-tile-body">
        <div class="week-tile-name">${t.label}</div>
        ${t.locked && t.lockedDesc ? `<div class="week-tile-desc">${escapeHtml(t.lockedDesc)}</div>` : ''}
      </div>
    </div>
  `;
}

function renderWeekGrid() {
  const continueTile = continueSlot ? `
    <div class="week-tile continue active" data-key="continue">
      <div class="week-tile-body">
        <div class="week-tile-name">이어하기</div>
        <div class="week-tile-desc">${escapeHtml(continueSlot.missionTitle || '')}${continueSlot.missionTitle ? ' · ' : ''}${formatSaveTime(continueSlot.updatedAt)}</div>
      </div>
    </div>
  ` : '';
  const minigameShopRow = `<div class="week-tile-row">${MINIGAME_SHOP_TILES.map(t => tileHtml(t, true)).join('')}</div>`;
  el.weekGrid.innerHTML = continueTile + WEEK_TILES.map(t => tileHtml(t, false)).join('') + minigameShopRow;
}
continueSlot = pickMostRecentSlot(CaseFileState.listSlotsLocalSync());
renderWeekGrid();
CaseFileState.listSlots().then(slots => {
  continueSlot = pickMostRecentSlot(slots);
  renderWeekGrid();
}).catch(() => {});

el.minigameList.innerHTML = availableMinigames().map(m => `
  <div class="minigame-item" data-route="${m.route}">${m.name}</div>
`).join('');

function showWeekSelect() { el.weekSelect.classList.add('show'); }

function showMinigameSelect() {
  el.weekSelect.classList.remove('show');
  el.minigameSelect.classList.add('show');
}

function goToShop() { RealPlayMode.mark(); location.href = '/play/shop/'; }

el.weekGrid.addEventListener('click', (e) => {
  const tile = e.target.closest('.week-tile.active');
  if (!tile) return;
  if (tile.dataset.key === 'continue') goToContinue();
  else if (tile.dataset.key === 'week1') goToRealStart();
  else if (tile.dataset.key === 'minigame') showMinigameSelect();
  else if (tile.dataset.key === 'shop') goToShop();
});

el.minigameBackBtn.addEventListener('click', () => {
  el.minigameSelect.classList.remove('show');
  el.weekSelect.classList.add('show');
});

el.minigameList.addEventListener('click', (e) => {
  const item = e.target.closest('.minigame-item');
  if (!item) return;
  RealPlayMode.mark();
  location.href = item.dataset.route;
});

/* =========================================================
   INSTALL GATE — only a launch from /play/'s own home-screen
   icon may enter the real start screen; a plain browser tab sees
   an install prompt instead. This used to also require an empty
   document.referrer (on the theory that a link tap, e.g. from
   inside the already-installed 강낭콩 투어 app, always carries one
   while an icon launch never does) to tell apart from the other
   app, which also reports display-mode:standalone. That extra
   condition was too fragile: whenever referrer was non-empty for
   *any* reason on a real standalone launch (OS/webview quirks that
   have nothing to do with which app launched it), the gate showed
   with no way out — no install button (beforeinstallprompt never
   fires once already installed) and no iOS guide (only shown when
   NOT standalone) — a permanent dead end for an actual player.
   display-mode:standalone alone is reliable enough proof of "opened
   from a home-screen icon" (a plain browser tab is never standalone
   regardless of referrer), so that's the only check now. Once
   verified, the pass is remembered so this doesn't need to
   re-evaluate every launch.
   ========================================================= */
const INSTALL_VERIFIED_KEY = 'mkPlayVerifiedInstalledV1';
const isStandaloneDisplay = () =>
  window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent);

function verifiedInstalled() {
  try { return localStorage.getItem(INSTALL_VERIFIED_KEY) === '1'; } catch (e) { return false; }
}
function markVerifiedInstalled() {
  try { localStorage.setItem(INSTALL_VERIFIED_KEY, '1'); } catch (e) {}
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById('installBtn').style.display = 'inline-block';
});

document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
});

function shouldShowInstallGate() {
  if (verifiedInstalled()) return false;
  if (isStandaloneDisplay()) {
    markVerifiedInstalled();
    return false;
  }
  return true;
}

if (shouldShowInstallGate()) {
  if (isIos()) {
    document.getElementById('iosGuide').style.display = 'block';
  }
  document.getElementById('installGate').classList.add('show');
}
</script>
