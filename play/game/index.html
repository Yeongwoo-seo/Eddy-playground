<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · PLAY</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/play/manifest.json">
<link rel="apple-touch-icon" href="https://dhtstqnksjoyyshnhksv.supabase.co/storage/v1/object/public/dev-assets/app-icon/play-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Missing Key">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}

/* ===== Layer 0: frame (mobile viewport, 414x896-ish, safe-area aware) ===== */
/* --vh100 (set via JS from window.innerHeight) overrides dvh/vh when present —
   iOS Safari has a history of miscalculating 100dvh after certain navigation/
   scroll sequences, leaving a stale gap below the frame. */
.vn-frame{position:relative;width:100%;max-width:430px;height:100dvh;height:100vh;height:var(--vh100, 100vh);overflow:hidden;background:#0d1114;touch-action:none}

/* ===== Layer 1: Background ===== */
.bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#0d1114;transition:background-image .2s ease, opacity 1.2s ease}
.bg-layer.bg-placeholder{background-image:linear-gradient(160deg,#171c22 0%,#0d1114 60%,#080a0c 100%)}

/* ===== Top bar (dev only, removable in real game) ===== */
.vn-topbar{position:absolute;top:0;left:0;right:0;z-index:5;padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px;display:flex;justify-content:space-between;align-items:center}
.vn-btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#fff;background:rgba(8,10,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.vn-btn.dev{color:var(--amber);border-color:rgba(214,168,75,.4)}
/* Auto-play badge (see ?autoplay=1) — tapping it stops the auto-advance and
   drops back to normal tap-to-continue play, same look family as .vn-btn.dev
   but cyan to read as "this is the player-facing preview", not a dev tool. */
.vn-btn.auto{color:var(--cyan);border-color:rgba(89,184,200,.45);background:rgba(89,184,200,.16)}
.vn-btn.auto.hidden{display:none}
/* 다음 상호작용(스킵) 버튼 — 대사 스킵 + 다음 선택지/씬으로 즉시 이동.
   실제 플레이(/play/)에서도 항상 노출되는 유일한 우상단 버튼이라
   RealPlayMode.hideDevChrome의 숨김 목록에는 넣지 않는다. */
.vn-btn.skip:active{opacity:.7}

/* ===== Point balance (The Missing Key v1 §4.1/§6.1) — small badge next to
   the CASE FILE ☰ button. Hidden until the player has ever earned points
   (pointsUiIntroduced flag) and on any scene that opts to hide it (e.g. an
   interrogation scene setting hidePoints: true, per §6.1's "심문 화면에서는
   포인트를 숨겨 추리에 집중시켜도 된다") so a fresh 1주차 save doesn't show a
   meaningless "P 0" before the map minigame even explains what it is. */
.point-balance{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--amber);background:rgba(214,168,75,.14);border:1px solid rgba(214,168,75,.4);border-radius:20px;padding:8px 12px;white-space:nowrap}
.point-balance.hidden{display:none}

/* ===== 여행 만족도 / 영우 호감도 게이지 — 상시 표시, 연출용(스토리/엔딩에
   관여하지 않음). 정확한 숫자보다 채움 정도만 읽히게 막대 위주로 표시.
   화면 우상단에 세로 막대로 배치 — 컨테이너 자체는 배경 없이 투명하게 떠
   있고(top bar 버튼열과 겹치지 않도록 그 아래로 내림), 각 막대만 보인다. */
.relation-gauges{position:absolute;top:calc(58px + env(safe-area-inset-top,0));right:16px;z-index:6;display:flex;gap:10px;background:transparent}
.relation-gauges.hidden{display:none}
.gauge-pill{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent}
.gauge-icon{font-size:12px;line-height:1}
.gauge-track{width:6px;height:64px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.gauge-fill{width:100%;border-radius:3px;transition:height .3s cubic-bezier(.2,.8,.2,1)}
.gauge-fill.satisfaction{background:var(--cyan)}
.gauge-fill.affection{background:#E8749E}

/* ===== Layer 2: Character ===== */
/* bottom is kept in sync with .dlg-layer's actual rendered height by
   syncCharWrapBottom (a ResizeObserver on #dlgLayer) — so the character's
   feet (align-items:flex-end) land right at the dialogue box's top edge
   instead of the screen bottom, which used to hide the lower portion of the
   character behind the box (.bottom-stack's z-index:3 sits above char-wrap).
   26vh here is just the initial guess (.dlg-layer's own min-height) before
   the observer's first measurement runs. */
.char-wrap{position:absolute;top:0;left:0;right:0;bottom:26vh;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s ease,bottom .3s cubic-bezier(0.2,0.8,0.2,1)}
/* max-height/height are in vh, not % — char-wrap's own box height now
   shrinks to make room for the dialogue box above (see .char-wrap), and a %
   here would resolve against that shrunk box, quietly scaling the character
   down every time the dialogue box grows. vh keeps the size anchored to the
   true viewport height regardless of how tall .dlg-layer currently is. */
.char-img{max-height:78vh;max-width:88%;object-fit:contain;object-position:bottom;transform:translateY(0)}
.char-placeholder{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:46%;height:62vh;opacity:.4;display:flex;align-items:flex-end;justify-content:center;color:var(--text-secondary)}
.char-placeholder svg{width:100%;height:100%}

/* ===== Layer 3: Dialogue ===== */
/* .bottom-stack owns the bottom-anchored positioning that .dlg-layer used to
   have on its own. Choice prompts render in the separate, absolutely
   positioned .choice-layer (see below) that overlays the dimmed scene (see
   .scene-dim) above the dialogue box, like an Ace Attorney ("역전재판")
   choice/evidence popup. */
.bottom-stack{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column}
.dlg-layer{min-height:26vh;max-height:34vh;background:rgba(5,7,10,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.08);padding:18px 20px calc(18px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;flex-shrink:0;cursor:pointer}
.dlg-name{font-size:15px;font-weight:700;color:var(--cyan);margin-bottom:8px;flex-shrink:0}
.dlg-name:empty{display:none}
.dlg-body{flex:1;font-size:16px;line-height:1.65;color:#fff;overflow-y:auto;white-space:pre-wrap;word-break:keep-all;touch-action:pan-y;transition:color .2s ease}
/* Applied while a choice prompt is up (see showChoices) so the question
   itself reads as "this line has a decision attached", per the brief. */
.dlg-body.is-question{color:var(--cyan)}
.dlg-foot{display:flex;justify-content:flex-end;padding-top:6px;flex-shrink:0}
.dlg-arrow{font-size:13px;color:var(--text-secondary);visibility:hidden}
@keyframes arrowBob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.dlg-arrow.show{visibility:visible;animation:arrowBob 1.1s ease-in-out infinite}
.dlg-end{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);letter-spacing:.08em;text-align:center;padding-top:8px}
.dlg-layer.has-interactive{max-height:48vh}

/* ===== Layer 2b: scene dim — darkens the background/character behind a
   choice prompt (z-index 2, between bg/char and .bottom-stack's 3) so the
   floating choice buttons and the dialogue box below them stay legible. ===== */
.scene-dim{position:absolute;inset:0;z-index:2;background:rgba(0,0,0,.78);opacity:0;pointer-events:none;transition:opacity .25s ease}
.scene-dim.show{opacity:1}

/* ===== Layer 3b: dialogue choices — floats over the dimmed area ABOVE the
   dialogue box (area A: everything above .dlg-layer), not glued to it.
   .choice-layer spans that whole area (top:0, bottom synced to the dialogue
   box's live height by syncChoiceLayerBottom) and centers its buttons inside
   it, then nudges the whole stack down via translateY so it sits a bit lower
   than dead-center in A (closer to the dialogue box it's answering, further
   from the empty space up top) without giving up the padding's minimum-gap
   guarantee at either edge. The layer itself ignores taps outside the
   buttons (pointer-events:none) so the dimmed backdrop underneath still
   reads as backdrop, not a hit-target; only the buttons re-enable
   pointer-events. */
.choice-layer{position:absolute;left:0;right:0;top:0;bottom:34vh;z-index:3;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px 20px;pointer-events:none;transform:translateY(48px)}
.choice-layer.hidden{display:none}
@keyframes choiceIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.choice-btn{pointer-events:auto;flex-shrink:0;background:rgba(8,10,12,.88);border:1px solid rgba(89,184,200,.5);color:var(--text-primary);border-radius:14px;padding:14px 16px;font-size:14.5px;font-weight:600;font-family:var(--sans);text-align:center;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35);opacity:0;animation:choiceIn 1.2s cubic-bezier(0.2,0.8,0.2,1) forwards}
.choice-btn:active{opacity:.7;background:rgba(89,184,200,.2)}

/* ===== Layer 3c: "present evidence" call-to-action, appears above the dialogue box ===== */
.evidence-cta{padding-top:10px;flex-shrink:0}
.evidence-cta.hidden{display:none}
.evidence-cta button{width:100%;font-family:var(--mono);font-size:12.5px;letter-spacing:.05em;color:#06181c;background:var(--cyan);border:none;border-radius:14px;padding:12px;font-weight:700;cursor:pointer}
.evidence-cta button:active{opacity:.8}

/* ===== Evidence picker sheet (§Phase 4 — cards rendered by CaseEntryUI.js) ===== */
.evidence-sheet-list{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow-y:auto;touch-action:pan-y;margin-bottom:14px}

/* ===== Small transient toast for evidence-submission feedback ===== */
.evidence-toast{position:absolute;left:50%;bottom:calc(36vh + 10px);transform:translateX(-50%) translateY(8px);z-index:21;background:rgba(8,10,12,.94);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 16px;font-size:13px;color:#fff;opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;max-width:80%;text-align:center}
.evidence-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.evidence-toast.wrong{border-color:rgba(217,65,65,.5);color:#ffb4b4}
.evidence-toast.correct{border-color:rgba(29,184,71,.5);color:#9EF0B0}

/* ===== Bottom sheet: dev asset selector ===== */
.sheet-overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-overlay.hidden{display:none}
.sheet{width:100%;max-width:430px;background:var(--surface-1);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0));border-top:1px solid var(--divider)}
.sheet-title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-muted);margin-bottom:16px;text-transform:uppercase}
.sheet-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-title-row .sheet-title{margin-bottom:0}
.sheet-notebook-btn{font-family:var(--mono);font-size:11px;font-weight:700;color:#e9c467;background:rgba(214,168,75,.12);border:1px solid rgba(214,168,75,.4);border-radius:20px;padding:8px 12px;cursor:pointer;min-height:36px}
.sheet-notebook-btn:active{opacity:.8}
.sheet-field{margin-bottom:14px}
.sheet-field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase}
.sheet-field select{width:100%;background:var(--surface-2);color:var(--text-primary);border:1px solid var(--divider);border-radius:10px;padding:12px 14px;font-size:14px;font-family:inherit}
.sheet-close{width:100%;margin-top:6px;background:var(--surface-2);color:var(--text-primary);border:1px solid var(--divider);border-radius:10px;padding:13px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--mono);letter-spacing:.06em}
.sheet-link{display:block;text-align:center;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--text-muted)}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sheet-btn{background:var(--surface-2);color:var(--text-primary);border:1px solid var(--divider);border-radius:10px;padding:11px 8px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--mono)}
.sheet-btn.danger{color:#D94141;border-color:rgba(217,65,65,.4)}

/* ===== Black overlay for minigame-start / autoplay-complete cards ===== */
.intro-overlay{position:absolute;inset:0;z-index:9;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
.intro-overlay.hidden{opacity:0;pointer-events:none}
.intro-card{font-family:var(--mono);color:#fff;font-size:20px;letter-spacing:.18em;text-align:center;line-height:1.9;white-space:pre-line}

/* ===== Scene-internal 장소 이동 (다크→라이트) transition — same 암전 후
   밝아지는 fade play/explore/index.html's moveTo() uses for hub moves, so a
   씬 안에서 onSceneTransition으로 장소가 바뀔 때도(playSceneTransition) 배경이
   바뀌는 컷이 그대로 드러나지 않는다. z-index 11 — transform-popup(10) 위,
   sheet-overlay(20) 아래. 페이드 길이는 js의 MOVE_FADE_MS와 맞춰뒀다 — 여기
   숫자만 따로 바꾸면 안 맞는다. */
.move-fade{position:absolute;inset:0;z-index:11;background:#000;opacity:0;pointer-events:none;transition:opacity .6s cubic-bezier(0.2,0.8,0.2,1)}
.move-fade.show{opacity:1;pointer-events:auto}
/* 완전히 암전된 동안만 뜨는 장소명 타이핑 카드 — dialogueData.js의
   sceneTransition.introLabel을 타자기로 보여준다. 예전엔 introLabel+time을
   같이 typing했는데, 지금은 장소명(introLabel)만 — time은 의도적으로 뺐다. */
.move-fade-label{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:var(--mono);color:#fff;font-size:20px;letter-spacing:.18em;opacity:0;transition:opacity .3s ease}
.move-fade-label.show{opacity:1}

/* ===== Closing beat: fade to black + a small unexplained flash ===== */
.ending-fade .bg-layer{opacity:0}
.unknown-signal{position:absolute;bottom:calc(26vh + 14px);right:16px;z-index:6;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:rgba(255,255,255,.4);opacity:0;transition:opacity .3s ease}
.unknown-signal.show{opacity:1}
</style>
<script>
// iOS Safari's 100dvh has a history of getting stuck at a stale (too-small)
// value after certain navigation/scroll sequences, leaving a dead gap below
// the frame. window.innerHeight doesn't have that bug, so measure it
// ourselves and let --vh100 win over dvh/vh in the CSS below.
function setVh100() {
  document.documentElement.style.setProperty('--vh100', window.innerHeight + 'px');
}
setVh100();
window.addEventListener('resize', setVh100);
window.addEventListener('orientationchange', setVh100);
// NOT window.visualViewport's 'resize' — iOS Safari's dynamic toolbar
// (address bar) hides/shows in response to plain taps (e.g. tapping to
// advance dialogue), firing visualViewport resize each time and making
// --vh100 (and the frame's height with it) visibly jump up/down mid-tap.
// window/orientationchange above already cover real layout changes.
</script>
</head>
<body>
<div class="vn-frame" id="frame">
  <div class="bg-layer bg-placeholder" id="bgLayer"></div>

  <div class="char-wrap" id="charWrap">
    <img class="char-img" id="charImg" style="display:none" alt="">
    <div class="char-placeholder" id="charPlaceholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
    </div>
  </div>

  <div class="scene-dim" id="sceneDim"></div>
  <div class="choice-layer hidden" id="choiceLayer"></div>

  <div class="vn-topbar">
    <div style="display:flex;gap:8px;align-items:center">
      <span id="caseMenuMount"></span>
      <span class="point-balance hidden" id="pointBalance">P 0</span>
      <a class="vn-btn" href="/dev/">← DEV</a>
    </div>
    <div style="display:flex;gap:8px">
      <button class="vn-btn skip" id="skipBtn" aria-label="다음 상호작용">다음 ⏭</button>
      <a class="vn-btn dev-settings-link" id="settingsLink" href="/dev/upload/" aria-label="설정">⚙ 설정</a>
      <button class="vn-btn auto hidden" id="autoplayBtn">AUTO ⏸ 정지</button>
      <button class="vn-btn dev" id="devBtn">DEV</button>
    </div>
  </div>

  <span class="relation-gauges" id="relationGauges">
    <span class="gauge-pill" title="여행 만족도"><span class="gauge-icon">✨</span><span class="gauge-track"><span class="gauge-fill satisfaction" id="satisfactionFill"></span></span></span>
    <span class="gauge-pill" title="영우 호감도"><span class="gauge-icon">💛</span><span class="gauge-track"><span class="gauge-fill affection" id="affectionFill"></span></span></span>
  </span>

  <div class="bottom-stack" id="bottomStack">
    <div class="dlg-layer" id="dlgLayer">
      <div class="dlg-name" id="speakerName"></div>
      <div class="dlg-body" id="dialogueText"></div>
      <div class="dlg-foot"><span class="dlg-arrow" id="tapArrow">▼</span></div>
      <div class="evidence-cta hidden" id="evidenceCta"><button id="evidenceCtaBtn">🔍 증거 제시하기</button></div>
    </div>
  </div>

  <span class="evidence-toast" id="evidenceToast"></span>
  <span class="unknown-signal" id="unknownSignal">UNKNOWN SIGNAL</span>

  <div class="intro-overlay" id="introOverlay">
    <div class="intro-card" id="introCard"></div>
  </div>

  <div class="move-fade" id="moveFade">
    <div class="move-fade-label" id="moveFadeLabel"></div>
  </div>
</div>

<!-- Scene BGM (사운드 tab, /dev/upload) streams straight from YouTube's own
     embedded player rather than a downloaded file — see youtubeSound.js —
     mounted 1x1 and off-screen since only the audio matters here. -->
<div id="bgmMount" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden"></div>

<div class="sheet-overlay hidden" id="sheetOverlay">
  <div class="sheet">
    <div class="sheet-title">Dev · Asset Selector</div>
    <div class="sheet-field">
      <label>Background</label>
      <select id="bgSelect"></select>
    </div>

    <div class="sheet-title">Dev · Case File</div>
    <div class="sheet-grid">
      <button class="sheet-btn" id="btnOpenCaseMenu">OPEN CASE MENU</button>
      <button class="sheet-btn" id="btnGiveKeyEvidence">GIVE UNKNOWN KEY</button>
      <button class="sheet-btn" id="btnAddSampleEvidence">ADD SAMPLE EVIDENCE</button>
      <button class="sheet-btn" id="btnAddSampleQuestion">ADD SAMPLE QUESTION</button>
      <button class="sheet-btn" id="btnMarkQuestionPartial">MARK Q PARTIAL</button>
      <button class="sheet-btn" id="btnMarkQuestionResolved">MARK Q RESOLVED</button>
      <button class="sheet-btn" id="btnAddSamplePerson">ADD SAMPLE PERSON</button>
      <button class="sheet-btn" id="btnUnlockMapLocation">UNLOCK MAP LOC</button>
      <button class="sheet-btn" id="btnAddInventoryItem">ADD INVENTORY ITEM</button>
      <button class="sheet-btn danger" id="btnClearCaseData">CLEAR CASE DATA</button>
    </div>

    <div class="sheet-title">Dev · 추론 (The Missing Key v4 §18)</div>
    <div class="sheet-grid">
      <button class="sheet-btn" id="btnForceHypothesis">FORCE SAMPLE HYPOTHESIS</button>
      <button class="sheet-btn" id="btnForceFact">FORCE SAMPLE FACT</button>
      <button class="sheet-btn" id="btnDumpBoard">DUMP CASE BOARD</button>
      <button class="sheet-btn" id="btnDumpHypothesisHistory">DUMP HYPOTHESIS HISTORY</button>
    </div>

    <div class="sheet-title">Dev · 포인트·상점·옷장 (The Missing Key v1 §24)</div>
    <div class="sheet-grid">
      <button class="sheet-btn" id="btnAddPoints100">POINTS +100</button>
      <button class="sheet-btn" id="btnSubPoints100">POINTS −100</button>
      <button class="sheet-btn" id="btnForceUnlockShop">FORCE UNLOCK SHOP</button>
      <button class="sheet-btn" id="btnUnlockAllShopItems">UNLOCK ALL ITEMS</button>

function setBackground(asset) {
  if (asset && asset.dataUrl) {
    el.bgLayer.style.backgroundImage = `url(${asset.dataUrl})`;
    el.bgLayer.classList.remove('bg-placeholder');
  } else {

  }
}

function setCharacterAsset(asset) {
  if (asset && asset.dataUrl) {
    el.charImg.src = asset.dataUrl;
    el.charImg.style.display = '';
    el.charPlaceholder.style.display = 'none';
  } else {
    el.charImg.removeAttribute('src');
    el.charImg.style.display = 'none';
    el.charPlaceholder.style.display = '';
  }
}

// `backgroundKey` defaults to the scene's own id — pass a different key
// (e.g. a location-segment key from scene.locations) to swap in a
// different background without leaving the scene, for playSceneTransition.
async function applyBackground(backgroundKey) {
  // A failed asset fetch (network hiccup, missing upload) must degrade to
  // the placeholder background instead of throwing — callers await this
  // ahead of vnPlayer's scene-transition resume, so an uncaught rejection
  // here would leave the player permanently stuck (tap() disabled forever —
  // see vnPlayer.js).
  let bgAsset = null;
  try {
    const bgId = await DevGameState.getBackgroundId(backgroundKey || activeSceneData.id);
    bgAsset = await AssetDB.getAsset(bgId);
    if (bgAsset) await AssetDB.preloadImage(bgAsset.dataUrl);
  } catch (err) {
    console.error('applyBackground failed, falling back to placeholder', err);
    bgAsset = null;
  }
  setBackground(bgAsset);
}

/* ===== Scene BGM (사운드 tab, /dev/upload) — a scene can have a 'bgm'-kind
   sound catalog entry assigned via DevGameState.getSceneBgmId; when it does,
   this streams that YouTube clip on loop for as long as the scene is active.
   Starts muted+autoplay (required for autoplay to work at all without a user
   gesture) and unmutes on the player's first tap — same "start muted, ask
   forgiveness on first interaction" pattern most embedded video/audio uses
   to get around browser autoplay restrictions. ===== */
let bgmPlayer = null;
let bgmUnlocked = false;
let desiredBgmOn = CaseFileState.getSettings().bgm;

async function applyBgm() {
  const soundId = await DevGameState.getSceneBgmId(activeSceneData.id);
  if (!soundId) return;
  let sounds;
  try { sounds = await AssetDB.getSounds(); } catch (e) { return; }
  const def = sounds[soundId];
  if (!def) return;
  bgmPlayer = createYTSoundPlayer(el.bgmMount, {
    videoId: def.videoId, start: def.start, end: def.end, loop: true, muted: true,
    onError: (message) => {
      DevDiag.show('씬 BGM 재생 실패: ' + message);
      bgmPlayer = null;
    },
  });
}

function unlockBgmOnFirstTap() {
  if (bgmUnlocked) return;
  bgmUnlocked = true;
  if (bgmPlayer && desiredBgmOn) bgmPlayer.unMute();
}

// Warms both the metadata cache and the browser's own image cache for every
// (character, expression) pair a line might show, before the first line is
// shown — a mid-dialogue character/expression swap then never waits on the
// network, which is what made the character portrait visibly lag behind the
// text. Resolution has to mirror applyCharacterForLine's exactly (a forced
// outfit via WardrobeState.resolveOutfitForScene, falling back to the base
// characterId) — this used to skip the outfit lookup and warm only the base
// portrait, so any scene showing an equipped outfit's art still hit the
// network the first time that (outfit, expression) pair came up, no matter
// how early this ran. Batched through getAssetsByIds (one metadata round
// trip) instead of one getAsset call per pair, same as WeekPreloader's own
// collectCharacterAssetIds below.
async function preloadCharacterAssetsForLines(lines) {
  const pairs = new Map();
  lines.forEach(l => {
    if (!l.characterId) return;
    pairs.set(`${l.characterId}::${l.expression || 'neutral'}`, l);
  });
  const idLookups = await Promise.allSettled([...pairs.values()].map(async l => {
    const expression = l.expression || 'neutral';
    let forcedOutfit = null;
    if (typeof WardrobeState !== 'undefined') {
      try {
        const resolution = WardrobeState.resolveOutfitForScene(l.characterId, {
          outfitMode: activeSceneData.outfitMode, storyOutfitId: activeSceneData.storyOutfitId,
        });
        if (resolution.hidden) return [];
        forcedOutfit = resolution.outfit;
      } catch (e) { /* fall back to the base characterId below */ }
    }
    const [outfitAssetId, baseAssetId] = await Promise.all([
      forcedOutfit
        ? DevGameState.getCharacterAssetIdForOutfit(l.characterId, forcedOutfit, expression)
        : DevGameState.getCharacterAssetId(l.characterId, expression),
      DevGameState.getCharacterAssetId(l.characterId, expression),
    ]);
    return [outfitAssetId, baseAssetId];
  }));
  const assetIds = new Set(
    idLookups
      .filter(r => r.status === 'fulfilled')
      .flatMap(r => r.value)
      .filter(Boolean)
  );
  const assets = assetIds.size ? await AssetDB.getAssetsByIds([...assetIds]) : [];
  await Promise.all(assets.map(a => (a && a.dataUrl) ? AssetDB.preloadImage(a.dataUrl) : Promise.resolve()));
}

function applyTransformToImage(transform) {
  el.charImg.style.transform = `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`;
}

// Each named character (from dialogueCharacters) has its own uploaded asset
// per expression, and its own CharacterTransform (x/y/scale) — looked up per
// dialogue line's (characterId, expression) pair.
//
// applyCharacterForLine is async (AssetDB.getAsset can hit the network on a
// cache miss), and onLineChange fires again on every tap — so a fast tapper
// could have an older call's fetch resolve *after* a newer line has already
// changed the speaker, painting the wrong character's portrait over the
// current line (a.k.a. 지수 말하는데 영우 얼굴 뜨는 버그). charRequestToken
// makes each call check, once its awaits resolve, whether it's still the
// most recent request before touching the DOM.
let charRequestToken = 0;
// The Missing Key v1 §5.5 — a scene can carry outfitMode: 'equipped' (default,
// whatever's currently equipped in WardrobeState) | 'story_locked' (force
// scene.storyOutfitId regardless of equip state) | 'hidden' (no portrait at
// all). WardrobeState.resolveOutfitForScene maps that + characterId to the
// vnOutfitId to force, if any (an outfit's art lives under 지수's own VN
// outfit slots — DevGameState.getCharacterAssetIdForOutfit looks up a specific
// slot regardless of what's currently selected for gameplay). If nothing's
// been uploaded yet for that slot, this falls back to the base characterId's
// own portrait so a scene never goes blank just because an outfit's art
// hasn't been drawn/uploaded (spec §19.2's "의상이 갑자기 기본 의상으로
// 돌아가는 현상은 피해야 한다" is about *mid-scene* swaps, not "no art yet").
async function applyCharacterForLine(characterId, expression) {
  const requestToken = ++charRequestToken;
  if (!characterId) {
    el.charWrap.style.opacity = '0';
    return;
  }
  const outfitResolution = (typeof WardrobeState !== 'undefined')
    ? WardrobeState.resolveOutfitForScene(characterId, { outfitMode: activeSceneData.outfitMode, storyOutfitId: activeSceneData.storyOutfitId })
    : { characterId, outfit: null, hidden: false };
  if (outfitResolution.hidden) {
    el.charWrap.style.opacity = '0';
    return;
  }
  el.charWrap.style.opacity = '1';
  const outfitAssetId = outfitResolution.outfit
    ? await DevGameState.getCharacterAssetIdForOutfit(characterId, outfitResolution.outfit, expression)
    : await DevGameState.getCharacterAssetId(characterId, expression);
  if (requestToken !== charRequestToken) return; // superseded by a later line change
  let asset = outfitAssetId ? await AssetDB.getAsset(outfitAssetId) : null;
  if (requestToken !== charRequestToken) return;
  if (!asset && outfitResolution.outfit) {
    const baseAssetId = await DevGameState.getCharacterAssetId(characterId, expression);
    if (requestToken !== charRequestToken) return;
    asset = baseAssetId ? await AssetDB.getAsset(baseAssetId) : null;
  }
  if (requestToken !== charRequestToken) return; // superseded by a later line change
  setCharacterAsset(asset);
  // Transform is always keyed by the *base* characterId (see
  // DevGameState._transformKeyFor) — an outfit variant isn't a registered
  // dialogue character, so it has no transform entry of its own and isn't
  // meant to (position/scale is a per-character tune, not per-outfit).
  const transform = await DevGameState.getCharacterTransform(characterId);
  if (requestToken !== charRequestToken) return; // stale transform must not move the new character's portrait
  applyTransformToImage(transform);
}

function updateArrow(show) {
  el.tapArrow.classList.toggle('show', !!show);
}

// Mid-scene location change inside a merged, multi-location scene (see
// dialogueData.js lines carrying a `sceneTransition` marker, e.g.
// week1-scene-flight/week1-scene-002-1) — vnPlayer.js awaits this before
// typing that line's text. Fades to black, types the new location's name
// (transition.introLabel — not transition.time; that field still exists on
// every sceneTransition marker but is deliberately left unused here, same
// as before) while the screen is fully covered, swaps in the new
// background (stored under its own virtual scene-id key, same
// one-slot-per-id pattern minigameId already uses) behind it, then fades
// back in.
const MOVE_FADE_MS = 600; // matches .move-fade's CSS transition duration above
const MOVE_LABEL_TYPE_SPEED_MS = 55;
const MOVE_LABEL_HOLD_MS = 450; // beat to actually read the label once typed

function typeMoveFadeLabel(text) {
  return new Promise(resolve => {
    el.moveFadeLabel.textContent = '';
    if (!text) { resolve(); return; }
    el.moveFadeLabel.classList.add('show');
    let i = 0;
    const timer = setInterval(() => {
      i++;
      el.moveFadeLabel.textContent = text.slice(0, i);
      if (i >= text.length) {
        clearInterval(timer);
        setTimeout(resolve, MOVE_LABEL_HOLD_MS);
      }
    }, MOVE_LABEL_TYPE_SPEED_MS);
  });
}

async function playSceneTransition(transition) {
  el.moveFade.classList.add('show');
  await new Promise(r => setTimeout(r, MOVE_FADE_MS));
  await typeMoveFadeLabel(transition.introLabel);
  await applyBackground(transition.backgroundKey);
  el.moveFadeLabel.classList.remove('show');
  requestAnimationFrame(() => el.moveFade.classList.remove('show'));
}

// 마지막 대사 직전: 배경이 서서히 어두워지고, 짧은 진동과 함께 화면 우측 아래에
// "UNKNOWN SIGNAL"이 아주 잠깐 떴다 사라진다. 지수·영우는 알아채지 못한다 —
// 공포 연출이나 과도한 글리치 없이, 플레이어만 위화감을 느끼는 정도로.
function playEndingSequence() {
  el.frame.classList.add('ending-fade');
  if (navigator.vibrate && CaseFileState.getSettings().vibration) navigator.vibrate(150);
  setTimeout(() => {
    el.unknownSignal.classList.add('show');
    setTimeout(() => el.unknownSignal.classList.remove('show'), 700);
  }, 900);
}

// week1-scene-002-3 (1주차's last scene, "1주차 종료.") is the only week1
// scene left with no nextSceneId, so it's the only one that loops
// (onComplete -> restart()) and gets this "UNKNOWN SIGNAL" foreshadowing
// beat on every loop. Every other scene now chains into the next one via
// nextSceneId (see dialogueData.js) so a real playthrough (시작하기 on
// /play/) taps straight through 1주차 instead of stopping at each
// scene boundary — that handoff skips this beat, since it's tonally
// specific to 1주차's actual ending, not a generic one.
//
// Each built minigame gets its own standalone page (not routed through
// /play/game, since gameplay differs too much from tap-to-advance dialogue).
// MINIGAME_ROUTES/SHOP_TUTORIAL_RETURN_SCENE now live in
// /dev/data/sceneRoutes.js (shared with play/explore/index.html's inline
// scene player) — see that file. A nextSceneId with no route there and no
// matching VN scene isn't built yet, so it just shows a placeholder overlay
// instead of navigating to a dead page.

// Most nextSceneId handoffs are into a minigame (MINIGAME_ROUTES above), but
// a plain location change with no minigame in between — e.g.
// week1-scene-flight -> week1-scene-001-2 — hands off straight to another
// VN scene instead, so a real playthrough (시작하기 on /play/) taps
// through the whole week without stopping at every scene boundary.
function playMinigameTransition(nextSceneId) {
  const route = MINIGAME_ROUTES[nextSceneId];
  if (route) {
    if (SHOP_TUTORIAL_RETURN_SCENE[nextSceneId]) {
      sessionStorage.setItem('mkShopReturnUrl', `/play/game/?scene=${encodeURIComponent(SHOP_TUTORIAL_RETURN_SCENE[nextSceneId])}`);
    }
    location.href = route;
    return;
  }
  if (allScenes.some(s => s.id === nextSceneId)) {
    // Carry autoplay through the chain as long as the next stop is another
    // plain VN scene — the moment nextSceneId resolves to a minigame/hub
    // route above instead, autoplay has nothing left to script (those need
    // real input), so this suffix is simply omitted and that navigation
    // lands there in normal manual mode.
    const suffix = autoplayOn ? `&autoplay=1&week=${encodeURIComponent(autoplayWeek)}` : '';
    location.href = `/play/game/?scene=${encodeURIComponent(nextSceneId)}${suffix}`;
    return;
  }
  el.introCard.textContent = 'MINIGAME START';
  el.introOverlay.classList.remove('hidden');
  console.log('[OPERATION MK] scene complete -> nextSceneId:', nextSceneId, '(not yet built)');
}

/* ===== Choice / evidence-presentation — turns a line into an interactive
   beat instead of tap-to-advance. See dev/vnPlayer.js for the engine side
   (line.type 'choice' | 'evidence', line.effects, line.goto). ===== */

// A scene author's `effects` array is a small host-defined vocabulary of
// CaseFileState mutations — kept here (not in vnPlayer.js) so the shared
// engine stays free of any dependency on the case-file data model.
function applyEffect(effect) {
  switch (effect.type) {
    case 'addEvidence':
      CaseFileState.addEvidence(effect.evidence);
      break;
    case 'addQuestion': {
      const added = CaseFileState.addQuestion(effect.question);
      if (added) caseMenu.notifyNewQuestion(effect.question.title);
      break;
    }
    case 'setQuestionStatus':
      CaseFileState.setQuestionStatus(effect.id, effect.status, effect.resolutionText);
      break;
    case 'addPerson':
      CaseFileState.addPerson(effect.person);
      break;
    case 'setPersonStatus':
      CaseFileState.setPersonStatus(effect.id, effect.status, effect.patch);
      break;
    case 'addInventoryItem':
      CaseFileState.addInventoryItem(effect.id);
      break;
    case 'unlockMapLocation':
      CaseFileState.unlockMapLocation(effect.id);
      break;
    case 'setFlag':
      CaseFileState.setFlag(effect.key, effect.value);
      break;
    case 'incrementFlag':
      CaseFileState.incrementFlag(effect.key);
      break;
    // The Missing Key v4 §6/§7 추론 시스템 — a `choice`'s effects sets the
    // player's current hypothesis for a question without revealing whether
    // it's right (mode:'hypothesis' choices never carry a correctGoto-style
    // reveal; see caseMenu's questionStatusLabel for the "잠정 결론" framing).
    case 'setHypothesis':
      CaseFileState.setHypothesis(effect.questionId, effect.hypothesis);
      caseMenu.notifyHypothesis(effect.hypothesis.text);
      break;
    // A pair-evidence connection's payoff (§7.3's "두 번 연속 evidence" pattern)
    // — attached to the line reached after the *second* correct presentEvidence.
    case 'addFact': {
      const added = CaseFileState.addFact(effect.fact);
      if (added) caseMenu.notifyFact(effect.fact.title);
      break;
    }
    case 'invalidateHypothesis':
      CaseFileState.invalidateCurrentHypothesis(effect.questionId, effect.factId);
      break;
    // setFlagIfAll — derives an aggregate flag (e.g. "every required hotspot
    // in this scene visited") from several independent ones, since a scene's
    // required hotspots can be visited in any order and no single visit
    // "knows" it was the last one needed. Safe to re-run on every visit.
    case 'setFlagIfAll':
      if (effect.flags.every(f => CaseFileState.hasFlag(f))) CaseFileState.setFlag(effect.key, true);
      break;

    /* ===== The Missing Key v1 §4/§5/§15 — 포인트·상점·옷장 이펙트 =====
       비수사 미니게임 보상은 각 미니게임 페이지 자신이 EconomyState를 직접
       호출한다 (별도 페이지라 이 switch를 안 거침) — 여기 addPoints는 VN
       씬(대사) 안에서 직접 포인트를 지급/차감하는 경우, 그리고 스토리 흐름에서
       상점을 해금하는 경우를 위한 것이다. §4.1 판정 기준: 수사 진행에 쓰이는
       scene의 effects에는 이 타입을 절대 넣지 않는다. */
    case 'addPoints': {
      const meta = { source: effect.source || effect.rewardId || activeSceneData.id };
      let paid;
      if (effect.policy === 'chapter_capped') {
        paid = EconomyState.claimChapterCappedReward(effect.chapterId || activeSceneData.id, effect.sourceType || effect.rewardId || 'reward', effect.amount, effect.weeklyCap || effect.amount, meta);
      } else if (effect.rewardId) {
        paid = EconomyState.claimReward(effect.rewardId, effect.amount, meta);
      } else {
        EconomyState.addPoints(effect.amount, meta);
        paid = effect.amount;
      }
      if (paid > 0) {
        CaseFileState.setFlag('pointsUiIntroduced', true);
        caseMenu.notifyPoints(paid);
      }
      updatePointBalance();
      break;
    }
    case 'spendPoints':
      EconomyState.spendPoints(effect.amount, { source: effect.source || activeSceneData.id });
      updatePointBalance();
      break;

    // 여행 만족도 / 영우 호감도 — 연출용 게이지(§ 위 relationshipState.js 참고).
    // 수사 로직·엔딩 분기는 절대 이 값을 읽지 않는다.
    case 'addSatisfaction':
      RelationshipState.addSatisfaction(effect.amount);
      if (effect.amount) caseMenu.notifySatisfaction(effect.amount);
      updateRelationshipGauges();
      break;
    case 'addAffection':
      RelationshipState.addAffection(effect.amount);
      if (effect.amount) caseMenu.notifyAffection(effect.amount);
      updateRelationshipGauges();
      break;
    case 'unlockShop':
      ShopState.unlockShop();
      updatePointBalance();
      break;
    case 'unlockShopItem':
      ShopState.unlockShopItem(effect.itemId);
      break;
    case 'unlockShopItems':
      ShopState.unlockShopItems(effect.itemIds);
      break;
    case 'unlockWardrobe':
      WardrobeState.unlockWardrobe();
      break;
    case 'purchaseOutfit':
      ShopState.purchaseShopItem(effect.itemId);
      updatePointBalance();
      break;
    case 'equipOutfit':
      WardrobeState.equipOutfit(effect.itemId);
      break;

    /* ===== The Missing Key v1 §15 — 탐색 허브 이펙트 =====
       These only update ExplorationState (persisted, read by /play/explore/)
       — they don't navigate there themselves. A scene that wants to actually
       hand off into the hub after setting these still needs its line's
       nextSceneId to resolve through MINIGAME_ROUTES to '/play/explore/',
       same pattern the shop hand-off already uses. */
    case 'enterExplorationPhase':
      ExplorationState.enterExplorationPhase(effect.phaseId, effect.startLocationId);
      break;
    case 'unlockLocation':
      ExplorationState.unlockLocation(effect.locationId);
      break;
    case 'moveToLocation':
      ExplorationState.moveToLocation(effect.locationId);
      break;
    case 'setInteractionState':
      ExplorationState.setInteractionState(effect.interactionId, effect.state);
      break;
    case 'refreshInteraction':
      ExplorationState.refreshInteractionsByFact(effect.factId);
      break;
    case 'returnToExploration': {
      const qs = new URLSearchParams();
      if (effect.phaseId) qs.set('phase', effect.phaseId);
      if (effect.locationId) qs.set('location', effect.locationId);
      const query = qs.toString();
      location.href = '/play/explore/' + (query ? '?' + query : '');
      break;
    }
  }
}

// 2주차 장편 확장 v2 §22 — a choice's optional `condition` gates whether it's
// even offered: { hasEvidence: [...] } requires every id already in the case
// file, { flags: [...] } requires every flag truthy (see CaseFileState.flags),
// { personStatus: { personId: status } } requires an exact status match.
// Undecorated choices (no `condition`) always show — this is purely additive,
// existing scenes with plain choices behave exactly as before.
function evaluateCondition(cond) {
  if (!cond) return true;
  if (cond.hasEvidence) {
    const ids = new Set(CaseFileState.getEvidence().map(e => e.id));
    if (!cond.hasEvidence.every(id => ids.has(id))) return false;
  }
  if (cond.flags && !cond.flags.every(f => CaseFileState.hasFlag(f))) return false;
  // flagAtLeast — numeric threshold on a counter flag (e.g. an
  // incrementFlag'd optional-hotspot count), since plain `flags` only checks
  // truthiness and can't distinguish "visited once" from "visited 3+ times".
  // A never-incremented counter flag is `undefined`, and Number(undefined)
  // is NaN — which fails *every* comparison (>=, <), silently hiding a
  // choice gated on flagAtLeast/flagBelow that should have been visible.
  // `|| 0` makes an untouched counter read as a real zero.
  if (cond.flagAtLeast && !((Number(CaseFileState.getFlag(cond.flagAtLeast.key)) || 0) >= cond.flagAtLeast.min)) return false;
  // flagBelow — exact complement of flagAtLeast, so an author can offer two
  // choices that are always mutually exclusive (exactly one visible) instead
  // of both showing whenever the threshold is met.
  if (cond.flagBelow && !((Number(CaseFileState.getFlag(cond.flagBelow.key)) || 0) < cond.flagBelow.lessThan)) return false;
  // flagEquals — exact-value match on a string flag (setHypothesis effects
  // also mirror the chosen hypothesis id into flags['hyp:<questionId>'], see
  // caseFileState.js), so a later scene can offer an extra choice only when
  // the player's *current* hypothesis on some question is a specific one —
  // e.g. only surface a "그럼 지금까지의 판단은?" contradiction beat when the
  // player actually holds the hypothesis that fact is about to contradict.
  if (cond.flagEquals && CaseFileState.getFlag(cond.flagEquals.key) !== cond.flagEquals.value) return false;
  if (cond.personStatus) {
    const persons = CaseFileState.getPersons();
    for (const personId in cond.personStatus) {
      const p = persons.find(p => p.id === personId);
      if (!p || p.status !== cond.personStatus[personId]) return false;
    }
  }
  return true;
}

function clearInteractiveLayers() {
  el.dlgLayer.classList.remove('has-interactive');
  el.choiceLayer.classList.add('hidden');
  el.choiceLayer.innerHTML = '';
  el.sceneDim.classList.remove('show');
  el.dialogueText.classList.remove('is-question');
  el.evidenceCta.classList.add('hidden');
}

// .choice-layer's `bottom` has to match the dialogue box's actual rendered
// height (not a fixed vh guess) — .dlg-layer's height varies with its text
// (min-height:26vh, max-height:34vh) — so the choice area (top:0 to this
// bottom) is exactly "area A" and the centered button stack's vertical
// center lands on A's real center, not an approximation.
function syncChoiceLayerBottom() {
  el.choiceLayer.style.bottom = el.dlgLayer.offsetHeight + 'px';
}
window.addEventListener('resize', () => {
  if (!el.choiceLayer.classList.contains('hidden')) syncChoiceLayerBottom();
});

// Keeps .char-wrap's bottom glued to .dlg-layer's actual rendered height —
// same "real height, not a vh guess" reasoning as syncChoiceLayerBottom
// above, so the character's feet sit right at the dialogue box's top edge
// instead of the fixed 26vh default. A ResizeObserver (not just the
// window 'resize' listener syncChoiceLayerBottom uses) because .dlg-layer's
// height also changes from things that aren't a viewport resize — new
// dialogue text wrapping to more/fewer lines, or .has-interactive's 48vh
// jump — and the character has to track those too.
function syncCharWrapBottom() {
  el.charWrap.style.bottom = el.dlgLayer.offsetHeight + 'px';
}
new ResizeObserver(syncCharWrapBottom).observe(el.dlgLayer);

// Choices render as a floating panel over a dimmed scene, centered in the
// area above the dialogue box (see .choice-layer/.scene-dim) — not appended
// inside the box itself — and the question line in the box is recolored via
// is-question so it visibly reads as a decision point. Ace Attorney-style,
// per the brief.
function showChoices(allChoices) {
  const choices = allChoices.filter(c => evaluateCondition(c.condition));
  el.choiceLayer.innerHTML = '';
  choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.style.animationDelay = (i * 260) + 'ms';
    btn.textContent = choice.label;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      clearInteractiveLayers();
      player.choose(choice.id);
    });
    el.choiceLayer.appendChild(btn);
  });
  syncChoiceLayerBottom();
  el.choiceLayer.classList.remove('hidden');
  el.sceneDim.classList.add('show');
  el.dialogueText.classList.add('is-question');
}

function showEvidenceCta() {
  el.dlgLayer.classList.add('has-interactive');
  el.evidenceCta.classList.remove('hidden');
}

// 증거 제시 시트 (§Phase 4 — CaseEntryUI 공용 렌더로 통합). 대화 게이트
// 자체(line.evidenceIds/correctGoto, player.presentEvidence)는 그대로이고
// 여기서는 "어떤 카드를 보여줄지/어떻게 고르게 할지"만 바꾼다. 기본 진입
// 탭은 "관련 항목" — 현재 줄의 characterId를 NPC 컨텍스트로 써서 CASE FILE
// 전체(§Phase 4 이전엔 50개 전부 스크롤)가 아니라 4~8개만 먼저 보여준다.
// 탭/선택 상태는 시트를 다시 열어도 유지되도록 모듈 스코프에 둔다.
let evidenceSheetTab = 'related';
let evidenceSheetSelectedId = null;
function renderEvidenceSheet() {
  CaseEntryUI.injectCaseEntryUIStyles();
  const line = activeLines[player.getState().index] || {};
  const ctx = { npcId: line.characterId || null, topicTags: [], activeTab: evidenceSheetTab, selectedId: evidenceSheetSelectedId, maxSuggested: 6 };
  el.evidenceSheetList.innerHTML = CaseEntryUI.renderPresentSheetHtml(CaseFileState.getCaseEntries(), ctx);
  CaseEntryUI.hydrateCaseEntryIcons(el.evidenceSheetList);
  el.evidenceSheetList.querySelectorAll('[data-present-tab]').forEach(btn => btn.addEventListener('click', () => {
    evidenceSheetTab = btn.dataset.presentTab;
    evidenceSheetSelectedId = null;
    renderEvidenceSheet();
  }));
  el.evidenceSheetList.querySelectorAll('[data-present-entry]').forEach(btn => btn.addEventListener('click', () => {
    evidenceSheetSelectedId = evidenceSheetSelectedId === btn.dataset.presentEntry ? null : btn.dataset.presentEntry;
    renderEvidenceSheet();
  }));
  el.evidenceSheetList.querySelectorAll('[data-present-confirm]').forEach(btn => btn.addEventListener('click', () => {
    const entryId = btn.dataset.presentConfirm;
    evidenceSheetSelectedId = null;
    el.evidenceSheetOverlay.classList.add('hidden');
    // already_used 파생 판정용(§9.5) — 관련도 점수의 "이미 같은 NPC에게
    // 제시했으며 변화 없음 -3"(§9.3)이 이 플래그를 읽는다.
    if (ctx.npcId) CaseFileState.setFlag('presented:' + ctx.npcId + ':' + entryId, true);
    player.presentEvidence(entryId);
  }));
}

let evidenceToastTimer = null;
function showEvidenceToast(text, correct) {
  el.evidenceToast.textContent = text;
  el.evidenceToast.classList.toggle('correct', correct);
  el.evidenceToast.classList.toggle('wrong', !correct);
  el.evidenceToast.classList.add('show');
  clearTimeout(evidenceToastTimer);
  evidenceToastTimer = setTimeout(() => el.evidenceToast.classList.remove('show'), 1800);
}

el.evidenceCtaBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  evidenceSheetTab = 'related'; // §9.2 "기본 진입 탭은 관련 항목" — 매번 새로 열 때 초기화
  evidenceSheetSelectedId = null;
  renderEvidenceSheet();
  el.evidenceSheetOverlay.classList.remove('hidden');
});
el.evidenceSheetCloseBtn.addEventListener('click', () => el.evidenceSheetOverlay.classList.add('hidden'));
el.evidenceSheetOverlay.addEventListener('click', (e) => {
  if (e.target === el.evidenceSheetOverlay) el.evidenceSheetOverlay.classList.add('hidden');
});

// 증거 DB 노트 v1.1 — 위 시트와 같은 제출 판정(player.presentEvidence)을
// 그대로 재사용하는 대안 UI. 시트를 대체하지 않고 "수첩에서 고르기"
// 버튼으로만 진입 — 관련도 스코어링이 있는 시트가 기본, 훑어보며 고르고
// 싶을 때만 노트로 전환하는 구조.
function presentEvidenceFromNotebook(npcId, entryId) {
  if (npcId) CaseFileState.setFlag('presented:' + npcId + ':' + entryId, true);
  player.presentEvidence(entryId);
}
if (el.evidenceSheetNotebookBtn) {
  el.evidenceSheetNotebookBtn.addEventListener('click', () => {
    const line = activeLines[player.getState().index] || {};
    const npcId = line.characterId || null;
    el.evidenceSheetOverlay.classList.add('hidden');
    if (typeof EvidenceNotebook !== 'undefined') {
      EvidenceNotebook.open({
        mode: 'present',
        npcId,
        onPresent: (entryId) => presentEvidenceFromNotebook(npcId, entryId),
      });
    }
  });
}

const player = createVNPlayer({
  pageFit: { textEl: el.dialogueText },
  onLineChange: (line, index, total) => {
    clearInteractiveLayers();
    el.speakerName.textContent = line.speaker || '';
    applyCharacterForLine(line.characterId, line.expression);
    if (index === total - 1 && !activeSceneData.nextSceneId) {
      playEndingSequence();
    } else {
      // restart() loops back to line 0 — undo the ending fade/signal from last time.
      el.frame.classList.remove('ending-fade');
      el.unknownSignal.classList.remove('show');
    }
  },
  onTextUpdate: (text) => { el.dialogueText.textContent = text; },
  onArrow: (show) => {
    updateArrow(show);
    if (!autoplayOn) return;
    // true = this line finished typing and is waiting on a tap; schedule the
    // auto-tap after a reading pause. false = a new line just started typing
    // (or a scene transition is holding) — drop any stale pending auto-tap.
    if (show) scheduleAutoTap(autoReadDelay(el.dialogueText.textContent));
    else clearAutoplayTimer();
  },
  onEffect: (effects) => {
    (Array.isArray(effects) ? effects : [effects]).forEach(applyEffect);
  },
  onChoicePrompt: (choices) => {
    showChoices(choices);
    if (!autoplayOn) return;
    clearAutoplayTimer();
    autoplayTimer = setTimeout(() => {
      if (!autoplayOn) return;
      const firstBtn = el.choiceLayer.querySelector('.choice-btn');
      if (firstBtn) firstBtn.click();
    }, 900);
  },
  onEvidencePrompt: (line) => {
    showEvidenceCta();
    if (!autoplayOn) return;
    clearAutoplayTimer();
    autoplayTimer = setTimeout(() => {
      if (!autoplayOn) return;
      const evidenceId = line.evidenceIds && line.evidenceIds[0];
      if (evidenceId) player.presentEvidence(evidenceId);
    }, 900);
  },
  onEvidenceResult: (correct, evidenceId, line) => {
    if (correct) {
      CaseFileState.markEvidenceReviewed(evidenceId);
      el.evidenceCta.classList.add('hidden');
      showEvidenceToast('✓ 제시했습니다.', true);
    } else {
      // §20 힌트 단계 — wrongText may be a single string (unchanged behavior)
      // or an array of escalating hints; each wrong attempt on this exact
      // line (tracked by id, so retrying a *different* prompt doesn't share
      // the same counter) advances one step, capped at the array's last entry.
      const attempt = CaseFileState.incrementFlag('wrong:' + line.id);
      const texts = Array.isArray(line.wrongText) ? line.wrongText : [line.wrongText || '그건 아닌 것 같아요...'];
      showEvidenceToast(texts[Math.min(attempt - 1, texts.length - 1)], false);
    }
  },
  onSceneTransition: (transition) => playSceneTransition(transition),
  onComplete: () => {
    if (activeSceneData.nextSceneId) {
      playMinigameTransition(activeSceneData.nextSceneId);
      return;
    }
    if (autoplayOn) {
      const fallback = findAutoplayFallbackNextScene();
      if (fallback) {
        location.href = `/play/game/?scene=${encodeURIComponent(fallback.id)}&autoplay=1&week=${encodeURIComponent(autoplayWeek)}`;
      } else {
        showAutoplayComplete();
      }
      return;
    }
    player.restart();
  },
});

function onTap() {
  unlockBgmOnFirstTap();
  if (caseMenu.isOpen()) return;
  player.tap();
}

/* ===== 다음 상호작용(스킵) 버튼 — 우상단, 항상 노출. 눌린 시점부터 tap()을
   반복 호출해 대사를 즉시 스킵하며 다음 상호작용 지점(선택지/증거 제시
   프롬프트)에 도달할 때까지, 또는 씬이 끝나 다음 씬/미니게임으로 넘어갈
   때까지 계속 진행한다. tap() 자체가 이미 "타이핑 중이면 즉시 완성, 아니면
   다음 줄로"를 알아서 처리하므로(vnPlayer.js) 이 루프는 그걸 짧은 간격으로
   반복 호출하기만 하면 된다 — isPausing(장면전환/pauseBeforeMs 대기 중)
   구간에서도 tap()은 안전하게 아무 일도 하지 않으므로 특별히 갈라 처리할
   필요가 없다. setTimeout 체인을 쓰는 이유는(동기 while 루프가 아니라)
   isPausing이 실제 비동기(Promise/setTimeout)로 풀리기 때문 — 동기 루프였다면
   그 대기가 끝나길 영원히 바쁘게 기다리게 된다. skipStepGuard는 다음
   nextSceneId가 없어 같은 씬이 restart()로 무한 루프하는 극단적인 경우(예:
   1주차 마지막 씬)에 브라우저가 멈춘 것처럼 보이지 않도록 하는 안전장치. */
const SKIP_MAX_STEPS = 1000;
let skipRunning = false;
function skipToNextInteraction() {
  if (skipRunning || caseMenu.isOpen()) return;
  unlockBgmOnFirstTap();
  skipRunning = true;
  let steps = 0;
  function step() {
    if (!skipRunning) return;
    const state = player.getState();
    if (state.awaitingChoice || state.awaitingEvidence) { skipRunning = false; return; }
    if (caseMenu.isOpen() || !el.sheetOverlay.classList.contains('hidden') || !el.evidenceSheetOverlay.classList.contains('hidden')) {
      setTimeout(step, 200);
      return;
    }
    if (++steps > SKIP_MAX_STEPS) { skipRunning = false; return; }
    player.tap();
    setTimeout(step, 0);
  }
  step();
}

/* ===== Auto-play (?autoplay=1) — taps/chooses/presents-evidence on a timer
   instead of waiting for the player, so "플레이하기" on /dev/week2 can show
   the whole week cascading the way it actually plays out. Any real tap on
   the frame (onTap above) still works mid-autoplay and just advances early;
   the AUTO badge lets a dev drop back to manual play without navigating
   away. ===== */
let autoplayOn = isAutoplay;
let autoplayTimer = null;

function clearAutoplayTimer() {
  if (autoplayTimer) { clearTimeout(autoplayTimer); autoplayTimer = null; }
}

function stopAutoplay() {
  autoplayOn = false;
  clearAutoplayTimer();
  el.autoplayBtn.classList.add('hidden');
}

// Waits out a natural reading pace (base pause + a per-character amount,
// capped so a long line doesn't stall the cascade) before tapping onward.
// Re-checks caseMenu/sheets right before tapping — a dev can pop one of
// those open mid-autoplay to poke around without a stray auto-tap racing past it.
function scheduleAutoTap(delayMs) {
  clearAutoplayTimer();
  autoplayTimer = setTimeout(() => {
    if (!autoplayOn) return;
    if (caseMenu.isOpen() || !el.sheetOverlay.classList.contains('hidden') || !el.evidenceSheetOverlay.classList.contains('hidden')) {
      scheduleAutoTap(400);
      return;
    }
    unlockBgmOnFirstTap();
    player.tap();
  }, delayMs);
}

function autoReadDelay(text) {
  return 550 + Math.min(1600, (text || '').length * 16);
}

if (isAutoplay) el.autoplayBtn.classList.remove('hidden');
el.autoplayBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  stopAutoplay();
});

// Only a handful of week2 scenes carry an authored nextSceneId today (the
// ones handing off into a minigame/탐문 허브 — see dialogueData.js); most
// plain VN scenes don't chain to the next one yet, so the base engine just
// loops in place once their last line is tapped through (see onComplete's
// player.restart() below). Autoplay still wants to cascade through the rest
// of the week in its authored order — the same #01..#NN order /dev/week2
// itself lists — so when a scene has no nextSceneId it falls back to "the
// next scene in this week with the next-higher .order", instead of stopping
// (or looping forever) at every one of those un-wired boundaries. Route-only
// entries (minigames/hubs, no .lines) are skipped here since a real
// nextSceneId hand-off (above) already owns navigating to those.
function findAutoplayFallbackNextScene() {
  const week = weeks.find(w => w.id === autoplayWeek);
  if (!week) return null;
  const candidates = week.scenes
    .filter(s => s.lines && s.lines.length && s.order > activeSceneData.order)
    .sort((a, b) => a.order - b.order);
  return candidates[0] || null;
}

// 다음 씬을 못 찾으면(주차의 마지막 씬) play/game 기본 동작은 restart()로
// 무한 루프하지만, autoplay는 대신 완료 카드를 잠깐 띄우고 그 주차 목록으로
// 돌아간다 — 같은 씬을 계속 재생하는 대신 "다 봤다"는 신호를 준다.
function showAutoplayComplete() {
  stopAutoplay();
  el.frame.classList.add('ending-fade');
  el.introCard.textContent = '자동 재생 완료';
  el.introOverlay.classList.remove('hidden');
  setTimeout(() => { location.href = `/dev/${autoplayWeek}/`; }, 2200);
}

// Text speed is applied by filling in each line's typingSpeedMs where the
// scene data didn't already author one — vnPlayer.js itself reads
// line.typingSpeedMs per line, so no change to the shared engine is needed.
const TEXT_SPEED_MS = { slow: 58, normal: 36, fast: 18, instant: 1 };
function applyTextSpeedSetting(lines) {
  const speedMs = TEXT_SPEED_MS[CaseFileState.getSettings().textSpeed] || TEXT_SPEED_MS.normal;
  return lines.map(l => Object.assign({}, l, { typingSpeedMs: l.typingSpeedMs || speedMs }));
}

const caseMenu = initCaseMenu({
  missionTitle: activeSceneData.name,
  currentSceneId: activeSceneData.id,
  mountSelector: '#caseMenuMount',
  disabled: true,
  onSaveRequested: (slot) => {
    return CaseFileState.saveSlot(slot, {
      sceneId: activeSceneData.id,
      lineIndex: player.getState().index,
      missionTitle: activeSceneData.name,
    });
  },
  onResumeToScene: (sceneId, lineIndex) => {
    // A save made from the 탐색 허브 (play/explore/) has no VN sceneId —
    // CaseFileState.loadSlot already restored ExplorationState by the time
    // this fires, so route back there with the now-current phase/location.
    if (sceneId === '__EXPLORE_HUB__') {
      location.href = `/play/explore/?phase=${encodeURIComponent(ExplorationState.getCurrentPhase() || '')}&location=${encodeURIComponent(ExplorationState.getCurrentLocationId() || '')}`;
    } else if (sceneId === activeSceneData.id) {
      player.load(applyTextSpeedSetting(activeLines), lineIndex);
    } else {
      location.href = `/play/game/?scene=${encodeURIComponent(sceneId)}&line=${lineIndex}`;
    }
  },
  onSettingChange: (key, value) => {
    if (key !== 'bgm') return;
    desiredBgmOn = value;
    if (!bgmPlayer) return;
    if (value) { if (bgmUnlocked) bgmPlayer.unMute(); } else { bgmPlayer.mute(); }
  },
  onOpenShop: () => { storeShopReturnUrl(); location.href = '/play/shop/'; },
  onOpenWardrobe: () => { storeShopReturnUrl(); location.href = '/play/wardrobe/'; },
});

// Character portraits are driven entirely by each line's (characterId,
// expression) pair looked up in 인물 DB (/dev/upload) — this sheet only
// needs a manual override for the background, scoped to the active scene.
async function renderAssetSelectors() {
  // A network hiccup on this fetch must not block the whole DEV sheet from
  // opening — every other button on it (case-file shortcuts, economy/
  // exploration debug tools) has nothing to do with backgrounds and should
  // still work. Degrades to an empty background dropdown instead.
  let bgs = [];
  try {
    // A slot pointed at a catalog location lists that location's own photos
    // (shared across every scene using it); an unassigned/minigame slot
    // falls back to the legacy per-scene list — see
    // DevGameState.getBackgroundId's own 2-stage resolution.
    const locRef = await DevGameState.resolveSlotLocation(activeSceneData.id);
    const all = await AssetDB.getAssetsByType('background');
    bgs = (locRef && locRef.locationId)
      ? all.filter(a => a.locationId === locRef.locationId && (a.variantId || 'default') === (locRef.variantId || 'default'))
      : all.filter(a => a.sceneId === activeSceneData.id);
  } catch (err) {
    console.error('renderAssetSelectors: background list fetch failed, sheet still opens', err);
  }
  fillSelect(el.bgSelect, bgs, await DevGameState.getBackgroundId(activeSceneData.id));
}

function fillSelect(selectEl, assets, selectedId) {
  const options = ['<option value="">— 기본(없음) —</option>']
    .concat(assets.map(a => `<option value="${a.id}"${a.id === selectedId ? ' selected' : ''}>${escapeHtml(a.name)}</option>`));
  selectEl.innerHTML = options.join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// A ?line=<n> query param (written by 불러오기's cross-scene resume) means
// this load is resuming a save mid-scene — replaying the full location-card
// intro every time would be a real annoyance, so it's skipped in that case.
const resumeLineIndex = (() => {
  const raw = new URLSearchParams(location.search).get('line');
  const n = raw === null ? NaN : parseInt(raw, 10);
  return Number.isInteger(n) && n >= 0 ? n : null;
})();

// Per-line tweaks made from /dev/upload's 대사 tab (wording, speaker,
// expression) — stored separately from dialogueData.js's static script, so
// merge them into activeLines here before anything reads .text/.speaker/
// .characterId/.expression. Best-effort: falls back to the static script
// untouched if the override fetch fails.
async function applyDialogueOverrides() {
  try {
    const overrides = await AssetDB.getDialogueOverrides(activeSceneData.id);
    activeSceneData.lines.forEach((l, i) => {
      const o = overrides[l.id];
      if (o) Object.assign(activeLines[i], o);
    });
  } catch (e) { /* keep the static script as-is */ }
}

(async function init() {
  // A whole week's backgrounds/portraits/dialogue-overrides/BGM are warmed
  // in one batch the moment that week is first entered (see
  // weekPreloader.js) — behind its own progress-bar/tip screen, shown only
  // on that first scene. Every scene after that (including this one, once
  // the week is warm) finds everything already cached, so no per-scene
  // loading screen is needed here anymore.
  const currentWeekId = WeekPreloader.weekIdOf(activeSceneData.id);
  if (currentWeekId) {
    const weekScenes = allScenes.filter(s => s.id.startsWith(currentWeekId + '-'));
    await WeekPreloader.ensureWeekLoaded(currentWeekId, weekScenes);
  }
  updatePointBalance();
  updateRelationshipGauges();
  await applyDialogueOverrides();
  await applyBackground();
  applyBgm();
  await preloadCharacterAssetsForLines(activeLines);
  el.introOverlay.classList.add('hidden');
  player.load(applyTextSpeedSetting(activeLines), resumeLineIndex || 0);
})();
