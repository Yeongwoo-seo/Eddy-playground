<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MISSING KEY · 레이튼 퀴즈</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/play/manifest.json">
<link rel="apple-touch-icon" href="https://dhtstqnksjoyyshnhksv.supabase.co/storage/v1/object/public/dev-assets/app-icon/play-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Missing Key">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--green:#3ECF6B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(48px + env(safe-area-inset-top,0)) 20px calc(32px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.back{font-family:var(--mono);font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:18px;display:inline-flex;align-items:center;gap:4px;width:fit-content}
.top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.top-row .back{margin-bottom:0}
/* Settings link to this minigame's dev editor (/dev/minigame-layton/) — same
   destination as .back here (the puzzle list IS the editor), kept as a
   separate top-right link so this page matches the other minigames'
   back-left/settings-right layout and can be hidden in real play on its own. */
.settings-link{font-family:var(--mono);font-size:11px;color:var(--text-muted);text-decoration:none;border:1px solid var(--divider);border-radius:20px;padding:7px 13px;flex-shrink:0}
.settings-link:active{opacity:.75}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
.title{font-size:22px;font-weight:700;letter-spacing:-.2px;margin-bottom:8px;line-height:1.35}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--text-secondary);margin-bottom:22px}

.card{background:var(--surface-1);border:1px solid var(--divider);border-radius:16px;padding:18px 18px;margin-bottom:16px}
.card-label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px}
.statement{font-size:14.5px;line-height:1.75;color:var(--text-primary);white-space:pre-line}

.rec-table{width:100%;border-collapse:collapse;margin-top:14px;font-family:var(--mono);font-size:12.5px}
.rec-table th,.rec-table td{border:1px solid var(--divider);padding:8px 6px;text-align:center}
.rec-table th{color:var(--text-muted);font-weight:600;background:var(--surface-2)}

.dot-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:16px;padding:8px 4px}
.dot-grid span{width:8px;height:8px;border-radius:50%;background:var(--text-secondary);justify-self:center}

.answer-row{display:flex;gap:10px}
.answer-input{flex:1;min-width:0;font-family:var(--mono);font-size:16px;letter-spacing:.06em;background:var(--surface-2);border:1px solid var(--divider);border-radius:12px;padding:13px 14px;color:var(--text-primary)}
.answer-input:focus{outline:none;border-color:var(--cyan)}
.submit-btn{flex-shrink:0;font-family:var(--mono);font-size:13.5px;font-weight:700;color:#04181c;background:var(--cyan);border:none;border-radius:12px;padding:0 18px;cursor:pointer}
.submit-btn:active{transform:scale(.96)}

.feedback{margin-top:12px;font-family:var(--mono);font-size:12.5px;font-weight:600;display:none}
.feedback.show{display:block}
.feedback.correct{color:var(--green)}
.feedback.wrong{color:var(--signal-red)}

.hint-list{display:flex;flex-direction:column;gap:8px}
.hint-btn{text-align:left;font-family:var(--mono);font-size:12px;color:var(--text-secondary);background:var(--surface-2);border:1px solid var(--divider);border-radius:10px;padding:11px 13px;cursor:pointer}
.hint-btn:active{opacity:.75}
.hint-text{font-size:13px;line-height:1.6;color:var(--text-primary);padding:11px 13px;background:var(--surface-2);border:1px solid var(--divider);border-radius:10px}

.reveal-btn{width:100%;margin-top:4px;font-family:var(--mono);font-size:12px;color:var(--text-muted);background:none;border:1px dashed var(--divider);border-radius:10px;padding:11px;cursor:pointer}
.reveal-btn:active{opacity:.7}

.solution{display:none;font-size:13.5px;line-height:1.75;color:var(--text-secondary);white-space:pre-line}
.solution.show{display:block}
.solution-answer{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--green);margin-bottom:10px}

.reset-btn{margin-top:4px;font-family:var(--mono);font-size:12.5px;color:var(--text-muted);background:none;border:1px solid var(--divider);border-radius:12px;padding:12px;cursor:pointer;text-align:center}
.reset-btn:active{opacity:.7}

.next-link{margin-top:8px;text-align:center;font-family:var(--mono);font-size:12.5px;color:var(--cyan);text-decoration:none;padding:12px}

.not-found{font-size:14px;color:var(--text-secondary);line-height:1.7}

/* ===== Game-feel additions ===== */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 600px 400px at 50% -10%, rgba(89,184,200,.10), transparent 60%),
    repeating-linear-gradient(180deg, rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 1px, transparent 1px, transparent 3px);
}
.frame{position:relative;z-index:1}

@keyframes fadeSlideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.top-row,.tag,.title,.meta,.stat-row{animation:fadeSlideUp .5s cubic-bezier(.2,.8,.2,1) both}
.tag{animation-delay:.03s}
.title{animation-delay:.06s}
.meta{animation-delay:.09s}
.stat-row{animation-delay:.12s}
.card{animation:fadeSlideUp .5s cubic-bezier(.2,.8,.2,1) both}
.card:nth-of-type(1){animation-delay:.16s}
.card:nth-of-type(2){animation-delay:.22s}
.card:nth-of-type(3){animation-delay:.28s}

.stat-row{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.stat-chip{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--divider);border-radius:20px;padding:7px 12px;transition:border-color .3s}
.stat-chip .stat-label{color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.stat-chip .stat-val{color:var(--text-primary);font-weight:600}
#timerChip .stat-val{color:var(--cyan)}
#attemptsChip.has-miss{border-color:rgba(217,65,65,.35)}
#attemptsChip.has-miss .stat-val{color:var(--signal-red)}
.diff-meter{display:inline-flex;gap:2px}
.diff-meter span{width:5px;height:9px;border-radius:1px;background:var(--divider)}
.diff-meter span.on{background:var(--diff-color,var(--cyan))}

.brief-card{position:relative}
.brief-card::before,.brief-card::after{content:'';position:absolute;width:10px;height:10px;border:1px solid rgba(89,184,200,.45);pointer-events:none}
.brief-card::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
.brief-card::after{bottom:-1px;right:-1px;border-left:none;border-top:none}

.answer-row{position:relative}
.answer-row.shake{animation:shakeX .4s}
@keyframes shakeX{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.answer-input.flash-wrong{border-color:var(--signal-red);box-shadow:0 0 0 3px rgba(217,65,65,.15)}
.answer-input.flash-correct{border-color:var(--green);box-shadow:0 0 0 3px rgba(62,207,107,.15)}

.feedback{display:flex;align-items:center;gap:6px}
.feedback.correct{animation:popIn .35s cubic-bezier(.2,.8,.2,1)}
.feedback.wrong{animation:shakeX .4s}
@keyframes popIn{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}

.clear-stamp{display:none;align-items:center;gap:8px;margin-top:14px;padding:10px 14px;border:1px solid rgba(62,207,107,.4);border-radius:12px;background:rgba(62,207,107,.08);color:var(--green);font-family:var(--mono);font-weight:700;font-size:12.5px;letter-spacing:.02em}
.clear-stamp.show{display:flex;animation:stampIn .45s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes stampIn{0%{opacity:0;transform:rotate(-10deg) scale(.6)}70%{opacity:1;transform:rotate(2deg) scale(1.06)}100%{opacity:1;transform:rotate(-2deg) scale(1)}}

.hint-btn{display:flex;align-items:center;gap:8px}
.hint-text{display:flex;align-items:flex-start;gap:8px;border-left:2px solid var(--cyan);border-top-left-radius:2px;border-bottom-left-radius:2px;animation:fadeSlideUp .4s cubic-bezier(.2,.8,.2,1)}
.hint-text .hint-num{flex-shrink:0;font-family:var(--mono);font-size:10px;color:var(--cyan);font-weight:700;background:rgba(89,184,200,.12);border-radius:6px;padding:2px 6px;margin-top:1px;white-space:nowrap}

.reveal-btn{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--amber);border-color:rgba(214,168,75,.3)}
.reveal-btn.decoding{opacity:.6;pointer-events:none}

.solved-ribbon{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;color:#04181c;background:var(--green);border-radius:8px;padding:3px 8px;margin-bottom:10px}
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/play/sw.js', { scope: '/play/' });
}
</script>
<script>
/* ===== 레이튼 퀴즈 플레이 화면(실플레이용) — dev/minigame-layton/play/
   와 완전히 동일한 20문제 채점 엔진을 그대로 복제해 왔다(퍼즐 콘텐츠·
   연출이 갈라지지 않도록 두 파일을 함께 고칠 것). dev 쪽은 20문제를
   자유롭게 골라보는 편집/QA용, 이 파일은 스토리에서 특정 puzzle=id로
   진입해 그 문제 하나만 푸는 실플레이용이라는 점만 다르다 — 그래서 상단
   back 버튼이 목록이 아니라 sessionStorage의 mkShopReturnUrl(원래 씬)로
   돌아간다(낚시 미니게임과 같은 계약, dev/data/sceneRoutes.js 참고). ===== */
function normalizeDigits(raw) {
  return (raw || '').replace(/[^0-9]/g, '');
}

function normalizeLetters(raw) {
  return (raw || '').toUpperCase().replace(/[^A-Z]/g, '');
}

function normalizeText(raw) {
  return (raw || '').trim().replace(/\s+/g, '');
}

function dotGridHtml() {
  return '<div class="dot-grid">' + '<span></span>'.repeat(36) + '</div>';
}

const PUZZLES = {
  'pz-h01': {
    name: '세 기록으로 찾는 네 자리 암호',
    type: '숫자 암호 · 조건 소거',
    difficulty: 7,
    estTime: '5~10분',
    statementHtml:
      '서로 다른 숫자로 이루어진 네 자리 암호가 있다. 첫 번째 숫자는 0이 아니다.\n\n' +
      '각 기록의 「포함된 숫자」는 위치와 관계없이 암호에 들어 있는 숫자의 개수이며, 「자리까지 정확」은 숫자와 위치가 모두 맞는 개수다.' +
      '<table class="rec-table"><thead><tr><th>입력 기록</th><th>포함된 숫자</th><th>자리까지 정확</th></tr></thead><tbody>' +
      '<tr><td>1792</td><td>3개</td><td>1개</td></tr>' +
      '<tr><td>9726</td><td>3개</td><td>1개</td></tr>' +
      '<tr><td>9230</td><td>3개</td><td>0개</td></tr>' +
      '</tbody></table>',
    inputPlaceholder: '네 자리 암호',
    inputMode: 'numeric',
    maxLength: 4,
    normalize: normalizeDigits,
    answer: '2709',
    hints: [
      '세 번째 기록의 숫자 9, 2, 3, 0 중 세 개는 암호에 있지만, 네 숫자 모두 현재 자리에는 올 수 없어요.',
      '첫 번째와 두 번째 기록에 공통으로 등장하는 9, 7, 2를 먼저 비교해 보세요.',
      '암호에 들어가는 숫자는 2, 7, 0, 9이며, 세 번째 기록 때문에 각각의 위치가 크게 제한돼요.',
    ],
    solutionHtml:
      '세 조건을 모두 만족하는 네 자리 순열을 소거하면 사용 숫자는 2, 7, 0, 9로 확정된다.\n\n' +
      '세 번째 기록 9230은 포함 숫자가 세 개지만 자리까지 맞는 숫자는 하나도 없다.\n' +
      '- 9는 첫 번째 자리에 올 수 없다.\n' +
      '- 2는 두 번째 자리에 올 수 없다.\n' +
      '- 0은 네 번째 자리에 올 수 없다.\n' +
      '- 3은 암호에 없다.\n\n' +
      '나머지 두 기록까지 함께 대조하면 가능한 순서는 오직 2709만 남는다.\n\n' +
      '검산 — 1792 → 1,7,2 포함, 7만 자리까지 정확 / 9726 → 9,7,2 포함, 2만 자리까지 정확 / 9230 → 9,2,0 포함, 정확한 자리 없음.',
  },
  'pz-h17': {
    name: '6×6 점으로 만들 수 있는 정사각형',
    type: '도형 개수 세기 · 기하 조합',
    difficulty: 8,
    estTime: '10~15분',
    statementHtml:
      '가로 6개, 세로 6개의 점이 일정한 간격으로 놓여 있다.' +
      dotGridHtml() +
      '\n네 꼭짓점이 모두 점 위에 놓이는 정사각형은 총 몇 개인가? 기울어진 정사각형도 모두 포함한다.',
    inputPlaceholder: '정사각형 개수',
    inputMode: 'numeric',
    maxLength: 4,
    normalize: normalizeDigits,
    answer: '105',
    hints: [
      '먼저 변이 가로·세로와 평행한 정사각형을 센다.',
      '평행한 정사각형은 25+16+9+4+1개다.',
      '기울어진 정사각형은 한 변의 가로 이동량 a와 세로 이동량 b를 이용해 분류한다. a+b≤5다.',
    ],
    solutionHtml:
      '[1] 수평·수직 정사각형 — 변 길이가 1~5일 때 배치 수는 5²+4²+3²+2²+1² = 25+16+9+4+1 = 55개.\n\n' +
      '[2] 기울어진 정사각형 — 한 변의 이동량을 (a,b)라 하면 a,b는 양의 정수이고 a+b≤5다. 각 경우 배치 수는 (6-a-b)².\n' +
      '- a+b=2: 1×16=16\n- a+b=3: 2×9=18\n- a+b=4: 3×4=12\n- a+b=5: 4×1=4\n합계 16+18+12+4=50개.\n\n' +
      '전체: 55+50=105개.',
  },
  'pz-h18': {
    name: '세 방향으로 뚫린 정육면체',
    type: '3차원 공간 · 노출 면 계산',
    difficulty: 7,
    estTime: '5~15분',
    statementHtml:
      '5×5×5개의 작은 정육면체로 만든 큰 정육면체가 있다.\n\n' +
      '큰 정육면체의 중심을 지나도록, 앞뒤·좌우·위아래 세 방향으로 폭 1칸짜리 직선 터널을 완전히 뚫었다. 즉 세 터널은 정중앙에서 서로 교차한다.\n\n' +
      '터널을 뚫고 남은 입체에서 공기와 맞닿는 1×1 정사각형 면은 총 몇 개인가? 바깥 표면과 터널 안쪽 면을 모두 센다.',
    inputPlaceholder: '노출 면 개수',
    inputMode: 'numeric',
    maxLength: 4,
    normalize: normalizeDigits,
    answer: '192',
    hints: [
      '원래 바깥 표면은 6×25=150면이다.',
      '여섯 방향의 면 중앙 블록이 제거되므로 원래 바깥 표면 여섯 면이 사라진다.',
      '제거된 블록과 남은 블록 사이의 새 경계면은 총 48면이다.',
    ],
    solutionHtml:
      '원래 바깥 표면: 6×5×5 = 150.\n\n' +
      '터널의 여섯 입구에서 면 중앙 블록이 제거되므로 바깥 표면 6개가 사라진다 → 150-6 = 144.\n\n' +
      '세 중심선에서 제거되는 블록 수는 5+5+5-2 = 13. 중앙 블록은 주변 여섯 칸도 모두 터널이므로 남은 블록과 맞닿지 않는다.\n' +
      '중앙을 제외한 12개의 터널 블록은 각각 옆 방향의 남은 블록 네 개와 맞닿는다 → 새로 생기는 터널 안쪽 면 12×4 = 48.\n\n' +
      '전체 노출 면: 144+48 = 192.',
  },
  'pz-h02': {
    name: '일곱 명의 사진 촬영 순서',
    type: '일렬 배치 · 관계 논리',
    difficulty: 7,
    estTime: '5~10분',
    statementHtml:
      '일곱 명의 학생 A~G가 사진관에서 한 줄로 서서 단체 사진을 찍으려 한다. 다음 조건을 모두 만족하는, 왼쪽부터 오른쪽까지의 순서를 구하라.\n\n' +
      '- E는 줄의 맨 왼쪽 끝에 선다.\n' +
      '- C는 E의 바로 오른쪽에 선다.\n' +
      '- G는 C의 바로 오른쪽에 선다.\n' +
      '- A는 G의 바로 오른쪽에 선다.\n' +
      '- B는 줄의 맨 오른쪽 끝에 선다.\n' +
      '- D는 B의 바로 왼쪽에 선다.',
    inputPlaceholder: '왼쪽부터 순서 (예: ABCDEFG)',
    inputMode: 'text',
    maxLength: 7,
    normalize: normalizeLetters,
    answer: 'ECGAFDB',
    hints: [

      '이런 식으로 한 행씩 지그재그로 오가는 경로가 유일하게 정해져요. 3행은 11에서 15까지 이어지고, 그 한가운데가 정중앙 칸이에요.',

      '6(1행 다음 숫자)은 1행5열(5)과 맞닿은 2행5열에서 시작해 10(2행1열)까지 거꾸로 훑고, 3행으로 이어진다. 같은 방식으로 4행도 16~20이 오른쪽에서 왼쪽으로 채워진다.\n\n' +
      '결국 경로는 각 행을 번갈아 좌→우, 우→좌로 훑는 지그재그(뱀 모양) 하나로 유일하게 결정된다.\n\n' +
      '3행은 11,12,13,14,15이므로 3행3열(정중앙)은 13.',
  },
  'pz-h19': {
    name: '곱과 합으로 채우는 3×3 숫자판',
    type: '숫자 배치 · 곱셈·합 조건',
    difficulty: 7,
    estTime: '10~15분',
    statementHtml:
      '1부터 9까지의 숫자를 3×3 칸에 하나씩 채운다. 각 가로줄(행)의 세 수를 곱한 값과, 각 세로줄(열)의 세 수를 더한 값이 다음과 같다.\n\n' +
      '1행(맨 위) 곱 = 48, 2행(가운데) 곱 = 70, 3행(맨 아래) 곱 = 108\n' +
      '1열(왼쪽) 합 = 16, 2열(가운데) 합 = 15, 3열(오른쪽) 합 = 14\n\n' +
      '가운데 칸(2행 2열)에 들어가는 숫자는?',
    inputPlaceholder: '가운데 칸의 숫자',
    inputMode: 'numeric',
    maxLength: 1,
    normalize: normalizeDigits,
    answer: '5',
    hints: [
      '108 = 3×4×9처럼, 1~9 중 세 수의 곱으로 각 목표값을 만드는 조합을 먼저 찾아보세요.',
      '48을 만드는 세 수, 70을 만드는 세 수, 108을 만드는 세 수는 1~9를 겹치지 않게 정확히 나눠 가져야 해요.',
      '70 = 2×5×7이 유일한 조합이에요. 이 세 수가 들어가는 가운데 행에서, 세로줄 합 조건까지 맞춰보면 가운데 칸의 숫자가 좁혀져요.',
    ],
    solutionHtml:
      '먼저 1~9를 세 묶음으로 나누어 곱이 각각 48, 70, 108이 되도록 해야 한다.\n' +
      '70 = 2×5×7 (다른 조합 없음), 48 = 1×6×8, 108 = 3×4×9.\n\n' +
      '이제 세 세로줄의 합이 16, 15, 14가 되도록 각 묶음의 숫자를 배열한다. 실제로 맞아떨어지는 유일한 배치는:\n\n' +
      '1행: 6 1 8\n' +
      '2행: 7 5 2\n' +
      '3행: 3 9 4\n\n' +
      '각 열의 합을 확인하면 6+7+3=16, 1+5+9=15, 8+2+4=14로 모두 일치한다.\n\n' +
      '가운데 칸(2행2열)은 5.',
  },
  'pz-h20': {
    name: '다섯 사람의 여행지와 음료',
    type: '로직 그리드 · 다중 속성',
    difficulty: 8,
    estTime: '15~20분',
    statementHtml:
      '민준, 서연, 도윤, 하은, 지호 다섯 사람이 각자 다른 여행지(도쿄, 로마, 파리, 시드니, 카이로)로 떠나며, 각자 다른 음료(물, 커피, 주스, 차, 우유)를 마신다.\n\n' +
      '- 지호는 카이로에 간다.\n' +
      '- 민준은 도쿄에 가지만, 커피는 마시지 않는다.\n' +
      '- 우유를 마시는 사람은 카이로에 가는 사람과 동일 인물이다.\n' +
      '- 차를 마시는 사람은 시드니에 간다.\n' +
      '- 도윤은 주스를 마신다.\n' +
      '- 서연은 파리에 가지 않는다.\n' +
      '- 서연은 커피를 마신다.\n\n' +
      '도쿄로 여행 가는 사람은 어떤 음료를 마시는가?',
    inputPlaceholder: '음료 이름',
    inputMode: 'text',
    maxLength: 6,
    normalize: normalizeText,
    answer: '물',
    hints: [
      '지호=카이로이고, 우유 마시는 사람=카이로 가는 사람이니 지호는 우유를 마셔요.',
      '차 마시는 사람은 시드니로 가요. 서연·도윤·지호의 여행지·음료가 이미 정해졌으니, 시드니에 갈 수 있는 사람은 하은뿐이에요.',
      '도쿄로 가는 사람은 민준이에요. 물, 커피, 주스, 차, 우유 중 이미 다른 네 사람에게 배정된 음료를 빼면, 민준에게 남는 음료는 하나뿐이에요.',
    ],
    solutionHtml:
      '지호는 카이로에 가고, 우유 마시는 사람이 곧 카이로에 가는 사람이므로 지호=우유.\n\n' +
      '서연은 커피를 마시고(직접 단서), 파리에는 가지 않는다. 도윤은 주스를 마신다.\n\n' +
      '차를 마시는 사람은 시드니에 가는데, 이미 지호(카이로·우유), 서연(커피), 도윤(주스)의 음료가 정해졌고 민준은 커피가 아니라는 것만 알려져 있으므로, 차를 마시며 시드니에 갈 수 있는 사람은 하은뿐이다. 따라서 하은=차·시드니.\n\n' +
      '이제 목적지 중 로마·파리가 서연·도윤에게 남는데, 서연은 파리에 가지 않으므로 서연=로마, 도윤=파리.\n\n' +
      '음료는 물, 커피, 주스, 차, 우유 다섯 가지 중 커피(서연), 주스(도윤), 차(하은), 우유(지호)가 모두 배정되었으므로, 남은 물은 민준의 몫이다. 민준은 도쿄에 가므로, 도쿄로 여행 가는 사람은 물을 마신다.',
  },
};

const params = new URLSearchParams(location.search);
const puzzle = PUZZLES[params.get('puzzle')];
const frame = document.getElementById('frame');

// 낚시 미니게임(play/minigame-fishing)과 같은 계약 — 스토리에서 nextSceneId로
// 넘어올 때 SHOP_TUTORIAL_RETURN_SCENE이 sessionStorage에 넣어 둔 씬으로
// 돌아간다. 직접 이 URL을 열어 테스트할 때(그 값이 없을 때)는 dev 편집기로.
const RETURN_URL = sessionStorage.getItem('mkShopReturnUrl') || '/dev/minigame-layton/';

if (!puzzle) {
  frame.innerHTML = `
    <div class="top-row">
      <a class="back" href="${RETURN_URL}">‹ 돌아가기</a>
      <a class="settings-link dev-settings-link" href="/dev/minigame-layton/">설정</a>
    </div>
    <div class="tag">Minigame · 레이튼 퀴즈</div>
    <div class="title">문제를 찾을 수 없어요</div>
    <div class="not-found">주소의 puzzle 값이 올바르지 않거나 아직 미개발인 문제예요. 돌아가서 다시 시도해 주세요.</div>
  `;
} else {
  frame.innerHTML = `
    <div class="top-row">
      <a class="back" href="${RETURN_URL}">‹ 돌아가기</a>
      <a class="settings-link dev-settings-link" href="/dev/minigame-layton/">설정</a>
    </div>
    <div class="tag">Minigame · 레이튼 퀴즈</div>
    <div class="title">${puzzle.name}</div>
    <div class="meta">${puzzle.type} · 예상 ${puzzle.estTime}</div>
    <div class="stat-row">
      <div class="stat-chip"><span class="stat-label">난이도</span><span class="diff-meter" id="diffMeter"></span></div>
      <div class="stat-chip" id="timerChip"><span class="stat-label">경과</span><span class="stat-val" id="timerVal">00:00</span></div>
      <div class="stat-chip" id="attemptsChip"><span class="stat-label">시도</span><span class="stat-val" id="attemptsVal">0</span></div>
    </div>

    <div class="card brief-card">
      <div class="card-label">문제</div>
      <div class="statement">${puzzle.statementHtml}</div>
    </div>

    <div class="card">
      <div class="card-label">정답 입력</div>
      <div class="answer-row" id="answerRow">
        <input class="answer-input" id="answerInput" type="text" inputmode="${puzzle.inputMode}" maxlength="${puzzle.maxLength}" placeholder="${puzzle.inputPlaceholder}">
        <button class="submit-btn" id="submitBtn">확인</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="clear-stamp" id="clearStamp">🏆 미션 성공 — 아래에서 풀이를 확인해 보세요</div>
    </div>

    <div class="card" id="hintCard">
      <div class="card-label">힌트</div>
      <div class="hint-list" id="hintList"></div>
    </div>

    <button class="reveal-btn" id="revealBtn">⚠ 정답과 풀이 바로 보기</button>

    <div class="card solution-card" id="solutionCard" style="display:none">
      <span class="solved-ribbon">CASE CLOSED</span>
      <div class="card-label">상세 풀이</div>
      <div class="solution-answer" id="solutionAnswer"></div>
      <div class="solution" id="solutionText"></div>
      <button class="reset-btn" id="resetBtn">↺ 다시 풀어보기</button>
      <a class="next-link" href="${RETURN_URL}">‹ 돌아가기</a>
    </div>
  `;

  const answerInput = document.getElementById('answerInput');
  const answerRow = document.getElementById('answerRow');
  const submitBtn = document.getElementById('submitBtn');
  const feedback = document.getElementById('feedback');
  const clearStamp = document.getElementById('clearStamp');
  const hintList = document.getElementById('hintList');
  const hintCard = document.getElementById('hintCard');
  const revealBtn = document.getElementById('revealBtn');
  const solutionCard = document.getElementById('solutionCard');
  const solutionAnswer = document.getElementById('solutionAnswer');
  const solutionText = document.getElementById('solutionText');
  const resetBtn = document.getElementById('resetBtn');
  const diffMeter = document.getElementById('diffMeter');
  const timerVal = document.getElementById('timerVal');
  const attemptsVal = document.getElementById('attemptsVal');
  const attemptsChip = document.getElementById('attemptsChip');

  let hintsShown = 0;
  let attempts = 0;
  let elapsedSec = 0;
  let timerInterval = null;
  let solved = false;

  /* ===== HUD: difficulty meter + live solve timer — the same "game 상태 표시"
     pattern the item-scan minigame's progress pill uses, so this puzzle screen
     reads as a mission in progress rather than a static form. ===== */
  function renderDiffMeter() {
    const diff = puzzle.difficulty;
    const tier = diff <= 5 ? 'var(--cyan)' : diff <= 7 ? 'var(--amber)' : 'var(--signal-red)';
    diffMeter.innerHTML = Array.from({ length: 10 }, (_, i) =>
      `<span class="${i < diff ? 'on' : ''}" style="--diff-color:${tier}"></span>`
    ).join('');
  }
  renderDiffMeter();

  function pad2(n) { return String(n).padStart(2, '0'); }
  function updateTimerDisplay() { timerVal.textContent = pad2(Math.floor(elapsedSec / 60)) + ':' + pad2(elapsedSec % 60); }
  function startTimer() { stopTimer(); timerInterval = setInterval(() => { elapsedSec++; updateTimerDisplay(); }, 1000); }
  function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
  startTimer();

  function renderHints() {
    hintList.innerHTML = puzzle.hints.map((h, i) => {
      if (i < hintsShown) return `<div class="hint-text"><span class="hint-num">HINT ${i + 1}</span><span>${h}</span></div>`;
      if (i === hintsShown) return `<button class="hint-btn" data-hint="${i}">🔒 힌트 ${i + 1} 잠금 해제</button>`;
      return '';
    }).join('');
    hintList.querySelectorAll('.hint-btn').forEach(btn => {
      btn.addEventListener('click', () => { hintsShown++; renderHints(); });
    });
  }
  renderHints();

  function showSolution() {
    solutionAnswer.textContent = `정답: ${puzzle.answer}`;
    solutionText.textContent = puzzle.solutionHtml;
    solutionCard.style.display = 'block';
    hintCard.style.display = 'none';
    revealBtn.style.display = 'none';
  }

  function checkAnswer() {
    if (solved) return;
    const raw = puzzle.normalize(answerInput.value);
    feedback.classList.remove('correct', 'wrong');
    answerInput.classList.remove('flash-correct', 'flash-wrong');
    feedback.classList.add('show');
    if (raw && raw === puzzle.answer) {
      solved = true;
      stopTimer();
      feedback.classList.add('correct');
      feedback.textContent = '✔ 정답이에요! 아래에서 풀이를 확인해 보세요.';
      answerInput.classList.add('flash-correct');
      clearStamp.classList.add('show');
      showSolution();
    } else {
      attempts++;
      attemptsVal.textContent = attempts;
      attemptsChip.classList.add('has-miss');
      feedback.classList.add('wrong');
      feedback.textContent = '✕ 아직 정답이 아니에요. 힌트를 참고해 보세요.';
      answerInput.classList.add('flash-wrong');
      answerRow.classList.remove('shake');
      void answerRow.offsetWidth;
      answerRow.classList.add('shake');
    }
  }

  submitBtn.addEventListener('click', checkAnswer);
  answerInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(); });
  revealBtn.addEventListener('click', () => {
    stopTimer();
    revealBtn.classList.add('decoding');
    revealBtn.textContent = '해독 중...';
    setTimeout(showSolution, 450);
  });
  resetBtn.addEventListener('click', () => {
    answerInput.value = '';
    hintsShown = 0;
    renderHints();
    feedback.classList.remove('show', 'correct', 'wrong');
    answerInput.classList.remove('flash-correct', 'flash-wrong');
    clearStamp.classList.remove('show');
    solutionCard.style.display = 'none';
    hintCard.style.display = 'block';
    revealBtn.style.display = 'block';
    revealBtn.classList.remove('decoding');
    revealBtn.textContent = '⚠ 정답과 풀이 바로 보기';
    attempts = 0;
    attemptsVal.textContent = '0';
    attemptsChip.classList.remove('has-miss');
    elapsedSec = 0;
    updateTimerDisplay();
    solved = false;
    startTimer();
  });
}
</script>
<script src="/realPlayMode.js"></script>
<script>RealPlayMode.hideDevChrome();</script>
<script src="/dev/devPlanFab.js"></script>
</body>
</html>
