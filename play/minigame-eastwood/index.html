<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--violet:#8B7BD8;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}

.frame{position:relative;width:100%;max-width:430px;height:100dvh;height:100vh;height:var(--vh100, 100vh);overflow:hidden;background:#0d1114;display:flex;flex-direction:column;touch-action:none}

/* ===== Top bar ===== */
.topbar{position:absolute;top:0;left:0;right:0;z-index:6;padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.vn-btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#fff;background:rgba(8,10,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block;pointer-events:auto}

/* ===== Map stage ===== */
.map-stage{position:absolute;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(circle at 30% 20%,#141a20 0%,#0a0d10 70%)}
.map-canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
@keyframes areaGlow{0%,100%{opacity:.1}50%{opacity:.4}}

/* ===== Map overlays (uploaded map image + hand-marked hotspot) ===== */
.image-area-glow{position:absolute;border-radius:50%;background:var(--amber);opacity:0;pointer-events:none}
.image-area-glow.show{animation:areaGlow 1.6s ease-in-out infinite}
.image-pulse-ring{position:absolute;border-radius:50%;border:4px solid var(--cyan);opacity:0;pointer-events:none;transform-origin:center}
.image-pulse-ring.success{animation:imgPulseRing 900ms ease-out}
@keyframes imgPulseRing{0%{transform:scale(.3);opacity:.9;border-width:6px}100%{transform:scale(2.2);opacity:0;border-width:1px}}
.tap-wrong-ring{position:absolute;border-radius:50%;border:3px solid var(--signal-red);opacity:.9;pointer-events:none;animation:tapWrongFade 420ms ease forwards}
@keyframes tapWrongFade{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.4);opacity:0}}

/* ===== Placed pin tags (a label locked onto its spot) ===== */
.pin-tag{position:absolute;transform:translate(-50%,-130%);font-family:var(--mono);font-size:11px;font-weight:700;color:#06181c;background:var(--cyan);border-radius:8px;padding:4px 8px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}

/* ===== Final-stop stamp ===== */
.stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);z-index:7;font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:.14em;color:var(--cyan);text-shadow:0 0 24px rgba(89,184,200,.6);opacity:0;pointer-events:none}
.stamp.show{animation:stampPop 1.1s ease-out forwards}
@keyframes stampPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}

/* ===== Label tray (select a label chip, then tap its spot on the map) ===== */
.label-tray{position:absolute;left:16px;right:16px;bottom:calc(122px + env(safe-area-inset-bottom,0));z-index:5;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.label-tray.hidden{display:none}
.label-chip{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text-primary);background:rgba(8,10,12,.85);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:9px 14px;cursor:pointer}
.label-chip.selected{color:#191206;background:var(--amber);border-color:var(--amber)}
.label-chip.placed{display:none}

/* ===== Bottom dialogue strip (idle/reaction commentary) ===== */
.dlg-strip{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0));z-index:5;background:rgba(5,7,10,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.35);padding:14px 16px;display:flex;align-items:flex-end;gap:14px;transition:opacity .2s ease}
.dlg-strip.hidden{display:none}
.portrait-wrap{width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--surface-2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.portrait-wrap img{width:100%;height:100%;object-fit:cover;object-position:center;display:none}
.portrait-placeholder{width:62%;height:62%;opacity:.35;color:var(--text-secondary)}
.dlg-body-wrap{flex:1;min-width:0}
.dlg-mission{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--cyan);letter-spacing:.02em;margin-bottom:6px}
.dlg-mission:empty{display:none}
.dlg-name{font-size:14px;font-weight:700;color:var(--cyan);margin-bottom:4px}
.dlg-name:empty{display:none}
.dlg-text{font-size:15px;line-height:1.55;color:#fff;white-space:pre-wrap;word-break:keep-all}

/* ===== Reward screen (The Missing Key v1 §4.5 — "CLEAR! / 기본 보상 +500P") ===== */
.reward-layer{position:absolute;inset:0;z-index:11;display:none;align-items:center;justify-content:center;background:rgba(3,4,6,.92);backdrop-filter:blur(6px)}
.reward-layer.show{display:flex}
.reward-card{width:calc(100% - 64px);max-width:320px;background:var(--surface-1);border:1px solid rgba(214,168,75,.35);border-radius:20px;padding:26px 24px;text-align:center}
.reward-clear{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.08em;color:var(--amber);margin-bottom:18px}
.reward-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--text-secondary);padding:7px 0}
.reward-row.total{border-top:1px solid var(--divider);margin-top:6px;padding-top:12px;color:var(--text-primary);font-weight:700}
.reward-balance{font-size:12px;color:var(--text-muted);margin-top:4px}
.reward-note{font-size:12.5px;color:var(--text-secondary);line-height:1.6;margin-top:16px}
.reward-continue{margin-top:20px;width:100%;background:var(--amber);color:#191206;border:none;border-radius:12px;padding:13px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}

/* ===== Fade to black + redirect ===== */
.fade-overlay{position:absolute;inset:0;z-index:9;background:#000;opacity:0;pointer-events:none;transition:opacity .9s ease}
.fade-overlay.show{opacity:1}
</style>

<script>

<script>
/* ===== Route-map minigame — simplified single-stage design: pick a label
   chip, tap its spot on the map, for each of the 4 stops
   (공항/서큘러키/숙소=Eastwood/영우 직장=Marayong). All 4 placed (any order) ->
   clear. The earlier 3-stage build (라벨 배치 → 관계 연결 → 이동 경로 확인) was
   cut down to just the label-placement stage per design direction — finding
   the 4 stations is the whole game now, no connect/route-order follow-up.
   Map image + hand-marked hotspots (배경 DB → 미니게임, /dev/upload) are
   unchanged infrastructure — this scene's own minigameStages (dialogueData.js)
   already listed all 4 stops, so /dev/upload already offers 4 hotspot slots.
   [써큘러키 낚시 씬 추가] 2번째 지점을 뭉뚱그린 "시티" 대신 실제 정류장인
   서큘러키(Circular Quay)로 바꿨다 — week1-scene-circular-quay(낚시 미니게임)
   가 그 지점에서 실제로 벌어지는 곳이다. */
const MINIGAME_ID = 'week1-scene-001-2-minigame';
const HOTSPOT_MIN_FR = 0.035; // floor on tap-target size so a careless hotspot still stays easy to hit

const LOCATIONS = [
  { id: 'airport', label: '공항' },
  { id: 'circular-quay', label: '서큘러키 (Circular Quay)' },
  { id: 'eastwood', label: '숙소 (Eastwood)' },
  { id: 'marayong', label: '영우 직장 (Marayong)' },
];

let CANVAS_W = 0, CANVAS_H = 0;
let hotspots = null; // [{x,y}, ...][4] — one free-form polygon per location, index-aligned with LOCATIONS
let mapImageGlowEls = [], mapImagePulseEls = [], pinCenters = [];

let placedIds = new Set();
let selectedChipId = null;

function hotspotToPoints(h) {
  if (!h) return null;
  if (h.points && h.points.length >= 3) return h.points;
  if (h.x1 !== undefined) return [{ x: h.x1, y: h.y1 }, { x: h.x2, y: h.y1 }, { x: h.x2, y: h.y2 }, { x: h.x1, y: h.y2 }];
  return null;
}
function isPointInPolygon(px, py, points) {
  let inside = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    const xi = points[i].x, yi = points[i].y, xj = points[j].x, yj = points[j].y;
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

const el = {
  frame: document.getElementById('frame'),
  mapStage: document.getElementById('mapStage'),
  mapCanvas: document.getElementById('mapCanvas'),
  stamp: document.getElementById('stamp'),
  labelTray: document.getElementById('labelTray'),
  dlgStrip: document.getElementById('dlgStrip'),
  portraitWrap: document.getElementById('portraitWrap'),
  portraitImg: document.getElementById('portraitImg'),
  portraitPlaceholder: document.getElementById('portraitPlaceholder'),
  dlgMission: document.getElementById('dlgMission'),
  dlgName: document.getElementById('dlgName'),
  dlgText: document.getElementById('dlgText'),
  rewardLayer: document.getElementById('rewardLayer'),
  rewardBase: document.getElementById('rewardBase'),
  rewardTotal: document.getElementById('rewardTotal'),
  rewardBalance: document.getElementById('rewardBalance'),
  rewardContinueBtn: document.getElementById('rewardContinueBtn'),
  fadeOverlay: document.getElementById('fadeOverlay'),
};

/* ===== Build the map ===== */
function buildImageMap(url) {
  const img = document.createElement('img');
  img.src = url;
  img.alt = '';
  img.draggable = false;
  Object.assign(img.style, { position: 'absolute', left: '0', top: '0', width: CANVAS_W + 'px', height: CANVAS_H + 'px' });
  el.mapCanvas.appendChild(img);

  mapImageGlowEls = [];
  mapImagePulseEls = [];
  pinCenters = [];
  hotspots.forEach(pts => {
    const cx = (pts.reduce((s, p) => s + p.x, 0) / pts.length) * CANVAS_W;
    const cy = (pts.reduce((s, p) => s + p.y, 0) / pts.length) * CANVAS_H;
    const r = Math.max(...pts.map(p => Math.hypot(p.x * CANVAS_W - cx, p.y * CANVAS_H - cy)), HOTSPOT_MIN_FR * CANVAS_W);
    pinCenters.push({ x: cx, y: cy, r });

    const glow = document.createElement('div');
    glow.className = 'image-area-glow';
    Object.assign(glow.style, { left: (cx - r * 1.6) + 'px', top: (cy - r * 1.6) + 'px', width: r * 3.2 + 'px', height: r * 3.2 + 'px' });
    el.mapCanvas.appendChild(glow);
    mapImageGlowEls.push(glow);

    const pulse = document.createElement('div');
    pulse.className = 'image-pulse-ring';
    Object.assign(pulse.style, { left: (cx - r) + 'px', top: (cy - r) + 'px', width: r * 2 + 'px', height: r * 2 + 'px' });
    el.mapCanvas.appendChild(pulse);
    mapImagePulseEls.push(pulse);
  });
}

async function initMap() {
  preloadMinigameFaces();
  LoadingOverlay.show('지도 불러오는 중');
  // 지도형 미니게임 배경은 location-background-system 설계안 범위 밖 — 기존
  // 레거시 sceneId 직접 배정 방식 그대로.
  const assetId = await DevGameState.getLegacyBackgroundId(MINIGAME_ID);
  const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
  const savedHotspots = await Promise.all(LOCATIONS.map((_, i) => DevGameState.getMinigameHotspot(MINIGAME_ID, i)))
    .then(hs => hs.map(hotspotToPoints));
  if (!asset || !asset.dataUrl || !savedHotspots.every(Boolean)) {
    LoadingOverlay.hide();
    showMissingMapNotice();
    return false;
  }
  hotspots = savedHotspots;
  CANVAS_W = asset.width;
  CANVAS_H = asset.height;
  await AssetDB.preloadImage(asset.dataUrl);
  buildImageMap(asset.dataUrl);
  fitToStage();
  updateMissionLine();
  renderLabelTray();
  LoadingOverlay.hide();
  return true;
}

function showMissingMapNotice() {
  el.dlgMission.textContent = '지도 없음';
  say('jisoo', 'blank', '지수', '어? 지도가 없는데?\n(오른쪽 위 "지도 업로드"에서 배경 이미지와 정답 영역 4개를 먼저 지정하세요.)');
}

function updateMissionLine() {
  el.dlgMission.textContent = `라벨 배치 (${placedIds.size}/${LOCATIONS.length})`;
}

/* ===== Pan + pinch/wheel zoom (unchanged from the original build) ===== */
let scale = 1, baseScale = 1, tx = 0, ty = 0;
const pointers = new Map();
let panStart = null;
let pinchStartDist = 0, pinchStartScale = 1;
let didPan = false;
let pressedPoint = null;
const MIN_SCALE_MULT = 1, MAX_SCALE_MULT = 3;

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
function clampScale(s) { return Math.min(Math.max(s, baseScale * MIN_SCALE_MULT), baseScale * MAX_SCALE_MULT); }
function clampPan() {
  const rect = el.mapStage.getBoundingClientRect();
  const scaledW = CANVAS_W * scale, scaledH = CANVAS_H * scale;
  tx = scaledW <= rect.width ? (rect.width - scaledW) / 2 : Math.min(0, Math.max(rect.width - scaledW, tx));
  ty = scaledH <= rect.height ? (rect.height - scaledH) / 2 : Math.min(0, Math.max(rect.height - scaledH, ty));
}
function applyTransform() { clampPan(); el.mapCanvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }

function fitToStage() {
  const rect = el.mapStage.getBoundingClientRect();
  baseScale = rect.height / CANVAS_H;
  scale = baseScale;
  tx = (rect.width - CANVAS_W * scale) / 2;
  ty = (rect.height - CANVAS_H * scale) / 2;
  applyTransform();
}
window.addEventListener('resize', fitToStage);
window.addEventListener('orientationchange', fitToStage);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitToStage);

function screenToCanvas(clientX, clientY) {
  const rect = el.mapStage.getBoundingClientRect();
  const stageX = clientX - rect.left, stageY = clientY - rect.top;
  return { x: (stageX - tx) / scale, y: (stageY - ty) / scale };
}

el.mapStage.addEventListener('pointerdown', (e) => {
  if (isCompleted) return;
  el.mapStage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  didPan = false;
  if (pointers.size === 1) {
    panStart = { x: e.clientX, y: e.clientY, tx, ty };
    pressedPoint = screenToCanvas(e.clientX, e.clientY);
  } else if (pointers.size === 2) {
    pressedPoint = null;
    const pts = [...pointers.values()];
    pinchStartDist = dist(pts[0], pts[1]);
    pinchStartScale = scale;
  }
});
el.mapStage.addEventListener('pointermove', (e) => {
  if (isCompleted || !pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1 && panStart) {
    const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) didPan = true;
    tx = panStart.tx + dx;
    ty = panStart.ty + dy;
    applyTransform();
  } else if (pointers.size === 2) {
    const pts = [...pointers.values()];
    const d = dist(pts[0], pts[1]);
    const newScale = clampScale(pinchStartScale * (d / pinchStartDist));
    const rect = el.mapStage.getBoundingClientRect();
    const midNow = mid(pts[0], pts[1]);
    const stageX = midNow.x - rect.left, stageY = midNow.y - rect.top;
    const ratio = newScale / scale;
    tx = stageX - (stageX - tx) * ratio;
    ty = stageY - (stageY - ty) * ratio;
    scale = newScale;
    didPan = true;
    applyTransform();
  }
});
['pointerup', 'pointercancel'].forEach(evt => el.mapStage.addEventListener(evt, (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStartDist = 0;
  if (pointers.size === 0) {
    panStart = null;
    if (evt === 'pointerup' && !didPan && !isCompleted && pressedPoint) onImageTap(pressedPoint);
    pressedPoint = null;
  }
}));
el.mapStage.addEventListener('wheel', (e) => {
  if (isCompleted) return;
  e.preventDefault();
  const rect = el.mapStage.getBoundingClientRect();
  const stageX = e.clientX - rect.left, stageY = e.clientY - rect.top;
  const newScale = clampScale(scale * (e.deltaY < 0 ? 1.1 : 0.9));
  const ratio = newScale / scale;
  tx = stageX - (stageX - tx) * ratio;
  ty = stageY - (stageY - ty) * ratio;
  scale = newScale;
  applyTransform();
}, { passive: false });

/* ===== Character portrait + dialogue strip ===== */
let portraitRequestToken = 0;
async function updatePortrait(characterKey, expression) {
  const requestToken = ++portraitRequestToken;
  const assetId = await DevGameState.getCharacterAssetId(characterKey, MINIGAME_FACE_EXPRESSION);
  if (requestToken !== portraitRequestToken) return;
  const asset = await AssetDB.getAsset(assetId).catch(() => null);
  if (requestToken !== portraitRequestToken) return;
  if (asset && asset.dataUrl) {
    el.portraitImg.src = asset.dataUrl;
    el.portraitImg.style.display = 'block';
    el.portraitPlaceholder.style.display = 'none';
  } else {
    el.portraitImg.removeAttribute('src');
    el.portraitImg.style.display = 'none';
    el.portraitPlaceholder.style.display = '';
  }
}

function say(characterKey, expression, speakerName, text) {
  el.dlgName.textContent = speakerName;
  el.dlgText.textContent = text;
  updatePortrait(characterKey, expression);
}

// 첫 대사가 뜨기 전에 지수/영우 미니게임 얼굴을 미리 받아둔다 — 안 그러면
// initMap의 지도 로딩이 끝나고 대사가 뜨는 순간 사진이 늦게 튀어나와 깜빡인다.
function preloadMinigameFaces() {
  return Promise.all(['jisoo', 'youngwoo'].map(async (key) => {
    const assetId = await DevGameState.getCharacterAssetId(key, MINIGAME_FACE_EXPRESSION).catch(() => null);
    const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
    if (asset && asset.dataUrl) await AssetDB.preloadImage(asset.dataUrl);
  }));
}

/* ===== Game state ===== */
let wrongClickCount = 0;
let isCompleted = false;
let hintTimers = [];

function scheduleHints() {
  clearHintTimers();
  hintTimers.push(setTimeout(() => triggerHint(1), 20000));
  hintTimers.push(setTimeout(() => triggerHint(2), 40000));
  hintTimers.push(setTimeout(() => triggerHint(3), 60000));
}
function clearHintTimers() { hintTimers.forEach(clearTimeout); hintTimers = []; }

// Which location index the currently-selected chip most wants glowed for a level-3 hint.
function currentHintTargetIndex() {
  return selectedChipId ? LOCATIONS.findIndex(l => l.id === selectedChipId) : -1;
}

function triggerHint(level) {
  if (isCompleted) return;
  if (level === 1) {
    say('jisoo', 'curious', '지수', '영우…\n힌트 하나만 주면 안 돼?');
    setTimeout(() => { if (!isCompleted) say('youngwoo', 'soft', '영우', '지도 잘 보고 찾아봐.'); }, 1600);
  } else if (level === 2) {
    say('jisoo', 'curious', '지수', '음…\n이 근처인가…?');
  } else if (level === 3) {
    const idx = currentHintTargetIndex();
    if (idx >= 0 && mapImageGlowEls[idx]) mapImageGlowEls[idx].classList.add('show');
  }
}

function flashWrongAtPoint(point) {
  const ring = document.createElement('div');
  ring.className = 'tap-wrong-ring';
  const r = 40;
  Object.assign(ring.style, { left: (point.x - r) + 'px', top: (point.y - r) + 'px', width: r * 2 + 'px', height: r * 2 + 'px' });
  el.mapCanvas.appendChild(ring);
  setTimeout(() => ring.remove(), 450);
}

function reactWrong() {
  wrongClickCount++;
  if (wrongClickCount === 1) say('jisoo', 'suspicious', '지수', '여긴 아닌 것 같은데?');
  else if (wrongClickCount === 2) say('jisoo', 'blank', '지수', '어… 잘못 짚은 것 같아.');
  else say('jisoo', 'annoyed', '지수', '아 나 진짜 길치라니까;;;;');
}

/* ===== Hit-testing — which of the 4 locations, if any, contains this tap. ===== */
function hitTestLocation(point) {
  for (let i = 0; i < hotspots.length; i++) {
    const pts = hotspots[i].map(p => ({ x: p.x * CANVAS_W, y: p.y * CANVAS_H }));
    const inShape = isPointInPolygon(point.x, point.y, pts);
    const c = pinCenters[i];
    const nearCentroid = Math.hypot(point.x - c.x, point.y - c.y) <= HOTSPOT_MIN_FR * CANVAS_W;
    if (inShape || nearCentroid) return i;
  }
  return -1;
}

/* ===== 라벨 배치 — pick a chip, tap its spot on the map (any order) ===== */
function renderLabelTray() {
  el.labelTray.classList.remove('hidden');
  el.labelTray.innerHTML = LOCATIONS.map(loc => {
    if (placedIds.has(loc.id)) return '';
    const selected = selectedChipId === loc.id;
    return `<button class="label-chip${selected ? ' selected' : ''}" data-chip="${loc.id}">${loc.label}</button>`;
  }).join('');
  el.labelTray.querySelectorAll('[data-chip]').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    selectedChipId = btn.dataset.chip;
    renderLabelTray();
  }));
}

function placePinTag(index) {
  const c = pinCenters[index];
  const tag = document.createElement('div');
  tag.className = 'pin-tag';
  tag.textContent = LOCATIONS[index].label;
  Object.assign(tag.style, { left: c.x + 'px', top: c.y + 'px' });
  el.mapCanvas.appendChild(tag);
}

function handleLabelTap(point) {
  if (!selectedChipId) {
    say('youngwoo', 'curious', '영우', '먼저 아래에서 이름표를 골라봐.');
    return;
  }
  const idx = hitTestLocation(point);
  if (idx === -1) { flashWrongAtPoint(point); reactWrong(); return; }
  const loc = LOCATIONS[idx];
  if (placedIds.has(loc.id)) { flashWrongAtPoint(point); return; }
  if (loc.id !== selectedChipId) { flashWrongAtPoint(point); reactWrong(); return; }

  placedIds.add(loc.id);
  selectedChipId = null;
  markStationSuccess(idx);
  playSuccessBeep();
  placePinTag(idx);
  renderLabelTray();
  updateMissionLine();
  wrongClickCount = 0;

  if (placedIds.size === LOCATIONS.length) {
    clearHintTimers();
    say('jisoo', 'happy', '지수', '오, 네 곳 다 이름표 붙였다!');
    setTimeout(() => { if (!isCompleted) say('youngwoo', 'happy', '영우', '잘 찾았어.\n이제 실제로 가보자.'); }, 1400);
    setTimeout(completeGame, 2400);
  } else {
    scheduleHints();
  }
}

function onImageTap(point) {
  if (isCompleted || !hotspots) return;
  handleLabelTap(point);
}

function markStationSuccess(index) {
  if (mapImagePulseEls[index]) mapImagePulseEls[index].classList.add('success');
}

function playSuccessBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.15);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.4);
  } catch (e) { /* audio unavailable — not critical to gameplay */ }
}

function completeGame() {
  clearHintTimers();
  isCompleted = true;
  el.stamp.textContent = 'SYDNEY MAP CLEAR';
  el.stamp.classList.add('show');
  setTimeout(showRewardScreen, 850);
}

/* ===== Reward screen (The Missing Key v1 §4.5/§11.2) — 500P,
   first_clear_only so replaying this minigame never pays out twice (§4.4). */
const MAP_REWARD_ID = 'reward-week1-map-first-clear';
function showRewardScreen() {
  const alreadyClaimed = EconomyState.hasClaimedReward(MAP_REWARD_ID);
  const paid = EconomyState.claimReward(MAP_REWARD_ID, 500, { source: 'week1-map-tutorial' });
  CaseFileState.setFlag('week1MapMinigameCleared', true);
  if (paid > 0) CaseFileState.setFlag('pointsUiIntroduced', true);
  el.dlgStrip.classList.add('hidden');
  el.rewardBase.textContent = '+500P';
  el.rewardTotal.textContent = (paid > 0 ? '+' + paid : '+0') + 'P';
  el.rewardBalance.textContent = `보유 포인트 ${EconomyState.getPoints()}P`;
  document.querySelector('.reward-note').style.display = alreadyClaimed ? 'none' : '';
  el.rewardLayer.classList.add('show');
}
// The post-clear celebration/callback used to be a custom successLines VN
// overlay duplicated here — but week1-scene-train (dialogueData.js) already
// opens with that exact callback (see its header comment), same as how the
// fishing minigame hands off straight into week1-scene-002-1's opening
// lines instead of rendering its own success dialogue. So this just fades
// into the real scene, same as skipBtn below.
el.rewardContinueBtn.addEventListener('click', () => {
  el.rewardLayer.classList.remove('show');
  fadeOutAndRedirect();
});

function fadeOutAndRedirect() {
  el.fadeOverlay.classList.add('show');
  setTimeout(() => { location.href = '/play/game/?scene=week1-scene-train'; }, 950);
}

document.getElementById('skipBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  fadeOutAndRedirect();
});

/* ===== Boot ===== */
initMap().then((ready) => {
  if (!ready) return;
  say('jisoo', 'curious', '지수', '음... 어디부터 붙이지?');
  setTimeout(() => { if (!isCompleted) say('youngwoo', 'soft', '영우', '아래 이름표 하나 골라서\n지도 위에 맞는 자리를 찾아봐.'); }, 2200);
  scheduleHints();
});
</script>
