<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · 옷가게</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}
.frame{width:100%;max-width:430px;min-height:100dvh;display:flex;flex-direction:column}

/* ===== Header — spec §5.4: "← 돌아가기 / P 900" ===== */
.shop-header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px;background:rgba(8,10,12,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--divider)}
.back-btn{font-family:var(--mono);font-size:12px;color:var(--text-primary);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;padding:6px 0}
.header-title{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--text-secondary);text-transform:uppercase}
.header-points{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--amber)}

/* ===== Preview panel ===== */
.preview-panel{position:relative;height:220px;background:linear-gradient(160deg,#171c22 0%,#0d1114 60%,#080a0c 100%);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-bottom:1px solid var(--divider)}
.preview-img{max-height:100%;max-width:70%;object-fit:contain}
.preview-placeholder{padding-bottom:24px;color:var(--text-muted);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-align:center}
.preview-label{position:absolute;top:12px;left:14px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase}

/* ===== Filter tabs ===== */
.tabbar{display:flex;gap:6px;padding:14px 16px 4px;flex-shrink:0}
.tab{flex:1;background:var(--surface-1);border:1px solid var(--divider);color:var(--text-secondary);border-radius:10px;padding:9px 4px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.tab.active{color:var(--amber);border-color:rgba(214,168,75,.5);background:rgba(214,168,75,.08)}

/* ===== Product list ===== */
.list{flex:1;overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:12px}
.item-card{position:relative;background:var(--surface-1);border:1px solid var(--divider);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.item-thumb{width:56px;height:56px;border-radius:12px;background:var(--surface-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-muted);overflow:hidden}
.item-thumb img{width:100%;height:100%;object-fit:cover}
.item-body{flex:1;min-width:0}
.item-name{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.item-new-badge{font-family:var(--mono);font-size:9.5px;font-weight:700;color:#06181c;background:var(--cyan);border-radius:8px;padding:2px 6px;letter-spacing:.04em}
.item-desc{font-size:12px;color:var(--text-secondary);margin-top:3px;line-height:1.5}
.item-meta{display:flex;align-items:center;gap:8px;margin-top:8px}
.item-price{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--amber)}
.item-rarity{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--text-muted);text-transform:uppercase;border:1px solid var(--divider);border-radius:8px;padding:1px 6px}
.item-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.item-btn{font-family:var(--mono);font-size:11px;font-weight:700;border-radius:10px;padding:8px 12px;border:none;cursor:pointer;white-space:nowrap}
.item-btn.preview{background:var(--surface-2);color:var(--text-primary);border:1px solid var(--divider)}
.item-btn.buy{background:var(--amber);color:#191206}
.item-btn.buy:disabled{opacity:.4;cursor:default}
.item-owned-tag{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--cyan);border:1px solid rgba(89,184,200,.4);border-radius:10px;padding:8px 10px;text-align:center}
.item-equipped-tag{font-family:var(--mono);font-size:9.5px;color:var(--text-muted);margin-top:4px;text-align:center}

.item-card.locked{opacity:.5}
.item-card.locked .item-thumb{filter:grayscale(1) brightness(.5)}
.lock-reason{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);margin-top:6px}

.empty-note{text-align:center;color:var(--text-muted);font-size:13px;padding:40px 0}

/* ===== Confirm / purchased sheet ===== */
.sheet-overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet-overlay.hidden{display:none}
.sheet{width:100%;max-width:430px;background:var(--surface-1);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0));border-top:1px solid var(--divider)}
.sheet-title{font-size:16px;font-weight:700;margin-bottom:14px;line-height:1.5;word-break:keep-all}
.sheet-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text-secondary);padding:8px 0;border-top:1px solid var(--divider)}
.sheet-row.total{color:var(--text-primary);font-weight:700}
.sheet-warn{font-size:12.5px;color:#e08a8a;margin-top:12px;line-height:1.5}
.sheet-btn-row{display:flex;gap:10px;margin-top:18px}
.sheet-btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.sheet-btn.cancel{background:var(--surface-2);color:var(--text-primary)}
.sheet-btn.confirm{background:var(--amber);color:#191206}
.sheet-btn:disabled{opacity:.4;cursor:default}

/* ===== Error toast (장착 서버 동기화 실패 등) ===== */
.mk-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%) translateY(8px);z-index:30;background:rgba(58,13,13,.94);border:1px solid rgba(217,65,65,.45);color:#ffb4b4;border-radius:14px;padding:12px 18px;font-size:13px;line-height:1.5;text-align:center;max-width:86%;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease}
.mk-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.item-btn.buy[disabled]{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="frame">
  <div class="shop-header">
    <button class="back-btn" id="backBtn">← 돌아가기</button>
    <div class="header-title">옷가게</div>
    <div class="header-points" id="headerPoints">P 0</div>
  </div>

  <div class="preview-panel">
    <div class="preview-label" id="previewLabel">미리보기</div>
    <img class="preview-img" id="previewImg" style="display:none" alt="">
    <div class="preview-placeholder" id="previewPlaceholder">이미지 없음<br>(업로드 전)</div>
  </div>

  <div class="tabbar" id="tabbar"></div>
  <div class="list" id="list"></div>
</div>

<div class="sheet-overlay hidden" id="confirmOverlay">
  <div class="sheet">
    <div class="sheet-title" id="confirmTitle"></div>
    <div class="sheet-row"><span>보유 포인트</span><span id="confirmBalance"></span></div>
    <div class="sheet-row total"><span>구매 후</span><span id="confirmAfter"></span></div>
    <div class="sheet-warn hidden" id="confirmWarn"></div>
    <div class="sheet-btn-row">
      <button class="sheet-btn cancel" id="confirmCancelBtn">취소</button>
      <button class="sheet-btn confirm" id="confirmBuyBtn">구매</button>
    </div>
  </div>
</div>

<div class="sheet-overlay hidden" id="wearOverlay">
  <div class="sheet">
    <div class="sheet-title" id="wearTitle"></div>
    <div class="sheet-btn-row">
      <button class="sheet-btn cancel" id="wearLaterBtn">나중에</button>
      <button class="sheet-btn confirm" id="wearNowBtn">지금 착용하기</button>
    </div>
  </div>
</div>

<div class="mk-toast" id="toast"></div>

<script src="/dev/assetDb.js"></script>
<script src="/dev/dialogueData.js"></script>
<script src="/dev/caseFileData.js"></script>
<script src="/dev/caseFileState.js"></script>
<script src="/dev/data/shopItems.js"></script>
<script src="/dev/state/economyState.js"></script>
<script src="/dev/state/wardrobeState.js"></script>
<script src="/dev/state/shopState.js"></script>
<script>
const RARITY_LABEL = { basic: 'BASIC', select: 'SELECT', premium: 'PREMIUM', achievement: 'ACHIEVEMENT' };
const TABS = [
  { id: 'all', label: '전체' },
  { id: 'basic', label: 'Basic' },
  { id: 'select', label: 'Select' },
  { id: 'owned', label: '소유' },
];
let activeTab = 'all';
let previewOutfitId = null; // '입어보기' — temporary preview, doesn't change equippedOutfitId
let pendingPurchaseId = null;

const el = {
  backBtn: document.getElementById('backBtn'),
  headerPoints: document.getElementById('headerPoints'),
  previewImg: document.getElementById('previewImg'),
  previewPlaceholder: document.getElementById('previewPlaceholder'),
  previewLabel: document.getElementById('previewLabel'),
  tabbar: document.getElementById('tabbar'),
  list: document.getElementById('list'),
  confirmOverlay: document.getElementById('confirmOverlay'),
  confirmTitle: document.getElementById('confirmTitle'),
  confirmBalance: document.getElementById('confirmBalance'),
  confirmAfter: document.getElementById('confirmAfter'),
  confirmWarn: document.getElementById('confirmWarn'),
  confirmCancelBtn: document.getElementById('confirmCancelBtn'),
  confirmBuyBtn: document.getElementById('confirmBuyBtn'),
  wearOverlay: document.getElementById('wearOverlay'),
  wearTitle: document.getElementById('wearTitle'),
  wearLaterBtn: document.getElementById('wearLaterBtn'),
  wearNowBtn: document.getElementById('wearNowBtn'),
  toast: document.getElementById('toast'),
};

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// DevGameState's outfit/character-asset lookups are part of the server-backed
// API contract — this tolerates either today's synchronous localStorage reads
// or a future rejected/thrown server call without taking the whole preview
// down, falling back to "no asset found" either way.
async function safeCall(fn) {
  try { return await fn(); } catch (err) { console.error(err); return null; }
}

let toastTimer = null;
function showToast(message) {
  el.toast.textContent = message;
  el.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove('show'), 3400);
}

function goBack() {
  const url = sessionStorage.getItem('mkShopReturnUrl');
  location.href = url || '/play/';
}
el.backBtn.addEventListener('click', goBack);

function updateHeaderPoints() { el.headerPoints.textContent = 'P ' + EconomyState.getPoints(); }

// requestToken guards against a fast preview-switch race: if the user taps
// 입어보기 on a second item before the first item's asset lookups resolve,
// the first call's late-arriving asset must not clobber the second item's
// preview that's already on screen.
let previewRequestToken = 0;
async function updatePreview(outfitId) {
  const requestToken = ++previewRequestToken;
  const id = outfitId || WardrobeState.getEquippedOutfitId();
  const isEquipped = id === WardrobeState.getEquippedOutfitId();
  el.previewLabel.textContent = isEquipped ? '현재 착용 중' : '미리보기';
  let asset = null;
  // Not-yet-equipped preview ('입어보기' before buying): try that specific
  // item's own art first — characterAssetKey (dedicated shop upload), then
  // vnOutfitId (reused VN art) — so the preview never falls through to
  // whatever's currently equipped/globally selected instead of the item
  // actually being previewed. A plain getCharacterAssetId('jisoo', ...)
  // lookup would short-circuit on the globally-selected outfit before ever
  // reaching either of these, which is why they're tried first and directly
  // rather than through resolveOutfitForScene.
  if (!isEquipped) {
    const item = shopItems[id];
    if (item && item.characterAssetKey) {
      const keyAssetId = await safeCall(() => DevGameState.getCharacterAssetId(item.characterAssetKey, 'neutral'));
      if (requestToken !== previewRequestToken) return;
      asset = keyAssetId ? await AssetDB.getAsset(keyAssetId).catch(() => null) : null;
      if (requestToken !== previewRequestToken) return;
    }
    if (!asset && item && item.vnOutfitId) {
      const vnAssetId = await safeCall(() => DevGameState.getCharacterAssetIdForOutfit('jisoo', item.vnOutfitId, 'neutral'));
      if (requestToken !== previewRequestToken) return;
      asset = vnAssetId ? await AssetDB.getAsset(vnAssetId).catch(() => null) : null;
      if (requestToken !== previewRequestToken) return;
    }
  }
  // Currently-equipped preview (or an item with no dedicated/reused art):
  // resolveOutfitForScene resolves the *equipped* item's characterAssetKey
  // if any; equipOutfit() already synced DevGameState.setSelectedOutfit for
  // vnOutfitId items, so the base 'jisoo' fallback below resolves those too.
  if (!asset) {
    const resolution = WardrobeState.resolveOutfitForScene('jisoo', outfitId && !isEquipped ? { outfitMode: 'story_locked', storyOutfitId: outfitId } : {});
    const assetId = await safeCall(() => DevGameState.getCharacterAssetId(resolution.characterId, 'neutral'));
    if (requestToken !== previewRequestToken) return;
    if (assetId) asset = await AssetDB.getAsset(assetId).catch(() => null);
    if (requestToken !== previewRequestToken) return;
    if (!asset && resolution.characterId !== 'jisoo') {
      const baseId = await safeCall(() => DevGameState.getCharacterAssetId('jisoo', 'neutral'));
      if (requestToken !== previewRequestToken) return;
      asset = baseId ? await AssetDB.getAsset(baseId).catch(() => null) : null;
      if (requestToken !== previewRequestToken) return;
    }
  }
  if (asset && asset.dataUrl) {
    el.previewImg.src = asset.dataUrl;
    el.previewImg.style.display = '';
    el.previewPlaceholder.style.display = 'none';
  } else {
    el.previewImg.style.display = 'none';
    el.previewPlaceholder.style.display = '';
  }
}

function renderTabs() {
  el.tabbar.innerHTML = TABS.map(t => `<button class="tab${t.id === activeTab ? ' active' : ''}" data-tab="${t.id}">${t.label}</button>`).join('');
  el.tabbar.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', () => { activeTab = btn.dataset.tab; renderList(); renderTabs(); }));
}

function itemMatchesTab(item) {
  if (activeTab === 'all') return true;
  if (activeTab === 'owned') return item.owned;
  return item.rarity === activeTab;
}

function renderList() {
  const unlockedItems = ShopState.getAvailableShopItems();
  const lockedItems = Object.values(shopItems).filter(i => !ShopState.isShopItemUnlocked(i.id));
  const visibleUnlocked = unlockedItems.filter(itemMatchesTab);
  const visibleLocked = activeTab === 'all' ? lockedItems : [];

  if (!visibleUnlocked.length && !visibleLocked.length) {
    el.list.innerHTML = '<div class="empty-note">해당 조건의 상품이 없습니다.</div>';
    return;
  }

  el.list.innerHTML = visibleUnlocked.map(renderUnlockedCard).join('') + visibleLocked.map(renderLockedCard).join('');
  // Marked seen *after* rendering this pass (so the NEW badge shows once,
  // this render, then clears on the next) — not on purchase alone, so
  // browsing the shop without buying also clears NEW like spec §5.4 implies.
  visibleUnlocked.forEach(i => ShopState.markShopItemSeen(i.id));

  el.list.querySelectorAll('[data-preview]').forEach(btn => btn.addEventListener('click', () => {
    previewOutfitId = btn.dataset.preview;
    updatePreview(previewOutfitId);
  }));
  el.list.querySelectorAll('[data-buy]').forEach(btn => btn.addEventListener('click', () => openConfirm(btn.dataset.buy)));
  el.list.querySelectorAll('[data-equip]').forEach(btn => btn.addEventListener('click', () => handleEquipClick(btn.dataset.equip, btn)));
}

// 저장 완료 전 중복 클릭 방지 — 성공 시엔 renderList()가 카드를 다시 그려
// 버튼 상태를 자연히 정리하고, 실패 시엔 여기서 직접 원상복구한다(장착 자체는
// WardrobeState.equipOutfit 내부에서 이미 롤백됨).
async function handleEquipClick(itemId, btn) {
  if (btn.disabled) return;
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '착용 중...';
  const result = await WardrobeState.equipOutfit(itemId);
  if (!result.success) {
    btn.disabled = false;
    btn.textContent = originalText;
    showToast('의상 장착 동기화에 실패했습니다. 다시 시도해주세요.');
    return;
  }
  previewOutfitId = null;
  updatePreview();
  renderList();
}

function renderUnlockedCard(item) {
  const equipped = item.owned && WardrobeState.getEquippedOutfitId() === item.id;
  return `
    <div class="item-card">
      <div class="item-thumb">👗</div>
      <div class="item-body">
        <div class="item-name">${escapeHtml(item.name)}${item.isNew ? '<span class="item-new-badge">NEW</span>' : ''}</div>
        <div class="item-desc">${escapeHtml(item.description || '')}</div>
        <div class="item-meta">
          <span class="item-price">${item.price}P</span>
          <span class="item-rarity">${RARITY_LABEL[item.rarity] || item.rarity}</span>
        </div>
      </div>
      <div class="item-actions">
        <button class="item-btn preview" data-preview="${item.id}">입어보기</button>
        ${item.owned
          ? (equipped ? '<div class="item-owned-tag">착용 중</div>' : `<button class="item-btn buy" data-equip="${item.id}">착용하기</button>`)
          : `<button class="item-btn buy" data-buy="${item.id}">구매</button>`}
      </div>
    </div>
  `;
}

function renderLockedCard(item) {
  return `
    <div class="item-card locked">
      <div class="item-thumb">🔒</div>
      <div class="item-body">
        <div class="item-name">${escapeHtml(item.name)}</div>
        <div class="lock-reason">${describeUnlockCondition(item)}</div>
      </div>
    </div>
  `;
}

function describeUnlockCondition(item) {
  const conds = item.unlockConditions || [];
  if (!conds.length) return '아직 해금 조건이 설정되지 않았습니다.';
  return '조건 미달성 · ' + conds.map(c => {
    if (c.type === 'flagEquals') return c.key;
    if (c.type === 'flagAtLeast') return `${c.key} ${c.min}+`;
    if (c.type === 'weekReached') return `${c.value}주차 이상`;
    return c.type;
  }).join(', ');
}

function openConfirm(itemId) {
  const item = shopItems[itemId];
  if (!item) return;
  pendingPurchaseId = itemId;
  const balance = EconomyState.getPoints();
  const after = balance - item.price;
  el.confirmTitle.textContent = `'${item.name}'을(를) ${item.price}P에 구매할까요?`;
  el.confirmBalance.textContent = `${balance}P`;
  el.confirmAfter.textContent = `${after}P`;
  const short = after < 0;
  el.confirmWarn.classList.toggle('hidden', !short);
  if (short) el.confirmWarn.textContent = `포인트가 ${Math.abs(after)}P 부족합니다. 비수사 미니게임을 플레이하면 포인트를 얻을 수 있습니다.`;
  el.confirmBuyBtn.disabled = short;
  el.confirmOverlay.classList.remove('hidden');
}
el.confirmCancelBtn.addEventListener('click', () => el.confirmOverlay.classList.add('hidden'));
el.confirmOverlay.addEventListener('click', (e) => { if (e.target === el.confirmOverlay) el.confirmOverlay.classList.add('hidden'); });
el.confirmBuyBtn.addEventListener('click', () => {
  const itemId = pendingPurchaseId;
  const result = ShopState.purchaseShopItem(itemId);
  el.confirmOverlay.classList.add('hidden');
  if (!result.success) return;
  ShopState.markShopItemSeen(itemId);
  updateHeaderPoints();
  renderList();
  const item = shopItems[itemId];
  el.wearTitle.textContent = `'${item.name}'을(를) 구매했습니다. 지금 착용할까요?`;
  el.wearOverlay.dataset.itemId = itemId;
  el.wearOverlay.classList.remove('hidden');
});
el.wearLaterBtn.addEventListener('click', () => el.wearOverlay.classList.add('hidden'));
el.wearNowBtn.addEventListener('click', async () => {
  const itemId = el.wearOverlay.dataset.itemId;
  el.wearNowBtn.disabled = true;
  const result = await WardrobeState.equipOutfit(itemId);
  el.wearNowBtn.disabled = false;
  el.wearOverlay.classList.add('hidden');
  previewOutfitId = null;
  updatePreview();
  renderList();
  // 구매 자체는 이미 완료된 뒤라(confirmBuyBtn 핸들러 참고) 장착 동기화
  // 실패를 구매 실패처럼 보이게 하지 않는다 — 별도 토스트로만 안내.
  if (!result.success) showToast('구매는 완료됐지만 의상 장착 동기화에 실패했습니다. 옷장에서 다시 시도해주세요.');
});

(function init() {
  updateHeaderPoints();
  renderTabs();
  renderList();
  updatePreview();
})();
</script>
</body>
</html>
