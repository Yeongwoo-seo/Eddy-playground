function renderCatchingReelLine() {
  if (!catchingBitePt) return;
  const frameRect = el.frame.getBoundingClientRect();
  renderCastLine(reelTipPxForFrame(currentReelFrameIndex, frameRect), catchingBitePt, reelLineSlack(currentReelFrameIndex));
}
function stopReelHoldAnim() {
  if (reelHoldTimer) { clearTimeout(reelHoldTimer); reelHoldTimer = null; }
}
function playReelHoldSeq(seq) {
  stopReelHoldAnim();
  if (reelFrameUrls.length < 4) return;
  el.charImg.classList.remove('hidden');
  el.charFallback.classList.add('hidden');
  let i = 0;
  function step() {
    currentReelFrameIndex = seq[i];
    el.charImg.src = reelFrameUrls[seq[i]];
    renderCatchingReelLine();
    i++;
    reelHoldTimer = i < seq.length ? setTimeout(step, reelMotion.holdFrameMs) : null;
  }
  step();
}

/* ===== 캐스팅 모션 윈드업 — 홀드 시작하자마자 1→2번 프레임을 재생하고
   2번에서 멈춰 유지한다(놓을 때까지). 놓으면 releasePowerAndCast가
   3번 프레임부터 이어서 순차 재생한다. 프레임이 2장 미만이면 할 게 없다.
   castWindupFrameIndex는 지금 화면에 보이는 프레임 번호를 따로 기록해둔다
   — 손을 떼는 순간(releasePowerAndCast) 줄/추가 "이미 그 시점에 보이던
   낚싯대 끝"에서 생기게 하려면 항상 1번 프레임이 아니라 이 값을 origin
   계산에 써야 한다. */
let castWindupFrameIndex = 0;
function playCastWindup() {
  castWindupFrameIndex = 0;
  if (castFrameUrls.length < 2) return;
  el.charImg.classList.remove('hidden');
  el.charFallback.classList.add('hidden');
  // 캐스팅·올리기 시트는 옆모습 한 장뿐이고 원본은 왼쪽을 보는 포즈라,
  // 오른쪽을 보고 있던 채로 낚시를 시작하면 좌우반전해서 쓴다(위/아래는
  // 아직 미구현 — 반전 없이 원본 그대로 나간다). 캐스팅 시작 시점(여기)에
  // 한 번만 정하면 되는 건, 낚시 중엔 이동이 막혀 lastFacingDir이 안
  // 바뀌기 때문에 resetToIdle까지 이 클래스가 그대로 유지돼도 캐스팅→
  // 올리기→결과 연출 내내(el.charImg.src만 바뀌는) 계속 맞게 반전돼 있다.
  el.charImg.classList.toggle('char-mirror-x', lastFacingDir === 'right');
  el.charImg.src = castFrameUrls[0];
  const ms = Array.isArray(castFrameDurations) ? (castFrameDurations[0] || 90) : (castFrameDurations || 90);
  setTimeout(() => {
    if (gameState !== 'charging') return; // 그 사이 이미 놓였으면 덮어쓰지 않는다
    el.charImg.src = castFrameUrls[1];
    castWindupFrameIndex = 1;
  }, ms);
}

/* ===== 캐스팅 세기 조절 (누르고 있는 동안) ===== */
// 세기값 하나로 정해지는 단일 색(낮음=빨강 → 중간=노랑 → 높음=초록)을 계산한다.
// .cast-power-fill 안에서 색이 번지는 그라데이션이 아니라, 막대 전체가 그
// 순간의 세기에 맞는 색 한 가지로 칠해진다. alpha는 커스텀 게이지 모드에서
// 배경 그림이 비치도록 반투명(.55)을 줄 때 쓴다.
function powerToColor(power, alpha) {
  const p = Math.max(0, Math.min(100, power));
  const RED = [217, 65, 65], AMBER = [214, 168, 75], GREEN = [62, 207, 107];
  const [lo, hi, t] = p <= 50 ? [RED, AMBER, p / 50] : [AMBER, GREEN, (p - 50) / 50];
  const r = Math.round(lo[0] + (hi[0] - lo[0]) * t);
  const g = Math.round(lo[1] + (hi[1] - lo[1]) * t);
  const b = Math.round(lo[2] + (hi[2] - lo[2]) * t);
  return `rgba(${r},${g},${b},${alpha == null ? 1 : alpha})`;
}
function startPowerCharge() {
  gameState = 'charging';
  stopMoveHold();
  el.joystick.classList.add('hidden');
  el.castPowerWrap.classList.remove('hidden');
  positionCastGaugeAboveCharacter();
  playCastWindup();
  castChargeStartT = performance.now();
  const periodSec = CAST_POWER_PERIOD_MS / 1000;
  const isCustomGauge = el.castPowerWrap.classList.contains('custom-gauge');
  function tick(ts) {
    if (gameState !== 'charging') return;
    const t = (ts - castChargeStartT) / 1000;
    const phase = (t / periodSec) * (2 * Math.PI);
    castPower = 50 - 50 * Math.cos(phase); // 0 → 100 → 0 사인파
    el.castPowerFill.style.width = castPower + '%';
    el.castPowerFill.style.background = powerToColor(castPower, isCustomGauge ? 0.55 : 1);
    castChargeRaf = requestAnimationFrame(tick);
  }
  castChargeRaf = requestAnimationFrame(tick);
}

/* ===== 세기 확정 → 캐스팅 모션 → 추 던지기(물리) → 입질 대기 =====
   손을 떼는(release) 순간 낚싯줄을 바로 만든다 — origin은 그 순간 화면에
   이미 보이고 있던 윈드업 프레임(castWindupFrameIndex)의 낚싯대 끝이다.
   추 낙하 물리(throwSinker)는 release 즉시 시작한다 — 예전엔 남은
   팔로우스루 프레임(3~6번)이 다 재생될 때까지 기다린 뒤에야 물리를
   시작해서 "손을 떼도 한참 있다가 던져진다"는 체감 지연이 있었다.
   이제 팔로우스루 애니메이션과 추 낙하 물리를 동시에 진행하고, 낚싯줄의
   낚싯대 쪽 끝(rodTip)만 애니메이션 진행에 따라 계속 갱신한다(추 쪽
   끝은 throwSinker가 매 프레임 그린다) — 낚싯대를 따라 줄이 움직이는
   것처럼 보이면서도 추는 릴리즈 순간부터 바로 날아간다. */
async function releasePowerAndCast() {
  if (gameState !== 'charging') return;
  cancelAnimationFrame(castChargeRaf);
  const power = castPower;
  el.castPowerWrap.classList.add('hidden');
  gameState = 'casting';

  const frameRect = el.frame.getBoundingClientRect();
  el.castSvg.setAttribute('viewBox', `0 0 ${frameRect.width} ${frameRect.height}`);
  const origin = rodTipPxForFrame(castWindupFrameIndex, frameRect); // 뗄 때 이미 화면에 보이던 프레임의 낚싯대 끝 — 물리 시작점
  el.bobber.classList.add('hidden');
  el.castSvg.classList.remove('hidden');
  renderCastLine(origin, origin);
  vibrate(15);

  let rodTip = origin; // 팔로우스루 프레임이 재생되는 동안 계속 갱신 — throwSinker의 렌더 루프가 매 프레임 읽는다
  const animPromise = (async () => {
    if (castFrameUrls.length > 2) {
      // 1,2번은 윈드업(playCastWindup)에서 이미 재생했다 — 3번부터 이어서.
      // onFrame(i)의 i는 remainingUrls 기준(0부터 다시 셈)이라, 원래
      // 6프레임 인덱스를 기대하는 rodTipPxForFrame에는 +2해서 넘긴다.
      const remainingUrls = castFrameUrls.slice(2);
      const remainingDurations = Array.isArray(castFrameDurations) ? castFrameDurations.slice(2) : castFrameDurations;
      await playFrameSequence(remainingUrls, remainingDurations || 90, (i) => {
        rodTip = rodTipPxForFrame(i + 2, frameRect);
      });
    } else if (!castFrameUrls.length) {
      el.charFallback.style.transition = 'transform .35s ease';
      el.charFallback.style.transform = 'rotate(-25deg)';
      await wait(350);
      el.charFallback.style.transform = 'rotate(0deg)';
    }
  })();
  // 캐스팅이 끝난 뒤에도 el.charImg는 그대로 두면 캐스팅 마지막 프레임
  // 포즈에 머문다(playFrameSequence가 이미 그렇게 남겨둠) — idle로
  // 되돌리지 않아야 낚싯대 끝 위치가 대기/입질 내내 그 프레임 기준으로
  // 유지된다. idle 포즈로는 resetToIdle(새 판 시작)에서만 되돌아간다.
  const throwPromise = throwSinker(power, origin, frameRect, () => rodTip);
  const [, throwResult] = await Promise.all([animPromise, throwPromise]);
  // 팔로우스루 애니메이션(animPromise)까지 완전히 끝난 뒤의 rodTip을 써야
  // 화면에 실제로 보이는 최종 프레임의 낚싯대 끝과 일치한다.
  lastRodTipPt = rodTip;
  if (throwResult.blocked) {
    // 추가 낚시가능 영역 안에 떨어지면 낚시가 진행되지 않는다 — 캐스팅
    // 취소. 착수 지점에서 바로 사라지는 대신, 올리기 4번 프레임을 유지한
    // 채 추가 낚싯대 끝(캐릭터)으로 되감겨 돌아오는 걸 보여준 뒤에야
    // 대기 상태로 되돌린다. 되감기는 캐스팅 프레임이 아니라 올리기 4번
    // 프레임의 낚싯대 끝(reelTipPxForFrame)을 기준으로 하고, 4번은 완전히
    // 팽팽한 직선(reelLineSlack(3)===0)으로 이어 그린다. 되감기 이동시간은
    // throwSinker가 돌려준 flightMs(이번 캐스팅이 날아간 시간)를 그대로
    // 써서, 날아간 시간만큼 되돌아오게 한다.
    let reelBackOrigin = rodTip;
    if (reelFrameUrls.length > 3) {
      stopReelHoldAnim();
      el.charImg.classList.remove('hidden');
      el.charFallback.classList.add('hidden');
      el.charImg.src = reelFrameUrls[3];
      reelBackOrigin = reelTipPxForFrame(3, frameRect);
    }
    await reelSinkerBack(reelBackOrigin, 3, throwResult.flightMs);
    el.bobber.classList.add('hidden');
    el.castSvg.classList.add('hidden');
    resetToIdle();
    return;
  }
  waitForBite();
}

// 캐스팅/올리기 시트는 방향별로 따로 없는 옆모습 한 장뿐이라(원본은 왼쪽을
// 보는 포즈 — 오른쪽을 보고 있을 때는 el.charImg에 char-mirror-x 클래스로
// 좌우반전해서 쓴다, playCastWindup 참고), 반전된 상태에선 저장된 낚싯대
// 끝 x좌표(왼쪽 기준 원본 그림 기준)도 화면에서는 반대쪽(1-x)에 나타난다.
// 그대로 두면 줄이 실제 낚싯대 끝과 다른 자리에 그려진다.
function isCharMirrored() { return el.charImg.classList.contains('char-mirror-x'); }

// 낚싯대 끝 위치 — dev/minigame-fishing/index.html의 낚시대 끝 지정
// 도구에서 프레임별로 저장한 정규화 좌표(castingFrameRodTips, char-stage
// 박스 기준 0~1)를 실제 char-stage 박스 픽셀 크기에 곱해 el.frame 기준
// 픽셀 좌표로 바꾼다. 지정 안 한 프레임은 DEFAULT_ROD_TIP_FRAC로 폴백.
function rodTipPxForFrame(frameIndex, frameRect) {
  const charRect = el.charStage.getBoundingClientRect();
  const pt = castingFrameRodTips[frameIndex] || DEFAULT_ROD_TIP_FRAC;
  const px = isCharMirrored() ? 1 - pt.x : pt.x;
  return {
    x: charRect.left - frameRect.left + px * charRect.width,
    y: charRect.top - frameRect.top + pt.y * charRect.height,
  };
}

// 올리기 프레임 버전의 rodTipPxForFrame — 저장된 좌표(reelFrameRodTips)만
// 다르고 픽셀화 방식은 동일하다.
function reelTipPxForFrame(frameIndex, frameRect) {
  const charRect = el.charStage.getBoundingClientRect();
  const pt = reelFrameRodTips[frameIndex] || DEFAULT_ROD_TIP_FRAC;
  const px = isCharMirrored() ? 1 - pt.x : pt.x;
  return {
    x: charRect.left - frameRect.left + px * charRect.width,
    y: charRect.top - frameRect.top + pt.y * charRect.height,
  };
}

// 올리기 동작 중 낚싯줄의 팽팽함 — 캐스팅 때의 느슨한 현수선(catenaryPoints
// 기본 12% 여유)과 달리 릴을 감아 올리는 중이라 훨씬 팽팽하다. 올리기
// 프레임 인덱스(0=1번~3=4번)에 따라 살짝 처진 현수선(1번, 5% 여유)에서
// 완전한 직선(4번, 여유 0)으로 점점 팽팽해지도록 보간한다. 5·6번(인덱스 4
// 이상, 낚시 성공 후 프레임)은 4번과 같은 완전한 직선을 유지한다.
const TAUT_REEL_MAX_SLACK = 0.05;
function reelLineSlack(reelFrameIndex) {
  const t = Math.min(Math.max(reelFrameIndex, 0) / 3, 1);
  return TAUT_REEL_MAX_SLACK * (1 - t);
}

// 추를 던진다 — 수평은 등속(v_x = dx/T, dx는 세기(게이지)에 비례)으로
// x축을 따라 무조건 직진하고, 수직은 야구공을 던진 듯 살짝 떠올랐다가
// 떨어지는 포물선(v_y = vy0 + g·t, vy0<0=위로 발사)이다. 체공 시간(T)은
// 1m를 castPhysics.gravityMps2 중력가속도로 자유낙하할 때 걸리는 시간
// (설정 화면 '캐스팅 모션' 탭의 자유낙하 속도 슬라이더로 조절)으로 정하고,
// 그 T 안에 정확히 물 라인까지의 픽셀 거리(h0)만큼 떨어지도록 vy0/픽셀
// 중력(g)을 역산한다 — gravityMps2가 클수록 T가 짧아져(T=√(2H/g)) 더
// 빨리 떨어진다. dx(수평거리)는 세기(게이지)로 정해지는 기본값에
// castPhysics.vxScale(역시 슬라이더)을 곱해 늘리거나 줄인다 — 세기와
// 무관하게 항상 같은 체공 시간이 나오고, 세기는 수평거리(dx)만 늘린다
// ("세질수록 멀리 감"). ARC_STRENGTH는 얼마나 높이 떠올랐다가 떨어지는지
// (평균 낙하속도 h0/T 대비 초기 상승 속도의 비율) 조절하는 값 —
// dev/minigame-fishing/index.html의 추 이동 모션 테스트 도구는 이
// castPhysics 값과 별개로 자체 미리보기 상수를 쓴다. 착수 지점에 기존
// 찌(bobber)를 그대로 가져다 놓아 입질 대기 이후 로직은 손대지 않는다.
function throwSinker(power, origin, frameRect, getRodTip) {
  return new Promise(resolve => {
    const minDx = frameRect.width * 0.10, maxDx = frameRect.width * 0.68;
    const baseDx = minDx + (power / 100) * (maxDx - minDx);
    // 캐릭터가 보고 있는 쪽으로 추를 던진다 — 원본 모션(왼쪽을 보는 포즈,
    // char-mirror-x 없음)은 왼쪽(-x)으로, 오른쪽을 보고 있어 좌우반전
    // (char-mirror-x)됐으면 오른쪽(+x)으로 던진다.
    const dx = baseDx * (castPhysics.vxScale || 1) * (isCharMirrored() ? 1 : -1);
    // 착지선(waterY)은 화면 절대 위치(47%) 대신 캐릭터가 서 있는 줄(발 밑,
    // char-stage 아래쪽 끝)에 맞춘다 — 화면 고정 비율로는 캐릭터 위치와
    // 무관하게 항상 같은 높이라, 캐릭터가 화면 아래쪽에 있을 때 추가
    // 캐릭터보다 한참 위에 떠 보이는 문제가 있었다.
    const charRect = el.charStage.getBoundingClientRect();
    const waterY = charRect.bottom - frameRect.top;
    const h0 = Math.max(10, waterY - origin.y);
    const FREE_FALL_HEIGHT_M = 1;
    const gravityMps2 = castPhysics.gravityMps2 || 9.8;
    const ARC_STRENGTH = 1.0;
    const T = Math.sqrt(2 * FREE_FALL_HEIGHT_M / gravityMps2);
    const vy0 = -ARC_STRENGTH * (h0 / T);
    const g = 2 * (h0 - vy0 * T) / (T * T);
    const vx0 = dx / T;

    let start = null;
    function frame(ts) {
      if (start === null) start = ts;
      const t = (ts - start) / 1000;
      if (t >= T) { finish(dx); return; }
      const x = origin.x + vx0 * t;
      const y = origin.y + vy0 * t + 0.5 * g * t * t;
      // 낚싯줄의 낚싯대 쪽 끝은 물리 시작점(origin)에 고정하지 않고, 아직
      // 재생 중인 팔로우스루 애니메이션의 현재 프레임 낚싯대 끝을 따라간다
      // (releasePowerAndCast가 넘겨준 getRodTip) — 던지기는 release 즉시
      // 시작하지만, 손 위치는 애니메이션이 끝날 때까지 계속 움직이므로.
      renderCastLine(getRodTip ? getRodTip() : origin, { x, y });
      castFlightRaf = requestAnimationFrame(frame);
    }
    function finish(finalDx) {
      // 착수해도 castSvg(낚싯줄)는 숨기지 않는다 — 추가 물에 떠 있는 동안
      // (입질 대기 내내) 낚싯대와 추가 계속 줄로 이어져 보여야 한다.
      // handleReactionTap(입질 물어서 잡아채기로 넘어갈 때)과
      // abortWaitingReel/missReaction/resetToIdle(대기 중단·실패·리셋)에서
      // 각자 자기 타이밍에 숨긴다.
      renderCastLine(getRodTip ? getRodTip() : origin, { x: origin.x + finalDx, y: waterY });
      const landingXPct = clamp((origin.x + finalDx) / frameRect.width * 100, 5, 95);
      const landingYPct = waterY / frameRect.height * 100;
      el.bobber.style.transition = 'none';
      el.bobber.style.left = landingXPct + '%';
      el.bobber.style.top = landingYPct + '%';
      el.bobber.classList.remove('hidden');
      // syncLineToBobber는 여기서 바로 부르지 않는다 — 이 시점엔 아직
      // gameState가 'casting'이라(waitForBite가 releasePowerAndCast의
      // Promise.all이 끝난 뒤에야 'waiting'으로 바꾼다) 루프 첫 tick이
      // "대기 중 아님"으로 보고 즉시 멈춰버린다. 대기 중 쓸 낚싯대 끝
      // 좌표(lastRodTipPt)는 여기서 남기지 않는다 — 물리(추 낙하)가 팔로우
      // 스루 애니메이션보다 먼저 끝나는 경우(체공시간 T가 짧게 설정됐을 때
      // 등) 여기 시점의 getRodTip()은 아직 재생 중인 중간 프레임을
      // 가리켜서, 대기 내내 화면엔 최종 프레임이 보이는데 줄만 그 이전
      // 프레임 위치에 고정돼 캐스팅할 때마다 낚싯대 끝이 들쭉날쭉해 보이는
      // 문제가 있었다. 두 프로미스가 모두 끝난 뒤(releasePowerAndCast의
      // Promise.all 다음)에야 최종 프레임 기준으로 확정한다.
      // 낚시가능 영역 판정은 캐릭터가 아니라 추가 실제로 착수한 지점
      // 기준이다 — 그 지점이 fishableAreas 안이면 낚시가 진행되지 않는다
      // (호출부 releasePowerAndCast가 blocked를 보고 waitForBite 대신
      // 바로 idle로 되돌린다).
      const landingFrac = framePxToImageFrac(origin.x + finalDx, waterY);
      const blocked = fishableAreas.length > 0 && isInsideAnyArea(landingFrac, fishableAreas);
      // flightMs — 이번 캐스팅이 날아간(=취소까지 걸린) 시간. 캐스팅 취소 시
      // reelSinkerBack이 되감기 이동시간으로 그대로 재사용해서, 날아간
      // 시간만큼 되돌아오게 한다(왕복 대칭).
      resolve({ blocked, flightMs: T * 1000 });
    }
    castFlightRaf = requestAnimationFrame(frame);
  });
}

// 낚싯대 끝(p0)~추(p1) 사이를 현수선(catenary, y=a·cosh(x/a)=a·(e^(x/a)+e^(-x/a))/2)
// 으로 그린다. 실제 줄 길이는 두 점 사이 직선거리(D)에 여유(기본 12%,
// slack 인자로 재정의 가능 — 올리기 중엔 renderCastLine(p0,p1,reelLineSlack(i))
// 처럼 훨씬 작은 값을 넘겨 팽팽하게 그린다)를 준 값(L)으로 정하고,
// L·dx·dy로부터 현수선 매개변수 a를 이분법으로 구한다(전형적인 "두 점을
// 지나는 현수선" 문제).
const SINKER_IMG_SIZE = 22; // px, css픽셀 = svg viewBox 단위(카메라 좌표계 그대로)
function renderCastLine(p0, p1, slack) {
  el.castSinker.setAttribute('cx', p1.x);
  el.castSinker.setAttribute('cy', p1.y);
  if (sinkerImageUrl) {
    el.castSinkerImg.setAttribute('x', p1.x - SINKER_IMG_SIZE / 2);
    el.castSinkerImg.setAttribute('y', p1.y - SINKER_IMG_SIZE / 2);
    el.castSinkerImg.setAttribute('width', SINKER_IMG_SIZE);
    el.castSinkerImg.setAttribute('height', SINKER_IMG_SIZE);
  }
  const pts = catenaryPoints(p0, p1, 16, slack);
  el.castLinePath.setAttribute('d', 'M' + pts.map(p => `${p.x},${p.y}`).join(' L'));
}

function catenaryPoints(p0, p1, samples, slack) {
  samples = samples || 16;
  slack = slack == null ? 0.12 : slack;
  const dx = p1.x - p0.x, dy = p1.y - p0.y; // 화면 좌표계 — 아래로 갈수록 y가 커진다
  const D = Math.hypot(dx, dy);
  if (D < 4 || Math.abs(dx) < 2 || slack <= 0.0005) return [p0, p1]; // 거의 수직/한 점, 또는 완전한 직선(여유 0) — 커브 의미 없음
  const L = D * (1 + slack);
  // y=a·cosh(x/a)+q는 항상 볼록(가운데가 "더 작은" y 쪽으로 처지는) 함수라,
  // 위로 갈수록 y가 커지는 보통의 수학 좌표계에서는 그 처지는 방향이
  // 곧 "아래"라 정확히 늘어진 케이블 모양이 된다. 그런데 여긴 화면
  // 좌표계(아래로 갈수록 y가 커짐)라 dy를 그대로 쓰면 케이블이 화면에서
  // 위로(작은 y) 볼록하게 그려진다 — 다리 아치처럼. dy 부호를 뒤집은
  // mathDy로 풀고, 마지막에 다시 부호를 뒤집어(p0.y - ylMath) 화면
  // 좌표로 되돌린다.
  const mathDy = -dy;
  const target = Math.sqrt(Math.max(L * L - mathDy * mathDy, 0));
  // 아래 sinh/log 유도는 dx>0(오른쪽으로 던지기)를 전제로 한다 — 왼쪽으로
  // 던질 때(dx<0)는 f(a)가 항상 음수라 이분법이 a를 0으로 붕괴시켜
  // cosh가 발산(NaN)하고 줄이 아예 안 보였다. 절댓값(adx)으로 풀고 부호
  // (sign)는 마지막에 x좌표에만 되돌려 적용한다 — 현수선은 좌우대칭이라
  // 결과가 동일하다.
  const sign = dx < 0 ? -1 : 1;
  const adx = Math.abs(dx);
  // f(a) = a로 정해지는 케이블 길이 - 목표 길이(target). a가 작을수록
  // 더 팽팽히 휘어 길이가 길어지므로 f는 a에 대해 단조 감소한다 —
  // f(mid)>0(길이 초과)이면 a를 늘려야 하니 lo를 올린다.
  function f(a) { return 2 * a * Math.sinh(adx / (2 * a)) - target; }
  let lo = 1e-3, hi = Math.max(adx, 1) * 50;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (f(mid) > 0) lo = mid; else hi = mid;
  }
  const a = (lo + hi) / 2;
  const p = (adx - a * Math.log((L + mathDy) / (L - mathDy))) / 2;
  const q = -a * Math.cosh(p / a);
  const pts = [];
  for (let i = 0; i <= samples; i++) {
    const xl = adx * i / samples;
    const ylMath = a * Math.cosh((xl - p) / a) + q;
    pts.push({ x: p0.x + sign * xl, y: p0.y - ylMath });
  }
  return pts;
}

// 캐스팅 취소(추가 낚시 불가 영역에 떨어짐) 연출 — 착수 지점에서 바로
// 사라지는 대신, 추가 낚싯대 끝(rodTipPt)까지 되감기듯 돌아오는 동안 줄도
// 같이 따라 그린다(renderCastLine 재사용, reelFrameIndex로 팽팽함을
// 정한다 — 호출부(releasePowerAndCast)는 항상 올리기 4번=완전한 직선을
// 넘긴다). el.bobber는 착수 시 finish()가 남겨둔 left/top(%)에서 시작해
// rodTipPt까지 보간한다 — bob-idle 클래스가 아직 안 붙은 상태(waitForBite
// 이전)라 CSS 애니메이션 오프셋 없이 left/top(%)이 곧 화면 중심 좌표라
// 별도 DOM 측정 없이 바로 프레임 px로 환산할 수 있다. durationMs는
// 호출부가 넘기는 이번 캐스팅의 flightMs(날아간 시간) — 되감기도 같은
// 시간만큼 걸리게 해 왕복이 대칭으로 보이게 한다. 값이 없으면(구버전
// 호출부 등) CAST_CANCEL_REEL_MS로 대체한다.
const CAST_CANCEL_REEL_MS = 450;
function reelSinkerBack(rodTipPt, reelFrameIndex, durationMs) {
  return new Promise(resolve => {
    const frameRect = el.frame.getBoundingClientRect();
    const startLeftPct = parseFloat(el.bobber.style.left) || 0;
    const startTopPct = parseFloat(el.bobber.style.top) || 0;
    const endLeftPct = rodTipPt.x / frameRect.width * 100;
    const endTopPct = rodTipPt.y / frameRect.height * 100;
    const slack = reelLineSlack(reelFrameIndex);
    const ms = durationMs || CAST_CANCEL_REEL_MS;
    let start = null;
    function frame(ts) {
      if (start === null) start = ts;
      const t = Math.min((ts - start) / ms, 1);
      const leftPct = startLeftPct + (endLeftPct - startLeftPct) * t;
      const topPct = startTopPct + (endTopPct - startTopPct) * t;
      el.bobber.style.left = leftPct + '%';
      el.bobber.style.top = topPct + '%';
      renderCastLine(rodTipPt, { x: leftPct / 100 * frameRect.width, y: topPct / 100 * frameRect.height }, slack);
      if (t < 1) { requestAnimationFrame(frame); return; }
      resolve();
    }
    requestAnimationFrame(frame);
  });
}

// 착수 후(입질 대기 중~입질) el.bobber는 CSS 애니메이션(bob-idle/bite-dip)으로
// 위아래로 움직이는데, renderCastLine은 착수 순간의 좌표에 한 번만 그려두고
// 끝이라 줄(castSvg)이 그 자리에 고정된 채 추만 애니메이션으로 까닥거려서
// 줄과 추가 따로 노는 것처럼 보였다. gameState가 waiting/bite인 동안 매
// 프레임 el.bobber(정확히는 실제 보이는 도트/이미지)의 현재 화면 위치를
// 읽어 줄 끝(p1)을 거기 맞춰 다시 그린다 — CSS 키프레임 수치를 그대로
// 베끼는 대신 실제 렌더된 위치를 읽으므로 애니메이션이 바뀌어도 항상 맞다.
function syncLineToBobber(rodTipPt) {
  cancelAnimationFrame(bobLineRaf);
  function tick() {
    if (gameState !== 'waiting' && gameState !== 'bite') { bobLineRaf = null; return; }
    const frameRect = el.frame.getBoundingClientRect();
    const sinkerEl = sinkerImageUrl ? el.bobberImg : el.bobberDot;
    const rect = sinkerEl.getBoundingClientRect();
    renderCastLine(rodTipPt, {
      x: rect.left + rect.width / 2 - frameRect.left,
      y: rect.top + rect.height / 2 - frameRect.top,
    });
    bobLineRaf = requestAnimationFrame(tick);
  }
  tick();
}

function waitForBite() {
  gameState = 'waiting'; // syncLineToBobber보다 먼저 바뀌어 있어야 루프 첫 tick이 안 죽는다
  el.bobber.classList.add('bob-idle');
  syncLineToBobber(lastRodTipPt);
  const delay = BITE_WAIT_MIN_MS + Math.random() * (BITE_WAIT_MAX_MS - BITE_WAIT_MIN_MS);
  biteTimer = setTimeout(triggerBite, delay);
}

function triggerBite() {
  if (gameState !== 'waiting') return;
  gameState = 'bite';
  el.bobber.classList.remove('bob-idle');
  el.bobber.classList.add('bite-dip');
  el.biteMark.classList.remove('hidden');
  vibrate([0, 60, 40, 60]);
  reactionTimer = setTimeout(missReaction, DIFF_TUNING[DIFFICULTY].reactionWindow);
}

function handleReactionTap() {
  if (gameState !== 'bite') return;
  clearTimeout(reactionTimer);
  cancelAnimationFrame(bobLineRaf);
  gameState = 'caught'; // "물었다!" 연출이 끝날 때까지 다른 입력을 막는 과도 상태
  el.biteMark.classList.add('hidden');
  el.bobber.classList.add('hidden');
  el.bobber.classList.remove('bite-dip');
  el.castSvg.classList.add('hidden'); // "물었다!" 연출 동안만 잠깐 숨긴다 — startCatching이 올리기 프레임 기준으로 다시 켠다
  playBiteCaughtAnimation().then(startCatching);
}

// "물었다!" 표시 — 왼쪽 위를 고정점으로 커졌다(120%) 작아지는(0%) 등가속
// 운동. size(t) = 100 + v0*t + 0.5*a*t^2, v0>0(커지는 방향)·a<0(감속) —
// 던지기 물리(throwSinker)와 같은 방식으로, 정점에 닿는 시각(T_PEAK)만
// 정해두면 v0·a가 정해지고, 그 뒤 size가 다시 0에 닿는 시각(T)은 같은
// 공식의 다른 근으로 구한다(포물선이 정점을 지나 출발선 아래까지 내려가는
// 것과 같은 모양 — 여기선 "높이" 대신 "크기(%)"가 오르내린다).
const BITE_CAUGHT_PEAK_SCALE = 120; // %
const BITE_CAUGHT_START_SCALE = 100; // %
const BITE_CAUGHT_T_PEAK = 0.22; // 초 — 120%까지 커지는 데 걸리는 시간
function playBiteCaughtAnimation() {
  return new Promise(resolve => {
    const v0 = 2 * (BITE_CAUGHT_PEAK_SCALE - BITE_CAUGHT_START_SCALE) / BITE_CAUGHT_T_PEAK;
    const a = -v0 / BITE_CAUGHT_T_PEAK;
    // size(T) = 0의 두 근 중 정점(T_PEAK) 이후에 오는 큰 쪽을 취한다.
    const T = (-v0 - Math.sqrt(v0 * v0 - 2 * a * BITE_CAUGHT_START_SCALE)) / a;
    el.biteCaught.style.transform = `scale(${BITE_CAUGHT_START_SCALE / 100 * layoutPrefs.casting.scale})`;
    el.biteCaught.classList.remove('hidden');
    let start = null;
    function frame(ts) {
      if (start === null) start = ts;
      const t = (ts - start) / 1000;
      if (t >= T) { finish(); return; }
      const scale = BITE_CAUGHT_START_SCALE + v0 * t + 0.5 * a * t * t;
      el.biteCaught.style.transform = `scale(${Math.max(scale, 0) / 100 * layoutPrefs.casting.scale})`;
      requestAnimationFrame(frame);
    }
    function finish() {
      el.biteCaught.classList.add('hidden');
      resolve();
    }
    requestAnimationFrame(frame);
  });
}

function missReaction() {
  if (gameState !== 'bite') return;
  el.biteMark.classList.add('hidden');
  el.bobber.classList.add('hidden');
  el.castSvg.classList.add('hidden');
  resetToIdle(); // 실패 — 화면 전환 없이 그냥 대기 상태로 돌아간다
}

// 입질 대기 중(waiting) 화면을 다시 탭하면 입질을 기다리지 않고 바로
// 릴을 감아 올린다 — 당연히 아무것도 안 걸려 있으니 빈손으로 끝난다.
// 성공 시(playReelThenResult)처럼 올리기 프레임 전체를 순차 재생하지
// 않고, 올리기 4번째 프레임(reelFrameUrls[3])만 잠깐 보여준다 — 빈손으로
// 끝나는 취소 동작이라 굳이 릴 감는 전체 동작을 다 보여줄 필요가 없다.
async function abortWaitingReel() {
  if (gameState !== 'waiting') return;
  clearTimeout(biteTimer);
  gameState = 'reeling';
  cancelAnimationFrame(bobLineRaf);
  el.bobber.classList.remove('bob-idle');
  el.bobber.classList.add('hidden');
  el.castSvg.classList.add('hidden');
  if (reelFrameUrls.length) {
    const frame = reelFrameUrls[3] || reelFrameUrls[reelFrameUrls.length - 1];
    el.charImg.classList.remove('hidden');
    el.charFallback.classList.add('hidden');
    el.charImg.src = frame;
    await wait(300);
  } else {
    await wait(300);
  }
  resetToIdle();
}

/* ===== 낚시바(잡아채기) ===== */
function startCatching() {
  gameState = 'catching';
  el.fishbarPanel.classList.remove('hidden');
  positionFishbarRightOfCharacter();
  fish = { y: 100, vy: -DIFF_TUNING[DIFFICULTY].fishSpeedMult * 34, targetY: 100, pickTimer: 0 };
  zone = { y: 100 - zoneSizePct, vel: 0 };
  progress = 30;
  holding = false;
  // 낚시대가 나타난 시점 — 올리기 1번 프레임(대기 포즈)으로 시작한다.
  stopReelHoldAnim();
  currentReelFrameIndex = 0;
  if (reelFrameUrls.length) {
    el.charImg.classList.remove('hidden');
    el.charFallback.classList.add('hidden');
    el.charImg.src = reelFrameUrls[0];
  }
  // 낚싯줄 — 추 쪽 끝은 입질이 문 지점(el.bobber가 마지막으로 떠 있던
  // 자리, hidden으로 감춰졌어도 left/top(%)은 그대로 남아있다)에 고정하고,
  // 낚싯대 쪽 끝은 지금 프레임(1번)의 올리기 낚싯대 끝을 쓴다.
  const catchFrameRect = el.frame.getBoundingClientRect();
  catchingBitePt = {
    x: (parseFloat(el.bobber.style.left) || 0) / 100 * catchFrameRect.width,
    y: (parseFloat(el.bobber.style.top) || 0) / 100 * catchFrameRect.height,
  };
  el.castSvg.setAttribute('viewBox', `0 0 ${catchFrameRect.width} ${catchFrameRect.height}`);
  el.castSvg.classList.remove('hidden');
  renderCatchingReelLine();
  pendingCatchFish = pickCaughtFish();
  // 낚시 팝업을 화면 밖(left:-9999px)에서 이 시점에 미리 채워둬서, 실제
  // 공개(showItemPopup) 순간엔 위치만 옮기면 되게 한다 — populateItemPopup
  // 주석 참고.
  populateItemPopup(pendingCatchFish);
  lastT = performance.now();
  raf = requestAnimationFrame(catchTick);
}

function updateFish(dt) {
  const tuning = DIFF_TUNING[DIFFICULTY];
  if (MOTION_TYPE === 'linear') {
    fish.y += fish.vy * dt;
    if (fish.y <= 0) { fish.y = 0; fish.vy = Math.abs(fish.vy); }
    if (fish.y >= 100) { fish.y = 100; fish.vy = -Math.abs(fish.vy); }
    return;
  }
  fish.pickTimer -= dt;
  if (fish.pickTimer <= 0) {
    if (MOTION_TYPE === 'zigzag') {
      fish.targetY = clamp(fish.y + (Math.random() * 70 - 35), 4, 96);
      fish.pickTimer = 0.22 + Math.random() * 0.32;
    } else { // random
      fish.targetY = Math.random() * 92 + 4;
      fish.pickTimer = 0.6 + Math.random() * 0.8;
    }
  }
  // 목표 지점까지 등속 직선(딱딱하게 스냅되는 느낌)으로 움직이는 대신,
  // 지수 감쇠 스무딩으로 미끄러지듯 다가간다 — 가까워질수록 느려지고,
  // 새 목표가 잡혀 방향이 바뀌어도 순간적으로 꺾이지 않고 자연스럽게
  // 이어진다. k는 프레임레이트 무관하게(dt 기반) 매 프레임 남은 거리의
  // 몇 %를 좁힐지 정하는 감쇠율이다.
  const smoothRate = (MOTION_TYPE === 'zigzag' ? 8 : 4) * tuning.fishSpeedMult;
  const k = 1 - Math.exp(-smoothRate * dt);
  fish.y += (fish.targetY - fish.y) * k;
}

function updateZone(dt) {
  const RISE_ACCEL = 230, GRAVITY = 190, MAX_SPEED = 140;
  const BOUNCE_DAMPING = 0.6; // 농구공처럼 튈 때마다 속도를 이만큼만 남겨 점점 잦아든다
  zone.vel += (holding ? -RISE_ACCEL : GRAVITY) * dt;
  zone.vel = clamp(zone.vel, -MAX_SPEED, MAX_SPEED);
  zone.y += zone.vel * dt;
  const maxY = 100 - zoneSizePct;
  // 멈춰서는 대신 반대 방향으로 튕겨낸다 — 위(천장, y<=0)에 닿으면 아래로,
  // 아래(바닥, y>=maxY)에 닿으면 위로 되돌아간다.
  if (zone.y <= 0) { zone.y = 0; zone.vel = Math.abs(zone.vel) * BOUNCE_DAMPING; }
  if (zone.y >= maxY) { zone.y = maxY; zone.vel = -Math.abs(zone.vel) * BOUNCE_DAMPING; }
}

function updateProgress(dt) {
  const tuning = DIFF_TUNING[DIFFICULTY];
  const inZone = fish.y >= zone.y && fish.y <= zone.y + zoneSizePct;
  progress += (inZone ? tuning.fillRate : -tuning.drainRate) * dt;
  progress = clamp(progress, 0, 100);
}

function renderBarFrame() {
  el.fishbarFish.style.top = fishTrack ? (fishTrack.y + fish.y / 100 * fishTrack.h) + '%' : fish.y + '%';
  el.fishbarZone.style.top = zoneTrack ? (zoneTrack.y + zone.y / 100 * zoneTrack.h) + '%' : zone.y + '%';
  el.fishbarGaugeMask.style.height = (100 - progress) + '%';
  // 게이지 채움 이미지를 올렸으면 그 이미지를 그대로 두고, 없을 때만
  // 기존처럼 진행도에 따라 색을 다시 칠한다.
  if (!gaugeImageUrl) el.fishbarGauge.style.background = gaugeColorForProgress(progress);
}

function catchTick(ts) {
  if (gameState !== 'catching') return;
  const dt = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;
  updateFish(dt);
  updateZone(dt);
  updateProgress(dt);
  renderBarFrame();
  if (progress >= 100) { endCatch(true); return; }
  if (progress <= 0) { endCatch(false); return; }
  raf = requestAnimationFrame(catchTick);
}

function endCatch(success) {
  if (raf) cancelAnimationFrame(raf);
  raf = null;
  stopReelHoldAnim(); // 홀드/릴리즈 되감기 도중이었어도 결과 연출(5·6번 프레임)이 덮어쓴다
  el.fishbarPanel.classList.add('hidden');
  if (success) playReelThenResult(); else resetToIdle(); // 실패 — 화면 전환 없이 그냥 대기 상태로 돌아간다
}

// 잡힌 물고기 종을 고른다 — fishDefs의 catchRate가 하나라도 채워져 있으면(합이
// 0보다 크면) 그 값을 가중치로 쓰고, 전부 0(§업로드 시점의 플레이스홀더 값)이면
// difficulty가 낮을수록 잘 잡히도록 난이도 제곱의 역수를 가중치로 대신 쓴다.
function pickCaughtFish() {
  const all = Object.values(fishDefs);
  const totalRate = all.reduce((sum, f) => sum + (f.catchRate || 0), 0);
  const weightOf = totalRate > 0 ? (f => f.catchRate || 0) : (f => 1 / (f.difficulty * f.difficulty));
  const weights = all.map(weightOf);
  const totalWeight = weights.reduce((sum, w) => sum + w, 0);
  let r = Math.random() * totalWeight;
  for (let i = 0; i < all.length; i++) {
    r -= weights[i];
    if (r <= 0) return all[i];
  }
  return all[all.length - 1];
}

async function playReelThenResult() {
  gameState = 'reeling';
  // 물고기가 딸려 올라오는 동안(flyFishToCharacter가 실제로 날아가는
  // 연출을 재생) — 올리기 5번 프레임. 도착하면 flyFishToCharacter가 직접
  // 6번 프레임으로 바꾼다.
  currentReelFrameIndex = 4;
  if (reelFrameUrls.length > 4) {
    el.charImg.classList.remove('hidden');
    el.charFallback.classList.add('hidden');
    el.charImg.src = reelFrameUrls[4];
  } else {
    await wait(500);
  }
  // 물고기가 딸려 올라오는(flyFishToCharacter) 동안엔 낚싯줄을 안 그린다 —
  // 잡아채기(낚시바) 중이던 줄은 여기서 그냥 숨긴다. 완전히 팽팽한 직선
  // (reelLineSlack(4)===0)이 포물선으로 날아가는 물고기를 따라가면 부자연
  // 스러워 보였다(요청).
  el.castSvg.classList.add('hidden');
  const fishCaught = pendingCatchFish;
  caughtFishTally[fishCaught.id] = (caughtFishTally[fishCaught.id] || 0) + 1;
  // 낚시 팝업 내용(populateItemPopup)은 startCatching 때 이미 화면 밖에서
  // 다 그려놨으니 지연 없이 뜰 준비는 끝났지만, 뜨는 시점 자체는 물고기가
  // 캐릭터에 실제로 도착한 다음이어야 자연스럽다(사용자 요청) — 그래서
  // flyFishToCharacter가 끝날 때까지 기다렸다가 showItemPopup을 부른다.
  await flyFishToCharacter(fishCaught);
  showItemPopup(fishCaught);
}

/* ===== 물고기 날아오기 연출 =====
   추(찌)가 마지막으로 착수했던 자리(el.bobber의 현재 left/top — throwSinker의
   finish에서 남겨둔 값)에서 캐릭터(el.charStage) 쪽으로 물고기 아이콘이
   크기 변화 없이 포물선을 그리며 천천히 날아든다(요청: 크기는 그대로,
   좀 더 느리게, 정점이 캐릭터 위치보다 위로 떠도 됨) — CSS transition
   대신 매 프레임 위치를 직접 계산해서 그린다(throwSinker의 추 궤적과
   같은 방식). 임시 엘리먼트(.fish-fly)를 만들어 el.stage에 얹고, 도착하면
   지운다. 낚싯줄은 playReelThenResult가 이 함수를 부르기 전에 이미 숨겨둔다
   — 완전히 팽팽한 직선(reelLineSlack(4)===0)이 포물선으로 날아가는 물고기를
   따라가면 부자연스러워 보여서(요청) 끌어올리는 동안엔 줄을 아예 안 그린다. */
const FISH_FLY_DURATION_MS = 1600;
const FISH_FLY_ARC_PCT = 18; // 포물선 정점이 시작~도착 직선보다 이만큼(프레임 세로 %) 더 위로 뜬다
function flyFishToCharacter(fishDef) {
  return new Promise(resolve => {
    const frameRect = el.frame.getBoundingClientRect();
    const startLeft = parseFloat(el.bobber.style.left) || 26;
    const startTop = parseFloat(el.bobber.style.top) || 64;
    const charRect = el.charStage.getBoundingClientRect();
    const endLeft = ((charRect.left + charRect.width / 2) - frameRect.left) / frameRect.width * 100;
    const endTop = ((charRect.top + charRect.height * 0.3) - frameRect.top) / frameRect.height * 100;

    const flyEl = document.createElement('div');
    flyEl.className = 'fish-fly';
    if (fishSheetUrl) {
      const override = fishIconOverrides[fishDef.id];
      const style = (override && fishSheetDims)
        ? getFishCropStyle(override, fishSheetDims.width, fishSheetDims.height, 44)
        : getFishSlotStyle(fishDef.slot, 3.5);
      flyEl.style.backgroundImage = `url('${fishSheetUrl}')`;
      flyEl.style.backgroundPosition = style.backgroundPosition;
      flyEl.style.backgroundSize = style.backgroundSize;
    } else {
      flyEl.textContent = '🐟';
    }
    // 설정 화면 물고기 목록과 같은 좌우반전 — 스프라이트시트 크롭(실제
    // 사진)일 때만 뒤집는다. 크기는 날아가는 내내 안 바뀌니 이 transform도
    // 끝까지 고정값이라 애니메이션되지 않는다.
    const flipX = fishSheetUrl ? -1 : 1;
    flyEl.style.transform = `translate(-50%,-50%) scale(${flipX * layoutPrefs.casting.scale},${layoutPrefs.casting.scale})`;
    flyEl.style.left = startLeft + '%';
    flyEl.style.top = startTop + '%';
    el.stage.appendChild(flyEl);
    vibrate(20);

    let start = null;
    function frame(ts) {
      if (start === null) start = ts;
      const t = Math.min((ts - start) / FISH_FLY_DURATION_MS, 1);
      // 4·t·(1-t)는 t=0.5에서 정점(1)을 찍는 포물선 모양이라, 직선 보간에서
      // 이 값만큼 위로(화면 좌표는 위로 갈수록 top%가 작아지므로 빼준다)
      // 띄우면 시작~도착 어느 쪽 y와 비교해도 위로 볼록한 아치가 된다.
      const left = startLeft + (endLeft - startLeft) * t;
      const top = startTop + (endTop - startTop) * t - FISH_FLY_ARC_PCT * 4 * t * (1 - t);
      flyEl.style.left = left + '%';
      flyEl.style.top = top + '%';
      if (t < 1) { requestAnimationFrame(frame); return; }
      flyEl.remove();
      // 물고기가 캐릭터에 도착한 순간 — 올리기 6번(마지막) 프레임, 물고기를
      // 들고 있는 자세(heldFish 오버레이가 이 프레임 위에 그려진다).
      if (reelFrameUrls.length > 5) el.charImg.src = reelFrameUrls[5];
      resolve();
    }
    requestAnimationFrame(frame);
  });
}

/* ===== 캐스팅 게이지 위치 =====
   세기 게이지(cast-power-wrap)는 화면 고정 자리가 아니라 캐릭터 머리
   위에 뜬다. 폭은 CSS 고정값(220px)이라 레이아웃 측정 없이 상수로 clamp할
   수 있다(positionItemPopupAboveCharacter와 같은 패턴). layoutPrefs.casting.
   left/bottom은 이 "머리 위" 기준점에서 얼마나 더 옮길지 정하는 오프셋으로,
   배치 편집 패널의 "캐스팅 게이지 위치 수정하기" 드래그가 이 값을 바꾼다. */
const CAST_GAUGE_WIDTH = 220;
const CAST_GAUGE_MARGIN = 12;
function positionCastGaugeAboveCharacter() {
  const frameRect = el.frame.getBoundingClientRect();
  const charRect = el.charStage.getBoundingClientRect();
  const half = CAST_GAUGE_WIDTH / 2;
  const charCenterX = charRect.left - frameRect.left + charRect.width / 2 + layoutPrefs.casting.left;
  const clampedCenterX = clamp(charCenterX, CAST_GAUGE_MARGIN + half, frameRect.width - CAST_GAUGE_MARGIN - half);
  const bottomPx = frameRect.bottom - charRect.top + layoutPrefs.casting.bottom;
  el.castPowerWrap.style.left = clampedCenterX + 'px';
  el.castPowerWrap.style.bottom = bottomPx + 'px';
  el.castPowerWrap.style.transform = `translateX(-50%) scale(${layoutPrefs.casting.scale})`;
}

/* ===== 낚시바 위치 =====
   잡아채기 낚시바(fishbar-panel)는 화면 중앙 고정이 아니라 캐릭터 오른쪽에
   뜬다. 폭은 안에 올린 바 이미지/게이지 크기에 따라 달라지므로, 보이게 만든
   직후(호출부에서 hidden을 먼저 지운 뒤) 실제 레이아웃 폭(offsetWidth —
   transform 영향을 안 받는 값)을 재서 화면 오른쪽으로 잘려나가지 않게 clamp한다. */
const FISHBAR_GAP = 20;
const FISHBAR_MARGIN = 12;
function positionFishbarRightOfCharacter() {
  const frameRect = el.frame.getBoundingClientRect();
  const charRect = el.charStage.getBoundingClientRect();
  const scale = layoutPrefs.fishbar.scale;
  const panelWidth = el.fishbarPanel.offsetWidth * scale;
  const charCenterY = charRect.top - frameRect.top + charRect.height / 2 + layoutPrefs.fishbar.top;
  const anchorLeftPx = charRect.right - frameRect.left + FISHBAR_GAP + layoutPrefs.fishbar.left;
  const clampedLeftPx = Math.min(anchorLeftPx, frameRect.width - FISHBAR_MARGIN - panelWidth);
  el.fishbarPanel.style.left = clampedLeftPx + 'px';
  el.fishbarPanel.style.top = charCenterY + 'px';
  el.fishbarPanel.style.transform = `translateY(-50%) scale(${scale})`;
}

/* ===== 낚시 팝업 =====
   실패 시엔 아무 화면도 없이 그냥 대기로 돌아가고(missReaction/endCatch
   참고), 성공해서 물고기가 캐릭터에게 도착한 다음에만 이 팝업이 뜬다.
   배경/아이콘 위치·크기는 dev/minigame-fishing/index.html의 "낚시 팝업" 탭
   (itemPopup config, loadConfig에서 el.itemPopupCard/el.itemPopupIcon에
   이미 적용해둔 상태)을 그대로 쓴다. */
// 낚시 팝업 카드 폭 — .item-popup-card의 고정 width(220px, CSS)와 맞춰야
// 한다. 카드가 화면 밖으로 나가지 않도록 캐릭터 중심에 맞추되 좌우
// ITEM_POPUP_MARGIN 안쪽으로 clamp한다(캐릭터가 화면 가장자리에 가까워도
// 안전 — % 기반 위치만 쓰면 캐릭터가 가장자리에 있을 때 카드가 화면
// 밖으로 잘려 나간다). el.itemPopup(래퍼)은 아직 화면 밖(left:-9999px)에
// 있을 때라도 left/bottom을 미리 계산해 넣을 수 있다 — 실제 크기(220px)는
// CSS 고정값이라 레이아웃 측정 없이 상수로 계산 가능.
const ITEM_POPUP_CARD_WIDTH = 220;
const ITEM_POPUP_GAP = 14;
const ITEM_POPUP_MARGIN = 12;
function positionItemPopupAboveCharacter() {
  const frameRect = el.frame.getBoundingClientRect();
  const charRect = el.charStage.getBoundingClientRect();
  const half = ITEM_POPUP_CARD_WIDTH / 2;
  const charCenterX = charRect.left - frameRect.left + charRect.width / 2;
  const clampedCenterX = clamp(charCenterX, ITEM_POPUP_MARGIN + half, frameRect.width - ITEM_POPUP_MARGIN - half);
  const bottomPx = frameRect.bottom - charRect.top + ITEM_POPUP_GAP;
  el.itemPopup.style.left = clampedCenterX + 'px';
  el.itemPopup.style.bottom = bottomPx + 'px';
  el.itemPopup.style.transform = `translateX(-50%) scale(${layoutPrefs.casting.scale * layoutPrefs.itemPopup.scale})`;
}

// 카드 배경/이름/등급·가치/아이콘을 채운다 — showItemPopup(실제 공개
// 순간)뿐 아니라 startCatching(어떤 물고기가 걸릴지 정해지자마자, 잡아채기
// 미니게임 + 릴 감기 + 날아오기 연출까지 몇 초의 여유가 있을 때)에서도
// 미리 호출해 화면 밖(.item-popup의 기본 left:-9999px)에서 이미 디코드/
// 페인트가 끝나 있게 한다 — showItemPopup은 그 뒤 위치만 화면 안으로
// 옮기면 되니 그 순간엔 새로 그릴 게 없어 지연이 없다.
function populateItemPopup(fishCaught) {
  el.itemPopupName.textContent = fishCaught.name;
  el.itemPopupName.style.color = GRADE_NAME_COLORS[fishCaught.grade] || '#000';
  el.itemPopupMeta.textContent = `${fishCaught.grade} · ${fishCaught.value}P`;
  if (fishSheetUrl) {
    const override = fishIconOverrides[fishCaught.id];
    const style = (override && fishSheetDims)
      ? getFishCropStyle(override, fishSheetDims.width, fishSheetDims.height, itemIconSizePx)
      : getFishSlotStyle(fishCaught.slot, 3.5);
    el.itemPopupIcon.style.backgroundImage = `url('${fishSheetUrl}')`;
    el.itemPopupIcon.style.backgroundPosition = style.backgroundPosition;
    el.itemPopupIcon.style.backgroundSize = style.backgroundSize;
    // 설정 화면 물고기 목록과 같은 좌우반전 — translate(-50%,-50%)는
    // CSS(.item-popup-icon)가 아니라 여기서 인라인으로 같이 넣어줘야 한다.
    // scaleX(-1)만 인라인으로 넣으면 그 자체가 transform 전체를 덮어써서
    // CSS의 translate(-50%,-50%) 중심정렬이 사라져(아이콘이 지정 위치에서
    // 오른쪽 아래로 반 칸 밀려 보임) 버린다.
    el.itemPopupIcon.style.transform = 'translate(-50%,-50%) scaleX(-1)';
    el.itemPopupIcon.textContent = '';
  } else {
    el.itemPopupIcon.style.backgroundImage = 'none';
    el.itemPopupIcon.style.transform = 'translate(-50%,-50%)';
    el.itemPopupIcon.textContent = '🐟';
  }
}

// 캐릭터가 물고기를 들고 있는 자세(올리기 마지막 프레임 — playFrameSequence가
// el.charImg를 이미 그 프레임에 남겨둔 상태) 위에 잡은 물고기 아이콘을
// heldFishPos 자리에 겹쳐 그린다. 낚시 팝업(showItemPopup)과 같은 타이밍에
// 뜨고, resetToIdle에서 같이 사라진다.
function showHeldFish(fishCaught) {
  el.heldFish.style.left = (heldFishPos.x * 100) + '%';
  el.heldFish.style.top = (heldFishPos.y * 100) + '%';
  if (fishSheetUrl) {
    const override = fishIconOverrides[fishCaught.id];
    const style = (override && fishSheetDims)
      ? getFishCropStyle(override, fishSheetDims.width, fishSheetDims.height, 40)
      : getFishSlotStyle(fishCaught.slot, 3.5);
    el.heldFish.style.backgroundImage = `url('${fishSheetUrl}')`;
    el.heldFish.style.backgroundPosition = style.backgroundPosition;
    el.heldFish.style.backgroundSize = style.backgroundSize;
    el.heldFish.textContent = '';
  } else {
    el.heldFish.style.backgroundImage = 'none';
    el.heldFish.textContent = '🐟';
  }
  el.heldFish.classList.remove('hidden');
}

function showItemPopup(fishCaught) {
  gameState = 'popup';
  populateItemPopup(fishCaught);
  positionItemPopupAboveCharacter();
  showHeldFish(fishCaught);
}

/* ===== 리셋 ===== */
function resetToIdle() {
  el.itemPopup.style.left = '-9999px';
  gameState = 'idle';
  stopReelHoldAnim();
  cancelAnimationFrame(bobLineRaf);
  catchingBitePt = null;
  el.castPowerWrap.classList.add('hidden');
  el.castSvg.classList.add('hidden');
  el.bobber.classList.add('hidden');
  el.bobber.classList.remove('bob-idle', 'bite-dip');
  el.biteCaught.classList.add('hidden');
  el.heldFish.classList.add('hidden');
  el.joystick.classList.remove('hidden');
  el.charImg.classList.remove('char-mirror-x'); // 걷기/idle 시트는 방향별로 이미 따로 있어 반전이 필요 없다
  const pose = idlePoseUrl();
  if (pose) { el.charImg.src = pose; el.charImg.classList.remove('hidden'); el.charFallback.classList.add('hidden'); }
  else { el.charImg.classList.add('hidden'); el.charFallback.classList.remove('hidden'); }
}

/* ===== 이동 — 격자 스냅 없이 조이스틱을 누르고 있는 동안
   requestAnimationFrame으로 매 프레임 위치를 갱신하는 연속 이동이다.
   속도는 walkMotion.stepMs(설정 화면 "이동 속도" 슬라이더 — "타일 한 칸
   (MOVE_STEP_PX)을 이동하는 데 걸리는 시간"으로 해석)를 px/ms로 환산해
   쓴다. moveHoldVec의 dx/dy는 실제 "위치" 이동 벡터로, 대각선 드래그면
   둘 다 0이 아닐 수 있다(대각선 이동 그대로 허용) — 이때 두 축을 동시에
   같은 속도로 움직이면 대각선이 더 빨라지므로 1/√2로 보정한다. 반면
   걷기 "애니메이션" 방향(좌/우/상/하 스프라이트, spriteDir)은 이동
   벡터와 분리된 값으로 호출자(조이스틱 입력)가 축 고정해서 넘겨준다 —
   같은 방향이 계속 재생 중이면 다시 트리거하지 않는다(applyMoveSprite).
   걷기 프레임은 이동 중엔 계속 순환하고(moveAnimTimer), 멈추면 idle
   프레임으로 되돌아간다. 프레임 전환 속도는 방향별로 다를 수 있다
   (motionPlaybackMs[dir], loadConfig가 방향별로 없으면 walkMotion.animFrameMs로
   채운다) — playMoveAnim의 setInterval이 그 방향의 값을 쓴다. ===== */
function moveSpeedPxPerMs() { return MOVE_STEP_PX / Math.max(1, walkMotion.stepMs); }
function stopMoveAnim() {
  if (moveAnimTimer) { clearInterval(moveAnimTimer); moveAnimTimer = null; }
}
function spriteDirFor(dx, dy) {
  return dx !== 0 ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'up' : 'down');
}
function playMoveAnim(spriteDir) {
  stopMoveAnim();
  const frames = walkFrameUrls[spriteDir];
  if (!frames || !frames.length) return; // 방향 시트가 없으면 그림은 그대로 두고 위치만 바뀐다
  let i = 0;
  el.charImg.classList.remove('char-mirror-x'); // 걷기 시트는 방향별로 이미 따로 있어 반전이 필요 없다
  el.charImg.src = frames[i];
  el.charImg.classList.remove('hidden');
  el.charFallback.classList.add('hidden');
  if (frames.length <= 1) return;
  moveAnimTimer = setInterval(() => {
    i = (i + 1) % frames.length;
    el.charImg.src = frames[i];
  }, motionPlaybackMs[spriteDir] || walkMotion.animFrameMs);
}
let currentSpriteDir = null; // 지금 재생 중인 걷기 방향 — 실제로 바뀔 때만 playMoveAnim을 다시 걸어서 프레임이 튀지 않게 한다
function applyMoveSprite(spriteDir) {
  if (!spriteDir || spriteDir === currentSpriteDir) return;
  currentSpriteDir = spriteDir;
  lastFacingDir = spriteDir; // stopMoveHold가 currentSpriteDir을 null로 지워도 이건 남아 idlePoseUrl이 "마지막으로 보던 방향"을 계속 알 수 있다
  playMoveAnim(spriteDir);
}
// 이동 불가 영역(blockedAreas)이 있으면 후보 위치가 그 안에 들어가는지
// 검사한다 — bgDims를 못 읽었으면(배경 없음) 판정 근거가 없으니 항상 허용.
function isPositionBlocked(x, y) {
  if (!blockedAreas.length) return false;
  return isInsideAnyArea(worldPosToImageFrac(x, y), blockedAreas);
}
function moveTick(ts) {
  if (!moveHoldVec) { moveRaf = null; return; }
  if (!moveLastT) moveLastT = ts;
  let distPx = moveSpeedPxPerMs() * (ts - moveLastT);
  moveLastT = ts;
  if (moveHoldVec.dx && moveHoldVec.dy) distPx /= Math.SQRT2; // 대각선은 두 축을 동시에 움직이므로 축당 속도를 낮춰 체감 속도를 맞춘다
  const wb = worldBounds();
  // X축, Y축을 따로 검사해서 막힌 축만 취소한다 — 벽에 대각선으로 부딪혀도
  // 막히지 않은 축으로는 계속 미끄러지듯 움직일 수 있다.
  let nextX = charWorldPos.x, nextY = charWorldPos.y;
  if (moveHoldVec.dx) {
    const candidate = clamp(charWorldPos.x + moveHoldVec.dx * distPx, wb.minX, wb.maxX);
    if (!isPositionBlocked(candidate, nextY)) nextX = candidate;
  }
  if (moveHoldVec.dy) {
    const candidate = clamp(charWorldPos.y + moveHoldVec.dy * distPx, wb.minY, wb.maxY);
    if (!isPositionBlocked(nextX, candidate)) nextY = candidate;
  }
  charWorldPos.x = nextX;
  charWorldPos.y = nextY;
  updateCamera(); // 카메라 오프셋 재계산 + 캐릭터 화면 위치(left/bottom)까지 함께 반영한다
  checkInteractionArea();
  checkMoveArea(); // 이동 영역(다른 화면으로 건너가는 영역)에 들어왔는지 — 들어왔으면 triggerScreenTransition이 알아서 이동을 끊는다(stopMoveHold)
  if (moveHoldVec) moveRaf = requestAnimationFrame(moveTick); // checkMoveArea가 화면을 건너가며 이동을 끊었으면 다시 예약하지 않는다
}
function startMoveHold(dx, dy, spriteDir) {
  if (gameState !== 'idle' || screenTransitioning) return;
  moveHoldVec = { dx, dy };
  applyMoveSprite(spriteDir);
  if (!moveRaf) { moveLastT = 0; moveRaf = requestAnimationFrame(moveTick); }
}
function stopMoveHold() {
  moveHoldVec = null;
  currentSpriteDir = null;
  stopMoveAnim();
  el.charImg.classList.remove('char-mirror-x');
  const pose = idlePoseUrl();
  if (pose) el.charImg.src = pose; // 걷기 멈추면 마지막으로 보던 방향의 idle 프레임(있으면)으로 되돌린다
}

/* ===== 입력 =====
   화면 아무 곳이나 누르면 캐스팅 세기 조절이 시작되던 것을 오른쪽 아래
   낚시 버튼(el.fishBtn) 하나로 옮겼다("낚시 버튼 = 낚싯대를 든다"는
   뜻이라, 안 누르고 있는 게 기본값이고 그 사이엔 왼쪽 아래 조이스틱
   (el.joystick)으로 캐릭터를 이동한다). 낚시 시작(idle→charging)뿐
   아니라 캐스팅(놓으면 던지기), 입질 반응, 잡아채기 중 홀드(캐스팅바를
   밀어올리는 것), 입질 대기 중 조기 올리기, 낚시 팝업 닫기까지 이 버튼
   하나로 전부 되게 handleActionPointerDown/Release를 el.frame(화면
   전체 — 기존처럼 어디를 눌러도 동작)과 el.fishBtn 양쪽에 같이 건다.
   다만 idle→charging(낚시 시작)만은 el.fishBtn 전용이다 — el.frame에도
   걸면 이동 중 화면 탭이 다시 캐스팅을 트리거해버려 조이스틱 이동 UX가
   깨진다. */
function handleActionPointerDown() {
  if (gameState === 'bite') { handleReactionTap(); return; }
  if (gameState === 'catching') { holding = true; playReelHoldSeq(REEL_HOLD_UP_SEQ); return; }
  if (gameState === 'waiting') { abortWaitingReel(); return; }
  if (gameState === 'popup') { resetToIdle(); return; }
  if (gameState === 'idle' && activeInteractionAreaId === YOUNGWOO_NPC_INTERACTION_ID) { openNpcMenu(); return; }
}
function handleActionPointerRelease() {
  const wasHolding = holding;
  holding = false;
  if (gameState === 'catching' && wasHolding) playReelHoldSeq(REEL_HOLD_DOWN_SEQ);
  if (gameState === 'charging') releasePowerAndCast();
}
el.frame.addEventListener('pointerdown', handleActionPointerDown);
['pointerup', 'pointercancel', 'pointerleave'].forEach(evt => {
  el.frame.addEventListener(evt, handleActionPointerRelease);
});
el.fishBtn.addEventListener('pointerdown', (e) => {
  e.stopPropagation(); // el.frame의 pointerdown까지 뚫고 내려가 같은 동작을 두 번 건드리지 않게 막는다
  if (layoutEditMode) { fishBtnDragPointerId = e.pointerId; el.fishBtn.setPointerCapture(e.pointerId); startLayoutDrag('fishBtn', e); return; }
  if (gameState === 'idle') { startPowerCharge(); return; } // 캐스팅 게이지/애니메이션은 위치와 무관하게 항상 정상적으로 시작한다 — 낚시가능 여부는 추가 착수한 뒤(throwSinker)에 판정한다
  handleActionPointerDown();
});
el.fishBtn.addEventListener('pointermove', (e) => {
  if (!layoutEditMode || e.pointerId !== fishBtnDragPointerId) return;
  updateLayoutDrag(e);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(evt => {
  el.fishBtn.addEventListener(evt, (e) => {
    e.stopPropagation();
    if (layoutEditMode) { // 편집 중 손을 뗀 걸 낚시 릴리즈 로직으로 보내지 않고 배치 드래그 종료로만 처리한다
      if (e.pointerId !== fishBtnDragPointerId) return;
      endLayoutDrag();
      fishBtnDragPointerId = null;
      return;
    }
    handleActionPointerRelease();
  });
});

/* ===== 이동 조이스틱 입력 =====
   실제 캐릭터 "위치" 이동은 8방향 그대로 자유롭다 — 손잡이 각도를 45도
   단위 8구역으로 스냅해서 zoneDx/zoneDy를 구한다(JOYSTICK_ZONE_DX/DY,
   대각선이면 둘 다 0이 아니다). 화면 좌표는 아래로 갈수록 y가 커지는데
   (포인터 dy>0 = 아래로 드래그) 캐릭터 이동은 반대로 bottom%가 커질수록
   위로 올라가므로, 이 구역 표를 만들 때 이미 세로 부호를 뒤집어 넣어뒀다.

   걷기 "애니메이션" 방향은 spriteDirFor(zoneDx, zoneDy)로 실제 이동
   벡터에서 그대로 파생시킨다 — 가로 성분(zoneDx)이 있으면 항상 좌/우를
   우선한다(대각선이어도 세로 시트를 섞지 않고 수평 이동 애니메이션을
   보여준다), 순수 상/하로만 밀 때만 위/아래를 쓴다. */
// 손잡이 반지름/데드존(px)은 조이스틱 크기가 편집 모드에서 바뀔 수 있어 상수가 아니라
// joystickRadiusPx()/joystickDeadzonePx()(배치 편집 섹션)로 매번 현재 크기 기준으로 계산한다.
// zone index 0~7 = 오른쪽, 오른쪽아래, 아래, 왼쪽아래, 왼쪽, 왼쪽위, 위, 오른쪽위 (캐릭터 이동 기준, dy는 이미 화면↔캐릭터 좌표계 반전 반영)
const JOYSTICK_ZONE_DX = [1, 1, 0, -1, -1, -1, 0, 1];
const JOYSTICK_ZONE_DY = [0, -1, -1, -1, 0, 1, 1, 1];
let joystickPointerId = null;
let joystickCenter = null;
let activeMoveDir = null; // { dx, dy } — 실제 위치 이동 벡터(대각선 가능), 디버그/테스트용으로도 노출
function updateJoystickFromPointer(clientX, clientY) {
  const dx = clientX - joystickCenter.x;
  const dy = clientY - joystickCenter.y;
  const dist = Math.hypot(dx, dy);

  return 'let layoutPrefs = ' + JSON.stringify(layoutPrefs, null, 2) + ';';
}
el.layoutCodeBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  el.layoutCodeTextarea.value = buildLayoutPrefsCode();
  el.layoutCodeCopyStatus.textContent = '';
  el.layoutCodeOverlay.classList.remove('hidden');
});
el.layoutCodeCopyBtn.addEventListener('click', () => copyToClipboard(el.layoutCodeTextarea, el.layoutCodeCopyStatus));
el.layoutCodeCloseBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  el.layoutCodeOverlay.classList.add('hidden');
});
loadLayoutPrefs();
applyLayoutPrefs();
pullLayoutPrefsFromServer();

// 오프라인이거나 Supabase 응답이 유난히 느려도 화면이 검게 영영 멈춰
// 있으면 안 되니, loadConfig가 안 끝나도 이 시간이 지나면 강제로 밝힌다
// (그 시점까지 못 그려진 이미지는 나중에 그냥 나타난다 — revealGame은
// gameRevealed 가드가 있어 두 경로 중 먼저 온 쪽만 실제로 밝힌다).
setTimeout(revealGame, 8000);

loadConfig().then(() => {
  checkInteractionArea(); // 초기 스폰 위치가 이미 상호작용 영역 안일 수도 있으니 로드 직후 한 번 확인
  revealGame();
});
</script>
<script src="/dev/devPlanFab.js"></script>
