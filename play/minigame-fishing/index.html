<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MISSING KEY · 낚시</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#0A2A3A">
<link rel="manifest" href="/play/manifest.json">
<link rel="apple-touch-icon" href="https://dhtstqnksjoyyshnhksv.supabase.co/storage/v1/object/public/dev-assets/app-icon/play-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Missing Key">
<style>
/* 낚시 화면 전용 폰트 — 요청대로 산돌미생체 하나로 통일한다(아래 --mono/
   --sans 둘 다 이 폰트를 가리키게 해서, 기존에 모노스페이스/산세리프로
   나뉘어 있던 텍스트가 전부 같은 서체를 쓰게 된다). 로드 실패 시엔
   Pretendard/시스템 기본 서체로 자연스럽게 폴백한다. */
@font-face {
  font-family: 'SDMiSaeng';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@master/SDMiSaeng.woff') format('woff');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#000000;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--green:#3ECF6B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --sky-top:#8FD4E8;--sky-bottom:#C7ECDD;--water-top:#2E7DA6;--water-bottom:#0F3C55;
  --mono:'SDMiSaeng','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  --sans:'SDMiSaeng','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}

.frame{position:relative;width:100%;max-width:430px;height:100dvh;height:100vh;height:var(--vh100, 100vh);overflow:hidden;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 55%,var(--water-top) 55%,var(--water-bottom) 100%);display:flex;flex-direction:column;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}

/* ===== 프리로드 오버레이 — revealGame 참고. 기본은 완전 불투명 검정 +
   클릭 차단(pointer-events 기본값 auto), .fade-out이 붙으면 서서히
   투명해지며 클릭도 바로 풀어준다(트랜지션이 끝나기 전이라도 아래 게임을
   만질 수 있게), 트랜지션이 끝나면 .hidden으로 완전히 빼서 다시 안 그린다. */
.preload-overlay{position:absolute;inset:0;z-index:999;background:#000;opacity:1;transition:opacity .9s ease}
.preload-overlay.fade-out{opacity:0;pointer-events:none}
.preload-overlay.hidden{display:none}

.topbar{position:absolute;top:0;left:0;right:0;z-index:6;padding:calc(14px + env(safe-area-inset-top,0)) 16px 10px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.back-chip{pointer-events:auto;flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.4);border:1px solid rgba(10,40,50,.25);color:#0A2A3A;font-size:18px;font-weight:700;line-height:1;text-decoration:none}
.back-chip:active{transform:scale(.92)}
/* Settings link to this minigame's dev editor (/dev/minigame-fishing/) —
   z-index above .status-window (also 6, but painted later in the DOM) so
   it stays tappable even when a scene has a status-window frame configured
   in that top-right corner. */
.settings-chip{pointer-events:auto;position:relative;z-index:7;flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.4);border:1px solid rgba(10,40,50,.25);color:#0A2A3A;font-size:15px;line-height:1;text-decoration:none}
.settings-chip:active{transform:scale(.92)}

.status-window{position:absolute;top:calc(10px + env(safe-area-inset-top,0));right:calc(10px + env(safe-area-inset-right,0));z-index:6;width:120px;aspect-ratio:var(--status-ar,2/1);pointer-events:none}
.status-window.hidden{display:none}
.status-window-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.status-window-date,.status-window-time{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:9.5px;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.status-window-points{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.status-window-points img{display:block;object-fit:contain}
.status-window-points img+img{margin-left:var(--status-digit-gap,2px)}
.status-window-arrow{position:absolute;left:0;top:0;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(var(--status-arrow-deg,270deg));pointer-events:none;user-select:none;-webkit-user-drag:none}
.status-window-arrow.hidden{display:none}

.stage{position:absolute;inset:0;z-index:1}

/* 배경 전용 레이어 — el.frame(화면 크기 고정)의 background-position을 매
   프레임 바꾸던 예전 방식은 카메라가 움직일 때마다 배경 전체를 다시
   페인트해야 해서(특히 고용량 배경일수록) 뚝뚝 끊겨 보였다. 대신 이
   레이어를 배경 원본 크기(줌 적용)로 한 번만 만들어두고, 카메라 이동은
   GPU가 합성만 하면 되는 transform(translate3d)으로 처리한다 —
   background-position/size는 줌이 바뀔 때(applyBgLayerSize)만 다시
   계산한다. */
.bg-layer{position:absolute;left:0;top:0;z-index:0;background-repeat:no-repeat;will-change:transform;pointer-events:none}

/* 캐릭터가 실제로 화면 위를 움직인다(charWorldPos에서 카메라 오프셋을
   뺀 화면 기준 px를 매 프레임 left/bottom에 직접 반영, renderCharScreenPos
   참고) — 배경은 el.bgLayer(배경 원본 크기로 미리 맞춰둔 레이어)를
   transform:translate3d로 같은 카메라 오프셋만큼 옮기는 방식으로 "그
   화면 크기에 맞게" 필요한 부분만 보여준다. left/bottom은 화면(.frame)
   기준 px고, transform으로 그 지점에 박스 중심이 오도록 자기 크기의
   절반만큼 밀어서 이 값이 실제로 캐릭터 "중심"과 일치하게 한다(박스
   크기가 바뀌어도 항상 중심 기준이라 안전하다). */
.char-stage{position:absolute;left:0;bottom:0;transform:translate(-50%,50%) scale(var(--char-scale,1));z-index:2;width:84px;height:84px;display:flex;align-items:flex-end;justify-content:center}
/* 캐릭터 발밑 그림자 — img/char-fallback의 drop-shadow 필터(실루엣을 따라
   흐릿하게 감싸는 외곽 그림자)와 별개로, 바닥에 깔린 타원 그림자를 하나
   더 둔다. char-stage 맨 앞(다른 자식보다 먼저)에 둬서 항상 캐릭터
   뒤쪽에 깔리고, align-items:flex-end로 캐릭터가 내려앉는 바로 그
   기준선(box bottom)에 맞춘다 — --char-scale이 걸리는 char-stage 안에
   있어서 캐릭터 확대/축소에 그대로 같이 따라간다. */
.char-ground-shadow{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:58%;height:11px;border-radius:50%;background:radial-gradient(ellipse at center, rgba(0,0,0,.4) 0%, rgba(0,0,0,.4) 35%, rgba(0,0,0,0) 75%);pointer-events:none}
.char-stage img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.char-stage img.char-mirror-x{transform:scaleX(-1)}
.char-fallback{font-size:46px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.char-fallback.hidden,.char-stage img.hidden{display:none}

/* 영우 NPC — char-stage와 같은 형식(left/bottom, 자기 크기 절반만큼 밀어
   중심 기준)이지만 배경 위 고정된 세계 좌표(npcWorldPos, 설정 화면
   "캐릭터" 탭에서 지정한 youngwooNpcPos)에 그대로 서 있는다 — 조이스틱
   이동/카메라와는 무관하고, updateCamera가 매 프레임 같은 camOffset으로
   화면 위치만 다시 계산한다. pointer-events:none — 상호작용 지점은
   fishingConfig.interactionAreas로 별도 지정하지 이 NPC 그림 자체를
   탭 대상으로 삼지 않는다. */
.npc-stage{position:absolute;left:0;bottom:0;transform:translate(-50%,50%);z-index:2;width:84px;height:84px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.npc-stage img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.npc-stage.hidden{display:none}

/* 상호작용 영역(상점/대화 등) 안에 서 있을 때 캐릭터 머리 위에 뜨는
   라벨 배지 — checkInteractionArea가 영역을 드나들 때만 토글한다. */
.interaction-badge{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px);z-index:4;background:rgba(214,168,75,.92);color:#1a1206;font-family:var(--mono);font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;white-space:nowrap;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.interaction-badge.hidden{display:none}

/* 낚시 성공 후 캐릭터가 물고기를 들고 있는 자세(올리기 마지막 프레임)일
   때, 잡은 물고기 아이콘을 그 위에 겹쳐 그린다 — 위치는
   dev/minigame-fishing/index.html "올리기 모션" 탭에서 지정한
   heldFishPos(char-stage 기준 0~1), 크기는 --held-fish-size(우상단
   배치 편집 패널의 슬라이더, layoutPrefs.heldFish.size)로 정한다. */
.held-fish{position:absolute;width:var(--held-fish-size,40px);height:var(--held-fish-size,40px);transform:translate(-50%,-50%);background-repeat:no-repeat;background-position:center;background-size:cover;image-rendering:pixelated;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.held-fish.hidden{display:none}

.bobber{position:absolute;left:26%;top:64%;z-index:3;width:0;height:0;transform:translate(-50%,-50%) scale(var(--casting-scale,1))}
.bobber.hidden{display:none}
.bobber-dot{width:16px;height:16px;border-radius:50% 50% 50% 0;background:radial-gradient(circle at 35% 30%,#FF7A6E,#D9455B);box-shadow:0 2px 6px rgba(0,0,0,.35);transform:translate(-50%,-50%) rotate(45deg)}
.bobber.bob-idle .bobber-dot{animation:bobberIdle 1.1s ease-in-out infinite}
.bobber.bite-dip .bobber-dot{animation:bobberDip .35s ease-in-out infinite}
@keyframes bobberIdle{0%,100%{transform:translate(-50%,-50%) rotate(45deg) translateY(0)}50%{transform:translate(-50%,-50%) rotate(45deg) translateY(-4px)}}
@keyframes bobberDip{0%,100%{transform:translate(-50%,-50%) rotate(45deg) translateY(0)}50%{transform:translate(-50%,-50%) rotate(45deg) translateY(10px)}}
/* 낚시 추 이미지를 올린 경우, 착수 후 입질 대기 중 계속 떠 있는 건
   bobber-dot(기본 빨간 마름모)가 아니라 이 이미지다 — loadConfig가
   sinkerImageUrl 유무로 둘 중 하나만 보이게 display를 직접 토글한다
   (bobber-dot처럼 rotate(45deg)를 얹으면 업로드한 그림이 45도 기울어져
   보이므로 회전 없는 별도 키프레임을 쓴다). */
.bobber-img{width:22px;height:22px;object-fit:contain;transform:translate(-50%,-50%);display:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.bobber.bob-idle .bobber-img{animation:bobberIdleImg 1.1s ease-in-out infinite}
.bobber.bite-dip .bobber-img{animation:bobberDipImg .35s ease-in-out infinite}
@keyframes bobberIdleImg{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-4px)}}
@keyframes bobberDipImg{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(10px)}}
.bite-mark{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-family:var(--mono);font-weight:800;font-size:22px;color:#FFD12E;text-shadow:0 2px 4px rgba(0,0,0,.5);animation:biteMarkPop .4s ease}
.bite-mark.hidden{display:none}
@keyframes biteMarkPop{0%{transform:translateX(-50%) scale(.3);opacity:0}60%{transform:translateX(-50%) scale(1.25);opacity:1}100%{transform:translateX(-50%) scale(1)}}

/* 입질(느낌표) 탭 반응 시 뜨는 "물었다!" 표시 — 왼쪽 위 모서리를 고정점
   (transform-origin:0 0)으로 두고 오른쪽 아래 방향으로만 커졌다 작아진다.
   크기(scale, %)는 playBiteCaughtAnimation이 매 프레임 등가속 운동 공식
   (size = 100 + v0*t + 0.5*a*t^2, v0>0·a<0)으로 계산해 transform에 직접
   적용하고, 0%에 닿으면 스스로 숨기고 낚시바로 넘어간다. */
.bite-caught{position:absolute;left:30%;top:32%;z-index:6;transform-origin:0 0;pointer-events:none}
.bite-caught.hidden{display:none}
.bite-caught-text{font-family:var(--mono);font-weight:800;font-size:26px;letter-spacing:.03em;color:#FFD12E;text-shadow:0 2px 6px rgba(0,0,0,.6);white-space:nowrap}
.bite-caught-img{display:none;max-width:140px;max-height:140px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}

/* 캐스팅 버튼 대신 화면을 꾹 눌러 세기(0~100, 왔다리갔다리)를 맞추고
   손을 떼면 그 순간 값으로 던진다(startPowerCharge/releasePowerAndCast) —
   이 바는 누르고 있는 동안만 보인다. 위치(left/bottom/transform)는 화면
   고정이 아니라 캐릭터 머리 위를 따라가도록 매번 positionCastGaugeAboveCharacter가
   인라인 스타일로 계산해 넣는다(아래 참고). */
.cast-power-wrap{position:absolute;z-index:5;width:220px;display:flex;flex-direction:column;align-items:center;gap:6px;touch-action:none}
.cast-power-wrap.hidden{display:none}
.cast-power-stage{position:relative;width:100%}
.cast-power-track{width:100%;height:20px;border-radius:10px;background:rgba(5,20,28,.45);border:1px solid rgba(255,255,255,.35);overflow:hidden}
/* 세기 게이지 색 — 낮을 때 빨강, 중간 노랑, 최대일 때 초록인 단색 채움.
   막대 안에서 색이 번지는 그라데이션이 아니라, 현재 세기값 하나로 정해지는
   단일 색을 매 프레임 powerToColor()로 계산해 background에 인라인으로
   덮어쓴다(startPowerCharge의 tick 참고) — 세기가 낮으면 막대 전체가
   빨강, 높으면 막대 전체가 초록으로 보인다. */
.cast-power-fill{height:100%;width:0%;background:var(--signal-red);border-radius:10px 0 0 10px}
/* 캐스팅 게이지 이미지 — 설정 화면(dev/minigame-fishing/index.html)에서
   업로드하면 기본 막대 게이지 대신 이 그림이 배경으로 깔리고, 채움 영역
   (castGaugeFillRegion)이 지정한 자리에만 진행도 막대(cast-power-fill)가
   자리잡는다(둘 다 있어야 커스텀 게이지가 켜진다 — loadConfig 참고). */
.cast-power-gauge-img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;display:none}
.cast-power-wrap.custom-gauge .cast-power-gauge-img{display:block}
.cast-power-wrap.custom-gauge .cast-power-stage{aspect-ratio:var(--gauge-ar,220/20)}
.cast-power-wrap.custom-gauge .cast-power-track{position:absolute;background:transparent;border:none;border-radius:0}
/* 커스텀 게이지도 기본 막대와 같은 단색 채움을 쓴다 — 배경 그림이 비치도록
   반투명(.55)인 점만 다르다(powerToColor의 두 번째 인자). */
.cast-power-wrap.custom-gauge .cast-power-fill{background:rgba(217,65,65,.55);border-radius:0}

/* 이동 모드 — idle(캐스팅 전) 상태에서만 보이는 화면 왼쪽 아래 반투명
   방향키(십자 배치)와 오른쪽 아래 반투명 낚시 버튼. 기존엔 화면 아무
   곳이나 누르면 바로 캐스팅 세기 조절이 시작됐는데, 그 자리를 이
   낚시 버튼 하나로 옮기고(el.frame 전체 pointerdown이 아니라 이 버튼만
   idle → charging을 트리거한다 — 입력 섹션 참고) 나머지 화면은 캐릭터
   이동에 쓴다. */
/* 이동 조이스틱 — 큰 원(베이스, .joystick-base) 안에서 작은 원(손잡이,
   .joystick-knob)을 드래그한다. 실제 캐릭터 "위치" 이동은 8방향(대각선
   포함) 그대로 자유롭다 — 45도 단위 8구역 스냅(JOYSTICK_ZONE_DX/DY).
   걷기 "애니메이션"(어느 시트를 보여줄지, 상/하/좌/우)은 대각선이면
   가로(좌/우) 시트를 우선해서 쓴다(spriteDirFor) — 순수 상/하로만 밀 때만
   위/아래 시트를 쓴다. */
   .joystick(바깥)은 실제로 눈에 보이는 원보다 더 큰, 투명한 "탭 인식
   범위" 확장용 히트박스다 — 손가락이 시각적 원 밖으로 조금 벗어나도
   여기 안이면 바로 그 지점을 조이스틱 입력으로 잡는다(pointerdown이
   el.joystick에 걸려 있으므로, updateJoystickFromPointer가 클릭 지점과
   중심 사이 각도/거리로 방향을 계산하는 기존 로직 그대로 재사용된다).
   실제 눈에 보이는 원은 안쪽 .joystick-base가 그린다.

   크기/위치는 --joy-*/--fish-* CSS 변수로 빼뒀다 — 우상단 편집 버튼
   (el.layoutEditBtn)으로 켠 편집 모드에서 슬라이더/드래그로 이
   변수들을 자바스크립트가 직접 바꾼다(applyLayoutPrefs, 값은
   localStorage에 저장돼 다음 접속에도 유지된다). 아래 값들은 그
   변수들의 기본값(처음 접속 시)이다. */
:root{
  --joy-hit-size:170px; --joy-base-size:130px; --joy-knob-size:56px;
  --joy-left:40px; --joy-bottom:56px;
  --fish-size:80px; --fish-right:16px; --fish-bottom:24px;
}
.joystick{position:absolute;left:calc(var(--joy-left) + env(safe-area-inset-left,0));bottom:calc(var(--joy-bottom) + env(safe-area-inset-bottom,0));z-index:5;width:var(--joy-hit-size);height:var(--joy-hit-size);touch-action:none}
.joystick.hidden{display:none}
.joystick-base{position:absolute;left:50%;top:50%;width:var(--joy-base-size);height:var(--joy-base-size);margin:calc(var(--joy-base-size) / -2) 0 0 calc(var(--joy-base-size) / -2);border-radius:50%;background:rgba(5,20,28,.35);border:1px solid rgba(255,255,255,.3);pointer-events:none}
.joystick-knob{position:absolute;left:50%;top:50%;width:var(--joy-knob-size);height:var(--joy-knob-size);margin:calc(var(--joy-knob-size) / -2) 0 0 calc(var(--joy-knob-size) / -2);border-radius:50%;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.65);pointer-events:none}
.fish-btn{position:absolute;right:calc(var(--fish-right) + env(safe-area-inset-right,0));bottom:calc(var(--fish-bottom) + env(safe-area-inset-bottom,0));z-index:5;width:var(--fish-size);height:var(--fish-size);border-radius:50%;background:rgba(5,20,28,.4);border:1px solid rgba(255,255,255,.3);font-size:calc(var(--fish-size) * 0.4);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer}
.fish-btn:active{background:rgba(5,20,28,.65);transform:scale(.95)}
.fish-btn.hidden{display:none}

/* 배치 편집 — 우상단 버튼을 누르면 조이스틱/낚시 버튼을 드래그로 옮기고
   슬라이더로 크기를 바꿀 수 있다(layoutEditMode). idle 상태에서만
   접근 가능(다른 버튼들과 동일한 제약). */
.layout-edit-btn{position:absolute;right:calc(16px + env(safe-area-inset-right,0));top:calc(56px + env(safe-area-inset-top,0));z-index:6;width:38px;height:38px;border-radius:50%;background:rgba(5,20,28,.45);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer}
.layout-edit-btn.active{background:rgba(232,116,30,.9);border-color:rgba(255,255,255,.6)}
.layout-edit-panel{position:absolute;right:calc(16px + env(safe-area-inset-right,0));top:calc(102px + env(safe-area-inset-top,0));z-index:6;width:180px;max-height:calc(100% - 140px);overflow-y:auto;background:rgba(5,20,28,.8);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.layout-edit-panel.hidden{display:none}
.layout-edit-panel label{display:flex;flex-direction:column;gap:4px;color:#fff;font-size:12px;font-weight:600}
.layout-edit-panel label.hidden{display:none}
.layout-edit-panel input[type=range]{width:100%}
.layout-edit-panel button{margin-top:2px;padding:8px;border-radius:10px;border:none;background:rgba(232,116,30,.9);color:#fff;font-weight:700;font-size:13px}
.layout-edit-panel button.secondary{background:rgba(255,255,255,.14)}
.layout-edit-panel button.active{background:var(--cyan);color:#04181c}

/* ===== 배치 코드 보기 — 편집 패널의 "코드보기" 버튼으로 연다. 지금
   layoutPrefs 값을 그대로 JS 리터럴로 보여줘서, 마음에 드는 배치를
   찾으면 그 값을 이 파일 layoutPrefs 기본값에 붙여넣어 localStorage
   없이도(다른 기기에서도) 고정되게("확정") 만들 수 있다. */
.layout-code-overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.layout-code-overlay.hidden{display:none}
.layout-code-sheet{width:100%;max-width:380px;max-height:80vh;overflow-y:auto;background:rgba(8,14,18,.96);border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:18px}
.layout-code-title{font-family:var(--mono);font-size:14px;font-weight:700;color:#fff;margin-bottom:6px}
.layout-code-desc{font-size:12.5px;color:rgba(255,255,255,.7);line-height:1.5;margin-bottom:12px}
.layout-code-textarea{width:100%;min-height:220px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:10px;color:#fff;font-family:var(--mono);font-size:11.5px;line-height:1.5;resize:vertical;margin-bottom:10px;-webkit-user-select:text;user-select:text}
.layout-code-copy-btn{width:100%;padding:10px;border-radius:10px;border:none;background:var(--cyan);color:#04181c;font-weight:700;font-size:13px;cursor:pointer;margin-bottom:6px}
.layout-code-copy-status{font-family:var(--mono);font-size:11px;color:var(--green);min-height:14px;margin-bottom:8px}
.layout-code-close-btn{width:100%;padding:10px;border-radius:10px;border:none;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:13px;cursor:pointer}

/* 위치를 드래그로 옮기는 동안(조이스틱/낚시 버튼) 실제 그림 대신 이
   점선 네모만 보여준다(startLayoutDrag/syncDragGhost) — 드래그 중인
   원래 요소는 .layout-drag-hide로 투명 처리하되(포인터 캡처는 그대로
   유지되어 드래그 자체는 안 끊긴다) 자리·크기는 이 네모가 실시간으로
   따라간다. */
.layout-drag-ghost{position:absolute;z-index:20;box-sizing:border-box;border:2px dashed rgba(255,255,255,.9);background:rgba(255,255,255,.12);pointer-events:none}
.layout-drag-ghost.hidden{display:none}
.layout-drag-hide{opacity:0}

/* 추(sinker) 던지기 물리 시뮬레이션 — 낚싯대 끝~추 사이는 현수선(catenary)
   커브로 그린다(catenaryPoints/renderCastLine). 좌표계는 el.frame 픽셀
   그대로 써서(viewBox) 물리 계산과 그리기가 같은 단위를 쓴다. */
.cast-svg{position:absolute;inset:0;z-index:3;pointer-events:none}
.cast-svg.hidden{display:none}
.cast-line{fill:none;stroke:rgba(230,230,220,.9);stroke-width:1.5}
.cast-sinker{fill:#5a5f66;stroke:rgba(0,0,0,.4);stroke-width:1}
.cast-sinker-img{display:none}

/* 낚시바를 감싸던 반투명 둥근 배경 패널은 사용자 요청으로 없앴다 —
   낚시바(.fishbar)만 화면에 떠 있고, 그 뒤 배경은 그대로 비친다. .fishbar
   자체도 배경을 투명하게 둔다 — 예전엔 #171C22 하드코딩 색이 채워져
   있었는데, "PPT 슬라이드형 에디터"로 바뀌면서 색상 피커(barColor)가
   빠진 채 그 하드코딩 색만 남아, 낚시바 이미지를 안 올렸거나 슬라이드
   전체를 안 덮으면 안 덮인 부분이 그냥 검게 보이는 문제가 있었다. */
/* 위치(left/top/transform)는 화면 중앙 고정이 아니라 캐릭터 오른쪽을
   따라가도록 positionFishbarRightOfCharacter가 매번 인라인 스타일로
   계산해 넣는다(아래 참고). */
.fishbar-panel{position:absolute;z-index:4;display:flex;align-items:center;gap:14px;padding:18px 20px}
.fishbar-panel.hidden{display:none}
.fishbar{position:relative;width:52px;height:230px;border-radius:12px;overflow:hidden}
/* 낚시바 이미지 — 설정 화면(dev/minigame-fishing/index.html) 슬라이드
   에디터의 barLayer 배치(x,y,w,h, 슬라이드 기준 0~1)를 그대로 옮겨와
   절대위치로 놓는다. */
.fishbar-bar-img{position:absolute;pointer-events:none}
.fishbar-bar-img.hidden{display:none}
.fishbar-bar-img img{width:100%;height:100%;object-fit:fill;display:block}
/* 게이지 — 설정 화면에서 gaugeRegion을 지정해야만 나타난다(미지정 시
   기본 display:none). 위치/크기는 loadConfig가 gaugeRegion 기준으로
   매 판마다 한 번 정해준다. */
.fishbar-gauge{position:absolute;overflow:hidden;background:rgb(151,126,83);background-size:cover;background-repeat:no-repeat;background-position:center;display:none}
.fishbar-gauge-mask{position:absolute;left:0;right:0;top:0;background:rgba(5,7,10,.82)}
/* background-size는 cover(비율 유지, 넘치는 부분 잘라내기)가 아니라
   100% 100%(꽉 채우기, 늘이기)여야 한다 — 설정 화면 슬라이드 에디터가
   캐치바 이미지를 <img style="object-fit:fill">로 그려서(잘라내지 않고
   박스에 딱 맞게 늘여서) 보여주는데, cover를 쓰면 박스 종횡비가 이미지
   원본과 다를 때 여기서만 옆(주로 좌우)이 잘려나가 에디터에서 본 것과
   실제 화면이 달라 보인다("이미지 인식이 x축으로 밀려 보인다" 보고의
   진짜 원인). */
.fishbar-zone{position:absolute;border-radius:6px;opacity:.85;transition:background .2s;background-size:100% 100%;background-position:center}
/* --fishbar-fish-size — loadConfig가 낚시바 폭(slideWidthPx) 기준으로 채운다.
   기본값(22px/26px)은 기본 폭(90px) 기준 크기와 같아 CSS 변수가 아직 안
   채워졌을 때도(로드 전 잠깐) 결과가 같다. */
.fishbar-fish{position:absolute;left:50%;transform:translate(-50%,-50%);font-size:var(--fishbar-fish-size,22px);filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.fishbar-fish img{width:var(--fishbar-fish-size,26px);height:var(--fishbar-fish-size,26px);object-fit:contain;image-rendering:pixelated}

/* 낚시 성공 시 잡은 물고기 아이콘이 추(찌) 자리에서 캐릭터에게로 천천히
   날아오는 연출용 임시 엘리먼트 — flyFishToCharacter가 매 캐치마다
   새로 만들고(el.stage에 추가) 도착하면 제거한다. */
.fish-fly{position:absolute;z-index:7;width:44px;height:44px;border-radius:12px;background-repeat:no-repeat;image-rendering:pixelated;pointer-events:none;transform:translate(-50%,-50%) scale(var(--casting-scale,1));filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));font-size:28px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}

/* ===== 낚시 팝업 — 낚시 성공(물고기가 캐릭터에게 날아온 다음)에만 뜨는
   말풍선. 실패했을 때는 아무 화면도 뜨지 않고 그냥 대기 상태로 돌아간다
   (missReaction/endCatch 참고 — resetToIdle을 바로 호출). 배경(액자)
   그림과 아이콘/이름/설명 위치·크기는 dev/minigame-fishing/index.html의
   "낚시 팝업" 탭(itemPopup config)에서 지정한다.
   전체 화면을 덮는 모달이 아니라 캐릭터(el.charStage) 바로 위에 뜨는
   말풍선이다 — 화면을 어둡게 가리지 않고, 위치는 showItemPopup이 매번
   캐릭터의 실제 화면 좌표를 기준으로 계산해 left/bottom 인라인 스타일로
   맞춘다(캐릭터가 화면 가장자리에 가까워도 카드가 화면 밖으로 안 나가게
   좌우로 clamp). 확인 버튼 없이 화면 아무 곳이나 탭하면 사라진다 —
   .item-popup과 .item-popup-card 둘 다 pointer-events:none이라 카드 위를
   눌러도 그대로 el.frame의 pointerdown으로 뚫고 내려가 gameState==='popup'
   분기(resetToIdle)가 처리한다.
   display:none으로 숨겼다 뜰 때 처음 그리면(populateItemPopup이 그리는
   카드 배경/물고기 아이콘 background-image) 브라우저가 그제서야 디코드해서
   뜨는 순간 느렸다(사용자 보고 — 잡은 물고기 아이콘도 같은 문제였다, 그때
   fishIconPreload로 고친 것과 같은 원인). 그래서 숨김 상태를 display:none이
   아니라 화면 밖(-9999px)으로 밀어두는 방식으로 바꿨다 — 레이아웃/페인트는
   정상적으로 계속 일어나 미리 그려두면 실제로 디코드가 끝나 있고,
   showItemPopup은 populateItemPopup(startCatching이 미리 한 번 불러둔 것과
   같은 내용)과 위치만 다시 맞추면 그만이다. */
.item-popup{position:absolute;z-index:9;pointer-events:none;left:-9999px}
/* 카드 종횡비 — 업로드한 배경(액자) 이미지의 실제 자연 크기를 그대로
   따라간다(loadConfig가 --item-ar을 이미지 자연 크기로 채워줌). cover
   대신 contain을 쓰는 이유: 종횡비가 이미지와 정확히 같으므로 어느 쪽을
   써도 결과는 같지만, 이미지 로드가 늦어 기본 종횡비(280/260)로 잠깐
   그려질 때 contain이어야 그 사이에도 잘리지 않는다. */
.item-popup-card{position:relative;width:220px;aspect-ratio:var(--item-ar,280/260);border-radius:20px;background-size:contain;background-repeat:no-repeat;background-position:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:16px;gap:6px;overflow:hidden}
/* 업로드한 배경(액자) 그림이 없을 때만 쓰는 기본 카드 배경 — 업로드한
   그림은 이미 누끼 딴(투명 배경) 액자라 이 사각 배경/테두리/그림자까지
   같이 깔면 그 뒤로 각진 박스가 비쳐 보인다. loadConfig가 배경 자산
   유무에 따라 이 클래스를 토글한다. 이름/설명 글씨색을 검은색으로 바꾸면서
   어두운 배경(--surface-1)에서는 글씨가 안 보이게 되므로, 기본 배경도
   흰색으로 함께 바꿨다. */
.item-popup-card.item-popup-card--fallback{background-color:#fff;border:1px solid rgba(0,0,0,.08);box-shadow:0 8px 32px rgba(0,0,0,.25)}
.item-popup-icon{position:absolute;border-radius:16px;background-color:rgba(255,255,255,.12);background-repeat:no-repeat;background-size:cover;background-position:center;image-rendering:pixelated;display:flex;align-items:center;justify-content:center;font-size:32px;transform:translate(-50%,-50%)}
/* 이름/설명(등급·가치)도 아이콘과 같은 방식(위치 지정 피커, 정규화 좌표
   기준 중심점)으로 자유 배치한다 — 더 이상 flex 흐름에 얹혀 자동으로
   쌓이지 않는다. */
.item-popup-name{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:16px;font-weight:700;color:#000}
.item-popup-meta{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--mono);font-size:12px;color:#000}

/* ===== 영우 NPC 메뉴 / 물고기 팔기 — 대화 인트로(.dialogue-intro)와 같은
   전체화면 반투명 오버레이 + 배경 탭으로 닫기 규칙을 그대로 따른다. */
.npc-menu,.sell-fish{position:absolute;inset:0;z-index:21;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.npc-menu.hidden,.sell-fish.hidden{display:none}
.npc-menu-card{width:240px;background:rgba(8,16,22,.92);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.npc-menu-title{text-align:center;font-size:17px;font-weight:700;color:#fff;margin-bottom:6px}
.npc-menu-btn{padding:12px;border-radius:14px;border:none;font-size:14px;font-weight:700;color:#fff;font-family:inherit}
.npc-menu-btn--sell{background:rgba(62,207,107,.85)}
.npc-menu-btn--quit{background:rgba(217,65,65,.85)}
.npc-menu-btn--close{background:rgba(255,255,255,.15);color:rgba(255,255,255,.85)}
.npc-menu-btn:active{opacity:.8}

.sell-fish-card{width:270px;max-height:70vh;background:rgba(8,16,22,.94);background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
/* 아이템창 탭(dev/minigame-fishing/index.html)에서 배경(액자) 그림을
   올리면 이 클래스가 붙어 기본 어두운 단색 대신 그 그림이 깔린다. */
.sell-fish-card.sell-fish-card--has-bg{background-color:transparent}
.sell-fish-title{text-align:center;font-size:16px;font-weight:700;color:#fff}
.sell-fish-list{display:flex;flex-direction:column;gap:6px;max-height:38vh;overflow-y:auto}
.sell-fish-empty{text-align:center;font-size:13px;color:rgba(255,255,255,.6);padding:10px 0}
.sell-fish-row{display:flex;align-items:center;gap:8px;font-size:13px;color:#fff}
.sell-fish-name{flex:1;font-weight:600}
.sell-fish-qty{color:rgba(255,255,255,.6)}

<script>
/* =========================================================================
   낚시 미니게임 플레이 화면. 흐름: 캐스팅(대기 탭) → 캐스팅 모션 재생 →
   찌 던지기 → 입질 대기 → 입질(반응 탭) → 낚시바(잡아채기, 홀드/릴리즈로
   캐치존을 움직여 물고기를 가둔다) → 올리기 모션 재생 → 결과.

   설정은 /dev/minigame-fishing/'s 설정 screen에서 넘어온다 — 난이도/모션
   타입(물고기 움직임 패턴)은 다른 미니게임들과 같은 관례로 쿼리스트링
   (?diff=&motion=), 캐스팅·올리기 프레임과 낚시바 디자인은 AssetDB.
   getFishingConfig()로 직접 불러온다(watermelon/play가 fruit 이미지를
   localStorage에서 직접 읽는 것과 같은 자산-데이터 취급). 영우 NPC(대화
   메뉴, handleQuit)의 "그만하기"가 다음 씬으로 넘어갈 때 쓰는 ?nextScene=
   도 같은 쿼리스트링에서 읽는다.
   ========================================================================= */

const settingsParams = new URLSearchParams(location.search);
const DIFFICULTY = ['easy', 'hard'].includes(settingsParams.get('diff')) ? settingsParams.get('diff') : 'normal';
const MOTION_TYPE = ['linear', 'random'].includes(settingsParams.get('motion')) ? settingsParams.get('motion') : 'zigzag';

const DIFF_TUNING = {
  easy: { reactionWindow: 900, fishSpeedMult: 0.85, fillRate: 30, drainRate: 14 },
  normal: { reactionWindow: 700, fishSpeedMult: 1.0, fillRate: 24, drainRate: 18 },
  hard: { reactionWindow: 520, fishSpeedMult: 1.3, fillRate: 20, drainRate: 24 },
};
// 낚시 대기시간(캐스팅 착수 후 입질까지) — 난이도와 무관하게 항상 5~10초
// 사이 랜덤이다.
const BITE_WAIT_MIN_MS = 5000;
const BITE_WAIT_MAX_MS = 10000;

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
function vibrate(pattern) { if (navigator.vibrate) navigator.vibrate(pattern); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// assetDb.js의 dataUrl은 더 이상 base64가 아니라 실제 Supabase Storage 공개
// URL이다 — 업로드 직후 곧바로 재생 화면을 열면 Storage 쪽 전파가 아직
// 안 끝나 첫 로드가 실패하고(그 자리엔 background-color만 남아 "단색으로만
// 보임") 새로고침하면 되던 증상의 유력한 원인이라, background-image로 바로
// 꽂기 전에 이 헬퍼로 먼저 로드를 검증하고 실패하면 짧게 대기 후 재시도한다.
// ok:false(재시도를 다 썼는데도 로드 실패)를 호출부에 알려줘야, 색 폴백
// 없이 곧바로 background-image만 꽂는 자리(예: 캐치바)에서 "이미지도 안
// 뜨고 폴백 색도 없어서 완전히 안 보이는" 상태를 피하고 대신 색으로
// 폴백할 수 있다 — url만 반환하던 이전 버전은 이 실패를 구분할 수
// 없었다.
function preloadWithRetry(url, retries, delayMs) {
  return new Promise(resolve => {
    const attempt = (remaining) => {
      const img = new Image();
      img.onload = () => resolve({ url, ok: true });
      img.onerror = () => {
        if (remaining > 0) setTimeout(() => attempt(remaining - 1), delayMs);
        else resolve({ url, ok: false }); // 재시도 다 써도 일단 원래 URL로 시도는 하게 둔다
      };
      img.src = url;
    };
    attempt(retries);
  });
}

// 게이지 색 — 고정 그라데이션(항상 빨강~연두 전체 범위를 깔아두고 마스크로
// 일부만 드러내는 방식) 대신, "지금 진행도 값"을 0%(빨강)~70%(연두) 사이에서
// 내분해 하나의 단색으로 계산한다. 예: 35%면 주황/노랑 계열, 70% 이상은
// 그 이상 색이 안 바뀌고 연두로 고정. --signal-red(#D94141)/--green(#3ECF6B)
// CSS 변수와 같은 값을 RGB로 하드코딩해서 매 프레임 보간한다.
const GAUGE_COLOR_STOPS = { red: [217, 65, 65], green: [62, 207, 107], capPct: 70 };

// 물고기 등급 이름 색 — 낚시 팝업(showItemPopup)에서 잡은 물고기 이름을
// 등급(fishDefs.js grade)에 따라 바로 알아볼 수 있게 한다.
const GRADE_NAME_COLORS = { '일반': '#8B95A1', '레어': '#3B82F6', '희귀': '#A855F7', '전설': '#FFD12E' };
function gaugeColorForProgress(pct) {
  const t = clamp(pct, 0, GAUGE_COLOR_STOPS.capPct) / GAUGE_COLOR_STOPS.capPct;
  const [r0, g0, b0] = GAUGE_COLOR_STOPS.red;
  const [r1, g1, b1] = GAUGE_COLOR_STOPS.green;
  const r = Math.round(r0 + (r1 - r0) * t);
  const g = Math.round(g0 + (g1 - g0) * t);
  const b = Math.round(b0 + (b1 - b0) * t);
  return `rgb(${r},${g},${b})`;
}

// 이미지 전체(캐릭터 절반이 가장자리 밖으로 안 나가게 CHAR_BOX_PX/2만큼
// 여백을 둔 범위)를 다 돌아다닐 수 있고, 안 했으면 FALLBACK_MOVE_BOUNDS_PCT를
// (이 경우 worldSize==화면 크기이므로) 그대로 px로 환산해 예전과 같은
// 좁은 범위를 유지한다.
function worldBounds() {
  if (hasWorldBackground) {
    const halfW = Math.min(CHAR_BOX_PX / 2, worldSize.w / 2), halfH = Math.min(CHAR_BOX_PX / 2, worldSize.h / 2);
    return { minX: halfW, maxX: Math.max(halfW, worldSize.w - halfW), minY: halfH, maxY: Math.max(halfH, worldSize.h - halfH) };
  }
  return {
    minX: FALLBACK_MOVE_BOUNDS_PCT.left[0] / 100 * worldSize.w,
    maxX: FALLBACK_MOVE_BOUNDS_PCT.left[1] / 100 * worldSize.w,
    minY: FALLBACK_MOVE_BOUNDS_PCT.bottom[0] / 100 * worldSize.h,
    maxY: FALLBACK_MOVE_BOUNDS_PCT.bottom[1] / 100 * worldSize.h,
  };
}

// 배경 레이어 크기 — 배경 원본 px * 줌으로 el.bgLayer 자체의 width/
// height/background-size를 맞춘다. 줌이 바뀌거나(슬라이더) 배경을 새로
// 불러올 때만 호출하면 되고, 카메라 이동(매 프레임) 경로에는 없다 —
// width/height 변경은 reflow를 유발하므로 그 빈도를 줄이는 게 핵심이다.
function applyBgLayerSize() {
  const zoom = effectiveBgZoom();
  const scaledW = worldSize.w * zoom, scaledH = worldSize.h * zoom;
  el.bgLayer.style.width = scaledW + 'px';
  el.bgLayer.style.height = scaledH + 'px';
  el.bgLayer.style.backgroundSize = `${scaledW}px ${scaledH}px`;
}

// 카메라 — 배경 전체를 담은 거대한 DOM(예전 el.world)을 옮기는 대신,
// 배경 원본 크기(줌 적용)로 미리 맞춰둔 el.bgLayer를 캐릭터 좌표에 맞춰
// transform:translate3d로 민다("그 화면 사이즈에 맞게 로딩"). 캐릭터
// (el.charStage)는 그 계산된 카메라 오프셋을 빼 실제 화면 위 자기 위치
// (left/bottom)에 매 프레임 직접 반영한다 — 캐릭터가 화면 위를 실제로
// 움직이는 것으로 보이고, 그 뒤에서 배경만 카메라 오프셋만큼 밀려 보이는
// 식이다. background-position을 매 프레임 바꾸던 예전 방식은 카메라가
// 움직일 때마다 배경 전체를 다시 페인트해야 해서 고용량 배경일수록 뚝뚝
// 끊겨 보였다 — transform은 페인트 없이 GPU 합성만으로 처리돼 더 부드럽다.
// 이미지 가장자리에서는 clamp돼 카메라가 더 이상 못 따라가고(화면 크기 -
// 이미지 크기가 음수가 안 나오게) 대신 캐릭터가 화면 가장자리 쪽으로
// 치우쳐 보인다 — 배경이 화면보다 작거나 없을 때(hasWorldBackground
// false)는 항상 0으로 clamp돼 카메라가 아예 움직이지 않고 캐릭터만 화면
// 안에서 움직인다. frameRect는 리사이즈/회전 때만 갱신되는 캐시값이다
// (refreshFrameRect) — 이동 중 매 프레임 getBoundingClientRect()를
// 다시 읽으면 그 자체로 강제 reflow가 걸려 끊겨 보인다.
function updateCamera() {
  const zoom = effectiveBgZoom();
  const scaledW = worldSize.w * zoom, scaledH = worldSize.h * zoom;
  const charXScaled = charWorldPos.x * zoom;
  const charYFromTopScaled = (worldSize.h - charWorldPos.y) * zoom;
  const camX = clamp(charXScaled - frameRect.width / 2, 0, Math.max(0, scaledW - frameRect.width));
  const camY = clamp(charYFromTopScaled - frameRect.height / 2, 0, Math.max(0, scaledH - frameRect.height));
  camOffset = { x: camX, y: camY };
  if (hasWorldBackground) {
    el.bgLayer.style.transform = `translate3d(${-camX}px, ${-camY}px, 0)`;
  }
  el.charStage.style.left = (charXScaled - camX) + 'px';
  el.charStage.style.bottom = (frameRect.height - charYFromTopScaled + camY) + 'px';
  if (npcWorldPos) {
    const npcXScaled = npcWorldPos.x * zoom;
    const npcYFromTopScaled = (worldSize.h - npcWorldPos.y) * zoom;
    el.npcYoungwooStage.style.left = (npcXScaled - camX) + 'px';
    el.npcYoungwooStage.style.bottom = (frameRect.height - npcYFromTopScaled + camY) + 'px';
  }
}

// 화면 크기가 바뀌면(회전, 리사이즈) — 배경 미업로드 폴백 모드에서는
// worldSize 자체가 "화면 크기"이므로 다시 맞추고 캐릭터 범위도 재조정한다.
// 배경을 업로드했을 땐 이미지 크기(worldSize)는 그대로고 카메라 clamp와
// 캐릭터 화면 위치만 다시 계산하면 된다(updateCamera). loadConfig가 아직
// 안 끝나 charWorldPos가 없으면(최초 로드 전) 아무것도 하지 않는다 —
// loadConfig가 초기 배치를 담당한다.
function onFrameResize() {
  if (!charWorldPos) return;
  refreshFrameRect();
  if (!hasWorldBackground) {
    worldSize = { w: frameRect.width, h: frameRect.height };
    const wb = worldBounds();
    charWorldPos.x = clamp(charWorldPos.x, wb.minX, wb.maxX);
    charWorldPos.y = clamp(charWorldPos.y, wb.minY, wb.maxY);
  }
  updateCamera();
}
window.addEventListener('resize', onFrameResize);
window.addEventListener('orientationchange', onFrameResize);

/* ===== 영역(다각형) 판정 =====
   dev/minigame-fishing/index.html "영역 설정" 탭에서 그린 다각형은 배경
   이미지의 자연 크기(bgDims) 기준 0~1 정규화 좌표(points)로 저장돼 있다.
   캐릭터 위치(charWorldPos)는 배경을 업로드했을 땐 이미 배경 원본 크기
   기준 px라 bgDims로 나누기만 하면 바로 같은 좌표계가 된다
   (worldPosToImageFrac). 반면 추(찌)가 착수하는 지점처럼 el.frame(화면)
   기준 픽셀로 계산되는 좌표는, 카메라가 지금 배경을 얼마나 옮겨뒀는지
   (camOffset)를 더해 배경 원본 좌표로 바꾼 다음에야 bgDims로 나눌 수
   있다(framePxToImageFrac). */
function isPointInPolygon(px, py, points) {
  let inside = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    const xi = points[i].x, yi = points[i].y, xj = points[j].x, yj = points[j].y;
    const intersect = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}
// x/y: charWorldPos와 같은 형식(배경 원본 이미지 기준 px, 왼쪽/아래 기준).
// bgDims를 못 읽었으면(배경 없음 등) 판정 근거가 없으므로 null을 돌려주고,
// 호출부는 이 경우 전부 "제한 없음"으로 취급한다.
function worldPosToImageFrac(x, y) {
  if (!bgDims) return null;
  return { x: x / bgDims.width, y: 1 - y / bgDims.height }; // y는 아래 기준 → 이미지 좌표계(위 기준)로 뒤집는다
}
function isInsideAnyArea(frac, areas) {
  return !!frac && areas.some(a => isPointInPolygon(frac.x, frac.y, a.points));
}
function areaContaining(frac, areas) {
  if (!frac) return null;
  return areas.find(a => isPointInPolygon(frac.x, frac.y, a.points)) || null;
}

// 영우 NPC와의 상호작용 판정 — 상호작용 영역(다각형)과 달리 설정 화면에서
// 따로 영역을 그릴 필요 없이, "캐릭터" 탭에서 지정한 npcWorldPos 기준
// 반경(원형)만으로 판정한다. id를 다른 상호작용 영역과 겹치지 않는 고정값
// (YOUNGWOO_NPC_INTERACTION_ID)으로 둬서 checkInteractionArea가 다각형보다
// 이 판정을 우선하게 한다.
const YOUNGWOO_NPC_INTERACTION_ID = 'youngwoo-npc';
const NPC_INTERACT_RADIUS_PX = CHAR_BOX_PX * 1.3;
function isNearYoungwoo() {
  if (!npcWorldPos) return false;
  const dx = charWorldPos.x - npcWorldPos.x, dy = charWorldPos.y - npcWorldPos.y;
  return (dx * dx + dy * dy) <= NPC_INTERACT_RADIUS_PX * NPC_INTERACT_RADIUS_PX;
}

// 상호작용 영역(상점/대화 등) — 캐릭터가 들어오고 나갈 때만(매 프레임이
// 아니라 상태가 바뀔 때만) 배지를 갱신하고 이벤트를 쏜다. 이 미니게임
// 자체엔 상점 UI가 없으므로, 실제 동작은 다른 화면이 이 이벤트를
// 구독해서 만들면 된다 — 여기선 영역 감지 + 라벨 배지 표시까지만 한다.
// (영우 NPC는 예외 — 대화는 이 화면 안에서 바로 처리한다, 아래 openNpcMenu.)
let activeInteractionAreaId = null;
function checkInteractionArea() {
  const area = isNearYoungwoo()
    ? { id: YOUNGWOO_NPC_INTERACTION_ID, label: '영우 · 탭해서 대화하기' }
    : areaContaining(worldPosToImageFrac(charWorldPos.x, charWorldPos.y), interactionAreas);
  const id = area ? area.id : null;
  if (id === activeInteractionAreaId) return;
  activeInteractionAreaId = id;
  if (area) {
    el.interactionBadge.textContent = area.label || '상호작용';
    el.interactionBadge.classList.remove('hidden');
    vibrate(10);
    window.dispatchEvent(new CustomEvent('fishing:interaction-enter', { detail: { id: area.id, label: area.label } }));
  } else {
    el.interactionBadge.classList.add('hidden');
    window.dispatchEvent(new CustomEvent('fishing:interaction-leave', {}));
  }
}

/* ===== 영우 NPC 메뉴 =====
   NPC 반경 안(activeInteractionAreaId === YOUNGWOO_NPC_INTERACTION_ID)에서
   idle 상태 화면을 탭하면(handleActionPointerDown) 뜬다. "물고기 팔기"는
   이번 판에서 잡아 아직 안 판 물고기(caughtFishTally)를 전부 포인트로
   바꾸고(EconomyState), "그만하기"는 낚시를 끝내고 다음 씬으로 넘긴다
   (handleQuit) — 대화 인트로와 같은 관례로 카드 밖(반투명 배경)을 탭하면
   그냥 닫힌다. */
function openNpcMenu() {
  gameState = 'npcMenu';
  el.npcMenu.classList.remove('hidden');
}
function closeNpcMenu() {
  gameState = 'idle';
  el.npcMenu.classList.add('hidden');
}

function totalCaughtFishValue() {
  return Object.entries(caughtFishTally).reduce((sum, [id, qty]) => {
    const def = getFishDef(id);
    return sum + (def ? def.value * qty : 0);
  }, 0);
}
function renderSellFishList() {
  const entries = Object.entries(caughtFishTally).filter(([, qty]) => qty > 0);
  el.sellFishList.innerHTML = '';
  if (!entries.length) {
    el.sellFishList.innerHTML = '<div class="sell-fish-empty">팔 수 있는 물고기가 없어요</div>';
  } else {
    entries.forEach(([id, qty]) => {
      const def = getFishDef(id);
      if (!def) return;
      const row = document.createElement('div');
      row.className = 'sell-fish-row';
      row.innerHTML = `<span class="sell-fish-name" style="color:${GRADE_NAME_COLORS[def.grade] || '#fff'}">${def.name}</span><span class="sell-fish-qty">x${qty}</span><span class="sell-fish-value">${def.value * qty}P</span>`;
      el.sellFishList.appendChild(row);
    });
  }
  const total = totalCaughtFishValue();
  el.sellFishTotal.textContent = `총 ${total}P`;
  el.sellFishConfirmBtn.disabled = total <= 0;
}
function openSellFishModal() {
  gameState = 'sellFish';
  renderSellFishList();
  el.npcMenu.classList.add('hidden');
  el.sellFishModal.classList.remove('hidden');
}
function closeSellFishModal() {
  gameState = 'idle';
  el.sellFishModal.classList.add('hidden');
}
function confirmSellFish() {
  const total = totalCaughtFishValue();
  if (total <= 0) return;
  EconomyState.addPoints(total, { source: 'fishing-sell-fish' });
  caughtFishTally = {};
  refreshStatusWindowPoints();
  vibrate(15);
  closeSellFishModal();
}

el.skipBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); handleQuit(); });
el.npcMenuSellBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); openSellFishModal(); });
el.npcMenuQuitBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); handleQuit(); });
el.npcMenuCloseBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); closeNpcMenu(); });
el.npcMenuCard.addEventListener('pointerdown', (e) => e.stopPropagation());
el.npcMenu.addEventListener('pointerdown', (e) => {
  if (gameState !== 'npcMenu') return;
  e.stopPropagation();
  closeNpcMenu();
});

el.sellFishConfirmBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); confirmSellFish(); });
el.sellFishCloseBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); closeSellFishModal(); });
el.sellFishCard.addEventListener('pointerdown', (e) => e.stopPropagation());
el.sellFishModal.addEventListener('pointerdown', (e) => {
  if (gameState !== 'sellFish') return;
  e.stopPropagation();
  closeSellFishModal();
});

/* ===== 그만하기 =====
   낚시를 시작한 씬이 ?nextScene=<sceneId>로 넘어온 경우(다른 미니게임들과
   같은 관례 — dev/minigame-timeline/index.html의 하드코딩된 다음 씬
   리다이렉트 참고) 그 씬으로 넘긴다. 지금 실제 진입 경로
   (week0-scene-circular-quay-minigame)는 nextScene 없이 el.backChip과
   같은 mkShopReturnUrl 계약으로 열리므로, nextScene이 없으면 el.backChip.href
   (=sessionStorage의 mkShopReturnUrl, 그것도 없으면 설정 화면)로 넘긴다 —
   그래야 스킵 버튼을 눌러도 설정 화면이 아니라 원래 스토리 씬으로 돌아간다.
   §추후 — "미니게임만 즐기기" 단독 실행 모드가 생기면 그때는 메인 메뉴로
   돌아가야 하지만, 그 모드 자체가 아직 없어 지금은 구현하지 않는다. */
function handleQuit() {
  const nextScene = settingsParams.get('nextScene');
  location.href = nextScene ? ('/play/game/?scene=' + encodeURIComponent(nextScene)) : el.backChip.href;
}

// 낚시가능 영역(fishableAreas) 판정은 캐릭터가 아니라 "추(찌)가 실제로
// 착수한 지점" 기준이다(throwSinker의 finish에서 씀) — 그래서 배경 원본
// 기준 px가 아니라 el.frame(화면) 기준 픽셀 좌표를 받는 버전이 필요하다.
// camOffset(지금 카메라가 옮겨둔 만큼)을 더해 배경 원본 좌표로 바꾼 뒤
// worldPosToImageFrac과 같은 식으로 이미지 정규화 좌표를 낸다.
function framePxToImageFrac(px, py) {
  if (!bgDims) return null;
  const zoom = effectiveBgZoom();
  const worldX = (px + camOffset.x) / zoom, worldYFromTop = (py + camOffset.y) / zoom;
  return { x: worldX / bgDims.width, y: worldYFromTop / bgDims.height };
}

/* ===== 설정 로드 (AssetDB) — 실패해도 게임은 도형 폴백으로 계속 동작한다. ===== */
async function loadConfig() {
  let cfg = { barDesign: {}, motionSheetAssetId: null, motionFrameOverrides: {} };
  try { cfg = await AssetDB.getFishingConfig(); } catch (e) { /* 오프라인/미설정 — 기본값으로 진행 */ }
  // 캐스팅·올리기(예전엔 각각 castingSheetAssetId 1행 시트/reelingFrames
  // 개별 업로드 배열)는 이제 motionSheetAssetId 6행×6열 시트 한 장을
  // 카테고리(행)별로 잘라 쓴다(dev/minigame-fishing/index.html 참고).
  const ids = [];
  const design = cfg.barDesign || {};
  if (design.fishIconAssetId) ids.push(design.fishIconAssetId);
  if (design.barLayer && design.barLayer.assetId) ids.push(design.barLayer.assetId);
  if (design.catchLayer && design.catchLayer.assetId) ids.push(design.catchLayer.assetId);
  if (design.sinkerImageAssetId) ids.push(design.sinkerImageAssetId);
  if (design.biteStampAssetId) ids.push(design.biteStampAssetId);
  if (design.gaugeImageAssetId) ids.push(design.gaugeImageAssetId);
  if (cfg.fishSheetAssetId) ids.push(cfg.fishSheetAssetId);
  if (cfg.motionSheetAssetId) ids.push(cfg.motionSheetAssetId);
  // 카테고리별 "6프레임 업로드" 스트립(motionCategorySheetAssetId, 1행×6열
  // 한 장) — 있으면 resolveMotionCategorySource(fishDefs.js)가 그 카테고리는
  // 메인 6x6 시트 대신 이 스트립을 쓰라고 알려준다(dev/minigame-fishing/
  // index.html 참고).
  const motionCategorySheetAssetId = cfg.motionCategorySheetAssetId || {};
  MOTION_CATEGORIES.forEach(category => {
    if (motionCategorySheetAssetId[category]) ids.push(motionCategorySheetAssetId[category]);
  });
  // 프레임별 지우기(motionFrameEraseOverrides, dev/minigame-fishing/index.html
  // openFrameEraser) — 있으면 그 프레임은 시트 크롭 대신 이 손질된 PNG를 쓴다.
  const motionFrameEraseOverrides = cfg.motionFrameEraseOverrides || {};
  MOTION_CATEGORIES.forEach(category => {
    Object.values(motionFrameEraseOverrides[category] || {}).forEach(assetId => { if (assetId) ids.push(assetId); });
  });
  if (cfg.castGaugeAssetId) ids.push(cfg.castGaugeAssetId);
  const statusWindowCfg = cfg.statusWindow || {};
  if (statusWindowCfg.frameAssetId) ids.push(statusWindowCfg.frameAssetId);
  if (statusWindowCfg.arrowAssetId) ids.push(statusWindowCfg.arrowAssetId);
  Object.values(statusWindowCfg.numberFontAssetIds || {}).forEach(assetId => { if (assetId) ids.push(assetId); });
  const characterIdleSheetsCfg = cfg.characterIdleSheets || {};
  if (characterIdleSheetsCfg.jisu && characterIdleSheetsCfg.jisu.assetId) ids.push(characterIdleSheetsCfg.jisu.assetId);
  if (characterIdleSheetsCfg.youngwoo && characterIdleSheetsCfg.youngwoo.assetId) ids.push(characterIdleSheetsCfg.youngwoo.assetId);
  const itemPopupCfg = cfg.itemPopup || {};
  if (itemPopupCfg.backgroundAssetId) ids.push(itemPopupCfg.backgroundAssetId);
  if (cfg.itemWindowBackgroundAssetId) ids.push(cfg.itemWindowBackgroundAssetId);
  const dialogueSceneCfg = cfg.dialogueScene || {};
  DIALOGUE_INTRO_IMAGE_LAYERS.forEach(key => { if (dialogueSceneCfg[key] && dialogueSceneCfg[key].assetId) ids.push(dialogueSceneCfg[key].assetId); });
  if (dialogueSceneCfg.jisooPortraitAssetId) ids.push(dialogueSceneCfg.jisooPortraitAssetId);
  if (dialogueSceneCfg.youngwooPortraitAssetId) ids.push(dialogueSceneCfg.youngwooPortraitAssetId);
  let assets = [];
  try { assets = await AssetDB.getAssetsByIds(ids); } catch (e) { /* 위와 동일 */ }
  const byId = new Map(assets.map(a => [a.id, a]));
  // 화면을 밝히기 전에(revealGame) 여기서 모은 이미지 자산을 전부 먼저
  // 디코드해둔다 — dataUrl은 실제로는 base64가 아니라 Supabase Storage
  // HTTPS URL(assetDb.js 참고)이라 방금 올린 파일은 공개 URL 전파가 아직
  // 안 됐을 수 있어 preloadWithRetry(barImageAsset 등과 같은 재시도)를
  // 그대로 쓴다. 아래 나머지 로직(배경/모션 프레임 등 조립)과 병렬로
  // 돌리고, 함수 맨 끝에서 await해 loadConfig 자체가 이 프리로드까지
  // 끝나야 resolve되게 한다.
  const preloadAllAssetImages = Promise.all(assets.map(a => preloadWithRetry(a.dataUrl, 3, 500)));
  const motionOverrides = cfg.motionFrameOverrides || {};
  // 카테고리별 소스 이미지(메인 시트 또는 카테고리 스트립, resolveMotionCategorySource
  // 참고)를 assetId별로 한 번씩만 로드해 재사용한다 — 카테고리 스트립을 안 올린
  // 동작들은 다 같은 메인 시트를 같이 쓰는 게 흔하다.
  const sourceImgCache = new Map();
  function loadSourceImg(assetId) {
    if (!assetId) return Promise.resolve(null);
    if (sourceImgCache.has(assetId)) return sourceImgCache.get(assetId);
    const asset = byId.get(assetId);
    const promise = asset ? new Promise(resolve => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => resolve(im);
      im.onerror = () => resolve(null);
      im.src = asset.dataUrl;
    }) : Promise.resolve(null);
    sourceImgCache.set(assetId, promise);
    return promise;
  }
  // outputSize를 안 넘긴다 — buildMotionCategoryFrameDataUrls가 원본 크롭
  // 해상도를 그대로 살린다(84px char-stage/96px 미리보기에서 다시 확대되며
  // 흐려지지 않게).
  async function buildCategoryFrames(category) {
    const source = resolveMotionCategorySource(cfg, category);
    const img = await loadSourceImg(source.assetId);
    const frames = img ? buildMotionCategoryFrameDataUrls(img, source.row, motionOverrides[category], source.rowOverride) : [];
    const eraseOverrides = motionFrameEraseOverrides[category] || {};
    return frames.map((url, i) => {
      const asset = eraseOverrides[i] ? byId.get(eraseOverrides[i]) : null;
      return asset ? asset.dataUrl : url;
    });
  }

  castFrameUrls = await buildCategoryFrames('cast');
  reelFrameUrls = await buildCategoryFrames('reel');
  // 캐스팅 시트의 6프레임 뒤에 올리기 1번째 프레임을 7번째 프레임으로
  // 이어붙인다 — 캐스팅이 끝난 뒤 대기 내내 머무는 마지막 포즈(위
  // playFrameSequence 주석 참고)가 올리기 애니메이션의 시작 포즈와 같아져,
  // 입질 성공 후 올리기로 넘어갈 때 포즈가 튀지 않는다.
  if (castFrameUrls.length && reelFrameUrls.length) castFrameUrls = castFrameUrls.concat(reelFrameUrls[0]);
  castFrameDurations = (cfg.castingFrameDurations && cfg.castingFrameDurations.length) ? cfg.castingFrameDurations : null;
  castingFrameRodTips = cfg.castingFrameRodTips || {};
  reelFrameRodTips = cfg.reelFrameRodTips || {};
  heldFishPos = cfg.heldFishPos || DEFAULT_HELD_FISH_POS;
  castPhysics = Object.assign({ gravityMps2: 9.8, vxScale: 1 }, cfg.castPhysics || {});
  reelMotion = Object.assign({ holdFrameMs: 90 }, cfg.reelMotion || {});

  // 이동 방향별 걷기 프레임 — 캐스팅/올리기와 같은 방식(메인 모션 시트 또는
  // 카테고리 스트립)으로 잘라 캐시해둔다. 소스 이미지가 없으면 빈 배열로
  // 두고, stepChar가 그 경우 캐릭터 그림을 그대로 둔 채 위치만 옮긴다.
  walkMotion = Object.assign({ stepMs: 200, animFrameMs: 90 }, cfg.walkMotion || {});
  motionPlaybackMs = Object.assign(
    { up: walkMotion.animFrameMs, down: walkMotion.animFrameMs, left: walkMotion.animFrameMs, right: walkMotion.animFrameMs },
    cfg.motionPlaybackMs || {}
  );
  walkFrameUrls = { up: [], down: [], left: [], right: [] };
  for (const dir of MOVE_DIRS) {
    walkFrameUrls[dir] = await buildCategoryFrames(dir);
  }

  // 지수/영우 idle(멈춰 서 있을 때) 프레임 — dev/minigame-fishing/index.html
  // "캐릭터" 탭에서 올린 2x2 시트(fishDefs.js의 IDLE_GRID_DIRS/
  // buildIdleFrameDataUrls)를 방향별로 잘라 캐시해둔다. 시트를 안 올렸으면
  // 빈 값 그대로 둔다 — 지수는 idlePoseUrl()이 걷기 시트 1번 프레임(그마저
  // 없으면 castFrameUrls[0])으로 폴백하고, 영우는 아래(down) 프레임이 없으면
  // 아래에서 el.npcYoungwooStage를 hidden으로 둔다.
  async function loadIdleFrames(characterCfg) {
    const empty = { up: null, down: null, left: null, right: null };
    if (!characterCfg || !characterCfg.assetId) return empty;
    const asset = byId.get(characterCfg.assetId);
    if (!asset) return empty;
    const img = await new Promise(resolve => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => resolve(im);
      im.onerror = () => resolve(null);
      im.src = asset.dataUrl;
    });
    return img ? buildIdleFrameDataUrls(img, characterCfg.overrides) : empty;
  }
  const characterIdleSheets = cfg.characterIdleSheets || {};
  jisuIdleFrameUrls = await loadIdleFrames(characterIdleSheets.jisu);
  youngwooIdleFrameUrls = await loadIdleFrames(characterIdleSheets.youngwoo);

  const fishSheetAsset = cfg.fishSheetAssetId ? byId.get(cfg.fishSheetAssetId) : null;
  fishSheetUrl = fishSheetAsset ? fishSheetAsset.dataUrl : null;
  fishIconOverrides = cfg.fishIconOverrides || {};
  if (fishSheetUrl) {
    fishSheetDims = await new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
      img.onerror = () => resolve(null);
      img.src = fishSheetUrl;
    });
  }

  // 화면(screens) — 배경화면 여러 장을 서로 걸어서 이동 가능한 화면으로
  // 묶는 단위(§신규, 영역지정/화면 전환. dev/minigame-fishing/index.html
  // "화면" 관리 참고). 배경/영역(낚시가능·이동불가·상호작용·이동)·영우
  // 위치를 실제로 적용하는 로직은 화면을 걸어서 건널 때도 그대로
  // 재사용해야 해서 applyScreen()으로 따로 뺐다(아래 정의,
  // triggerScreenTransition이 이동 영역을 밟았을 때 다시 호출한다).
  // screens가 비어있으면(아직 화면을 하나도 안 만들었으면) applyScreen(null)이
  // 예전처럼 .frame 기본 하늘/바다 그라데이션 폴백으로 처리한다.
  screensList = cfg.screens || [];
  const startScreen = screensList.find(s => s.id === cfg.startScreenId) || screensList[0] || null;
  currentScreenId = startScreen ? startScreen.id : null;
  await applyScreen(startScreen, { isInitialLoad: true });

  // 낚시바 모듈 크기 — 설정 화면 슬라이드 에디터(dev/minigame-fishing/
  // index.html)의 슬라이드 실제 px 크기를 그대로 쓴다.
  const slideWidthPx = design.slideWidthPx || 90;
  el.fishbar.style.width = slideWidthPx + 'px';
  el.fishbar.style.height = (design.slideHeightPx || 260) + 'px';

  // 물고기 아이콘 크기 — 설정 화면(fishIconSizeInput)에서 직접 지정한
  // 값을 쓴다. 아직 지정한 적 없는 기존 설정(fishIconSizePx 미설정)은
  // 예전 자동 계산값(기본 폭 90px 기준 26px, 낚시바가 더 좁으면
  // (slideWidthInput min 40px) 그 폭에 비례해 줄어듦 — 폭에 상관없이 항상
  // 26px 고정이면 좁은 낚시바에서 아이콘이 바 너비를 넘어가 튀어나와
  // 보이던 문제가 있었다)으로 그대로 폴백한다.
  const fishIconSizePx = design.fishIconSizePx || Math.min(26, slideWidthPx * 0.4);
  el.fishbarFish.style.setProperty('--fishbar-fish-size', fishIconSizePx + 'px');

  // 낚시바 이미지 — barLayer(x,y,w,h, 슬라이드 기준 0~1 비율)를 그대로
  // 절대위치로 옮겨온다(설정 화면 슬라이드와 좌표계가 동일하므로 변환 없음).
  const barImageAsset = design.barLayer && design.barLayer.assetId ? byId.get(design.barLayer.assetId) : null;
  if (barImageAsset && design.barLayer) {
    el.fishbarBarImg.querySelector('img').src = (await preloadWithRetry(barImageAsset.dataUrl, 3, 500)).url;
    el.fishbarBarImg.style.left = (design.barLayer.x * 100) + '%';
    el.fishbarBarImg.style.top = (design.barLayer.y * 100) + '%';
    el.fishbarBarImg.style.width = (design.barLayer.w * 100) + '%';
    el.fishbarBarImg.style.height = (design.barLayer.h * 100) + '%';
    el.fishbarBarImg.classList.remove('hidden');
  } else {
    el.fishbarBarImg.classList.add('hidden');
  }

  // 캐치바(캐치존) — 좌우 위치/폭은 barLayer/fishRegion과 똑같이 catchLayer의
  // 슬라이드 좌표(x,w)를 그대로 1:1로 쓴다(에디터에서 본 자리 그대로).
  // 예전엔 zoneRegion 기준 상대 위치로 다시 계산했는데, catchLayer가
  // zoneRegion 경계를 살짝 벗어나면 클램프 때문에 실제 화면 위치가
  // 에디터에서 배치한 자리와 어긋나는("이미지 인식이 x축으로 살짝 밀려
  // 보인다" 보고) 문제가 있었다. zoneRegion은 세로 이동 트랙(위아래로
  // 움직이는 범위)과 캐치바 높이 비율(zoneSizePct)에만 쓴다 — 세로 이동
  // 자체(캐치존 y)는 계속 0~100 추상 공간에서 물리대로 계산되고
  // (updateZone), 여기서 정하는 건 트랙의 화면상 배치뿐이다.
  const zoneRegion = design.zoneRegion;
  const catchLayer = design.catchLayer;
  const catchImageAsset = catchLayer && catchLayer.assetId ? byId.get(catchLayer.assetId) : null;
  // 이미지 로드에 성공했을 때만 파란 폴백 색(#59B8C8)을 뺀다 — 예전엔 색을
  // 항상 먼저 채워두고 그 위에 이미지를 얹기만 했는데, 업로드한 이미지에
  // 투명한 부분이 조금이라도 있으면 그 틈으로 파란색이 그대로 비쳐서
  // "이미지를 올렸는데도 이상한 파란 바가 보인다"는 문제가 있었다. 다만
  // 색을 아예 없애버리면 이미지 로드가 실패했을 때(재시도를 다 써도 안 될
  // 때) 색도 이미지도 없어 캐치바가 완전히 안 보이는 문제가 생겨서
  // (사용자 보고: "캐치바가 아예 안떠"), 로드 성공 여부에 따라 나눈다.
  if (catchImageAsset) {
    const catchImage = await preloadWithRetry(catchImageAsset.dataUrl, 3, 500);
    el.fishbarZone.style.background = catchImage.ok ? 'none' : '#59B8C8';
    el.fishbarZone.style.backgroundImage = `url(${catchImage.url})`;
  } else {
    el.fishbarZone.style.background = '#59B8C8';
    el.fishbarZone.style.backgroundImage = '';
  }
  // background(숏핸드)가 방금 위에서 backgroundSize를 auto로 되돌려놨다 —
  // CSS(.fishbar-zone{background-size:100% 100%})만으로는 이 인라인
  // 리셋을 못 이겨서, 매번 다시 명시적으로 채워야 실제로 적용된다.
  el.fishbarZone.style.backgroundSize = '100% 100%';
  if (zoneRegion) {
    zoneTrack = { x: zoneRegion.x * 100, y: zoneRegion.y * 100, w: zoneRegion.w * 100, h: zoneRegion.h * 100 };
    if (catchLayer) {
      zoneSizePct = clamp(catchLayer.h / zoneRegion.h * 100, 5, 95);
      el.fishbarZone.style.left = (catchLayer.x * 100) + '%';
      el.fishbarZone.style.width = (catchLayer.w * 100) + '%';
    } else {
      zoneSizePct = 28;
      el.fishbarZone.style.left = zoneTrack.x + '%';
      el.fishbarZone.style.width = zoneTrack.w + '%';
    }
    el.fishbarZone.style.height = (zoneSizePct / 100 * zoneTrack.h) + '%';
  } else {
    zoneTrack = null;
    zoneSizePct = 28;
    el.fishbarZone.style.left = '0%';
    el.fishbarZone.style.width = '100%';
    el.fishbarZone.style.height = zoneSizePct + '%';
  }

  // 물고기(.fishbar-fish) — fishRegion(트랙, 슬라이드 기준 0~1)이 있으면
  // 그 안에서 움직이고, 없으면 예전처럼 캐치존과 같은 zoneTrack을 그대로
  // 쓴다(fishRegion을 아직 안 만든 기존 설정과의 호환). fish.y는 세로
  // 위치만 담당하므로, 가로 위치는 트랙 가로 중앙에 고정한다.
  const fishRegion = design.fishRegion;
  fishTrack = fishRegion
    ? { x: fishRegion.x * 100, y: fishRegion.y * 100, w: fishRegion.w * 100, h: fishRegion.h * 100 }
    : zoneTrack;
  el.fishbarFish.style.left = fishTrack ? (fishTrack.x + fishTrack.w / 2) + '%' : '50%';

  // 게이지 — gaugeRegion을 지정했을 때만 나타난다(미지정 시 기본 숨김).
  if (design.gaugeRegion) {
    const gr = design.gaugeRegion;
    el.fishbarGauge.style.left = (gr.x * 100) + '%';
    el.fishbarGauge.style.top = (gr.y * 100) + '%';
    el.fishbarGauge.style.width = (gr.w * 100) + '%';
    el.fishbarGauge.style.height = (gr.h * 100) + '%';
    // CSS 기본값이 display:none이라 style.display를 빈 문자열로 되돌리면
    // 그 CSS 규칙이 그대로 이어져 계속 안 보인다 — 반드시 명시적으로
    // 'block'을 지정해야 실제로 나타난다(gaugeRegion을 지정해도 게이지가
    // 화면에 전혀 안 보이던 버그의 원인).
    el.fishbarGauge.style.display = 'block';
  } else {
    el.fishbarGauge.style.display = 'none';
  }

  const fishIconAsset = design.fishIconAssetId ? byId.get(design.fishIconAssetId) : null;
  if (fishIconAsset) el.fishbarFish.innerHTML = `<img src="${fishIconAsset.dataUrl}" alt="">`;

  const sinkerImageAsset = design.sinkerImageAssetId ? byId.get(design.sinkerImageAssetId) : null;
  sinkerImageUrl = sinkerImageAsset ? sinkerImageAsset.dataUrl : null;
  el.castSinker.style.display = sinkerImageUrl ? 'none' : '';
  el.castSinkerImg.style.display = sinkerImageUrl ? '' : 'none';
  if (sinkerImageUrl) el.castSinkerImg.setAttribute('href', sinkerImageUrl);
  // 착수 후 입질 대기 중 계속 떠 있는 bobber(찌)도 같은 추 이미지를 쓴다 —
  // 캐스팅 비행 중에만 이미지가 보이고 착수하자마자 기본 빨간 마름모로
  // 바뀌어 보이던 문제(사용자 보고: "이미지 올려도 적용 안 됨")를 해결한다.
  el.bobberDot.style.display = sinkerImageUrl ? 'none' : '';
  el.bobberImg.style.display = sinkerImageUrl ? 'block' : 'none';
  if (sinkerImageUrl) el.bobberImg.src = sinkerImageUrl;

  // 잡아채기 게이지 채움 이미지 — 있으면 fishbarGauge 배경으로 깔고,
  // 없으면 renderBarFrame이 매 프레임 진행도 색으로 칠한다. 이미지는
  // 한 번만 지정해두면 되니(색은 진행도가 바뀔 때마다 다시 칠해야 해서
  // 매 프레임 갱신) 여기 loadConfig에서 한 번만 적용한다.
  const gaugeImageAsset = design.gaugeImageAssetId ? byId.get(design.gaugeImageAssetId) : null;
  gaugeImageUrl = gaugeImageAsset ? (await preloadWithRetry(gaugeImageAsset.dataUrl, 3, 500)).url : null;
  el.fishbarGauge.style.backgroundImage = gaugeImageUrl ? `url(${gaugeImageUrl})` : 'none';

  // 캐스팅 게이지 이미지 — 이미지와 채움 영역(castGaugeFillRegion)이 둘 다
  // 있어야 커스텀 게이지를 켠다(하나만 있으면 기본 막대 게이지로 그대로
  // 폴백). 게이지 스테이지의 종횡비를 실제 업로드 이미지 크기에 맞춰야
  // fillRegion(이미지 자연 크기 대비 0~1)이 화면에서도 같은 자리를 가리킨다.
  const castGaugeAsset = cfg.castGaugeAssetId ? byId.get(cfg.castGaugeAssetId) : null;
  const castGaugeFillRegion = cfg.castGaugeFillRegion;
  if (castGaugeAsset && castGaugeFillRegion) {
    el.castPowerWrap.classList.add('custom-gauge');
    const gaugeUrl = (await preloadWithRetry(castGaugeAsset.dataUrl, 3, 500)).url;
    el.castPowerGaugeImg.src = gaugeUrl;
    const dims = await new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
      img.onerror = () => resolve(null);
      img.src = gaugeUrl;
    });
    if (dims) el.castPowerStage.style.setProperty('--gauge-ar', dims.w + '/' + dims.h);
    el.castPowerTrack.style.left = (castGaugeFillRegion.x * 100) + '%';
    el.castPowerTrack.style.top = (castGaugeFillRegion.y * 100) + '%';
    el.castPowerTrack.style.width = (castGaugeFillRegion.w * 100) + '%';
    el.castPowerTrack.style.height = (castGaugeFillRegion.h * 100) + '%';
  } else {
    el.castPowerWrap.classList.remove('custom-gauge');
    el.castPowerTrack.style.left = '';
    el.castPowerTrack.style.top = '';
    el.castPowerTrack.style.width = '';
    el.castPowerTrack.style.height = '';
  }

  const biteStampAsset = design.biteStampAssetId ? byId.get(design.biteStampAssetId) : null;
  biteStampImageUrl = biteStampAsset ? biteStampAsset.dataUrl : null;
  el.biteCaughtText.style.display = biteStampImageUrl ? 'none' : '';
  el.biteCaughtImg.style.display = biteStampImageUrl ? 'block' : 'none';
  if (biteStampImageUrl) el.biteCaughtImg.src = biteStampImageUrl;

  const initialIdlePose = idlePoseUrl();
  if (initialIdlePose) {
    el.charImg.src = initialIdlePose;
    el.charImg.classList.remove('hidden');
    el.charFallback.classList.add('hidden');
  }

  // 낚시 팝업 — 낚시 성공 후(물고기가 캐릭터에게 날아온 다음) 뜨는
  // 배경/아이콘 위치·크기. dev/minigame-fishing/index.html의 "낚시 팝업" 탭 설정.
  // 카드 종횡비(--item-ar)를 업로드한 배경 이미지의 실제 자연 크기로
  // 맞춰야 액자 그림이 잘리거나 늘어나지 않고 업로드한 그대로 보인다.
  const itemPopupBgAsset = itemPopupCfg.backgroundAssetId ? byId.get(itemPopupCfg.backgroundAssetId) : null;
  if (itemPopupBgAsset) {
    const itemBgUrl = (await preloadWithRetry(itemPopupBgAsset.dataUrl, 3, 500)).url;
    el.itemPopupCard.style.backgroundImage = `url(${itemBgUrl})`;
    el.itemPopupCard.classList.remove('item-popup-card--fallback');
    const itemBgDims = await new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
      img.onerror = () => resolve(null);
      img.src = itemBgUrl;
    });
    if (itemBgDims) el.itemPopupCard.style.setProperty('--item-ar', itemBgDims.w + '/' + itemBgDims.h);
  } else {
    el.itemPopupCard.style.backgroundImage = '';
    el.itemPopupCard.style.removeProperty('--item-ar');
    el.itemPopupCard.classList.add('item-popup-card--fallback');
  }
  itemIconPos = itemPopupCfg.iconPos || { x: 0.5, y: 0.36 };
  itemIconSizePx = itemPopupCfg.iconSizePx || 64;
  el.itemPopupIcon.style.left = (itemIconPos.x * 100) + '%';
  el.itemPopupIcon.style.top = (itemIconPos.y * 100) + '%';
  el.itemPopupIcon.style.width = itemIconSizePx + 'px';
  el.itemPopupIcon.style.height = itemIconSizePx + 'px';

  itemNamePos = itemPopupCfg.namePos || { x: 0.5, y: 0.66 };
  itemMetaPos = itemPopupCfg.metaPos || { x: 0.5, y: 0.8 };
  el.itemPopupName.style.left = (itemNamePos.x * 100) + '%';
  el.itemPopupName.style.top = (itemNamePos.y * 100) + '%';
  el.itemPopupName.style.fontSize = (itemPopupCfg.nameFontSizePx || 16) + 'px';
  el.itemPopupMeta.style.left = (itemMetaPos.x * 100) + '%';
  el.itemPopupMeta.style.top = (itemMetaPos.y * 100) + '%';
  el.itemPopupMeta.style.fontSize = (itemPopupCfg.metaFontSizePx || 12) + 'px';

  await setupStatusWindow(statusWindowCfg, byId);

  // 아이템창(물고기 팔기 카드) 배경 — dev/minigame-fishing/index.html의
  // "아이템창" 탭 설정. 비어있으면 기본 어두운 단색 카드 그대로 쓴다.
  const itemWindowBgAsset = cfg.itemWindowBackgroundAssetId ? byId.get(cfg.itemWindowBackgroundAssetId) : null;
  if (itemWindowBgAsset) {
    const itemWindowBgUrl = (await preloadWithRetry(itemWindowBgAsset.dataUrl, 3, 500)).url;
    el.sellFishCard.style.backgroundImage = `url(${itemWindowBgUrl})`;
    el.sellFishCard.classList.add('sell-fish-card--has-bg');
  } else {
    el.sellFishCard.style.backgroundImage = '';
    el.sellFishCard.classList.remove('sell-fish-card--has-bg');
  }

  preloadFishIcons();

  // 대화 인트로 — 대화창/지수/영우 중 하나라도 배치돼 있으면 idle로 바로
  // 들어가는 대신 이 장면부터 보여준다(설정한 게 하나도 없으면 기존처럼
  // 곧장 idle). renderDialogueIntro가 실제로 뭔가 그렸을 때만 gameState를
  // 바꿔야, 오래된(빈) 설정을 가진 세션에서 화면이 검게 가려진 채 아무
  // 반응도 없는 상태로 남는 일이 없다.
  if (renderDialogueIntro(dialogueSceneCfg, byId)) {
    gameState = 'dialogue';
  }

  await preloadAllAssetImages;
}

/* ===== 상태창 — 요일·날짜/시간/포인트/화살표.
   dev/minigame-fishing/index.html "상태창" 탭에서 올린 프레임 위에, 같은 탭
   레이아웃 편집기로 지정한 좌표(0~1, statusWindowCfg.datePos/timePos/
   pointsPos/arrowPivot)로 각 요소를 배치한다. 프레임을 안 올렸으면
   el.statusWindow를 통째로 숨긴다. 포인트는 숫자글꼴(0~9 낱개 이미지)로
   조립해 그리고, 숫자글꼴이 없는 자리는 그냥 빈칸으로 둔다(별도 폴백
   폰트를 섞으면 자릿수마다 크기가 달라져 더 어색해서). 화살표는 실제
   벽시계 시각을 0~24시 → 180°~360°로 선형 매핑해 회전한다(하루가 정확히
   반원 하나). 시각·포인트는 setInterval로 매분 갱신하고, 포인트는
   판매(confirmSellFish)처럼 즉시 바뀌는 지점에서도 refreshStatusWindowPoints를
   따로 불러 바로 반영한다. */
let statusWindowNumberFontUrls = {};
let statusWindowNumberFontAdjust = { width: 16, height: 22, gap: 2 };
let statusWindowUpdateTimer = null;
async function setupStatusWindow(cfg, byId) {
  clearInterval(statusWindowUpdateTimer);
  statusWindowUpdateTimer = null;
  const frameAsset = cfg.frameAssetId ? byId.get(cfg.frameAssetId) : null;
  if (!frameAsset) {
    el.statusWindow.classList.add('hidden');
    return;
  }
  const frameUrl = (await preloadWithRetry(frameAsset.dataUrl, 3, 500)).url;
  el.statusWindowFrameImg.src = frameUrl;
  const frameDims = await new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => resolve(null);
    img.src = frameUrl;
  });
  el.statusWindow.style.setProperty('--status-ar', frameDims ? (frameDims.w + '/' + frameDims.h) : '2/1');

  const arrowAsset = cfg.arrowAssetId ? byId.get(cfg.arrowAssetId) : null;
  if (arrowAsset) {
    el.statusWindowArrowImg.src = (await preloadWithRetry(arrowAsset.dataUrl, 3, 500)).url;
    el.statusWindowArrowImg.classList.remove('hidden');
    const pivot = cfg.arrowPivot || { x: 0.5, y: 0.85 };
    el.statusWindowArrowImg.style.left = (pivot.x * 100) + '%';
    el.statusWindowArrowImg.style.top = (pivot.y * 100) + '%';
  } else {
    el.statusWindowArrowImg.classList.add('hidden');
  }

  const datePos = cfg.datePos || { x: 0.28, y: 0.3 };
  const timePos = cfg.timePos || { x: 0.72, y: 0.3 };
  const pointsPos = cfg.pointsPos || { x: 0.5, y: 0.6 };
  el.statusWindowDate.style.left = (datePos.x * 100) + '%';
  el.statusWindowDate.style.top = (datePos.y * 100) + '%';
  el.statusWindowTime.style.left = (timePos.x * 100) + '%';
  el.statusWindowTime.style.top = (timePos.y * 100) + '%';
  el.statusWindowPoints.style.left = (pointsPos.x * 100) + '%';
  el.statusWindowPoints.style.top = (pointsPos.y * 100) + '%';

  statusWindowNumberFontAdjust = Object.assign({ width: 16, height: 22, gap: 2 }, cfg.numberFontAdjust || {});
  el.statusWindow.style.setProperty('--status-digit-gap', statusWindowNumberFontAdjust.gap + 'px');
  const numberFontAssetIds = cfg.numberFontAssetIds || {};
  const fontUrls = {};
  await Promise.all(Object.keys(numberFontAssetIds).map(async digit => {
    const asset = numberFontAssetIds[digit] ? byId.get(numberFontAssetIds[digit]) : null;
    if (asset) fontUrls[digit] = (await preloadWithRetry(asset.dataUrl, 3, 500)).url;
  }));
  statusWindowNumberFontUrls = fontUrls;

  el.statusWindow.classList.remove('hidden');
  updateStatusWindowClock();
  refreshStatusWindowPoints();
  statusWindowUpdateTimer = setInterval(updateStatusWindowClock, 15000);
}

const STATUS_WINDOW_WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
function updateStatusWindowClock() {
  if (el.statusWindow.classList.contains('hidden')) return;
  const now = new Date();
  el.statusWindowDate.textContent = STATUS_WINDOW_WEEKDAYS[now.getDay()] + '. ' + now.getDate();
  let hours = now.getHours();
  const ampm = hours < 12 ? '오전' : '오후';
  hours = hours % 12;
  if (hours === 0) hours = 12;
  const minutes = String(now.getMinutes()).padStart(2, '0');
  el.statusWindowTime.textContent = hours + ':' + minutes + ' ' + ampm;
  // 하루(0~24시)를 반원(180°~360°)에 선형 매핑 — 자정 180°(왼쪽 수평),
  // 정오 270°(위쪽), 다음날 자정 360°(오른쪽 수평).
  const hourFraction = now.getHours() + now.getMinutes() / 60;
  const deg = 180 + (hourFraction / 24) * 180;
  el.statusWindow.style.setProperty('--status-arrow-deg', deg + 'deg');
}
function refreshStatusWindowPoints() {
  if (el.statusWindow.classList.contains('hidden')) return;
  el.statusWindowPoints.innerHTML = '';
  String(EconomyState.getPoints()).split('').forEach(ch => {
    const url = statusWindowNumberFontUrls[ch];
    if (!url) return;
    const img = document.createElement('img');
    img.src = url;
    img.alt = ch;
    img.style.width = statusWindowNumberFontAdjust.width + 'px';
    img.style.height = statusWindowNumberFontAdjust.height + 'px';
    el.statusWindowPoints.appendChild(img);
  });
}

/* ===== 화면 적용 =====
   screenDef 하나(배경화면+낚시가능/이동불가/상호작용/이동 영역+영우 위치)를
   실제로 화면에 반영한다 — 배경화면 로드부터 카메라/worldSize 재계산,
   캐릭터 스폰 위치, 영우 NPC 배치까지 예전에 loadConfig()가 한 번만 하던
   일 그대로다. loadConfig()의 최초 로드(시작 화면)와, 이동 영역을 밟아
   화면을 건널 때(triggerScreenTransition, 도착 화면)가 이 함수 하나를
   공유한다. opts.entryPoint(0~1, 도착 화면 배경 원본 크기 기준 top-down
   정규화 좌표, 이동 영역의 entryPoint)가 있으면 그 지점에 캐릭터를
   스폰한다 — 없으면(최초 로드, 또는 배경 없는 화면) 예전처럼 화면
   정중앙에서 시작하거나(charWorldPos 최초 지정) 지금 위치를 새 범위로만
   clamp한다. */
async function applyScreen(screenDef, opts) {
  opts = opts || {};
  const backgroundAsset = (screenDef && screenDef.backgroundAssetId) ? await AssetDB.getAsset(screenDef.backgroundAssetId).catch(() => null) : null;
  if (backgroundAsset) await preloadWithRetry(backgroundAsset.dataUrl, 3, 500);
  // 배경 자연 크기 — "영역 설정" 탭에서 그린 다각형(fishableAreas/
  // blockedAreas/interactionAreas/moveAreas)이 이 크기 기준 0~1 정규화
  // 좌표라, 캐릭터/추 착수 지점과 비교하려면 필요하고(worldPosToImageFrac/
  // framePxToImageFrac 참고), 배경이 있을 땐 캐릭터가 돌아다닐 수 있는
  // 전체 범위(worldSize)로도 그대로 쓴다.
  bgDims = backgroundAsset ? await new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
    img.onerror = () => resolve(null);
    img.src = backgroundAsset.dataUrl;
  }) : null;
  fishableAreas = (screenDef && screenDef.fishableAreas) || [];
  blockedAreas = (screenDef && screenDef.blockedAreas) || [];
  interactionAreas = (screenDef && screenDef.interactionAreas) || [];
  moveAreas = (screenDef && screenDef.moveAreas) || [];

  hasWorldBackground = !!(backgroundAsset && bgDims);
  // 배경이 바뀔 때마다(재입장/화면 이동) 줌을 90% 배율로 되돌린다.
  bgZoom = 0.9;
  refreshFrameRect();
  worldSize = hasWorldBackground ? { w: bgDims.width, h: bgDims.height } : { w: frameRect.width, h: frameRect.height };
  if (hasWorldBackground) {
    // 카메라가 움직이는 정상 경로 — el.bgLayer에 원본 이미지를 원본 크기
    // 그대로 얹고, updateCamera는 이 레이어를 transform으로만 민다(el.frame
    // 자체는 CSS 기본 그라데이션을 그대로 유지 — 배경이 화면보다 작을 때
    // 가장자리에 비쳐 보인다).
    el.frame.style.backgroundImage = '';
    el.bgLayer.style.backgroundImage = `url(${backgroundAsset.dataUrl})`;
    el.bgLayer.style.backgroundRepeat = 'no-repeat';
    el.bgLayer.style.display = '';
    applyBgLayerSize();
  } else {
    // 배경이 없거나(그라데이션 폴백) 자연 크기를 못 읽은 예외 상황 —
    // 카메라가 움직일 수 없으므로 el.bgLayer는 꺼두고 예전처럼 el.frame에
    // auto+center로 정적으로 얹는다(카메라 계산 없이 최소한 보이게라도 함).
    el.bgLayer.style.backgroundImage = '';
    el.bgLayer.style.display = 'none';
    el.frame.style.backgroundImage = backgroundAsset ? `url(${backgroundAsset.dataUrl})` : '';
    el.frame.style.backgroundSize = 'auto';
    el.frame.style.backgroundPosition = 'center';
    el.frame.style.backgroundRepeat = backgroundAsset ? 'no-repeat' : '';
  }
  const wb = worldBounds();
  if (opts.entryPoint && hasWorldBackground) {
    // 이동 영역을 밟고 건너온 경우 — 도착 화면 위 지정된 지점(0~1)에서
    // 다시 시작한다(worldPosToImageFrac의 역변환과 같은 식).
    charWorldPos = {
      x: clamp(opts.entryPoint.x * bgDims.width, wb.minX, wb.maxX),
      y: clamp(bgDims.height * (1 - opts.entryPoint.y), wb.minY, wb.maxY),
    };
  } else if (!charWorldPos) {
    // 예전 CSS 기본값(화면 정중앙)과 같은 자리에서 시작하되, 새 범위(wb)
    // 안으로 clamp한다.
    charWorldPos = { x: clamp(worldSize.w / 2, wb.minX, wb.maxX), y: clamp(worldSize.h / 2, wb.minY, wb.maxY) };
  } else {
    charWorldPos.x = clamp(charWorldPos.x, wb.minX, wb.maxX);
    charWorldPos.y = clamp(charWorldPos.y, wb.minY, wb.maxY);
  }

  // 영우 NPC — youngwooNpcPos(배경 원본 크기 기준 0~1, top-down)를
  // charWorldPos와 같은 세계 좌표 형식(px, 왼쪽/아래 기준)으로 환산한다.
  // worldPosToImageFrac의 역변환(y = h*(1-frac.y))과 같은 식이다. 배경이
  // 없으면(hasWorldBackground false) 좌표계 기준이 없으니 NPC를 그리지
  // 않는다 — down 프레임이 없을 때도 마찬가지(영우는 항상 정면만 쓴다).
  const youngwooNpcPos = screenDef && screenDef.youngwooNpcPos;
  npcWorldPos = (hasWorldBackground && youngwooNpcPos) ? { x: youngwooNpcPos.x * bgDims.width, y: bgDims.height * (1 - youngwooNpcPos.y) } : null;
  if (npcWorldPos && youngwooIdleFrameUrls.down) {
    el.npcYoungwooImg.src = youngwooIdleFrameUrls.down;
    el.npcYoungwooStage.classList.remove('hidden');
  } else {
    el.npcYoungwooStage.classList.add('hidden');
  }

  updateCamera();
  // 화면이 바뀌면 이전 화면에서 뜨던 상호작용 배지를 그대로 이어받지
  // 않는다 — 최초 로드는 loadConfig().then(...)이 끝에서 한 번
  // checkInteractionArea()를 불러주므로 여기선 건너뛴다(중복 호출 방지).
  activeInteractionAreaId = null;
  el.interactionBadge.classList.add('hidden');
  if (!opts.isInitialLoad) checkInteractionArea();
}

/* ===== 화면 이동(moveAreas) 트랜지션 =====
   캐릭터가 이동 영역(moveArea)에 걸어 들어가면(checkMoveArea, moveTick에서
   매 프레임 호출) 도착 화면으로 건너간다. "어두워졌다가 로딩 다 되면
   밝아짐"은 이미 낚시 진입 자체(#preloadOverlay/revealGame)에 있던 연출을
   그대로 재사용한다 — fade-out 클래스를 떼면 불투명(검정)으로, 다시 붙이면
   투명으로 CSS 트랜지션(.9s)이 자연히 오간다. 어두운 동안 조이스틱을
   막아야 하므로(screenTransitioning), stopMoveHold로 지금 하던 이동부터
   끊는다 — moveTick은 moveHoldVec이 비면 그 프레임에서 스스로 멈춘다. */
function screenById(id) { return screensList.find(s => s.id === id) || null; }
async function triggerScreenTransition(moveArea) {
  if (screenTransitioning) return;
  const targetDef = screenById(moveArea.targetScreenId);
  if (!targetDef) return;
  screenTransitioning = true;
  stopMoveHold();
  el.preloadOverlay.classList.remove('hidden');
  void el.preloadOverlay.offsetWidth; // display:none -> block 직후 곧바로 opacity를 바꾸면 트랜지션이 안 먹을 수 있어 강제로 리플로우 한 번 끼운다
  await new Promise(resolve => {
    el.preloadOverlay.addEventListener('transitionend', resolve, { once: true });
    el.preloadOverlay.classList.remove('fade-out'); // opacity 0 -> 1, 어두워짐
  });
  currentScreenId = targetDef.id;
  await applyScreen(targetDef, { entryPoint: moveArea.entryPoint });
  await new Promise(resolve => {
    el.preloadOverlay.addEventListener('transitionend', resolve, { once: true });
    el.preloadOverlay.classList.add('fade-out'); // opacity 1 -> 0, 밝아짐
  });
  el.preloadOverlay.classList.add('hidden'); // revealGame()과 같은 마무리 — 트랜지션 끝나면 완전히 빼서 다시 그릴 일이 없게 한다
  screenTransitioning = false;
}
// moveTick(캐릭터가 이동 중일 때 매 프레임)에서 checkInteractionArea와
// 나란히 부른다 — 캐릭터가 이동 영역 다각형 안에 들어온 순간 트랜지션을
// 튕긴다(triggerScreenTransition 자체 가드가 있어 여러 번 겹쳐 불려도
// 안전하다).
function checkMoveArea() {
  if (screenTransitioning || !moveAreas.length) return;
  const area = areaContaining(worldPosToImageFrac(charWorldPos.x, charWorldPos.y), moveAreas);
  if (area) triggerScreenTransition(area);
}

// 프리로드 오버레이(#preloadOverlay, 정적 마크업이라 첫 페인트부터 검다)를
// 서서히 걷어낸다 — loadConfig()가 이미지 자산을 전부 디코드하고 나서만
// 호출된다. transitionend에서 .hidden을 붙여 트랜지션이 끝난 뒤엔 완전히
// 빼서(레이아웃/페인트에서 제외) 다시 그릴 일이 없게 한다.
let gameRevealed = false;
function revealGame() {
  if (gameRevealed) return;
  gameRevealed = true;
  el.preloadOverlay.classList.add('fade-out');
  el.preloadOverlay.addEventListener('transitionend', () => {
    el.preloadOverlay.classList.add('hidden');
  }, { once: true });
}
// 대사가 여러 줄(지수/영우 번갈아 말하는 티키타카, dev/minigame-fishing/
// index.html "대화" 탭에서 편집)이라 화면을 탭할 때마다 다음 줄로 넘어가야
// 한다 — 대화창/지수/영우 이미지(DIALOGUE_INTRO_IMAGE_LAYERS)는 줄이
// 바뀌어도 그대로 두고, 초상화/이름/대사(그 줄의 speaker/text에 따라
// 달라지는 부분)만 다시 그린다. dialogueIntro*는 그 진행 상태를 들고
// 있는 모듈 전역 — 씬 진입마다 renderDialogueIntro가 새로 채운다.
let dialogueIntroScene = null;
let dialogueIntroById = null;
let dialogueIntroLines = [];
let dialogueIntroIndex = 0;
// 대사가 한 글자씩 타이핑되어 나오는 연출 — vnPlayer.js의 typeText와 같은
// 방식(setInterval로 slice 늘려가며 채움). 탭이 타이핑 도중 들어오면(아래
// pointerdown 핸들러) 다음 줄로 넘기는 대신 그 자리에서 바로 완성한다.
const DIALOGUE_INTRO_TYPING_MS = 40;
let dialogueIntroTypingTimer = null;
let dialogueIntroTypingEl = null;
let dialogueIntroFullText = '';
function typeDialogueIntroText(textEl, text) {
  clearInterval(dialogueIntroTypingTimer);
  dialogueIntroTypingEl = textEl;
  dialogueIntroFullText = text;
  textEl.textContent = '';
  if (!text) { dialogueIntroTypingTimer = null; return; }
  let i = 0;
  dialogueIntroTypingTimer = setInterval(() => {
    i++;
    textEl.textContent = text.slice(0, i);
    if (i >= text.length) {
      clearInterval(dialogueIntroTypingTimer);
      dialogueIntroTypingTimer = null;
    }
  }, DIALOGUE_INTRO_TYPING_MS);
}
function renderDialogueIntroFrame() {
  const dialogueScene = dialogueIntroScene, byId = dialogueIntroById;
  const line = dialogueIntroLines[dialogueIntroIndex] || null;
  const speaker = line && line.speaker === 'youngwoo' ? 'youngwoo' : 'jisoo';
  el.dialogueIntro.innerHTML = '';
  DIALOGUE_INTRO_LAYERS.forEach(key => {
    const data = dialogueScene[key];
    if (!data) return;
    const layerEl = document.createElement('div');
    layerEl.className = 'dialogue-intro-layer';
    layerEl.style.left = (data.x * 100) + '%';
    layerEl.style.top = (data.y * 100) + '%';
    layerEl.style.width = (data.w * 100) + '%';
    layerEl.style.height = (data.h * 100) + '%';
    if (key === 'nameLayer') {
      const nameEl = document.createElement('div');
      nameEl.className = 'dialogue-intro-name';
      nameEl.textContent = speaker === 'youngwoo' ? '영우' : '지수';
      layerEl.appendChild(nameEl);
      el.dialogueIntro.appendChild(layerEl);
      return;
    }
    if (key === 'textLayer') {
      const textEl = document.createElement('div');
      textEl.className = 'dialogue-intro-text';
      layerEl.appendChild(textEl);
      el.dialogueIntro.appendChild(layerEl);
      typeDialogueIntroText(textEl, (line && line.text) || '');
      return;
    }
    if (key === 'portraitLayer') {
      layerEl.classList.add('dialogue-portrait-layer');
      const portraitAssetId = speaker === 'youngwoo' ? dialogueScene.youngwooPortraitAssetId : dialogueScene.jisooPortraitAssetId;
      const portraitAsset = portraitAssetId ? byId.get(portraitAssetId) : null;
      if (portraitAsset) {
        const img = document.createElement('img');
        img.src = portraitAsset.dataUrl;
        img.alt = '';
        layerEl.appendChild(img);
      }
      el.dialogueIntro.appendChild(layerEl);
      return;
    }
    const asset = data.assetId ? byId.get(data.assetId) : null;
    if (asset) {
      const img = document.createElement('img');
      img.src = asset.dataUrl;
      img.alt = '';
      layerEl.appendChild(img);
    }
    el.dialogueIntro.appendChild(layerEl);
  });
}
function renderDialogueIntro(dialogueScene, byId) {
  const hasAnyLayer = DIALOGUE_INTRO_LAYERS.some(key => dialogueScene[key]);
  if (!hasAnyLayer) {
    clearInterval(dialogueIntroTypingTimer);
    dialogueIntroTypingTimer = null;
    el.dialogueIntro.innerHTML = '';
    el.dialogueIntro.classList.add('hidden');
    return false;
  }
  dialogueIntroScene = dialogueScene;
  dialogueIntroById = byId;
  dialogueIntroLines = fishingDialogueLines(dialogueScene);
  dialogueIntroIndex = 0;
  renderDialogueIntroFrame();
  el.dialogueIntro.classList.remove('hidden');
  return true;
}
el.dialogueIntro.addEventListener('pointerdown', (e) => {
  if (gameState !== 'dialogue') return;
  e.stopPropagation();
  if (dialogueIntroTypingTimer) {
    clearInterval(dialogueIntroTypingTimer);
    dialogueIntroTypingTimer = null;
    if (dialogueIntroTypingEl) dialogueIntroTypingEl.textContent = dialogueIntroFullText;
    return;
  }
  dialogueIntroIndex += 1;
  if (dialogueIntroIndex < dialogueIntroLines.length) {
    renderDialogueIntroFrame();
    return;
  }
  el.dialogueIntro.classList.add('hidden');
  gameState = 'idle';
});

// 잡은 물고기 아이콘(overlayFishIcon)은 endRun에서 처음 그 fishId의
// background-position으로 그릴 때가 돼서야 브라우저가 그 위치를 실제로
// 디코드/페인트한다 — 시트 자체는 미리 받아놨어도(fishSheetDims 계산용
// new Image()) 첫 catch 때 화면에 "뜨는" 순간 눈에 띄게 느렸다(사용자 보고).
// 그래서 게임이 시작하기 전, 보이지 않는 곳에 67종 전부를 실제로 한 번씩
// 그려서 워밍업해둔다 — display:none은 브라우저가 페인트를 건너뛰어 워밍업
// 효과가 없으므로, 화면 밖(-9999px)에 두되 레이아웃/페인트는 정상적으로
// 일어나게 한다.
function preloadFishIcons() {
  if (!fishSheetUrl) return;
  let host = document.getElementById('fishIconPreload');
  if (!host) {
    host = document.createElement('div');
    host.id = 'fishIconPreload';
    host.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:0;height:0;overflow:hidden;pointer-events:none';
    host.setAttribute('aria-hidden', 'true');
    document.body.appendChild(host);
  }
  host.innerHTML = '';
  Object.values(fishDefs).forEach(fishDef => {
    const override = fishIconOverrides[fishDef.id];
    const style = (override && fishSheetDims)
      ? getFishCropStyle(override, fishSheetDims.width, fishSheetDims.height, 56)
      : getFishSlotStyle(fishDef.slot, 3.5);
    const div = document.createElement('div');
    div.style.cssText = `width:56px;height:56px;background-image:url('${fishSheetUrl}');background-position:${style.backgroundPosition};background-size:${style.backgroundSize};background-repeat:no-repeat`;
    host.appendChild(div);
  });
}

/* ===== 캐스팅/올리기 프레임 순차 재생 =====
   frameMs는 고정 ms 숫자(올리기) 또는 프레임별 ms 배열(캐스팅,
   castFrameDurations — 설정 화면 재생 타임라인에서 조정한 값)을 받는다.
   onFrame(i)는 선택 — 캐스팅 던지기(throwSinker 이전, releasePowerAndCast)만
   써서, 애니메이션이 진행되는 동안에도 매 프레임 낚싯대 끝 위치가 바뀌는
   대로 낚싯줄(현수선)을 다시 그린다. */
function playFrameSequence(urls, frameMs, onFrame) {
  return new Promise(resolve => {
    if (!urls.length) { resolve(); return; }
    el.charImg.classList.remove('hidden');
    el.charFallback.classList.add('hidden');
    let i = 0;
    function showAndScheduleNext() {
      el.charImg.src = urls[i];
      if (onFrame) onFrame(i);
      const ms = Array.isArray(frameMs) ? (frameMs[i] || 90) : frameMs;
      i++;
      setTimeout(i >= urls.length ? resolve : showAndScheduleNext, ms);
    }
    showAndScheduleNext();
  });
}

/* ===== 잡아채기(낚시바) 중 낚싯대 홀드/릴리즈 모션 =====
   캐치바를 올리는 낚시 버튼을 누르고 있는 동안 2번→4번(index 1→3)
   프레임을 순서대로 재생하고 4번에서 멈춰 유지한다. 손을 떼면 그 자리에서
   4번→2번→1번(index 3→1→0) 순서로 되감아 1번(대기 포즈)에서 멈춘다 —
   handleActionPointerDown/Release가 gameState==='catching'일 때 호출한다.
   재생 속도(프레임 간 간격)는 설정 화면 "낚시대 재생속도"(reelMotion.
   holdFrameMs)를 따른다. */
const REEL_HOLD_UP_SEQ = [1, 2, 3];
const REEL_HOLD_DOWN_SEQ = [3, 1, 0];
let reelHoldTimer = null;
// 잡아채기(낚시바) 중 낚싯줄의 추 쪽 고정 좌표 — 입질이 문 지점(추가 물에
// 떠 있던 el.bobber의 마지막 위치, startCatching이 기록)이다. 캐치바를
// 올리든 내리든 이 지점은 안 움직이고, 낚싯대 쪽 끝(reelTipPxForFrame)만
// 지금 재생 중인 올리기 프레임(currentReelFrameIndex)을 따라 움직인다.
let catchingBitePt = null;
let currentReelFrameIndex = 0;
