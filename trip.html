<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>시드니 여행</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E8741E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="시드니 여행">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#E8741E;--primary-hover:#D4681A;--primary-light:#FFF3EB;
  --bg:#F5F5F5;--white:#FFFFFF;
  --grey100:#F2F4F6;--grey300:#D1D6DB;--grey500:#8B95A1;--grey700:#4E5968;--black:#191F28;
}
html,body{height:100%}
body{background:var(--bg);color:var(--black);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:500px;min-height:100vh;padding:16px}
.hl{color:var(--primary)}

.pg-hdr{padding:28px 4px 20px}
.pg-title{font-size:28px;font-weight:800;letter-spacing:-.3px}
.pg-sub{font-size:14px;color:var(--grey500);font-weight:500;margin-top:8px;line-height:1.6}
.dday{display:inline-flex;align-items:center;gap:6px;background:var(--primary-light);color:var(--primary);font-size:13px;font-weight:700;padding:6px 14px;border-radius:20px;margin-top:14px}

.nav-list{display:flex;flex-direction:column;gap:14px}
.nav-card{position:relative;display:block;height:150px;border-radius:24px;overflow:hidden;background:var(--grey100) center/cover no-repeat;text-decoration:none;box-shadow:0 2px 12px rgba(0,0,0,0.06);transition:transform .15s}
.nav-card:active{transform:scale(.98)}
.nav-card::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.15) 40%, rgba(0,0,0,.75) 100%)}
.nav-body{position:absolute;left:20px;right:20px;bottom:18px;z-index:1;color:#fff}
.nav-emoji{font-size:22px;margin-bottom:4px;display:block}
.nav-name{font-size:18px;font-weight:800}
.nav-desc{font-size:12.5px;color:rgba(255,255,255,.85);font-weight:500;margin-top:4px;line-height:1.5}

.pg-ftr{text-align:center;font-size:12px;color:var(--grey500);padding:28px 0 12px}
</style>
</head>
<body>
<div class="app">
  <div class="pg-hdr">
    <div class="pg-title">우리의 <span class="hl">시드니</span> 여행</div>
    <div class="pg-sub">2026.7.22 - 8.17, 출발 전 준비부터 일정까지</div>
    <div class="dday" id="ddayBadge">D-day 계산 중...</div>
  </div>

  <div class="nav-list">
    <a class="nav-card" href="pack.html" style="background-image:url('https://images.pexels.com/photos/9186152/pexels-photo-9186152.jpeg?auto=compress&cs=tinysrgb&w=800&h=500&fit=crop')">
      <div class="nav-body">
        <span class="nav-emoji">🧳</span>
        <div class="nav-name">짐싸기</div>
        <div class="nav-desc">출국 전에 챙겨야 할 것들 체크리스트</div>
      </div>
    </a>

    <a class="nav-card" href="arrival.html" style="background-image:url('https://images.pexels.com/photos/20139504/pexels-photo-20139504.jpeg?auto=compress&cs=tinysrgb&w=800&h=500&fit=crop')">
      <div class="nav-body">
        <span class="nav-emoji">🛬</span>
        <div class="nav-name">입국준비</div>
        <div class="nav-desc">비자·입국신고서·세관까지 미리 알아두기</div>
      </div>
    </a>

    <a class="nav-card" href="schedule.html" style="background-image:url('https://images.pexels.com/photos/4062614/pexels-photo-4062614.jpeg?auto=compress&cs=tinysrgb&w=800&h=500&fit=crop')">
      <div class="nav-body">
        <span class="nav-emoji">🗓️</span>
        <div class="nav-name">여행</div>
        <div class="nav-desc">주차별 일정과 갈 곳을 계획해요</div>
      </div>
    </a>

    <a class="nav-card" href="secret.html" style="background-image:url('https://images.pexels.com/photos/15225161/pexels-photo-15225161.jpeg?auto=compress&cs=tinysrgb&w=800&h=500&fit=crop')">
      <div class="nav-body">
        <span class="nav-emoji">🔒</span>
        <div class="nav-name">???</div>
        <div class="nav-desc">궁금하지? 비밀이야</div>
      </div>
    </a>
  </div>

  <div class="pg-ftr">우리의 시드니 여행</div>
</div>
<script>
const TRIP_START=new Date(2026,6,22);
function updateDday(){
  const today=new Date();
  today.setHours(0,0,0,0);
  const diff=Math.round((TRIP_START-today)/86400000);
  const el=document.getElementById('ddayBadge');
  if(diff>0) el.textContent=`✈️ 출발까지 D-${diff}`;
  else if(diff===0) el.textContent='✈️ 오늘 출발!';
  else el.textContent=`✈️ 여행 시작 ${Math.abs(diff)}일째`;
}
updateDday();
</script>
</body>
</html>
