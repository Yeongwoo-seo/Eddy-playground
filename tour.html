<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>나의 시드니 여행 유형 테스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#E8741E;--primary-hover:#D4681A;--primary-light:#FFF3EB;
  --white:#FFFFFF;--bg:#F5F5F5;
  --grey-50:#FAFAFA;--grey-100:#F2F4F6;--grey-200:#E5E8EB;--grey-300:#D1D6DB;
  --grey-500:#8B95A1;--grey-700:#4E5968;--black:#191F28;
  --green:#1DB847;--blue:#3182F6;
}
body{background:var(--bg);color:var(--black);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;overflow-x:hidden;display:flex;justify-content:center}
.app{width:100%;max-width:500px;min-height:100vh;position:relative;overflow:hidden}

.screen{display:none;min-height:100vh;flex-direction:column;animation:slideUp .5s cubic-bezier(.2,.8,.2,1)}
.screen.active{display:flex}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes floatEmoji{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes barGrow{from{width:0}to{width:var(--target)}}

/* INTRO */
.intro{align-items:center;justify-content:center;padding:48px 24px;text-align:center;background:var(--white)}
.intro-badge{display:inline-block;background:var(--primary-light);color:var(--primary);font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;margin-bottom:28px}
.intro-icon{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#E8741E 0%,#F5943A 100%);display:flex;align-items:center;justify-content:center;font-size:56px;margin:0 auto 32px;box-shadow:0 12px 40px rgba(232,116,30,.3);animation:floatEmoji 3s ease-in-out infinite}
.intro h1{font-size:26px;font-weight:800;line-height:1.4;margin-bottom:8px;color:var(--black)}
.intro h1 .hl{color:var(--primary)}
.intro p{font-size:14px;color:var(--grey-500);line-height:1.7;margin-bottom:40px}
.intro-info{display:flex;gap:16px;margin-bottom:40px}
.intro-chip{background:var(--grey-100);border-radius:12px;padding:10px 16px;font-size:13px;font-weight:600;color:var(--grey-700)}
.start-btn{width:100%;padding:18px;background:linear-gradient(135deg,#E8741E,#F5943A);color:var(--white);border:none;border-radius:16px;font-size:17px;font-weight:700;cursor:pointer;font-family:'Pretendard',sans-serif;box-shadow:0 4px 16px rgba(232,116,30,.3);transition:transform .1s}
.start-btn:active{transform:scale(.97)}
.intro-sub{font-size:12px;color:var(--grey-500);margin-top:20px}

/* QUESTION */
.q-screen{background:var(--white)}
.q-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0}
.back-btn{background:none;border:none;color:var(--grey-500);font-size:14px;cursor:pointer;font-family:'Pretendard',sans-serif;padding:8px 0;font-weight:600}
.counter{color:var(--grey-500);font-size:13px;font-weight:600}
.prog-wrap{height:4px;background:var(--grey-100);margin:16px 24px 0;border-radius:4px;overflow:hidden}
.prog-bar{height:100%;background:linear-gradient(90deg,#E8741E,#F5943A);border-radius:4px;transition:width .4s ease}
.q-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px 40px}
.q-num{font-size:12px;color:var(--primary);font-weight:700;letter-spacing:1.5px;margin-bottom:12px}
.q-scene{font-size:13px;color:var(--grey-700);line-height:1.7;padding:14px 16px;background:var(--grey-50);border:1px solid var(--grey-200);border-radius:16px;margin-bottom:20px}
.q-text{font-size:20px;font-weight:700;line-height:1.45;margin-bottom:32px;color:var(--black)}
.ans-list{display:flex;flex-direction:column;gap:10px}
.ans-btn{background:var(--white);border:1.5px solid var(--grey-200);border-radius:16px;padding:16px 18px;color:var(--black);font-size:15px;font-weight:500;text-align:left;cursor:pointer;font-family:'Pretendard',sans-serif;display:flex;align-items:center;gap:12px;transition:all .15s}
.ans-btn:active{background:var(--primary-light);border-color:var(--primary);transform:scale(.98)}
.ans-em{font-size:22px;flex-shrink:0}

/* LOADING */
.loading{align-items:center;justify-content:center;padding:40px 24px;text-align:center;background:var(--white)}
.spin-wrap{width:80px;height:80px;margin:0 auto 32px;position:relative}
.spin-circle{width:100%;height:100%;border:4px solid var(--grey-100);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px}
.loading h2{font-size:22px;font-weight:800;margin-bottom:8px}
.loading p{font-size:14px;color:var(--grey-500);line-height:1.6}

/* RESULT */
#result-screen{display:none;background:var(--bg)}
#result-screen.active{display:block}

.result-hero{background:var(--white);padding:48px 24px 40px;text-align:center;border-radius:0 0 28px 28px;box-shadow:0 2px 12px rgba(0,0,0,.06);animation:slideUp .6s cubic-bezier(.2,.8,.2,1)}
.type-code{display:inline-block;background:var(--primary-light);color:var(--primary);font-size:12px;font-weight:800;padding:6px 14px;border-radius:20px;letter-spacing:2px;margin-bottom:20px}
.type-emoji-big{font-size:80px;margin-bottom:16px;display:block;animation:floatEmoji 3s ease-in-out infinite}
.type-name{font-size:28px;font-weight:900;line-height:1.3;margin-bottom:8px;color:var(--black)}
.type-tagline{font-size:14px;color:var(--grey-500);line-height:1.7;margin-bottom:28px}

.axis-bars{padding:0 20px}
.axis-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.axis-label{font-size:12px;font-weight:700;width:32px;text-align:right;flex-shrink:0}
.axis-label.active{color:var(--primary)}
.axis-label.inactive{color:var(--grey-300)}
.axis-track{flex:1;height:8px;background:var(--grey-100);border-radius:8px;overflow:hidden}
.axis-fill{height:100%;background:linear-gradient(90deg,#E8741E,#F5943A);border-radius:8px;transition:width 1s ease .3s}

.result-section{padding:24px;animation:slideUp .6s cubic-bezier(.2,.8,.2,1)}
.result-card{background:var(--white);border-radius:24px;padding:24px 20px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:16px}
.sec-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);display:inline-block;margin-right:8px}
.sec-title{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:16px}
.desc-text{font-size:15px;font-weight:500;color:var(--black);line-height:1.8}
.pref-list{display:flex;flex-direction:column;gap:10px}
.pref-item{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.6;color:var(--grey-700)}
.pref-icon{font-size:18px;flex-shrink:0;margin-top:1px}

.next-btn{width:calc(100% - 48px);margin:0 24px 32px;padding:18px;background:linear-gradient(135deg,#E8741E,#F5943A);color:var(--white);border:none;border-radius:16px;font-size:17px;font-weight:700;cursor:pointer;font-family:'Pretendard',sans-serif;box-shadow:0 4px 16px rgba(232,116,30,.3);transition:transform .1s}
.next-btn:active{transform:scale(.97)}

/* ITINERARY */
#iti-screen{display:none;background:var(--bg)}
#iti-screen.active{display:block}

.iti-header{background:var(--white);padding:20px 24px;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--grey-100)}
.iti-back{background:none;border:none;font-size:14px;color:var(--grey-500);cursor:pointer;font-family:'Pretendard',sans-serif;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:4px}
.iti-title{font-size:22px;font-weight:800;color:var(--black);margin-bottom:16px}
.day-tabs{display:flex;gap:8px}
.day-tab{padding:10px 20px;border:none;border-radius:12px;background:var(--grey-100);font-size:14px;font-weight:600;color:var(--grey-500);cursor:pointer;font-family:'Pretendard',sans-serif;transition:all .2s}
.day-tab.active{background:var(--primary);color:var(--white);box-shadow:0 2px 8px rgba(232,116,30,.3)}

.iti-content{padding:24px}
.day-panel{display:none;animation:slideUp .4s cubic-bezier(.2,.8,.2,1)}
.day-panel.active{display:block}
.day-title-card{background:linear-gradient(135deg,#E8741E,#F5943A);border-radius:20px;padding:20px;color:var(--white);margin-bottom:20px}
.day-title-card h3{font-size:18px;font-weight:800;margin-bottom:4px}
.day-title-card p{font-size:13px;opacity:.85}

.tl-item{display:flex;gap:14px;margin-bottom:4px;position:relative}
.tl-item:not(:last-child){padding-bottom:16px}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:23px;top:48px;bottom:0;width:2px;background:var(--grey-200)}
.tl-time-col{width:48px;flex-shrink:0;padding-top:14px}
.tl-time{font-size:12px;font-weight:700;color:var(--primary)}
.tl-card{flex:1;background:var(--white);border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.04);border:1px solid var(--grey-100)}
.tl-icon{font-size:24px;margin-bottom:6px}
.tl-place{font-size:15px;font-weight:700;color:var(--black);margin-bottom:4px}
.tl-desc{font-size:13px;color:var(--grey-500);line-height:1.6}
.tl-must{display:inline-block;background:var(--primary-light);color:var(--primary);font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;margin-top:6px}

.share-bar{padding:24px;padding-bottom:48px}
.share-btn{width:100%;padding:18px;background:var(--white);color:var(--primary);border:2px solid var(--primary);border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Pretendard',sans-serif;transition:all .15s}
.share-btn:active{background:var(--primary-light);transform:scale(.97)}

.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--black);color:var(--white);padding:14px 24px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">

<div class="toast" id="toast">링크가 복사되었어요</div>

<!-- INTRO -->
<div class="screen intro active" id="screen-intro">
  <div class="intro-badge">SYDNEY TRAVEL MBTI</div>
  <div class="intro-icon">✈️</div>
  <h1>나는 어떤<br><span class="hl">시드니 여행자</span>일까?</h1>
  <p>10가지 시드니 상황 속에서<br>나만의 여행 유형을 찾아보세요</p>
  <div class="intro-info">
    <div class="intro-chip">10문항</div>
    <div class="intro-chip">4축 분석</div>
    <div class="intro-chip">16유형</div>
  </div>
  <button class="start-btn" onclick="startTest()">테스트 시작하기</button>
  <span class="intro-sub">소요 시간 약 2분</span>
</div>

<!-- QUESTION -->
<div class="screen q-screen" id="screen-question">
  <div class="q-header">
    <button class="back-btn" onclick="prevQ()">← 뒤로</button>
    <span class="counter" id="counter">1 / 10</span>
  </div>
  <div class="prog-wrap"><div class="prog-bar" id="prog" style="width:10%"></div></div>
  <div class="q-body">
    <div class="q-num" id="q-num">Q.01</div>
    <div class="q-scene" id="q-scene"></div>
    <div class="q-text" id="q-text"></div>
    <div class="ans-list" id="ans-list"></div>
  </div>
</div>

<!-- LOADING -->
<div class="screen loading" id="screen-loading">
  <div class="spin-wrap"><div class="spin-circle"></div><div class="spin-emoji">🔍</div></div>
  <h2>유형 분석 중...</h2>
  <p>4가지 축으로<br>나만의 여행 유형을 찾고 있어요</p>
</div>

<!-- RESULT -->
<div id="result-screen">
  <div class="result-hero">
    <div class="type-code" id="r-code">ENJA</div>
    <span class="type-emoji-big" id="r-emoji"></span>
    <div class="type-name" id="r-name"></div>
    <div class="type-tagline" id="r-tagline"></div>
    <div class="axis-bars" id="axis-bars"></div>
  </div>
  <div class="result-section">
    <div class="result-card">
      <div class="sec-title"><span class="sec-dot"></span>나의 여행 성향</div>
      <div class="desc-text" id="r-desc"></div>
    </div>
    <div class="result-card">
      <div class="sec-title"><span class="sec-dot"></span>여행할 때 이런 걸 선호해요</div>
      <div class="pref-list" id="r-prefs"></div>
    </div>
  </div>
  <button class="next-btn" onclick="showItinerary()">추천 일정 보기 →</button>
</div>

<!-- ITINERARY -->
<div id="iti-screen">
  <div class="iti-header">
    <button class="iti-back" onclick="backToResult()">← 결과로 돌아가기</button>
    <div class="iti-title">추천 3일 일정</div>
    <div class="day-tabs" id="day-tabs"></div>
  </div>
  <div class="iti-content" id="iti-content"></div>
  <div class="share-bar">
    <button class="share-btn" onclick="shareResult()">결과 공유하기</button>
  </div>
</div>

</div>

// ─── STATE ───────────────────────────────────────────────────────
let current = 0;
let answers = []; // [{E,N,J,A}, ...]
let resultCode = '';
let resultScores = {E:0,N:0,J:0,A:0};

// ─── SCREENS ─────────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
  ['result-screen','iti-screen'].forEach(rid => document.getElementById(rid).classList.remove('active'));
  window.scrollTo(0,0);
}

function startTest() {
  current = 0;
  answers = [];
  show('screen-question');
  renderQ();
}

function renderQ() {
  const q = Qs[current];
  const num = current + 1;
  document.getElementById('counter').textContent = `${num} / 10`;
  document.getElementById('q-num').textContent = `Q.${String(num).padStart(2,'0')}`;
  document.getElementById('q-scene').textContent = q.scene;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('prog').style.width = `${num * 10}%`;
  document.getElementById('ans-list').innerHTML = q.opts.map((o,i) =>
    `<button class="ans-btn" onclick="answer(${i})"><span class="ans-em">${o.e}</span><span>${o.t}</span></button>`
  ).join('');
}

function answer(idx) {
  const s = Qs[current].opts[idx].s;
  answers.push({E:s[0],N:s[1],J:s[2],A:s[3]});
  if (current < 9) { current++; renderQ(); }
  else finishTest();
}

function prevQ() {
  if (current === 0) { show('screen-intro'); return; }
  answers.pop();
  current--;
  renderQ();
}

function finishTest() {
  show('screen-loading');
  const totals = {E:0,N:0,J:0,A:0};
  answers.forEach(a => { totals.E+=a.E; totals.N+=a.N; totals.J+=a.J; totals.A+=a.A; });
  resultScores = totals;
  setTimeout(() => buildResult(totals), 2200);
}

function buildResult(s) {
  const maxE=21,maxN=20,maxJ=19,maxA=18;
  const code =
    (s.E >= maxE*0.45 ? 'E':'I') +
    (s.N >= maxN*0.45 ? 'N':'C') +
    (s.J >= maxJ*0.45 ? 'J':'P') +
    (s.A >= maxA*0.45 ? 'A':'R');

  resultCode = code;
  const t = TYPES[code];

  document.getElementById('r-code').textContent = code;
  document.getElementById('r-emoji').textContent = t.emoji;
  document.getElementById('r-name').textContent = t.name;
  document.getElementById('r-tagline').textContent = t.tagline;
  document.getElementById('r-desc').textContent = t.desc;

  document.getElementById('r-prefs').innerHTML = t.prefs.map(p => {
    const icon = p.substring(0,2);
    const text = p.substring(3);
    return `<div class="pref-item"><span class="pref-icon">${icon}</span><span>${text}</span></div>`;
  }).join('');

  const axes = [
    {left:'탐험',right:'감성',val:s.E,max:maxE},
    {left:'자연',right:'도시',val:s.N,max:maxN},
    {left:'계획',right:'즉흥',val:s.J,max:maxJ},
    {left:'모험',right:'안정',val:s.A,max:maxA}
  ];
  document.getElementById('axis-bars').innerHTML = axes.map(a => {
    const pct = Math.round((a.val/a.max)*100);
    const leftActive = pct >= 45;
    return `<div class="axis-row">
      <span class="axis-label ${leftActive?'active':'inactive'}">${a.left}</span>
      <div class="axis-track"><div class="axis-fill" style="width:0%;--target:${pct}%"></div></div>
      <span class="axis-label ${!leftActive?'active':'inactive'}">${a.right}</span>
    </div>`;
  }).join('');

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('result-screen').classList.add('active');
  document.getElementById('iti-screen').classList.remove('active');
  window.scrollTo(0,0);

  setTimeout(() => {
    document.querySelectorAll('.axis-fill').forEach(el => {
      el.style.width = getComputedStyle(el).getPropertyValue('--target');
    });
  }, 400);

  history.replaceState(null,'',`#t=${code}&e=${s.E}&n=${s.N}&j=${s.J}&a=${s.A}`);
}

// ─── ITINERARY ───────────────────────────────────────────────────
let currentDay = 0;
let itiData = [];

function showItinerary() {
  itiData = generateItinerary(resultCode);
  currentDay = 0;

  document.getElementById('day-tabs').innerHTML = itiData.map((d,i) =>
    `<button class="day-tab ${i===0?'active':''}" onclick="switchDay(${i})">Day ${i+1}</button>`
  ).join('');

  renderDay(0);

  document.getElementById('result-screen').classList.remove('active');
  document.getElementById('iti-screen').classList.add('active');
  window.scrollTo(0,0);
}

function switchDay(idx) {
  currentDay = idx;
  document.querySelectorAll('.day-tab').forEach((t,i) => t.classList.toggle('active',i===idx));
  renderDay(idx);
}

function renderDay(idx) {
  const day = itiData[idx];
  document.getElementById('iti-content').innerHTML = `
    <div class="day-panel active">
      <div class="day-title-card">
        <h3>${day.icon} ${day.title}</h3>
        <p>${day.subtitle}</p>
      </div>
      ${day.items.map(item => `
        <div class="tl-item">
          <div class="tl-time-col"><div class="tl-time">${item.time}</div></div>
          <div class="tl-card">
            <div class="tl-icon">${item.icon}</div>
            <div class="tl-place">${item.place}</div>
            <div class="tl-desc">${item.desc}</div>
            ${item.must ? '<span class="tl-must">필수 코스</span>' : ''}
          </div>
        </div>
      `).join('')}
    </div>`;
}

function backToResult() {
  document.getElementById('iti-screen').classList.remove('active');
  document.getElementById('result-screen').classList.add('active');
  window.scrollTo(0,0);
}

// ─── SHARE ───────────────────────────────────────────────────────
function shareResult() {
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({title:'나의 시드니 여행 유형: '+TYPES[resultCode].name, url});
  } else {
    navigator.clipboard.writeText(url).then(() => {
      const t = document.getElementById('toast');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    });
  }
}

// ─── DEEP LINK ───────────────────────────────────────────────────
(function() {
  const hash = window.location.hash;
  const tm = hash.match(/t=([EINCJPAR]{4})/);
  if (tm && TYPES[tm[1]]) {
    const em=hash.match(/e=(\d+)/), nm=hash.match(/n=(\d+)/), jm=hash.match(/j=(\d+)/), am=hash.match(/a=(\d+)/);
    const s = {
      E: em?parseInt(em[1]):10,
      N: nm?parseInt(nm[1]):10,
      J: jm?parseInt(jm[1]):10,
      A: am?parseInt(am[1]):10
    };
    resultScores = s;
    buildResult(s);
  }
})();
</script>
