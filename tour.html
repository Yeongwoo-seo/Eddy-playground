<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>지수 & 영우의 시드니 여행 유형 테스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#E8741E;--primary-hover:#D4681A;--primary-light:#FFF3EB;
  --primary-grad:linear-gradient(135deg,#E8741E,#F5943A);
  --white:#FFF;--bg:#F5F5F5;
  --g50:#FAFAFA;--g100:#F2F4F6;--g200:#E5E8EB;--g300:#D1D6DB;
  --g500:#8B95A1;--g700:#4E5968;--black:#191F28;
}
body{background:var(--bg);color:var(--black);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;overflow-x:hidden;display:flex;justify-content:center}
.app{width:100%;max-width:500px;min-height:100vh;position:relative;overflow-x:hidden}
.hl{color:var(--primary);font-weight:800}

.screen{display:none;min-height:100vh;flex-direction:column;animation:slideUp .5s cubic-bezier(.2,.8,.2,1)}
.screen.active{display:flex}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ── INTRO ── */
.intro{align-items:center;justify-content:center;padding:48px 24px;text-align:center;background:var(--white)}
.intro-badge{display:inline-block;background:var(--primary-light);color:var(--primary);font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;margin-bottom:24px}
.intro-icon{width:120px;height:120px;border-radius:50%;background:var(--primary-grad);display:flex;align-items:center;justify-content:center;font-size:56px;margin:0 auto 28px;box-shadow:0 12px 40px rgba(232,116,30,.25);animation:floatY 3s ease-in-out infinite}
.intro h1{font-size:24px;font-weight:800;line-height:1.45;margin-bottom:8px}
.intro p{font-size:14px;color:var(--g500);line-height:1.7;margin-bottom:36px}
.intro-chips{display:flex;gap:10px;justify-content:center;margin-bottom:36px;flex-wrap:wrap}
.chip{background:var(--g100);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--g700)}
.btn-primary{width:100%;padding:18px;background:var(--primary-grad);color:var(--white);border:none;border-radius:16px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(232,116,30,.3);transition:transform .1s}
.btn-primary:active{transform:scale(.97)}
.intro-sub{font-size:12px;color:var(--g500);margin-top:18px}

/* ── QUESTION ── */
.q-scr{background:var(--white)}
.q-hdr{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0}
.back-btn{background:none;border:none;color:var(--g500);font-size:14px;cursor:pointer;font-family:inherit;font-weight:600;padding:8px 0}
.counter{color:var(--g500);font-size:13px;font-weight:600}
.prog-w{height:4px;background:var(--g100);margin:16px 24px 0;border-radius:4px;overflow:hidden}
.prog-bar{height:100%;background:var(--primary-grad);border-radius:4px;transition:width .4s}
.q-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 24px 40px}
.q-num{font-size:12px;color:var(--primary);font-weight:700;letter-spacing:1.5px;margin-bottom:10px}
.q-scene{font-size:13px;color:var(--g700);line-height:1.7;padding:14px 16px;background:var(--g50);border:1px solid var(--g200);border-radius:16px;margin-bottom:18px}
.q-text{font-size:20px;font-weight:700;line-height:1.45;margin-bottom:28px}
.ans-list{display:flex;flex-direction:column;gap:10px}
.ans-btn{background:var(--white);border:1.5px solid var(--g200);border-radius:16px;padding:16px 18px;color:var(--black);font-size:15px;font-weight:500;text-align:left;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:12px;transition:all .15s}
.ans-btn:active{background:var(--primary-light);border-color:var(--primary);transform:scale(.98)}
.ans-em{font-size:22px;flex-shrink:0}

/* ── LOADING ── */
.loading{align-items:center;justify-content:center;padding:40px 24px;text-align:center;background:var(--white)}
.spin-w{width:80px;height:80px;margin:0 auto 28px;position:relative}
.spin-c{width:100%;height:100%;border:4px solid var(--g100);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-e{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px}
.loading h2{font-size:22px;font-weight:800;margin-bottom:8px}
.loading p{font-size:14px;color:var(--g500);line-height:1.6}

/* ── RESULT ── */
#result-screen{display:none;background:var(--bg)}
#result-screen.active{display:block;animation:slideUp .6s cubic-bezier(.2,.8,.2,1)}

.r-hero{background:var(--white);padding:44px 24px 36px;text-align:center;border-radius:0 0 28px 28px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.r-sub{font-size:13px;color:var(--g500);margin-bottom:16px}
.r-emoji{font-size:80px;display:block;margin-bottom:14px;animation:floatY 3s ease-in-out infinite}
.r-name{font-size:24px;font-weight:900;line-height:1.35;margin-bottom:8px}
.r-tag{font-size:14px;color:var(--g500);line-height:1.7;margin-bottom:24px}

.ax-bars{padding:0 16px}
.ax-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ax-l{font-size:11px;font-weight:700;width:28px;text-align:right;flex-shrink:0}
.ax-l.on{color:var(--primary)}
.ax-l.off{color:var(--g300)}
.ax-track{flex:1;height:8px;background:var(--g100);border-radius:8px;overflow:hidden}
.ax-fill{height:100%;background:var(--primary-grad);border-radius:8px;transition:width 1s ease .3s}

.r-sec{padding:20px 24px}
.r-card{background:var(--white);border-radius:24px;padding:24px 20px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:14px}
.sec-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);display:inline-block;margin-right:8px}
.sec-tt{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:14px}
.desc-t{font-size:15px;font-weight:500;line-height:1.8}
.pref-list{display:flex;flex-direction:column;gap:10px}
.pref-i{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.6;color:var(--g700)}
.pref-ic{font-size:18px;flex-shrink:0;margin-top:1px}

.btn-next{width:calc(100% - 48px);margin:0 24px 28px;padding:18px;background:var(--primary-grad);color:var(--white);border:none;border-radius:16px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(232,116,30,.3);transition:transform .1s}
.btn-next:active{transform:scale(.97)}

/* ── ITINERARY ── */
#iti-screen{display:none;background:var(--bg)}
#iti-screen.active{display:block;animation:slideUp .5s cubic-bezier(.2,.8,.2,1)}

.iti-hdr{background:var(--white);padding:18px 24px;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--g100)}
.iti-back{background:none;border:none;font-size:14px;color:var(--g500);cursor:pointer;font-family:inherit;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:4px}
.iti-tt{font-size:20px;font-weight:800;margin-bottom:14px}
.wk-tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.wk-tabs::-webkit-scrollbar{display:none}
.wk-tab{padding:9px 14px;border:none;border-radius:12px;background:var(--g100);font-size:13px;font-weight:600;color:var(--g500);cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .2s;flex-shrink:0}
.wk-tab.active{background:var(--primary);color:var(--white);box-shadow:0 2px 8px rgba(232,116,30,.3)}

.iti-body{padding:20px 24px}
.day-hdr{background:var(--primary-grad);border-radius:20px;padding:18px;color:var(--white);margin-bottom:18px}
.day-hdr h3{font-size:17px;font-weight:800;margin-bottom:3px}
.day-hdr p{font-size:12px;opacity:.85}
.day-sep{height:12px}

.tl-item{display:flex;gap:12px;margin-bottom:4px;position:relative}
.tl-item:not(:last-child){padding-bottom:14px}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:22px;top:48px;bottom:0;width:2px;background:var(--g200)}
.tl-tc{width:44px;flex-shrink:0;padding-top:14px}
.tl-tm{font-size:12px;font-weight:700;color:var(--primary)}
.tl-cd{flex:1;background:var(--white);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.04);border:1px solid var(--g100)}
.tl-ic{font-size:22px;margin-bottom:4px}
.tl-pl{font-size:15px;font-weight:700;margin-bottom:3px}
.tl-ds{font-size:13px;color:var(--g500);line-height:1.6}
.tl-must{display:inline-block;background:var(--primary-light);color:var(--primary);font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;margin-top:5px}

.share-bar{padding:20px 24px 44px}
.btn-share{width:100%;padding:16px;background:var(--white);color:var(--primary);border:2px solid var(--primary);border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-share:active{background:var(--primary-light);transform:scale(.97)}

.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--black);color:var(--white);padding:14px 24px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
<div class="toast" id="toast">링크가 복사되었어요</div>

<!-- INTRO -->
<div class="screen intro active" id="screen-intro">
  <div class="intro-badge">SYDNEY TRAVEL TEST</div>
  <div class="intro-icon">💕</div>
  <h1><span class="hl">지수</span> & 영우의<br>시드니 여행 유형 테스트</h1>
  <p>영우와 함께하는 시드니 주말 여행,<br><span class="hl">지수</span>는 어떤 여행자일까?</p>
  <div class="intro-chips">
    <div class="chip">10문항</div>
    <div class="chip">4축 분석</div>
    <div class="chip">16유형</div>
    <div class="chip">7/25~8/16</div>
  </div>
  <button class="btn-primary" onclick="startTest()">테스트 시작하기</button>
  <span class="intro-sub">소요 시간 약 2분</span>
</div>

<!-- QUESTION -->
<div class="screen q-scr" id="screen-question">
  <div class="q-hdr">
    <button class="back-btn" onclick="prevQ()">← 뒤로</button>
    <span class="counter" id="counter">1 / 10</span>
  </div>
  <div class="prog-w"><div class="prog-bar" id="prog" style="width:10%"></div></div>
  <div class="q-body">
    <div class="q-num" id="q-num">Q.01</div>
    <div class="q-scene" id="q-scene"></div>
    <div class="q-text" id="q-text"></div>
    <div class="ans-list" id="ans-list"></div>
  </div>
</div>

<!-- LOADING -->
<div class="screen loading" id="screen-loading">
  <div class="spin-w"><div class="spin-c"></div><div class="spin-e">💕</div></div>
  <h2><span class="hl">지수</span>의 여행 유형 분석 중...</h2>
  <p>영우와의 시드니 여행 스타일을<br>4가지 축으로 분석하고 있어요</p>
</div>

<!-- RESULT -->
<div id="result-screen">
  <div class="r-hero">
    <div class="r-sub"><span class="hl">지수</span> & 영우는</div>
    <span class="r-emoji" id="r-emoji"></span>
    <div class="r-name" id="r-name"></div>
    <div class="r-tag" id="r-tag"></div>
    <div class="ax-bars" id="ax-bars"></div>
  </div>
  <div class="r-sec">
    <div class="r-card"><div class="sec-tt"><span class="sec-dot"></span>지수의 여행 성향</div><div class="desc-t" id="r-desc"></div></div>
    <div class="r-card"><div class="sec-tt"><span class="sec-dot"></span>영우와 여행할 때 이런 걸 선호해요</div><div class="pref-list" id="r-prefs"></div></div>
  </div>
  <button class="btn-next" onclick="showIti()">추천 주말 일정 보기 →</button>
</div>

<!-- ITINERARY -->
<div id="iti-screen">
  <div class="iti-hdr">
    <button class="iti-back" onclick="backToResult()">← 결과로</button>
    <div class="iti-tt"><span class="hl">지수</span> & 영우의 주말 일정</div>
    <div class="wk-tabs" id="wk-tabs"></div>
  </div>
  <div class="iti-body" id="iti-body"></div>
  <div class="share-bar"><button class="btn-share" onclick="shareResult()">결과 공유하기</button></div>
</div>

</div>

// ─── STATE ───────────────────────────────────────────────────────
let cur=0,answers=[],rCode='',rScores={E:0,N:0,J:0,A:0};

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById(id);if(el)el.classList.add('active');
  ['result-screen','iti-screen'].forEach(r=>document.getElementById(r).classList.remove('active'));
  window.scrollTo(0,0);
}

function startTest(){cur=0;answers=[];show('screen-question');renderQ();}

function renderQ(){
  const q=Qs[cur],n=cur+1;
  document.getElementById('counter').textContent=`${n} / 10`;
  document.getElementById('q-num').textContent=`Q.${String(n).padStart(2,'0')}`;
  document.getElementById('q-scene').innerHTML=q.scene.replace(/지수/g,'<span class="hl">지수</span>');
  document.getElementById('q-text').innerHTML=q.text.replace(/지수/g,'<span class="hl">지수</span>');
  document.getElementById('prog').style.width=`${n*10}%`;
  document.getElementById('ans-list').innerHTML=q.opts.map((o,i)=>
    `<button class="ans-btn" onclick="answer(${i})"><span class="ans-em">${o.e}</span><span>${o.t}</span></button>`
  ).join('');
}

function answer(idx){
  const s=Qs[cur].opts[idx].s;
  answers.push({E:s[0],N:s[1],J:s[2],A:s[3]});
  if(cur<9){cur++;renderQ();}else finishTest();
}

function prevQ(){if(!cur){show('screen-intro');return;}answers.pop();cur--;renderQ();}

function finishTest(){
  show('screen-loading');
  const t={E:0,N:0,J:0,A:0};
  answers.forEach(a=>{t.E+=a.E;t.N+=a.N;t.J+=a.J;t.A+=a.A;});
  rScores=t;
  setTimeout(()=>buildResult(t),2200);
}

function buildResult(s){
  const mE=21,mN=20,mJ=19,mA=18;
  const code=(s.E>=mE*.45?'E':'I')+(s.N>=mN*.45?'N':'C')+(s.J>=mJ*.45?'J':'P')+(s.A>=mA*.45?'A':'R');
  rCode=code;
  const t=TYPES[code];
  document.getElementById('r-emoji').textContent=t.emoji;
  document.getElementById('r-name').innerHTML=t.name.replace(/\n/g,'<br>');
  document.getElementById('r-tag').textContent=t.tag;
  document.getElementById('r-desc').innerHTML=t.desc.replace(/지수/g,'<span class="hl">지수</span>');
  document.getElementById('r-prefs').innerHTML=t.prefs.map(p=>{
    const ic=p.substring(0,2),tx=p.substring(3);
    return `<div class="pref-i"><span class="pref-ic">${ic}</span><span>${tx}</span></div>`;
  }).join('');

  const axes=[{l:'활동',r:'감성',v:s.E,m:mE},{l:'자연',r:'도시',v:s.N,m:mN},{l:'계획',r:'즉흥',v:s.J,m:mJ},{l:'모험',r:'안정',v:s.A,m:mA}];
  document.getElementById('ax-bars').innerHTML=axes.map(a=>{
    const p=Math.round(a.v/a.m*100),on=p>=45;
    return `<div class="ax-row"><span class="ax-l ${on?'on':'off'}">${a.l}</span><div class="ax-track"><div class="ax-fill" style="width:0%;--tgt:${p}%"></div></div><span class="ax-l ${on?'off':'on'}">${a.r}</span></div>`;
  }).join('');

  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('result-screen').classList.add('active');
  document.getElementById('iti-screen').classList.remove('active');
  window.scrollTo(0,0);

  setTimeout(()=>{document.querySelectorAll('.ax-fill').forEach(el=>{el.style.width=getComputedStyle(el).getPropertyValue('--tgt');});},400);
  history.replaceState(null,'',`#t=${code}&e=${s.E}&n=${s.N}&j=${s.J}&a=${s.A}`);
}

// ─── ITINERARY ───────────────────────────────────────────────────
let curWk=0,itiData=[];

function showIti(){
  itiData=genIti(rCode);curWk=0;
  document.getElementById('wk-tabs').innerHTML=itiData.map((w,i)=>
    `<button class="wk-tab ${i===0?'active':''}" onclick="switchWk(${i})">${w.wk.label}</button>`
  ).join('');
  renderWk(0);
  document.getElementById('result-screen').classList.remove('active');
  document.getElementById('iti-screen').classList.add('active');
  window.scrollTo(0,0);
}

function switchWk(i){curWk=i;document.querySelectorAll('.wk-tab').forEach((t,j)=>t.classList.toggle('active',j===i));renderWk(i);}

function renderWk(i){
  const w=itiData[i];
  const mkItems=items=>items.map(it=>`
    <div class="tl-item"><div class="tl-tc"><div class="tl-tm">${it.t}</div></div>
    <div class="tl-cd"><div class="tl-ic">${it.i}</div><div class="tl-pl">${it.p}</div><div class="tl-ds">${it.d}</div>${it.m?'<span class="tl-must">필수 코스</span>':''}</div></div>`).join('');

  document.getElementById('iti-body').innerHTML=`
    <div style="animation:slideUp .4s cubic-bezier(.2,.8,.2,1)">
      <div class="day-hdr"><h3>${w.title}</h3><p>${w.sub}</p></div>
      <div style="font-size:14px;font-weight:700;color:var(--primary);margin-bottom:14px">📅 ${w.wk.sat}</div>
      ${mkItems(w.sat)}
      <div class="day-sep"></div>
      <div style="font-size:14px;font-weight:700;color:var(--primary);margin-bottom:14px">📅 ${w.wk.sun}</div>
      ${mkItems(w.sun)}
    </div>`;
}

function backToResult(){
  document.getElementById('iti-screen').classList.remove('active');
  document.getElementById('result-screen').classList.add('active');

}

function shareResult(){
  const url=window.location.href;
  if(navigator.share){navigator.share({title:'지수 & 영우의 시드니 여행 유형: '+TYPES[rCode].name.replace(/\n/g,' '),url});}
  else{navigator.clipboard.writeText(url).then(()=>{const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);});}
}
