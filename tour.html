<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>시드니 여행 유형 테스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E8741E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eddy">
<script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.82/build/spline-viewer.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0F1923;--surface:#172030;--card:#1C2A3D;
  --border:#263348;--text:#E4E9F1;--text2:#8694A8;--text3:#4D5F73;
  --accent:#E8741E;--accent-a:rgba(232,116,30,0.12);
  --green:#4ADE80;--blue:#60A5FA;--purple:#A78BFA;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;overflow-x:hidden;display:flex;justify-content:center}
.app{width:100%;max-width:500px;min-height:100vh;position:relative;overflow-x:hidden}
.hl{color:var(--accent);font-weight:800}

.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex;animation:su .55s cubic-bezier(.2,.8,.2,1)}
@keyframes su{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pls{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes slideOutL{from{transform:translateX(0);opacity:1}to{transform:translateX(-60px);opacity:0}}
@keyframes slideInR{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOutR{from{transform:translateX(0);opacity:1}to{transform:translateX(60px);opacity:0}}
@keyframes slideInL{from{transform:translateX(-60px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── INTRO ── */
.intro{align-items:center;justify-content:center;padding:60px 24px 120px;text-align:center;min-height:100vh}
.orb{width:180px;height:180px;border-radius:50%;margin:0 auto 44px;overflow:hidden;position:relative;box-shadow:0 0 60px rgba(232,116,30,0.15),0 0 120px rgba(232,116,30,0.06)}
.orb spline-viewer{width:100%;height:100%;display:block;border-radius:50%;--spline-viewer-background:transparent}
.orb::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 30px rgba(15,25,35,0.6);pointer-events:none;z-index:1}
.intro-ln{height:2px;background:var(--text3);margin:0 auto;border-radius:2px}
.intro-ln.s{width:56px;margin-bottom:24px}
.intro-ln.l{width:110px;margin-top:24px;margin-bottom:36px}
.intro h1{font-size:21px;font-weight:700;line-height:1.55;letter-spacing:-.5px}
.intro-nm{font-size:14px;color:var(--text2);letter-spacing:3px;font-weight:400}
.intro-tap{font-size:12px;color:var(--text3);letter-spacing:4px;margin-top:14px;cursor:pointer;padding:14px;animation:pls 2.5s ease-in-out infinite}
.intro-chips{display:flex;gap:8px;justify-content:center;margin-top:32px;flex-wrap:wrap}
.intro-chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:500;color:var(--text2)}
.intro-bottom{margin-top:40px}
.intro-cta{font-size:14px;color:var(--text2);font-weight:600;cursor:pointer;padding:14px 32px;border:1px solid var(--border);border-radius:28px;background:transparent;font-family:inherit;transition:all .2s;white-space:nowrap}
.intro-cta:active{background:var(--surface);transform:scale(.97)}

/* ── QUESTION ── */
.q-scr{background:var(--bg)}
.q-hdr{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 0}
.bk-btn{background:none;border:none;color:var(--text3);font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;padding:8px 0}
.cnt{color:var(--text3);font-size:13px;font-weight:500}
.pg-w{height:3px;background:var(--surface);margin:14px 20px 0;border-radius:3px;overflow:hidden}
.pg-b{height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.q-bd{flex:1;display:flex;flex-direction:column;padding:32px 20px 36px;overflow:hidden}
.q-inner{display:flex;flex-direction:column;flex:1}
.q-n{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:2px;margin-bottom:16px}
.q-t{font-size:22px;font-weight:800;line-height:1.45;margin-bottom:32px;letter-spacing:-.3px}
.a-ls{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.a-btn{background:#ffffff;border:1.5px solid rgba(255,255,255,0.15);border-radius:14px;padding:16px 18px;color:#191F28;font-size:15px;font-weight:600;text-align:left;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:12px;transition:all .15s}
.a-btn:active{background:#FFF3EB;border-color:var(--accent);transform:scale(.98)}
.a-em{font-size:22px;flex-shrink:0}

/* ── LOADING ── */
.ld{align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.sp-w{width:72px;height:72px;margin:0 auto 24px;position:relative}
.sp-c{width:100%;height:100%;border:3px solid var(--surface);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
.sp-e{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px}
.ld h2{font-size:19px;font-weight:700;margin-bottom:8px}
.ld p{font-size:14px;color:var(--text2);line-height:1.6}

/* ── RESULT ── */
#rs{display:none;background:var(--bg)}
#rs.active{display:block;animation:su .6s cubic-bezier(.2,.8,.2,1)}
.r-hero{padding:28px 24px 32px;text-align:center}
.r-ln{width:70px;height:2px;background:var(--text3);margin:0 auto 20px;border-radius:2px}
.r-em{font-size:68px;display:block;margin-bottom:10px;animation:fl 3s ease-in-out infinite}
.r-nm{font-size:21px;font-weight:800;line-height:1.4;margin-bottom:6px}
.r-tg{font-size:13px;color:var(--text2);line-height:1.7}

.sc-sec{padding:4px 20px 20px}
.sc-tt{font-size:17px;font-weight:700;text-align:center;margin-bottom:22px;padding-top:8px}
.sc-ln{width:50px;height:2px;background:var(--border);margin:0 auto 16px;border-radius:2px}
.sc-item{margin-bottom:22px}
.sc-lb{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:3px}
.sc-num{font-size:26px;font-weight:800;margin-bottom:2px}
.sc-pct{font-size:11px;color:var(--text3);margin-bottom:8px}
.bell-w{border-radius:14px;padding:14px 10px 6px;border:1px solid var(--border);background:var(--surface)}
.bell-svg{width:100%;height:75px}

.r-sec{padding:16px 20px}
.r-cd{background:var(--surface);border-radius:16px;padding:20px 18px;border:1px solid var(--border);margin-bottom:12px}
.s-tt{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:12px}
.d-t{font-size:14px;font-weight:400;line-height:1.85;color:var(--text2)}
.pf-ls{display:flex;flex-direction:column;gap:10px}
.pf-i{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.6;color:var(--text2)}
.pf-ic{font-size:17px;flex-shrink:0;margin-top:1px}

.ph-gr{display:flex;flex-direction:column;gap:10px;padding:8px 20px 20px}
.ph-cd{border-radius:14px;overflow:hidden;position:relative;height:170px;border:1px solid var(--border);background:var(--surface)}
.ph-cd img{width:100%;height:100%;object-fit:cover;transition:opacity .3s}
.ph-ov{position:absolute;bottom:0;left:0;right:0;padding:14px 16px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.ph-nm{font-size:14px;font-weight:700;color:#fff}
.ph-ds{font-size:11px;color:rgba(255,255,255,.7);margin-top:2px}

.btn-a{width:calc(100% - 40px);margin:0 20px 12px;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .1s}
.btn-a:active{transform:scale(.97)}
.btn-d{width:calc(100% - 40px);margin:0 20px 12px;padding:16px;background:var(--surface);color:var(--text2);border:1px solid var(--border);border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-d:active{background:var(--card);transform:scale(.97)}

/* ── CALENDAR ── */
#cs{display:none;background:var(--bg)}
#cs.active{display:block;animation:su .5s cubic-bezier(.2,.8,.2,1)}
.c-hdr{padding:18px 20px;display:flex;align-items:center}
.c-bk{background:none;border:none;color:var(--text3);font-size:13px;cursor:pointer;font-family:inherit;font-weight:500}
.c-tt{font-size:18px;font-weight:800;padding:0 20px 4px}
.c-sub{font-size:12px;color:var(--text2);padding:0 20px 20px}
.c-mo{padding:0 20px 16px}
.c-mn{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px}
.c-gr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.c-dh{text-align:center;font-size:10px;font-weight:600;color:var(--text3);padding:6px 0}
.c-d{text-align:center;font-size:12px;font-weight:500;padding:10px 0;border-radius:9px;color:var(--text3)}
.c-d.on{color:var(--text)}
.c-d.w1{background:rgba(232,116,30,.18);color:var(--accent);font-weight:700;cursor:pointer}
.c-d.w2{background:rgba(74,222,128,.13);color:var(--green);font-weight:700;cursor:pointer}
.c-d.w3{background:rgba(96,165,250,.13);color:var(--blue);font-weight:700;cursor:pointer}
.c-d.w4{background:rgba(167,139,250,.13);color:var(--purple);font-weight:700;cursor:pointer}
.c-d.td{box-shadow:inset 0 0 0 1.5px var(--accent)}

.lg{padding:4px 20px 24px}
.lg-i{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border-radius:12px;margin-bottom:7px;border:1px solid var(--border);cursor:pointer;transition:all .15s}
.lg-i:active{transform:scale(.98);background:var(--card)}
.lg-dt{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lg-tx{flex:1}
.lg-wk{font-size:12px;font-weight:700}
.lg-ds{font-size:11px;color:var(--text3);margin-top:1px}
.lg-ar{color:var(--text3);font-size:13px}

/* ── ITINERARY ── */
#is{display:none;background:var(--bg)}
#is.active{display:block;animation:su .5s cubic-bezier(.2,.8,.2,1)}
.i-hdr{padding:18px 20px;position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border)}
.i-bk{background:none;border:none;font-size:13px;color:var(--text3);cursor:pointer;font-family:inherit;font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:4px}
.i-tt{font-size:17px;font-weight:800;margin-bottom:12px}
.wt{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.wt::-webkit-scrollbar{display:none}
.w-tb{padding:8px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .2s;flex-shrink:0}
.w-tb.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.i-bd{padding:20px 20px}
.d-ph{width:100%;height:150px;border-radius:14px;overflow:hidden;margin-bottom:14px;border:1px solid var(--border)}
.d-ph img{width:100%;height:100%;object-fit:cover}
.d-hdr{background:var(--surface);border-radius:14px;padding:14px;color:var(--text);margin-bottom:14px;border:1px solid var(--border)}
.d-hdr h3{font-size:15px;font-weight:800;margin-bottom:2px}
.d-hdr p{font-size:11px;color:var(--text2)}
.d-sp{height:10px}
.d-lb{font-size:12px;font-weight:700;color:var(--accent);margin:18px 0 12px}

.tl{display:flex;gap:10px;margin-bottom:3px;position:relative}
.tl:not(:last-child){padding-bottom:12px}
.tl:not(:last-child)::before{content:'';position:absolute;left:20px;top:44px;bottom:0;width:1px;background:var(--border)}
.tl-tc{width:40px;flex-shrink:0;padding-top:12px}
.tl-tm{font-size:11px;font-weight:700;color:var(--accent)}
.tl-cd{flex:1;background:var(--surface);border-radius:12px;padding:12px;border:1px solid var(--border);overflow:hidden}
.tl-img{width:100%;height:80px;border-radius:8px;object-fit:cover;margin-bottom:8px;display:block}
.tl-ic{font-size:18px;margin-bottom:3px}
.tl-pl{font-size:13px;font-weight:700;margin-bottom:2px}
.tl-ds{font-size:11px;color:var(--text2);line-height:1.6}
.tl-ms{display:inline-block;background:var(--accent-a);color:var(--accent);font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;margin-top:4px}

.sh-bar{padding:20px 20px 44px}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);color:var(--text);padding:12px 22px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:999;border:1px solid var(--border)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
<div class="toast" id="toast">링크가 복사되었어요</div>

<!-- INTRO -->
<div class="screen intro active" id="si">
  <div class="orb"><spline-viewer url="https://prod.spline.design/Tpu1EcgeOF2iqGYJ/scene.splinecode" loading-anim-type="none" hint="false" events-target="none"></spline-viewer></div>
  <div class="intro-ln s"></div>
  <h1>시드니 여행 유형<br>테스트</h1>
  <div class="intro-ln l"></div>
  <div class="intro-nm">지수</div>
  <div class="intro-tap" onclick="startTest()">TAP TO START</div>
  <div class="intro-chips">
    <span class="intro-chip">10문항</span>
    <span class="intro-chip">4축 분석</span>
    <span class="intro-chip">16유형</span>
  </div>
  <div class="intro-bottom">
    <button class="intro-cta" onclick="startTest()">테스트 시작하기</button>
  </div>
</div>

<!-- QUESTION -->
<div class="screen q-scr" id="sq">
  <div class="q-hdr">
    <button class="bk-btn" onclick="prevQ()">← 뒤로</button>
    <span class="cnt" id="cnt">1 / 10</span>
  </div>
  <div class="pg-w"><div class="pg-b" id="pg" style="width:10%"></div></div>
  <div class="q-bd">
    <div class="q-inner" id="qin">
      <div class="q-n" id="qn">Q.01</div>
      <div class="q-t" id="qt"></div>
      <div class="a-ls" id="als"></div>
    </div>
  </div>
</div>

<!-- LOADING -->
<div class="screen ld" id="sl">
  <div class="sp-w"><div class="sp-c"></div><div class="sp-e">✈️</div></div>
  <h2>여행 유형 분석 중...</h2>
  <p><span class="hl">지수</span>의 시드니 여행 스타일을<br>4가지 축으로 분석하고 있어요</p>
</div>

<!-- RESULT -->
<div id="rs">
  <div class="r-hero">
    <div class="r-ln"></div>
    <span class="r-em" id="re"></span>
    <div class="r-nm" id="rn"></div>
    <div class="r-tg" id="rt"></div>
  </div>
  <div class="sc-sec" id="ss"></div>
  <div class="r-sec">
    <div class="r-cd"><div class="s-tt">지수의 여행 성향</div><div class="d-t" id="rd"></div></div>
    <div class="r-cd"><div class="s-tt">영우와 여행할 때 이런 걸 선호해요</div><div class="pf-ls" id="rp"></div></div>
  </div>
  <div class="r-sec"><div class="s-tt" style="margin-bottom:8px">필수 방문 명소</div></div>
  <div class="ph-gr" id="pg2"></div>
  <button class="btn-a" onclick="showCal()">추천 주말 일정 보기 →</button>
  <button class="btn-d" onclick="shareResult()">결과 공유하기</button>
  <div style="height:20px"></div>
</div>

<!-- CALENDAR -->
<div id="cs">
  <div class="c-hdr"><button class="c-bk" onclick="bkResult()">← 결과로</button></div>
  <div class="c-tt"><span class="hl">지수</span> & 영우의 주말 일정</div>
  <div class="c-sub">2026년 7월 25일 ~ 8월 16일, 매주 토·일 여행</div>
  <div id="cm"></div>
  <div class="lg" id="clg"></div>
  <button class="btn-a" style="margin-bottom:28px" onclick="goIti(0)">상세 일정 보기 →</button>
</div>

<!-- ITINERARY -->
<div id="is">
  <div class="i-hdr">
    <button class="i-bk" onclick="bkCal()">← 달력으로</button>
    <div class="i-tt">주말 일정</div>
    <div class="wt" id="wts"></div>
  </div>
  <div class="i-bd" id="ibd"></div>
  <div class="sh-bar"><button class="btn-d" style="width:100%;margin:0" onclick="shareResult()">결과 공유하기</button></div>
</div>

</div>
<script>
const PH={
  opera:'https://images.pexels.com/photos/4062614/pexels-photo-4062614.jpeg?auto=compress&cs=tinysrgb&w=600&h=400&fit=crop',
  bridge:'https://images.pexels.com/photos/6262898/pexels-photo-6262898.jpeg?auto=compress&cs=tinysrgb&w=600&h=400&fit=crop',
  bluemtn:'https://images.pexels.com/photos/26825285/pexels-photo-26825285.jpeg?auto=compress&cs=tinysrgb&w=600&h=400&fit=crop',
  koala:'https://images.pexels.com/photos/2590768/pexels-photo-2590768.jpeg?auto=compress&cs=tinysrgb&w=600&h=400&fit=crop',
  bondi:'https://images.pexels.com/photos/2607832/pexels-photo-2607832.jpeg?auto=compress&cs=tinysrgb&w=600&h=400&fit=crop',
  darling:'https://images.pexels.com/photos/995764/pexels-photo-995764.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  garden:'https://images.pexels.com/photos/2253275/pexels-photo-2253275.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  manly:'https://images.pexels.com/photos/1032650/pexels-photo-1032650.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  cafe:'https://images.pexels.com/photos/312418/pexels-photo-312418.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  sunset:'https://images.pexels.com/photos/2531237/pexels-photo-2531237.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  rocks:'https://images.pexels.com/photos/2416600/pexels-photo-2416600.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  zoo:'https://images.pexels.com/photos/1661535/pexels-photo-1661535.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  train:'https://images.pexels.com/photos/2790396/pexels-photo-2790396.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  surf:'https://images.pexels.com/photos/1654489/pexels-photo-1654489.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  food:'https://images.pexels.com/photos/67468/pexels-photo-67468.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  shop:'https://images.pexels.com/photos/135620/pexels-photo-135620.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  art:'https://images.pexels.com/photos/3004909/pexels-photo-3004909.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop',
  ferry:'https://images.pexels.com/photos/2549018/pexels-photo-2549018.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop'
};

function plImg(name,desc){
  const s=(name+' '+desc).toLowerCase();
  if(s.includes('오페라')) return PH.opera;
  if(s.includes('하버브릿지')||s.includes('bridgeclimb')||s.includes('bridge')) return PH.bridge;
  if(s.includes('블루마운틴')||s.includes('scenic')||s.includes('echo')||s.includes('katoomba')||s.includes('leura')||s.includes('three sisters')) return PH.bluemtn;
  if(s.includes('코알라')||s.includes('페더데일')||s.includes('캥거루')||s.includes('동물원')&&!s.includes('타롱가')) return PH.koala;

    w4.sat.push({t:'12:00',i:'🍽️',p:'점심',d:A?'BridgeClimb 완주 기념 더 록스':'동물원 내 또는 시내'});
    w4.sat.push({t:'14:00',i:N?'🌊':'🛍️',p:N?'아직 못 간 해변':'기념품 쇼핑',d:N?'Cronulla Beach or Palm Beach':'시내 면세점 + 기념품'});
    w4.sat.push({t:'17:00',i:'📸',p:'시드니 마지막 일몰',d:'가장 좋았던 뷰포인트에서 마지막 커플샷'});
    w4.sat.push({t:'18:30',i:'🍽️',p:'스페셜 디너',d:'시드니 마지막 주말 기념 특별 저녁'});
  }else{
    w4.sat.push({t:'10:00',i:'☕',p:'가장 좋았던 카페 재방문',d:'영우와 시드니 최애 카페'});
    w4.sat.push({t:'12:00',i:N?'🌿':'🏛️',p:N?'가장 좋았던 자연 스팟 재방문':'가장 좋았던 갤러리 재방문',d:'영우와 다시 한번 깊이 감상'});
    w4.sat.push({t:'14:00',i:'🍽️',p:'특별 점심',d:J?'미리 예약한 시드니 베스트 레스토랑':'분위기 좋은 곳에서 여유롭게'});
    w4.sat.push({t:'16:00',i:'🛍️',p:'기념품 쇼핑',d:'영우와 함께 시드니 기념품'});
    w4.sat.push({t:'18:00',i:'🌅',p:'마지막 일몰',d:'시드니 마지막 주말 일몰 감상'});
  }
  w4.sun.push({t:E?'09:00':'10:00',i:'🎭',p:'오페라하우스 재방문',d:'영우와 시드니의 상징 앞에서 마지막 커플샷'});
  w4.sun.push({t:E?'10:30':'12:00',i:'🌉',p:'하버브릿지 뷰',d:'처음 왔을 때와 비교하며 추억 회상'});
  w4.sun.push({t:E?'12:00':'13:00',i:'🍽️',p:'마지막 브런치',d:'시드니 최고의 브런치 장소에서'});
  w4.sun.push({t:E?'14:00':'15:00',i:'📸',p:'시드니 라스트 포토',d:N?'가장 좋았던 자연 스팟에서':'가장 좋았던 도시 스팟에서'});
  w4.sun.push({t:'17:00',i:'💕',p:'영우와 시드니 마무리',d:'시드니에서의 마지막 일몰을 함께'});
  return [w1,w2,w3,w4];
}

// ─── BELL CURVE ─────────────────────────────────────────────────
function bellSVG(v,mx,col){
  const x=20+(v/mx)*260;
  return `<svg class="bell-svg" viewBox="0 0 300 85">
<path d="M20,72 C55,72 85,68 115,50 C135,38 145,16 150,12 C155,16 165,38 185,50 C215,68 245,72 280,72 Z" fill="${col}" fill-opacity=".08" stroke="${col}" stroke-width="1.5" stroke-opacity=".35"/>
<line x1="20" y1="72" x2="280" y2="72" stroke="${col}" stroke-width="1" stroke-opacity=".15"/>
<line x1="${x}" y1="10" x2="${x}" y2="72" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="${x}" cy="72" r="4.5" fill="${col}"/>
<text x="20" y="84" fill="#4D5F73" font-size="10" font-family="Pretendard,sans-serif">0</text>
<text x="264" y="84" fill="#4D5F73" font-size="10" font-family="Pretendard,sans-serif">100</text>
</svg>`;
}

// ─── CALENDAR RENDER ────────────────────────────────────────────
function renderCal(){
  const wm={'2026-7-25':'w1','2026-7-26':'w1','2026-8-1':'w2','2026-8-2':'w2','2026-8-8':'w3','2026-8-9':'w3','2026-8-15':'w4','2026-8-16':'w4'};
  const wIdx={w1:0,w2:1,w3:2,w4:3};
  const dn=['월','화','수','목','금','토','일'];
  const td=new Date();

  function mo(yr,mn,nm){
    let h=`<div class="c-mo"><div class="c-mn">${nm}</div><div class="c-gr">`;
    dn.forEach(d=>h+=`<div class="c-dh">${d}</div>`);
    const f=new Date(yr,mn,1).getDay();
    const dm=new Date(yr,mn+1,0).getDate();
    const off=f===0?6:f-1;
    for(let i=0;i<off;i++) h+='<div class="c-d"></div>';
    const inRange=(mn===6&&yr===2026)||(mn===7&&yr===2026);
    for(let d=1;d<=dm;d++){
      const k=`${yr}-${mn+1}-${d}`;
      const wc=wm[k]||'';
      const isT=td.getFullYear()===yr&&td.getMonth()===mn&&td.getDate()===d;
      const wi=wc?wIdx[wc]:-1;
      const on=inRange?'on':'';
      h+=`<div class="c-d ${wc} ${isT?'td':''} ${on}" ${wi>=0?`onclick="goIti(${wi})"`:''} >${d}</div>`;
    }
    return h+'</div></div>';
  }
  document.getElementById('cm').innerHTML=mo(2026,6,'July 2026')+mo(2026,7,'August 2026');

  const lg=[
    {c:'var(--accent)',wk:'7/25-26',ds:'시드니 하버 데이트',i:0},
    {c:'var(--green)',wk:'8/1-2',ds:'블루마운틴 & 페더데일',i:1},
    {c:'var(--blue)',wk:'8/8-9',ds:itiData[2]?itiData[2].title:'유형별 맞춤 여행',i:2},
    {c:'var(--purple)',wk:'8/15-16',ds:'마지막 주말 데이트',i:3}
  ];
  document.getElementById('clg').innerHTML=lg.map(l=>`
<div class="lg-i" onclick="goIti(${l.i})">
<div class="lg-dt" style="background:${l.c}"></div>
<div class="lg-tx"><div class="lg-wk">${l.wk}</div><div class="lg-ds">${l.ds}</div></div>
<span class="lg-ar">→</span>
</div>`).join('');
}

// ─── STATE ──────────────────────────────────────────────────────
let cur=0,ans=[],rCode='',rS={E:0,N:0,J:0,A:0},sliding=false;

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const e=document.getElementById(id);if(e)e.classList.add('active');
  ['rs','cs','is'].forEach(r=>{const el=document.getElementById(r);if(el)el.classList.remove('active')});
  window.scrollTo(0,0);
}

function startTest(){cur=0;ans=[];show('sq');renderQ();}

function renderQ(){
  const q=Qs[cur],n=cur+1;
  document.getElementById('cnt').textContent=`${n} / 10`;
  document.getElementById('qn').textContent=`Q.${String(n).padStart(2,'0')}`;
  document.getElementById('qt').innerHTML=q.text.replace(/지수/g,'<span class="hl">지수</span>').replace(/\n/g,'<br>');
  document.getElementById('pg').style.width=`${n*10}%`;
  document.getElementById('als').innerHTML=q.opts.map((o,i)=>
    `<button class="a-btn" onclick="answer(${i})"><span class="a-em">${o.e}</span><span>${o.t}</span></button>`
  ).join('');
}

function answer(i){
  if(sliding) return;
  const s=Qs[cur].opts[i].s;
  ans.push({E:s[0],N:s[1],J:s[2],A:s[3]});
  if(cur<9){
    sliding=true;
    const inner=document.getElementById('qin');
    inner.style.animation='slideOutL .2s ease forwards';
    setTimeout(()=>{
      cur++;renderQ();
      inner.style.animation='slideInR .25s ease forwards';
      setTimeout(()=>{sliding=false;},250);
    },200);
  }else finish();
}

function prevQ(){
  if(sliding) return;
  if(!cur){show('si');return;}
  ans.pop();
  sliding=true;
  const inner=document.getElementById('qin');
  inner.style.animation='slideOutR .2s ease forwards';
  setTimeout(()=>{
    cur--;renderQ();
    inner.style.animation='slideInL .25s ease forwards';
    setTimeout(()=>{sliding=false;},250);
  },200);
}

function finish(){
  show('sl');
  const t={E:0,N:0,J:0,A:0};
  ans.forEach(a=>{t.E+=a.E;t.N+=a.N;t.J+=a.J;t.A+=a.A});
  rS=t;
  setTimeout(()=>buildR(t),2200);
}

function buildR(s){
  const mE=21,mN=20,mJ=19,mA=18;
  const code=(s.E>=mE*.45?'E':'I')+(s.N>=mN*.45?'N':'C')+(s.J>=mJ*.45?'J':'P')+(s.A>=mA*.45?'A':'R');
  rCode=code;
  const t=TYPES[code];
  document.getElementById('re').textContent=t.emoji;
  document.getElementById('rn').innerHTML=t.name.replace(/\n/g,'<br>');
  document.getElementById('rt').textContent=t.tag;
  document.getElementById('rd').innerHTML=t.desc.replace(/지수/g,'<span class="hl">지수</span>');
  document.getElementById('rp').innerHTML=t.prefs.map(p=>{
    const ic=p.substring(0,2),tx=p.substring(3);
    return `<div class="pf-i"><span class="pf-ic">${ic}</span><span>${tx}</span></div>`;
  }).join('');

  const axes=[
    {lb:'활동 점수',v:Math.round(s.E/mE*100),m:100,c:'#E8741E',L:'활동',R:'감성'},
    {lb:'자연 점수',v:Math.round(s.N/mN*100),m:100,c:'#4ADE80',L:'자연',R:'도시'},
    {lb:'계획 점수',v:Math.round(s.J/mJ*100),m:100,c:'#60A5FA',L:'계획',R:'즉흥'},
    {lb:'모험 점수',v:Math.round(s.A/mA*100),m:100,c:'#A78BFA',L:'모험',R:'안정'}
  ];
  const ss=document.getElementById('ss');
  ss.innerHTML='<div class="sc-tt">당신의 여행 점수</div><div class="sc-ln"></div>'+axes.map(a=>{
    const hi=a.v>=45;
    return `<div class="sc-item">
<div class="sc-lb">${a.lb}</div>
<div class="sc-num" style="color:${a.c}">${a.v}<span style="font-size:16px;color:var(--text3)"> / 100</span></div>
<div class="sc-pct">${a.L} ${hi?'↑':'↓'} · ${a.R} ${hi?'↓':'↑'}</div>
<div class="bell-w">${bellSVG(a.v,a.m,a.c)}</div>
</div>`;
  }).join('');

  const photos=[
    {img:PH.opera,nm:'시드니 오페라하우스',ds:'Sydney Opera House'},
    {img:PH.bridge,nm:'하버브릿지',ds:'Sydney Harbour Bridge'},
    {img:PH.bluemtn,nm:'블루마운틴',ds:'Blue Mountains · Three Sisters'},
    {img:PH.koala,nm:'페더데일 동물원',ds:'Featherdale Wildlife Park'},
    {img:PH.bondi,nm:'본다이 비치',ds:'Bondi Beach'}
  ];
  document.getElementById('pg2').innerHTML=photos.map(p=>
    `<div class="ph-cd"><img src="${p.img}" alt="${p.nm}" loading="lazy" onerror="this.style.display='none'"><div class="ph-ov"><div class="ph-nm">${p.nm}</div><div class="ph-ds">${p.ds}</div></div></div>`
  ).join('');

  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('rs').classList.add('active');
  window.scrollTo(0,0);
  history.replaceState(null,'',`#t=${code}&e=${s.E}&n=${s.N}&j=${s.J}&a=${s.A}`);
}

// ─── CALENDAR & ITI NAV ─────────────────────────────────────────
let curW=0,itiData=[];

function showCal(){
  itiData=genIti(rCode);
  renderCal();
  document.getElementById('rs').classList.remove('active');
  document.getElementById('cs').classList.add('active');
  window.scrollTo(0,0);
}

function goIti(i){
  if(!itiData.length) itiData=genIti(rCode);
  curW=i;
  document.getElementById('wts').innerHTML=itiData.map((w,j)=>
    `<button class="w-tb ${j===i?'on':''}" onclick="swWk(${j})">${w.wk.label}</button>`
  ).join('');
  renderWk(i);
  document.getElementById('cs').classList.remove('active');
  document.getElementById('is').classList.add('active');
  window.scrollTo(0,0);
}

function swWk(i){curW=i;document.querySelectorAll('.w-tb').forEach((t,j)=>t.classList.toggle('on',j===i));renderWk(i);}

function renderWk(i){
  const w=itiData[i];
  const wPh=[PH.opera,PH.bluemtn,PH.bondi,PH.opera];
  const mk=items=>items.map(it=>{
    const img=plImg(it.p,it.d);
    return `
<div class="tl"><div class="tl-tc"><div class="tl-tm">${it.t}</div></div>
<div class="tl-cd"><img class="tl-img" src="${img}" alt="${it.p}" loading="lazy" onerror="this.style.display='none'"><div class="tl-ic">${it.i}</div><div class="tl-pl">${it.p}</div><div class="tl-ds">${it.d}</div>${it.m?'<span class="tl-ms">필수 코스</span>':''}</div></div>`;
  }).join('');

  document.getElementById('ibd').innerHTML=`
<div style="animation:su .4s cubic-bezier(.2,.8,.2,1)">
<div class="d-ph"><img src="${wPh[i]}" alt="" loading="lazy" onerror="this.parentElement.style.display='none'"></div>
<div class="d-hdr"><h3>${w.title}</h3><p>${w.sub}</p></div>
<div class="d-lb">📅 ${w.wk.sat}</div>
${mk(w.sat)}
<div class="d-sp"></div>
<div class="d-lb">📅 ${w.wk.sun}</div>
${mk(w.sun)}
</div>`;
}

function bkResult(){
  document.getElementById('cs').classList.remove('active');
  document.getElementById('is').classList.remove('active');
  document.getElementById('rs').classList.add('active');
  window.scrollTo(0,0);
}

function bkCal(){
  document.getElementById('is').classList.remove('active');
  document.getElementById('cs').classList.add('active');
  window.scrollTo(0,0);
}

function shareResult(){
  const url=window.location.href;
  if(navigator.share){navigator.share({title:'시드니 여행 유형: '+TYPES[rCode].name.replace(/\n/g,' '),url});}
  else{navigator.clipboard.writeText(url).then(()=>{const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);});}
}

(function(){
  const h=window.location.hash,tm=h.match(/t=([EINCJPAR]{4})/);
  if(tm&&TYPES[tm[1]]){
    const gv=k=>{const m=h.match(new RegExp(k+'=(\\d+)'));return m?parseInt(m[1]):10;};
    const s={E:gv('e'),N:gv('n'),J:gv('j'),A:gv('a')};
    rS=s;buildR(s);
  }
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
