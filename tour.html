<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>나의 시드니 여행 유형 테스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#0D1B2A;--navy2:#162136;--navy3:#1E2E45;
  --white:#fff;--gray:rgba(255,255,255,.5);--gray2:rgba(255,255,255,.15);
  --blue:#5B8DEF;--gold:#F0A500;--green:#4ECDC4;
}
body{background:var(--navy);color:var(--white);font-family:'Pretendard',-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* INTRO */
.intro{align-items:center;justify-content:center;padding:48px 24px;text-align:center;gap:0}
.orb{width:120px;height:120px;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),rgba(180,210,255,.5));border-radius:50%;margin:0 auto 36px;box-shadow:0 20px 60px rgba(91,141,239,.4)}
.intro h1{font-size:26px;font-weight:800;line-height:1.35;margin-bottom:10px}
.intro p{font-size:14px;color:var(--gray);line-height:1.65;margin-bottom:40px}
.tap-label{font-size:11px;color:var(--gray);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:60px;animation:fadePulse 2s infinite}
@keyframes fadePulse{0%,100%{opacity:.4}50%{opacity:1}}
.start-btn{background:var(--white);color:var(--navy);border:none;border-radius:100px;padding:18px 52px;font-size:17px;font-weight:700;cursor:pointer;font-family:'Pretendard',sans-serif;flex-shrink:0}
.intro-sub{font-size:12px;color:var(--gray);margin-top:24px}

/* QUESTION */
.q-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0}
.back-btn{background:none;border:none;color:var(--gray);font-size:14px;cursor:pointer;font-family:'Pretendard',sans-serif;padding:8px 0}
.counter{color:var(--gray);font-size:13px}
.prog-wrap{height:2px;background:var(--gray2);margin:16px 24px 0;border-radius:2px}
.prog-bar{height:100%;background:var(--white);border-radius:2px;transition:width .4s ease}
.q-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px 40px}
.q-num{font-size:11px;color:var(--blue);font-weight:700;letter-spacing:1.5px;margin-bottom:14px}
.q-scene{font-size:12px;color:var(--gray);line-height:1.6;padding:10px 14px;background:var(--gray2);border-radius:12px;margin-bottom:16px}
.q-text{font-size:21px;font-weight:700;line-height:1.45;margin-bottom:36px}
.ans-list{display:flex;flex-direction:column;gap:10px}
.ans-btn{background:var(--navy2);border:1px solid var(--gray2);border-radius:16px;padding:16px 18px;color:var(--white);font-size:15px;font-weight:500;text-align:left;cursor:pointer;font-family:'Pretendard',sans-serif;display:flex;align-items:center;gap:12px;transition:transform .1s,background .15s,border-color .15s}
.ans-btn:active{background:var(--white);color:var(--navy);border-color:var(--white);transform:scale(.98)}
.ans-em{font-size:20px;flex-shrink:0}

/* LOADING */
.loading{align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.spin{width:72px;height:72px;border:3px solid var(--gray2);border-top-color:var(--white);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 36px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading h2{font-size:22px;font-weight:700;margin-bottom:10px}
.loading p{font-size:14px;color:var(--gray);line-height:1.6}

/* RESULT */
#result-screen{display:none;position:relative}
#result-screen.active{display:block}

.share-fab{position:fixed;top:20px;right:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(12px);border-radius:100px;color:var(--white);padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Pretendard',sans-serif;z-index:100;display:flex;align-items:center;gap:6px}

.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px 60px;text-align:center;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(91,141,239,.2) 0%,transparent 70%);pointer-events:none}
.type-badge{font-size:11px;color:var(--blue);letter-spacing:2.5px;font-weight:700;margin-bottom:16px}
.type-emoji{font-size:80px;margin-bottom:20px;animation:emojiFloat 3s ease-in-out infinite}
@keyframes emojiFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.type-name{font-size:34px;font-weight:900;line-height:1.2;margin-bottom:14px}
.type-tagline{font-size:15px;color:var(--gray);line-height:1.7;max-width:290px;margin:0 auto 36px}
.score-track{width:240px;height:6px;background:var(--gray2);border-radius:6px;overflow:hidden}
.score-fill{height:100%;background:linear-gradient(90deg,var(--blue),#a8d8ff);border-radius:6px;transition:width 1.2s ease .3s}
.score-labels{width:240px;display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--gray)}
.scroll-hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--gray);text-align:center}
.bounce{display:block;font-size:18px;margin-top:4px;animation:bounce 1.5s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

.rpt-sec{padding:56px 24px;border-top:1px solid var(--gray2)}
.sec-label{font-size:10px;color:var(--blue);font-weight:700;letter-spacing:2px;margin-bottom:8px}
.sec-title{font-size:23px;font-weight:800;line-height:1.3;margin-bottom:24px}
.trait-card{background:var(--navy2);border-radius:20px;padding:20px;margin-bottom:12px}
.trait-em{font-size:26px;margin-bottom:8px}
.trait-t{font-size:16px;font-weight:700;margin-bottom:6px}
.trait-d{font-size:14px;color:var(--gray);line-height:1.65}
.warn-card{background:linear-gradient(135deg,rgba(240,165,0,.12),rgba(240,165,0,.05));border:1px solid rgba(240,165,0,.2);border-radius:20px;padding:20px;margin-bottom:12px}
.tip-card{background:linear-gradient(135deg,rgba(78,205,196,.12),rgba(78,205,196,.05));border:1px solid rgba(78,205,196,.2);border-radius:20px;padding:20px;margin-bottom:12px}

/* SPOTS */
.spot-card{background:var(--navy2);border-radius:24px;overflow:hidden;margin-bottom:20px}
.spot-img-wrap{width:100%;height:200px;position:relative;overflow:hidden}
.spot-img{width:100%;height:100%;object-fit:cover;display:block}
.spot-img-fallback{width:100%;height:100%;display:none;align-items:center;justify-content:center;font-size:64px;background:var(--navy3)}
.spot-map-wrap{width:100%;height:160px;overflow:hidden;position:relative}
.spot-map-wrap iframe{width:100%;height:100%;border:none;display:block}
.spot-body{padding:20px}
.spot-n{font-size:10px;color:var(--blue);font-weight:700;letter-spacing:1.5px;margin-bottom:4px}
.spot-name{font-size:20px;font-weight:800;margin-bottom:4px}
.spot-cat{font-size:12px;color:var(--gray);margin-bottom:12px}
.spot-why{font-size:14px;color:rgba(255,255,255,.82);line-height:1.68;margin-bottom:14px}
.spot-meta{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.spot-row{display:flex;gap:8px;font-size:13px}
.spot-lbl{color:var(--gray);min-width:52px}
.map-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(91,141,239,.18);color:var(--blue);border:1px solid rgba(91,141,239,.35);border-radius:100px;padding:10px 18px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;font-family:'Pretendard',sans-serif}

/* ITINERARY */
.iti-sec{padding:56px 24px 80px;border-top:1px solid var(--gray2)}
.day-blk{margin-bottom:40px}
.day-hd{font-size:18px;font-weight:800;color:var(--gold);margin-bottom:20px;display:flex;align-items:center;gap:8px}
.tl-item{display:flex;gap:14px;margin-bottom:20px;position:relative}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:19px;top:40px;bottom:-12px;width:1px;background:var(--gray2)}
.tl-dot{width:40px;height:40px;background:var(--navy2);border:2px solid var(--gray2);border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px}
.tl-body{flex:1;padding-top:8px}
.tl-time{font-size:11px;color:var(--gray);font-weight:600;letter-spacing:.5px;margin-bottom:2px}
.tl-place{font-size:15px;font-weight:700;margin-bottom:3px}
.tl-desc{font-size:13px;color:var(--gray);line-height:1.55}

/* TOAST */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(255,255,255,.95);color:var(--navy);padding:13px 24px;border-radius:100px;font-size:14px;font-weight:600;white-space:nowrap;opacity:0;transition:all .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="toast" id="toast">링크가 복사되었어요 ✓</div>

<!-- ① INTRO -->
<div class="screen intro active" id="screen-intro">
  <div class="orb"></div>
  <h1>서영우님의<br>시드니 여행 유형<br>심층 분석 보고서</h1>
  <p>10가지 시드니 상황 속<br>나라면 어떻게 할까요?</p>
  <div class="tap-label">TAP TO START</div>
  <button class="start-btn" onclick="startTest()">테스트 시작하기</button>
  <span class="intro-sub">소요 시간 약 2분</span>
</div>

<!-- ② QUESTION -->
<div class="screen" id="screen-question">
  <div class="q-header">
    <button class="back-btn" onclick="prevQ()">← 뒤로</button>
    <span class="counter" id="counter">1 / 10</span>
  </div>
  <div class="prog-wrap"><div class="prog-bar" id="prog" style="width:10%"></div></div>
  <div class="q-body">
    <div class="q-num" id="q-num">Q.01</div>
    <div class="q-scene" id="q-scene"></div>
    <div class="q-text" id="q-text"></div>
    <div class="ans-list" id="ans-list"></div>
  </div>
</div>

<!-- ③ LOADING -->
<div class="screen loading" id="screen-loading">
  <div class="spin"></div>
  <h2>분석 중...</h2>
  <p>나만의 시드니 여행 유형을<br>찾고 있어요</p>
</div>

<!-- ④ RESULT -->
<div id="result-screen">
  <button class="share-fab" onclick="shareResult()">↑ 공유하기</button>
  <div class="hero">
    <div class="hero-bg"></div>
    <div class="type-badge" id="r-badge">MY TYPE</div>
    <div class="type-emoji" id="r-emoji"></div>
    <div class="type-name" id="r-name"></div>
    <div class="type-tagline" id="r-tagline"></div>
    <div class="score-track"><div class="score-fill" id="r-score" style="width:0%"></div></div>
    <div class="score-labels"><span>감성 힐링</span><span>액티브 탐험</span></div>
    <div class="scroll-hint">더 알아보기<span class="bounce">↓</span></div>
  </div>
  <div class="rpt-sec"><div class="sec-label">REPORT 01</div><div class="sec-title" id="r1t"></div><div id="r1c"></div></div>
  <div class="rpt-sec"><div class="sec-label">REPORT 02</div><div class="sec-title" id="r2t"></div><div id="r2c"></div></div>
  <div class="rpt-sec"><div class="sec-label">REPORT 03</div><div class="sec-title" id="r3t"></div><div id="r3c"></div></div>
  <div class="rpt-sec"><div class="sec-label">REPORT 04</div><div class="sec-title" id="r4t"></div><div id="r4c"></div></div>
  <div class="rpt-sec"><div class="sec-label">PLACES FOR YOU</div><div class="sec-title">추천 여행지 6</div><div id="spots"></div></div>
  <div class="iti-sec"><div class="sec-label">WEEKEND PLAN</div><div class="sec-title">나를 위한 주말 일정표</div><div id="iti"></div></div>
</div>

  {

    text:"이 세 곳을 같은 주말에 다 소화하는 일정에 도전하고 싶다.",
    opts:[
      {e:"💪",t:"하고 싶어 죽겠어!",s:3},

// ─── 4 TYPES ────────────────────────────────────────────────────
const TYPES = [
  // 0: 감성 힐링러 (0-9)
  {
    badge:"SENSORY HEALER",
    emoji:"🌸",
    name:"감성 힐링러",

// ─── STATE ───────────────────────────────────────────────────────
let current = 0;
let scores = [];
let resultType = -1;

// ─── SCREEN NAV ──────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
  document.getElementById('result-screen').classList.remove('active');
  window.scrollTo(0,0);
}

function showResult() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('result-screen').classList.add('active');
  window.scrollTo(0,0);
}

// ─── TEST FLOW ────────────────────────────────────────────────────
function startTest() {
  current = 0;
  scores = [];
  show('screen-question');
  renderQ();
}

function renderQ() {
  const q = Qs[current];
  const num = current + 1;
  document.getElementById('counter').textContent = `${num} / 10`;
  document.getElementById('q-num').textContent = `Q.${String(num).padStart(2,'0')}`;
  document.getElementById('q-scene').textContent = q.scene;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('prog').style.width = `${num * 10}%`;

  const list = document.getElementById('ans-list');
  list.innerHTML = q.opts.map((o,i) =>
    `<button class="ans-btn" onclick="answer(${o.s})">
      <span class="ans-em">${o.e}</span>
      <span>${o.t}</span>
    </button>`
  ).join('');
}

function answer(score) {
  scores.push(score);
  if (current < 9) {
    current++;
    renderQ();
  } else {
    finishTest();
  }
}

function prevQ() {
  if (current === 0) { show('screen-intro'); return; }
  scores.pop();
  current--;
  renderQ();
}

function finishTest() {
  show('screen-loading');
  const total = scores.reduce((a,b) => a+b, 0);
  setTimeout(() => buildResult(total), 2200);
}

function buildResult(total) {
  let type;
  if (total <= 9) type = 0;
  else if (total <= 16) type = 1;
  else if (total <= 22) type = 2;
  else type = 3;

  resultType = type;
  const t = TYPES[type];
  const pct = Math.round((total / 30) * 100);

  // Hero
  document.getElementById('r-badge').textContent = t.badge;
  document.getElementById('r-emoji').textContent = t.emoji;
  document.getElementById('r-name').textContent = t.name;
  document.getElementById('r-tagline').textContent = t.tagline.replace('\\n','\n');
  document.getElementById('r-tagline').style.whiteSpace = 'pre-line';

  // Report sections
  document.getElementById('r1t').textContent = t.r1t;
  document.getElementById('r1c').innerHTML = t.r1.map(c =>
    `<div class="trait-card"><div class="trait-em">${c.e}</div><div class="trait-t">${c.t}</div><div class="trait-d">${c.d}</div></div>`
  ).join('');

  document.getElementById('r2t').textContent = t.r2t;
  document.getElementById('r2c').innerHTML = t.r2.map(c =>
    `<div class="trait-card"><div class="trait-em">${c.e}</div><div class="trait-t">${c.t}</div><div class="trait-d">${c.d}</div></div>`
  ).join('');

  document.getElementById('r3t').textContent = t.r3t;
  document.getElementById('r3c').innerHTML = t.r3.map(c =>
    `<div class="warn-card"><div class="trait-em">${c.e}</div><div class="trait-t">${c.t}</div><div class="trait-d">${c.d}</div></div>`
  ).join('');

  document.getElementById('r4t').textContent = t.r4t;
  document.getElementById('r4c').innerHTML = t.r4.map(c =>
    `<div class="tip-card"><div class="trait-em">${c.e}</div><div class="trait-t">${c.t}</div><div class="trait-d">${c.d || c.desc}</div></div>`
  ).join('');

  // Spots
  document.getElementById('spots').innerHTML = t.spots.map((s,i) => {
    const mapUrl = `https://maps.google.com/maps?q=${s.mapQ}&output=embed`;
    const gmLink = `https://www.google.com/maps/search/${s.mapQ}`;
    return `
    <div class="spot-card">
      <div class="spot-img-wrap">
        ${s.img
          ? `<img class="spot-img" src="${s.img}" alt="${s.n}"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
              loading="lazy">
             <div class="spot-img-fallback" style="background:${s.imgBg}">
               <span style="font-size:72px">${s.imgFallback}</span>
             </div>`
          : `<div class="spot-img-fallback" style="display:flex;background:${s.imgBg}">
               <span style="font-size:72px">${s.imgFallback}</span>
             </div>`
        }
      </div>
      <div class="spot-map-wrap">
        <iframe src="${mapUrl}" allowfullscreen="" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          title="${s.n} 위치"></iframe>
      </div>
      <div class="spot-body">
        <div class="spot-n">SPOT ${String(i+1).padStart(2,'0')}</div>
        <div class="spot-name">${s.n}</div>
        <div class="spot-cat">${s.cat}</div>
        <div class="spot-why">${s.why}</div>
        <div class="spot-meta">
          <div class="spot-row"><span class="spot-lbl">요금</span><span>${s.fee}</span></div>
          <div class="spot-row"><span class="spot-lbl">운영</span><span>${s.hours}</span></div>
          <div class="spot-row"><span class="spot-lbl">교통</span><span>${s.transport}</span></div>
        </div>
        <a class="map-btn" href="${gmLink}" target="_blank" rel="noopener">
          📍 Google Maps에서 보기
        </a>
      </div>
    </div>`;
  }).join('');

  // Itinerary
  document.getElementById('iti').innerHTML = t.iti.map(day => `
    <div class="day-blk">
      <div class="day-hd">${day.icon} ${day.day}</div>
      ${day.items.map(item => `
        <div class="tl-item">
          <div class="tl-dot">${item.icon}</div>
          <div class="tl-body">
            <div class="tl-time">${item.time}</div>
            <div class="tl-place">${item.place}</div>
            <div class="tl-desc">${item.desc}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');

  showResult();

  // Animate score bar after render
  setTimeout(() => {
    document.getElementById('r-score').style.width = pct + '%';
  }, 300);

  // Update URL hash for sharing
  history.replaceState(null, '', `#r=${type}&s=${total}`);
}

// ─── SHARE ───────────────────────────────────────────────────────
function shareResult() {
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: '나의 시드니 여행 유형', url });
  } else {
    navigator.clipboard.writeText(url).then(() => showToast());
  }
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── DEEP LINK (share URL) ────────────────────────────────────────
(function() {
  const hash = window.location.hash;
  const m = hash.match(/r=(\d)/);
  if (m) {
    const type = parseInt(m[0].replace('r=',''));
    const sm = hash.match(/s=(\d+)/);
    const total = sm ? parseInt(sm[1]) : [5,13,19,27][type];
    if (type >= 0 && type <= 3) {
      buildResult(total);
    }
  }
})();
</script>
