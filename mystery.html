<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · 사라진 11분</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080A0C">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERATION MK">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;
  --surface-1:#101419;--surface-2:#171C22;--surface-3:#20262D;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --signal-red:#D94141;--amber:#D6A84B;--cyan:#59B8C8;--success:#62B985;
  --divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{
  background:#050607;color:var(--text-primary);font-family:var(--sans);
  display:flex;justify-content:center;overflow-x:hidden;
}
input,button{font-family:inherit}
.frame{width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,.6)}
@media (min-width:431px){ .frame{min-height:100vh} body{padding:0} }

/* ===== Typography ===== */
.t-display{font-size:32px;line-height:38px;font-weight:700}
.t-h1{font-size:26px;line-height:34px;font-weight:700}
.t-h2{font-size:21px;line-height:28px;font-weight:650}
.t-h3{font-size:17px;line-height:24px;font-weight:600}
.t-body-lg{font-size:16px;line-height:26px;font-weight:400}
.t-body{font-size:15px;line-height:24px;font-weight:400}
.t-small{font-size:13px;line-height:19px;font-weight:400}
.t-data{font-family:var(--mono);font-size:11px;line-height:15px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.t-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.mono{font-family:var(--mono)}
.muted{color:var(--text-secondary)}
.dim{color:var(--text-muted)}

/* ===== Top status bar ===== */
.topbar{
  position:sticky;top:0;z-index:20;height:52px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:rgba(8,10,12,0.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.topbar-left{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.topbar-left .dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex-shrink:0}
.topbar-mid{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--text-muted)}
.topbar-right{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.04em}

/* ===== Content area ===== */
.content{flex:1;padding:20px 20px 48px;min-width:0}
.content.no-pad{padding:0}
@media (max-width:374px){ .content{padding:16px 16px 40px} }

@keyframes screenIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.screen{animation:screenIn .22s cubic-bezier(.2,.8,.2,1)}

/* ===== Bottom nav ===== */
.bottomnav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;z-index:30;
  display:flex;background:rgba(8,10,12,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,0.06);padding-bottom:env(safe-area-inset-bottom,0);
}
.navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;background:none;border:none;color:var(--text-muted);cursor:pointer;position:relative;min-height:44px}
.navitem svg{width:21px;height:21px}
.navitem span{font-size:10px;font-weight:600;letter-spacing:.02em;font-family:var(--mono)}
.navitem.active{color:var(--text-primary)}
.navitem.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:2px;background:var(--cyan)}
.navitem .newdot{position:absolute;top:6px;right:calc(50% - 16px);width:6px;height:6px;border-radius:50%;background:var(--amber)}

/* ===== Badge / status pill ===== */
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid transparent}
.badge .bdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.badge-new{color:var(--amber);border-color:rgba(214,168,75,.35);background:rgba(214,168,75,.08)}
.badge-new .bdot{background:var(--amber)}
.badge-verified{color:var(--cyan);border-color:rgba(89,184,200,.35);background:rgba(89,184,200,.08)}
.badge-verified .bdot{background:var(--cyan)}
.badge-connected{color:var(--success);border-color:rgba(98,185,133,.35);background:rgba(98,185,133,.08)}
.badge-connected .bdot{background:var(--success)}
.badge-contradiction{color:var(--signal-red);border-color:rgba(217,65,65,.35);background:rgba(217,65,65,.08)}
.badge-contradiction .bdot{background:var(--signal-red)}
.badge-muted{color:var(--text-muted);border-color:var(--divider)}
.badge-muted .bdot{background:var(--text-muted)}

/* ===== Card ===== */
.card{border-radius:8px;background:var(--surface-1);border:1px solid rgba(255,255,255,0.07);padding:16px}
.card + .card{margin-top:12px}
.card-row{display:flex;align-items:center;gap:12px}
.card-tap{cursor:pointer}
.card-tap:active{background:var(--surface-2)}

/* ===== Buttons ===== */
.btn{height:52px;width:100%;border-radius:6px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:none}
.btn:active{opacity:.85}
.btn-primary{background:var(--text-primary);color:var(--bg)}
.btn-secondary{background:transparent;border:1px solid rgba(255,255,255,0.14);color:var(--text-primary)}
.btn-danger{background:transparent;border:1px solid var(--signal-red);color:var(--signal-red)}
.btn-sm{height:40px;font-size:13px}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn-row{display:flex;gap:10px}

/* ===== Objective / section labels ===== */
.section-lb{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin:24px 0 10px}
.section-lb:first-child{margin-top:0}

/* ===== Evidence progress segmented ===== */
.evseg{display:flex;gap:3px;margin-top:10px}
.evseg i{flex:1;height:3px;border-radius:2px;background:var(--surface-3)}
.evseg i.on{background:var(--cyan)}

/* ===== Filter chips ===== */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:16px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:8px 14px;border-radius:20px;border:1px solid var(--divider);color:var(--text-secondary);background:transparent;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--text-primary);color:var(--bg);border-color:var(--text-primary)}

/* ===== Portraits (desaturated silhouette) ===== */
.portrait{background:linear-gradient(160deg,#232a31,#14181d);display:flex;align-items:center;justify-content:center;color:var(--text-muted)}
.portrait svg{width:46%;height:46%}

/* ===== Evidence card grid ===== */
.evgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.evcard{border-radius:8px;background:var(--surface-1);border:1px solid rgba(255,255,255,0.07);overflow:hidden;cursor:pointer}
.evcard:active{background:var(--surface-2)}
.evthumb{aspect-ratio:4/3;background:linear-gradient(155deg,#1a2028,#0d1114);position:relative;display:flex;align-items:center;justify-content:center}
.evthumb svg{width:40%;opacity:.5}
.evbody{padding:10px 12px 12px}
.evcode{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);letter-spacing:.05em}
.evtitle{font-size:13px;font-weight:600;margin-top:3px;line-height:1.35}
.evfoot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}

/* ===== Bottom sheet ===== */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet{width:100%;max-width:430px;max-height:78vh;background:var(--surface-2);border-radius:14px 14px 0 0;padding:16px 20px 24px;overflow-y:auto;animation:sheetUp .22s cubic-bezier(.2,.8,.2,1)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--divider);margin:0 auto 16px}
.sheet-title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:14px}

/* ===== Suspect index ===== */
.suspect-row{display:flex;gap:14px;padding:14px;border-radius:8px;background:var(--surface-1);border:1px solid rgba(255,255,255,0.07);cursor:pointer;align-items:center}
.suspect-row + .suspect-row{margin-top:12px}
.suspect-row:active{background:var(--surface-2)}
.suspect-thumb{width:56px;height:56px;border-radius:6px;flex-shrink:0}
.suspect-info{min-width:0;flex:1}
.suspect-name-en{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--text-muted)}
.suspect-name-kr{font-size:16px;font-weight:700;margin-top:2px}
.suspect-role{font-size:12px;color:var(--text-secondary);margin-top:2px}
.suspect-stats{display:flex;gap:10px;margin-top:6px}
.suspect-stats span{font-family:var(--mono);font-size:10px;color:var(--text-muted)}

/* ===== Suspect profile ===== */
.profile-hero{height:220px;border-radius:8px;margin-bottom:20px;position:relative;overflow:hidden}
.profile-hero-grad{position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,transparent 55%)}
.profile-name-box{position:absolute;left:20px;bottom:14px}
.profile-timeline-row{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--divider)}
.profile-timeline-row:last-child{border-bottom:none}
.profile-timeline-t{font-family:var(--mono);font-size:13px;color:var(--cyan);flex-shrink:0;width:44px}

/* ===== Interrogation ===== */
.interro-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.interro-portrait{width:68px;height:68px;border-radius:8px;flex-shrink:0}
.mood-tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px;display:inline-block}
.mood-COMPOSED{color:var(--cyan)}
.mood-DEFENSIVE{color:var(--amber)}
.mood-PRESSURED{color:var(--signal-red)}
.mood-UNSTABLE{color:var(--signal-red)}
.dialogue-log{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.dlg-npc{font-size:16px;line-height:1.65;color:var(--text-primary);border-left:2px solid var(--divider);padding-left:14px}
.dlg-player{font-family:var(--mono);font-size:12.5px;color:var(--cyan);align-self:flex-end;text-align:right;max-width:88%}
.dlg-system{font-family:var(--mono);font-size:11px;color:var(--text-muted);text-align:center;letter-spacing:.05em}
.qchoice{display:block;width:100%;text-align:left;background:var(--surface-1);border:1px solid rgba(255,255,255,0.07);border-radius:6px;padding:14px 16px;color:var(--text-primary);font-size:14px;cursor:pointer;margin-bottom:10px}
.qchoice:active{background:var(--surface-2)}
.qchoice::before{content:'[ ';color:var(--text-muted)}
.qchoice::after{content:' ]';color:var(--text-muted)}

/* ===== Field mission ===== */
.field-view{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
.field-cam{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#1c2530 0%,#04070a 75%)}
.field-topbar{position:absolute;top:0;left:0;right:0;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0));display:flex;align-items:center;justify-content:space-between;z-index:2}
.field-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:#fff;text-transform:uppercase;background:rgba(0,0,0,.4);padding:6px 10px;border-radius:4px}
.field-close{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);border:none;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.field-overlay-svg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .1s linear}
.field-bottom{position:relative;z-index:2;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0));background:linear-gradient(0deg,rgba(0,0,0,.55),transparent)}
.field-stability-lb{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:#cfd6dc;margin-bottom:8px}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:rgba(255,255,255,.25);outline:none;border-radius:2px;margin-bottom:18px}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:none;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:none}
.field-msg{font-size:13px;color:#cfd6dc;text-align:center;margin-bottom:14px;min-height:18px}

/* ===== Strap match ===== */
.strap-cols{display:flex;gap:12px}
.strap-col{flex:1;text-align:center}
.strap-crop{aspect-ratio:1/1;border-radius:8px;background:linear-gradient(155deg,#1a2028,#0d1114);border:1px solid var(--divider);display:flex;align-items:center;justify-content:center;position:relative}
.strap-crop svg{width:60%}
.match-result{text-align:center;margin-top:24px}
.match-pct{font-family:var(--mono);font-size:34px;font-weight:600;color:var(--cyan)}

/* ===== Route reconstruction ===== */
.route-map{border-radius:8px;background:radial-gradient(circle at 30% 20%,#141a20 0%,#070a0c 70%);height:160px;margin-bottom:20px;position:relative;border:1px solid var(--divider)}
.route-card{border-radius:8px;background:var(--surface-1);border:1px solid rgba(255,255,255,0.07);padding:14px 16px;cursor:pointer;margin-bottom:10px}
.route-card.selected{border-color:var(--cyan);background:var(--surface-2)}
.route-card-top{display:flex;justify-content:space-between;align-items:center}
.route-letter{font-family:var(--mono);font-weight:700;font-size:14px}

/* ===== Contradiction overlay ===== */
.contra-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.contra-card{width:100%;max-width:340px;border:1px solid var(--divider);border-radius:8px;background:var(--surface-1);padding:16px;margin-bottom:2px}
.contra-line{width:1px;height:20px;background:var(--signal-red);margin:0 auto}

/* ===== Cache puzzle ===== */
.cache-canvas{aspect-ratio:1/1;border-radius:8px;background:#05070a;border:1px solid var(--divider);position:relative;overflow:hidden;margin-bottom:16px}
.cache-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform .05s linear,opacity .05s linear}
.layer-tabs{display:flex;gap:8px;margin-bottom:14px}
.layer-tab{flex:1;text-align:center;padding:9px 0;border-radius:6px;background:var(--surface-1);border:1px solid var(--divider);font-family:var(--mono);font-size:12px;cursor:pointer;color:var(--text-secondary)}
.layer-tab.active{border-color:var(--cyan);color:var(--cyan)}
.ctrl-lb{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--text-muted);letter-spacing:.06em;margin-bottom:6px}

/* ===== Accusation ===== */
.acc-suspect-card{border-radius:8px;background:var(--surface-1);border:1px solid rgba(255,255,255,0.07);padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:10px}
.acc-suspect-card.selected{border-color:var(--cyan)}
.acc-ev-card{border-radius:8px;background:var(--surface-1);border:1px solid rgba(255,255,255,0.07);padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px}
.acc-ev-card.selected{border-color:var(--success)}
.acc-num{width:22px;height:22px;border-radius:50%;background:var(--success);color:#04150c;font-family:var(--mono);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ===== Boot ===== */
.boot{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.boot-line{font-family:var(--mono);font-size:13px;letter-spacing:.12em;color:var(--text-secondary);margin-bottom:10px;text-transform:uppercase}
.boot-title{font-family:var(--mono);font-size:20px;letter-spacing:.18em;font-weight:600}
.boot-progress{width:160px;height:1px;background:var(--divider);margin:20px auto;position:relative;overflow:hidden}
.boot-progress i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--cyan);transition:width 1.2s linear}
.boot-skip{position:absolute;bottom:32px;right:24px;font-family:var(--mono);font-size:11px;color:var(--text-muted);background:none;border:none;cursor:pointer;padding:10px;letter-spacing:.06em}

/* ===== MK reveal / intrusion ===== */
.mk-full{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.mk-line{font-family:var(--mono);font-size:18px;letter-spacing:.06em;line-height:1.6;margin-bottom:6px;opacity:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.mk-line.show{animation:fadeUp .5s ease forwards}
.mk-sig{font-family:var(--mono);font-size:13px;color:var(--signal-red);letter-spacing:.2em;margin-top:24px;opacity:0}
@keyframes glitch{0%{transform:translateX(0)}20%{transform:translateX(-2px)}40%{transform:translateX(2px)}60%{transform:translateX(-1px)}100%{transform:translateX(0)}}
.glitching{animation:glitch .15s linear}

/* ===== Corner UI ===== */
.corner-btn{position:fixed;top:calc(16px + env(safe-area-inset-top,0));left:20px;z-index:40;width:40px;height:40px;border-radius:50%;background:rgba(8,10,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.corner-btn svg{width:18px;height:18px}
.corner-btn .newdot{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:2px solid var(--bg)}
.corner-status{position:fixed;top:calc(16px + env(safe-area-inset-top,0));right:20px;z-index:40;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--amber);background:rgba(8,10,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:9px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.1)}

/* ===== Drawer menu (replaces bottom nav) ===== */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45;display:flex;justify-content:flex-end}
@keyframes drawerIn{from{transform:translateX(24px);opacity:.5}to{transform:translateX(0);opacity:1}}
.drawer{width:76%;max-width:280px;height:100%;background:var(--surface-2);padding:calc(24px + env(safe-area-inset-top,0)) 16px calc(24px + env(safe-area-inset-bottom,0));animation:drawerIn .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--divider)}
.drawer-item{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:6px;background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:14px;font-weight:600;position:relative;text-align:left;font-family:inherit}
.drawer-item svg{width:18px;height:18px;flex-shrink:0}
.drawer-item.active{color:var(--text-primary);background:var(--surface-3)}
.drawer-item .newdot{position:absolute;top:10px;left:34px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.drawer-foot{margin-top:auto;font-family:var(--mono);font-size:10px;color:var(--text-muted);letter-spacing:.06em;padding:12px}

/* ===== Scene header (background scene + character) ===== */
.scene-header{position:relative;height:30vh;min-height:180px;margin:0 -20px 20px;background-size:cover;background-position:center;overflow:hidden;background-color:#0d1114;flex-shrink:0}
.scene-header-tall{height:50vh;min-height:320px}
.scene-header-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.3;color:var(--text-secondary)}
.scene-header-placeholder svg{width:56px;height:56px}
.scene-char{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:100%;max-width:82%;object-fit:contain;object-position:bottom}
.scene-char-placeholder{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:52%;height:80%;opacity:.45;display:flex;align-items:flex-end;justify-content:center;color:var(--text-secondary)}
.scene-char-placeholder svg{width:70%;height:70%}
.scene-header-grad{position:absolute;inset:0;background:linear-gradient(0deg, var(--bg) 0%, rgba(8,10,12,.2) 44%, transparent 68%)}
.scene-header-title{position:absolute;left:20px;right:20px;bottom:14px}
@media (max-width:374px){ .scene-header{margin:0 -16px 20px} }

/* ===== Asset manager ===== */
.asset-thumb{width:64px;height:64px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background-size:cover;background-position:center;background-color:var(--surface-3);color:var(--text-muted)}
label.btn{display:inline-flex}

.chrome-spacer{height:44px}

/* ===== Empty / lock / error ===== */
.state-block{text-align:center;padding:48px 20px}
.state-block .t-label{margin-bottom:8px}
.lock-icon{width:32px;height:32px;margin:0 auto 14px;opacity:.4}
</style>
</head>

];
function loadAssets(){ try{ return JSON.parse(localStorage.getItem('mkAssetsV1'))||{}; }catch(e){ return {}; } }
function saveAssets(){ try{ localStorage.setItem('mkAssetsV1', JSON.stringify(assets)); }catch(e){ alert('저장 공간이 부족합니다. 이미지 크기를 줄여서 다시 시도하세요.'); } }
let assets=loadAssets();
function getAsset(key){ return assets[key] || null; }
function handleAssetUpload(key, inputEl){
  const file=inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const maxDim = key.indexOf('char_')===0 ? 640 : 960;
      let w=img.width, h=img.height;
      if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      assets[key]=canvas.toDataURL('image/png');
      saveAssets();
      render();
    };
    img.onerror=function(){ alert('이미지를 불러올 수 없습니다.'); };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function clearAsset(key){ delete assets[key]; saveAssets(); render(); }

function sceneHeader(bgKey, opts){
  opts=opts||{};
  const bgUrl=getAsset(bgKey);
  const charUrl=opts.charKey ? getAsset(opts.charKey) : null;
  return `<div class="scene-header${opts.tall?' scene-header-tall':''}" style="${bgUrl?`background-image:url('${bgUrl}')`:''}">
    ${!bgUrl? `<div class="scene-header-placeholder">${icon(opts.placeholderIcon||'photo')}</div>` : ''}
    ${opts.charKey ? (charUrl? `<img class="scene-char" src="${charUrl}">` : `<div class="scene-char-placeholder">${icon('bust')}</div>`) : ''}
    <div class="scene-header-grad"></div>
    ${opts.title ? `<div class="scene-header-title">
      ${opts.eyebrow? `<div class="t-label" style="color:rgba(255,255,255,.72)">${esc(opts.eyebrow)}</div>` : ''}
      <div class="t-h2" style="color:#fff">${opts.title}</div>
      ${opts.sub? `<div style="margin-top:2px">${opts.sub}</div>` : ''}
    </div>` : ''}
  </div>`;
}
function suspectBgKey(id){ return id==='leo' ? 'bg_cafe' : id==='mina' ? 'bg_gallery' : 'bg_delivery'; }
function suspectCharKey(id){ return 'char_'+id; }

/* =========================================================
   AUDIO (synthesized, self-contained)
   ========================================================= */
let audioCtx=null;
function ac(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
function beep(freq, dur, type, gain){
  if(state_settings.muted) return;
  const c=ac(); if(!c) return;
  try{
    const osc=c.createOscillator(), g=c.createGain();
    osc.type=type||'sine'; osc.frequency.value=freq;
    g.gain.value=gain||0.05;
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(); osc.stop(c.currentTime+dur);
  }catch(e){}
}
function sfxTap(){ beep(720,0.05,'square',0.02); }
function sfxEvidence(){ beep(880,0.12,'sine',0.05); setTimeout(()=>beep(1320,0.14,'sine',0.04),80); }
function sfxContradiction(){ beep(140,0.35,'sine',0.06); setTimeout(()=>beep(98,0.5,'sine',0.06),160); }
function sfxSolved(){ beep(660,0.08,'triangle',0.05); setTimeout(()=>beep(990,0.16,'triangle',0.05),90); }
function sfxIntrusion(){ beep(60,0.9,'sine',0.08); }
function haptic(level){
  if(state_settings.hapticsOff) return;
  if(!navigator.vibrate) return;
  try{
    if(level==='small') navigator.vibrate(10);
    else if(level==='medium') navigator.vibrate([12,30,12]);
    else if(level==='heavy') navigator.vibrate([20,40,20,40,30]);
  }catch(e){}
}

function evidenceUnlocked(e){ return !e.unlockFlag || progress.flags[e.unlockFlag]; }
function unlockedEvidence(){ return evidenceList().filter(evidenceUnlocked); }
function findEvidence(id){ return evidenceList().find(e=>e.id===id); }

/* =========================================================
   PROGRESS / STATE
   ========================================================= */
function loadProgress(){
  try{
    const p=JSON.parse(localStorage.getItem('operationMkProgressV1'));
    if(p) return p;
  }catch(e){}
  return {
    bootSeen:false,
    flags:{
      operaSolved:false, mina2Done:false, bridgeSolved:false, strapMatchSeen:false,
      routeSolved:false, contradictionSeen:false, leo2Done:false, cacheSolved:false,
      mkRevealSeen:false, finalDone:false, accusationCorrect:false, caseClosedSeen:false, mkIntrusionSeen:false
    },
    leo2Presented:[], finalPresented:[], hintsUsed:0, contradictions:0, viewedEvidence:[]
  };
}
function saveProgress(){ try{ localStorage.setItem('operationMkProgressV1', JSON.stringify(progress)); }catch(e){} }
let progress=loadProgress();
let state_settings={ muted:false, hapticsOff:false };
let state={ screen:'boot' };
let sheetState=null;

function go(screen, extra){ state=Object.assign({screen:screen}, extra||{}); sheetState=null; render(); window.scrollTo(0,0); }
function setFlag(name, val){ progress.flags[name]= (val===undefined?true:val); saveProgress(); }

/* =========================================================
   TOP BAR / NAV
   ========================================================= */
const NAV_TABS=[
  {id:'case', label:'CASE', icon:'folder'},
  {id:'evidence', label:'EVIDENCE', icon:'layers'},
  {id:'suspects', label:'SUSPECTS', icon:'users'},
  {id:'lab', label:'LAB', icon:'waveform'},
  {id:'assets', label:'ASSETS', icon:'photo'},
  {id:'more', label:'MORE', icon:'grid'},
];
function tabForScreen(s){
  if(['dashboard','briefing'].includes(s)) return 'case';
  if(['evidenceIndex','evidenceDetail'].includes(s)) return 'evidence';
  if(['suspectIndex','suspectProfile','interrogation'].includes(s)) return 'suspects';
  if(['lab','routeReconstruction','cachePuzzle','strapMatch'].includes(s)) return 'lab';
  if(['assets'].includes(s)) return 'assets';
  if(['more'].includes(s)) return 'more';
  return null;
}
function hasNewEvidence(){ return unlockedEvidence().some(e=>e.status==='new'); }
function labHasNew(){
  const f=progress.flags;
  return (!f.operaSolved) || (f.operaSolved && !f.bridgeSolved) || (f.bridgeSolved && !f.routeSolved) || (f.leo2Done && !f.cacheSolved);
}
function stageLabel(){
  const f=progress.flags;
  if(f.caseClosedSeen) return 'CLOSED';
  if(f.finalDone) return 'FINAL';
  if(f.leo2Done) return 'STAGE 4';
  if(f.mina2Done) return 'STAGE 3';
  if(f.operaSolved) return 'STAGE 2';
  return 'STAGE 1';
}
const NO_CHROME_SCREENS=['boot','field','contradiction','mkReveal','mkIntrusion','accusationSuccess'];
function renderTopbar(){
  const slot=document.getElementById('topbar-slot');
  if(NO_CHROME_SCREENS.includes(state.screen)){ slot.innerHTML=''; return; }
  const newCount=unlockedEvidence().filter(e=>e.status==='new').length;
  slot.innerHTML=`<div class="corner-status">${newCount>0? newCount+' NEW':stageLabel()}</div>`;
}
let drawerOpen=false;
function renderNav(){
  const slot=document.getElementById('nav-slot');
  if(NO_CHROME_SCREENS.includes(state.screen)){ slot.innerHTML=''; drawerOpen=false; return; }
  const active=tabForScreen(state.screen);
  slot.innerHTML=`<button class="corner-btn" onclick="toggleDrawer()">${icon('grid')}${(hasNewEvidence()||labHasNew())?'<span class="newdot"></span>':''}</button>
  ${drawerOpen? `<div class="drawer-overlay" onclick="closeDrawerBg(event)">
    <div class="drawer" onclick="event.stopPropagation()">
      ${NAV_TABS.map(t=>{
        const isActive=t.id===active;
        let showDot=false;
        if(t.id==='evidence') showDot=hasNewEvidence();
        if(t.id==='lab') showDot=labHasNew();
        return `<button class="drawer-item${isActive?' active':''}" onclick="navTo('${t.id}')">
          ${icon(t.icon)}<span>${t.label}</span>${showDot?'<span class="newdot"></span>':''}
        </button>`;
      }).join('')}
      <div class="drawer-foot">MK-01 · ${stageLabel()}</div>
    </div>
  </div>` : ''}`;
}
function toggleDrawer(){ sfxTap(); drawerOpen=!drawerOpen; renderNav(); }
function closeDrawerBg(ev){ if(ev.target.classList.contains('drawer-overlay')){ drawerOpen=false; renderNav(); } }
function navTo(tabId){
  sfxTap(); haptic('small'); drawerOpen=false;
  if(tabId==='case') go('dashboard');
  else if(tabId==='evidence') go('evidenceIndex');
  else if(tabId==='suspects') go('suspectIndex');
  else if(tabId==='lab') go('lab');
  else if(tabId==='assets') go('assets');
  else if(tabId==='more') go('more');
}

/* =========================================================
   BOOT SEQUENCE
   ========================================================= */
function bootHtml(){
  return `<div class="boot" id="bootRoot">
    <div class="boot-line" id="bootLine">OPERATION MK</div>
    <div class="boot-progress"><i id="bootBar"></i></div>
    <button class="boot-skip" onclick="finishBoot()">SKIP</button>
  </div>`;
}
function runBoot(){
  const line=document.getElementById('bootLine');
  const bar=document.getElementById('bootBar');
  if(!line) return;
  const steps=[
    {t:0, text:'OPERATION MK', big:true},
    {t:800, text:'ESTABLISHING SECURE CHANNEL'},
    {t:1500, bar:true},
    {t:2200, text:'IDENTITY CONFIRMED'},
    {t:2800, text:'WELCOME, DETECTIVE.'},
    {t:3400, done:true},
  ];
  steps.forEach(s=>{
    setTimeout(()=>{
      if(state.screen!=='boot') return;

function setupEvidenceZoom(){
  const box=document.getElementById('evMedia');
  const inner=document.getElementById('evMediaInner');
  if(!box || !inner) return;
  let zoomed=false, lastTap=0;
  let ox=0, oy=0, dragging=false, sx=0, sy=0;
  function apply(){ inner.style.transform=`translate(${ox}px,${oy}px) scale(${zoomed?2.1:1})`; }
  box.addEventListener('touchend', ()=>{
    const now=Date.now();
    if(now-lastTap<300){ zoomed=!zoomed; if(!zoomed){ox=0;oy=0;} apply(); }
    lastTap=now;
  });
  box.addEventListener('dblclick', ()=>{ zoomed=!zoomed; if(!zoomed){ox=0;oy=0;} apply(); });
  box.addEventListener('pointerdown', e=>{ if(!zoomed) return; dragging=true; sx=e.clientX-ox; sy=e.clientY-oy; });
  window.addEventListener('pointermove', e=>{ if(!dragging) return; ox=e.clientX-sx; oy=e.clientY-sy; apply(); });
  window.addEventListener('pointerup', ()=>{ dragging=false; });
}

  const data=INTERRO_SESSIONS[session];

  if(!data.log) data.log=[];
  data.log.push({type:'player',text:q.q},{type:'npc',text:q.a});
  if(q.advance){ Object.assign(progress.flags, q.advance); saveProgress(); }

function presentEvidence(id, session, evId){
  sheetState=null;
  const data=INTERRO_SESSIONS[session];
  const e=findEvidence(evId);
  const reaction = data.reactions && data.reactions[evId];
  if(!data.log) data.log=[];
  data.log.push({type:'system',text:'PRESENTED: '+e.code},{type:'npc',text: reaction? reaction.line : data.genericReaction});
  if(reaction){
    if(!data._presented) data._presented=[];
    data._presented.push(evId);
    if(reaction.moodShift) data.mood=reaction.moodShift;
    if(reaction.unlockQuestions){ if(!data.questions) data.questions=[]; data.questions.push(...reaction.unlockQuestions); }
    if(reaction.advance){ Object.assign(progress.flags, reaction.advance); saveProgress(); }
  }
  render();
}

/* =========================================================
   DELETED CACHE PUZZLE
   ========================================================= */
const CACHE_TARGETS={ A:{rot:15,scale:105,op:70}, C:{rot:-20,scale:95,op:80}, D:{rot:8,scale:110,op:60} };
let cacheState=null;
function initCacheState(){
  if(cacheState) return;
  cacheState={ active:'A', layers:{ A:{rot:0,scale:100,op:50}, B:{rot:15,scale:105,op:100}, C:{rot:0,scale:100,op:50}, D:{rot:0,scale:100,op:50} } };
}
function cacheStability(){
  let total=0, n=0;
  ['A','C','D'].forEach(k=>{
    const t=CACHE_TARGETS[k], l=cacheState.layers[k];
    const dRot=Math.abs(t.rot-l.rot)/45, dScale=Math.abs(t.scale-l.scale)/40, dOp=Math.abs(t.op-l.op)/80;
    const closeness=1-Math.min(1,(dRot+dScale+dOp)/3);
    total+=closeness; n++;
  });
  return Math.round((total/n)*100);
}
function cacheBand(v){
  if(v<=40) return 'UNSTABLE';
  if(v<=70) return 'PARTIAL';
  if(v<=90) return 'NEAR MATCH';
  return 'STABILIZED';
}
function cachePuzzleHtml(){
  if(!progress.flags.leo2Done) return lockedHtml('레오 2차 심문을 먼저 완료하십시오.');
  initCacheState();
  if(progress.flags.cacheSolved){
    return `<div class="screen">
      <div class="chrome-spacer"></div>
      <div class="t-h2">DELETED MEDIA RECOVERY</div>
      <div class="cache-canvas" style="display:flex;align-items:center;justify-content:center">${icon('photo')}</div>
      <div class="badge badge-connected" style="margin:12px auto 0;display:table"><span class="bdot"></span>POSSESSION VERIFIED</div>
      <button class="btn btn-primary" style="margin-top:20px" onclick="go('mkReveal')">CONTINUE →</button>
    </div>`;
  }
  const stab=cacheStability();
  const active=cacheState.active;
  const l=cacheState.layers[active];
  return `<div class="screen">
    <div class="chrome-spacer"></div>
    <div class="t-h2">DELETED MEDIA RECOVERY</div>
    <div class="cache-canvas" id="cacheCanvas">
      ${['A','B','C','D'].map(k=>{
        const ll=cacheState.layers[k];
        return `<div class="cache-layer" style="transform:rotate(${ll.rot}deg) scale(${ll.scale/100});opacity:${ll.op/100}">${icon('layers')}</div>`;
      }).join('')}
    </div>
    <div class="layer-tabs">${['A','B','C','D'].map(k=>`<div class="layer-tab${active===k?' active':''}" onclick="setCacheLayer('${k}')">${k}${k==='B'?' (REF)':''}</div>`).join('')}</div>
    ${active==='B' ? `<div class="t-small dim" style="text-align:center">기준 레이어는 고정되어 있습니다.</div>` : `
    <div class="ctrl-lb"><span>ROTATE</span><span>${l.rot}°</span></div>
    <input class="slider" type="range" min="-45" max="45" value="${l.rot}" oninput="updCache('rot',this.value)">
    <div class="ctrl-lb"><span>SCALE</span><span>${l.scale}%</span></div>
    <input class="slider" type="range" min="80" max="120" value="${l.scale}" oninput="updCache('scale',this.value)">
    <div class="ctrl-lb"><span>OPACITY</span><span>${l.op}%</span></div>
    <input class="slider" type="range" min="20" max="100" value="${l.op}" oninput="updCache('op',this.value)">
    <button class="btn btn-secondary btn-sm" style="margin-bottom:8px" onclick="resetCacheLayer()">RESET</button>
    `}
    <div class="field-stability-lb" style="color:var(--text-secondary)"><span class="t-label">STABILITY</span><span class="mono">${cacheBand(stab)}</span></div>
    <button class="btn btn-primary" style="margin-top:14px" onclick="stabilizeCache()">STABILIZE</button>
  </div>`;
}
function setCacheLayer(k){ sfxTap(); cacheState.active=k; render(); }
function updCache(prop, val){
  cacheState.layers[cacheState.active][prop]=Number(val);
  const canvas=document.getElementById('cacheCanvas');
  if(canvas){
    canvas.querySelectorAll('.cache-layer').forEach((el,i)=>{
      const k=['A','B','C','D'][i]; const ll=cacheState.layers[k];
      el.style.transform=`rotate(${ll.rot}deg) scale(${ll.scale/100})`;
      el.style.opacity=ll.op/100;
    });
  }
  const stabEl=document.querySelector('.field-stability-lb span.mono');
  if(stabEl) stabEl.textContent=cacheBand(cacheStability());
}
function resetCacheLayer(){ sfxTap(); cacheState.layers[cacheState.active]={rot:0,scale:100,op:50}; render(); }
function stabilizeCache(){
  const stab=cacheStability();
  if(stab>90){
    haptic('medium'); sfxSolved();
    setFlag('cacheSolved');
    render();
  }else{
    haptic('small');
  }
}

  return `<div class="screen">
    ${sceneHeader('bg_quay',{title:'SUBMIT ACCUSATION', eyebrow:'CASE MK-01'})}
    <div class="t-small" style="color:var(--signal-red);margin:10px 0 20px">A THEORY IS NOT EVIDENCE.</div>

    <div class="section-lb">STEP 1 — SELECT SUSPECT</div>
    ${suspects.map(id=>{
      const s=SUSPECTS[id];
      return `<div class="acc-suspect-card${accState.suspect===id?' selected':''}" onclick="selectAccSuspect('${id}')">
        <div class="suspect-thumb portrait" style="width:44px;height:44px">${portraitSvg()}</div>
        <div><div class="t-body" style="font-weight:600">${s.nameKr}</div><div class="mono t-small dim">${s.nameEn}</div></div>
      </div>`;
    }).join('')}

    <div class="section-lb">STEP 2 — KEY EVIDENCE (MAX 5)</div>
    ${unlockedEvidence().map(e=>{
      const idx=accState.evidence.indexOf(e.id);
      return `<div class="acc-ev-card${idx>-1?' selected':''}" onclick="toggleAccEvidence('${e.id}')">
        ${idx>-1? `<div class="acc-num mono">${String(idx+1).padStart(2,'0')}</div>` : `<div style="width:22px;flex-shrink:0"></div>`}
        <div style="min-width:0"><div class="evcode mono">${e.code}</div><div class="t-small" style="margin-top:2px">${esc(e.title)}</div></div>
      </div>`;
    }).join('')}

    <button class="btn btn-primary" style="margin-top:20px" onclick="submitAccusation()">SUBMIT ACCUSATION</button>
    <div id="accMsg" class="t-body" style="margin-top:16px"></div>
  </div>`;
}
function selectAccSuspect(id){ sfxTap(); accState.suspect=id; render(); }
function toggleAccEvidence(id){
  sfxTap();
  const idx=accState.evidence.indexOf(id);
  if(idx>-1) accState.evidence.splice(idx,1);
  else if(accState.evidence.length<5) accState.evidence.push(id);
  render();
}
function submitAccusation(){
  const msgEl=document.getElementById('accMsg');
  if(!accState.suspect){ msgEl.textContent='용의자를 먼저 선택하십시오.'; return; }
  if(accState.suspect!=='leo'){
    haptic('small');
    msgEl.innerHTML='<span class="badge badge-contradiction"><span class="bdot"></span>ACCUSATION REJECTED</span><div style="margin-top:10px">피의자의 신원이 사건과 일치하지 않습니다.</div>';
    return;
  }
  const has=id=>accState.evidence.includes(id);
  if(!has('E10') && !has('E12')){
    haptic('small');
    msgEl.innerHTML='<span class="badge badge-contradiction"><span class="bdot"></span>ACCUSATION REJECTED</span><div style="margin-top:10px">피의자의 이동은 확인되지 않았습니다.</div>';
    return;
  }
  if(!has('E14')){
    haptic('small');
    msgEl.innerHTML='<span class="badge badge-contradiction"><span class="bdot"></span>ACCUSATION REJECTED</span><div style="margin-top:10px">피의자의 이동은 확인됐습니다.<br>그러나 K-01 소지를 입증할 증거가 부족합니다.</div>';
    return;
  }
  haptic('heavy'); sfxSolved();
  setFlag('accusationCorrect');
  go('accusationSuccess');
}
function accusationSuccessHtml(){
  const steps=['ACCUSATION SUBMITTED','IDENTITY VERIFIED','MOVEMENT VERIFIED','POSSESSION VERIFIED','ACCUSATION ACCEPTED','LEO PARK','CASE CLOSED'];
  setTimeout(()=>{
    steps.forEach((_,i)=>{
      setTimeout(()=>{
        const el=document.getElementById('accStep');
        if(el) el.textContent=steps[i];
        if(i===steps.length-1){ setTimeout(()=>go('caseClosed'),900); }
      }, i*700);
    });
  }, 50);
  return `<div class="mk-full">
    <div id="accStep" class="t-h1 mono" style="opacity:.95">ACCUSATION SUBMITTED</div>
  </div>`;
}

/* =========================================================
   CASE CLOSED / MK INTRUSION
   ========================================================= */
function caseClosedHtml(){
  progress.flags.caseClosedSeen=true; saveProgress();
  const total=evidenceList().length, got=unlockedEvidence().length;
  return `<div class="screen">
    ${sceneHeader('bg_quay',{title:'CASE 01 — CLOSED', eyebrow:'MK-01'})}
    <div class="card"><div class="card-row" style="justify-content:space-between">
      <div><div class="t-label">EVIDENCE</div><div class="t-h2 mono" style="margin-top:4px">${got} / ${total}</div></div>
      <div><div class="t-label">CONTRADICTIONS</div><div class="t-h2 mono" style="margin-top:4px">${String(progress.contradictions||1).padStart(2,'0')}</div></div>
      <div><div class="t-label">HINTS USED</div><div class="t-h2 mono" style="margin-top:4px">${String(progress.hintsUsed||0).padStart(2,'0')}</div></div>
    </div></div>
    ${!progress.flags.mkIntrusionSeen ? `<div class="card card-tap" style="margin-top:24px;border-color:rgba(217,65,65,.35)" onclick="go('mkIntrusion')">
      <div class="badge badge-contradiction"><span class="bdot"></span>1 UNRESOLVED SIGNAL</div>
      <div class="t-small dim" style="margin-top:8px">터치하여 확인.</div>
    </div>` : ''}
    <button class="btn btn-secondary" style="margin-top:24px" onclick="go('dashboard')">← DASHBOARD</button>
  </div>`;
}
function mkIntrusionHtml(){
  setTimeout(()=>{
    haptic('heavy'); sfxIntrusion();
    document.querySelectorAll('#mkIntrusionLines .mk-line').forEach((l,i)=>{
      setTimeout(()=>l.classList.add('show'), 150+i*700);
    });
    setTimeout(()=>{ const s=document.getElementById('mkIntrusionSig'); if(s){s.style.opacity=1;} }, 150+2*700+400);
  },50);
  progress.flags.mkIntrusionSeen=true; saveProgress();
  return `<div class="mk-full">
    <div id="mkIntrusionLines">
      <div class="mk-line t-h2">YOU FOUND</div>
      <div class="mk-line t-h2">THE MISSING TIME.</div>
      <div class="mk-line t-h2" style="color:var(--signal-red)">NOT THE KEY.</div>
    </div>
    <div id="mkIntrusionSig" class="mk-sig" style="transition:opacity .6s ease">M.K.</div>
    <button class="btn btn-secondary" style="margin-top:48px;max-width:240px" onclick="go('dashboard')">RETURN</button>
  </div>`;
}

/* =========================================================
   ASSET MANAGER
   ========================================================= */
function assetsHtml(){
  return `<div class="screen">
    ${sceneHeader('bg_lab',{title:'ASSET MANAGER', eyebrow:'배경 · 인물 이미지 업로드', placeholderIcon:'photo'})}
    <div class="t-small dim" style="margin-bottom:16px">업로드한 이미지는 이 기기의 브라우저에만 저장됩니다. 배경은 가로 사진, 인물은 투명 배경 PNG를 권장합니다.</div>
    ${ASSET_DEFS.map(a=>assetCardHtml(a)).join('')}
  </div>`;
}
function assetCardHtml(a){
  const url=getAsset(a.key);
  return `<div class="card">
    <div class="card-row" style="justify-content:space-between;align-items:flex-start">
      <div style="min-width:0">
        <div class="t-label">${a.type==='character'?'CHARACTER':'BACKGROUND'}</div>
        <div class="t-body" style="font-weight:600;margin-top:2px">${esc(a.label)}</div>
      </div>
      <div class="asset-thumb" style="${url?`background-image:url('${url}')`:''}">${!url? icon(a.placeholderIcon||'photo') : ''}</div>
    </div>
    <div class="btn-row" style="margin-top:12px">
      <label class="btn btn-secondary btn-sm">UPLOAD<input type="file" accept="image/*" style="display:none" onchange="handleAssetUpload('${a.key}', this)"></label>
      ${url? `<button class="btn btn-danger btn-sm" onclick="clearAsset('${a.key}')">REMOVE</button>` : ''}
    </div>
  </div>`;
}

/* =========================================================
   MORE tab
   ========================================================= */
function moreHtml(){
  return `<div class="screen">
    ${sceneHeader('bg_quay',{title:'MORE', eyebrow:'SETTINGS & SUPPORT'})}
    <div class="section-lb">SETTINGS</div>
    <div class="card">
      <div class="card-row" style="justify-content:space-between">
        <span class="t-body">SOUND</span>
        <button class="btn btn-secondary btn-sm" style="width:auto;padding:0 16px" onclick="toggleSetting('muted')">${state_settings.muted?'OFF':'ON'}</button>
      </div>
      <div class="card-row" style="justify-content:space-between;margin-top:14px">
        <span class="t-body">HAPTICS</span>
        <button class="btn btn-secondary btn-sm" style="width:auto;padding:0 16px" onclick="toggleSetting('hapticsOff')">${state_settings.hapticsOff?'OFF':'ON'}</button>
      </div>
    </div>
    <div class="section-lb">HINT</div>
    <div class="card">
      <div class="t-body">${esc(currentHint())}</div>
      <button class="btn btn-secondary btn-sm" style="margin-top:14px" onclick="useHint()">USE HINT</button>
    </div>
    <div class="section-lb">DANGER ZONE</div>
    <button class="btn btn-danger" onclick="confirmReset()">RESET INVESTIGATION</button>
  </div>`;
}
function toggleSetting(k){ sfxTap(); state_settings[k]=!state_settings[k]; render(); }
function currentHint(){
  const f=progress.flags;
  if(!f.operaSolved) return 'LAB에서 오페라하우스 현장 미션을 시작하십시오. 슬라이더를 움직여 NEAR MATCH 구간을 찾으세요.';
  if(!f.mina2Done) return '윤민아를 재심문하고, 확보한 사진 증거를 제시하십시오.';
  if(!f.bridgeSolved) return 'LAB에서 하버브리지 현장 미션을 진행하십시오.';
  if(!f.routeSolved) return 'LAB에서 이동 경로를 재구성하십시오. 정답은 워터프론트 경로입니다.';
  if(!f.leo2Done) return '레오를 재심문하고, 스트랩 관련 증거를 순서대로 제시하십시오.';
  if(!f.cacheSolved) return 'LAB에서 삭제된 미디어 레이어 A, C, D를 조정해 STABILIZED 상태를 만드십시오.';
  if(!f.finalDone) return '레오와의 최종 심문에서 복구된 이미지와 M.K. 메시지 조각을 제시하십시오.';
  if(!f.accusationCorrect) return '레오 박을 지목하고, 이동·소지를 증명하는 증거를 함께 제출하십시오.';
  return '사건은 종결되었습니다.';
}
function useHint(){ sfxTap(); progress.hintsUsed=(progress.hintsUsed||0)+1; saveProgress(); render(); }
function confirmReset(){
  sheetState={ type:'confirmReset' }; renderConfirm();
}
function renderConfirm(){
  const slot=document.getElementById('overlay-slot');
  slot.innerHTML=`<div class="sheet-overlay" onclick="cancelReset(event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="t-h3">진행 상황을 초기화할까요?</div>
      <div class="t-small dim" style="margin-top:8px">모든 증거와 심문 기록이 삭제됩니다.</div>
      <div class="btn-row" style="margin-top:20px">
        <button class="btn btn-secondary" onclick="cancelReset()">CANCEL</button>
        <button class="btn btn-danger" onclick="doReset()">RESET</button>
      </div>
    </div>
  </div>`;
}
function cancelReset(ev){ if(ev && !ev.target.classList.contains('sheet-overlay')) return; sheetState=null; document.getElementById('overlay-slot').innerHTML=''; }
function doReset(){
  localStorage.removeItem('operationMkProgressV1');
  progress=loadProgress();
  routeSelected=null; cacheState=null; accState={suspect:null,evidence:[]};
  sheetState=null; document.getElementById('overlay-slot').innerHTML='';
  go('dashboard');
}

/* =========================================================
   LOCKED STATE
   ========================================================= */
function lockedHtml(note){
  return `<div class="screen">
    <div class="chrome-spacer"></div>
    <div class="state-block">
      <div class="lock-icon">${icon('lock')}</div>
      <div class="t-label">ACCESS RESTRICTED</div>
      <div class="t-small dim" style="margin-top:10px">${esc(note)}</div>
      <button class="btn btn-secondary" style="margin-top:24px" onclick="go('lab')">← LAB</button>
    </div>
  </div>`;
}

/* =========================================================
   UTIL
   ========================================================= */
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* =========================================================
   RENDER ROOT
   ========================================================= */
function render(){
  const root=document.getElementById('content');
  renderTopbar(); renderNav();
  switch(state.screen){
    case 'boot': root.innerHTML=''; document.getElementById('overlay-slot').innerHTML=bootHtml(); root.className='content'; setTimeout(runBoot,30); return;
    case 'dashboard': root.innerHTML=dashboardHtml(); break;
    case 'briefing': root.innerHTML=briefingHtml(); break;
    case 'evidenceIndex': root.innerHTML=evidenceIndexHtml(); break;
    case 'evidenceDetail': root.innerHTML=evidenceDetailHtml(state.evId); setTimeout(setupEvidenceZoom,30); break;
    case 'suspectIndex': root.innerHTML=suspectIndexHtml(); break;
    case 'suspectProfile': root.innerHTML=suspectProfileHtml(state.sId); break;
    case 'interrogation': root.innerHTML=interrogationHtml(state.sId); break;
    case 'lab': root.innerHTML=labHtml(); break;
    case 'field': document.getElementById('overlay-slot').innerHTML=fieldMissionHtml(state.mission); root.innerHTML=''; return;
    case 'strapMatch': root.innerHTML=strapMatchHtml(); break;
    case 'routeReconstruction': root.innerHTML=routeReconstructionHtml(); break;
    case 'contradiction': document.getElementById('overlay-slot').innerHTML=contradictionHtml(); root.innerHTML=''; return;
    case 'cachePuzzle': root.innerHTML=cachePuzzleHtml(); break;
    case 'mkReveal': document.getElementById('overlay-slot').innerHTML=mkRevealHtml(); root.innerHTML=''; return;
    case 'accusation': root.innerHTML=accusationHtml(); break;
    case 'accusationSuccess': document.getElementById('overlay-slot').innerHTML=accusationSuccessHtml(); root.innerHTML=''; return;
    case 'caseClosed': root.innerHTML=caseClosedHtml(); break;
    case 'mkIntrusion': document.getElementById('overlay-slot').innerHTML=mkIntrusionHtml(); root.innerHTML=''; return;
    case 'assets': root.innerHTML=assetsHtml(); break;
    case 'more': root.innerHTML=moreHtml(); break;
    default: root.innerHTML=dashboardHtml();
  }
  document.getElementById('overlay-slot').innerHTML='';
}

/* boot */
if(progress.bootSeen){ state={screen:'dashboard'}; }
render();
</script>
</body>
</html>
