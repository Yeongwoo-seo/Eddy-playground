<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>도시락 입금 확인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --primary:#E8741E;--primary-hover:#D4681A;--primary-light:#FFF3EB;
  --primary-gradient:linear-gradient(135deg,#E8741E 0%,#F5943A 100%);
  --bg:#F5F5F5;--white:#FFFFFF;
  --grey50:#FAFAFA;--grey100:#F2F4F6;--grey200:#E5E8EB;--grey300:#D1D6DB;
  --grey500:#8B95A1;--grey700:#4E5968;--black:#191F28;
  --success:#1DB847;--info:#3182F6;
}
html,body{height:100%}
body{background:var(--bg);color:var(--black);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;overflow-x:hidden;display:flex;justify-content:center}
input,textarea{-webkit-user-select:text;user-select:text}
.app{width:100%;max-width:500px;min-height:100vh;padding:0 16px 40px}
.hl{color:var(--primary)}

.header{background:var(--primary-gradient);color:var(--white);padding:20px 24px 28px;border-radius:0 0 28px 28px;margin:0 -16px 20px;}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back-btn{color:var(--white);text-decoration:none;font-size:20px;opacity:.9;line-height:1}
.header-logo{font-size:14px;font-weight:600;opacity:.85}
.header-title{font-size:22px;font-weight:700;line-height:1.3}

.section{background:var(--white);border-radius:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:20px;margin-bottom:16px}
.section-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin-bottom:14px}
.count-badge{background:var(--primary-light);color:var(--primary);font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px}

.upload-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px;background:var(--grey100);color:var(--grey700);border-radius:16px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:14px;transition:background .2s}
.upload-btn:active{background:var(--grey200)}

.applicant-input-row{display:flex;gap:8px;margin-bottom:14px}
.text-input{flex:1;background:var(--grey100);border:2px solid transparent;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600;color:var(--black);outline:none;transition:border-color .2s,background .2s;font-family:inherit}
.text-input:focus{border-color:var(--primary);background:var(--white)}
.text-input::placeholder{color:var(--grey300);font-weight:500}
.add-btn{padding:0 20px;background:var(--primary-gradient);color:var(--white);border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer}
.add-btn:active{opacity:.85}

.block-list{display:flex;flex-direction:column;gap:10px;min-height:8px}
.empty-hint{text-align:center;color:var(--grey500);font-size:13px;font-weight:500;padding:18px 0}

.block{display:flex;align-items:center;gap:10px;background:var(--grey50);border:1px solid var(--grey200);border-radius:16px;padding:10px 12px;transition:box-shadow .15s,border-color .15s,transform .15s}
.drag-handle{flex-shrink:0;width:20px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--grey300);font-size:16px;letter-spacing:-2px;cursor:grab;touch-action:none}
.block-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;pointer-events:none}
.block-avatar{width:44px;height:44px;border-radius:10px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;pointer-events:none}
.block-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.block-name-input{width:100%;border:none;background:transparent;font-size:14px;font-weight:700;color:var(--black);outline:none;padding:2px 0;font-family:inherit}
.block-amount-wrap{display:flex;align-items:center;gap:2px}
.block-amount-prefix{font-size:12px;font-weight:600;color:var(--grey500);flex-shrink:0}
.block-amount-input{width:100%;border:none;background:transparent;font-size:12px;font-weight:500;color:var(--grey500);outline:none;padding:0;font-family:inherit}
.block-name-input::placeholder{color:var(--grey300);font-weight:600}
.block-amount-input::placeholder{color:var(--grey300)}
.block-remove{flex-shrink:0;width:26px;height:26px;border:none;background:var(--grey200);color:var(--grey700);border-radius:50%;font-size:14px;line-height:1;cursor:pointer}
.block-remove:active{opacity:.7}

.block.drop-target{border-color:var(--success);box-shadow:0 0 0 3px rgba(29,184,71,0.18);transform:scale(1.02)}
.block.drag-source-hidden{opacity:.35}
.drag-clone{position:fixed;z-index:2000;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,0.18);transform:scale(1.04);opacity:.96}

.hint-text{font-size:12px;color:var(--grey500);font-weight:500;line-height:1.6;margin-top:2px}
.drag-clone .drag-handle{cursor:grabbing}

.history-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.history-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--grey100)}
.history-item:last-child{border-bottom:none}
.history-thumb{width:38px;height:38px;border-radius:10px;object-fit:cover;flex-shrink:0}
.history-thumb-placeholder{width:38px;height:38px;border-radius:10px;background:var(--grey100);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.history-body{flex:1;min-width:0}
.history-names{font-size:14px;font-weight:600;color:var(--black)}
.history-names b{color:var(--primary)}
.history-meta{font-size:12px;color:var(--grey500);font-weight:500;margin-top:2px}
.clear-btn{width:100%;padding:12px;background:var(--grey100);color:var(--grey500);border:none;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer}
.clear-btn:active{opacity:.8}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--black);color:var(--white);font-size:13px;font-weight:600;padding:12px 20px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .3s cubic-bezier(0.2,0.8,0.2,1),transform .3s cubic-bezier(0.2,0.8,0.2,1);z-index:3000;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.ocr-overlay{position:fixed;inset:0;background:rgba(25,31,40,0.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .3s cubic-bezier(0.2,0.8,0.2,1);z-index:4000}
.ocr-overlay.active{opacity:1;pointer-events:auto}
.ocr-spinner{width:36px;height:36px;border-radius:50%;border:4px solid rgba(255,255,255,0.3);border-top-color:var(--white);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ocr-text{color:var(--white);font-size:14px;font-weight:600;text-align:center;padding:0 32px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <a class="back-btn" href="index.html">‹</a>
      <span class="header-logo">Eddy Playground</span>
    </div>
    <div class="header-title">도시락 <span class="hl">입금</span> 확인</div>
  </div>

  <div class="section">
    <div class="section-title">입금자 <span class="count-badge" id="depositorCount">0</span></div>
    <label class="upload-btn" for="depositFile">📷 입금 캡쳐본 업로드</label>
    <input type="file" id="depositFile" accept="image/*" multiple hidden>
    <div class="hint-text">캡쳐본을 올리면 이름을 자동 인식해요. 여러 장을 한 번에 선택할 수 있어요. 인식이 틀리면 직접 수정할 수 있어요.</div>
    <div class="block-list" id="depositorList"></div>
  </div>

  <div class="section">
    <div class="section-title">신청자 <span class="count-badge" id="applicantCount">0</span></div>
    <div class="applicant-input-row">
      <input type="text" id="applicantNameInput" class="text-input" placeholder="이름 입력">
      <button class="add-btn" id="addApplicantBtn">추가</button>
    </div>
    <div class="block-list" id="applicantList"></div>
  </div>

  <div class="section">
    <div class="section-title">✅ 입금 확인 방법</div>
    <div class="hint-text">블럭 왼쪽의 ⠿ 을 잡고 반대쪽 블럭 위로 드래그해서 겹치면 입금 확인 완료! 이름이 정확히 같으면 드래그 없이 자동으로 확정돼요.</div>
  </div>

  <div class="section">
    <div class="section-title">확인 내역 <span class="count-badge" id="historyCount">0</span></div>
    <div class="history-list" id="historyList"></div>
    <button class="clear-btn" id="clearHistoryBtn">내역 전체 삭제</button>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="ocrOverlay" class="ocr-overlay">
  <div class="ocr-spinner"></div>
  <div class="ocr-text" id="ocrText">이름 인식 중이에요...<br>처음 실행 시 조금 걸릴 수 있어요</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<script src="deposit.js"></script>
</body>
</html>
