<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OPERATION MK</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#191F28">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERATION MK">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  display:flex;justify-content:center;
  background:#0B0D12 url('https://images.pexels.com/photos/15225161/pexels-photo-15225161.jpeg?auto=compress&cs=tinysrgb&w=900&h=1400&fit=crop') center/cover no-repeat fixed;
  color:#fff;
}
.overlay{position:fixed;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.35) 40%, rgba(0,0,0,.75) 100%);z-index:0}
.app{position:relative;z-index:1;width:100%;max-width:500px;min-height:100vh;padding:16px;display:flex;flex-direction:column}

.back-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);border:none;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;flex-shrink:0}

.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px}
.lock{font-size:52px;margin-bottom:20px;filter:drop-shadow(0 4px 16px rgba(0,0,0,.4))}
.title{font-size:26px;font-weight:800;letter-spacing:-.3px}
.dday{font-size:16px;font-weight:700;color:rgba(255,255,255,.8);margin-top:10px}
.desc{font-size:14px;color:rgba(255,255,255,.75);font-weight:500;margin-top:22px;line-height:1.7}
.start-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:28px;background:#E8741E;color:#fff;text-decoration:none;font-size:15px;font-weight:700;padding:14px 28px;border-radius:16px;transition:opacity .3s cubic-bezier(0.2,0.8,0.2,1)}
.start-btn:active{opacity:.8}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="app">
  <button class="back-btn" onclick="location.href='schedule.html'">←</button>
  <div class="center">
    <div class="lock">🔓</div>
    <div class="title">OPERATION MK</div>
    <div class="dday">공개됐어 👀</div>
    <div class="desc">준비됐어?<br>지금부터가 진짜 시작이야.</div>
    <a class="start-btn" href="/play/">시작하기 →</a>
  </div>
</div>
</body>
</html>
