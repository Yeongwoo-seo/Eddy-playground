<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>입국준비</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E8741E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="입국준비">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#E8741E;--primary-hover:#D4681A;--primary-light:#FFF3EB;
  --bg:#F5F5F5;--white:#FFFFFF;
  --grey100:#F2F4F6;--grey300:#D1D6DB;--grey500:#8B95A1;--grey700:#4E5968;--black:#191F28;
}
html,body{height:100%}
body{background:var(--bg);color:var(--black);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:500px;min-height:100vh;padding:16px 16px 40px}
.hl{color:var(--primary)}

.top-bar{display:flex;align-items:center;gap:12px;padding:8px 0 20px}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--white);box-shadow:0 2px 12px rgba(0,0,0,0.06);border:none;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--grey700);flex-shrink:0}
.top-title{font-size:20px;font-weight:800}

.nav-list{display:flex;flex-direction:column;gap:14px}
.nav-card{position:relative;display:block;height:150px;border-radius:24px;overflow:hidden;background:var(--grey100) center/cover no-repeat;text-decoration:none;box-shadow:0 2px 12px rgba(0,0,0,0.06);transition:transform .15s}
.nav-card:active{transform:scale(.98)}
.nav-card::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.15) 40%, rgba(0,0,0,.75) 100%)}
.nav-body{position:absolute;left:20px;right:20px;bottom:18px;z-index:1;color:#fff}
.nav-emoji{font-size:22px;margin-bottom:4px;display:block}
.nav-name{font-size:18px;font-weight:800}
.nav-desc{font-size:12.5px;color:rgba(255,255,255,.85);font-weight:500;margin-top:4px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <button class="back-btn" onclick="location.href='schedule.html'">←</button>
    <div class="top-title">🛬 <span class="hl">입국준비</span></div>
  </div>

  <div class="nav-list">
    <a class="nav-card" href="arrival-guide.html" style="background-image:linear-gradient(135deg,#3a2a1a 0%,#1c130a 60%,#0f0b06 100%)">
      <div class="nav-body">
        <span class="nav-emoji">🛬</span>
        <div class="nav-name">입국 절차 안내</div>
        <div class="nav-desc">비자·입국신고서·세관까지 미리 알아두기</div>
      </div>
    </a>

    <a class="nav-card" href="boarding-pass.html" style="background-image:linear-gradient(135deg,#2a2a3a 0%,#13131c 60%,#0a0a0f 100%)">
      <div class="nav-body">
        <span class="nav-emoji">🎫</span>
        <div class="nav-name">탑승권</div>
        <div class="nav-desc">항공권 PDF를 저장해두고 언제든 확인해요</div>
      </div>
    </a>
  </div>
</div>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', { scope: '.' });
}
</script>
</body>
</html>
