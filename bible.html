<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>성경 읽기 진행표</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="성경읽기">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E8741E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23E8741E'/%3E%3Ctext x='50' y='66' font-size='54' text-anchor='middle'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#E8741E;--primary-hover:#D4681A;--primary-light:#FFF3EB;
  --primary-gradient:linear-gradient(135deg,#E8741E 0%,#F5943A 100%);
  --bg:#F5F5F5;--white:#FFFFFF;
  --grey50:#FAFAFA;--grey100:#F2F4F6;--grey200:#E5E8EB;--grey300:#D1D6DB;
  --grey500:#8B95A1;--grey700:#4E5968;--black:#191F28;
  --success:#1DB847;--info:#3182F6;
}
html,body{height:100%}
body{background:var(--bg);color:var(--black);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;overflow-x:hidden;display:flex;justify-content:center}
.app{width:100%;max-width:500px;min-height:100vh;padding:0 16px 40px}
.hl{color:var(--primary)}

.header{background:var(--primary-gradient);color:var(--white);padding:20px 24px 28px;border-radius:0 0 28px 28px;margin:0 -16px 20px}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back-btn{color:var(--white);text-decoration:none;font-size:20px;opacity:.9;line-height:1}
.header-logo{font-size:14px;font-weight:600;opacity:.85}
.header-title{font-size:22px;font-weight:700;line-height:1.3}

.card{background:var(--white);border-radius:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:20px;margin-bottom:16px}

.ov-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ov-label{font-size:14px;font-weight:700;color:var(--grey700)}
.reset-btn{background:var(--grey100);color:var(--grey500);border:none;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer;font-family:inherit}
.reset-btn:active{opacity:.8}
.ov-pct{font-size:32px;font-weight:800;letter-spacing:-.5px;color:var(--primary)}
.bar{width:100%;height:10px;background:var(--grey100);border-radius:20px;overflow:hidden;margin-top:10px}
.bar-fill{height:100%;background:var(--primary-gradient);border-radius:20px;transition:width .3s cubic-bezier(0.2,0.8,0.2,1)}
.ov-sub{font-size:13px;color:var(--grey500);font-weight:500;margin-top:8px}

.stage-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stage-title{font-size:16px;font-weight:700}
.stage-pct{font-size:14px;font-weight:700;color:var(--primary);flex-shrink:0}
.stage-desc{font-size:12.5px;color:var(--grey500);font-weight:500;margin-top:6px;line-height:1.5}
.stage-bar{margin-top:12px}
.stage-bar .bar-fill{background:var(--primary)}

.book-list{margin-top:16px;display:flex;flex-direction:column}
.book-row{display:flex;align-items:center;gap:10px;padding:12px 4px;cursor:pointer;border-top:1px solid var(--grey100)}
.book-list .book-row:first-child{border-top:none}
.book-row:active{background:var(--grey50)}
.book-row-main{flex:1;min-width:0}
.book-name{font-size:14.5px;font-weight:600}
.book-name.done{color:var(--success)}
.book-meta{display:flex;align-items:center;gap:8px;margin-top:6px}
.book-frac{font-size:11.5px;color:var(--grey500);font-weight:600;flex-shrink:0;min-width:44px;white-space:nowrap}
.book-mini-bar{flex:1;height:6px;background:var(--grey100);border-radius:20px;overflow:hidden}
.book-mini-fill{height:100%;background:var(--primary);border-radius:20px}
.book-mini-fill.done{background:var(--success)}
.book-arrow{color:var(--grey300);font-size:16px;flex-shrink:0;transition:transform .2s}
.book-arrow.open{transform:rotate(90deg);color:var(--primary)}

.ch-panel{padding:4px 4px 16px}
.ch-actions{display:flex;gap:8px;margin-bottom:12px}
.ch-action{flex:1;background:var(--grey100);color:var(--grey700);border:none;font-size:12px;font-weight:700;padding:9px;border-radius:12px;cursor:pointer;font-family:inherit}
.ch-action:active{opacity:.8}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.ch-btn{position:relative;aspect-ratio:1;background:var(--grey100);color:var(--grey700);border:none;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s,color .15s,transform .1s}
.ch-btn:active{transform:scale(.9)}
.ch-btn.read{background:var(--primary);color:var(--white)}
.ch-btn.partial{background:var(--primary-light);color:var(--primary);box-shadow:inset 0 0 0 2px var(--primary)}
.v-badge{position:absolute;top:-5px;right:-5px;min-width:14px;height:14px;padding:0 3px;background:var(--primary);color:var(--white);border-radius:20px;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
.ch-hint{font-size:11px;color:var(--grey300);font-weight:500;text-align:center;margin-top:10px}

.verse-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s cubic-bezier(0.2,0.8,0.2,1)}
.verse-modal-overlay.open{opacity:1;pointer-events:auto}
.verse-modal{width:100%;max-width:340px;background:var(--white);border-radius:28px;box-shadow:0 8px 32px rgba(0,0,0,0.12);padding:24px;transform:scale(.9);transition:transform .3s cubic-bezier(0.2,0.8,0.2,1)}
.verse-modal-overlay.open .verse-modal{transform:scale(1)}
.verse-modal-title{font-size:17px;font-weight:700}
.verse-modal-sub{font-size:13px;color:var(--grey500);font-weight:500;margin-top:6px}
.verse-input{width:100%;margin-top:16px;background:var(--grey100);border:2px solid transparent;border-radius:14px;padding:14px;font-size:18px;font-weight:700;color:var(--black);text-align:center;outline:none;font-family:inherit}
.verse-input:focus{border-color:var(--primary);background:var(--white)}
.verse-modal-actions{display:flex;gap:8px;margin-top:18px}
.verse-btn{flex:1;border:none;padding:14px;border-radius:16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .3s cubic-bezier(0.2,0.8,0.2,1)}
.verse-btn:active{opacity:.8}
.verse-btn-ghost{background:var(--grey100);color:var(--grey700)}
.verse-btn-primary{background:var(--primary);color:var(--white)}

.pg-ftr{text-align:center;font-size:12px;color:var(--grey500);padding:12px 0}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <a class="back-btn" href="index.html">‹</a>
      <span class="header-logo">Eddy Playground</span>
    </div>
    <div class="header-title">성경 <span class="hl">읽기</span> 진행표</div>
  </div>

  <div id="content"></div>

  <div class="pg-ftr">한 번 탭하면 읽음, 두 번 빠르게 탭하면 몇 절까지 읽었는지 기록해요</div>
</div>

<div class="verse-modal-overlay" id="verseModalOverlay" onclick="closeVerseModal()">
  <div class="verse-modal" onclick="event.stopPropagation()">
    <div class="verse-modal-title" id="verseModalTitle"></div>
    <div class="verse-modal-sub">몇 절까지 읽으셨어요?</div>
    <input type="number" id="verseInput" class="verse-input" inputmode="numeric" min="1" placeholder="절 번호">
    <div class="verse-modal-actions">
      <button class="verse-btn verse-btn-ghost" id="verseClearBtn">읽음 해제</button>
      <button class="verse-btn verse-btn-primary" id="verseSaveBtn">저장</button>
    </div>
  </div>
</div>

<script>
const PLAN = [
  {
    title: '1단계 · 예수님 이야기부터',
    desc: '요한복음이 가장 읽기 쉽고 핵심 메시지가 명확해서 첫 시작으로 좋아요.',
    books: [['요한복음',21],['마가복음',16],['누가복음',24],['마태복음',28]]
  },
  {
    title: '2단계 · 초대교회 이야기',
    desc: '예수님이 떠나신 후 제자들이 교회를 세워가는 이야기예요.',
    books: [['사도행전',28]]
  },
  {
    title: '3단계 · 쉬운 구약 이야기',
    desc: '천지창조부터 다윗과 다니엘까지, 이야기 위주라 술술 읽혀요.',
    books: [['창세기',50],['출애굽기',40],['룻기',4],['사무엘상',31],['사무엘하',24],['다니엘',12]]
  },
  {
    title: '4단계 · 시가서 (감성·지혜)',
    desc: '삶의 감정과 지혜를 노래와 잠언으로 담아낸 책들이에요.',
    books: [['시편',150],['잠언',31],['전도서',12]]
  },
  {
    title: '5단계 · 신약 서신서',
    desc: '사도들이 각 교회에 보낸 편지예요. 로마서·에베소서·빌립보서·야고보서부터 시작해보세요.',
    books: [['로마서',16],['에베소서',6],['빌립보서',4],['야고보서',5],['고린도전서',16],['고린도후서',13],['갈라디아서',6],['골로새서',4],['데살로니가전서',5],['데살로니가후서',3],['디모데전서',6],['디모데후서',4],['디도서',3],['빌레몬서',1],['히브리서',13],['베드로전서',5],['베드로후서',3],['요한1서',5],['요한2서',1],['요한3서',1],['유다서',1]]
  },
  {
    title: '6단계 · 나머지 구약 (역사서·예언서)',
    desc: '율법서(레위기·민수기·신명기)와 소예언서는 배경지식이 쌓인 뒤 읽는 게 훨씬 이해가 잘 돼요.',
    books: [['레위기',27],['민수기',36],['신명기',34],['여호수아',24],['사사기',21],['열왕기상',22],['열왕기하',25],['역대상',29],['역대하',36],['에스라',10],['느헤미야',13],['에스더',10],['욥기',42],['아가',8],['이사야',66],['예레미야',52],['예레미야애가',5],['에스겔',48],['호세아',14],['요엘',3],['아모스',9],['오바댜',1],['요나',4],['미가',7],['나훔',3],['하박국',3],['스바냐',3],['학개',2],['스가랴',14],['말라기',4]]
  },
  {
    title: '7단계 · 요한계시록',
    desc: '가장 상징적이고 어려운 책이라 맨 마지막에 읽는 걸 추천해요.',
    books: [['요한계시록',22]]
  }
];

const CHAPTER_COUNT = {};
let TOTAL_CHAPTERS = 0;
PLAN.forEach(stage => stage.books.forEach(([name, chapters]) => {
  CHAPTER_COUNT[name] = chapters;
  TOTAL_CHAPTERS += chapters;
}));

// progress[book][chapter] is either the string 'read' (finished) or a
// number (the verse the reader stopped at — a chapter read partway).
const STORAGE_KEY = 'bibleReadingProgressV2';
const LEGACY_STORAGE_KEY = 'bibleReadingProgressV1';
let progress = loadProgress();
let openBook = null;

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
    // migrate from the old format (arrays of fully-read chapter numbers)
    // so upgrading doesn't wipe out reading progress already saved.
    const legacy = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY) || 'null');
    if(legacy){
      const migrated = {};
      for(const book in legacy){
        migrated[book] = {};
        legacy[book].forEach(ch => { migrated[book][ch] = 'read'; });
      }
      return migrated;
    }
    return {};
  }catch(e){ return {}; }
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}
function readCount(name){
  const b = progress[name];
  return b ? Object.values(b).filter(v => v === 'read').length : 0;
}
function partialCount(name){
  const b = progress[name];
  return b ? Object.values(b).filter(v => typeof v === 'number').length : 0;
}
function pct(read, total){ return total ? Math.round((read/total)*1000)/10 : 0; }

function toggleChapter(book, ch){
  if(!progress[book]) progress[book] = {};
  if(progress[book][ch] === 'read') delete progress[book][ch];
  else progress[book][ch] = 'read';
  saveProgress();
  render();
}
function markAll(book){
  const total = CHAPTER_COUNT[book];
  const obj = {};
  for(let ch = 1; ch <= total; ch++) obj[ch] = 'read';
  progress[book] = obj;
  saveProgress();
  render();
}
function clearBook(book){
  progress[book] = {};
  saveProgress();
  render();
}
function resetAll(){
  if(!confirm('모든 읽기 진행률을 초기화할까요?')) return;
  progress = {};
  saveProgress();
  render();
}

let verseModalState = null;
function openVerseModal(book, ch){
  verseModalState = { book, ch };
  const cur = progress[book] && progress[book][ch];
  document.getElementById('verseModalTitle').textContent = `${book} ${ch}장`;
  const input = document.getElementById('verseInput');
  input.value = typeof cur === 'number' ? cur : '';
  document.getElementById('verseModalOverlay').classList.add('open');
  setTimeout(() => input.focus(), 50);
}
function closeVerseModal(){
  document.getElementById('verseModalOverlay').classList.remove('open');
  verseModalState = null;
}
function saveVerse(){
  if(!verseModalState) return;
  const { book, ch } = verseModalState;
  const v = parseInt(document.getElementById('verseInput').value, 10);
  if(!v || v < 1){ document.getElementById('verseInput').focus(); return; }
  if(!progress[book]) progress[book] = {};
  progress[book][ch] = v;
  saveProgress();
  closeVerseModal();
  render();
}
function clearVerse(){
  if(!verseModalState) return;
  const { book, ch } = verseModalState;
  if(progress[book]) delete progress[book][ch];
  saveProgress();
  closeVerseModal();
  render();
}

function renderChapterGrid(name){
  const total = CHAPTER_COUNT[name];
  const bookProgress = progress[name] || {};
  let btns = '';
  for(let ch = 1; ch <= total; ch++){
    const v = bookProgress[ch];
    const isRead = v === 'read';
    const isPartial = typeof v === 'number';
    const cls = isRead ? ' read' : (isPartial ? ' partial' : '');
    const badge = isPartial ? `<span class="v-badge">${v}</span>` : '';
    btns += `<button class="ch-btn${cls}" data-book="${name}" data-ch="${ch}">${ch}${badge}</button>`;
  }
  return `
    <div class="ch-panel">
      <div class="ch-actions">
        <button class="ch-action" data-action="all" data-book="${name}">전체 읽음</button>
        <button class="ch-action" data-action="clear" data-book="${name}">전체 초기화</button>
      </div>
      <div class="ch-grid">${btns}</div>
      <div class="ch-hint">두 번 탭하면 몇 절까지 읽었는지 기록할 수 있어요</div>
    </div>`;
}

function renderBookRow(name){
  const total = CHAPTER_COUNT[name];
  const read = readCount(name);
  const partial = partialCount(name);
  const bp = pct(read, total);
  const done = read === total;
  const open = openBook === name;
  return `
    <div class="book-row" data-book="${name}">
      <div class="book-row-main">
        <div class="book-name${done ? ' done' : ''}">${name}</div>
        <div class="book-meta">
          <span class="book-frac">${read}/${total}${partial ? ` · 읽는 중 ${partial}` : ''}</span>
          <div class="book-mini-bar"><div class="book-mini-fill${done ? ' done' : ''}" style="width:${bp}%"></div></div>
        </div>
      </div>
      <div class="book-arrow${open ? ' open' : ''}">›</div>
    </div>
    ${open ? renderChapterGrid(name) : ''}`;
}

function renderStage(stage){
  const total = stage.books.reduce((s, [, c]) => s + c, 0);
  const read = stage.books.reduce((s, [n]) => s + readCount(n), 0);
  const sp = pct(read, total);
  return `
    <div class="card">
      <div class="stage-hdr">
        <div class="stage-title">${stage.title}</div>
        <div class="stage-pct">${sp}%</div>
      </div>
      <div class="stage-desc">${stage.desc}</div>
      <div class="bar stage-bar"><div class="bar-fill" style="width:${sp}%"></div></div>
      <div class="book-list">
        ${stage.books.map(([n]) => renderBookRow(n)).join('')}
      </div>
    </div>`;
}

function render(){
  const totalRead = Object.keys(CHAPTER_COUNT).reduce((s, n) => s + readCount(n), 0);
  const totalPartial = Object.keys(CHAPTER_COUNT).reduce((s, n) => s + partialCount(n), 0);
  const ov = pct(totalRead, TOTAL_CHAPTERS);
  const html = `
    <div class="card">
      <div class="ov-row">
        <div class="ov-label">전체 진행률</div>
        <button class="reset-btn" id="resetBtn">초기화</button>
      </div>
      <div class="ov-pct">${ov}%</div>
      <div class="bar"><div class="bar-fill" style="width:${ov}%"></div></div>
      <div class="ov-sub">${totalRead} / ${TOTAL_CHAPTERS}장 읽음${totalPartial ? ` · 읽는 중 ${totalPartial}장` : ''}</div>
    </div>
    ${PLAN.map(renderStage).join('')}`;
  document.getElementById('content').innerHTML = html;
}

// Single tap toggles a chapter fully read/unread. A quick second tap on the
// same chapter within the window below is treated as a double-tap instead,
// opening the verse picker for a chapter that was only read partway.
const DOUBLE_TAP_MS = 300;
let pendingTapTimer = null;
let pendingTapBtn = null;

document.getElementById('content').addEventListener('click', (e) => {
  const chBtn = e.target.closest('.ch-btn');
  if(chBtn){
    const book = chBtn.dataset.book;
    const ch = parseInt(chBtn.dataset.ch, 10);
    if(pendingTapTimer && pendingTapBtn === chBtn){
      clearTimeout(pendingTapTimer);
      pendingTapTimer = null;
      pendingTapBtn = null;
      openVerseModal(book, ch);
    }else{
      pendingTapBtn = chBtn;
      pendingTapTimer = setTimeout(() => {
        pendingTapTimer = null;
        pendingTapBtn = null;
        toggleChapter(book, ch);
      }, DOUBLE_TAP_MS);
    }
    return;
  }

  const actionBtn = e.target.closest('.ch-action');
  if(actionBtn){
    if(actionBtn.dataset.action === 'all') markAll(actionBtn.dataset.book);
    else clearBook(actionBtn.dataset.book);
    return;
  }

  const resetBtn = e.target.closest('#resetBtn');
  if(resetBtn){ resetAll(); return; }

  const row = e.target.closest('.book-row');
  if(row){
    const book = row.dataset.book;
    openBook = openBook === book ? null : book;
    render();
  }
});

document.getElementById('verseSaveBtn').addEventListener('click', saveVerse);
document.getElementById('verseClearBtn').addEventListener('click', clearVerse);
document.getElementById('verseInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') saveVerse();
});

render();

// scope covers the whole site — shared with the trip app's service worker
// (registered from schedule.html) so this page works offline and can be
// added to the home screen as its own standalone app on iOS
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', { scope: '.' });
}
</script>
</body>
</html>
