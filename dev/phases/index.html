<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>탐색 허브 · OPERATION MK DEV</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(48px + env(safe-area-inset-top,0)) 20px calc(32px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.back{font-family:var(--mono);font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:18px;display:inline-flex;align-items:center;gap:4px;width:fit-content}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
.title{font-size:26px;font-weight:700;letter-spacing:-.2px;margin-bottom:10px}
.sub{font-size:14px;color:var(--text-secondary);margin-bottom:28px;line-height:1.6}
.week-block + .week-block{margin-top:28px}
.week-header{display:flex;align-items:baseline;gap:8px;padding:0 2px;margin-bottom:14px}
.week-num{font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.06em}
.week-title{font-size:16px;font-weight:700}
.phase-list{display:flex;flex-direction:column;gap:12px}
.phase-row{display:flex;align-items:stretch;gap:10px}
.phase-btn{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:var(--surface-1);border:1px solid var(--divider);border-radius:12px;padding:16px 18px;text-decoration:none;color:inherit;transition:transform .15s,background .15s}
.phase-btn:active{transform:scale(.98);background:var(--surface-2)}
.phase-num{font-family:var(--mono);font-size:12px;color:var(--cyan);flex-shrink:0;width:56px}
.phase-txt{flex:1;min-width:0}
.phase-name-row{display:flex;align-items:center;gap:8px}
.phase-name{font-size:15px;font-weight:700}
.phase-mode{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.04em;border-radius:8px;padding:2.5px 6px;flex-shrink:0}
.phase-mode.hub{color:#06181c;background:var(--cyan)}
.phase-mode.scene{color:var(--text-muted);background:rgba(255,255,255,.08)}
.phase-desc{font-size:12px;color:var(--text-secondary);margin-top:4px;line-height:1.5}
.phase-arrow{color:var(--text-muted);font-size:18px;flex-shrink:0;align-self:center}
/* Setup(phase-btn) opens /dev/upload's 탐색허브/배경 tab pre-filtered to this
   phase — this is the shortcut past it, straight into a live playthrough of
   whatever's already configured, same split as /dev/week1's scene rows. */
.play-btn{flex-shrink:0;width:56px;display:flex;align-items:center;justify-content:center;background:var(--surface-1);border:1px solid var(--divider);border-radius:12px;color:var(--cyan);font-size:19px;text-decoration:none;transition:transform .15s,background .15s}
.play-btn:active{transform:scale(.94);background:var(--surface-2)}
.legend{margin-top:24px;font-size:11.5px;color:var(--text-muted);line-height:1.6;padding:14px 16px;background:var(--surface-1);border:1px solid var(--divider);border-radius:12px}
.legend b{color:var(--text-secondary)}
</style>
</head>
<body>
<div class="frame">
  <a class="back" href="/dev/">‹ DEV</a>
  <div class="tag">Operation MK</div>
  <div class="title">탐색 허브</div>
  <div class="sub">페이즈를 탭하면 배경·설정 화면으로, ▶을 누르면 그 구간을 바로 플레이합니다.</div>
  <div id="weekList"></div>
  <div class="legend"><b>허브</b> 페이즈는 장소를 자유롭게 오가며 탐색하고, <b>씬</b> 페이즈는 기존 순차 대사·미니게임으로 이어집니다. 설정은 허브 페이즈는 <b>/dev/upload</b>의 탐색허브 탭(장소별 배경)으로, 씬 페이즈는 해당 씬의 배경·대사 편집기로 이동합니다. 진행 상태(증거·가설·플래그)는 그대로 이어받으므로, 이전 페이즈를 건너뛰고 들어가면 일부 대사가 맥락 없이 보일 수 있습니다.</div>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script src="/dev/dialogueData.js"></script>
<script>
// Which week1SceneGroups phases actually have an exploration-hub location
// graph behind them (dev/data/locationDefs.js) vs. still play through the
// original linear scene/minigame chain — see docs/dev-status-week0-week1.md
// ("Phase 2/3/6은 재확인 결과 허브 이관이 필요 없다고 판단"). Kept as an
// explicit lookup (not inferred from locationDefs.js) since a phase can be
// intentionally scene-mode forever, not just "not migrated yet".
const PHASE_HUB_META = {
  'PHASE 1': { mode: 'hub', phaseId: 'W1_TOURISM', startLocationId: 'w1-circular-quay', desc: '서큘러키 · 오페라하우스 · 하버브리지 · 더 록스를 자유롭게 오가며 관광' },
  'PHASE 2': { mode: 'scene', sceneId: 'week1-scene-003', desc: '전시장 핫스팟 자유 조사 (미니게임)' },
  'PHASE 3': { mode: 'scene', sceneId: 'week1-scene-004', desc: 'K-01 도난 확인부터 용의자 선별까지' },
  'PHASE 4': { mode: 'hub', phaseId: 'W1_SUSPECT_INTERVIEWS', startLocationId: 'w1-hub-plaza', desc: '윤민아 · 애드리언 · 레오를 자유 순서로 탐문' },
  'PHASE 5': { mode: 'hub', phaseId: 'W1_REVERIFICATION', startLocationId: 'w1-hub-plaza', desc: '윤민아 · 애드리언 · 마틴을 자유 순서로 재검증' },
  'PHASE 6': { mode: 'scene', sceneId: 'week1-scene-012', desc: '사건 재구성부터 1주차 엔딩까지' },
};

// Only weeks whose scenes are actually organized into PHASE groups show up
// here — today that's just week1 (see dialogueData.js's week1SceneGroups).
// Week 0 has its own flat scene list (already reachable from /dev/story/)
// and weeks 2-4 aren't broken into phases yet, so there's nothing this page
// could meaningfully link to for them.
const WEEK_BLOCKS = [
  { weekNum: '1주차', weekTitle: '사라진 K-01', groups: (typeof week1SceneGroups !== 'undefined') ? week1SceneGroups : [] },
];

// 설정 — hub-mode phases jump into /dev/upload's 탐색허브 tab pre-filtered
// to this phase (per-location backgrounds, see that tab's own picker);
// scene-mode phases jump into the ordinary per-scene 배경/대사 editor, same
// as /dev/week1's own setupHref.
function setupHref(meta) {
  if (!meta) return '/dev/upload/';
  if (meta.mode === 'hub') return `/dev/upload/?tab=hub&phase=${encodeURIComponent(meta.phaseId)}`;
  return `/dev/upload/?scene=${encodeURIComponent(meta.sceneId)}`;
}

// 플레이 — hub-mode phases boot straight into the exploration hub at that
// phase's entry location; scene-mode phases boot the VN player at that
// phase's first scene.
function playHref(meta) {
  if (!meta) return '#';
  if (meta.mode === 'hub') return `/play/explore/?phase=${encodeURIComponent(meta.phaseId)}&location=${encodeURIComponent(meta.startLocationId)}`;
  return `/play/game/?scene=${encodeURIComponent(meta.sceneId)}`;
}

const weekListEl = document.getElementById('weekList');
weekListEl.innerHTML = WEEK_BLOCKS.map(week => `
  <div class="week-block">
    <div class="week-header">
      <span class="week-num">${week.weekNum}</span>
      <span class="week-title">${week.weekTitle}</span>
    </div>
    <div class="phase-list">
      ${week.groups.map(g => {
        const meta = PHASE_HUB_META[g.range];
        return `
          <div class="phase-row">
            <a class="phase-btn" href="${setupHref(meta)}">
              <div class="phase-num">${g.range}</div>
              <div class="phase-txt">
                <div class="phase-name-row">
                  <span class="phase-name">${g.label}</span>
                  ${meta ? `<span class="phase-mode ${meta.mode}">${meta.mode === 'hub' ? '허브' : '씬'}</span>` : ''}
                </div>
                <div class="phase-desc">${(meta && meta.desc) || ''}</div>
              </div>
              <div class="phase-arrow">›</div>
            </a>
            <a class="play-btn" href="${playHref(meta)}" aria-label="바로 플레이">▶</a>
          </div>
        `;
      }).join('')}
    </div>
  </div>
`).join('');
</script>
<script src="/dev/devPlanFab.js"></script>
</body>
</html>
