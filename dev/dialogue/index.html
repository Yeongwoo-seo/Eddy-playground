<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · DIALOGUE EDITOR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERATION MK DEV">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;--surface-3:#20262D;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(20px + env(safe-area-inset-top,0)) 20px calc(40px + env(safe-area-inset-bottom,0))}

.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--surface-1);border:1px solid var(--divider);color:var(--text-primary);display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.page-title{font-size:19px;font-weight:700;flex:1}
.new-btn{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:9px 12px;cursor:pointer;min-height:36px}

.section-title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin:24px 0 12px}
.section-title:first-of-type{margin-top:0}

.field-label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-secondary);text-transform:uppercase;margin:12px 0 6px}
.set-name-input{width:100%;background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:14px 16px;font-size:16px;color:var(--text-primary);font-family:inherit}
.set-name-input:focus{outline:none;border-color:var(--cyan)}

.status-msg{margin-top:14px;padding:11px 14px;border-radius:10px;background:rgba(89,184,200,.12);border:1px solid rgba(89,184,200,.4);color:var(--cyan);font-size:13px;font-weight:600}
.status-msg.error{background:rgba(217,65,65,.12);border-color:rgba(217,65,65,.4);color:#ff9c9c}
.status-msg.hidden{display:none}

.line-card{background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:16px;margin-bottom:12px}
.line-num{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--amber);text-transform:uppercase;display:block;margin-bottom:4px}
.line-speaker{width:100%;background:var(--surface-2);border:1px solid var(--divider);border-radius:10px;padding:11px 12px;font-size:14.5px;color:var(--text-primary);font-family:inherit}
.line-text{width:100%;min-height:64px;background:var(--surface-2);border:1px solid var(--divider);border-radius:10px;padding:11px 12px;font-size:14.5px;line-height:1.6;color:var(--text-primary);font-family:inherit;resize:none;white-space:pre-wrap;overflow:hidden}
.line-speaker:focus,.line-text:focus,.line-visible:focus{outline:none;border-color:var(--cyan)}
.line-visible{width:100%;background:var(--surface-2);border:1px solid var(--divider);border-radius:10px;padding:11px 12px;font-size:14px;color:var(--text-primary);font-family:var(--mono);letter-spacing:.04em}
.line-actions{display:flex;gap:8px;margin-top:14px}
.line-btn{flex:1;min-height:44px;background:var(--surface-2);border:1px solid var(--divider);color:var(--text-secondary);border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--mono)}
.line-btn:disabled{opacity:.35;cursor:default}
.line-btn.danger{color:var(--signal-red);border-color:rgba(217,65,65,.35);flex:1.4;font-size:11.5px;letter-spacing:.04em}

.add-line-btn{width:100%;min-height:48px;background:var(--surface-2);border:1px dashed var(--divider);color:var(--text-secondary);border-radius:12px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:var(--mono);letter-spacing:.05em;margin-bottom:24px}

.action-btn{width:100%;min-height:50px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--mono);letter-spacing:.05em;border:none;margin-bottom:10px}
.action-save{background:var(--cyan);color:#06181c}
.action-preview{background:var(--surface-2);color:var(--text-primary);border:1px solid var(--divider)}
.action-use{background:var(--amber);color:#241a04}

.set-card{background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:14px;margin-bottom:10px}
.set-name{font-size:14.5px;font-weight:700}
.set-meta{font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-top:3px}
.set-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.set-actions button{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:9px 11px;min-height:36px;border-radius:16px;border:1px solid var(--divider);background:var(--surface-2);color:var(--text-secondary);cursor:pointer}
.set-actions button.danger{color:var(--signal-red);border-color:rgba(217,65,65,.35)}
.empty-note{font-size:13px;color:var(--text-muted);padding:10px 0}

.debug-section{margin-top:28px;padding-top:16px;border-top:1px solid var(--divider)}
.debug-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.debug-btn{min-height:44px;background:var(--surface-1);border:1px solid var(--divider);color:var(--text-muted);border-radius:10px;font-size:10.5px;font-weight:600;cursor:pointer;font-family:var(--mono);letter-spacing:.02em;padding:8px}

/* ===== Preview modal — mirrors /dev/game's dialogue-layer styling ===== */
.preview-overlay{position:fixed;inset:0;z-index:40;background:#000;display:flex;justify-content:center}
.preview-overlay.hidden{display:none}
.preview-frame{position:relative;width:100%;max-width:430px;height:100dvh;height:100vh;overflow:hidden;background:#0d1114}
.preview-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#080A0C}
.preview-bg.bg-placeholder{background-image:linear-gradient(160deg,#171c22 0%,#0d1114 60%,#080a0c 100%)}
.preview-char{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s ease}
.preview-char svg{width:46%;height:62%;opacity:.4;color:var(--text-secondary)}
.preview-topbar{position:absolute;top:0;left:0;right:0;z-index:5;padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px;display:flex;justify-content:space-between;align-items:center}
.preview-counter{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--amber);background:rgba(8,10,12,.55);border:1px solid rgba(214,168,75,.35);border-radius:20px;padding:9px 14px}
.preview-exit{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#fff;background:rgba(8,10,12,.55);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:9px 14px;cursor:pointer}
.preview-tap{position:absolute;inset:0;z-index:3;cursor:pointer}
.preview-dlg{position:absolute;left:0;right:0;bottom:0;z-index:4;min-height:26vh;max-height:34vh;background:rgba(5,7,10,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.08);padding:18px 20px calc(18px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.preview-name{font-size:15px;font-weight:700;color:var(--cyan);margin-bottom:8px;flex-shrink:0}
.preview-name:empty{display:none}
.preview-text{flex:1;font-size:16px;line-height:1.65;color:#fff;overflow-y:auto;white-space:pre-wrap;word-break:keep-all}
.preview-foot{display:flex;justify-content:space-between;align-items:center;padding-top:6px;flex-shrink:0}
.preview-end{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);letter-spacing:.08em}
.preview-end.hidden{visibility:hidden}
.preview-arrow{font-size:13px;color:var(--text-secondary);visibility:hidden}
@keyframes arrowBob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.preview-arrow.show{visibility:visible;animation:arrowBob 1.1s ease-in-out infinite}
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <a class="back-btn" href="/dev/">←</a>
    <div class="page-title">DIALOGUE EDITOR</div>
    <button class="new-btn" id="newDraftBtn">+ NEW</button>
  </div>

  <div class="field-label">SET NAME</div>
  <input class="set-name-input" id="setNameInput" type="text" placeholder="예: 민아 1차 심문">

  <div class="section-title">Lines</div>
  <div id="lineList"></div>
  <button class="add-line-btn" id="addLineBtn">+ ADD LINE</button>

  <button class="action-btn action-save" id="saveBtn">SAVE DIALOGUE SET</button>
  <button class="action-btn action-preview" id="previewBtn">PREVIEW</button>
  <button class="action-btn action-use" id="useInGameBtn">USE IN GAME TEST</button>
  <div class="status-msg hidden" id="statusMsg"></div>

  <div class="section-title">Saved Dialogue Sets</div>
  <div id="savedList"><div class="empty-note">저장된 Dialogue Set이 없습니다.</div></div>

  <div class="debug-section">
    <div class="section-title">Debug</div>
    <div class="debug-grid">
      <button class="debug-btn" id="debugCreateSample">CREATE SAMPLE DIALOGUE</button>
      <button class="debug-btn" id="debugLoadSample">LOAD SAMPLE DIALOGUE</button>
      <button class="debug-btn" id="debugClearAll">CLEAR ALL DIALOGUE SETS</button>
      <button class="debug-btn" id="debugResetSelected">RESET SELECTED DIALOGUE</button>
    </div>
  </div>
</div>

<div class="preview-overlay hidden" id="previewOverlay">
  <div class="preview-frame">
    <div class="preview-bg" id="previewBg"></div>
    <div class="preview-char" id="previewCharWrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
    </div>
    <div class="preview-topbar">
      <span class="preview-counter" id="previewCounter">01 / 01</span>
      <button class="preview-exit" id="previewExitBtn">EXIT PREVIEW ✕</button>
    </div>
    <div class="preview-tap" id="previewTapZone"></div>
    <div class="preview-dlg">
      <div class="preview-name" id="previewSpeaker"></div>
      <div class="preview-text" id="previewText"></div>
      <div class="preview-foot">
        <span class="preview-end hidden" id="previewEnd">PREVIEW END</span>
        <span class="preview-arrow" id="previewArrow">▼</span>
      </div>
    </div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script src="/dev/assetDb.js"></script>
<script src="/dev/dialogueDb.js"></script>
<script src="/dev/vnPlayer.js"></script>
<script>
const el = {
  newDraftBtn: document.getElementById('newDraftBtn'),
  setNameInput: document.getElementById('setNameInput'),
  lineList: document.getElementById('lineList'),
  addLineBtn: document.getElementById('addLineBtn'),
  saveBtn: document.getElementById('saveBtn'),
  previewBtn: document.getElementById('previewBtn'),
  useInGameBtn: document.getElementById('useInGameBtn'),
  statusMsg: document.getElementById('statusMsg'),
  savedList: document.getElementById('savedList'),
  debugCreateSample: document.getElementById('debugCreateSample'),
  debugLoadSample: document.getElementById('debugLoadSample'),
  debugClearAll: document.getElementById('debugClearAll'),
  debugResetSelected: document.getElementById('debugResetSelected'),
  previewOverlay: document.getElementById('previewOverlay'),
  previewBg: document.getElementById('previewBg'),
  previewCharWrap: document.getElementById('previewCharWrap'),
  previewCounter: document.getElementById('previewCounter'),
  previewExitBtn: document.getElementById('previewExitBtn'),
  previewTapZone: document.getElementById('previewTapZone'),
  previewSpeaker: document.getElementById('previewSpeaker'),
  previewText: document.getElementById('previewText'),
  previewEnd: document.getElementById('previewEnd'),
  previewArrow: document.getElementById('previewArrow'),
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ===== Draft state ===== */
let draft = { id: null, name: '', lines: [] };

function newLine() {
  return { id: crypto.randomUUID(), speaker: '', text: '', characterVisible: true };
}

function resetDraft() {
  draft = { id: null, name: '', lines: [newLine()] };
  history.replaceState(null, '', '/dev/dialogue/');
  renderDraft();
}

function renderDraft() {
  el.setNameInput.value = draft.name;
  renderLineList();
}

function autoResize(textareaEl) {
  textareaEl.style.height = 'auto';
  textareaEl.style.height = textareaEl.scrollHeight + 'px';
}

function renderLineList() {
  if (!draft.lines.length) {
    el.lineList.innerHTML = '<div class="empty-note">아직 라인이 없습니다. + ADD LINE으로 추가하세요.</div>';
    return;
  }
  el.lineList.innerHTML = draft.lines.map((line, i) => `
    <div class="line-card" data-index="${i}">
      <span class="line-num">LINE ${String(i + 1).padStart(2, '0')}</span>
      <div class="field-label">SPEAKER</div>
      <input class="line-speaker" type="text" value="${escapeHtml(line.speaker)}" placeholder="예: 윤민아">
      <div class="field-label">TEXT</div>
      <textarea class="line-text" placeholder="대사 내용을 입력하세요">${escapeHtml(line.text)}</textarea>
      <div class="field-label">CHARACTER</div>
      <select class="line-visible">
        <option value="true"${line.characterVisible ? ' selected' : ''}>VISIBLE</option>
        <option value="false"${!line.characterVisible ? ' selected' : ''}>HIDDEN</option>
      </select>
      <div class="line-actions">
        <button class="line-btn" data-action="up" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="line-btn" data-action="down" ${i === draft.lines.length - 1 ? 'disabled' : ''}>↓</button>
        <button class="line-btn danger" data-action="delete">DELETE</button>
      </div>
    </div>
  `).join('');
  el.lineList.querySelectorAll('.line-text').forEach(autoResize);
}

el.lineList.addEventListener('input', (e) => {
  const card = e.target.closest('.line-card');
  if (!card) return;
  const i = Number(card.dataset.index);
  if (e.target.classList.contains('line-speaker')) draft.lines[i].speaker = e.target.value;
  if (e.target.classList.contains('line-text')) {
    draft.lines[i].text = e.target.value;
    autoResize(e.target);
  }
});
el.lineList.addEventListener('change', (e) => {
  const card = e.target.closest('.line-card');
  if (!card) return;
  const i = Number(card.dataset.index);
  if (e.target.classList.contains('line-visible')) draft.lines[i].characterVisible = e.target.value === 'true';
});
el.lineList.addEventListener('click', (e) => {
  const btn = e.target.closest('.line-btn');
  if (!btn) return;
  const card = btn.closest('.line-card');
  const i = Number(card.dataset.index);
  const action = btn.dataset.action;
  if (action === 'up' && i > 0) {
    [draft.lines[i - 1], draft.lines[i]] = [draft.lines[i], draft.lines[i - 1]];
    renderLineList();
  } else if (action === 'down' && i < draft.lines.length - 1) {
    [draft.lines[i + 1], draft.lines[i]] = [draft.lines[i], draft.lines[i + 1]];
    renderLineList();
  } else if (action === 'delete') {
    draft.lines.splice(i, 1);
    renderLineList();
  }
});

el.setNameInput.addEventListener('input', (e) => { draft.name = e.target.value; });
el.addLineBtn.addEventListener('click', () => {
  draft.lines.push(newLine());
  renderLineList();
});
el.newDraftBtn.addEventListener('click', resetDraft);

/* ===== Validation + save ===== */
function validateDraft() {
  if (!draft.name.trim()) return 'DIALOGUE SET NAME REQUIRED';
  if (!draft.lines.length) return 'AT LEAST ONE LINE REQUIRED';
  for (const line of draft.lines) {
    if (!line.speaker.trim()) return 'SPEAKER REQUIRED';
    if (!line.text.trim()) return 'DIALOGUE TEXT REQUIRED';
  }
  return null;
}

let statusTimer = null;
function showStatus(message, isError) {
  el.statusMsg.textContent = message;
  el.statusMsg.classList.toggle('error', !!isError);
  el.statusMsg.classList.remove('hidden');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => el.statusMsg.classList.add('hidden'), 3200);
}

async function persistDraft() {
  const error = validateDraft();
  if (error) { showStatus(error, true); return null; }
  const payload = { name: draft.name.trim(), lines: draft.lines };
  const saved = draft.id
    ? await DialogueDB.updateDialogueSet(draft.id, payload)
    : await DialogueDB.createDialogueSet(payload);
  draft.id = saved.id;
  history.replaceState(null, '', `/dev/dialogue/?id=${saved.id}`);
  return saved;
}

el.saveBtn.addEventListener('click', async () => {
  try {
    const saved = await persistDraft();
    if (saved) {
      showStatus('DIALOGUE SET SAVED', false);
      await refreshSavedList();
    }
  } catch (err) {
    DevDiag.show('저장 실패: ' + (err && err.message ? err.message : err));
  }
});

el.useInGameBtn.addEventListener('click', async () => {
  try {
    const saved = await persistDraft();
    if (saved) useInGameTest(saved.id);
  } catch (err) {
    DevDiag.show('저장 실패: ' + (err && err.message ? err.message : err));
  }
});

function useInGameTest(id) {
  DevDialogueState.setSelectedDialogueSetId(id);
  location.href = '/dev/game/';
}

/* ===== Saved Dialogue Sets list ===== */
async function refreshSavedList() {
  const sets = await DialogueDB.getDialogueSets();
  el.savedList.innerHTML = sets.length ? sets.map(s => `
    <div class="set-card">
      <div class="set-name">${escapeHtml(s.name)}</div>
      <div class="set-meta">${s.lines.length} LINES</div>
      <div class="set-actions">
        <button data-action="edit" data-id="${s.id}">EDIT</button>
        <button data-action="preview" data-id="${s.id}">PREVIEW</button>
        <button data-action="use" data-id="${s.id}">USE IN TEST</button>
        <button data-action="duplicate" data-id="${s.id}">DUPLICATE</button>
        <button class="danger" data-action="delete" data-id="${s.id}">DELETE</button>
      </div>
    </div>
  `).join('') : '<div class="empty-note">저장된 Dialogue Set이 없습니다.</div>';
}

async function loadIntoEditor(id) {
  const set = await DialogueDB.getDialogueSet(id);
  if (!set) { showStatus('DIALOGUE SET NOT FOUND', true); return; }
  draft = { id: set.id, name: set.name, lines: set.lines.map(l => ({ ...l })) };
  history.replaceState(null, '', `/dev/dialogue/?id=${set.id}`);
  renderDraft();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

el.savedList.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  try {
    if (action === 'edit') {
      await loadIntoEditor(id);
    } else if (action === 'preview') {
      const set = await DialogueDB.getDialogueSet(id);
      if (set) openPreview(set.lines);
    } else if (action === 'use') {
      useInGameTest(id);
    } else if (action === 'duplicate') {
      await DialogueDB.duplicateDialogueSet(id);
      await refreshSavedList();
    } else if (action === 'delete') {
      if (!confirm('이 Dialogue Set을 삭제하시겠습니까?')) return;
      await DialogueDB.deleteDialogueSet(id);
      if (draft.id === id) resetDraft();
      if (DevDialogueState.getSelectedDialogueSetId() === id) DevDialogueState.setSelectedDialogueSetId(null);
      await refreshSavedList();
    }
  } catch (err) {
    DevDiag.show('작업 실패: ' + (err && err.message ? err.message : err));
  }
});

/* ===== Preview (reuses the shared vnPlayer engine — no separate typewriter) ===== */
let previewPlayer = null;

async function setupPreviewBackground() {
  el.previewBg.style.backgroundImage = 'none';
  el.previewBg.classList.add('bg-placeholder');
  try {
    const bgId = DevGameState.getBackgroundId();
    const asset = await AssetDB.getAsset(bgId);
    if (asset && asset.dataUrl) {
      el.previewBg.style.backgroundImage = `url(${asset.dataUrl})`;
      el.previewBg.classList.remove('bg-placeholder');
    }
  } catch (err) { /* no asset available — keep the placeholder background */ }
}

function openPreview(lines) {
  if (!lines.length) { showStatus('AT LEAST ONE LINE REQUIRED', true); return; }
  el.previewOverlay.classList.remove('hidden');
  setupPreviewBackground();
  if (!previewPlayer) {
    previewPlayer = createVNPlayer({
      onLineChange: (line, index, total) => {
        el.previewSpeaker.textContent = line.speaker || '';
        el.previewCounter.textContent = `${String(index + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}`;
        el.previewCharWrap.style.opacity = line.characterVisible ? '1' : '0';
        el.previewEnd.classList.add('hidden');
      },
      onTextUpdate: (text) => { el.previewText.textContent = text; },
      onArrow: (show) => el.previewArrow.classList.toggle('show', show),
      onComplete: () => { el.previewEnd.classList.remove('hidden'); },
    });
  }
  previewPlayer.load(lines);
}

function closePreview() {
  el.previewOverlay.classList.add('hidden');
}

el.previewBtn.addEventListener('click', () => openPreview(draft.lines));
el.previewTapZone.addEventListener('click', () => previewPlayer && previewPlayer.tap());
el.previewExitBtn.addEventListener('click', (e) => { e.stopPropagation(); closePreview(); });

/* ===== Debug ===== */
el.debugCreateSample.addEventListener('click', async () => {
  await DialogueDB.saveDialogueSet(buildSampleDialogueSet());
  await refreshSavedList();
  showStatus('SAMPLE DIALOGUE CREATED', false);
});
el.debugLoadSample.addEventListener('click', async () => {
  let set = await DialogueDB.getDialogueSet(SAMPLE_DIALOGUE_SET_ID);
  if (!set) set = await DialogueDB.saveDialogueSet(buildSampleDialogueSet());
  await refreshSavedList();
  await loadIntoEditor(SAMPLE_DIALOGUE_SET_ID);
});
el.debugClearAll.addEventListener('click', async () => {
  if (!confirm('모든 Dialogue Set을 삭제하시겠습니까?')) return;
  const sets = await DialogueDB.getDialogueSets();
  await Promise.all(sets.map(s => DialogueDB.deleteDialogueSet(s.id)));
  DevDialogueState.setSelectedDialogueSetId(null);
  resetDraft();
  await refreshSavedList();
});
el.debugResetSelected.addEventListener('click', () => {
  DevDialogueState.setSelectedDialogueSetId(null);
  showStatus('SELECTED DIALOGUE SET CLEARED', false);
});

/* ===== Init ===== */
(async function init() {
  // Read the id param before resetDraft() rewrites the URL to a bare path.
  const idParam = new URLSearchParams(location.search).get('id');
  resetDraft();
  await refreshSavedList();
  if (idParam) await loadIntoEditor(idParam);
})();
</script>
</body>
</html>
