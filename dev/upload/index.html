<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · PHOTO UPLOAD</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;--surface-3:#20262D;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(20px + env(safe-area-inset-top,0)) 20px calc(40px + env(safe-area-inset-bottom,0))}

.topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--surface-1);border:1px solid var(--divider);color:var(--text-primary);display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.page-title{font-size:19px;font-weight:700}

.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab-btn{flex:1;padding:12px;border-radius:10px;background:var(--surface-1);border:1px solid var(--divider);color:var(--text-secondary);font-size:13px;font-weight:600;font-family:var(--mono);letter-spacing:.05em;cursor:pointer}
.tab-btn.active{background:var(--surface-3);color:var(--cyan);border-color:rgba(89,184,200,.4)}

.picker{margin-bottom:14px}
.picker-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px}
.picker-pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:9px 16px;border-radius:20px;background:var(--surface-1);border:1px solid var(--divider);color:var(--text-secondary);font-size:13px;font-weight:600;cursor:pointer}
.pill.active{background:rgba(89,184,200,.12);color:var(--cyan);border-color:rgba(89,184,200,.4)}

.dropzone{border:1.5px dashed var(--divider);border-radius:14px;padding:36px 16px;text-align:center;margin-bottom:8px;transition:border-color .15s,background .15s}
.dropzone.drag{border-color:var(--cyan);background:rgba(89,184,200,.06)}
.dropzone-icon{font-size:26px;margin-bottom:10px}
.dropzone-text{font-size:13px;color:var(--text-secondary);margin-bottom:14px}
.select-btn{display:inline-block;background:var(--surface-2);border:1px solid var(--divider);color:var(--text-primary);padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--mono);letter-spacing:.05em}
.hint{font-size:11px;color:var(--text-muted);margin:10px 0 24px;text-align:center}

.preview-panel{background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:16px;margin-bottom:24px}
.preview-panel.hidden{display:none}
.preview-img-wrap{width:100%;max-height:220px;border-radius:10px;overflow:hidden;background:var(--surface-3);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.preview-img-wrap img{max-width:100%;max-height:220px;object-fit:contain}
.preview-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px solid var(--divider)}
.preview-row:last-of-type{border-bottom:none}
.preview-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase}
.preview-value{color:var(--text-primary);font-weight:500;text-align:right;max-width:60%;word-break:break-all}
.save-btn{width:100%;margin-top:16px;background:var(--cyan);color:#06181c;border:none;border-radius:10px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--mono);letter-spacing:.04em}
.save-btn:active{opacity:.85}

.editor-panel{background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:16px;margin-bottom:24px}
.editor-panel.hidden{display:none}
.editor-preview{width:100%;max-height:280px;border-radius:10px;overflow:hidden;background:var(--surface-3);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.editor-preview img{max-width:100%;max-height:280px;object-fit:contain;-webkit-user-drag:none;user-select:none}
.bg-remove-row{margin-bottom:14px}
.bg-remove-btn{width:100%;background:var(--surface-2);border:1px solid var(--divider);color:var(--text-primary);padding:12px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--mono);letter-spacing:.03em}
.bg-remove-btn:disabled{opacity:.5;cursor:default}
.bg-remove-btn.done{color:var(--cyan);border-color:rgba(89,184,200,.4)}
.crop-enter-btn{width:100%;background:var(--cyan);color:#06181c;border:none;border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--mono);letter-spacing:.04em}

.crop-editor{margin-top:14px}
.crop-editor.hidden{display:none}
.crop-stage{position:relative;width:100%;height:320px;background:#000;border-radius:10px;overflow:hidden;touch-action:none}
.crop-stage img{position:absolute;-webkit-user-drag:none;user-select:none}
.crop-box{position:absolute;border:2px solid var(--cyan);box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;touch-action:none}
.crop-zoom-row{margin-top:12px}
.crop-zoom-row label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-secondary);text-transform:uppercase;margin-bottom:6px}
.crop-zoom-row input[type=range]{width:100%;accent-color:var(--cyan)}
.crop-actions{display:flex;gap:8px;margin-top:12px}
.crop-actions button{flex:1;border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--mono);letter-spacing:.04em;border:none}
.crop-save-btn{background:var(--cyan);color:#06181c}
.crop-cancel-btn{background:var(--surface-2) !important;color:var(--text-secondary) !important;border:1px solid var(--divider) !important}

.hotspot-panel{background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:16px;margin-bottom:24px}
.hotspot-panel.hidden{display:none}
.hotspot-stage{position:relative;width:100%;height:280px;background:#000;border-radius:10px;overflow:hidden;touch-action:none}
.hotspot-stage img{position:absolute;-webkit-user-drag:none;user-select:none}
.hotspot-marker{position:absolute;border:2px solid var(--cyan);border-radius:50%;background:rgba(89,184,200,.22);cursor:move;touch-action:none}
.hotspot-marker.hidden{display:none}
/* Room-search hotspots are a normalized top-left rect {x,y,width,height},
   not a circle — this marker is the draggable/resizable box editing that
   rect directly, mirroring how the crop-editor's box already works above. */
.hotspot-rect-marker{position:absolute;border:2px solid var(--cyan);background:rgba(89,184,200,.18);cursor:move;touch-action:none}
.hotspot-rect-marker.hidden{display:none}
.hotspot-resize-handle{position:absolute;right:-9px;bottom:-9px;width:20px;height:20px;background:var(--cyan);border:2px solid #06181c;border-radius:5px;cursor:nwse-resize;touch-action:none}
.hotspot-other-rect{position:absolute;border:1.5px dashed rgba(214,168,75,.85);background:rgba(214,168,75,.1);pointer-events:none}

.section-title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin:24px 0 12px}
.empty-note{font-size:13px;color:var(--text-muted);padding:14px 0}
.asset-card{display:flex;align-items:center;gap:12px;background:var(--surface-1);border:1px solid var(--divider);border-radius:12px;padding:12px;margin-bottom:10px}
.asset-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface-3);flex-shrink:0;cursor:pointer}
.asset-info{flex:1;min-width:0}
.asset-tag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--cyan);background:rgba(89,184,200,.12);border-radius:10px;padding:2px 8px;margin-bottom:4px}
.asset-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset-meta{font-size:11.5px;color:var(--text-muted);margin-top:2px;font-family:var(--mono)}
.asset-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.asset-actions button{font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:6px 10px;border-radius:16px;border:1px solid var(--divider);background:var(--surface-2);color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.asset-actions button.use{color:var(--cyan);border-color:rgba(89,184,200,.4)}
.asset-actions button.danger{color:var(--signal-red);border-color:rgba(217,65,65,.35)}

.lightbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:24px}
.lightbox.hidden{display:none}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}

/* ===== Minigame setup focus mode (?minigame=<id>) — reached from
   /dev/minigames instead of the general 배경 DB tool: pickers are locked
   to just that minigame's own scene(s), and this floating button is the
   only way to actually launch the live game from here. ===== */
.test-fab{position:fixed;left:20px;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0));z-index:15;background:var(--cyan);color:#06181c;text-align:center;text-decoration:none;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.05em;padding:16px;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.test-fab.hidden{display:none}
.frame.has-fab{padding-bottom:calc(84px + env(safe-area-inset-bottom,0))}
</style>
</head>

<script type="module">
// Client-side AI background removal (WASM) — no server involved. Downloads
// a model on first use, so it needs network the first time it's clicked.
// jsDelivr's "+esm" endpoint auto-bundles the package into a working ES
// module regardless of its internal dist layout — a guessed dist/*.mjs path
// failed on a real device, so don't guess the internal file structure again.
// Dynamic import (not a static `import` statement) so a load failure is
// catchable here instead of failing the whole module silently.
window.__removeBackgroundReady = import('https://cdn.jsdelivr.net/npm/@imgly/background-removal/+esm')
  .then(mod => {
    if (typeof mod.removeBackground !== 'function') {
      throw new Error('모듈은 로드됐지만 removeBackground 함수를 찾지 못함 (exports: ' + Object.keys(mod).join(', ') + ')');
    }
    window.__removeBackground = mod.removeBackground;
  })
  .catch(err => {
    window.__removeBackgroundLoadError = err;
  });
</script>

<script>
let currentType = 'background';
let currentWeekId = weeks[0].id;
let currentSceneId = weeks[0].scenes[0] && weeks[0].scenes[0].id;
let currentBgKind = 'scene'; // 'scene' | 'minigame' — only relevant for scenes with a minigameId
let currentCharacterKey = dialogueCharacters[0].id;
let currentExpression = dialogueExpressions[0].id;
let pendingFile = null;

// Deep link from /dev/game's "+ 새 이미지 업로드" — jump straight to that
// scene's background list instead of making the tester re-pick week/scene.
// ?kind=minigame also pre-selects the 미니게임 background sub-category.
(function applyDeepLink() {
  const params = new URLSearchParams(location.search);
  const requestedSceneId = params.get('scene');
  if (requestedSceneId) {
    for (const w of weeks) {
      if (w.scenes.some(s => s.id === requestedSceneId)) {
        currentWeekId = w.id;
        currentSceneId = requestedSceneId;
        break;
      }
    }
  }
  if (params.get('kind') === 'minigame') currentBgKind = 'minigame';
})();

// ?minigame=<id> deep link from /dev/minigames — locks this page down to
// just that one minigame's own scene(s), hiding the week/type pickers that
// don't apply here, and reveals the floating 테스트하기 button (the only
// way to actually launch the live game from this setup screen).
const focusMinigame = (function () {
  const minigameId = new URLSearchParams(location.search).get('minigame');
  const entry = minigameId ? minigames.find(m => m.id === minigameId) : null;
  if (!entry) return null;
  const sceneIds = minigameId === ROOM_SEARCH_MINIGAME_ID
    ? roomSearchAreas.map(a => roomSearchAreaSceneId(a.id))
    : (function () { const owner = week1Scenes.find(s => s.minigameId === minigameId); return owner ? [owner.id] : []; })();
  if (!sceneIds.length) return null;
  currentWeekId = 'week1';
  currentSceneId = sceneIds.includes(currentSceneId) ? currentSceneId : sceneIds[0];
  currentBgKind = 'minigame';
  return { entry, sceneIds };
})();

const el = {
  frame: document.getElementById('frame'),
  backBtn: document.getElementById('backBtn'),
  pageTitle: document.getElementById('pageTitle'),
  tabsRow: document.getElementById('tabsRow'),
  testFab: document.getElementById('testFab'),
  tabBackground: document.getElementById('tabBackground'),
  tabCharacter: document.getElementById('tabCharacter'),
  weekPicker: document.getElementById('weekPicker'),
  weekPickerPills: document.getElementById('weekPickerPills'),
  scenePicker: document.getElementById('scenePicker'),
  scenePickerPills: document.getElementById('scenePickerPills'),
  bgKindPicker: document.getElementById('bgKindPicker'),
  bgKindPickerPills: document.getElementById('bgKindPickerPills'),
  charPicker: document.getElementById('charPicker'),
  charPickerPills: document.getElementById('charPickerPills'),
  exprPicker: document.getElementById('exprPicker'),
  exprPickerPills: document.getElementById('exprPickerPills'),
  dropzone: document.getElementById('dropzone'),
  selectBtn: document.getElementById('selectBtn'),
  fileInput: document.getElementById('fileInput'),
  typeHint: document.getElementById('typeHint'),
  previewPanel: document.getElementById('previewPanel'),
  previewImg: document.getElementById('previewImg'),
  previewType: document.getElementById('previewType'),
  previewFile: document.getElementById('previewFile'),
  previewSize: document.getElementById('previewSize'),
  saveBtn: document.getElementById('saveBtn'),
  charEditorPanel: document.getElementById('charEditorPanel'),
  editorImg: document.getElementById('editorImg'),
  bgRemoveBtn: document.getElementById('bgRemoveBtn'),
  cropEnterBtn: document.getElementById('cropEnterBtn'),
  cropEditor: document.getElementById('cropEditor'),
  cropStage: document.getElementById('cropStage'),
  cropImg: document.getElementById('cropImg'),
  cropBox: document.getElementById('cropBox'),
  cropZoom: document.getElementById('cropZoom'),
  cropCancelBtn: document.getElementById('cropCancelBtn'),
  cropSaveBtn: document.getElementById('cropSaveBtn'),
  hotspotPanel: document.getElementById('hotspotPanel'),
  hotspotStagePicker: document.getElementById('hotspotStagePicker'),
  hotspotStagePickerPills: document.getElementById('hotspotStagePickerPills'),
  hotspotPicker: document.getElementById('hotspotPicker'),
  hotspotPickerPills: document.getElementById('hotspotPickerPills'),
  hotspotStage: document.getElementById('hotspotStage'),
  hotspotImg: document.getElementById('hotspotImg'),
  hotspotOtherDots: document.getElementById('hotspotOtherDots'),
  hotspotMarker: document.getElementById('hotspotMarker'),
  hotspotRectMarker: document.getElementById('hotspotRectMarker'),
  hotspotRectResizeHandle: document.getElementById('hotspotRectResizeHandle'),
  hotspotRectHint: document.getElementById('hotspotRectHint'),
  hotspotSizeRow: document.getElementById('hotspotSizeRow'),
  hotspotSize: document.getElementById('hotspotSize'),
  hotspotSaveBtn: document.getElementById('hotspotSaveBtn'),
  hotspotHint: document.getElementById('hotspotHint'),
  listTitle: document.getElementById('listTitle'),
  assetList: document.getElementById('assetList'),
  lightbox: document.getElementById('lightbox'),
  lightboxImg: document.getElementById('lightboxImg'),
};

function currentWeek() { return weeks.find(w => w.id === currentWeekId) || weeks[0]; }
function currentScene() { return currentWeek().scenes.find(s => s.id === currentSceneId); }

// The "virtual" sceneId background storage/uploads are keyed against — a
// scene with a minigame has two independent background slots: its own VN
// background, and the minigame's (e.g. the route-map image), selected via
// the 배경/미니게임 sub-picker.
function activeBackgroundSceneId() {
  const scene = currentScene();
  if (!scene) return currentSceneId;
  return currentBgKind === 'minigame' && scene.minigameId ? scene.minigameId : scene.id;
}

function selectType(type) {
  // Focus mode is background-only setup for one specific minigame — the
  // 인물 DB tab has nothing to do with that, so it's hidden and can't be
  // switched into (see applyFocusModeChrome).
  if (focusMinigame) type = 'background';

  el.typeHint.textContent = type === 'background' ? '.jpg · .jpeg · .png · .webp' : '.png · .webp (투명 배경 권장)';

  refreshList();
  renderHotspotSection();
}

function clearPending() {
  pendingFile = null;
  el.previewPanel.classList.add('hidden');
  el.charEditorPanel.classList.add('hidden');
  el.cropEditor.classList.add('hidden');
  el.fileInput.value = '';
}

// Phone-camera photos routinely come in at several MB and 3000px+ on a
// side — that's the actual reason the minigame maps/room photos were slow
// to load in-game (a multi-MB image has to fully download over the network
// *and* get decoded/rasterized before the map/room can render at all). None
// of these minigames ever zoom in past baseScale * 3 on a ~390px-wide phone
// frame, so anything long-side beyond BG_MAX_DIMENSION is detail nobody can
// ever see — downscaling (and re-encoding as JPEG, since these are all
// opaque photos with no transparency to preserve) cuts both the transfer
// and decode cost drastically with no visible quality loss in-game.
const BG_MAX_DIMENSION = 1600;
const BG_JPEG_QUALITY = 0.85;

function resizeImageToBlob(img, maxDim, quality) {
  const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
}

function onFilesSelected(files) {
  const file = files && files[0];
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = async () => {
    if (currentType === 'background') {
      if (Math.max(img.naturalWidth, img.naturalHeight) > BG_MAX_DIMENSION) {
        const resizedBlob = await resizeImageToBlob(img, BG_MAX_DIMENSION, BG_JPEG_QUALITY);
        const resizedImg = await loadImageFromBlob(resizedBlob);
        pendingFile = { blob: resizedBlob, name: file.name.replace(/\.[^.]+$/, '') + '.jpg', width: resizedImg.naturalWidth, height: resizedImg.naturalHeight };
        renderPreview(URL.createObjectURL(resizedBlob));
      } else {
        pendingFile = { blob: file, name: file.name, width: img.naturalWidth, height: img.naturalHeight };
        renderPreview(url);
      }
    } else {
      openCharEditor(file, url, img);
    }
  };
  img.src = url;
}

function renderPreview(url) {
  el.previewPanel.classList.remove('hidden');
  el.previewImg.src = url;
  const scene = currentScene();
  el.previewType.textContent = scene ? scene.name + (currentBgKind === 'minigame' ? ' · 미니게임' : '') : '';
  el.previewFile.textContent = pendingFile.name;
  el.previewSize.textContent = `${pendingFile.width} × ${pendingFile.height}`;
}

// Only reachable for backgrounds now — character uploads go through the
// crop editor below, which saves the framing itself.
async function saveAsset() {
  if (!pendingFile || !currentScene()) return;
  try {
    const record = await AssetDB.addAsset({ type: 'background', name: pendingFile.name, blob: pendingFile.blob, width: pendingFile.width, height: pendingFile.height, sceneId: activeBackgroundSceneId() });
    // The newest upload becomes the active background automatically — same
    // as character uploads already do below. Without this, "uploaded" and
    // "the game actually shows it" were two separate steps (upload, then a
    // second "사용" tap in the list below), and skipping the second step
    // looked exactly like the upload had silently failed.
    DevGameState.setBackgroundId(activeBackgroundSceneId(), record.id);
    clearPending();
    await refreshList();
    renderHotspotSection();
  } catch (err) {
    DevDiag.show('이미지 저장 실패: ' + (err && err.message ? err.message : err));
  }
}

/* ===== Character photo editor: optional background removal + one dialogue-framed crop ===== */
const CROP_ASPECT = 3 / 4;
const CROP_V_ANCHOR = 0.08;

let workingBlob = null;
let workingImgNatural = { width: 0, height: 0 };
let sourceFileBaseName = '';
let cropState = null;
let cropDrag = null;
let lastCropSettings = null; // { zoom, fracX, fracY } — carried over to the next expression photo

function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }

function openCharEditor(file, url, img) {
  workingBlob = file;
  workingImgNatural = { width: img.naturalWidth, height: img.naturalHeight };
  sourceFileBaseName = file.name.replace(/\.[^.]+$/, '');
  el.editorImg.src = url;
  el.bgRemoveBtn.disabled = false;
  el.bgRemoveBtn.textContent = '배경 제거 (누끼)';
  el.bgRemoveBtn.classList.remove('done');
  el.cropEditor.classList.add('hidden');
  el.charEditorPanel.classList.remove('hidden');
}

el.bgRemoveBtn.addEventListener('click', async () => {
  // Always give immediate visual feedback that the click registered, before
  // any async work — otherwise a load/network failure can look like the
  // button did nothing at all.
  el.bgRemoveBtn.disabled = true;
  el.bgRemoveBtn.textContent = '모듈 확인 중...';
  await window.__removeBackgroundReady;
  if (!window.__removeBackground) {
    const reason = window.__removeBackgroundLoadError;
    DevDiag.show('배경 제거 모듈 로드 실패: ' + (reason && reason.message ? reason.message : '네트워크 또는 CDN 문제로 모듈을 불러오지 못했습니다.'));
    el.bgRemoveBtn.textContent = '배경 제거 (누끼)';
    el.bgRemoveBtn.disabled = false;
    return;
  }
  el.bgRemoveBtn.textContent = '처리 중... (몇 초 걸릴 수 있어요)';
  try {
    const resultBlob = await window.__removeBackground(workingBlob);
    workingBlob = resultBlob;
    el.editorImg.src = URL.createObjectURL(resultBlob);
    el.bgRemoveBtn.textContent = '배경 제거 완료 ✓';
    el.bgRemoveBtn.classList.add('done');
  } catch (err) {
    DevDiag.show('배경 제거 실패: ' + (err && err.message ? err.message : err));
    el.bgRemoveBtn.textContent = '배경 제거 (누끼)';
  } finally {
    el.bgRemoveBtn.disabled = false;
  }
});

function enterCropMode() {
  el.cropImg.src = URL.createObjectURL(workingBlob);
  el.cropEditor.classList.remove('hidden');

  const stageRect = el.cropStage.getBoundingClientRect();
  const nw = workingImgNatural.width, nh = workingImgNatural.height;
  const imgScale = Math.min(stageRect.width / nw, stageRect.height / nh);
  const dispW = nw * imgScale, dispH = nh * imgScale;
  const imgLeft = (stageRect.width - dispW) / 2, imgTop = (stageRect.height - dispH) / 2;
  el.cropImg.style.width = dispW + 'px';
  el.cropImg.style.height = dispH + 'px';
  el.cropImg.style.left = imgLeft + 'px';
  el.cropImg.style.top = imgTop + 'px';

  let maxBoxW, maxBoxH;
  if (dispW / dispH > CROP_ASPECT) { maxBoxH = dispH; maxBoxW = dispH * CROP_ASPECT; }
  else { maxBoxW = dispW; maxBoxH = dispW / CROP_ASPECT; }

  cropState = { imgLeft, imgTop, dispW, dispH, imgScale, maxBoxW, maxBoxH };
  // Reuse the last crop's framing (zoom + relative position) instead of
  // recentering every time — expression photos for the same character are
  // usually framed the same way, so this makes cropping the whole set feel
  // like one batch operation instead of repositioning per photo.
  if (lastCropSettings) {
    el.cropZoom.value = lastCropSettings.zoom;
    updateCropBoxFromZoom(false, lastCropSettings);
  } else {
    el.cropZoom.value = 62;
    updateCropBoxFromZoom(true);
  }
}

function updateCropBoxFromZoom(recenter, frac) {
  const s = cropState;
  const zoomFrac = Number(el.cropZoom.value) / 100;
  const boxW = s.maxBoxW * zoomFrac;
  const boxH = s.maxBoxH * zoomFrac;
  let boxX, boxY;
  if (frac) {
    boxX = s.imgLeft + frac.fracX * (s.dispW - boxW);
    boxY = s.imgTop + frac.fracY * (s.dispH - boxH);
  } else if (recenter) {
    boxX = s.imgLeft + (s.dispW - boxW) / 2;
    boxY = s.imgTop + s.dispH * CROP_V_ANCHOR;
  } else {
    boxX = s.boxX;
    boxY = s.boxY;
  }
  s.boxW = boxW;
  s.boxH = boxH;
  s.boxX = clamp(boxX, s.imgLeft, s.imgLeft + s.dispW - boxW);
  s.boxY = clamp(boxY, s.imgTop, s.imgTop + s.dispH - boxH);
  renderCropBox();
}

function renderCropBox() {
  const s = cropState;
  el.cropBox.style.left = s.boxX + 'px';
  el.cropBox.style.top = s.boxY + 'px';
  el.cropBox.style.width = s.boxW + 'px';
  el.cropBox.style.height = s.boxH + 'px';
}

el.cropBox.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  el.cropBox.setPointerCapture(e.pointerId);
  cropDrag = { x: e.clientX, y: e.clientY, boxX: cropState.boxX, boxY: cropState.boxY };
});
el.cropBox.addEventListener('pointermove', (e) => {
  if (!cropDrag) return;
  const s = cropState;
  const dx = e.clientX - cropDrag.x, dy = e.clientY - cropDrag.y;
  s.boxX = clamp(cropDrag.boxX + dx, s.imgLeft, s.imgLeft + s.dispW - s.boxW);
  s.boxY = clamp(cropDrag.boxY + dy, s.imgTop, s.imgTop + s.dispH - s.boxH);
  renderCropBox();
});
['pointerup', 'pointercancel'].forEach(evt => el.cropBox.addEventListener(evt, () => { cropDrag = null; }));
el.cropZoom.addEventListener('input', () => updateCropBoxFromZoom(false));
el.cropEnterBtn.addEventListener('click', enterCropMode);

function cropImageElementToBlob(imgEl, x, y, w, h) {
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(w));
    canvas.height = Math.max(1, Math.round(h));
    canvas.getContext('2d').drawImage(imgEl, x, y, w, h, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(resolve, 'image/png');
  });
}

function loadImageFromBlob(blob) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(blob);
  });
}

el.cropCancelBtn.addEventListener('click', () => el.cropEditor.classList.add('hidden'));

el.cropSaveBtn.addEventListener('click', async () => {
  const s = cropState;
  const natX = (s.boxX - s.imgLeft) / s.imgScale;
  const natY = (s.boxY - s.imgTop) / s.imgScale;
  const natW = s.boxW / s.imgScale;
  const natH = s.boxH / s.imgScale;
  try {
    const cropBlob = await cropImageElementToBlob(el.cropImg, natX, natY, natW, natH);
    const croppedImg = await loadImageFromBlob(cropBlob);
    const exprLabel = dialogueExpressions.find(x => x.id === currentExpression).label;
    const name = `${sourceFileBaseName} (${exprLabel}).png`;
    const record = await AssetDB.addAsset({ type: 'character', name, blob: cropBlob, width: croppedImg.naturalWidth, height: croppedImg.naturalHeight, characterKey: currentCharacterKey, expression: currentExpression });
    // Only one photo per (character, expression) is actually rendered — the
    // newest upload for this pair becomes the active one automatically.
    DevGameState.setCharacterAssetId(currentCharacterKey, currentExpression, record.id);
    lastCropSettings = {
      zoom: Number(el.cropZoom.value),
      fracX: s.dispW - s.boxW > 0 ? (s.boxX - s.imgLeft) / (s.dispW - s.boxW) : 0.5,
      fracY: s.dispH - s.boxH > 0 ? (s.boxY - s.imgTop) / (s.dispH - s.boxH) : CROP_V_ANCHOR,
    };
    clearPending();
    await refreshList();
  } catch (err) {
    DevDiag.show('프레임 저장 실패: ' + (err && err.message ? err.message : err));
  }
});

/* ===== Answer-area designator: mark where a hotspot's tap target is on an
   uploaded background, as a { fx, fy, fr } fraction of the image so it works
   at any resolution. Three modes share this one editor:
   - "single" (scene.minigameId, no minigameStages) — one hotspot per
     background, via DevGameState.getMinigameHotspot/setMinigameHotspot.
   - "staged" (scene.minigameId + scene.minigameStages, e.g. the 3-stop
     station finder) — one sequential hotspot per stop, same map image,
     picked with the 순서 pill row.
   - "room" (scene.roomHotspots, the phone-search minigame's room photos) —
     several simultaneous named hotspots per background (one per thing in
     the room worth investigating), via
     DevGameState.getRoomHotspots/setRoomHotspot, picked with the 항목 pill
     row. ===== */
let hotspotState = null;
let hotspotDrag = null;
let currentHotspotStageIndex = 0;
let currentRoomHotspotId = null;

// Minigames with more than one sequential target (e.g. the 3-stop station
// finder) list them in scene.minigameStages; each stop gets its own hotspot
// slot on the same shared map image. Minigames without that field keep the
// old single-hotspot behavior.
function currentMinigameStages() {
  const scene = currentScene();
  return (scene && scene.minigameStages && scene.minigameStages.length > 1) ? scene.minigameStages : null;
}
function activeHotspotStageIndex() {
  return currentMinigameStages() ? currentHotspotStageIndex : undefined;
}
function activeHotspotKind() {
  const scene = currentScene();
  return (scene && scene.roomHotspots) ? 'room' : 'single';
}
function getActiveHotspot(sceneId) {
  if (activeHotspotKind() === 'room') return DevGameState.getRoomHotspots(sceneId)[currentRoomHotspotId] || null;
  return DevGameState.getMinigameHotspot(sceneId, activeHotspotStageIndex());
}
function saveActiveHotspot(sceneId, hotspot) {
  if (activeHotspotKind() === 'room') DevGameState.setRoomHotspot(sceneId, currentRoomHotspotId, hotspot);
  else DevGameState.setMinigameHotspot(sceneId, activeHotspotStageIndex(), hotspot);
}

function renderHotspotStagePicker() {
  const stages = currentMinigameStages();
  el.hotspotStagePicker.classList.toggle('hidden', !stages);
  if (!stages) return;
  el.hotspotStagePickerPills.innerHTML = stages.map((label, i) =>
    `<button class="pill${i === currentHotspotStageIndex ? ' active' : ''}" data-index="${i}">${escapeHtml(label)}</button>`
  ).join('');
  el.hotspotStagePickerPills.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => {
      currentHotspotStageIndex = Number(btn.dataset.index);
      renderHotspotStagePicker();
      loadHotspotEditor();
    });
  });
}

function renderHotspotPicker(scene) {
  const sceneId = activeBackgroundSceneId();
  el.hotspotPicker.classList.remove('hidden');
  const saved = DevGameState.getRoomHotspots(sceneId);
  el.hotspotPickerPills.innerHTML = scene.roomHotspots.map(h =>
    `<button class="pill${h.id === currentRoomHotspotId ? ' active' : ''}" data-key="${h.id}">${escapeHtml(h.label)}${saved[h.id] ? ' ✓' : ''}</button>`
  ).join('');
  el.hotspotPickerPills.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => {
      currentRoomHotspotId = btn.dataset.key;
      renderHotspotPicker(scene);
      loadHotspotEditor();
    });
  });
}

function renderHotspotSection() {
  const scene = currentScene();
  const isMinigame = currentType === 'background' && currentBgKind === 'minigame' && !!(scene && scene.minigameId);
  const isRoom = currentType === 'background' && !!(scene && scene.roomHotspots);
  el.hotspotPanel.classList.toggle('hidden', !(isMinigame || isRoom));
  if (!(isMinigame || isRoom)) return;
  if (isMinigame) {
    currentHotspotStageIndex = 0;
    renderHotspotStagePicker();
  } else {
    el.hotspotStagePicker.classList.add('hidden');
  }
  if (isRoom) {
    if (!scene.roomHotspots.some(h => h.id === currentRoomHotspotId)) currentRoomHotspotId = scene.roomHotspots[0].id;
    renderHotspotPicker(scene);
  } else {
    el.hotspotPicker.classList.add('hidden');
  }
  loadHotspotEditor();
}

async function loadHotspotEditor() {
  const scene = currentScene();
  const sceneId = activeBackgroundSceneId();
  const isRoom = activeHotspotKind() === 'room';
  const assetId = DevGameState.getBackgroundId(sceneId);
  const asset = assetId ? await AssetDB.getAsset(assetId) : null;
  if (!asset) {
    el.hotspotStage.style.visibility = 'hidden';
    el.hotspotSaveBtn.disabled = true;
    el.hotspotHint.textContent = '먼저 이 항목의 배경 이미지를 업로드하고 "사용"으로 선택하세요.';
    return;
  }
  el.hotspotStage.style.visibility = '';
  el.hotspotSaveBtn.disabled = false;
  // Room-search hotspots are edited as a rect (drag to move, corner handle
  // to resize); Eastwood's single/staged hotspots stay the original
  // draggable-circle-with-size-slider editor.
  el.hotspotMarker.classList.toggle('hidden', isRoom);
  el.hotspotRectMarker.classList.toggle('hidden', !isRoom);
  el.hotspotSizeRow.classList.toggle('hidden', isRoom);
  el.hotspotRectHint.classList.toggle('hidden', !isRoom);
  el.hotspotImg.src = asset.dataUrl;
  el.hotspotImg.onload = () => {
    const stageRect = el.hotspotStage.getBoundingClientRect();
    const nw = asset.width, nh = asset.height;
    const imgScale = Math.min(stageRect.width / nw, stageRect.height / nh);
    const dispW = nw * imgScale, dispH = nh * imgScale;
    const imgLeft = (stageRect.width - dispW) / 2, imgTop = (stageRect.height - dispH) / 2;
    el.hotspotImg.style.width = dispW + 'px';
    el.hotspotImg.style.height = dispH + 'px';
    el.hotspotImg.style.left = imgLeft + 'px';
    el.hotspotImg.style.top = imgTop + 'px';

    const existing = getActiveHotspot(sceneId);
    hotspotState = { imgLeft, imgTop, dispW, dispH };

    if (isRoom) {
      const w = (existing ? existing.width : 0.24) * dispW;
      const h = (existing ? existing.height : 0.14) * dispH;
      hotspotState.boxX = imgLeft + (existing ? existing.x : 0.38) * dispW;
      hotspotState.boxY = imgTop + (existing ? existing.y : 0.43) * dispH;
      hotspotState.boxW = w;
      hotspotState.boxH = h;
      renderHotspotRectMarker();

      // Faintly show every *other* already-placed hotspot on this same
      // photo for spatial context while placing the rest.
      const all = DevGameState.getRoomHotspots(sceneId);
      el.hotspotOtherDots.innerHTML = Object.keys(all)
        .filter(id => id !== currentRoomHotspotId)
        .map(id => {
          const o = all[id];
          return `<div class="hotspot-other-rect" style="left:${imgLeft + o.x * dispW}px;top:${imgTop + o.y * dispH}px;width:${o.width * dispW}px;height:${o.height * dispH}px"></div>`;
        }).join('');
    } else {
      el.hotspotSize.value = Math.round((existing ? existing.fr : 0.06) * 100);
      const fx = existing ? existing.fx : 0.5;
      const fy = existing ? existing.fy : 0.5;
      hotspotState.markerCx = imgLeft + fx * dispW;
      hotspotState.markerCy = imgTop + fy * dispH;
      hotspotState.markerR = (Number(el.hotspotSize.value) / 100) * dispW;
      renderHotspotMarker();
      el.hotspotOtherDots.innerHTML = '';
    }

    el.hotspotHint.textContent = existing
      ? '기존 정답 영역을 드래그해서 위치를 조정할 수 있어요.'
      : '이미지에서 정답 위치를 드래그해서 지정하세요.';
  };
}

function renderHotspotMarker() {
  const s = hotspotState;
  el.hotspotMarker.style.width = s.markerR * 2 + 'px';
  el.hotspotMarker.style.height = s.markerR * 2 + 'px';
  el.hotspotMarker.style.left = (s.markerCx - s.markerR) + 'px';
  el.hotspotMarker.style.top = (s.markerCy - s.markerR) + 'px';
}

function renderHotspotRectMarker() {
  const s = hotspotState;
  el.hotspotRectMarker.style.left = s.boxX + 'px';
  el.hotspotRectMarker.style.top = s.boxY + 'px';
  el.hotspotRectMarker.style.width = s.boxW + 'px';
  el.hotspotRectMarker.style.height = s.boxH + 'px';
}

el.hotspotMarker.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  el.hotspotMarker.setPointerCapture(e.pointerId);
  hotspotDrag = { x: e.clientX, y: e.clientY, cx: hotspotState.markerCx, cy: hotspotState.markerCy };
});
el.hotspotMarker.addEventListener('pointermove', (e) => {
  if (!hotspotDrag || !hotspotState) return;
  const s = hotspotState;
  const dx = e.clientX - hotspotDrag.x, dy = e.clientY - hotspotDrag.y;
  s.markerCx = clamp(hotspotDrag.cx + dx, s.imgLeft, s.imgLeft + s.dispW);
  s.markerCy = clamp(hotspotDrag.cy + dy, s.imgTop, s.imgTop + s.dispH);
  renderHotspotMarker();
});
['pointerup', 'pointercancel'].forEach(evt => el.hotspotMarker.addEventListener(evt, () => { hotspotDrag = null; }));
el.hotspotSize.addEventListener('input', () => {
  if (!hotspotState) return;
  hotspotState.markerR = (Number(el.hotspotSize.value) / 100) * hotspotState.dispW;
  renderHotspotMarker();
});

// Rect marker (room mode): drag the body to move, drag the corner handle
// to resize — stopPropagation on the handle keeps its own resize drag from
// also being read as a move drag by the marker's own listener below.
let hotspotRectDrag = null;
el.hotspotRectMarker.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  el.hotspotRectMarker.setPointerCapture(e.pointerId);
  hotspotRectDrag = { mode: 'move', x: e.clientX, y: e.clientY, boxX: hotspotState.boxX, boxY: hotspotState.boxY };
});
el.hotspotRectMarker.addEventListener('pointermove', (e) => {
  if (!hotspotRectDrag || hotspotRectDrag.mode !== 'move' || !hotspotState) return;
  const s = hotspotState;
  const dx = e.clientX - hotspotRectDrag.x, dy = e.clientY - hotspotRectDrag.y;
  s.boxX = clamp(hotspotRectDrag.boxX + dx, s.imgLeft, s.imgLeft + s.dispW - s.boxW);
  s.boxY = clamp(hotspotRectDrag.boxY + dy, s.imgTop, s.imgTop + s.dispH - s.boxH);
  renderHotspotRectMarker();
});
['pointerup', 'pointercancel'].forEach(evt => el.hotspotRectMarker.addEventListener(evt, () => {
  if (hotspotRectDrag && hotspotRectDrag.mode === 'move') hotspotRectDrag = null;
}));

el.hotspotRectResizeHandle.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  e.stopPropagation();
  el.hotspotRectResizeHandle.setPointerCapture(e.pointerId);
  hotspotRectDrag = { mode: 'resize', x: e.clientX, y: e.clientY, boxW: hotspotState.boxW, boxH: hotspotState.boxH };
});
el.hotspotRectResizeHandle.addEventListener('pointermove', (e) => {
  if (!hotspotRectDrag || hotspotRectDrag.mode !== 'resize' || !hotspotState) return;
  const s = hotspotState;
  const dx = e.clientX - hotspotRectDrag.x, dy = e.clientY - hotspotRectDrag.y;
  const minSize = 16;
  s.boxW = clamp(hotspotRectDrag.boxW + dx, minSize, s.imgLeft + s.dispW - s.boxX);
  s.boxH = clamp(hotspotRectDrag.boxH + dy, minSize, s.imgTop + s.dispH - s.boxY);
  renderHotspotRectMarker();
});
['pointerup', 'pointercancel'].forEach(evt => el.hotspotRectResizeHandle.addEventListener(evt, () => {
  if (hotspotRectDrag && hotspotRectDrag.mode === 'resize') hotspotRectDrag = null;
}));

el.hotspotSaveBtn.addEventListener('click', () => {
  if (!hotspotState) return;
  const s = hotspotState;
  const sceneId = activeBackgroundSceneId();
  const hotspot = activeHotspotKind() === 'room'
    ? { x: (s.boxX - s.imgLeft) / s.dispW, y: (s.boxY - s.imgTop) / s.dispH, width: s.boxW / s.dispW, height: s.boxH / s.dispH }
    : { fx: (s.markerCx - s.imgLeft) / s.dispW, fy: (s.markerCy - s.imgTop) / s.dispH, fr: s.markerR / s.dispW };
  saveActiveHotspot(sceneId, hotspot);
  el.hotspotHint.textContent = '저장됐어요. 미니게임에서 이 위치를 정답으로 인식합니다.';
  if (activeHotspotKind() === 'room') renderHotspotPicker(currentScene());
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function refreshList() {
  el.listTitle.textContent = currentType === 'background' ? 'Uploaded Backgrounds' : 'Uploaded Portraits';
  const all = await AssetDB.getAssetsByType(currentType);
  const filtered = currentType === 'background'
    ? all.filter(a => a.sceneId === activeBackgroundSceneId())
    : all.filter(a => a.characterKey === currentCharacterKey && a.expression === currentExpression);
  renderList(filtered);
}

function renderList(assets) {
  if (!assets.length) {
    el.assetList.innerHTML = '<div class="empty-note">아직 업로드한 이미지가 없습니다.</div>';
    return;
  }
  el.assetList.innerHTML = assets.map(a => {
    const url = a.dataUrl;
    const isActive = a.type === 'background'
      ? DevGameState.getBackgroundId(a.sceneId) === a.id
      : DevGameState.getCharacterAssetId(a.characterKey, a.expression) === a.id;
    const tag = isActive ? '<span class="asset-tag">사용 중</span><br>' : '';
    const useAction = a.type === 'background'
      ? `useAsBackground('${a.id}')`
      : `useAsCharacter('${a.id}')`;
    return `<div class="asset-card">
      <img class="asset-thumb" src="${url}" data-url="${url}" onclick="previewAsset(this.dataset.url)">
      <div class="asset-info">
        ${tag}
        <div class="asset-name">${escapeHtml(a.name)}</div>
        <div class="asset-meta">${a.width} × ${a.height}</div>
      </div>
      <div class="asset-actions">
        ${isActive ? '' : `<button class="use" onclick="${useAction}">사용</button>`}
        <button class="danger" onclick="removeAsset('${a.type}','${a.id}')">DELETE</button>
      </div>
    </div>`;
  }).join('');
}

function previewAsset(url) {
  el.lightboxImg.src = url;
  el.lightbox.classList.remove('hidden');
}

function useAsBackground(id) {
  DevGameState.setBackgroundId(activeBackgroundSceneId(), id);
  refreshList();
  renderHotspotSection();
}

function useAsCharacter(id) {
  DevGameState.setCharacterAssetId(currentCharacterKey, currentExpression, id);
  refreshList();
}

async function removeAsset(type, id) {
  if (!confirm('이 이미지를 삭제할까요?')) return;
  await AssetDB.deleteAsset(id);
  if (type === 'background') DevGameState.removeAllBackgroundAssetRefs(id);
  if (type === 'character') DevGameState.removeAllCharacterAssetRefs(id);
  await refreshList();
  renderHotspotSection();
}

el.tabBackground.addEventListener('click', () => selectType('background'));
el.tabCharacter.addEventListener('click', () => selectType('character'));
el.selectBtn.addEventListener('click', () => el.fileInput.click());
el.dropzone.addEventListener('click', (e) => { if (e.target === el.selectBtn) return; el.fileInput.click(); });
el.fileInput.addEventListener('change', (e) => onFilesSelected(e.target.files));
el.saveBtn.addEventListener('click', saveAsset);
el.lightbox.addEventListener('click', () => el.lightbox.classList.add('hidden'));

['dragover', 'dragenter'].forEach(evt => el.dropzone.addEventListener(evt, (e) => {
  e.preventDefault();
  el.dropzone.classList.add('drag');
}));
['dragleave', 'dragend'].forEach(evt => el.dropzone.addEventListener(evt, () => el.dropzone.classList.remove('drag')));
el.dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  el.dropzone.classList.remove('drag');
  onFilesSelected(e.dataTransfer.files);
});

function applyFocusModeChrome() {
  if (!focusMinigame) return;
  el.tabsRow.classList.add('hidden');
  el.backBtn.href = '/dev/minigames/';
  el.pageTitle.textContent = focusMinigame.entry.name;
  el.frame.classList.add('has-fab');
  el.testFab.href = focusMinigame.entry.route;
  el.testFab.classList.remove('hidden');
}

applyFocusModeChrome();
selectType('background');
</script>
</body>
</html>
