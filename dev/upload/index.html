<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;--surface-3:#20262D;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(20px + env(safe-area-inset-top,0)) 20px calc(40px + env(safe-area-inset-bottom,0))}

.topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--surface-1);border:1px solid var(--divider);color:var(--text-primary);display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.page-title{font-size:19px;font-weight:700}

.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab-btn{flex:1;padding:12px;border-radius:10px;background:var(--surface-1);border:1px solid var(--divider);color:var(--text-secondary);font-size:13px;font-weight:600;font-family:var(--mono);letter-spacing:.05em;cursor:pointer}
.tab-btn.active{background:var(--surface-3);color:var(--cyan);border-color:rgba(89,184,200,.4)}

.char-picker{margin-bottom:18px}
.char-picker.hidden{display:none}
.char-picker-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px}
.char-picker-pills{display:flex;gap:8px;flex-wrap:wrap}
.char-pill{padding:9px 16px;border-radius:20px;background:var(--surface-1);border:1px solid var(--divider);color:var(--text-secondary);font-size:13px;font-weight:600;cursor:pointer}
.char-pill.active{background:rgba(89,184,200,.12);color:var(--cyan);border-color:rgba(89,184,200,.4)}

.dropzone{border:1.5px dashed var(--divider);border-radius:14px;padding:36px 16px;text-align:center;margin-bottom:8px;transition:border-color .15s,background .15s}
.dropzone.drag{border-color:var(--cyan);background:rgba(89,184,200,.06)}
.dropzone-icon{font-size:26px;margin-bottom:10px}
.dropzone-text{font-size:13px;color:var(--text-secondary);margin-bottom:14px}
.select-btn{display:inline-block;background:var(--surface-2);border:1px solid var(--divider);color:var(--text-primary);padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--mono);letter-spacing:.05em}
.hint{font-size:11px;color:var(--text-muted);margin:10px 0 24px;text-align:center}

.preview-panel{background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:16px;margin-bottom:24px}
.preview-panel.hidden{display:none}
.preview-img-wrap{width:100%;max-height:220px;border-radius:10px;overflow:hidden;background:var(--surface-3);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.preview-img-wrap img{max-width:100%;max-height:220px;object-fit:contain}
.preview-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px solid var(--divider)}
.preview-row:last-of-type{border-bottom:none}
.preview-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase}
.preview-value{color:var(--text-primary);font-weight:500;text-align:right;max-width:60%;word-break:break-all}
.save-btn{width:100%;margin-top:16px;background:var(--cyan);color:#06181c;border:none;border-radius:10px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--mono);letter-spacing:.04em}
.save-btn:active{opacity:.85}

.editor-panel{background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:16px;margin-bottom:24px}
.editor-panel.hidden{display:none}
.editor-preview{width:100%;max-height:280px;border-radius:10px;overflow:hidden;background:var(--surface-3);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.editor-preview img{max-width:100%;max-height:280px;object-fit:contain;-webkit-user-drag:none;user-select:none}
.bg-remove-row{margin-bottom:14px}
.bg-remove-btn{width:100%;background:var(--surface-2);border:1px solid var(--divider);color:var(--text-primary);padding:12px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--mono);letter-spacing:.03em}
.bg-remove-btn:disabled{opacity:.5;cursor:default}
.bg-remove-btn.done{color:var(--cyan);border-color:rgba(89,184,200,.4)}

.frame-hint{font-size:11px;color:var(--text-muted);margin-bottom:8px}
.frame-row{display:flex;gap:8px}
.frame-btn{flex:1;background:var(--surface-2);border:1px solid var(--divider);color:var(--text-secondary);padding:12px 6px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--mono);letter-spacing:.02em}
.frame-btn.done{color:var(--cyan);border-color:rgba(89,184,200,.4)}

.crop-editor{margin-top:14px}
.crop-editor.hidden{display:none}
.crop-stage{position:relative;width:100%;height:320px;background:#000;border-radius:10px;overflow:hidden;touch-action:none}
.crop-stage img{position:absolute;-webkit-user-drag:none;user-select:none}
.crop-box{position:absolute;border:2px solid var(--cyan);box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;touch-action:none}
.crop-zoom-row{margin-top:12px}
.crop-zoom-row label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-secondary);text-transform:uppercase;margin-bottom:6px}
.crop-zoom-row input[type=range]{width:100%;accent-color:var(--cyan)}
.crop-actions{display:flex;gap:8px;margin-top:12px}
.crop-actions button{flex:1;border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--mono);letter-spacing:.04em;border:none}
.crop-save-btn{background:var(--cyan);color:#06181c}
.crop-cancel-btn{background:var(--surface-2) !important;color:var(--text-secondary) !important;border:1px solid var(--divider) !important}

.section-title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin:24px 0 12px}
.empty-note{font-size:13px;color:var(--text-muted);padding:14px 0}
.asset-card{display:flex;align-items:center;gap:12px;background:var(--surface-1);border:1px solid var(--divider);border-radius:12px;padding:12px;margin-bottom:10px}
.asset-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface-3);flex-shrink:0;cursor:pointer}
.asset-info{flex:1;min-width:0}
.asset-tag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--cyan);background:rgba(89,184,200,.12);border-radius:10px;padding:2px 8px;margin-bottom:4px}
.asset-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset-meta{font-size:11.5px;color:var(--text-muted);margin-top:2px;font-family:var(--mono)}
.asset-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.asset-actions button{font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:6px 10px;border-radius:16px;border:1px solid var(--divider);background:var(--surface-2);color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.asset-actions button.use{color:var(--cyan);border-color:rgba(89,184,200,.4)}
.asset-actions button.danger{color:var(--signal-red);border-color:rgba(217,65,65,.35)}

.lightbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:24px}
.lightbox.hidden{display:none}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
</style>

<script type="module">
// Client-side AI background removal (WASM) — no server involved. Downloads
// a model on first use, so it needs network the first time it's clicked.
// Unpinned (no @version) so jsDelivr always resolves the latest published
// build — this environment couldn't reach the CDN to verify an exact version.
// Dynamic import (not a static `import` statement) so a load failure is
// catchable here instead of failing the whole module silently.
window.__removeBackgroundReady = import('https://cdn.jsdelivr.net/npm/@imgly/background-removal/dist/browser.mjs')
  .then(mod => { window.__removeBackground = mod.removeBackground; })
  .catch(err => {
    window.__removeBackgroundLoadError = err;
  });
</script>
<script src="/dev/assetDb.js"></script>
<script src="/dev/dialogueData.js"></script>
<script>
let currentType = 'background';
let currentCharacterKey = dialogueCharacters[0].id;
let pendingFile = null;

const el = {
  tabBackground: document.getElementById('tabBackground'),
  tabCharacter: document.getElementById('tabCharacter'),
  charPicker: document.getElementById('charPicker'),
  charPickerPills: document.getElementById('charPickerPills'),
  dropzone: document.getElementById('dropzone'),
  selectBtn: document.getElementById('selectBtn'),
  fileInput: document.getElementById('fileInput'),
  typeHint: document.getElementById('typeHint'),
  previewPanel: document.getElementById('previewPanel'),
  previewImg: document.getElementById('previewImg'),
  previewType: document.getElementById('previewType'),
  previewFile: document.getElementById('previewFile'),
  previewSize: document.getElementById('previewSize'),
  saveBtn: document.getElementById('saveBtn'),
  charEditorPanel: document.getElementById('charEditorPanel'),
  editorImg: document.getElementById('editorImg'),
  bgRemoveBtn: document.getElementById('bgRemoveBtn'),
  frameBtnFull: document.getElementById('frameBtnFull'),
  frameBtnDialogue: document.getElementById('frameBtnDialogue'),
  frameBtnFace: document.getElementById('frameBtnFace'),
  cropEditor: document.getElementById('cropEditor'),
  cropStage: document.getElementById('cropStage'),
  cropImg: document.getElementById('cropImg'),
  cropBox: document.getElementById('cropBox'),
  cropZoom: document.getElementById('cropZoom'),
  cropCancelBtn: document.getElementById('cropCancelBtn'),
  cropSaveBtn: document.getElementById('cropSaveBtn'),
  backgroundList: document.getElementById('backgroundList'),
  characterList: document.getElementById('characterList'),
  lightbox: document.getElementById('lightbox'),
  lightboxImg: document.getElementById('lightboxImg'),
};

function selectType(type) {
  currentType = type;
  el.tabBackground.classList.toggle('active', type === 'background');
  el.tabCharacter.classList.toggle('active', type === 'character');
  el.charPicker.classList.toggle('hidden', type !== 'character');
  el.fileInput.accept = type === 'background' ? 'image/jpeg,image/png,image/webp' : 'image/png,image/webp';
  el.typeHint.textContent = type === 'background' ? '.jpg · .jpeg · .png · .webp' : '.png · .webp (투명 배경 권장)';
  if (type === 'character') renderCharPicker();
  clearPending();
}

function renderCharPicker() {
  el.charPickerPills.innerHTML = dialogueCharacters.map(c =>
    `<button class="char-pill${c.id === currentCharacterKey ? ' active' : ''}" data-key="${c.id}">${escapeHtml(c.name)}</button>`
  ).join('');
  el.charPickerPills.querySelectorAll('.char-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCharacterKey = btn.dataset.key;
      renderCharPicker();
    });
  });
}

function clearPending() {
  pendingFile = null;
  el.previewPanel.classList.add('hidden');
  el.charEditorPanel.classList.add('hidden');
  el.cropEditor.classList.add('hidden');
  el.fileInput.value = '';
}

function onFilesSelected(files) {
  const file = files && files[0];
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    if (currentType === 'background') {
      pendingFile = { blob: file, name: file.name, width: img.naturalWidth, height: img.naturalHeight };
      renderPreview(url);
    } else {
      openCharEditor(file, url, img);
    }
  };
  img.src = url;
}

function renderPreview(url) {
  el.previewPanel.classList.remove('hidden');
  el.previewImg.src = url;
  el.previewType.textContent = currentType.toUpperCase();
  el.previewFile.textContent = pendingFile.name;
  el.previewSize.textContent = `${pendingFile.width} × ${pendingFile.height}`;
}

// Only reachable for backgrounds now — character uploads go through the
// crop editor below, which saves each framing itself.
async function saveAsset() {
  if (!pendingFile) return;
  try {
    await AssetDB.addAsset({ type: 'background', name: pendingFile.name, blob: pendingFile.blob, width: pendingFile.width, height: pendingFile.height });
    clearPending();
    await refreshLists();
  } catch (err) {
    DevDiag.show('이미지 저장 실패: ' + (err && err.message ? err.message : err));
  }
}

/* ===== Character photo editor: optional background removal + 3 crop presets ===== */
const CROP_PRESETS = {
  full: { aspect: 9 / 16, zoomDefault: 92, vAnchor: 'center', label: '전신' },
  dialogue: { aspect: 3 / 4, zoomDefault: 62, vAnchor: 0.08, label: '대화신' },
  face: { aspect: 1, zoomDefault: 26, vAnchor: 0.05, label: '얼굴' },
};

let workingBlob = null;
let workingImgNatural = { width: 0, height: 0 };
let sourceFileBaseName = '';
let activePreset = null;
let cropState = null;
let cropDrag = null;

function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }

function openCharEditor(file, url, img) {
  workingBlob = file;
  workingImgNatural = { width: img.naturalWidth, height: img.naturalHeight };
  sourceFileBaseName = file.name.replace(/\.[^.]+$/, '');
  el.editorImg.src = url;
  el.bgRemoveBtn.disabled = false;
  el.bgRemoveBtn.textContent = '배경 제거 (누끼)';
  el.bgRemoveBtn.classList.remove('done');
  [el.frameBtnFull, el.frameBtnDialogue, el.frameBtnFace].forEach(btn => {
    btn.classList.remove('done');
    btn.textContent = CROP_PRESETS[btn.dataset.preset].label;
  });
  el.cropEditor.classList.add('hidden');
  el.charEditorPanel.classList.remove('hidden');
}

el.bgRemoveBtn.addEventListener('click', async () => {
  // Always give immediate visual feedback that the click registered, before
  // any async work — otherwise a load/network failure can look like the
  // button did nothing at all.
  el.bgRemoveBtn.disabled = true;
  el.bgRemoveBtn.textContent = '모듈 확인 중...';
  await window.__removeBackgroundReady;
  if (!window.__removeBackground) {
    const reason = window.__removeBackgroundLoadError;
    DevDiag.show('배경 제거 모듈 로드 실패: ' + (reason && reason.message ? reason.message : '네트워크 또는 CDN 문제로 모듈을 불러오지 못했습니다.'));
    el.bgRemoveBtn.textContent = '배경 제거 (누끼)';
    el.bgRemoveBtn.disabled = false;
    return;
  }
  el.bgRemoveBtn.textContent = '처리 중... (몇 초 걸릴 수 있어요)';
  try {
    const resultBlob = await window.__removeBackground(workingBlob);
    workingBlob = resultBlob;
    el.editorImg.src = URL.createObjectURL(resultBlob);
    el.bgRemoveBtn.textContent = '배경 제거 완료 ✓';
    el.bgRemoveBtn.classList.add('done');
  } catch (err) {
    DevDiag.show('배경 제거 실패: ' + (err && err.message ? err.message : err));
    el.bgRemoveBtn.textContent = '배경 제거 (누끼)';
  } finally {
    el.bgRemoveBtn.disabled = false;
  }
});

function enterCropMode(preset) {
  activePreset = preset;
  const cfg = CROP_PRESETS[preset];
  el.cropImg.src = URL.createObjectURL(workingBlob);
  el.cropEditor.classList.remove('hidden');

  const stageRect = el.cropStage.getBoundingClientRect();
  const nw = workingImgNatural.width, nh = workingImgNatural.height;
  const imgScale = Math.min(stageRect.width / nw, stageRect.height / nh);
  const dispW = nw * imgScale, dispH = nh * imgScale;
  const imgLeft = (stageRect.width - dispW) / 2, imgTop = (stageRect.height - dispH) / 2;
  el.cropImg.style.width = dispW + 'px';
  el.cropImg.style.height = dispH + 'px';
  el.cropImg.style.left = imgLeft + 'px';
  el.cropImg.style.top = imgTop + 'px';

  let maxBoxW, maxBoxH;
  if (dispW / dispH > cfg.aspect) { maxBoxH = dispH; maxBoxW = dispH * cfg.aspect; }
  else { maxBoxW = dispW; maxBoxH = dispW / cfg.aspect; }

  cropState = { imgLeft, imgTop, dispW, dispH, imgScale, maxBoxW, maxBoxH };
  el.cropZoom.value = cfg.zoomDefault;
  updateCropBoxFromZoom(true);
}

function updateCropBoxFromZoom(recenter) {
  const s = cropState;
  const cfg = CROP_PRESETS[activePreset];
  const zoomFrac = Number(el.cropZoom.value) / 100;
  const boxW = s.maxBoxW * zoomFrac;
  const boxH = s.maxBoxH * zoomFrac;
  const boxX = recenter ? s.imgLeft + (s.dispW - boxW) / 2 : clamp(s.boxX, s.imgLeft, s.imgLeft + s.dispW - boxW);
  let boxY;
  if (recenter) {
    boxY = cfg.vAnchor === 'center' ? s.imgTop + (s.dispH - boxH) / 2 : s.imgTop + s.dispH * cfg.vAnchor;
  } else {
    boxY = clamp(s.boxY, s.imgTop, s.imgTop + s.dispH - boxH);
  }
  s.boxW = boxW;
  s.boxH = boxH;
  s.boxX = clamp(boxX, s.imgLeft, s.imgLeft + s.dispW - boxW);
  s.boxY = clamp(boxY, s.imgTop, s.imgTop + s.dispH - boxH);
  renderCropBox();
}

function renderCropBox() {
  const s = cropState;
  el.cropBox.style.left = s.boxX + 'px';
  el.cropBox.style.top = s.boxY + 'px';
  el.cropBox.style.width = s.boxW + 'px';
  el.cropBox.style.height = s.boxH + 'px';
}

el.cropBox.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  el.cropBox.setPointerCapture(e.pointerId);
  cropDrag = { x: e.clientX, y: e.clientY, boxX: cropState.boxX, boxY: cropState.boxY };
});
el.cropBox.addEventListener('pointermove', (e) => {
  if (!cropDrag) return;
  const s = cropState;
  const dx = e.clientX - cropDrag.x, dy = e.clientY - cropDrag.y;
  s.boxX = clamp(cropDrag.boxX + dx, s.imgLeft, s.imgLeft + s.dispW - s.boxW);
  s.boxY = clamp(cropDrag.boxY + dy, s.imgTop, s.imgTop + s.dispH - s.boxH);
  renderCropBox();
});
['pointerup', 'pointercancel'].forEach(evt => el.cropBox.addEventListener(evt, () => { cropDrag = null; }));
el.cropZoom.addEventListener('input', () => updateCropBoxFromZoom(false));

function cropImageElementToBlob(imgEl, x, y, w, h) {
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(w));
    canvas.height = Math.max(1, Math.round(h));
    canvas.getContext('2d').drawImage(imgEl, x, y, w, h, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(resolve, 'image/png');
  });
}

function loadImageFromBlob(blob) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(blob);
  });
}

function markFrameDone(preset) {
  const btn = { full: el.frameBtnFull, dialogue: el.frameBtnDialogue, face: el.frameBtnFace }[preset];
  btn.classList.add('done');
  btn.textContent = `${CROP_PRESETS[preset].label} ✓`;
}

el.cropCancelBtn.addEventListener('click', () => el.cropEditor.classList.add('hidden'));

el.cropSaveBtn.addEventListener('click', async () => {
  const s = cropState;
  const natX = (s.boxX - s.imgLeft) / s.imgScale;
  const natY = (s.boxY - s.imgTop) / s.imgScale;
  const natW = s.boxW / s.imgScale;
  const natH = s.boxH / s.imgScale;
  try {
    const cropBlob = await cropImageElementToBlob(el.cropImg, natX, natY, natW, natH);
    const croppedImg = await loadImageFromBlob(cropBlob);
    const presetLabel = CROP_PRESETS[activePreset].label;
    const name = `${sourceFileBaseName} (${presetLabel}).png`;
    const record = await AssetDB.addAsset({ type: 'character', name, blob: cropBlob, width: croppedImg.naturalWidth, height: croppedImg.naturalHeight });
    // The dialogue-scene framing is what /dev/game actually renders, so make
    // it the active photo for this character; 전신/얼굴 just join the library.
    if (activePreset === 'dialogue') DevGameState.setCharacterAssetId(currentCharacterKey, record.id);
    markFrameDone(activePreset);
    el.cropEditor.classList.add('hidden');
    await refreshLists();
  } catch (err) {
    DevDiag.show('프레임 저장 실패: ' + (err && err.message ? err.message : err));
  }
});

[el.frameBtnFull, el.frameBtnDialogue, el.frameBtnFace].forEach(btn => {
  btn.addEventListener('click', () => enterCropMode(btn.dataset.preset));
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function refreshLists() {
  const [bgs, chars] = await Promise.all([
    AssetDB.getAssetsByType('background'),
    AssetDB.getAssetsByType('character'),
  ]);
  renderList('backgroundList', bgs);
  renderList('characterList', chars);
}

function renderList(listKey, assets) {
  const listEl = el[listKey];
  if (!assets.length) {
    listEl.innerHTML = '<div class="empty-note">아직 업로드한 이미지가 없습니다.</div>';
    return;
  }
  listEl.innerHTML = assets.map(a => {
    const url = a.dataUrl;
    const actionButtons = a.type === 'background'
      ? `<button class="use" onclick="useAsBackground('${a.id}')">USE IN TEST</button>`
      : dialogueCharacters.map(c => `<button class="use" onclick="useAsCharacter('${c.id}','${a.id}')">${escapeHtml(c.name)}로 사용</button>`).join('');
    const assignedTo = a.type === 'character'
      ? dialogueCharacters.filter(c => DevGameState.getCharacterAssetId(c.id) === a.id).map(c => c.name)
      : [];
    const tag = assignedTo.length ? `<span class="asset-tag">${escapeHtml(assignedTo.join(' · '))} 사용 중</span><br>` : '';
    return `<div class="asset-card">
      <img class="asset-thumb" src="${url}" data-url="${url}" onclick="previewAsset(this.dataset.url)">
      <div class="asset-info">
        ${tag}
        <div class="asset-name">${escapeHtml(a.name)}</div>
        <div class="asset-meta">${a.width} × ${a.height}</div>
      </div>
      <div class="asset-actions">
        ${actionButtons}
        <button class="danger" onclick="removeAsset('${a.type}','${a.id}')">DELETE</button>
      </div>
    </div>`;
  }).join('');
}

function previewAsset(url) {
  el.lightboxImg.src = url;
  el.lightbox.classList.remove('hidden');
}

function useAsBackground(id) {
  DevGameState.setBackgroundId(id);
  location.href = '/dev/game/';
}

function useAsCharacter(characterKey, id) {
  DevGameState.setCharacterAssetId(characterKey, id);
  location.href = '/dev/game/';
}

async function removeAsset(type, id) {
  if (!confirm('이 이미지를 삭제할까요?')) return;
  await AssetDB.deleteAsset(id);
  if (type === 'background' && DevGameState.getBackgroundId() === id) DevGameState.setBackgroundId(null);
  if (type === 'character') {
    dialogueCharacters.forEach(c => {
      if (DevGameState.getCharacterAssetId(c.id) === id) DevGameState.setCharacterAssetId(c.id, null);
    });
  }
  await refreshLists();
}

el.tabBackground.addEventListener('click', () => selectType('background'));
el.tabCharacter.addEventListener('click', () => selectType('character'));
el.selectBtn.addEventListener('click', () => el.fileInput.click());
el.dropzone.addEventListener('click', (e) => { if (e.target === el.selectBtn) return; el.fileInput.click(); });
el.fileInput.addEventListener('change', (e) => onFilesSelected(e.target.files));
el.saveBtn.addEventListener('click', saveAsset);
el.lightbox.addEventListener('click', () => el.lightbox.classList.add('hidden'));

['dragover', 'dragenter'].forEach(evt => el.dropzone.addEventListener(evt, (e) => {
  e.preventDefault();
  el.dropzone.classList.add('drag');
}));
['dragleave', 'dragend'].forEach(evt => el.dropzone.addEventListener(evt, () => el.dropzone.classList.remove('drag')));
el.dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  el.dropzone.classList.remove('drag');
  onFilesSelected(e.dataTransfer.files);
});

refreshLists();
</script>
</body>
</html>
