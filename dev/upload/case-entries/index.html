<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · 사건 카드 / 스프라이트 시트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;--surface-3:#20262D;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}
.frame{width:100%;max-width:520px;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top,0)) 18px calc(40px + env(safe-area-inset-bottom,0))}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--surface-1);border:1px solid var(--divider);color:var(--text-primary);display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.page-title{font-size:18px;font-weight:700}
.section{background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:14px;margin-bottom:16px}
.section-title{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 11px;border-radius:16px;background:var(--surface-2);border:1px solid var(--divider);color:var(--text-secondary);font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.active{background:rgba(89,184,200,.14);color:var(--cyan);border-color:rgba(89,184,200,.4)}
.row-list{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto}
.crow{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--divider);border-radius:10px;padding:9px 11px;cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.crow.active{border-color:rgba(89,184,200,.5);background:rgba(89,184,200,.08)}
.crow-main{flex:1;min-width:0}
.crow-title{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow-sub{font-size:10.5px;color:var(--text-muted);margin-top:2px}
.crow-tags{display:flex;gap:4px;flex-shrink:0}
.crow-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:6px;letter-spacing:.03em}
.tag-hard{color:var(--amber);background:rgba(214,168,75,.14)}
.tag-merge{color:var(--cyan);background:rgba(89,184,200,.14)}
.tag-missing{color:var(--signal-red);background:rgba(217,65,65,.14)}
.field{margin-bottom:11px}
.field-label{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--text-muted);text-transform:uppercase;margin-bottom:5px;display:block}
.field input[type=text],.field textarea,.field select{width:100%;background:var(--surface-2);border:1px solid var(--divider);border-radius:8px;padding:9px 10px;color:var(--text-primary);font-size:12.5px;font-family:inherit}
.field textarea{resize:vertical;min-height:56px}
.field-check{display:flex;align-items:center;gap:8px;font-size:12.5px}
.btn{background:var(--surface-2);border:1px solid var(--divider);color:var(--text-primary);padding:10px 14px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--cyan);color:#06181c;border:none}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.empty{font-size:12px;color:var(--text-muted);padding:14px 2px;text-align:center}
.sheet-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--divider);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.sheet-grid-canvas{width:100%;border-radius:10px;background:var(--surface-3);margin-bottom:10px}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slot-cell{background:var(--surface-2);border:1px solid var(--divider);border-radius:10px;padding:8px;text-align:center}
.slot-cell canvas{width:100%;border-radius:6px;margin-bottom:6px}
.slot-cell-label{font-size:10px;color:var(--text-muted);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-badge{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px}
.status-approved{color:#5FD98A;background:rgba(95,217,138,.14)}
.status-cropped,.status-generated{color:var(--amber);background:rgba(214,168,75,.14)}
.status-rejected{color:var(--signal-red);background:rgba(217,65,65,.14)}
.status-planned{color:var(--text-muted);background:rgba(255,255,255,.06)}
pre.prompt-box{white-space:pre-wrap;font-family:var(--mono);font-size:11px;line-height:1.5;background:var(--surface-2);border:1px solid var(--divider);border-radius:10px;padding:12px;max-height:34vh;overflow-y:auto}
.hint{font-size:11px;color:var(--text-muted);margin:6px 0}
.preset-icon-grid{display:flex;flex-wrap:wrap;gap:6px}
.preset-icon-chip{display:flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--divider);border-radius:20px;padding:6px 11px;font-size:12px;color:var(--text-secondary);cursor:pointer;font-family:inherit}
.preset-icon-chip .emoji{font-size:14px}
.preset-icon-chip.active{border-color:rgba(89,184,200,.6);background:rgba(89,184,200,.14);color:var(--cyan)}
.slot-cutout-btn{width:100%}
.slot-cutout-btn[disabled]{opacity:.5;pointer-events:none}
.slot-progress{margin-top:6px}
.slot-progress.hidden{display:none}
.slot-progress-text{font-size:9.5px;color:var(--text-muted);margin-bottom:4px}
.slot-progress-bar{height:4px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.slot-progress-fill{height:100%;background:var(--cyan);width:0%;transition:width .2s ease}
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <a class="back-btn" href="/dev/upload/">←</a>
    <div class="page-title">사건 카드 / 스프라이트 시트</div>
  </div>

  <div class="section">
    <div class="section-title">사건 카드 목록</div>
    <div class="chips" id="cardFilterChips"></div>
    <div class="row-list" id="cardList"></div>
  </div>

  <div class="section hidden" id="editSection">
    <div class="section-title">카드 편집</div>
    <div id="editForm"></div>
  </div>

  <div class="section">
    <div class="section-title">스프라이트 시트</div>
    <div id="sheetList" class="row-list" style="margin-bottom:10px"></div>
    <div class="btn-row">
      <button class="btn" id="newSheetBtn">+ 새 시트</button>
    </div>
  </div>

  <div class="section hidden" id="sheetDetailSection">
    <div class="section-title" id="sheetDetailTitle">시트 상세</div>
    <div id="sheetDetailBody"></div>
  </div>
</div>

<script src="/dev/assetDb.js"></script>
<script src="/dev/dialogueData.js"></script>
<script src="/dev/data/interactionDefs.js"></script>
<script src="/dev/caseEntryModel.js"></script>
<script>
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

/* ===== 전체 증거/증언/추리메모 정의 수집 (§10.13 관리자 목록) =====
   allScenes를 훑어 dialogueData.js/interactionDefs.js의 addEvidence/
   addQuestion 효과를 전부 모은다 — 플레이어의 실제 획득 여부와 무관하게
   "코드에 정의된 전부"를 보여줘야 하는 저작 도구이므로 CaseFileState(플레이
   상태)가 아니라 여기서 직접 훑는다. 미니게임이 target 객체로 동적
   생성하는 몇 개(§10.1 minigame-photo-zoom 등)는 allScenes에 안 잡혀
   수동으로 보충한다 — 같은 패턴을 쓰는 미니게임이 새로 생기면 여기 추가. */
const DYNAMIC_MINIGAME_EVIDENCE = [
  { id: 'evidence-k01-nameplate-photo', code: 'E-K01', category: 'photo', title: '(미니게임) 진열장 명찰 확대', kind: 'evidence' },
  { id: 'evidence-mina-lens-reflection', code: 'E-M00', category: 'photo', title: '(미니게임) 렌즈 반사', kind: 'evidence' },
  { id: 'evidence-k01-case-door-ajar', code: 'E-K01', category: 'photo', title: '(미니게임) 진열장 문 반쯤 열림', kind: 'evidence' },
  { id: 'evidence-k01-empty-case', code: 'E-K01', category: 'photo', title: '(미니게임) 빈 진열장', kind: 'evidence' },
];

function collectAllCaseDefinitions() {
  const byId = new Map();
  function addDef(def) { if (def && def.id && !byId.has(def.id)) byId.set(def.id, def); }
  function walkEffects(effects) {
    (effects || []).forEach(ef => {
      if (ef.type === 'addEvidence' && ef.evidence) addDef(Object.assign({ kind: ef.evidence.category === 'testimony' ? 'testimony' : 'evidence' }, ef.evidence));
      if (ef.type === 'addQuestion' && ef.question) addDef(Object.assign({ kind: 'memo' }, ef.question));
    });
  }
  if (typeof allScenes !== 'undefined') {
    allScenes.forEach(scene => (scene.lines || []).forEach(line => {
      walkEffects(line.effects);
      (line.choices || []).forEach(c => walkEffects(c.effects));
    }));
  }
  DYNAMIC_MINIGAME_EVIDENCE.forEach(addDef);
  return Array.from(byId.values());
}

/* ===== 증거 프리셋 아이콘 (§증거 프리셋) — AI 스프라이트 시트 승인을
   기다릴 필요 없이, 카드마다 카테고리 기본 아이콘보다 더 구체적인
   이모지를 바로 골라 붙일 수 있게 하는 가벼운 대안. meta.presetIcon으로
   저장되며 caseEntryModel.js의 fallbackIcon 계산이 이 값을 최우선으로
   쓰므로(단, 승인된 imageAssetId보다는 낮은 우선순위) 케이스파일 탭/
   탐색허브 제시 시트/대화 시트 세 곳에 코드 변경 없이 그대로 반영된다. */
const EVIDENCE_ICON_PRESETS = [
  { emoji: '🔑', label: '열쇠' },
  { emoji: '🪪', label: '카드/신분증' },
  { emoji: '📷', label: '사진' },
  { emoji: '🎞️', label: '영상' },
  { emoji: '📄', label: '문서' },
  { emoji: '🧾', label: '영수증' },
  { emoji: '✉️', label: '편지/메모' },
  { emoji: '📓', label: '수첩/일기' },
  { emoji: '🗺️', label: '지도' },
  { emoji: '📱', label: '휴대폰' },
  { emoji: '⌚', label: '시계' },
  { emoji: '💍', label: '보석/장신구' },
  { emoji: '👜', label: '가방/소지품' },
  { emoji: '👣', label: '발자국' },
  { emoji: '🖐️', label: '지문' },
  { emoji: '🩸', label: '혈흔' },
  { emoji: '🚪', label: '문/자물쇠' },
  { emoji: '💰', label: '금전' },
  { emoji: '🗣️', label: '진술' },
  { emoji: '📦', label: '기타' },
];

let allDefs = [];
let metaCatalog = {};
let hardReferenced = new Set();
let cardFilter = 'all';
let selectedCardId = null;
let editingPresetIcon = null; // 편집 중인 카드에서 고른 프리셋 이모지 — 저장 전까지는 폼 로컬 상태
let sheetManifests = {};
let selectedSheetId = null;
let pendingMasterImg = null; // <img> currently loaded for slicing, per selected sheet
let pendingSlots = null; // [{row,col,slot,canvas,blob}] after 분할 실행

// AI 배경 제거(누끼) — 모듈은 페이지 로드 시 미리 받아두고, 버튼을 누른
// 시점엔 준비 여부만 기다린다. 진행률은 라이브러리의 progress 콜백(모델
// 다운로드/추론 단계별 current/total)을 그대로 프로그레스바에 반영한다.
window.__removeBackgroundReady = import('https://cdn.jsdelivr.net/npm/@imgly/background-removal/+esm')
  .then(mod => {
    if (typeof mod.removeBackground !== 'function') {
      throw new Error('모듈은 로드됐지만 removeBackground 함수를 찾지 못함 (exports: ' + Object.keys(mod).join(', ') + ')');
    }
    window.__removeBackground = mod.removeBackground;
  })
  .catch(err => { window.__removeBackgroundLoadError = err; });

// 슬롯 캔버스에 직접 그려 넣는다 — approveSlot()이 그 시점의 캔버스 픽셀을
// 그대로 업로드하므로 별도 저장 없이 바로 반영된다. 단, runAutoSlice()는
// pendingMasterImg에서 매번 다시 자르므로(§기존 승인/거절 새로고침 로직),
// 다른 슬롯을 승인/거절하면 이 슬롯의 배경 제거는 초기화된다 — 승인 전에
// 적용하는 것을 권장.
async function removeSlotBackground(slotNum) {
  const s = pendingSlots && pendingSlots.find(x => x.slot === slotNum);
  if (!s) return;
  const btn = document.querySelector(`[data-slot-cell="${slotNum}"] .slot-cutout-btn`);
  const progressWrap = document.getElementById('slotProgress-' + slotNum);
  const progressFill = document.getElementById('slotProgressFill-' + slotNum);
  const progressText = document.getElementById('slotProgressText-' + slotNum);
  const prevLabel = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '처리 중...'; }
  if (progressWrap) progressWrap.classList.remove('hidden');
  if (progressFill) progressFill.style.width = '0%';
  if (progressText) progressText.textContent = '배경 제거 모듈 확인 중...';
  try {
    await window.__removeBackgroundReady;
    if (!window.__removeBackground) {
      const reason = window.__removeBackgroundLoadError;
      throw new Error('배경 제거 모듈 로드 실패: ' + (reason && reason.message ? reason.message : '네트워크 또는 CDN 문제로 모듈을 불러오지 못했습니다.'));
    }
    const sourceBlob = await new Promise(resolve => s.canvas.toBlob(resolve, 'image/png'));
    const resultBlob = await window.__removeBackground(sourceBlob, {
      progress: (key, current, total) => {
        const pct = total ? Math.round(current / total * 100) : 0;
        if (progressFill) progressFill.style.width = pct + '%';
        if (progressText) progressText.textContent = '배경 제거 중... ' + pct + '%';
      }
    });
    const bitmap = await createImageBitmap(resultBlob);
    const ctx = s.canvas.getContext('2d');
    ctx.clearRect(0, 0, s.canvas.width, s.canvas.height);
    ctx.drawImage(bitmap, 0, 0, s.canvas.width, s.canvas.height);
  } catch (err) {
    alert('배경 제거 실패: ' + (err && err.message ? err.message : err));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = prevLabel; }
    if (progressWrap) progressWrap.classList.add('hidden');
  }
}

async function init() {
  allDefs = collectAllCaseDefinitions();
  hardReferenced = CaseEntryModel.auditEvidenceReferences();
  // 코드 내장 기본 카탈로그(§Phase2 CASE_ENTRY_META_DEFAULTS) 위에 실제
  // Supabase 오버라이드를 얹은 "실제 적용되는" 값을 보여준다 — 그래야 이미
  // 기본값으로 병합된 카드(예: 레오 의뢰 스레드)가 여기서도 병합후보로
  // 잘못 표시되지 않는다.
  const supabaseCatalog = await AssetDB.getCaseEntryMeta().catch(() => ({}));
  metaCatalog = CaseEntryModel.getEffectiveCaseEntryMeta(supabaseCatalog);
  sheetManifests = await AssetDB.getSpriteSheetManifests().catch(() => ({}));
  renderCardFilterChips();
  renderCardList();
  renderSheetList();
}

/* ===== 사건 카드 목록 ===== */
function displayRows() {
  // 이미 다른 카드의 대표(representativeId)로 지정된 id는 그 자체가 병합
  // 결과물이므로 "병합 후보" 표시에서 제외한다(대표 카드는 더 병합할 필요가
  // 없음 — 병합 후보는 "아직 병합 안 된, 병합될 수도 있는 낱개 카드"만 뜻함).
  const representativeIds = new Set(Object.values(metaCatalog).filter(m => m.mergeAsStage && m.representativeId).map(m => m.representativeId));
  return allDefs.map(def => {
    const meta = metaCatalog[def.id] || {};
    const kind = meta.kind || def.kind;
    return {
      id: def.id, kind, code: def.code || '', title: def.title || def.id, meta,
      hard: hardReferenced.has(def.id),
      // 병합 후보 = 대화/상호작용 게이트가 요구하지 않고, 추리 메모도 아니고,
      // 아직 어떤 카드에도 병합되지 않았고, 다른 카드의 대표도 아닌 것 —
      // auditEvidenceReferences로 실제로 검증된 것만 후보로 뜬다(§Phase 2
      // "50개 재조립" 원칙).
      mergeCandidate: kind !== 'memo' && !hardReferenced.has(def.id) && !meta.mergeAsStage && !representativeIds.has(def.id),
      missingVisual: kind !== 'memo' && !meta.visualDescription,
      noSheet: kind !== 'memo' && !meta.spriteSheetId,
    };
  });
}
function renderCardFilterChips() {
  const chips = [
    { id: 'all', label: '전체' }, { id: 'evidence', label: '증거' }, { id: 'testimony', label: '증언' }, { id: 'memo', label: '추리메모' },
    { id: 'mergeCandidate', label: '병합 후보' }, { id: 'missingVisual', label: '시각 묘사 없음' }, { id: 'noSheet', label: '시트 미할당' },
  ];
  document.getElementById('cardFilterChips').innerHTML = chips.map(c =>
    `<button class="chip${cardFilter === c.id ? ' active' : ''}" data-filter="${c.id}">${c.label}</button>`
  ).join('');
  document.querySelectorAll('[data-filter]').forEach(btn => btn.addEventListener('click', () => { cardFilter = btn.dataset.filter; renderCardFilterChips(); renderCardList(); }));
}
function renderCardList() {
  const rows = displayRows().filter(r => {
    if (cardFilter === 'all') return true;
    if (cardFilter === 'evidence' || cardFilter === 'testimony' || cardFilter === 'memo') return r.kind === cardFilter;
    return r[cardFilter];
  });
  const list = document.getElementById('cardList');
  if (!rows.length) { list.innerHTML = '<div class="empty">해당하는 카드가 없습니다.</div>'; return; }
  list.innerHTML = rows.map(r => `
    <button class="crow${r.id === selectedCardId ? ' active' : ''}" data-card="${r.id}">
      <div class="crow-main">
        <div class="crow-title">${escapeHtml(r.title)}</div>
        <div class="crow-sub">${escapeHtml(r.code)} · ${r.kind}</div>
      </div>
      <div class="crow-tags">
        ${r.hard ? '<span class="crow-tag tag-hard">게이트</span>' : ''}
        ${r.mergeCandidate ? '<span class="crow-tag tag-merge">병합후보</span>' : ''}
        ${r.missingVisual ? '<span class="crow-tag tag-missing">묘사없음</span>' : ''}
      </div>
    </button>
  `).join('');
  list.querySelectorAll('[data-card]').forEach(btn => btn.addEventListener('click', () => { selectedCardId = btn.dataset.card; renderCardList(); renderEditForm(); }));
}

function splitCsv(v) { return v.split(',').map(s => s.trim()).filter(Boolean); }
async function saveCardMeta(id) {
  const current = metaCatalog[id] || {};
  const kindVal = document.getElementById('f-kind').value;
  const patch = {
    presentable: document.getElementById('f-presentable').checked,
    presetIcon: editingPresetIcon,
    groupId: document.getElementById('f-groupId').value.trim() || null,
    mergeAsStage: document.getElementById('f-mergeAsStage').checked,
    representativeId: document.getElementById('f-representativeId').value.trim() || null,
    stageOrder: Number(document.getElementById('f-stageOrder').value) || 0,
    relatedNpcIds: splitCsv(document.getElementById('f-relatedNpcIds').value),
    topicTags: splitCsv(document.getElementById('f-topicTags').value),
    week: document.getElementById('f-week').value.trim() === '' ? null : Number(document.getElementById('f-week').value),
    visualDescription: document.getElementById('f-visualDescription').value,
    iconComposition: document.getElementById('f-iconComposition').value,
    iconBackground: document.getElementById('f-iconBackground').value,
  };
  if (kindVal) patch.kind = kindVal; else delete patch.kind;
  const next = Object.assign({}, current, patch);
  // 안전장치 — 대화/상호작용 게이트가 요구하는 id는 여기서도 병합을 막는다
  // (mergeGroupedEntries가 어차피 무시하지만, 저장 단계에서 미리 알려준다).
  if (next.mergeAsStage && hardReferenced.has(id)) {
    alert('이 카드는 대화/상호작용 게이트가 정확한 id로 요구하고 있어 병합할 수 없습니다. mergeAsStage를 해제해주세요.');
    return;
  }
  await AssetDB.setCaseEntryMeta(id, next);
  metaCatalog[id] = next;
  renderCardList();
  renderEditForm();
  alert('저장했습니다.');
}

/* ===== 스프라이트 시트 ===== */
function renderSheetList() {
  const ids = Object.keys(sheetManifests);
  const list = document.getElementById('sheetList');
  if (!ids.length) { list.innerHTML = '<div class="empty">아직 만든 시트가 없습니다.</div>'; return; }
  list.innerHTML = ids.map(id => {
    const m = sheetManifests[id];
    const approved = (m.items || []).filter(it => it.status === 'approved').length;
    return `<button class="sheet-row" data-sheet="${id}"><span>${escapeHtml(id)} (${m.layout.columns}×${m.layout.rows})</span><span class="hint">${approved}/${(m.items||[]).length} 승인</span></button>`;
  }).join('');
  list.querySelectorAll('[data-sheet]').forEach(btn => btn.addEventListener('click', () => { selectedSheetId = btn.dataset.sheet; pendingMasterImg = null; pendingSlots = null; renderSheetDetail(); }));
}
document.getElementById('newSheetBtn').addEventListener('click', async () => {
  const id = prompt('시트 ID (예: w2-physical-01)');
  if (!id) return;
  if (sheetManifests[id]) { alert('이미 있는 시트 ID입니다.'); return; }
  const columns = 3, rows = 3;
  const manifest = { sheetId: id, layout: { columns, rows, sourceWidth: columns * 1024, sourceHeight: rows * 1024 }, sourceAssetId: null, status: 'planned', items: [] };
  await AssetDB.setSpriteSheetManifest(id, manifest);
  sheetManifests[id] = manifest;
  renderSheetList();
});

function unassignedCandidates(sheetId) {
  return displayRows().filter(r => r.kind !== 'memo' && (!r.meta.spriteSheetId || r.meta.spriteSheetId === sheetId));
}

function renderSheetDetail() {

        </select>
      </div>

  document.getElementById('sheetDetailBody').innerHTML = `
    ${assignRows.join('')}
    <div class="btn-row"><button class="btn btn-primary" id="saveSlotsBtn">슬롯 배정 저장</button></div>

      <div class="btn-row"><button class="btn" id="copyPromptBtn">프롬프트 복사</button></div>
    </div>
    <div class="field" style="margin-top:14px">
      <label class="field-label">마스터 이미지 업로드 (그리드 미리보기)</label>
      <input type="file" id="masterFileInput" accept="image/png,image/jpeg,image/webp">
      <canvas class="sheet-grid-canvas" id="gridPreviewCanvas"></canvas>
      <div class="btn-row"><button class="btn btn-primary" id="sliceBtn" disabled>자동 분할 실행</button></div>
    </div>
    <div id="slotResultGrid" class="slot-grid"></div>
  `;
  refreshPromptBox();
  document.getElementById('saveSlotsBtn').addEventListener('click', saveSlotAssignments);
  document.getElementById('copyPromptBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(document.getElementById('promptBox').textContent).then(() => alert('복사했습니다.'));
  });
  document.getElementById('masterFileInput').addEventListener('change', onMasterFileSelected);
  document.getElementById('sliceBtn').addEventListener('click', runAutoSlice);

async function saveSlotAssignments() {
  const manifest = sheetManifests[selectedSheetId];
  const totalSlots = manifest.layout.columns * manifest.layout.rows;
  const items = [];
  for (let slot = 1; slot <= totalSlots; slot++) {
    const select = document.querySelector(`[data-slot-assign="${slot}"]`);
    const entryId = select.value;
    if (!entryId) continue;
    const row = Math.ceil(slot / manifest.layout.columns);
    const col = ((slot - 1) % manifest.layout.columns) + 1;
    const def = allDefs.find(d => d.id === entryId);
    items.push({ slot, row, column: col, entryId, code: def ? def.code : '', title: def ? def.title : entryId, status: (manifest.items.find(it => it.entryId === entryId) || {}).status || 'planned' });
    const meta = metaCatalog[entryId] || {};
    metaCatalog[entryId] = Object.assign({}, meta, { spriteSheetId: selectedSheetId, spriteSlot: slot, spriteRow: row, spriteColumn: col });
    await AssetDB.setCaseEntryMeta(entryId, metaCatalog[entryId]);
  }
  manifest.items = items;
  await AssetDB.setSpriteSheetManifest(selectedSheetId, manifest);
  renderSheetList();
  renderSheetDetail();
  alert('슬롯 배정을 저장했습니다.');
}

function refreshPromptBox() {
  const box = document.getElementById('promptBox');
  if (box) box.textContent = buildSheetPrompt(sheetManifests[selectedSheetId]);

  lines.push('[공통 스타일]');
  ['한 장의 정사각형 마스터 이미지', `정확히 ${columns}열 × ${rows}행의 동일한 크기 배열`, `총 ${columns * rows}개의 서로 다른 증거 아이템`,
   '각 셀에는 증거 아이템 하나만 배치', '모든 아이템은 동일한 반사실적 디지털 페인팅 게임 스타일', '정면 또는 약간 위에서 내려다보는 3/4 시점',
   '아이템 전체가 잘리지 않고 셀 중앙에 들어오게', '아이템 주위에 넓은 빈 여백', '동일한 조명, 렌더링 밀도, 원근감', '밝은 중성 단색 배경',
   '접지 그림자는 매우 약하게', '각 셀의 물체와 그림자가 다른 셀로 넘어가지 않게'].forEach(x => lines.push('- ' + x));
  lines.push('', '[배치 순서]');
  for (let r = 1; r <= rows; r++) {
    const rowItems = (manifest.items || []).filter(it => it.row === r).sort((a, b) => a.column - b.column);
    lines.push(`${r}행: ${rowItems.map(it => it.code || it.entryId).join(', ') || '(미배정)'}`);
  }
  lines.push('');
  (manifest.items || []).slice().sort((a, b) => a.slot - b.slot).forEach(it => {
    const meta = metaCatalog[it.entryId] || {};
    lines.push(`[${it.row}행 ${it.column}열 · ${it.code || ''} · ${it.title || it.entryId}]`);
    lines.push(meta.visualDescription || '(시각 묘사 미작성 — 먼저 카드 편집에서 채워주세요)');
    lines.push('');
  });
  lines.push('[금지사항]');
  ['증거 번호, 이름, 설명문 등의 텍스트를 이미지 안에 쓰지 말 것', '숫자 라벨, 슬롯 번호, 워터마크를 넣지 말 것', '한 셀에 두 개 이상의 증거를 넣지 말 것',
   '아이템을 중복하거나 누락하지 말 것', '배치 순서를 바꾸지 말 것', '옆 셀로 물체나 그림자가 넘어가지 말 것', '사람, 얼굴, 손, 인체를 넣지 말 것',
   '아이템을 누군가 들고 있는 장면 금지', '방 전체, 거리 전체 등 복잡한 배경 장면 금지', '아이템 일부가 프레임 밖으로 잘리지 않게',
   '읽을 수 있는 실제 문서 글자를 생성하지 말 것', '사진처럼 지나치게 사실적인 상품 촬영 스타일 금지'].forEach(x => lines.push('- ' + x));
  return lines.join('\n');
}

/* ===== 마스터 이미지 업로드 → 그리드 미리보기 → 자동 분할 (§10.10) ===== */
function onMasterFileSelected(e) {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    pendingMasterImg = img;
    const manifest = sheetManifests[selectedSheetId];
    drawGridOverlay(document.getElementById('gridPreviewCanvas'), img, manifest.layout.columns, manifest.layout.rows);
    document.getElementById('sliceBtn').disabled = false;
  };
  img.src = URL.createObjectURL(file);
}
function drawGridOverlay(canvas, img, columns, rows) {
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  ctx.strokeStyle = 'rgba(255,70,70,.9)';
  ctx.lineWidth = Math.max(2, img.naturalWidth / 400);
  const cw = img.naturalWidth / columns, ch = img.naturalHeight / rows;
  for (let c = 1; c < columns; c++) { ctx.beginPath(); ctx.moveTo(c * cw, 0); ctx.lineTo(c * cw, img.naturalHeight); ctx.stroke(); }
  for (let r = 1; r < rows; r++) { ctx.beginPath(); ctx.moveTo(0, r * ch); ctx.lineTo(img.naturalWidth, r * ch); ctx.stroke(); }
}
const SPRITE_CELL_EXPORT_SIZE = 512;
function sliceImageIntoCells(img, columns, rows, exportSize) {
  const cw = img.naturalWidth / columns, ch = img.naturalHeight / rows;
  const slots = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < columns; c++) {
      const canvas = document.createElement('canvas');
      canvas.width = exportSize; canvas.height = exportSize;
      canvas.getContext('2d').drawImage(img, c * cw, r * ch, cw, ch, 0, 0, exportSize, exportSize);
      slots.push({ row: r + 1, column: c + 1, slot: r * columns + c + 1, canvas });
    }
  }
  return slots;
}
function runAutoSlice() {
  if (!pendingMasterImg) return;
  const manifest = sheetManifests[selectedSheetId];
  pendingSlots = sliceImageIntoCells(pendingMasterImg, manifest.layout.columns, manifest.layout.rows, SPRITE_CELL_EXPORT_SIZE);
  const grid = document.getElementById('slotResultGrid');
  grid.innerHTML = pendingSlots.map(s => {
    const item = (manifest.items || []).find(it => it.slot === s.slot);
    return `<div class="slot-cell" data-slot-cell="${s.slot}">
      <div class="slot-cell-label">#${s.slot} ${item ? escapeHtml(item.code || item.entryId) : '(미배정)'}</div>
    </div>`;
  }).join('');
  pendingSlots.forEach(s => {
    const cell = grid.querySelector(`[data-slot-cell="${s.slot}"]`);
    cell.insertBefore(s.canvas, cell.firstChild.nextSibling);
    const cutoutBtn = document.createElement('button');
    cutoutBtn.className = 'btn slot-cutout-btn';
    cutoutBtn.style.cssText = 'font-size:11px;padding:7px';
    cutoutBtn.textContent = '배경 제거';
    cutoutBtn.addEventListener('click', () => removeSlotBackground(s.slot));
    cell.appendChild(cutoutBtn);
    const progressWrap = document.createElement('div');
    progressWrap.className = 'slot-progress hidden';
    progressWrap.id = 'slotProgress-' + s.slot;
    progressWrap.innerHTML = `<div class="slot-progress-text" id="slotProgressText-${s.slot}"></div><div class="slot-progress-bar"><div class="slot-progress-fill" id="slotProgressFill-${s.slot}"></div></div>`;
    cell.appendChild(progressWrap);
    const item = (manifest.items || []).find(it => it.slot === s.slot);
    if (!item) return;
    const status = document.createElement('div');
    status.innerHTML = `<span class="status-badge status-${item.status || 'planned'}">${item.status || 'planned'}</span>`;
    cell.appendChild(status);
    const btnRow = document.createElement('div');
    btnRow.className = 'btn-row';
    btnRow.innerHTML = `<button class="btn btn-primary" data-approve="${s.slot}" style="flex:1;font-size:11px;padding:7px">승인</button><button class="btn" data-reject="${s.slot}" style="flex:1;font-size:11px;padding:7px">거절</button>`;
    cell.appendChild(btnRow);
    btnRow.querySelector('[data-approve]').addEventListener('click', () => approveSlot(s));
    btnRow.querySelector('[data-reject]').addEventListener('click', () => rejectSlot(s));
  });
}

// 승인 = 잘라낸 이미지를 실제로 업로드해 AssetDB에 자산으로 등록하고, 그
// assetId를 카드 카탈로그의 imageAssetId에 연결한다 — 이 연결이 있어야만
// 런타임 폴백 우선순위(§10.14)에서 승인 이미지가 이모지보다 우선 적용된다
// (자동 분할 직후엔 이 연결이 없으므로 승인 전까지는 절대 노출되지 않음,
// §18 "자동 분할 후에도 사람의 승인 없이 곧바로 운영 에셋으로 공개하지 않는다").
async function approveSlot(s) {
  const manifest = sheetManifests[selectedSheetId];
  const item = (manifest.items || []).find(it => it.slot === s.slot);
  if (!item) { alert('먼저 이 슬롯에 증거를 배정하고 저장하세요.'); return; }
  const blob = await new Promise(resolve => s.canvas.toBlob(resolve, 'image/webp'));
  const asset = await AssetDB.addAsset({ type: 'case-entry-icon', name: `${item.code || item.entryId}.webp`, blob });
  item.status = 'approved';
  item.croppedAssetId = asset.id;
  await AssetDB.setSpriteSheetManifest(selectedSheetId, manifest);
  const meta = metaCatalog[item.entryId] || {};
  metaCatalog[item.entryId] = Object.assign({}, meta, { imageAssetId: asset.id, iconGenerationStatus: 'approved' });
  await AssetDB.setCaseEntryMeta(item.entryId, metaCatalog[item.entryId]);
  alert(`${item.title || item.entryId} 아이콘을 승인·연결했습니다.`);
  renderSheetList();
  runAutoSlice();
}
async function rejectSlot(s) {
  const manifest = sheetManifests[selectedSheetId];
  const item = (manifest.items || []).find(it => it.slot === s.slot);
  if (!item) return;
  item.status = 'rejected';
  await AssetDB.setSpriteSheetManifest(selectedSheetId, manifest);
  runAutoSlice();
}

init();
</script>
