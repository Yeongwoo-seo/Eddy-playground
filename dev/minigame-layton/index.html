<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MISSING KEY · 레이튼 퀴즈</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MISSING KEY DEV">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--green:#3ECF6B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{
  background:
    radial-gradient(circle at 8px 8px, rgba(89,184,200,0.05) 1px, transparent 1px),
    #050607;
  background-size: 24px 24px;
  color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh;
}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(48px + env(safe-area-inset-top,0)) 20px calc(32px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.back{font-family:var(--mono);font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:18px;display:inline-flex;align-items:center;gap:4px;width:fit-content}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.tag::before{content:'';width:14px;height:1px;background:var(--cyan);opacity:.6}
.title{font-size:26px;font-weight:800;letter-spacing:-.2px;margin-bottom:10px}
.sub{font-size:14px;color:var(--text-secondary);margin-bottom:20px;line-height:1.6}

/* ===== 진행도 — localStorage(mkLaytonSolved)에 실제로 푼 문제 id를
   저장해 두고, 정적 "developed" 표시 대신 실제 클리어 상태를 보여준다.
   원형 게이지 + 퍼센트 텍스트로 "게임 진행률"처럼 보이게. ===== */
.progress-card{display:flex;align-items:center;gap:16px;background:var(--surface-1);border:1px solid var(--divider);border-radius:16px;padding:14px 18px;margin-bottom:24px}
.progress-ring{flex-shrink:0;width:52px;height:52px}
.progress-ring circle{fill:none;stroke-width:5}
.progress-ring .track{stroke:var(--surface-2)}
.progress-ring .fill{stroke:var(--cyan);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s cubic-bezier(0.2,0.8,0.2,1)}
.progress-text{flex:1}
.progress-num{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--cyan)}
.progress-label{font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-top:2px;letter-spacing:.04em}

.group-label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--text-muted);text-transform:uppercase;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.group-label:first-of-type{margin-top:0}
.group-label::after{content:'';flex:1;height:1px;background:var(--divider)}

.puzzle-list{display:flex;flex-direction:column;gap:10px}
.puzzle-item{
  position:relative;display:flex;align-items:center;gap:13px;background:var(--surface-1);
  border:1px solid var(--divider);border-radius:14px;padding:14px 16px;text-decoration:none;color:inherit;
  overflow:hidden;opacity:0;transform:translateY(6px);
  animation:puzzle-in .38s cubic-bezier(0.2,0.8,0.2,1) forwards;
}
@keyframes puzzle-in{to{opacity:1;transform:translateY(0)}}
a.puzzle-item{transition:transform .15s cubic-bezier(0.2,0.8,0.2,1),background .15s,box-shadow .15s}
a.puzzle-item:active{transform:scale(.97);background:var(--surface-2)}
.puzzle-item.solved{border-color:rgba(62,207,107,0.35)}
.puzzle-item.solved::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green)}

.puzzle-idx{
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text-muted);flex-shrink:0;
  width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px solid var(--divider);
  display:flex;align-items:center;justify-content:center;letter-spacing:-.02em;
}
.puzzle-item.solved .puzzle-idx{color:var(--green);border-color:rgba(62,207,107,0.35)}
.puzzle-item.locked{opacity:.5;animation:puzzle-in .38s cubic-bezier(0.2,0.8,0.2,1) forwards}

.puzzle-info{flex:1;min-width:0}
.puzzle-name{font-size:14.5px;font-weight:600;line-height:1.35}
.puzzle-meta{font-family:var(--mono);font-size:10.5px;color:var(--text-secondary);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.diff-pips{display:inline-flex;gap:2px;flex-shrink:0}
.diff-pips span{width:5px;height:5px;border-radius:50%;background:var(--divider)}
.diff-pips span.on{background:var(--amber)}

.puzzle-badge{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.03em;border-radius:8px;padding:6px 9px;flex-shrink:0;white-space:nowrap}
.puzzle-badge.play{background:var(--cyan);color:#04181c}
.puzzle-badge.solved{background:rgba(62,207,107,0.14);color:var(--green);border:1px solid rgba(62,207,107,0.3)}
.puzzle-badge.locked{background:var(--surface-2);color:var(--text-muted)}
</style>
</head>
<body>
<div class="frame">
  <a class="back" href="/dev/minigames/">‹ DEV</a>
  <div class="tag">Minigame · 레이튼 퀴즈</div>
  <div class="title">🧩 레이튼풍 고난도 퀴즈</div>
  <div class="sub">체감 난이도 7~8의 두뇌 퍼즐 20종, 전부 입력만으로 정답을 검증할 수 있어요.</div>
  <div class="progress-card" id="progressCard">
    <svg class="progress-ring" viewBox="0 0 52 52">
      <circle class="track" cx="26" cy="26" r="22"></circle>
      <circle class="fill" id="progressFill" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="138.2"></circle>
    </svg>
    <div class="progress-text">
      <div class="progress-num" id="progressNum">0 / 20 해결</div>
      <div class="progress-label">CASE PROGRESS</div>
    </div>
  </div>
  <div id="listRoot"></div>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script>
/* ===== 레이튼 퀴즈 목록 — 원본 리서치 문서(§5 권장 난이도 배치)의 20문제
   순서를 그대로 따른다. 모든 문제가 "한 줄 텍스트/숫자 입력 + 정확히
   일치"로 검증 가능하도록 설계돼 developed:true다(플레이 화면은
   dev/minigame-layton/play/). ===== */
const LAYTON_PUZZLES = [
  { group: '도입부 · 난이도 7', items: [
    { id: 'pz-h01', name: '세 기록으로 찾는 네 자리 암호', type: '숫자 암호 · 조건 소거', difficulty: 7, developed: true },
    { id: 'pz-h02', name: '일곱 명의 사진 촬영 순서', type: '일렬 배치 · 관계 논리', difficulty: 7, developed: true },
    { id: 'pz-h05', name: '다섯 사람과 하나의 손전등', type: '최적화 · 다리 건너기', difficulty: 7, developed: true },
    { id: 'pz-h13', name: '7시와 8시 사이의 두 순간', type: '시계 · 연립 방정식', difficulty: 7, developed: true },
    { id: 'pz-h19', name: '곱과 합으로 채우는 3×3 숫자판', type: '숫자 배치 · 곱셈·합 조건', difficulty: 7, developed: true },
  ]},
  { group: '중반부 · 난이도 7~8', items: [
    { id: 'pz-h03', name: '원탁의 여덟 자리', type: '원형 배치', difficulty: 8, developed: true },
    { id: 'pz-h04', name: '세 명만 진실을 말한다', type: '진실·거짓 · 자기일관성', difficulty: 8, developed: true },
    { id: 'pz-h07', name: '9L·5L·4L 세 물통', type: '물통 · 최소 상태 전이', difficulty: 8, developed: true },
    { id: 'pz-h09', name: '서로 자리를 바꾸는 여덟 개의 말', type: '이동 퍼즐 · 최소 횟수', difficulty: 8, developed: true },
    { id: 'pz-h12', name: '두 사람이 알고 있는 생일', type: '인식론 논리 · 정보 변화', difficulty: 8, developed: true },
    { id: 'pz-h17', name: '6×6 점으로 만들 수 있는 정사각형', type: '도형 개수 세기 · 기하 조합', difficulty: 8, developed: true },
    { id: 'pz-h18', name: '세 방향으로 뚫린 정육면체', type: '3차원 공간 · 노출 면 계산', difficulty: 7, developed: true },
  ]},
  { group: '후반부 · 난이도 8', items: [
    { id: 'pz-h06', name: '세 마법사와 세 제자', type: '강 건너기 · 상태 제약', difficulty: 8, developed: true },
    { id: 'pz-h08', name: '4×4 전등을 최소로 끄기', type: '토글 · 패리티 · 최소 조작', difficulty: 8, developed: true },
    { id: 'pz-h10', name: '두 왕관이 놓인 8×8 보드', type: '8퀸 · 공간 제약', difficulty: 8, developed: true },
    { id: 'pz-h11', name: '무게가 다른 동전 하나', type: '양팔저울 · 분기 전략', difficulty: 8, developed: true },
    { id: 'pz-h14', name: 'BOOK + BOOK = TITLE', type: '복면산 · 자리올림', difficulty: 8, developed: true },
    { id: 'pz-h15', name: '4×4 라틴 케이지', type: '라틴 스퀘어 · 산술 케이지', difficulty: 8, developed: true },
    { id: 'pz-h16', name: '25칸을 한 번씩 지나가기', type: '해밀턴 경로 · 순서 체크포인트', difficulty: 8, developed: true },
    { id: 'pz-h20', name: '다섯 사람의 여행지와 음료', type: '로직 그리드 · 다중 속성', difficulty: 8, developed: true },
  ]},
];

// play/index.html이 정답을 맞히면 이 키에 id를 추가한다 — 두 페이지가
// 공유하는 유일한 진행도 저장소라 키 이름을 바꾸면 둘 다 같이 고쳐야 한다.
function getSolvedSet() {
  try {
    return new Set(JSON.parse(localStorage.getItem('mkLaytonSolved') || '[]'));
  } catch (e) {
    return new Set();
  }
}

function pipsHtml(difficulty) {
  let out = '';
  for (let i = 1; i <= 8; i++) out += `<span class="${i <= difficulty ? 'on' : ''}"></span>`;
  return `<span class="diff-pips">${out}</span>`;
}

const solved = getSolvedSet();
const totalCount = LAYTON_PUZZLES.reduce((n, s) => n + s.items.length, 0);
const solvedCount = LAYTON_PUZZLES.reduce((n, s) => n + s.items.filter(p => solved.has(p.id)).length, 0);

document.getElementById('progressNum').textContent = `${solvedCount} / ${totalCount} 해결`;
const RING_CIRCUMFERENCE = 138.2;
document.getElementById('progressFill').style.strokeDashoffset =
  String(RING_CIRCUMFERENCE * (1 - solvedCount / totalCount));

const root = document.getElementById('listRoot');
let rowIndex = 0;
root.innerHTML = LAYTON_PUZZLES.map(section => `
  <div class="group-label">${section.group}</div>
  <div class="puzzle-list">
    ${section.items.map((p, i) => {
      const isSolved = solved.has(p.id);
      const delay = (rowIndex++ * 0.04).toFixed(2);
      return p.developed ? `
      <a class="puzzle-item${isSolved ? ' solved' : ''}" style="animation-delay:${delay}s" href="/dev/minigame-layton/play/?puzzle=${p.id}">
        <div class="puzzle-idx">${isSolved ? '✓' : String(i + 1).padStart(2, '0')}</div>
        <div class="puzzle-info">
          <div class="puzzle-name">${p.name}</div>
          <div class="puzzle-meta">${p.type} ${pipsHtml(p.difficulty)}</div>
        </div>
        <div class="puzzle-badge ${isSolved ? 'solved' : 'play'}">${isSolved ? 'SOLVED' : 'PLAY'}</div>
      </a>
    ` : `
      <div class="puzzle-item locked" style="animation-delay:${delay}s">
        <div class="puzzle-idx">${String(i + 1).padStart(2, '0')}</div>
        <div class="puzzle-info">
          <div class="puzzle-name">${p.name}</div>
          <div class="puzzle-meta">${p.type} ${pipsHtml(p.difficulty)}</div>
        </div>
        <div class="puzzle-badge locked">미개발</div>
      </div>
    `;
    }).join('')}
  </div>
`).join('');
</script>
<script src="/dev/devPlanFab.js"></script>
</body>
</html>
