<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>전체 대사 · OPERATION MK DEV</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(20px + env(safe-area-inset-top,0)) 20px calc(40px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--surface-1);border:1px solid var(--divider);color:var(--text-primary);display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.page-title{font-size:19px;font-weight:700;flex:1;min-width:0}
.week-select{font-family:var(--mono);font-size:11.5px;background:var(--surface-1);color:var(--text-primary);border:1px solid var(--divider);border-radius:10px;padding:8px 10px;flex-shrink:0}
.sub{font-size:13px;color:var(--text-secondary);margin:10px 0 16px;line-height:1.6}

/* Quick jump strip — one pill per scene in this week; since every scene now
   lives in the SAME textarea, a tap scrolls/positions the caret at that
   scene's header line instead of anchor-scrolling to a separate element. */
.jump-nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
.jump-nav::-webkit-scrollbar{display:none}
.jump-pill{flex-shrink:0;font-family:var(--mono);font-size:11px;padding:7px 12px;border-radius:14px;background:var(--surface-1);border:1px solid var(--divider);color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.jump-pill:active{background:var(--surface-2)}

/* ===== One combined bulk editor for the whole week — same look/classes as
   /dev/upload's 대사 탭 (see dialoguePanel.js), just holding every scene's
   script (each under its own "===== ... =====" header) instead of one. ===== */
.dialogue-bulk-input{width:100%;flex:1;background:var(--surface-1);border:1px solid var(--divider);border-radius:12px;padding:14px 16px;color:var(--text-primary);font-size:13px;line-height:1.7;font-family:var(--mono);resize:vertical;min-height:56vh}
.dialogue-bulk-input:focus{outline:none;border-color:rgba(89,184,200,.4)}
.hotspot-actions{display:flex;gap:8px;margin-top:12px;flex-shrink:0}
.hotspot-actions button{flex:1;border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--mono);letter-spacing:.04em;border:none}
.hotspot-actions button:disabled{opacity:.4;cursor:default}
.hotspot-secondary-btn{background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--divider)}
.crop-save-btn{background:var(--cyan);color:#06181c}
.hint{font-size:11px;color:var(--text-muted);margin:10px 0 0;line-height:1.6;flex-shrink:0}
.empty-note{font-size:13px;color:var(--text-muted);padding:14px 0}
.editor-body{display:flex;flex-direction:column;flex:1;min-height:0}
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <a class="back-btn" id="backBtn" href="/dev/">←</a>
    <div class="page-title" id="pageTitle">전체 대사</div>
    <select class="week-select" id="weekSelect"></select>
  </div>
  <div class="sub">이 주차의 모든 씬 대사가 한 텍스트에 묶여 있습니다. 씬 사이는 <b>===== #번호 씬이름 [씬ID] =====</b> 헤더로, 대사 줄 사이는 <b>---</b>로 구분합니다. 씬 헤더 줄은 지우거나 고치지 마세요 (씬 자체는 추가/삭제/재정렬 불가). 대사 줄은 <b>{id}</b> 태그로 식별돼요 — 태그를 지우면 그 줄이 삭제되고, 태그 없이 새로 쓰면 줄이 추가되고, 옮기면 순서가 바뀝니다. <b>[LOCKED]</b> 블록(선택지/분기)은 위치만 옮길 수 있어요. 저장하면 실제 플레이(/dev/game)에도 그대로 반영됩니다.</div>
  <div class="jump-nav" id="jumpNav"></div>
  <div class="editor-body" id="editorBody"></div>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script src="/dev/assetDb.js"></script>
<script src="/dev/dialogueData.js"></script>
<script src="/dev/dialoguePanel.js"></script>
<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const params = new URLSearchParams(location.search);
const requestedWeekId = params.get('week');
const weekId = weeks.some(w => w.id === requestedWeekId) ? requestedWeekId : weeks[0].id;
const week = weeks.find(w => w.id === weekId);

document.getElementById('backBtn').href = `/dev/${weekId}/`;
document.getElementById('pageTitle').textContent = `${week.label} · 전체 대사`;

const weekSelect = document.getElementById('weekSelect');
weekSelect.innerHTML = weeks.map(w => `<option value="${w.id}"${w.id === weekId ? ' selected' : ''}>${escapeHtml(w.label)}</option>`).join('');
weekSelect.addEventListener('change', () => {
  location.href = `/dev/script/?week=${encodeURIComponent(weekSelect.value)}`;
});

// week0's `weeks[0].scenes` also carries /dev/upload's room-search
// pseudo-scenes (no `.lines`) — filtering them out here leaves exactly the
// same real scenes /dev/week0 itself lists.
const scenesWithLines = week.scenes.filter(s => s.lines && s.lines.length);

const jumpNav = document.getElementById('jumpNav');
const editorBody = document.getElementById('editorBody');

if (!scenesWithLines.length) {
  jumpNav.innerHTML = '';
  editorBody.innerHTML = '<div class="empty-note">이 주차에는 대사가 있는 씬이 없습니다.</div>';
} else {
  jumpNav.innerHTML = scenesWithLines.map(s =>
    `<button class="jump-pill" type="button" data-scene-id="${escapeHtml(s.id)}">${escapeHtml(s.name)}</button>`
  ).join('');
  editorBody.innerHTML = `
    <textarea class="dialogue-bulk-input" rows="24" spellcheck="false" disabled></textarea>
    <div class="hotspot-actions">
      <button class="hotspot-secondary-btn" data-role="revert" disabled>되돌리기</button>
      <button class="crop-save-btn" data-role="save" disabled>저장</button>
    </div>
    <div class="hint" data-role="status">불러오는 중…</div>
  `;

  const textarea = editorBody.querySelector('.dialogue-bulk-input');
  const revertBtn = editorBody.querySelector('[data-role="revert"]');
  const saveBtn = editorBody.querySelector('[data-role="save"]');
  const status = editorBody.querySelector('[data-role="status"]');

  jumpNav.querySelectorAll('.jump-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = textarea.value.indexOf(`[${btn.dataset.sceneId}]`);
      if (idx === -1) return;
      textarea.focus();
      textarea.setSelectionRange(idx, idx);
      const lineNo = textarea.value.slice(0, idx).split('\n').length - 1;
      const lineHeight = parseFloat(getComputedStyle(textarea).lineHeight) || 22;
      textarea.scrollTop = Math.max(0, lineNo * lineHeight - 20);
    });
  });

  (async () => {
    let overridesByScene = {};
    try {
      const overridesList = await Promise.all(scenesWithLines.map(s => AssetDB.getDialogueOverrides(s.id)));
      scenesWithLines.forEach((s, i) => { overridesByScene[s.id] = overridesList[i]; });
    } catch (err) {
      status.textContent = '대사를 불러오지 못했습니다.';
      if (window.DevDiag) DevDiag.show('대사 불러오기 실패: ' + (err && err.message ? err.message : err));
      return;
    }

    let originalText = formatCombinedDialogueText(scenesWithLines, overridesByScene);
    textarea.value = originalText;
    textarea.disabled = false;
    revertBtn.disabled = false;
    saveBtn.disabled = false;
    status.textContent = '';

    revertBtn.addEventListener('click', () => {
      textarea.value = originalText;
      status.textContent = '';
    });

    saveBtn.addEventListener('click', async () => {
      const { chunks, error } = parseCombinedDialogueText(textarea.value, scenesWithLines);
      if (error) {
        status.textContent = error;
        return;
      }
      // Parse + validate every scene's chunk before saving anything —
      // all-or-nothing, so a mistake in one scene never leaves the rest
      // half-saved.
      const perSceneLineLists = {};
      const errors = [];
      scenesWithLines.forEach(scene => {
        const result = buildSceneLineList(scene.lines, chunks[scene.id]);
        if (result.error) {
          errors.push(`[${scene.name}] ${result.error}`);
          return;
        }
        perSceneLineLists[scene.id] = result.lineList;
      });
      if (errors.length) {
        status.textContent = errors.join(' / ');
        return;
      }

      saveBtn.disabled = true;
      status.textContent = '저장 중…';
      try {
        await Promise.all(scenesWithLines.map(scene => AssetDB.setDialogueOverrides(scene.id, { lineList: perSceneLineLists[scene.id] })));
        const overridesForFormat = {};
        scenesWithLines.forEach(scene => { overridesForFormat[scene.id] = { lineList: perSceneLineLists[scene.id] }; });
        originalText = formatCombinedDialogueText(scenesWithLines, overridesForFormat);
        textarea.value = originalText;
        status.textContent = '저장됨';
      } catch (err) {
        status.textContent = '저장 실패';
        if (window.DevDiag) DevDiag.show('대사 저장 실패: ' + (err && err.message ? err.message : err));
      } finally {
        saveBtn.disabled = false;
      }
    });
  })();
}
</script>
<script src="/dev/devPlanFab.js"></script>
</body>
</html>
