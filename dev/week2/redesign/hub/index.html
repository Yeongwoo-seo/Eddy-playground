<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2주차 v4 재설계 · 탐색허브 · MISSING KEY DEV</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--pink:#D66B9A;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(48px + env(safe-area-inset-top,0)) 20px calc(32px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.back{font-family:var(--mono);font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:18px;display:inline-flex;align-items:center;gap:4px;width:fit-content}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
.title{font-size:26px;font-weight:700;letter-spacing:-.2px;margin-bottom:10px}
.sub{font-size:14px;color:var(--text-secondary);margin-bottom:12px;line-height:1.6}
.warn-box{background:rgba(214,107,154,.1);border:1px solid rgba(214,107,154,.3);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--text-secondary);line-height:1.6;margin-bottom:22px}
.warn-box b{color:var(--pink)}

.card{background:var(--surface-1);border:1px solid var(--divider);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.card-head{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.card-headtxt{flex:1;min-width:0}
.card-title{font-size:15px;font-weight:700}
.card-meta{font-size:11.5px;color:var(--text-muted);margin-top:3px}
.card-caret{color:var(--text-muted);font-size:14px;flex-shrink:0;transition:transform .2s}
.card.open .card-caret{transform:rotate(180deg)}
.card-body{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--divider)}
.card.open .card-body{display:block}
.field{margin-bottom:10px}
.field-label{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.field-val{font-size:13px;line-height:1.6;color:var(--text-secondary)}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;background:var(--surface-2);border:1px solid var(--divider);border-radius:10px;padding:3px 8px;color:var(--text-secondary)}

.preview-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--cyan);text-decoration:none;background:rgba(89,184,200,.12);border:1px solid rgba(89,184,200,.3);border-radius:12px;padding:8px 12px;margin-top:4px}

.prompt-block{margin-top:14px}
.prompt-headrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.prompt-status{font-family:var(--mono);font-size:10.5px;color:var(--text-muted)}
.prompt-textarea{width:100%;min-height:190px;resize:vertical;background:var(--bg);border:1px solid var(--divider);border-radius:12px;padding:12px;color:var(--text-primary);font-family:var(--mono);font-size:12px;line-height:1.65;outline:none}
.prompt-textarea:focus{border-color:rgba(89,184,200,.4)}
.prompt-actions{display:flex;gap:8px;margin-top:8px}
.pbtn{flex:1;font-family:var(--mono);font-size:11.5px;font-weight:600;border-radius:10px;padding:9px;border:1px solid var(--divider);background:var(--surface-2);color:var(--text-primary);cursor:pointer}
.pbtn:active{opacity:.8}
.pbtn.primary{background:var(--amber);color:#1a1206;border-color:var(--amber)}
</style>
</head>
<body>
<div class="frame">
  <a class="back" href="/dev/week2/redesign/">‹ v4 재설계</a>
  <div class="tag">Missing Key · v4 재설계</div>
  <div class="title">탐색허브</div>
  <div class="sub">Phase 1 관광 허브(서큘러키·오페라하우스·하버브리지·더 록스 골목·더 록스 옷가게·전시장 입구)는 v4에서도 그대로 씁니다. 바뀌는 건 두 장소에 새로 필요한 상호작용뿐입니다.</div>
  <div class="warn-box"><b>허브 내비게이션 자체는 안 바뀝니다.</b> 인물 소개(Ch4)는 허브가 아니라 전시장 진입 직후 선형 씬에서 처리되므로 여기 목록엔 없습니다. 실제 반영 시엔 새 phase id(W2_TOURISM_V4)로 분리해 실서비스 허브와 섞이지 않게 하세요.</div>
  <div id="hubRoot"></div>
</div>
<script src="/dev/data/week2v4Hub.js"></script>
<script>
const PROMPT_KEY_PREFIX = 'week2v4HubPrompt:';
const root = document.getElementById('hubRoot');

function cardHtml(t) {
  return `
    <div class="card" id="card-${t.id}">
      <div class="card-head" data-toggle="${t.id}">
        <div class="card-headtxt">
          <div class="card-title">${t.name}</div>
          <div class="card-meta">${t.locationName} · ${t.relatedChapter}</div>
        </div>
        <div class="card-caret">▾</div>
      </div>
      <div class="card-body">
        <div class="field">
          <div class="field-label">목적</div>
          <div class="field-val">${t.purpose}</div>
        </div>
        <div class="field">
          <div class="field-label">등장인물</div>
          <div class="chip-row">${t.characters.map(c => `<span class="chip">${c}</span>`).join('')}</div>
        </div>
        <a class="preview-link" href="${t.previewHref}">🗺️ 실제 허브 미리보기 (지금은 v3 콘텐츠)</a>
        <div class="prompt-block">
          <div class="prompt-headrow">
            <div class="field-label">상호작용 설계 프롬프트</div>
            <div class="prompt-status" id="status-${t.id}">&nbsp;</div>
          </div>
          <textarea class="prompt-textarea" id="prompt-${t.id}" spellcheck="false"></textarea>
          <div class="prompt-actions">
            <button class="pbtn primary" data-copy="${t.id}">📋 복사</button>
            <button class="pbtn" data-reset="${t.id}">기본값으로 재설정</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

root.innerHTML = week2v4HubTopics.map(cardHtml).join('');

week2v4HubTopics.forEach(t => {
  const key = PROMPT_KEY_PREFIX + t.id;
  const textarea = document.getElementById('prompt-' + t.id);
  const saved = localStorage.getItem(key);
  textarea.value = saved !== null ? saved : buildWeek2v4HubPrompt(t);

  let saveTimer = null;
  const status = document.getElementById('status-' + t.id);
  textarea.addEventListener('input', () => {
    status.textContent = '저장 중...';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      localStorage.setItem(key, textarea.value);
      status.textContent = '저장됨';
    }, 400);
  });
});

root.addEventListener('click', (e) => {
  const head = e.target.closest('[data-toggle]');
  if (head) {
    document.getElementById('card-' + head.dataset.toggle).classList.toggle('open');
    return;
  }
  const copyBtn = e.target.closest('[data-copy]');
  if (copyBtn) {
    const id = copyBtn.dataset.copy;
    const textarea = document.getElementById('prompt-' + id);
    navigator.clipboard.writeText(textarea.value).then(() => {
      const orig = copyBtn.textContent;
      copyBtn.textContent = '✓ 복사됨';
      setTimeout(() => { copyBtn.textContent = orig; }, 1200);
    }).catch(() => {});
    return;
  }
  const resetBtn = e.target.closest('[data-reset]');
  if (resetBtn) {
    const id = resetBtn.dataset.reset;
    const t = week2v4HubTopics.find(x => x.id === id);
    const textarea = document.getElementById('prompt-' + id);
    textarea.value = buildWeek2v4HubPrompt(t);
    localStorage.setItem(PROMPT_KEY_PREFIX + id, textarea.value);
    document.getElementById('status-' + id).textContent = '기본값으로 재설정됨';
  }
});
</script>
<script src="/dev/devPlanFab.js"></script>
</body>
</html>
