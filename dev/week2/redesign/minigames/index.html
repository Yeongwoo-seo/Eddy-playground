<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2주차 v4 재설계 · 미니게임 · MISSING KEY DEV</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--pink:#D66B9A;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(48px + env(safe-area-inset-top,0)) 20px calc(32px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.back{font-family:var(--mono);font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:18px;display:inline-flex;align-items:center;gap:4px;width:fit-content}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
.title{font-size:26px;font-weight:700;letter-spacing:-.2px;margin-bottom:10px}
.sub{font-size:14px;color:var(--text-secondary);margin-bottom:22px;line-height:1.6}

.card{background:var(--surface-1);border:1px solid var(--divider);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.card-head{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.card-headtxt{flex:1;min-width:0}
.card-title{font-size:15px;font-weight:700}
.card-meta{font-size:11.5px;color:var(--text-muted);margin-top:3px}
.card-badge{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.03em;border-radius:8px;padding:3px 7px}
.card-badge.reused{color:#06181c;background:var(--cyan)}
.card-badge.new{color:#2a0d18;background:var(--pink)}
.card-caret{color:var(--text-muted);font-size:14px;flex-shrink:0;transition:transform .2s}
.card.open .card-caret{transform:rotate(180deg)}
.card-body{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--divider)}
.card.open .card-body{display:block}
.field{margin-bottom:10px}
.field-label{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.field-val{font-size:13px;line-height:1.6;color:var(--text-secondary)}
.ui-list{margin:0;padding-left:18px;font-size:12.5px;color:var(--text-secondary);line-height:1.7}

.link-row{display:flex;gap:8px;margin-top:4px}
.real-link{flex:1;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--cyan);text-decoration:none;background:rgba(89,184,200,.12);border:1px solid rgba(89,184,200,.3);border-radius:12px;padding:8px 12px}

.prompt-block{margin-top:14px}
.prompt-headrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.prompt-status{font-family:var(--mono);font-size:10.5px;color:var(--text-muted)}
.prompt-textarea{width:100%;min-height:190px;resize:vertical;background:var(--bg);border:1px solid var(--divider);border-radius:12px;padding:12px;color:var(--text-primary);font-family:var(--mono);font-size:12px;line-height:1.65;outline:none}
.prompt-textarea:focus{border-color:rgba(89,184,200,.4)}
.prompt-actions{display:flex;gap:8px;margin-top:8px}
.pbtn{flex:1;font-family:var(--mono);font-size:11.5px;font-weight:600;border-radius:10px;padding:9px;border:1px solid var(--divider);background:var(--surface-2);color:var(--text-primary);cursor:pointer}
.pbtn:active{opacity:.8}
.pbtn.primary{background:var(--amber);color:#1a1206;border-color:var(--amber)}
.photo-concept{margin-top:16px;padding-top:16px;border-top:1px solid var(--divider)}
.photo-concept-title{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--pink);text-transform:uppercase;margin-bottom:10px}
.photo-concept-item{margin-bottom:14px}
.photo-concept-item:last-child{margin-bottom:0}
.upload-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--amber);text-decoration:none;background:rgba(214,168,75,.12);border:1px solid rgba(214,168,75,.3);border-radius:12px;padding:8px 12px;margin-top:4px}
</style>
</head>
<body>
<div class="frame">
  <a class="back" href="/dev/week2/redesign/">‹ v4 재설계</a>
  <div class="tag">Missing Key · v4 재설계</div>
  <div class="title">미니게임</div>
  <div class="sub">기존 미니게임은 그대로 재사용하고, v4에서 새로 필요한 미니게임(K-01 비교·일정표 매칭·최종 재구성)은 설계 프롬프트로 관리합니다.</div>
  <div id="mgRoot"></div>
</div>
<script src="/dev/data/week2v4Scenes.js"></script>
<script src="/dev/dialogueData.js"></script>
<script src="/dev/data/week2v4Minigames.js"></script>
<script>
const PROMPT_KEY_PREFIX = 'week2v4MgPrompt:';
const root = document.getElementById('mgRoot');

function cardHtml(mg) {
  const reused = mg.status === 'reused' ? (typeof minigames !== 'undefined' ? minigames.find(m => m.id === mg.reusedMinigameId) : null) : null;
  return `
    <div class="card" id="card-${mg.id}">
      <div class="card-head" data-toggle="${mg.id}">
        <div class="card-headtxt">
          <div class="card-title">${mg.name}</div>
          <div class="card-meta">${mg.relatedChapter}</div>
          <span class="card-badge ${mg.status}">${mg.status === 'reused' ? '기존 재사용' : '신규 설계 필요'}</span>
        </div>
        <div class="card-caret">▾</div>
      </div>
      <div class="card-body">
        <div class="field">
          <div class="field-label">목적</div>
          <div class="field-val">${mg.purpose}</div>
        </div>
        ${mg.requiredUi.length ? `
        <div class="field">
          <div class="field-label">필요한 UI 요소</div>
          <ul class="ui-list">${mg.requiredUi.map(u => `<li>${u}</li>`).join('')}</ul>
        </div>` : ''}
        ${mg.status === 'reused' && reused ? `
        <div class="link-row">
          <a class="real-link" href="${reused.setupUrl}">⚙️ 설정</a>
          <a class="real-link" href="${reused.route}">▶ 플레이</a>
        </div>` : ''}
        ${mg.status === 'new' ? `
        <div class="prompt-block">
          <div class="prompt-headrow">
            <div class="field-label">미니게임 설계 프롬프트</div>
            <div class="prompt-status" id="status-${mg.id}">&nbsp;</div>
          </div>
          <textarea class="prompt-textarea" id="prompt-${mg.id}" spellcheck="false"></textarea>
          <div class="prompt-actions">
            <button class="pbtn primary" data-copy="${mg.id}">📋 복사</button>
            <button class="pbtn" data-reset="${mg.id}">기본값으로 재설정</button>
          </div>
        </div>` : ''}
        ${(mg.requiredPhotos || []).length ? `
        <div class="photo-concept">
          <div class="photo-concept-title">이 미니게임에 필요한 사진</div>
          ${mg.requiredPhotos.map(photo => {
            const key = mg.id + ':' + photo.id;
            return `
          <div class="photo-concept-item">
            <div class="field-label">${photo.label}</div>
            <div class="field-val" style="margin-bottom:8px">${photo.photoBrief}</div>
            <a class="upload-link" href="/dev/upload/">🖼️ 이미지 업로드 (구현 후 씬 배경으로 등록)</a>
            <div class="prompt-block">
              <div class="prompt-headrow">
                <div class="field-label">사진 생성용 AI 프롬프트</div>
                <div class="prompt-status" id="status-photo-${key}">&nbsp;</div>
              </div>
              <textarea class="prompt-textarea" id="prompt-photo-${key}" spellcheck="false" style="min-height:150px"></textarea>
              <div class="prompt-actions">
                <button class="pbtn primary" data-copy-photo="${key}">📋 복사</button>
                <button class="pbtn" data-reset-photo="${key}">기본값으로 재설정</button>
              </div>
            </div>
          </div>`;
          }).join('')}
        </div>` : ''}
      </div>
    </div>
  `;
}

root.innerHTML = week2v4Minigames.map(cardHtml).join('');

week2v4Minigames.filter(mg => mg.status === 'new').forEach(mg => {
  const key = PROMPT_KEY_PREFIX + mg.id;
  const textarea = document.getElementById('prompt-' + mg.id);
  const saved = localStorage.getItem(key);
  textarea.value = saved !== null ? saved : buildWeek2v4MinigamePrompt(mg);

  let saveTimer = null;
  const status = document.getElementById('status-' + mg.id);
  textarea.addEventListener('input', () => {
    status.textContent = '저장 중...';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      localStorage.setItem(key, textarea.value);
      status.textContent = '저장됨';
    }, 400);
  });

  (mg.requiredPhotos || []).forEach(photo => {
    const photoKey = mg.id + ':' + photo.id;
    const storageKey = PROMPT_KEY_PREFIX + 'photo:' + photoKey;
    const photoTextarea = document.getElementById('prompt-photo-' + photoKey);
    const photoSaved = localStorage.getItem(storageKey);
    photoTextarea.value = photoSaved !== null ? photoSaved : buildWeek2v4MinigamePhotoPrompt(mg, photo);

    let photoSaveTimer = null;
    const photoStatus = document.getElementById('status-photo-' + photoKey);
    photoTextarea.addEventListener('input', () => {
      photoStatus.textContent = '저장 중...';
      clearTimeout(photoSaveTimer);
      photoSaveTimer = setTimeout(() => {
        localStorage.setItem(storageKey, photoTextarea.value);
        photoStatus.textContent = '저장됨';
      }, 400);
    });
  });
});

root.addEventListener('click', (e) => {
  const head = e.target.closest('[data-toggle]');
  if (head) {
    document.getElementById('card-' + head.dataset.toggle).classList.toggle('open');
    return;
  }
  const copyBtn = e.target.closest('[data-copy]');
  if (copyBtn) {
    const id = copyBtn.dataset.copy;
    const textarea = document.getElementById('prompt-' + id);
    navigator.clipboard.writeText(textarea.value).then(() => {
      const orig = copyBtn.textContent;
      copyBtn.textContent = '✓ 복사됨';
      setTimeout(() => { copyBtn.textContent = orig; }, 1200);
    }).catch(() => {});
    return;
  }
  const resetBtn = e.target.closest('[data-reset]');
  if (resetBtn) {
    const id = resetBtn.dataset.reset;
    const mg = week2v4Minigames.find(m => m.id === id);
    const textarea = document.getElementById('prompt-' + id);
    textarea.value = buildWeek2v4MinigamePrompt(mg);
    localStorage.setItem(PROMPT_KEY_PREFIX + id, textarea.value);
    document.getElementById('status-' + id).textContent = '기본값으로 재설정됨';
    return;
  }
  const copyPhotoBtn = e.target.closest('[data-copy-photo]');
  if (copyPhotoBtn) {
    const key = copyPhotoBtn.dataset.copyPhoto;
    const textarea = document.getElementById('prompt-photo-' + key);
    navigator.clipboard.writeText(textarea.value).then(() => {
      const orig = copyPhotoBtn.textContent;
      copyPhotoBtn.textContent = '✓ 복사됨';
      setTimeout(() => { copyPhotoBtn.textContent = orig; }, 1200);
    }).catch(() => {});
    return;
  }
  const resetPhotoBtn = e.target.closest('[data-reset-photo]');
  if (resetPhotoBtn) {
    const key = resetPhotoBtn.dataset.resetPhoto;
    const [mgId, photoId] = key.split(':');
    const mg = week2v4Minigames.find(m => m.id === mgId);
    const photo = (mg.requiredPhotos || []).find(p => p.id === photoId);
    const textarea = document.getElementById('prompt-photo-' + key);
    textarea.value = buildWeek2v4MinigamePhotoPrompt(mg, photo);
    localStorage.setItem(PROMPT_KEY_PREFIX + 'photo:' + key, textarea.value);
    document.getElementById('status-photo-' + key).textContent = '기본값으로 재설정됨';
  }
});
</script>
<script src="/dev/devPlanFab.js"></script>
</body>
</html>
