<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2주차 · MISSING KEY DEV</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(48px + env(safe-area-inset-top,0)) 20px calc(32px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.back{font-family:var(--mono);font-size:12px;color:var(--text-muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px;width:fit-content}
.script-link{font-family:var(--mono);font-size:11px;color:var(--cyan);text-decoration:none;background:rgba(89,184,200,.12);border:1px solid rgba(89,184,200,.3);border-radius:14px;padding:6px 12px;white-space:nowrap;flex-shrink:0}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
.title{font-size:26px;font-weight:700;letter-spacing:-.2px;margin-bottom:10px}
.sub{font-size:14px;color:var(--text-secondary);margin-bottom:32px;line-height:1.6}
.scene-list{display:flex;flex-direction:column;gap:14px}
.scene-group{display:flex;flex-direction:column;gap:14px}
.scene-group + .scene-group{margin-top:8px}
.group-header{display:flex;align-items:center;gap:8px;padding:0 2px}
.group-range{font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.06em}
.group-label{font-size:14px;font-weight:700;color:var(--text-secondary)}
.group-mode{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.04em;border-radius:8px;padding:2.5px 6px;flex-shrink:0}
.group-mode.hub{color:#06181c;background:var(--cyan)}
.group-mode.scene{color:var(--text-muted);background:rgba(255,255,255,.08)}
.scene-row{display:flex;align-items:stretch;gap:10px}
.scene-btn{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:var(--surface-1);border:1px solid var(--divider);border-radius:12px;padding:18px 20px;text-decoration:none;color:inherit;transition:transform .15s,background .15s}
.scene-btn:active{transform:scale(.98);background:var(--surface-2)}
.scene-num{font-family:var(--mono);font-size:13px;color:var(--cyan);flex-shrink:0}
.scene-txt{flex:1;min-width:0}
.scene-name{font-size:16px;font-weight:700}
.scene-arrow{color:var(--text-muted);font-size:18px;flex-shrink:0}
/* Setup(scene-btn) opens the 배경/캐릭터/대사 에디터 — this is the shortcut
   past it, straight into the live scene, for when a dev just wants to play
   through what's already configured. */
.play-btn{flex-shrink:0;width:56px;display:flex;align-items:center;justify-content:center;background:var(--surface-1);border:1px solid var(--divider);border-radius:12px;color:var(--cyan);font-size:19px;text-decoration:none;transition:transform .15s,background .15s}
.play-btn:active{transform:scale(.94);background:var(--surface-2)}
.empty{font-size:13px;color:var(--text-muted);padding:20px 0}
/* Autoplay entry point — chains straight into /play/game with ?autoplay=1,
   which taps/chooses/presents-evidence on a timer through every scene's
   nextSceneId (see play/game/index.html) so this cascades the way the week
   actually plays out, instead of a dev tapping through each scene by hand. */
.autoplay-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-bottom:8px;background:rgba(89,184,200,.12);border:1px solid rgba(89,184,200,.35);border-radius:14px;padding:15px;color:var(--cyan);font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.03em;text-decoration:none;transition:transform .15s,background .15s}
.autoplay-btn:active{transform:scale(.98);background:rgba(89,184,200,.22)}
.autoplay-btn.disabled{opacity:.4;pointer-events:none}
.autoplay-hint{font-size:11.5px;color:var(--text-muted);line-height:1.5;margin-bottom:24px}
</style>
</head>
<body>
<div class="frame">
  <div class="topbar-row">
    <a class="back" href="/dev/story/">‹ 스토리</a>
    <a class="script-link" href="/dev/script/?week=week2">전체 대사보기</a>
  </div>
  <a class="autoplay-btn" id="autoplayLink" href="#">▶ 2주차 전체 대사 자동 재생 (미리보기)</a>
  <div class="autoplay-hint">탭 없이 자동으로 대사가 이어서 재생됩니다. 미니게임 구간에 닿으면 자동 재생이 멈춥니다. 실제 플레이는 <a href="/play/" style="color:var(--cyan)">/play/</a>에서 확인하세요.</div>
  <div class="tag">Missing Key</div>
  <div class="title">2주차</div>
  <div class="sub">씬을 선택해서 개별로 테스트할 수 있습니다. <b>허브</b> 페이즈는 장소를 자유 순서로 오가고, <b>씬</b> 페이즈는 순차 진행됩니다.</div>
  <div class="scene-list" id="sceneList"></div>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script src="/dev/dialogueData.js"></script>
<script>
// Setup href: plain VN scenes go to /dev/upload's 배경/캐릭터/대사 editor for
// that scene id; entries that are themselves a minigame route (no `lines`,
// evidence-collection minigames included — see isEvidence in dialogueData.js)
// go to that entry's own setupUrl instead.
function setupHref(s) {
  if (!s.route) return '/dev/upload/?scene=' + encodeURIComponent(s.id);
  const entry = minigames.find(m => m.id === s.id);
  return entry ? entry.setupUrl : '/dev/upload/?scene=' + encodeURIComponent(s.id);
}

const autoplayLink = document.getElementById('autoplayLink');
const autoplayFirstScene = week2Scenes.find(s => s.lines && s.lines.length);
if (autoplayFirstScene) {
  autoplayLink.href = `/play/game/?scene=${encodeURIComponent(autoplayFirstScene.id)}&autoplay=1&week=week2`;
} else {
  autoplayLink.classList.add('disabled');
}

function sceneRowHtml(s) {
  return `
    <div class="scene-row">
      <a class="scene-btn" href="${setupHref(s)}">
        <div class="scene-num">#${String(s.order).padStart(2, '0')}</div>
        <div class="scene-txt">
          <div class="scene-name">${s.name}</div>
        </div>
        <div class="scene-arrow">›</div>
      </a>
      <a class="play-btn" href="${s.route || ('/play/game/?scene=' + encodeURIComponent(s.id))}" aria-label="바로 플레이">▶</a>
    </div>
  `;
}

// Kept in sync with dev/phases/index.html's PHASE_HUB_META — hub phases let
// you roam locations in any order (play/explore/), scene phases are the
// original linear dialogue/minigame chain (play/game/).
const PHASE_HUB_META = {
  'PHASE 1': { mode: 'hub' },
  'PHASE 2': { mode: 'scene' },
  'PHASE 3': { mode: 'scene' },
  'PHASE 4': { mode: 'hub' },
  'PHASE 5': { mode: 'hub' },
  'PHASE 6': { mode: 'scene' },
};

const list = document.getElementById('sceneList');
if (!week2Scenes.length) {
  list.innerHTML = '<div class="empty">등록된 씬이 없습니다.</div>';
} else {
  const byId = new Map(week2Scenes.map(s => [s.id, s]));
  // week2SceneGroups (dialogueData.js) buckets the flat week2Scenes list into
  // the Phase 1-6 investigation stages The Missing Key 문서가 쓰는 구분 —
  // same pattern as week1SceneGroups.
  list.innerHTML = week2SceneGroups.map(g => {
    const meta = PHASE_HUB_META[g.range];
    return `
    <div class="scene-group">
      <div class="group-header">
        <span class="group-range">${g.range}</span>
        <span class="group-label">${g.label}</span>
        ${meta ? `<span class="group-mode ${meta.mode}">${meta.mode === 'hub' ? '허브' : '씬'}</span>` : ''}
      </div>
      ${g.sceneIds.map(id => byId.get(id)).filter(Boolean).map(sceneRowHtml).join('')}
    </div>
  `;
  }).join('');
}
</script>
<script src="/dev/devPlanFab.js"></script>
</body>
</html>
