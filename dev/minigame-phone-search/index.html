<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · 핸드폰을 찾아라</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERATION MK DEV">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;--surface-3:#1E252D;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;align-items:center}

/* Height is capped at a real phone's portrait screen height (iPhone 15 Pro
   Max logical px, matching the 430 max-width's ~19.5:9 ratio) instead of
   always filling 100dvh/vh — on a desktop-height viewport the frame stops
   growing past phone-screen size and just centers with letterboxing above/
   below, rather than stretching the room photo/hotspots taller than any
   real phone. Everything inside is already positioned relative to .frame,
   so capping its height is enough; no JS changes needed. */
.frame{position:relative;width:100%;max-width:430px;height:100dvh;height:100vh;height:var(--vh100, 100vh);max-height:932px;overflow:hidden;background:var(--bg)}

/* ===== Top bar — floats over the full-bleed room view below, same
   pattern as minigame-eastwood's map ===== */
.topbar{position:absolute;top:0;left:0;right:0;z-index:6;padding:calc(14px + env(safe-area-inset-top,0)) 16px 10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.vn-btn{pointer-events:auto;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}

/* ===== Room view — fills the entire frame edge-to-edge (photo-stage/
   grid-scroll are each full-bleed too); the topbar and FABs float on top
   of it as separate absolutely-positioned overlays instead of squeezing
   it into a leftover flex slot. ===== */
.room-view{position:absolute;inset:0;transition:opacity .3s ease}
.room-view.locked{pointer-events:none;opacity:.5}

/* Photo mode — a real uploaded room photo with invisible tap zones over
   each marked hotspot (pan/zoom like the subway minigame). Zones stay
   invisible so hunting for the phone/key still feels like searching, not
   just tapping the one glowing circle. */
.photo-stage{position:absolute;inset:0;overflow:hidden;background:#05070a;touch-action:none}
.photo-stage.hidden{display:none}
.photo-canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.photo-canvas img{position:absolute;top:0;left:0;-webkit-user-drag:none;user-select:none;display:block}
.tap-ring{position:absolute;border-radius:50%;border:3px solid var(--cyan);opacity:.9;pointer-events:none;animation:tapRingFade 420ms ease forwards}
@keyframes tapRingFade{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.6);opacity:0}}

/* Grid mode — fallback for areas with no photo/hotspots marked yet in
   /dev/upload, so the puzzle stays fully playable before real photos exist.
   Padded top/bottom to clear the floating topbar/FAB row since it's a
   static scrollable list, unlike the pannable photo stage. */
.grid-scroll{position:absolute;inset:0;overflow-y:auto;padding:calc(104px + env(safe-area-inset-top,0)) 16px calc(140px + env(safe-area-inset-bottom,0))}
.grid-scroll.hidden{display:none}
.hotspot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hotspot-btn{min-height:52px;background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:12px 14px;color:var(--text-primary);font-family:var(--sans);font-size:14px;font-weight:600;text-align:left;cursor:pointer;transition:background .15s,transform .15s}
.hotspot-btn:active{transform:scale(.97);background:var(--surface-2)}

.debug-hotspot-box{position:absolute;border:1px dashed var(--cyan);background:rgba(89,184,200,.12);color:var(--cyan);font-family:var(--mono);font-size:9px;line-height:1.3;padding:1px 3px;pointer-events:none;overflow:hidden;white-space:nowrap}
.debug-item-label{position:absolute;background:rgba(5,7,10,.9);border:1px solid var(--amber);color:var(--amber);font-family:var(--sans);font-size:11px;font-weight:700;line-height:1.3;padding:2px 6px;border-radius:8px;pointer-events:none;white-space:nowrap;z-index:1}

/* ===== Item/move buttons — moved up next to the topbar (was a floating
   bottom FAB row), text-only pills matching vn-btn instead of emoji icons. ===== */
.fab-row{position:absolute;left:16px;right:16px;top:calc(58px + env(safe-area-inset-top,0));z-index:6;display:flex;gap:8px;pointer-events:none;transition:opacity .3s ease}
.fab-row.hidden{display:none}
.fab-btn{pointer-events:auto;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#fff;background:#000;border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:9px 14px;cursor:pointer}
.fab-btn:active{transform:scale(.96);background:#000}
.fab-btn.active{color:var(--amber);border-color:rgba(214,168,75,.4);background:rgba(214,168,75,.1)}

/* ===== Inventory — a persistent floating bottom bar (not a button-
   triggered popup) showing 5 slots per view, icon-only, tap to select/
   combine (no text list, no separate 조사/조합 confirm buttons — tapping IS
   the action). grid-auto-columns sizes each slot so exactly 5 fit the
   visible width regardless of frame size; extra items past 5 sit off to the
   side and are reached by dragging/swiping the row (native overflow-x
   scroll on touch, plus a small mouse-drag helper below for desktop
   testing). ===== */
.popup-scrim{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.4);display:none}
.popup-scrim.show{display:block}
.inventory-bar{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0));z-index:6;display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 32px) / 5);gap:8px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;touch-action:pan-x;padding:10px;background:rgba(5,7,10,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.35);transition:opacity .3s ease;scrollbar-width:none;cursor:grab}
.inventory-bar::-webkit-scrollbar{display:none}
.inventory-bar.hidden{display:none}
.inventory-slot{scroll-snap-align:start;aspect-ratio:1/1;width:100%;background:var(--surface-2);border:2px solid transparent;border-radius:14px;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.inventory-slot.selected{border-color:var(--cyan);background:rgba(89,184,200,.14)}
.inventory-empty{grid-column:1/-1;font-family:var(--mono);font-size:11px;color:var(--text-muted);padding:6px 2px;text-align:center}

/* Anchored at the bottom-right of whichever icon was just tapped. */
.item-tooltip{position:absolute;z-index:6;background:rgba(5,7,10,.95);border:1px solid var(--divider);border-radius:12px;padding:10px 12px;max-width:180px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.item-tooltip.show{display:block}
.item-tooltip-name{font-size:13px;font-weight:700;color:var(--cyan);margin-bottom:3px}
.item-tooltip-desc{font-size:11.5px;color:var(--text-secondary);line-height:1.5}

/* ===== Move popup — replaces the always-visible area tab bar. ===== */
.move-popup{position:absolute;right:16px;top:calc(100px + env(safe-area-inset-top,0));z-index:5;background:var(--surface-1);border:1px solid var(--divider);border-radius:18px;padding:10px;display:none;box-shadow:0 12px 32px rgba(0,0,0,.5);min-width:160px}
.move-popup.show{display:block}
.move-popup-title{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;padding:4px 8px 8px}
.move-item-btn{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text-primary);font-family:var(--sans);font-size:14px;font-weight:600;padding:11px 10px;border-radius:10px;cursor:pointer}
.move-item-btn.active{color:var(--amber);background:rgba(214,168,75,.1)}
.move-item-btn:active{background:var(--surface-2)}

/* ===== Item-acquired toast — centered, slides up gently from below. ===== */
.acquire-toast{position:absolute;left:50%;top:42%;transform:translate(-50%,16px);z-index:7;background:rgba(5,7,10,.94);border:1px solid rgba(89,184,200,.4);border-radius:16px;padding:16px 22px;display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.acquire-toast.show{opacity:1;transform:translate(-50%,0)}
.acquire-toast-icon{font-size:26px;line-height:1}
.acquire-toast-text{font-size:14.5px;font-weight:700;color:#fff}

/* ===== Dialogue popup (tap-through, reused vnPlayer engine) ===== */
/* Floating (not a full-screen scrim + edge-to-edge bar) — the room photo
   stays visible and un-dimmed behind it; tapping anywhere on msg-layer
   still advances the line, same as before. */
.msg-layer{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;justify-content:flex-end;cursor:pointer}
.msg-layer.show{display:flex}
.msg-panel{position:relative;margin:0 16px calc(16px + env(safe-area-inset-bottom,0));background:rgba(5,7,10,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.35);padding:16px 18px;min-height:20vh;display:flex;flex-direction:column}
.msg-name{font-size:15px;font-weight:700;color:var(--cyan);margin-bottom:8px}
.msg-name:empty{display:none}
.msg-text{flex:1;font-size:16px;line-height:1.65;color:#fff;white-space:pre-wrap;word-break:keep-all}
.msg-foot{display:flex;justify-content:flex-end;padding-top:6px}
.msg-arrow{font-size:13px;color:var(--text-secondary);visibility:hidden}
@keyframes arrowBob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.msg-arrow.show{visibility:visible;animation:arrowBob 1.1s ease-in-out infinite}

/* ===== GAME CLEAR stamp + fade/redirect ===== */
.stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);z-index:9;font-family:var(--mono);font-size:32px;font-weight:700;letter-spacing:.12em;color:var(--cyan);text-shadow:0 0 24px rgba(89,184,200,.6);opacity:0;pointer-events:none}
.stamp.show{animation:stampPop 1.3s ease-out forwards}
@keyframes stampPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.fade-overlay{position:absolute;inset:0;z-index:10;background:#000;opacity:0;pointer-events:none;transition:opacity .9s ease}
.fade-overlay.show{opacity:1}
.fade-overlay.fast{transition-duration:.16s}

/* ===== Dev debug sheet ===== */
.sheet-overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-overlay.hidden{display:none}
.sheet{width:100%;max-width:430px;background:var(--surface-1);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0));border-top:1px solid var(--divider)}
.sheet-title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-muted);margin-bottom:14px;text-transform:uppercase}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.sheet-btn{background:var(--surface-2);color:var(--text-primary);border:1px solid var(--divider);border-radius:10px;padding:12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--mono)}
.sheet-btn.danger{color:var(--signal-red);border-color:rgba(217,65,65,.4)}
.sheet-close{width:100%;margin-top:4px;background:var(--surface-2);color:var(--text-primary);border:1px solid var(--divider);border-radius:10px;padding:13px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--mono);letter-spacing:.06em}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="topbar">
    <a class="vn-btn" href="/dev/">← DEV</a>
    <button class="vn-btn" id="devBtn">DEV</button>
  </div>

  <div class="room-view" id="roomView">
    <div class="photo-stage hidden" id="photoStage">
      <div class="photo-canvas" id="photoCanvas"></div>
    </div>
    <div class="grid-scroll" id="gridScroll">
      <div class="hotspot-grid" id="hotspotGrid"></div>
    </div>
  </div>

  <div class="popup-scrim" id="popupScrim"></div>

  <div class="inventory-bar" id="inventoryBar"></div>
  <div class="item-tooltip" id="itemTooltip">
    <div class="item-tooltip-name" id="itemTooltipName"></div>
    <div class="item-tooltip-desc" id="itemTooltipDesc"></div>
  </div>

  <div class="move-popup" id="movePopup">
    <div class="move-popup-title">이동</div>
    <div id="moveList"></div>
  </div>

  <div class="fab-row" id="fabRow">
    <button class="fab-btn" id="moveFabBtn">이동</button>
  </div>

  <div class="acquire-toast" id="acquireToast">
    <span class="acquire-toast-icon" id="acquireToastIcon"></span>
    <span class="acquire-toast-text" id="acquireToastText"></span>
  </div>

  <div class="msg-layer" id="msgLayer">
    <div class="msg-panel">
      <div class="msg-name" id="msgName"></div>
      <div class="msg-text" id="msgText"></div>
      <div class="msg-foot"><span class="msg-arrow" id="msgArrow">▼</span></div>
    </div>
  </div>

  <div class="stamp" id="stamp">GAME CLEAR</div>
  <div class="fade-overlay" id="fadeOverlay"></div>
</div>

<div class="sheet-overlay hidden" id="sheetOverlay">
  <div class="sheet">
    <div class="sheet-title">Dev · Minigame Debug</div>
    <div class="sheet-grid">
      <button class="sheet-btn" id="btnShowHotspots">HIDE HOTSPOTS</button>
      <button class="sheet-btn" id="btnOpenBathroomDoor">OPEN BATHROOM DOOR</button>
      <button class="sheet-btn" id="btnGiveDeadFlashlight">GIVE DEAD FLASHLIGHT</button>
      <button class="sheet-btn" id="btnGiveBatteries">GIVE BATTERIES</button>
      <button class="sheet-btn" id="btnGiveWorkingFlashlight">GIVE WORKING FLASHLIGHT</button>
      <button class="sheet-btn" id="btnGiveMetalHanger">GIVE METAL HANGER</button>
      <button class="sheet-btn" id="btnGiveGardenStake">GIVE GARDEN STAKE</button>
      <button class="sheet-btn" id="btnGiveLongHook">GIVE LONG HOOK</button>
      <button class="sheet-btn" id="btnRevealKey">REVEAL KEY</button>
      <button class="sheet-btn" id="btnGiveKey">GIVE KEY</button>
      <button class="sheet-btn" id="btnUnlockPhone">UNLOCK PHONE</button>
      <button class="sheet-btn" id="btnGivePhone">GIVE PHONE</button>
      <button class="sheet-btn danger" id="btnResetMinigame">RESET GAME</button>
      <button class="sheet-btn danger" id="btnClearState">CLEAR STATE</button>
    </div>
    <button class="sheet-close" id="sheetCloseBtn">CLOSE</button>
  </div>
</div>

<script>
function setVh100() { document.documentElement.style.setProperty('--vh100', window.innerHeight + 'px'); }
setVh100();
window.addEventListener('resize', setVh100);
window.addEventListener('orientationchange', setVh100);
// NOT window.visualViewport's 'resize' — iOS Safari's dynamic toolbar
// (address bar) hides/shows in response to plain taps (e.g. tapping to
// advance dialogue), firing visualViewport resize each time and making
// --vh100 (and the frame's height with it) visibly jump up/down mid-tap.
// window/orientationchange above already cover real layout changes.

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script src="/dev/assetDb.js"></script>
<script src="/dev/loadingOverlay.js"></script>
<script src="/dev/dialogueData.js"></script>
<script src="/dev/caseFileData.js"></script>
<script src="/dev/caseFileState.js"></script>
<script src="/dev/vnPlayer.js"></script>
<script>
/* OPERATION MK — WEEK 1 · SCENE 2-2 「핸드폰을 찾아라」 (v3 — 실제 4개 장소
   이미지 기반 Hotspot · 아이템 조합 · 상태 변화 · 재탐색).
   Point-and-click room search across 4 real accommodation photos (주방/욕실/
   외부/침실 — roomSearchAreas in dialogueData.js). Absolute rule this file
   exists to enforce: the player CANNOT find jisu-phone until unknown-key has
   been found AND the forced phoneUnlocked event has played — see
   canRevealPhone() below, which every phone-reveal path (including the DEV
   sheet) must go through. State still round-trips through localStorage
   (saveState()/STATE_KEY) so within-session actions like area moves keep
   working the same way, but every fresh load of this page starts clean —
   entering the minigame (from /dev/minigames, the VN story flow, or a
   plain refresh) always resets items/progress rather than resuming a
   stale run from a previous test pass.

   Each area renders one of two ways, decided per area every time it's opened:
   - "photo" mode, once a dev has uploaded that area's room photo and marked
     at least one hotspot's tap position in /dev/upload's 4-corner-tap area
     designator — pan/zoom over the real photo, tapping the (invisible)
     marked zone triggers the hotspot, same as tapping the Eastwood
     minigame's map. Hotspot positions live in Supabase (AssetDB), not
     localStorage, so marking them from any device works immediately.
   - "grid" mode (fallback) — a card grid of the area's hotspots by name, so
     the puzzle is fully playable before any photo/hotspot has been marked. */
const STATE_KEY = 'mkPhoneSearchState_v2';
const HOTSPOT_MIN_FR = 0.045; // floor radius (around a shape's centroid) for a carelessly tiny/thin drawn shape, same rationale as Eastwood's

const ITEM_DEFS = {
  'dead-flashlight': { icon: '🔦', name: '손전등', selectable: true, inspect: '배터리가 들어 있지 않다.' },
  'aa-batteries': { icon: '🔋', name: 'AA 건전지', selectable: false, inspect: 'AA 건전지 두 개다.' },
  'working-flashlight': { icon: '🔦', name: '작동 손전등', selectable: true, inspect: '불빛이 밝게 켜진다.' },
  'metal-hanger': { icon: '🧷', name: '철제 옷걸이', selectable: false, inspect: '길게 펴면 뭔가에 쓸 수 있을 것 같다.' },
  'garden-stake': { icon: '🥢', name: '정원용 지지대', selectable: false, inspect: '끝에 무언가 걸 수 있을 것 같다.' },
  'long-hook': { icon: '🪝', name: '긴 갈고리', selectable: true, inspect: '옷걸이와 지지대를 엮어 만든 갈고리다.' },
  'unknown-key': { icon: '🗝️', name: '낡은 열쇠', selectable: false, inspect: '어디에 쓰는 열쇠인지 모르겠다.' },
  'jisu-phone': { icon: '📱', name: '핸드폰', selectable: false },
  // Section 18 decoys — one-time flavor collectibles, never used by any
  // recipe or hotspot gating. Purely for "방 탐색 감각 강화".
  'dish-towel': { icon: '🧻', name: '행주', selectable: false, inspect: '평범한 행주다.' },
  'plastic-bag': { icon: '🛍️', name: '비닐봉지', selectable: false, inspect: '접힌 비닐봉지다.' },
  'rubber-band': { icon: '➰', name: '고무줄', selectable: false, inspect: '작은 고무줄이다.' },
  'small-coin': { icon: '🪙', name: '동전', selectable: false, inspect: '동전 하나다.' },
  'dry-twig': { icon: '🌿', name: '마른 나뭇가지', selectable: false, inspect: '마른 나뭇가지다.' },
  'bottle-cap': { icon: '🧢', name: '병뚜껑', selectable: false, inspect: '녹슨 병뚜껑이다.' },
  receipt: { icon: '🧾', name: '영수증', selectable: false, inspect: '오래돼서 글씨가 잘 안 보인다.' },
  paperclip: { icon: '📎', name: '클립', selectable: false, inspect: '작은 클립이다.' },
};

// Section 9/10 — 2-item combination recipes. Order-independent.
const RECIPES = [
  {
    id: 'make-working-flashlight',
    inputItemIds: ['dead-flashlight', 'aa-batteries'],
    outputItemId: 'working-flashlight',
    consumeInputItems: true,
    successMessage: '건전지를 넣자 손전등이 켜졌다.',
  },
  {
    id: 'make-long-hook',
    inputItemIds: ['metal-hanger', 'garden-stake'],
    outputItemId: 'long-hook',
    consumeInputItems: true,
    successMessage: '옷걸이를 길게 펴 지지대 끝에 고정했다.\n임시 긴 갈고리를 만들었다.',
  },
];
function findRecipe(idA, idB) {
  return RECIPES.find(r =>
    (r.inputItemIds[0] === idA && r.inputItemIds[1] === idB) ||
    (r.inputItemIds[0] === idB && r.inputItemIds[1] === idA)
  );
}
function isCombinable(itemId) {
  return hasItem(itemId) && RECIPES.some(r => r.inputItemIds.includes(itemId));
}

// One-time decoy pickups (section 18) keyed by hotspot ID — no gating, no

// Every entry into this page is a fresh run — no loadState()/restore from a
// previous test pass. saveState() still writes to STATE_KEY so within-session
// helpers (e.g. the DEV sheet) that read it back stay in sync, but nothing
// reads it back in on boot.
let state = defaultState();
function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
saveState();

function hasItem(id) { return state.inventoryItemIds.includes(id); }
// Mirrors into the CASE FILE menu's shared 소지품 list through this single
// choke point — every addItem() call site (including the DEV sheet's GIVE
// buttons) picks this up for free instead of needing its own extra call.
function addItem(id) {
  if (hasItem(id)) return;
  state.inventoryItemIds.push(id);
  saveState();
  CaseFileState.addInventoryItem(id);
  showAcquireToast(id);
}

// 을/를 particle by Hangul batchim — final consonant present -> 을, else 를.
function withEulReul(name) {
  const lastChar = name.charCodeAt(name.length - 1);
  if (lastChar < 0xAC00 || lastChar > 0xD7A3) return name + '를';
  return name + ((lastChar - 0xAC00) % 28 === 0 ? '를' : '을');
}
let acquireToastTimer = null;
function showAcquireToast(itemId) {
  const def = ITEM_DEFS[itemId];
  if (!def) return;
  clearTimeout(acquireToastTimer);
  el.acquireToast.classList.remove('show');
  el.acquireToastIcon.textContent = def.icon;
  el.acquireToastText.textContent = `${withEulReul(def.name)} 획득했습니다.`;
  void el.acquireToast.offsetWidth; // restart the slide-up transition if still showing
  el.acquireToast.classList.add('show');
  acquireToastTimer = setTimeout(() => el.acquireToast.classList.remove('show'), 1800);
}

// UNKNOWN KEY is the one item this build turns into a real Evidence record
// (plus its starter Questions) — idempotent by id, so it's safe to call
// from both the real pickup path and the DEV sheet's GIVE KEY shortcut.
function registerKeyEvidence() {
  CaseFileState.addEvidence(EVIDENCE_UNKNOWN_KEY);

}

function hasSearched(hotspotId) { return state.searchedHotspotIds.includes(hotspotId); }
function markSearched(hotspotId) {
  if (!state.searchedHotspotIds.includes(hotspotId)) state.searchedHotspotIds.push(hotspotId);
  state.searchCounts[hotspotId] = (state.searchCounts[hotspotId] || 0) + 1;
  saveState();
}

function canRevealPhone() {
  return state.flags.keyFound && state.flags.phoneUnlocked;

// ===== Hint system (section 20) — nudges after real stretches with no
// progress, not a fixed timer from page load, so replays/testing aren't
// spammed. markProgress() resets the clock on every meaningful state change. =====
let lastProgressAt = Date.now();
let hint60Shown = false, hint120Shown = false;
function markProgress() {
  lastProgressAt = Date.now();
  hint60Shown = false;
  hint120Shown = false;
}
setInterval(() => {
  if (state.completed || dialogueActive) return;
  const elapsed = Date.now() - lastProgressAt;
  if (elapsed >= 120000 && !hint120Shown) {
    hint120Shown = true;
    queueDialogue([{ speaker: '지수', text: '쌤.\n뭔가 합쳐서 쓸 수 있는 거 없어요?' }]);
  } else if (elapsed >= 60000 && !hint60Shown) {
    hint60Shown = true;
    setMessage('눈에 보이는 물건 중\n그대로는 쓸 수 없는 것도 있어 보인다.');
  }
}, 5000);

/* ===== Dialogue popup — every player-facing line goes through here now,
   both real character dialogue (queueDialogue) and one-off flavor/result
   text (setMessage, below): a tap-blocking box with the same typewriter +
   tap-to-reveal/tap-to-advance behavior either way. Flavor lines just carry
   no speaker, so msg-name's :empty rule collapses that row automatically. */
let dialogueActive = false;
let activeMsgTapHandler = null;
function queueDialogue(lines, onComplete) {
  if (activeMsgTapHandler) el.msgLayer.removeEventListener('click', activeMsgTapHandler);
  dialogueActive = true;
  el.msgLayer.classList.add('show');
  el.inventoryBar.classList.add('hidden'); // both dock at the bottom edge — dialogue takes priority
  const player = createVNPlayer({
    onLineChange: (line) => { el.msgName.textContent = line.speaker || ''; },
    onTextUpdate: (text) => { el.msgText.textContent = text; },
    onArrow: (show) => el.msgArrow.classList.toggle('show', show),
    onComplete: () => {
      el.msgLayer.classList.remove('show');
      dialogueActive = false;
      if (!state.completed) el.inventoryBar.classList.remove('hidden');
      el.msgLayer.removeEventListener('click', activeMsgTapHandler);
      activeMsgTapHandler = null;
      if (onComplete) onComplete();
    },
  });
  activeMsgTapHandler = () => player.tap();
  el.msgLayer.addEventListener('click', activeMsgTapHandler);
  player.load(lines.map(l => ({ speaker: l.speaker, text: l.text })));
}

/* ===== Forced key -> phone-unlock event (section 11 of the brief) =====
   Scheduled 700-1200ms after the key is found, independent of what the
   player taps in the meantime — the phone stays gated on phoneUnlocked
   regardless, so there's no way to race past it. Also re-armed on page load
   if a refresh happened between keyFound and phoneUnlocked, otherwise a
   refresh in that narrow window would soft-lock the phone forever. */
let forcedEventArmed = false;
function scheduleForcedPhoneUnlock(delayMs) {
  if (forcedEventArmed || state.flags.phoneUnlocked || state.completed) return;
  forcedEventArmed = true;
  setTimeout(() => {
    if (navigator.vibrate) navigator.vibrate(200);
    playBuzzSound();
    queueDialogue(KEY_FORCED_LINES, () => {
      state.flags.phoneUnlocked = true;
      saveState();
      setMessage('[ 어디선가 진동 소리가 들린다 ]');
    });
  }, delayMs);
}

function playBuzzSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(90, ctx.currentTime);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.5);
  } catch (e) { /* audio unavailable — not critical to gameplay */ }
}
function playSuccessBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.15);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.4);
  } catch (e) { /* audio unavailable — not critical to gameplay */ }
}

function handleKitchenFridgeGap() {
  if (state.flags.phoneFound) { setMessage('더 이상 아무것도 없다.'); return; }
  if (!canRevealPhone()) {
    setMessage(hasSearched('kitchen-fridge-gap')
      ? '여전히 좁은 틈이다.\n특별한 것은 보이지 않는다.'
      : '좁은 틈이다.\n특별한 것은 보이지 않는다.');
    markSearched('kitchen-fridge-gap');
    return;
  }
  // Needs the flashlight to actually reveal the glow (phoneGlowSeen) before
  // the hook can pull it out — mirrors handleRightVent's flashlight-then-
  // hook pattern instead of auto-revealing as soon as the key chain is done.
  if (state.selectedItemId === 'long-hook') {
    if (state.flags.phoneGlowSeen) { handlePhoneFound(); return; }
    setMessage('안쪽에 무엇이 있는지 아직 보이지 않는다.');
    return;
  }
  if (state.selectedItemId === 'working-flashlight') {
    if (!state.flags.phoneGlowSeen) {
      state.flags.phoneGlowSeen = true;
      saveState();
      setMessage('[ 안쪽을 비춘다 ]\n깊은 곳에서 화면 불빛이 보인다.\n손이 닿지 않는다.');
      markProgress();
    } else {
      setMessage('반짝이는 화면 불빛이 보인다.\n손이 닿지 않는다.');
    }
    return;
  }
  if (state.selectedItemId === 'dead-flashlight') { setMessage('손전등이 켜지지 않는다.'); return; }
  if (!state.flags.phoneGlowSeen) {
    setMessage(hasSearched('kitchen-fridge-gap')
      ? '여전히 안쪽이 어둡다.'
      : '안쪽 깊은 곳은 어두워서 잘 보이지 않는다.');
    markSearched('kitchen-fridge-gap');
  } else {
    setMessage('반짝이는 화면 불빛이 보인다.\n손이 닿지 않는다.');
  }
}

      state.flags.keyVisible = true;
      saveState();
      setMessage('[ 환기구 안쪽을 비춘다 ]\n안쪽에서 무언가 반짝인다.\n너무 높아서 손이 닿지 않는다.');
      markProgress();
    } else {
      setMessage('아까 그 반짝이는 물건이다.\n손이 닿지 않는다.');
    }
    return;
  }
  if (state.selectedItemId === 'dead-flashlight') { setMessage('손전등이 켜지지 않는다.'); return; }
  if (!state.flags.keyVisible) {
    setMessage(hasSearched('bedroom-right-vent') ? '여전히 안쪽이 어둡다.' : '높고 어두워서 안쪽이 보이지 않는다.');
    markSearched('bedroom-right-vent');
  } else {
    setMessage('반짝이는 게 보이는데 손이 닿지 않는다.');
  }
}

/* ===== Photo-mode pan/zoom stage (ported from minigame-eastwood's map
   canvas — same pinch/pan/wheel handling, just over a room photo with
   multiple named hotspots instead of one map with one named station). ===== */
let scale = 1, baseScale = 1, tx = 0, ty = 0;
let CANVAS_W = 1, CANVAS_H = 1;
let currentHotspots = {}; // hotspotId -> [{x,y}, ...] normalized polygon points, only populated in photo mode
const pointers = new Map();
let panStart = null;
let pinchStartDist = 0, pinchStartScale = 1;
let didPan = false;
let pressedPoint = null;

// The photo always fills the stage vertically — baseScale comes from height
// alone, not the usual "contain" min(width,height) fit — so a wide photo
// overflows horizontally and is swiped/panned into view instead of being
// letterboxed down to fit. The zoom floor is exactly baseScale (no *0.7
// margin below it) so zooming out can never go past that height-filled
// state; clampPan keeps every pan/zoom from revealing empty space beyond
// the photo's edges.
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
function clampScale(s) { return Math.min(Math.max(s, baseScale), baseScale * 3); }
function clampPan() {
  const rect = el.photoStage.getBoundingClientRect();
  const scaledW = CANVAS_W * scale, scaledH = CANVAS_H * scale;
  tx = scaledW <= rect.width ? (rect.width - scaledW) / 2 : Math.min(0, Math.max(rect.width - scaledW, tx));
  ty = scaledH <= rect.height ? (rect.height - scaledH) / 2 : Math.min(0, Math.max(rect.height - scaledH, ty));
}
function applyCanvasTransform() { clampPan(); el.photoCanvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }

function fitToStage() {
  const rect = el.photoStage.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  baseScale = rect.height / CANVAS_H;
  scale = baseScale;
  tx = (rect.width - CANVAS_W * scale) / 2;
  ty = (rect.height - CANVAS_H * scale) / 2;
  applyCanvasTransform();
}
// Re-fit whenever .frame's actual height can change, same event set as
// setVh100() above (--vh100 drives .frame's height) — a plain window
// 'resize' alone misses iOS Safari's address-bar collapse/expand, which
// only fires visualViewport's own 'resize' event. Without this, the photo
// stays scaled/positioned for the old (shorter or taller) stage height
// after the bar animates, leaving the stage's own dark background exposed
// as a black strip at the top or bottom depending on which way it moved.
function refitStageOnResize() { if (!el.photoStage.classList.contains('hidden')) fitToStage(); }
window.addEventListener('resize', refitStageOnResize);
window.addEventListener('orientationchange', refitStageOnResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', refitStageOnResize);

function screenToCanvas(clientX, clientY) {
  const rect = el.photoStage.getBoundingClientRect();
  return { x: (clientX - rect.left - tx) / scale, y: (clientY - rect.top - ty) / scale };
}

function buildPhotoCanvas(url) {
  el.photoCanvas.innerHTML = '';
  const img = document.createElement('img');
  img.src = url;
  img.alt = '';
  img.draggable = false;
  Object.assign(img.style, { width: CANVAS_W + 'px', height: CANVAS_H + 'px' });
  el.photoCanvas.appendChild(img);
}

// Overlay (still toggleable via the DEV sheet's SHOW/HIDE HOTSPOTS button)
// — draws just the item-bearing hotspots' rectangle + id + item label
// directly on the photo (not every marked hotspot — pure-flavor spots with
// no item add noise). Defaults to ON while the game is still in testing —
// TODO: flip back to false once testing wraps, so real players don't see
// where items are.
let debugShowHotspots = true;
function renderDebugHotspotOverlay() {
  el.photoCanvas.querySelectorAll('.debug-hotspot-box, .debug-item-label').forEach(n => n.remove());
  if (!debugShowHotspots || currentMode !== 'photo') return;
  Object.keys(currentHotspots).filter(id => ITEM_HOTSPOT_ITEM_IDS.has(id)).forEach(id => {
    const pts = currentHotspots[id].map(p => ({ x: p.x * CANVAS_W, y: p.y * CANVAS_H }));
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    const x1 = Math.min(...xs), y1 = Math.min(...ys), x2 = Math.max(...xs), y2 = Math.max(...ys);
    const box = document.createElement('div');
    box.className = 'debug-hotspot-box';
    Object.assign(box.style, {
      left: x1 + 'px',
      top: y1 + 'px',
      width: (x2 - x1) + 'px',
      height: (y2 - y1) + 'px',
    });
    box.textContent = id;
    el.photoCanvas.appendChild(box);

    // Item name label, floated just outside the box's right edge (so it
    // never covers the hotspot itself) — the dev-sheet debug overlay is the
    // only place this ever renders, never seen during real play.
    const itemDef = ITEM_DEFS[ITEM_HOTSPOT_ITEM_IDS.get(id)];
    if (itemDef) {
      const label = document.createElement('div');
      label.className = 'debug-item-label';
      Object.assign(label.style, { left: (x2 + 4) + 'px', top: y1 + 'px' });
      label.textContent = `${itemDef.icon} ${itemDef.name}`;
      el.photoCanvas.appendChild(label);
    }
  });
}

function flashTapRing(point) {
  const r = 36;
  const ring = document.createElement('div');
  ring.className = 'tap-ring';
  Object.assign(ring.style, { left: (point.x - r) + 'px', top: (point.y - r) + 'px', width: r * 2 + 'px', height: r * 2 + 'px' });
  el.photoCanvas.appendChild(ring);
  setTimeout(() => ring.remove(), 450);
}

// Accepts either the current free-form { points } shape or an older saved
// { x1, y1, x2, y2 } rectangle, always returning a normalized points array.
function hotspotToPoints(h) {
  if (!h) return null;
  if (h.points && h.points.length >= 3) return h.points;
  if (h.x1 !== undefined) return [{ x: h.x1, y: h.y1 }, { x: h.x2, y: h.y1 }, { x: h.x2, y: h.y2 }, { x: h.x1, y: h.y2 }];
  return null;
}

function isPointInPolygon(px, py, points) {
  let inside = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    const xi = points[i].x, yi = points[i].y, xj = points[j].x, yj = points[j].y;
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function hotspotIdAtPoint(point) {
  for (const id in currentHotspots) {
    const pts = currentHotspots[id].map(p => ({ x: p.x * CANVAS_W, y: p.y * CANVAS_H }));
    if (isPointInPolygon(point.x, point.y, pts)) return id;
    // A carelessly small/thin hand-drawn shape still needs to stay tappable —
    // fall back to a minimum-radius circle around its centroid.
    const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length, cy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
    const minR = HOTSPOT_MIN_FR * CANVAS_W;
    if (Math.hypot(point.x - cx, point.y - cy) <= minR) return id;
  }
  return null;
}

function onPhotoTap(point) {
  flashTapRing(point);
  const hotspotId = hotspotIdAtPoint(point);
  if (hotspotId) onHotspotTap(hotspotId);
}

el.photoStage.addEventListener('pointerdown', (e) => {
  if (state.completed || dialogueActive) return;
  el.photoStage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  didPan = false;
  if (pointers.size === 1) {
    panStart = { x: e.clientX, y: e.clientY, tx, ty };
    pressedPoint = screenToCanvas(e.clientX, e.clientY);
  } else if (pointers.size === 2) {
    pressedPoint = null;
    const pts = [...pointers.values()];
    pinchStartDist = dist(pts[0], pts[1]);
    pinchStartScale = scale;
  }
});
el.photoStage.addEventListener('pointermove', (e) => {
  if (state.completed || dialogueActive || !pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1 && panStart) {
    const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) didPan = true;
    tx = panStart.tx + dx;
    ty = panStart.ty + dy;
    applyCanvasTransform();
  } else if (pointers.size === 2) {
    const pts = [...pointers.values()];
    const d = dist(pts[0], pts[1]);
    const newScale = clampScale(pinchStartScale * (d / pinchStartDist));
    const rect = el.photoStage.getBoundingClientRect();
    const midNow = mid(pts[0], pts[1]);
    const stageX = midNow.x - rect.left, stageY = midNow.y - rect.top;
    const ratio = newScale / scale;
    tx = stageX - (stageX - tx) * ratio;
    ty = stageY - (stageY - ty) * ratio;
    scale = newScale;
    didPan = true;
    applyCanvasTransform();
  }
});
['pointerup', 'pointercancel'].forEach(evt => el.photoStage.addEventListener(evt, (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStartDist = 0;
  if (pointers.size === 0) {
    panStart = null;
    if (evt === 'pointerup' && !didPan && !state.completed && !dialogueActive && pressedPoint) onPhotoTap(pressedPoint);
    pressedPoint = null;
  }
}));
el.photoStage.addEventListener('wheel', (e) => {
  if (state.completed) return;
  e.preventDefault();
  const rect = el.photoStage.getBoundingClientRect();
  const stageX = e.clientX - rect.left, stageY = e.clientY - rect.top;
  const newScale = clampScale(scale * (e.deltaY < 0 ? 1.1 : 0.9));
  const ratio = newScale / scale;
  tx = stageX - (stageX - tx) * ratio;
  ty = stageY - (stageY - ty) * ratio;
  scale = newScale;
  applyCanvasTransform();
}, { passive: false });

/* ===== Area loading + rendering ===== */
let currentMode = 'grid'; // 'grid' | 'photo'

// Every area's photo/hotspots are already fetched into AssetDB's own caches
// up front (see preloadAllAreas, called once at boot) — getAsset/
// getRoomHotspots/preloadImage below all resolve from cache instantly by
// the time this runs again for an area switch, no network wait, so no
// per-call loading state is needed here (see switchArea for the quick
// blackout transition that plays instead).
async function loadArea(area) {
  const sceneId = roomSearchAreaSceneId(area.id);
  const assetId = DevGameState.getBackgroundId(sceneId);
  const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
  const hotspots = await DevGameState.getRoomHotspots(sceneId);
  if (asset && asset.dataUrl && Object.keys(hotspots).length) {
    currentMode = 'photo';
    currentHotspots = {};
    Object.keys(hotspots).forEach(id => {
      const pts = hotspotToPoints(hotspots[id]);
      if (pts) currentHotspots[id] = pts;
    });
    CANVAS_W = asset.width;
    CANVAS_H = asset.height;
    await AssetDB.preloadImage(asset.dataUrl);
    buildPhotoCanvas(asset.dataUrl);
  } else {
    currentMode = 'grid';
    currentHotspots = {};
  }
  // Un-hide .photo-stage (renderRoomView) before fitToStage measures its
  // rect — while still "hidden" (display:none) getBoundingClientRect() is
  // 0x0, so fitToStage silently no-ops and the photo renders unscaled at
  // native pixel size, cropped to its top-left corner instead of scaled to
  // fill the screen. Only mattered on the very first area shown per page
  // load; later area switches kept the stage already visible from before.
  renderRoomView(area);
  if (currentMode === 'photo') {
    fitToStage();
    renderDebugHotspotOverlay();
  }
}

// Fetches every area's background asset + hotspots + image bytes up front
// (not just the one being shown), behind a single loading screen — so
// switching areas afterward never has to show its own "OO 불러오는 중"
// state; it's already warm.
async function preloadAllAreas() {
  LoadingOverlay.show('불러오는 중');
  await Promise.all(roomSearchAreas.map(async (area) => {
    const sceneId = roomSearchAreaSceneId(area.id);
    const assetId = DevGameState.getBackgroundId(sceneId);
    const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
    await DevGameState.getRoomHotspots(sceneId).catch(() => ({}));
    if (asset && asset.dataUrl) await AssetDB.preloadImage(asset.dataUrl);
  }));
  LoadingOverlay.hide();
}

// A player-initiated area switch: everything's already cached (see
// preloadAllAreas), so instead of a loading state, it just plays a quick
// blackout — fade to black, swap the content underneath, fade back in —
// like a scene cut rather than a fetch.
async function switchArea(area) {
  el.fadeOverlay.classList.add('fast', 'show');
  await new Promise(resolve => setTimeout(resolve, 180));
  await loadArea(area);
  await new Promise(resolve => requestAnimationFrame(resolve));
  el.fadeOverlay.classList.remove('show');
  setTimeout(() => el.fadeOverlay.classList.remove('fast'), 180);
}

function renderRoomView(area) {
  el.photoStage.classList.toggle('hidden', currentMode !== 'photo');
  el.gridScroll.classList.toggle('hidden', currentMode !== 'grid');
  if (currentMode === 'grid') {
    el.hotspotGrid.innerHTML = '';
    area.hotspots.forEach(h => {
      const btn = document.createElement('button');
      btn.className = 'hotspot-btn';
      btn.textContent = h.label;
      btn.addEventListener('click', () => onHotspotTap(h.id));
      el.hotspotGrid.appendChild(btn);
    });
  }
}

/* ===== Item popup — icon grid, no text list. Tapping an item selects it
   (tooltip anchored at the icon); tapping a second, different item judges
   combinability automatically — a match auto-combines, a non-match is a
   total no-op ("무반응", per the brief — no message, no state change).
   Tapping the same item again deselects it. selectedItemId doubles as the
   "item in hand" the room hotspot handlers above already check for
   (state.selectedItemId === 'long-hook' etc.), so closing the popup keeps
   whatever was selected active for use on the room photo. ===== */
function canActivateItem(itemId) {
  const def = ITEM_DEFS[itemId];
  return !!def && (def.selectable || isCombinable(itemId));
}

function performCombine(recipe) {
  if (recipe.consumeInputItems) {
    state.inventoryItemIds = state.inventoryItemIds.filter(id => !recipe.inputItemIds.includes(id));
  }
  state.inventoryItemIds.push(recipe.outputItemId);
  state.selectedItemId = null;
  saveState();
  hideItemTooltip();
  renderItemGrid();
  setMessage(`[ ${recipe.successMessage} ]`);
  markProgress();
}

function onItemIconTap(itemId, btnEl) {
  if (state.completed) return;
  const def = ITEM_DEFS[itemId];
  if (!def) return;

  if (state.selectedItemId && state.selectedItemId !== itemId) {
    const recipe = findRecipe(state.selectedItemId, itemId);
    if (recipe) performCombine(recipe);
    return; // no recipe -> 무반응, leave everything exactly as it was
  }

  if (state.selectedItemId === itemId) {
    state.selectedItemId = null;
    saveState();
    hideItemTooltip();
    renderItemGrid();
    return;
  }

  if (!canActivateItem(itemId)) {
    showItemTooltip(itemId, btnEl);
    return;
  }

  state.selectedItemId = itemId;
  saveState();
  // Position the tooltip off the tapped button *before* re-rendering the
  // grid — renderItemGrid() replaces every button node, so calling this
  // after would read getBoundingClientRect() off an already-detached
  // element (collapses to 0,0, landing the tooltip top-left of the frame).
  showItemTooltip(itemId, btnEl);
  renderItemGrid();
}

function renderItemGrid() {
  el.inventoryBar.innerHTML = '';
  if (!state.inventoryItemIds.length) {
    const empty = document.createElement('div');
    empty.className = 'inventory-empty';
    empty.textContent = '비어 있다';
    el.inventoryBar.appendChild(empty);
    return;
  }
  state.inventoryItemIds.forEach(itemId => {
    const def = ITEM_DEFS[itemId];
    if (!def) return;
    const btn = document.createElement('button');
    btn.className = 'inventory-slot' + (state.selectedItemId === itemId ? ' selected' : '');
    btn.textContent = def.icon;
    btn.addEventListener('click', () => onItemIconTap(itemId, btn));
    el.inventoryBar.appendChild(btn);
  });
}

function showItemTooltip(itemId, btnEl) {
  const def = ITEM_DEFS[itemId];
  if (!def || !def.inspect) { hideItemTooltip(); return; }
  el.itemTooltipName.textContent = def.name;
  el.itemTooltipDesc.textContent = def.inspect;
  const frameRect = el.frame.getBoundingClientRect();
  const btnRect = btnEl.getBoundingClientRect();
  el.itemTooltip.style.left = '-999px';
  el.itemTooltip.classList.add('show');
  const tw = el.itemTooltip.offsetWidth || 180;
  let left = btnRect.right - frameRect.left + 8;
  const maxLeft = frameRect.width - tw - 8;
  if (left > maxLeft) left = Math.max(8, maxLeft);
  const top = btnRect.bottom - frameRect.top + 8;
  el.itemTooltip.style.left = left + 'px';
  el.itemTooltip.style.top = top + 'px';
}
function hideItemTooltip() {
  el.itemTooltip.classList.remove('show');
}

/* ===== Move popup + FAB — replaces the old always-visible area tab bar.
   The inventory is no longer a popup (see the persistent .inventory-bar +
   renderItemGrid above), so this only handles 이동 now. ===== */
function renderMoveList() {
  el.moveList.innerHTML = '';
  roomSearchAreas.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'move-item-btn' + (a.id === state.currentAreaId ? ' active' : '');
    btn.textContent = a.label;
    btn.addEventListener('click', () => {
      if (state.completed) return;
      closeMovePopup();
      if (a.id === state.currentAreaId) return;
      state.currentAreaId = a.id;
      saveState();
      switchArea(a);
    });
    el.moveList.appendChild(btn);
  });
}
function openMovePopup() {
  renderMoveList();
  el.movePopup.classList.add('show');
  el.popupScrim.classList.add('show');
  el.moveFabBtn.classList.add('active');
}
function closeMovePopup() {
  el.movePopup.classList.remove('show');
  el.moveFabBtn.classList.remove('active');
  el.popupScrim.classList.remove('show');
}
function toggleMovePopup() {
  if (el.movePopup.classList.contains('show')) closeMovePopup();
  else openMovePopup();
}

el.popupScrim.addEventListener('click', () => { closeMovePopup(); });

/* ===== Inventory bar drag-to-scroll — touch already gets native panning
   from overflow-x:auto + touch-action:pan-x above; this just adds the same
   for mouse (desktop testing has no trackpad-swipe equivalent otherwise).
   Suppresses the click that would otherwise fire on the slot under the
   cursor once a drag has actually moved past a small threshold, so a
   plain click still selects/combines normally. ===== */
let invDrag = null;
let invSuppressClick = false;
el.inventoryBar.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'mouse') return;
  invDrag = { startX: e.clientX, startScroll: el.inventoryBar.scrollLeft, moved: false };
});
el.inventoryBar.addEventListener('pointermove', (e) => {
  if (!invDrag) return;
  const dx = e.clientX - invDrag.startX;
  if (Math.abs(dx) > 4) invDrag.moved = true;
  el.inventoryBar.scrollLeft = invDrag.startScroll - dx;
});
window.addEventListener('pointerup', () => {
  if (invDrag && invDrag.moved) invSuppressClick = true;
  invDrag = null;
});
el.inventoryBar.addEventListener('click', (e) => {
  if (invSuppressClick) { e.stopPropagation(); invSuppressClick = false; }
}, true);

function updateLockState() {
  el.roomView.classList.toggle('locked', state.completed);
  el.fabRow.classList.toggle('hidden', state.completed);
  el.inventoryBar.classList.toggle('hidden', state.completed);
  if (state.completed) { hideItemTooltip(); closeMovePopup(); }
}

document.getElementById('btnOpenBathroomDoor').addEventListener('click', () => { state.flags.bathroomDoorOpened = true; saveState(); });
document.getElementById('btnGiveDeadFlashlight').addEventListener('click', () => { addItem('dead-flashlight'); renderItemGrid(); });
document.getElementById('btnGiveBatteries').addEventListener('click', () => { addItem('aa-batteries'); renderItemGrid(); });
document.getElementById('btnGiveWorkingFlashlight').addEventListener('click', () => { addItem('working-flashlight'); renderItemGrid(); });
document.getElementById('btnGiveMetalHanger').addEventListener('click', () => { addItem('metal-hanger'); renderItemGrid(); });
document.getElementById('btnGiveGardenStake').addEventListener('click', () => { addItem('garden-stake'); renderItemGrid(); });
document.getElementById('btnGiveLongHook').addEventListener('click', () => { addItem('long-hook'); renderItemGrid(); });
document.getElementById('btnRevealKey').addEventListener('click', () => { state.flags.keyVisible = true; saveState(); });
document.getElementById('btnGiveKey').addEventListener('click', () => {
  addItem('unknown-key');
  state.flags.keyVisible = true;
  state.flags.keyFound = true;
  saveState();
  registerKeyEvidence();
  renderItemGrid();
  scheduleForcedPhoneUnlock(600);
});
document.getElementById('btnUnlockPhone').addEventListener('click', () => { state.flags.phoneUnlocked = true; saveState(); });
document.getElementById('btnGivePhone').addEventListener('click', () => {
  state.flags.keyFound = true;
  state.flags.phoneUnlocked = true;
  handlePhoneFound();
});
document.getElementById('btnResetMinigame').addEventListener('click', () => {
  state = defaultState();
  saveState();
  location.reload();
});
document.getElementById('btnClearState').addEventListener('click', () => {
  localStorage.removeItem(STATE_KEY);
  location.reload();
});

/* ===== Boot ===== */
// dev/game/index.html never actually loads this scene id (it has no `lines`
// — MINIGAME_ROUTES and the scene's own `route` field both bypass it), so
// this is the only place 숙소's map-location visit can be recorded for it.
CaseFileState.recordSceneVisit('week1-scene-002-2');
renderItemGrid();
updateLockState();
(async function boot() {
  await preloadAllAreas();
  await loadArea(roomSearchAreas.find(a => a.id === state.currentAreaId) || roomSearchAreas[0]);
})();
// A refresh that landed between "key found" and "phone unlocked" must not
// soft-lock the phone forever — re-arm the forced event on load.
if (state.flags.keyFound && !state.flags.phoneUnlocked && !state.completed) {
  scheduleForcedPhoneUnlock(800);
}
</script>
</body>
