<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · 핸드폰을 찾아라</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERATION MK DEV">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;--surface-3:#1E252D;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}

.frame{position:relative;width:100%;max-width:430px;height:100dvh;height:100vh;height:var(--vh100, 100vh);overflow:hidden;background:var(--bg);display:flex;flex-direction:column}

/* ===== Top bar + mission strip ===== */
.topbar{flex-shrink:0;padding:calc(14px + env(safe-area-inset-top,0)) 16px 10px;display:flex;justify-content:space-between;align-items:center}
.vn-btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.mission-bar{flex-shrink:0;margin:0 16px 12px;background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:12px 14px}
.mission-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px}
.mission-target{font-size:16px;font-weight:800;color:var(--amber)}

/* ===== Room view ===== */
.room-view{flex:1;min-height:0;padding:4px 16px 10px;display:flex;flex-direction:column;transition:opacity .3s ease}
.area-heading{font-size:15px;font-weight:700;color:var(--text-secondary);margin-bottom:10px;flex-shrink:0}

/* Photo stage — a real uploaded room photo with invisible tap zones over
   each marked hotspot (pan/zoom like the subway minigame). Zones stay
   invisible in normal play so hunting for the phone/key still feels like
   searching a photo, not tapping a visible menu — see #btnToggleHotspots
   in the DEV sheet for a dev-only outline+label overlay. */
.photo-stage{flex:1;min-height:180px;position:relative;border-radius:14px;overflow:hidden;background:#05070a;touch-action:none;margin-bottom:10px}
.photo-stage.hidden{display:none}
.photo-canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.photo-canvas img{position:absolute;top:0;left:0;-webkit-user-drag:none;user-select:none;display:block}
.tap-ring{position:absolute;border-radius:50%;border:3px solid var(--cyan);opacity:.9;pointer-events:none;animation:tapRingFade 420ms ease forwards}
@keyframes tapRingFade{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.debug-hotspot{position:absolute;border:1.5px dashed var(--amber);background:rgba(214,168,75,.16);pointer-events:none}
.debug-hotspot-label{position:absolute;top:2px;left:2px;font-family:var(--mono);font-size:9.5px;line-height:1.4;color:var(--amber);background:rgba(0,0,0,.6);padding:2px 5px;border-radius:4px;white-space:pre}

/* Missing-asset notice — this minigame has no text-menu fallback (the
   whole point of this rework is "search a photo", not "pick from a list"),
   so an area with no photo/hotspots marked yet just says so plainly. */
.missing-notice{flex:1;min-height:180px;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;background:var(--surface-1);border:1px dashed var(--divider);border-radius:14px;margin-bottom:10px;padding:24px}
.missing-notice.show{display:flex}
.missing-icon{font-size:28px;opacity:.6}
.missing-title{font-size:15px;font-weight:700;color:var(--text-secondary)}
.missing-sub{font-size:12.5px;color:var(--text-muted);line-height:1.5;max-width:260px}
.missing-link{margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--cyan);text-decoration:none}

.result-strip{flex-shrink:0;margin-top:10px;background:rgba(255,255,255,.03);border:1px dashed var(--divider);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--cyan);white-space:pre-wrap;word-break:keep-all;min-height:1.6em}
.room-view.locked{pointer-events:none;opacity:.5}

/* ===== Inventory list ===== */
.inv-list{flex-shrink:0;display:flex;flex-direction:column;gap:8px;padding:10px 16px;border-top:1px solid var(--divider);max-height:180px;overflow-y:auto;transition:opacity .3s ease}
.inv-list.hidden{display:none}
.inv-list-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase}
.inv-row{display:flex;align-items:center;gap:10px;background:var(--surface-1);border:1px solid var(--divider);border-radius:12px;padding:9px 12px;cursor:pointer;transition:background .15s,border-color .15s}
.inv-row.fixed{cursor:default}
.inv-row.selected{background:rgba(89,184,200,.14);border-color:var(--cyan)}
.inv-row-icon{font-size:19px;width:26px;text-align:center;flex-shrink:0}
.inv-row-name{font-size:13.5px;font-weight:600;flex:1}
.inv-row-tag{font-family:var(--mono);font-size:9.5px;color:var(--cyan);letter-spacing:.05em;flex-shrink:0}
.inv-empty{font-family:var(--mono);font-size:11px;color:var(--text-muted);padding:2px}

/* ===== Area tabs ===== */
.tab-bar{flex-shrink:0;display:flex;border-top:1px solid var(--divider);padding-bottom:env(safe-area-inset-bottom,0);transition:opacity .3s ease}
.tab-bar.hidden{display:none}
.tab-btn{flex:1;background:none;border:none;color:var(--text-muted);font-family:var(--sans);font-size:13px;font-weight:600;padding:13px 4px;cursor:pointer;position:relative}
.tab-btn.active{color:var(--amber)}
.tab-btn.active::after{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--amber);border-radius:2px}

/* ===== Dialogue popup (tap-through, reused vnPlayer engine) ===== */
.msg-layer{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;justify-content:flex-end;cursor:pointer}
.msg-layer.show{display:flex}
.msg-scrim{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.msg-panel{position:relative;background:rgba(5,7,10,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.08);padding:18px 20px calc(18px + env(safe-area-inset-bottom,0));min-height:24vh;display:flex;flex-direction:column}
.msg-name{font-size:15px;font-weight:700;color:var(--cyan);margin-bottom:8px}
.msg-name:empty{display:none}
.msg-text{flex:1;font-size:16px;line-height:1.65;color:#fff;white-space:pre-wrap;word-break:keep-all}
.msg-foot{display:flex;justify-content:flex-end;padding-top:6px}
.msg-arrow{font-size:13px;color:var(--text-secondary);visibility:hidden}
@keyframes arrowBob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.msg-arrow.show{visibility:visible;animation:arrowBob 1.1s ease-in-out infinite}

/* ===== GAME CLEAR stamp + fade/redirect ===== */
.stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);z-index:9;font-family:var(--mono);font-size:32px;font-weight:700;letter-spacing:.12em;color:var(--cyan);text-shadow:0 0 24px rgba(89,184,200,.6);opacity:0;pointer-events:none}
.stamp.show{animation:stampPop 1.3s ease-out forwards}
@keyframes stampPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.fade-overlay{position:absolute;inset:0;z-index:10;background:#000;opacity:0;pointer-events:none;transition:opacity .9s ease}
.fade-overlay.show{opacity:1}

/* ===== Dev debug sheet ===== */
.sheet-overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-overlay.hidden{display:none}
.sheet{width:100%;max-width:430px;background:var(--surface-1);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0));border-top:1px solid var(--divider)}
.sheet-title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-muted);margin-bottom:14px;text-transform:uppercase}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.sheet-btn{background:var(--surface-2);color:var(--text-primary);border:1px solid var(--divider);border-radius:10px;padding:12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--mono)}
.sheet-btn.danger{color:var(--signal-red);border-color:rgba(217,65,65,.4)}
.sheet-btn.toggle-on{color:var(--amber);border-color:rgba(214,168,75,.5)}
.sheet-close{width:100%;margin-top:4px;background:var(--surface-2);color:var(--text-primary);border:1px solid var(--divider);border-radius:10px;padding:13px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--mono);letter-spacing:.06em}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="topbar">
    <a class="vn-btn" href="/dev/">← DEV</a>
    <button class="vn-btn" id="devBtn">DEV</button>
  </div>

  <div class="mission-bar">

      <button class="sheet-btn danger" id="btnResetMinigame">RESET MINIGAME</button>

    </div>

</div>

<script>
function setVh100() { document.documentElement.style.setProperty('--vh100', window.innerHeight + 'px'); }
setVh100();
window.addEventListener('resize', setVh100);
window.addEventListener('orientationchange', setVh100);
if (window.visualViewport) window.visualViewport.addEventListener('resize', setVh100);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script src="/dev/assetDb.js"></script>
<script src="/dev/dialogueData.js"></script>
<script src="/dev/vnPlayer.js"></script>
<script>
/* OPERATION MK — WEEK 1 · SCENE 2-2 「핸드폰을 찾아라」
   Point-and-click room search over real photos — no text-menu fallback.
   Absolute rule this file exists to enforce: the player CANNOT find
   jisu-phone until unknown-key has been found AND the forced
   phoneUnlocked event has played — see canRevealPhone() below, which
   every phone-reveal path (including the DEV sheet) must go through. State
   persists in localStorage so a refresh mid-search doesn't lose progress.

   Each area (roomSearchAreas, defined in dialogueData.js) needs a photo +
   at least one marked hotspot (set via /dev/upload's focus-mode editor,
   reached through /dev/minigames) before it's playable — until then it
   just shows the missing-asset notice below, since there is no
   text-button grid to fall back to anymore. */
const STATE_KEY = 'mkPhoneSearchState_v1';
const HOTSPOT_MIN_TOUCH_PX = 44; // CSS px — small hotspots get their *hit test* padded out to this, not their visible size (which stays invisible)

const ITEM_DEFS = {
  flashlight: { icon: '🔦', name: '손전등', selectable: true },
  hook: { icon: '🪝', name: '갈고리', selectable: true },
  'unknown-key': { icon: '🗝️', name: '낡은 열쇠', selectable: false },
  lipbalm: { icon: '💄', name: '립밤', selectable: false },
  'jisu-phone': { icon: '📱', name: '핸드폰', selectable: false },
};

// Flavor text for hotspots with no special gating logic — fixed, not random
// (brief explicitly forbids randomized key/phone placement; keeping every
// result deterministic is simplest and consistent).
const FLAVOR = {
  bed: '평범한 침대다.',
  pillow: '베개일 뿐이다.',
  blanket: '그냥 이불이다.',
  'behind-bed': '먼지만 조금 있다.',
  'bedside-table': '별거 없다.',
  sofa: '평범한 소파다.',
  'behind-sofa': '아무것도 없다.',
  'coffee-table': '잡지 몇 권이 있다.',
  desk: '책상이다.',
  'desk-drawer': '필기구뿐이다.',
  'charger-area': '충전기만 꽂혀 있다.',
  bag: '지수 가방이다. 뒤져볼 필요는 없을 것 같다.',
  'shoe-cabinet': '신발뿐이다.',
  closet: '옷 몇 벌이 걸려있다.',
  luggage: '캐리어다. 아직 짐도 안 풀었다.',
  'utility-cabinet': '청소도구뿐이다.',
};

const DARK_UNDER_BED_LINES = [
  { speaker: '영우', text: '어두워서 안 보이네.', characterId: 'youngwoo', expression: 'blank' },
  { speaker: '지수', text: '쌤 눈 크게 떠봐요.', characterId: 'jisoo', expression: 'smirk' },
  { speaker: '영우', text: '그걸로 되는 문제야?', characterId: 'youngwoo', expression: 'curious' },
];
const HOOK_LINES = [
  { speaker: '영우', text: '이건 왜 있지.', characterId: 'youngwoo', expression: 'curious' },
  { speaker: '지수', text: '몰라.\n일단 가져요.', characterId: 'jisoo', expression: 'neutral' },
  { speaker: '영우', text: '왜 이렇게 자연스럽게 챙겨 ㅋㅎㅋㅎㅋㅎㅋㅎ', characterId: 'youngwoo', expression: 'happy' },
];
const LIPBALM_LINES = [
  { speaker: '지수', text: '헐 내 거다.', characterId: 'jisoo', expression: 'shocked' },
  { speaker: '영우', text: '핸드폰 찾다가 립밤 찾았네.', characterId: 'youngwoo', expression: 'curious' },
  { speaker: '지수', text: '개이득.', characterId: 'jisoo', expression: 'smirk' },
];
const KEY_FORCED_LINES = [
  { speaker: '', text: '부우웅—', characterId: null },
  { speaker: '지수', text: '...어?', characterId: 'jisoo', expression: 'shocked' },
  { speaker: '영우', text: '핸드폰 아니야?', characterId: 'youngwoo', expression: 'curious' },
  { speaker: '지수', text: '맞아.', characterId: 'jisoo', expression: 'shocked' },
  { speaker: '', text: '부우웅—', characterId: null },
];

function defaultState() {
  return {
    currentAreaId: roomSearchAreas[0].id,
    inventoryItemIds: [],
    selectedItemId: null,
    flags: { keyVisible: false, keyFound: false, phoneUnlocked: false, phoneFound: false },
    completed: false,
    coinShown: false,
    lastMessage: '방 안 어딘가에 핸드폰이 있을 것이다.',
  };
}

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(STATE_KEY));
    if (!raw || typeof raw !== 'object') return defaultState();
    return Object.assign(defaultState(), raw, { flags: Object.assign(defaultState().flags, raw.flags || {}) });
  } catch (e) { return defaultState(); }
}

let state = loadState();
function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }

function hasItem(id) { return state.inventoryItemIds.includes(id); }
function addItem(id) {
  if (hasItem(id)) return;
  state.inventoryItemIds.push(id);
  saveState();
}

function canRevealPhone() {
  return state.flags.keyFound && state.flags.phoneUnlocked;
}

function setMessage(text) {
  state.lastMessage = text;
  saveState();
  el.resultStrip.textContent = text;
}

const el = {
  frame: document.getElementById('frame'),
  devBtn: document.getElementById('devBtn'),
  roomView: document.getElementById('roomView'),
  areaHeading: document.getElementById('areaHeading'),
  photoStage: document.getElementById('photoStage'),
  photoCanvas: document.getElementById('photoCanvas'),
  missingNotice: document.getElementById('missingNotice'),
  missingTitle: document.getElementById('missingTitle'),
  missingSub: document.getElementById('missingSub'),
  missingLink: document.getElementById('missingLink'),
  resultStrip: document.getElementById('resultStrip'),
  invList: document.getElementById('invList'),
  tabBar: document.getElementById('tabBar'),
  msgLayer: document.getElementById('msgLayer'),
  msgName: document.getElementById('msgName'),
  msgText: document.getElementById('msgText'),
  msgArrow: document.getElementById('msgArrow'),
  stamp: document.getElementById('stamp'),
  fadeOverlay: document.getElementById('fadeOverlay'),
  sheetOverlay: document.getElementById('sheetOverlay'),
  sheetCloseBtn: document.getElementById('sheetCloseBtn'),
  btnToggleHotspots: document.getElementById('btnToggleHotspots'),
};

/* ===== Dialogue popup (tap-through story beats only — item pickups/flavor
   text use the instant result strip instead, per the brief's "미니게임 중
   긴 대화 컷신 남발 금지"). ===== */
let dialogueActive = false;
function queueDialogue(lines, onComplete) {
  dialogueActive = true;
  el.msgLayer.classList.add('show');
  const player = createVNPlayer({
    onLineChange: (line) => { el.msgName.textContent = line.speaker || ''; },
    onTextUpdate: (text) => { el.msgText.textContent = text; },
    onArrow: (show) => el.msgArrow.classList.toggle('show', show),
    onComplete: () => {
      el.msgLayer.classList.remove('show');
      dialogueActive = false;
      el.msgLayer.removeEventListener('click', tapHandler);
      if (onComplete) onComplete();
    },
  });
  const tapHandler = () => player.tap();
  el.msgLayer.addEventListener('click', tapHandler);
  player.load(lines.map(l => ({ speaker: l.speaker, text: l.text })));
}

/* ===== Forced key -> phone-unlock event (section 11 of the brief) =====
   Scheduled 700-1200ms after the key is found, independent of what the
   player taps in the meantime — the phone stays gated on phoneUnlocked
   regardless, so there's no way to race past it. Also re-armed on page load
   if a refresh happened between keyFound and phoneUnlocked, otherwise a
   refresh in that narrow window would soft-lock the phone forever. */
let forcedEventArmed = false;
function scheduleForcedPhoneUnlock(delayMs) {
  if (forcedEventArmed || state.flags.phoneUnlocked || state.completed) return;
  forcedEventArmed = true;
  setTimeout(() => {
    if (navigator.vibrate) navigator.vibrate(200);
    playBuzzSound();
    queueDialogue(KEY_FORCED_LINES, () => {
      state.flags.phoneUnlocked = true;
      saveState();
      setMessage('[ 어디선가 진동 소리가 들린다 ]');
    });
  }, delayMs);
}

function playBuzzSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(90, ctx.currentTime);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.5);
  } catch (e) { /* audio unavailable — not critical to gameplay */ }
}
function playSuccessBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.15);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.4);
  } catch (e) { /* audio unavailable — not critical to gameplay */ }
}

/* ===== Hotspot handlers ===== */
function handleFlashlight() {
  if (hasItem('flashlight')) { setMessage('이미 챙겼다.'); return; }
  addItem('flashlight');
  setMessage('[ 손전등을 발견했다 ]');
  renderInventory();
}
function handleHook() {
  if (hasItem('hook')) { setMessage('이미 챙겼다.'); return; }
  addItem('hook');
  setMessage('[ 긴 갈고리를 발견했다 ]');
  renderInventory();
  queueDialogue(HOOK_LINES);
}
function handleUnderBed() {
  if (state.flags.keyFound) { setMessage('이미 다 찾아봤다.'); return; }
  if (state.selectedItemId === 'hook') {
    if (state.flags.keyVisible) {
      addItem('unknown-key');
      state.flags.keyFound = true;
      state.selectedItemId = null;
      saveState();
      setMessage('짤랑.\n[ 낡은 열쇠를 발견했다 ]');
      renderInventory();
      scheduleForcedPhoneUnlock(900);
    } else {
      setMessage('손이 닿지 않는다. 뭔가 다른 게 먼저 필요할 것 같다.');
    }
    return;
  }
  if (state.selectedItemId === 'flashlight') {
    if (!state.flags.keyVisible) {
      state.flags.keyVisible = true;
      saveState();
      setMessage('반짝이는 무언가가 보인다.\n하지만 손이 닿지 않는다.');
    } else {
      setMessage('아까 그 반짝이는 물건이다. 손이 닿지 않는다.');
    }
    return;
  }
  if (!hasItem('flashlight')) {
    queueDialogue(DARK_UNDER_BED_LINES);
  } else if (state.flags.keyVisible) {
    setMessage('반짝이는 게 보이는데 손이 닿지 않는다.');
  } else {
    setMessage('어두워서 잘 보이지 않는다.');
  }
}
function handleSofaCushion() {
  if (state.completed) return;
  if (canRevealPhone()) { handlePhoneFound(); return; }
  if (!state.coinShown) {
    state.coinShown = true;
    saveState();
    setMessage('동전 하나가 있다.');
  } else {
    setMessage('아무것도 없다.');
  }
}
function handleUnderSofa() {
  if (state.selectedItemId === 'flashlight' && !hasItem('lipbalm')) {
    addItem('lipbalm');
    setMessage('[ 립밤을 발견했다 ]');
    renderInventory();
    queueDialogue(LIPBALM_LINES);
    return;
  }
  setMessage('아무것도 없다.');
}

const HOTSPOT_HANDLERS = {
  'tv-stand': handleFlashlight,
  'upper-shelf': handleHook,
  'under-bed': handleUnderBed,
  'sofa-cushion': handleSofaCushion,
  'under-sofa': handleUnderSofa,
};

function onHotspotTap(hotspotId) {
  if (dialogueActive || state.completed) return;
  const handler = HOTSPOT_HANDLERS[hotspotId];
  if (handler) { handler(); return; }
  setMessage(FLAVOR[hotspotId] || '아무것도 없다.');
}

/* ===== GAME CLEAR ===== */
function handlePhoneFound() {
  addItem('jisu-phone');
  state.flags.phoneFound = true;
  state.completed = true;
  saveState();
  renderInventory();
  updateLockState();
  setMessage('부우웅—');
  if (navigator.vibrate) navigator.vibrate([120, 80, 160]);
  playBuzzSound();
  setTimeout(() => {
    setMessage('[ 지수의 핸드폰을 발견했다 ]');
    setTimeout(() => {
      playSuccessBeep();
      el.stamp.classList.add('show');
      setTimeout(() => {
        el.fadeOverlay.classList.add('show');
        setTimeout(() => { location.href = '/dev/game/?scene=week1-scene-002-3'; }, 950);
      }, 1000);
    }, 700);
  }, 700);
}

/* ===== Photo pan/zoom stage (ported from minigame-eastwood's map canvas —
   same pinch/pan/wheel handling, just over a room photo with several
   named rect hotspots instead of one map with one named station). ===== */
let scale = 1, baseScale = 1, tx = 0, ty = 0;
let CANVAS_W = 1, CANVAS_H = 1;
let currentHotspots = {}; // hotspotId -> {x, y, width, height} — normalized top-left rect, only populated in 'ready' mode
let showHotspotsDebug = false;
const pointers = new Map();
let panStart = null;
let pinchStartDist = 0, pinchStartScale = 1;
let didPan = false;
let pressedPoint = null;

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
function clampScale(s) { return Math.min(Math.max(s, baseScale * 0.7), baseScale * 3); }
function applyCanvasTransform() { el.photoCanvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }

function fitToStage() {
  const rect = el.photoStage.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  baseScale = Math.min(rect.width / CANVAS_W, rect.height / CANVAS_H) * 0.98;
  scale = baseScale;
  tx = (rect.width - CANVAS_W * scale) / 2;
  ty = (rect.height - CANVAS_H * scale) / 2;
  applyCanvasTransform();
}
window.addEventListener('resize', () => { if (!el.photoStage.classList.contains('hidden')) fitToStage(); });

function screenToCanvas(clientX, clientY) {
  const rect = el.photoStage.getBoundingClientRect();
  return { x: (clientX - rect.left - tx) / scale, y: (clientY - rect.top - ty) / scale };
}

function buildPhotoCanvas(url) {
  el.photoCanvas.innerHTML = '';
  const img = document.createElement('img');
  img.src = url;
  img.alt = '';
  img.draggable = false;
  Object.assign(img.style, { width: CANVAS_W + 'px', height: CANVAS_H + 'px' });
  el.photoCanvas.appendChild(img);
  renderDebugHotspotOverlay();
}

// Small hotspots get their *hit test* padded out to a comfortable touch
// target — the visible/invisible size on screen never changes, only what
// counts as "close enough" to a tap.
function paddedHotspotRect(h) {
  const x = h.x * CANVAS_W, y = h.y * CANVAS_H, w = h.width * CANVAS_W, ht = h.height * CANVAS_H;
  const minSizeCanvas = HOTSPOT_MIN_TOUCH_PX / scale;
  const padW = Math.max(0, minSizeCanvas - w) / 2;
  const padH = Math.max(0, minSizeCanvas - ht) / 2;
  return { x: x - padW, y: y - padH, width: w + padW * 2, height: ht + padH * 2 };
}

function hotspotIdAtPoint(point) {
  for (const id in currentHotspots) {
    const r = paddedHotspotRect(currentHotspots[id]);
    if (point.x >= r.x && point.x <= r.x + r.width && point.y >= r.y && point.y <= r.y + r.height) return id;
  }
  return null;
}

function flashTapRing(point) {
  const r = 36;
  const ring = document.createElement('div');
  ring.className = 'tap-ring';
  Object.assign(ring.style, { left: (point.x - r) + 'px', top: (point.y - r) + 'px', width: r * 2 + 'px', height: r * 2 + 'px' });
  el.photoCanvas.appendChild(ring);
  setTimeout(() => ring.remove(), 450);
}

function onPhotoTap(point) {
  flashTapRing(point);
  const hotspotId = hotspotIdAtPoint(point);
  if (hotspotId) onHotspotTap(hotspotId);
}

// DEV-only visualization of every hotspot's real (unpadded) rect + id +
// coordinates on the current area, toggled from the DEV sheet — never
// shown in normal play (see #6 / #25 of the rework brief).
function renderDebugHotspotOverlay() {
  el.photoCanvas.querySelectorAll('.debug-hotspot').forEach(n => n.remove());
  if (!showHotspotsDebug) return;
  Object.keys(currentHotspots).forEach(id => {
    const h = currentHotspots[id];
    const box = document.createElement('div');
    box.className = 'debug-hotspot';
    Object.assign(box.style, {
      left: (h.x * CANVAS_W) + 'px', top: (h.y * CANVAS_H) + 'px',
      width: (h.width * CANVAS_W) + 'px', height: (h.height * CANVAS_H) + 'px',
    });
    const label = document.createElement('div');
    label.className = 'debug-hotspot-label';
    label.textContent = `${id}\nx=${h.x.toFixed(2)} y=${h.y.toFixed(2)}`;
    box.appendChild(label);
    el.photoCanvas.appendChild(box);
  });
}

el.photoStage.addEventListener('pointerdown', (e) => {
  if (state.completed || dialogueActive) return;
  el.photoStage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  didPan = false;
  if (pointers.size === 1) {
    panStart = { x: e.clientX, y: e.clientY, tx, ty };
    pressedPoint = screenToCanvas(e.clientX, e.clientY);
  } else if (pointers.size === 2) {
    pressedPoint = null;
    const pts = [...pointers.values()];
    pinchStartDist = dist(pts[0], pts[1]);
    pinchStartScale = scale;
  }
});
el.photoStage.addEventListener('pointermove', (e) => {
  if (state.completed || dialogueActive || !pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1 && panStart) {
    const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) didPan = true;
    tx = panStart.tx + dx;
    ty = panStart.ty + dy;
    applyCanvasTransform();
  } else if (pointers.size === 2) {
    const pts = [...pointers.values()];
    const d = dist(pts[0], pts[1]);
    const newScale = clampScale(pinchStartScale * (d / pinchStartDist));
    const rect = el.photoStage.getBoundingClientRect();
    const midNow = mid(pts[0], pts[1]);
    const stageX = midNow.x - rect.left, stageY = midNow.y - rect.top;
    const ratio = newScale / scale;
    tx = stageX - (stageX - tx) * ratio;
    ty = stageY - (stageY - ty) * ratio;
    scale = newScale;
    didPan = true;
    applyCanvasTransform();
  }
});
['pointerup', 'pointercancel'].forEach(evt => el.photoStage.addEventListener(evt, (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStartDist = 0;
  if (pointers.size === 0) {
    panStart = null;
    if (evt === 'pointerup' && !didPan && !state.completed && !dialogueActive && pressedPoint) onPhotoTap(pressedPoint);
    pressedPoint = null;
  }
}));
el.photoStage.addEventListener('wheel', (e) => {
  if (state.completed) return;
  e.preventDefault();
  const rect = el.photoStage.getBoundingClientRect();
  const stageX = e.clientX - rect.left, stageY = e.clientY - rect.top;
  const newScale = clampScale(scale * (e.deltaY < 0 ? 1.1 : 0.9));
  const ratio = newScale / scale;
  tx = stageX - (stageX - tx) * ratio;
  ty = stageY - (stageY - ty) * ratio;
  scale = newScale;
  applyCanvasTransform();
}, { passive: false });

/* ===== Area loading + rendering ===== */
let currentMode = 'missing'; // 'missing' | 'ready' — no text-menu fallback anymore

async function loadArea(area) {
  const sceneId = roomSearchAreaSceneId(area.id);
  const assetId = DevGameState.getBackgroundId(sceneId);
  const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
  const hotspots = DevGameState.getRoomHotspots(sceneId);
  const hasPhoto = !!(asset && asset.dataUrl);
  const hotspotCount = Object.keys(hotspots).length;
  el.missingLink.href = `/dev/upload/?scene=${encodeURIComponent(sceneId)}&minigame=week1-scene-002-2`;
  // Tell "no photo uploaded/active yet" and "photo's fine but no hotspot is
  // marked yet" apart — both looked identical before, which made a missed
  // "사용" click after uploading indistinguishable from the upload never
  // having landed at all.
  if (!hasPhoto) {
    el.missingTitle.textContent = '이 영역엔 아직 사진이 없다';
    el.missingSub.textContent = '사진을 업로드하고 "사용"으로 선택해야 탐색할 수 있습니다.';
  } else if (!hotspotCount) {
    el.missingTitle.textContent = '사진은 있는데 정답 영역이 없다';
    el.missingSub.textContent = '이 사진 위에서 최소 1개 이상 hotspot을 지정해야 탐색할 수 있습니다.';
  }
  const ready = hasPhoto && !!hotspotCount;
  currentMode = ready ? 'ready' : 'missing';
  currentHotspots = ready ? hotspots : {};
  // Un-hide (or hide) .photo-stage *before* fitToStage() runs below — it
  // measures getBoundingClientRect(), which is always 0x0 while the stage
  // still has display:none from whatever the previous area's mode was.
  renderRoomView(area);
  if (ready) {
    CANVAS_W = asset.width;
    CANVAS_H = asset.height;
    await AssetDB.preloadImage(asset.dataUrl);
    buildPhotoCanvas(asset.dataUrl);
    fitToStage();
  }
}

function renderRoomView(area) {
  el.areaHeading.textContent = area.label;
  el.photoStage.classList.toggle('hidden', currentMode !== 'ready');
  el.missingNotice.classList.toggle('show', currentMode !== 'ready');
  el.resultStrip.textContent = state.lastMessage;
}

/* ===== Inventory list ===== */
function selectItem(itemId) {
  if (state.completed) return;
  const def = ITEM_DEFS[itemId];
  if (!def || !def.selectable) return;
  state.selectedItemId = (state.selectedItemId === itemId) ? null : itemId;
  saveState();
  renderInventory();
}

function renderInventory() {
  el.invList.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'inv-list-label';
  label.textContent = '인벤토리';
  el.invList.appendChild(label);
  if (!state.inventoryItemIds.length) {
    const empty = document.createElement('div');
    empty.className = 'inv-empty';
    empty.textContent = '비어 있다';
    el.invList.appendChild(empty);
    return;
  }
  state.inventoryItemIds.forEach(itemId => {
    const def = ITEM_DEFS[itemId];
    if (!def) return;
    const row = document.createElement('div');
    row.className = 'inv-row ' + (def.selectable ? '' : 'fixed');
    if (state.selectedItemId === itemId) row.classList.add('selected');
    row.innerHTML = `<span class="inv-row-icon">${def.icon}</span><span class="inv-row-name">${def.name}</span>` +
      (state.selectedItemId === itemId ? '<span class="inv-row-tag">선택됨</span>' : '');
    if (def.selectable) row.addEventListener('click', () => selectItem(itemId));
    el.invList.appendChild(row);
  });
}

/* ===== Tabs + lock state ===== */
function renderTabs() {
  el.tabBar.innerHTML = '';
  roomSearchAreas.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (a.id === state.currentAreaId ? ' active' : '');
    btn.textContent = a.label;
    btn.addEventListener('click', () => {
      if (state.completed) return;
      state.currentAreaId = a.id;
      saveState();
      renderTabs();
      loadArea(a);
    });
    el.tabBar.appendChild(btn);
  });
}

function updateLockState() {
  el.roomView.classList.toggle('locked', state.completed);
  el.invList.classList.toggle('hidden', state.completed);
  el.tabBar.classList.toggle('hidden', state.completed);
}

/* ===== Dev debug sheet ===== */
el.devBtn.addEventListener('click', () => el.sheetOverlay.classList.remove('hidden'));
el.sheetCloseBtn.addEventListener('click', () => el.sheetOverlay.classList.add('hidden'));
el.sheetOverlay.addEventListener('click', (e) => { if (e.target === el.sheetOverlay) el.sheetOverlay.classList.add('hidden'); });

document.getElementById('btnGiveFlashlight').addEventListener('click', () => { addItem('flashlight'); renderInventory(); });
document.getElementById('btnGiveHook').addEventListener('click', () => { addItem('hook'); renderInventory(); });
document.getElementById('btnGiveKey').addEventListener('click', () => {
  addItem('unknown-key');
  state.flags.keyFound = true;
  saveState();
  renderInventory();
  scheduleForcedPhoneUnlock(600);
});
document.getElementById('btnUnlockPhone').addEventListener('click', () => { state.flags.phoneUnlocked = true; saveState(); });
el.btnToggleHotspots.addEventListener('click', () => {
  showHotspotsDebug = !showHotspotsDebug;
  el.btnToggleHotspots.textContent = 'SHOW HOTSPOTS: ' + (showHotspotsDebug ? 'ON' : 'OFF');
  el.btnToggleHotspots.classList.toggle('toggle-on', showHotspotsDebug);
  renderDebugHotspotOverlay();
});
document.getElementById('btnResetMinigame').addEventListener('click', () => {
  state = defaultState();
  saveState();
  location.reload();
});
document.getElementById('btnClearState').addEventListener('click', () => {
  localStorage.removeItem(STATE_KEY);
  location.reload();
});

/* ===== Boot ===== */
renderTabs();
renderInventory();
updateLockState();
loadArea(roomSearchAreas.find(a => a.id === state.currentAreaId) || roomSearchAreas[0]);
// A refresh that landed between "key found" and "phone unlocked" must not
// soft-lock the phone forever — re-arm the forced event on load.
if (state.flags.keyFound && !state.flags.phoneUnlocked && !state.completed) {
  scheduleForcedPhoneUnlock(800);
}
</script>
