<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · 옷장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}
.frame{width:100%;max-width:430px;min-height:100dvh;display:flex;flex-direction:column}

.shop-header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px;background:rgba(8,10,12,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--divider)}
.back-btn{font-family:var(--mono);font-size:12px;color:var(--text-primary);background:none;border:none;cursor:pointer;padding:6px 0}
.header-title{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--text-secondary);text-transform:uppercase}
.header-spacer{width:60px}

.preview-panel{position:relative;height:280px;background:linear-gradient(160deg,#171c22 0%,#0d1114 60%,#080a0c 100%);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-bottom:1px solid var(--divider)}
.preview-img{max-height:100%;max-width:64%;object-fit:contain}
.preview-placeholder{padding-bottom:28px;color:var(--text-muted);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-align:center}
.preview-name{position:absolute;bottom:16px;left:16px;font-size:16px;font-weight:800}

.grid{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.outfit-card{background:var(--surface-1);border:1px solid var(--divider);border-radius:16px;padding:14px;text-align:left;cursor:pointer;color:var(--text-primary);font-family:inherit}
.outfit-card.active{border-color:rgba(214,168,75,.6);background:rgba(214,168,75,.08)}
.outfit-thumb{width:100%;aspect-ratio:1;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--text-muted);margin-bottom:10px;overflow:hidden}
.outfit-thumb img{width:100%;height:100%;object-fit:cover}
.outfit-name{font-size:13px;font-weight:700}
.outfit-tag{font-family:var(--mono);font-size:10px;color:var(--amber);margin-top:4px}

.empty-note{grid-column:1/-1;text-align:center;color:var(--text-muted);font-size:13px;padding:40px 0}
.go-shop-btn{grid-column:1/-1;background:var(--amber);color:#191206;border:none;border-radius:12px;padding:14px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px}
</style>
</head>
<body>
<div class="frame">
  <div class="shop-header">
    <button class="back-btn" id="backBtn">← 돌아가기</button>
    <div class="header-title">옷장</div>
    <div class="header-spacer"></div>
  </div>

  <div class="preview-panel">
    <img class="preview-img" id="previewImg" style="display:none" alt="">
    <div class="preview-placeholder" id="previewPlaceholder">이미지 없음<br>(업로드 전)</div>
    <div class="preview-name" id="previewName"></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script src="/realPlayMode.js"></script>
<script>RealPlayMode.hideDevChrome();</script>
<script src="/dev/assetDb.js"></script>
<script src="/dev/dialogueData.js"></script>
<script src="/dev/caseFileData.js"></script>
<script src="/dev/caseFileState.js"></script>
<script src="/dev/data/shopItems.js"></script>
<script src="/dev/state/economyState.js"></script>
<script src="/dev/state/wardrobeState.js"></script>
<script src="/dev/state/shopState.js"></script>
<script>
const el = {
  backBtn: document.getElementById('backBtn'),
  previewImg: document.getElementById('previewImg'),
  previewPlaceholder: document.getElementById('previewPlaceholder'),
  previewName: document.getElementById('previewName'),
  grid: document.getElementById('grid'),
};

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function goBack() {
  const url = sessionStorage.getItem('mkShopReturnUrl');
  location.href = url || '/dev/';
}
el.backBtn.addEventListener('click', goBack);

// 'outfit-default' has no shopItems entry (it's not for sale) — displayed
// with a plain label instead of a catalog lookup.
function outfitLabel(id) { return (shopItems[id] && shopItems[id].name) || '기본 코디'; }

async function updatePreview() {
  const id = WardrobeState.getEquippedOutfitId();
  el.previewName.textContent = outfitLabel(id);
  const resolution = WardrobeState.resolveOutfitForScene('jisoo');
  let asset = null;
  const assetId = DevGameState.getCharacterAssetId(resolution.characterId, 'neutral');
  if (assetId) asset = await AssetDB.getAsset(assetId).catch(() => null);
  if (!asset && resolution.characterId !== 'jisoo') {
    const baseId = DevGameState.getCharacterAssetId('jisoo', 'neutral');
    asset = baseId ? await AssetDB.getAsset(baseId).catch(() => null) : null;
  }
  if (asset && asset.dataUrl) {
    el.previewImg.src = asset.dataUrl;
    el.previewImg.style.display = '';
    el.previewPlaceholder.style.display = 'none';
  } else {
    el.previewImg.style.display = 'none';
    el.previewPlaceholder.style.display = '';
  }
}

function renderGrid() {
  const owned = WardrobeState.getOwnedOutfitIds();
  const equippedId = WardrobeState.getEquippedOutfitId();
  el.grid.innerHTML = owned.map(id => {
    const active = id === equippedId;
    return `
      <button class="outfit-card${active ? ' active' : ''}" data-equip="${id}">
        <div class="outfit-thumb">👗</div>
        <div class="outfit-name">${escapeHtml(outfitLabel(id))}</div>
        ${active ? '<div class="outfit-tag">착용 중</div>' : ''}
      </button>
    `;
  }).join('') + (ShopState.isUnlocked() ? '<button class="go-shop-btn" id="goShopBtn">옷가게에서 더 보기</button>' : '');

  el.grid.querySelectorAll('[data-equip]').forEach(btn => btn.addEventListener('click', () => {
    WardrobeState.equipOutfit(btn.dataset.equip);
    renderGrid();
    updatePreview();
  }));
  const goShopBtn = document.getElementById('goShopBtn');
  if (goShopBtn) goShopBtn.addEventListener('click', () => { location.href = '/dev/shop/'; });
}

(function init() {
  renderGrid();
  updatePreview();
})();
</script>
</body>
</html>
