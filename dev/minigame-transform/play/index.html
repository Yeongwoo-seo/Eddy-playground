<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · TRANSFORM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERATION MK DEV">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--green:#3ECF6B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}

.frame{position:relative;width:100%;max-width:430px;min-height:100dvh;min-height:100vh;background:radial-gradient(ellipse 120% 60% at 50% 0%,#241a3a 0%,#150f28 42%,#0a0714 78%,#07050f 100%);display:flex;flex-direction:column;overflow-x:hidden}

.sparkle-field{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sparkle{position:absolute;color:#fff;opacity:0;animation:sparkleTwinkle 3.2s ease-in-out infinite}
@keyframes sparkleTwinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.85;transform:scale(1)}}
.reduced-motion .sparkle{animation:none;opacity:.35}
.sparkle-burst{position:absolute;left:50%;top:50%;pointer-events:none;z-index:9;font-size:16px;animation:sparkleBurst 900ms ease-out forwards}
@keyframes sparkleBurst{0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(1.1)}}

.topbar{position:relative;z-index:6;padding:calc(14px + env(safe-area-inset-top,0)) 16px 10px;display:flex;justify-content:space-between;align-items:center}
.topbar-right{display:flex;gap:8px}
.vn-btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--divider);border-radius:20px;padding:9px 13px;cursor:pointer;text-decoration:none;display:inline-block}
.vn-btn:active{opacity:.75}

/* ===== Stage ===== */
.stage{position:relative;z-index:1;padding:4px 20px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.mirror-bubble{position:relative;max-width:250px;background:radial-gradient(ellipse at 50% 35%,#2a3550 0%,#161d2e 70%,#0d1220 100%);border:3px solid;border-image:linear-gradient(135deg,#E8D9A8,#B8933F,#F2E4B0,#9c7a33) 1;border-radius:50%/38%;padding:16px 20px;font-size:12px;line-height:1.5;color:#DCE4F0;text-align:center;box-shadow:0 0 0 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.5),inset 0 0 24px rgba(120,150,220,.15)}
.mirror-bubble::before{content:'✦';position:absolute;top:-4px;left:10%;font-size:11px;color:#F2E4B0}
.mirror-bubble::after{content:'✦';position:absolute;bottom:-2px;right:10%;font-size:11px;color:#F2E4B0}
.cauldron-area{position:relative;z-index:1;width:100%;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}

.portrait-wrap{position:relative;z-index:2;margin-bottom:-6px;display:flex;flex-direction:column;align-items:center;transition:transform .3s cubic-bezier(.2,.8,.2,1),filter .3s ease}
.portrait-wrap.age-baby{transform:scale(.6)}
.portrait-wrap.age-adult{transform:scale(1.1)}
.portrait-wrap.age-elder{transform:scale(1);filter:grayscale(.4) brightness(.9)}

.char-head{position:relative;z-index:3;width:64px;height:64px;border-radius:50%;background:#2a2f36;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.2);box-shadow:0 4px 10px rgba(0,0,0,.4);transition:background-color .3s ease}
.char-face{font-size:32px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.char-ears{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:20px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.char-decor{position:absolute;top:0;right:-11px;font-size:17px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.char-eye{position:absolute;top:46%;width:7px;height:7px;border-radius:50%;background:var(--eye-color,#555);box-shadow:0 0 4px rgba(255,255,255,.45)}
.char-eye-l{left:26%}
.char-eye-r{right:26%}

.char-collar{position:relative;z-index:2;margin-top:-8px;width:22px;height:22px;border-radius:50%;background:var(--surface-1);border:1.5px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}

.char-body{position:relative;z-index:1;width:104px;height:92px;margin-top:-9px;background:#2a2f36;border-radius:46% 46% 50% 50% / 40% 40% 56% 56%;box-shadow:0 6px 14px rgba(0,0,0,.4);transition:width .3s,height .3s,border-radius .3s,background-color .3s}
.char-body.body-petite{width:86px;height:74px}
.char-body.body-slender{width:88px;height:122px;border-radius:44% 44% 50% 50% / 34% 34% 56% 56%}
.char-body.body-sturdy{width:132px;height:88px;border-radius:42% 42% 48% 48% / 38% 38% 56% 56%}
.char-body.body-hourglass::after{content:'';position:absolute;left:18%;right:18%;top:42%;height:2px;background:rgba(0,0,0,.18);border-radius:2px}

.cauldron{position:relative;width:184px;height:150px;z-index:1;filter:drop-shadow(0 10px 12px rgba(0,0,0,.5));transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.cauldron-svg{width:100%;height:100%;display:block;overflow:visible}
.cauldron-liquid-group{transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 0 8px var(--liquid-color,#2c3440))}
.cauldron-liquid-group.bubble{animation:cauldronBubble .5s ease-in-out infinite}
@keyframes cauldronBubble{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2.5px) scale(1.03)}}
#cauldronFillRect{fill:var(--liquid-color,#2c3440);transition:y .5s cubic-bezier(.2,.8,.2,1),height .5s cubic-bezier(.2,.8,.2,1)}
#cauldronLiquid{fill:var(--liquid-color,#2c3440);transition:cy .5s cubic-bezier(.2,.8,.2,1),opacity .3s ease;opacity:0}
.cauldron.shake{animation:cauldronShake .12s linear infinite}
@keyframes cauldronShake{0%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-1deg)}75%{transform:translateX(4px) rotate(1deg)}100%{transform:translateX(0)}}
.cauldron.gulp{animation:cauldronGulp .32s ease}
@keyframes cauldronGulp{0%,100%{transform:scale(1,1)}35%{transform:scale(1.05,.94)}}
.cauldron.drop-active{transform:scale(1.05)}
.cauldron.drop-active .cauldron-svg{filter:drop-shadow(0 0 16px rgba(214,168,75,.75))}

.fx-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;transition:opacity .12s ease}
.fx-flash.show{opacity:1}
.fx-smoke{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,rgba(230,230,235,.9) 0%,rgba(230,230,235,0) 70%);opacity:0;pointer-events:none;z-index:4;transition:opacity .3s ease,width .5s ease,height .5s ease}
.fx-smoke.show{opacity:1;width:220px;height:220px}

.target-line{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);text-align:center;letter-spacing:.02em}
.target-line b{color:var(--amber);font-weight:700}

@keyframes hintGlow{0%,100%{box-shadow:0 0 0 rgba(214,168,75,0)}50%{box-shadow:0 0 12px rgba(214,168,75,.55)}}

/* ===== Potion shelf — wooden compartments you drag bottles out of ===== */
.shelf-wall{position:relative;z-index:1;margin:2px 14px 4px;padding:12px 10px 16px;max-height:266px;overflow-y:auto;overflow-x:hidden;border-radius:20px;background:radial-gradient(ellipse at 50% 0%,#2c1d42 0%,#1c1330 60%,#150e26 100%);box-shadow:inset 0 2px 10px rgba(0,0,0,.5),inset 0 -2px 14px rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.35);scrollbar-width:none}
.shelf-wall::-webkit-scrollbar{display:none}

.shelf-plank{position:relative;margin:0 2px 20px;padding:18px 10px 12px;background:linear-gradient(180deg,#8a5a34 0%,#6b4226 55%,#4f2f1a 100%);border-radius:10px;box-shadow:0 5px 0 rgba(0,0,0,.28),0 8px 10px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.16),inset 0 -3px 4px rgba(0,0,0,.35)}
.shelf-plank::before{content:'';position:absolute;inset:0;border-radius:10px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0px,rgba(0,0,0,.08) 1px,transparent 1px,transparent 7px);opacity:.5;pointer-events:none}
.shelf-plank:last-child{margin-bottom:2px}

.shelf-tag{position:relative;z-index:2;display:inline-block;top:-11px;left:-2px;font-family:var(--sans);font-size:12px;font-weight:700;color:#3a2408;background:linear-gradient(135deg,#F2E0A0,#D6A84B 60%,#B8862F);padding:5px 13px;border-radius:20px;box-shadow:0 3px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5);letter-spacing:-.1px;white-space:nowrap}
.shelf-tag.hint-glow{animation:hintGlow 1.1s ease-in-out infinite;border-radius:20px}

.shelf-bottles{position:relative;z-index:1;display:flex;gap:9px;justify-content:center;flex-wrap:wrap;padding-top:6px}

.shelf-bottle{position:relative;width:38px;touch-action:none;cursor:grab}
.shelf-bottle svg{width:100%;display:block;filter:drop-shadow(0 4px 5px rgba(0,0,0,.5))}
.shelf-bottle:active{cursor:grabbing}
.shelf-bottle.dragging{opacity:.28}
.shelf-bottle.selected svg{filter:drop-shadow(0 4px 5px rgba(0,0,0,.5)) drop-shadow(0 0 6px rgba(62,207,107,.75))}
.shelf-bottle.selected::after{content:'✓';position:absolute;top:-6px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--green);color:#08110c;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.4);z-index:2}
.shelf-bottle.hint-glow{animation:hintGlow 1.1s ease-in-out infinite;border-radius:50%}

.drag-ghost{position:fixed;z-index:45;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));will-change:left,top,transform}
.pour-stream{position:fixed;width:5px;height:0;border-radius:3px;background:linear-gradient(180deg,var(--pour-color,#fff),transparent);opacity:0;transition:height .22s ease,opacity .18s ease;pointer-events:none;z-index:40;box-shadow:0 0 6px var(--pour-color,#fff)}
.splash-drop{position:fixed;font-size:10px;color:#cfe8ff;opacity:.9;pointer-events:none;z-index:41;animation:splashPop .45s ease-out forwards}
@keyframes splashPop{0%{transform:translate(0,0) scale(1);opacity:.9}100%{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}

/* ===== Cauldron contents strip — compact readout of the current recipe;
   tap a filled slot to clear that ingredient. ===== */
.contents-strip{position:relative;z-index:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:2px 16px 12px}
.content-slot{width:32px;height:32px;border-radius:50%;background:var(--surface-1);border:1.5px dashed var(--divider);display:flex;align-items:center;justify-content:center;font-size:14px;transition:transform .15s,border-color .15s}
.content-slot.filled{border-style:solid;border-color:rgba(255,255,255,.4);cursor:pointer}
.content-slot.filled:active{transform:scale(.88)}

.powder-btn{position:relative;z-index:1;margin:0 16px calc(16px + env(safe-area-inset-bottom,0));font-family:var(--mono);font-size:14.5px;font-weight:700;letter-spacing:.04em;color:#08110c;background:var(--green);border:none;border-radius:16px;padding:16px;cursor:pointer;text-align:center;transition:opacity .2s,transform .15s}
.powder-btn:active:not(:disabled){transform:scale(.98)}
.powder-btn:disabled{background:var(--surface-2);color:var(--text-muted);cursor:not-allowed}
.powder-btn.pulse:not(:disabled){animation:powderPulse 1.6s ease-in-out infinite}
@keyframes powderPulse{0%,100%{box-shadow:0 0 0 rgba(62,207,107,0)}50%{box-shadow:0 0 16px rgba(62,207,107,.5)}}

/* ===== Sheets (potion picker / magic book) ===== */
.sheet-overlay{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.sheet-overlay.show{display:flex}
.sheet{width:100%;max-width:430px;max-height:78vh;background:var(--surface-2);border:1px solid var(--divider);border-bottom:none;border-radius:24px 24px 0 0;padding:10px 18px calc(16px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;overflow:hidden}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--divider);margin:2px auto 12px}
.sheet-close{margin-top:12px;font-family:var(--mono);font-size:12.5px;color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:12px;cursor:pointer}

.book-sheet{max-height:82vh}
.book-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid var(--divider)}
.book-tab{flex-shrink:0;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.book-tab.active{color:#04181c;background:var(--cyan);border-color:var(--cyan)}
.book-body{overflow-y:auto;flex:1}
.clue-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--divider)}
.clue-icon{font-size:16px;flex-shrink:0;width:22px;text-align:center}
.clue-label{font-size:11.5px;color:var(--text-muted);font-weight:600;margin-bottom:2px}
.clue-text{font-size:13px;line-height:1.5}
.book-flavor{font-size:12.5px;color:var(--text-secondary);line-height:1.6;margin-bottom:12px;background:var(--surface-1);border-radius:12px;padding:10px 12px}
.encyclo-group{margin-bottom:14px}
.encyclo-title{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
.encyclo-item{display:flex;gap:10px;align-items:center;padding:6px 0}
.encyclo-swatch{width:20px;height:26px;flex-shrink:0}
.encyclo-swatch svg{display:block;width:100%;height:100%;overflow:visible}
.encyclo-name{font-size:12.5px;font-weight:600}
.encyclo-desc{font-size:11px;color:var(--text-muted)}
.howto-text{font-size:13px;line-height:1.75;color:var(--text-secondary);white-space:pre-line;margin-bottom:14px}
.replay-btn{font-family:var(--mono);font-size:12px;color:#04181c;background:var(--amber);border:none;border-radius:12px;padding:10px 14px;cursor:pointer}
.collection-empty{font-size:12.5px;color:var(--text-muted);padding:20px 0;text-align:center}
.collection-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.collection-item{background:var(--surface-1);border:1px solid var(--divider);border-radius:12px;padding:10px 4px;text-align:center}
.collection-emoji{font-size:20px}
.collection-count{font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-top:2px}

/* ===== Magic book — parchment/leather theme, deliberately distinct from
   the dev-tool dark shell so it reads as an in-world prop. ===== */
.book-sheet{background:linear-gradient(160deg,#3c2f1f 0%,#2a1f14 100%);border:1px solid #5a4527;box-shadow:0 -10px 32px rgba(0,0,0,.6)}
.book-sheet .sheet-handle{background:rgba(255,255,255,.25)}
.book-sheet .book-tabs{border-bottom-color:rgba(255,255,255,.14)}
.book-sheet .book-tab{background:rgba(0,0,0,.22);color:#D8C7A0;border-color:rgba(255,255,255,.12)}
.book-sheet .book-tab.active{background:linear-gradient(135deg,#EAD9A6,#B8923D);color:#3a2c18;border-color:transparent}
.book-sheet .book-flavor{background:rgba(0,0,0,.24);color:#F0E4C8;border:1px solid rgba(255,255,255,.08)}
.book-sheet .clue-row{border-bottom-color:rgba(255,255,255,.12)}
.book-sheet .clue-label{color:#C9AF7C}
.book-sheet .clue-text{color:#F3E9D2}
.book-sheet .encyclo-title{color:#C9AF7C}
.book-sheet .encyclo-name{color:#F3E9D2}
.book-sheet .encyclo-desc{color:#B8A57D}
.book-sheet .howto-text{color:#EFE3C8}
.book-sheet .collection-empty{color:#B8A57D}
.book-sheet .collection-item{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.12)}
.book-sheet .collection-count{color:#C9AF7C}
.book-sheet .sheet-close{background:rgba(0,0,0,.26);color:#D8C7A0;border-color:rgba(255,255,255,.14)}
.book-sheet .replay-btn{background:linear-gradient(135deg,#EAD9A6,#B8923D);color:#3a2c18}

/* ===== Result / intro overlays ===== */
.overlay{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:32px;background:rgba(5,7,10,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.overlay.show{display:flex}
.result-grade{font-size:26px;font-weight:800}
.result-grade.PERFECT{color:var(--green)}
.result-grade.NEAR_SUCCESS{color:var(--cyan)}
.result-grade.MIXED{color:var(--amber)}
.result-grade.FAIL{color:var(--signal-red)}
.result-grade.SPECIAL{color:#C9A6FF}
.result-grade.FREE{color:var(--cyan)}
.result-mirror{font-size:13.5px;color:var(--text-secondary);max-width:280px;line-height:1.6}
.result-score{font-family:var(--mono);font-size:12px;color:var(--text-muted)}
.result-hint{font-size:12px;color:var(--amber);max-width:260px;line-height:1.5}
.result-actions{display:flex;gap:10px;margin-top:8px}
.result-btn{font-family:var(--mono);font-size:13px;font-weight:700;border:none;border-radius:14px;padding:12px 18px;cursor:pointer}
.result-btn.primary{background:var(--green);color:#08110c}
.result-btn.secondary{background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--divider)}
.intro-title{font-size:20px;font-weight:700}
.intro-text{font-size:13.5px;color:var(--text-secondary);line-height:1.7;max-width:290px;white-space:pre-line}
.reduced-motion .cauldron.shake{animation:none}
.reduced-motion .cauldron-liquid.bubble{animation:none}
.reduced-motion .slot-btn.hint-glow{animation:none}
.reduced-motion .powder-btn.pulse{animation:none}
</style>
</head>
<body>
<div class="frame" id="frame">

  <div class="topbar">
    <a class="vn-btn" href="/dev/">← DEV</a>
    <div class="topbar-right">
      <button class="vn-btn" id="bookBtn" type="button">📖 마법책</button>
      <a class="vn-btn" href="/dev/minigame-transform/">설정</a>
    </div>
  </div>

  <div class="sparkle-field" id="sparkleField"></div>
  <div class="stage">
    <div class="mirror-bubble" id="mirrorBubble" style="display:none"></div>
    <div class="shelf-wall" id="shelfWall"></div>
    <div class="cauldron-area" id="cauldronArea">
      <div class="portrait-wrap" id="portraitWrap" style="display:none">
        <div class="char-head" id="charHead">
          <span class="char-ears" id="charEars"></span>
          <span class="char-face" id="charFace"></span>
          <span class="char-eye char-eye-l" id="eyeLeft"></span>
          <span class="char-eye char-eye-r" id="eyeRight"></span>
          <span class="char-decor" id="charDecor"></span>
        </div>
        <div class="char-collar" id="charCollar"></div>
        <div class="char-body" id="charBody"></div>
      </div>
      <div class="fx-smoke" id="fxSmoke"></div>
      <div class="cauldron" id="cauldron">
        <svg class="cauldron-svg" viewBox="0 0 200 150">
          <defs>
            <radialGradient id="potGrad" cx="35%" cy="20%" r="85%">
              <stop offset="0%" stop-color="#4d5964"/>
              <stop offset="55%" stop-color="#2b333c"/>
              <stop offset="100%" stop-color="#14181c"/>
            </radialGradient>
            <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#636f7b"/>
              <stop offset="100%" stop-color="#262d34"/>
            </linearGradient>
            <clipPath id="cauldronClip">
              <path d="M40,22 C31,74 37,105 100,120 C163,105 169,74 160,22 Z"/>
            </clipPath>
          </defs>
          <ellipse cx="100" cy="140" rx="70" ry="9" fill="#000" opacity=".3"/>
          <path d="M74,138 L64,148" stroke="#20262c" stroke-width="9" stroke-linecap="round"/>
          <path d="M100,140 L100,150" stroke="#20262c" stroke-width="9" stroke-linecap="round"/>

/* ===== Potion bottle art — glossy hand-illustrated-style glass vessels

   the drag ghost and the encyclopedia tab. Each call gets fresh gradient
   ids so many instances can render side by side on the shelf without
   fill="url(#...)" collisions. ===== */
let svgUid = 0;
function lighten(hex, pct) {
  const [r, g, b] = hexToRgb(hex);
  return rgbToHex([r + (255 - r) * pct / 100, g + (255 - g) * pct / 100, b + (255 - b) * pct / 100]);
}
function darken(hex, pct) {
  const [r, g, b] = hexToRgb(hex);
  return rgbToHex([r * (1 - pct / 100), g * (1 - pct / 100), b * (1 - pct / 100)]);
}
function bottleSvg(color, shape) {
  const gg = 'bg' + (svgUid++) + '_';
  const liq = `<radialGradient id="${gg}liq" cx="35%" cy="22%" r="80%">
      <stop offset="0%" stop-color="${lighten(color, 32)}"/>
      <stop offset="55%" stop-color="${color}"/>
      <stop offset="100%" stop-color="${darken(color, 20)}"/>
    </radialGradient>`;
  if (shape === 'orb') {
    return `<svg viewBox="0 0 32 34" overflow="visible"><defs>${liq}</defs>
      <ellipse cx="16" cy="30.5" rx="9" ry="2.2" fill="#000" opacity=".22"/>
      <rect x="13.4" y="1.5" width="5.2" height="5.5" rx="1.4" fill="#8a6a45"/>
      <circle cx="16" cy="19" r="12.5" fill="url(#${gg}liq)" stroke="rgba(255,255,255,.45)" stroke-width="1.2"/>
      <ellipse cx="11.2" cy="13" rx="4" ry="2.8" fill="#fff" opacity=".4"/>
      <circle cx="16" cy="19" r="12.5" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="3"/>
    </svg>`;
  }
  if (shape === 'jar') {
    return `<svg viewBox="0 0 30 32" overflow="visible"><defs>${liq}</defs>
      <ellipse cx="15" cy="29.5" rx="9" ry="2" fill="#000" opacity=".22"/>
      <rect x="7" y="1.5" width="16" height="5.5" rx="2.6" fill="#8a6a45"/>
      <rect x="7" y="5.5" width="16" height="2.5" fill="#6b4f30"/>
      <rect x="5" y="8" width="20" height="20.5" rx="6" fill="url(#${gg}liq)" stroke="rgba(255,255,255,.45)" stroke-width="1.2"/>
      <rect x="7.2" y="10.5" width="3" height="14" rx="1.5" fill="#fff" opacity=".32"/>
    </svg>`;
  }
  return `<svg viewBox="0 0 32 40" overflow="visible"><defs>${liq}
      <linearGradient id="${gg}glass" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".3"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <ellipse cx="16" cy="37.5" rx="10.5" ry="2.2" fill="#000" opacity=".22"/>
    <rect x="13" y="1" width="6" height="7" rx="1.5" fill="#8a6a45"/>

    <path d="M4.7,24 C4.3,25.2 4,26.1 4,27 C4,34 9.5,38.5 16,38.5 C22.5,38.5 28,34 28,27 C28,26.1 27.7,25.2 27.3,24 Z" fill="url(#${gg}liq)"/>
    <path d="M10,12 C10,12 4,20 4,27 C4,34 9.5,38.5 16,38.5 C22.5,38.5 28,34 28,27 C28,20 22,12 22,12 Z" fill="url(#${gg}glass)"/>
    <rect x="8" y="17" width="2.6" height="15" rx="1.3" fill="#fff" opacity=".28"/>
  </svg>`;
}

/* ===== Potion shelf — draggable source bottles ===== */
function renderShelf() {
  el.shelfWall.innerHTML = ATTRIBUTES.map(a => {
    const tagGlow = phase === 'selecting' && (hintRevealTag === a.key || hintRevealAttr === a.key);
    return `
      <div class="shelf-plank">
        <div class="shelf-tag${tagGlow ? ' hint-glow' : ''}">${a.icon} ${a.label}</div>
        <div class="shelf-bottles" id="shelfRow-${a.key}"></div>
      </div>
    `;
  }).join('');
  ATTRIBUTES.forEach(a => {
    const row = document.getElementById(`shelfRow-${a.key}`);
    row.innerHTML = POTIONS[a.key].map(p => {
      const isSelected = selections[a.key] === p.id;
      const isHint = phase === 'selecting' && MODE === 'mission' && hintRevealAttr === a.key && TARGET.valid[a.key].includes(p.id);
      return `<div class="shelf-bottle${isSelected ? ' selected' : ''}${isHint ? ' hint-glow' : ''}" data-attr="${a.key}" data-id="${p.id}" title="${p.name}">${bottleSvg(p.color, a.shape)}</div>`;
    }).join('');
    row.querySelectorAll('.shelf-bottle').forEach(node => {
      node.addEventListener('pointerdown', (e) => startDrag(e, node, node.dataset.attr, node.dataset.id));
    });
  });
}

/* ===== Cauldron contents strip — compact recipe readout, tap-to-clear ===== */
function renderContentsStrip() {
  el.contentsStrip.innerHTML = ATTRIBUTES.map(a => {
    const picked = selections[a.key] ? potionById(a.key, selections[a.key]) : null;
    const style = picked ? `background:${picked.color};border-color:rgba(255,255,255,.5)` : '';
    return `<div class="content-slot${picked ? ' filled' : ''}" data-attr="${a.key}" style="${style}" title="${a.label}">${picked ? '' : a.icon}</div>`;
  }).join('');
  el.contentsStrip.querySelectorAll('.content-slot.filled').forEach(node => {
    node.addEventListener('click', () => clearSelection(node.dataset.attr));
  });
}

function clearSelection(attrKey) {
  if (phase !== 'selecting') return;
  selections[attrKey] = null;
  vibrate(6);
  renderShelf();
  updateCauldronLiquid();
  renderContentsStrip();
  updatePowderButton();
}

function isComplete() { return ATTRIBUTES.every(a => selections[a.key] !== null); }

function updatePowderButton() {
  const ready = isComplete() && phase === 'selecting';
  el.powderBtn.disabled = !ready;
  el.powderBtn.classList.toggle('pulse', ready);
  el.powderBtn.textContent = ready ? '✨ 마법가루 뿌리기' : (isComplete() ? '변신 중…' : '마법가루 뿌리기 (재료를 모두 채워주세요)');
}

/* ===== Cauldron liquid mix — reflects the whole current combo, not just
   the last pick (request doc §11). ===== */
function hexToRgb(hex) {
  const m = hex.replace('#', '');
  return [parseInt(m.slice(0, 2), 16), parseInt(m.slice(2, 4), 16), parseInt(m.slice(4, 6), 16)];
}
function rgbToHex([r, g, b]) { return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join(''); }

function setLiquidLevel(level) {
  const topY = 120 - level * 94;
  el.cauldronFillRect.setAttribute('y', topY.toFixed(1));
  el.cauldronFillRect.setAttribute('height', (120 - topY).toFixed(1));
  el.cauldronLiquid.setAttribute('cy', topY.toFixed(1));
  el.cauldronLiquid.style.opacity = level > 0 ? 1 : 0;
}

function updateCauldronLiquid() {
  const picked = ATTRIBUTES.map(a => selections[a.key] && potionById(a.key, selections[a.key])).filter(Boolean);
  if (!picked.length) {
    el.cauldron.style.setProperty('--liquid-color', '#2c3440');
    el.cauldronLiquidGroup.classList.remove('bubble');
    setLiquidLevel(0);
    return;
  }
  const sum = picked.reduce((acc, p) => {
    const [r, g, b] = hexToRgb(p.color);
    return [acc[0] + r, acc[1] + g, acc[2] + b];
  }, [0, 0, 0]);
  const avg = sum.map(v => v / picked.length);
  el.cauldron.style.setProperty('--liquid-color', rgbToHex(avg));
  el.cauldronLiquidGroup.classList.toggle('bubble', !REDUCED_MOTION);
  setLiquidLevel(picked.length / 8);
}

/* ===== Drag-to-pour — pick a bottle up off the shelf, drop it on the
   cauldron to pour it in. Pointer Events cover touch + mouse; the shelf
   itself scrolls (touch-action:pan-y) while individual bottles opt out
   (touch-action:none) so a drag never fights the shelf's own scroll. ===== */
function isOverCauldron(x, y) {
  const r = el.cauldron.getBoundingClientRect();
  const pad = 26;
  return x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad;
}

function startDrag(e, bottleEl, attrKey, potionId) {
  if (phase !== 'selecting') return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  const rect = bottleEl.getBoundingClientRect();
  const ghost = bottleEl.cloneNode(true);
  ghost.className = 'drag-ghost';
  ghost.style.width = rect.width + 'px';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  document.body.appendChild(ghost);
  bottleEl.classList.add('dragging');
  const offsetX = e.clientX - rect.left;
  const offsetY = e.clientY - rect.top;

  function onMove(ev) {
    ghost.style.left = (ev.clientX - offsetX) + 'px';
    ghost.style.top = (ev.clientY - offsetY) + 'px';
    el.cauldron.classList.toggle('drop-active', isOverCauldron(ev.clientX, ev.clientY));
  }
  function onUp(ev) {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    const hit = isOverCauldron(ev.clientX, ev.clientY);
    el.cauldron.classList.remove('drop-active');
    bottleEl.classList.remove('dragging');
    if (hit) pourIntoCauldron(ghost, attrKey, potionId);
    else cancelDrag(ghost, rect);
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

function cancelDrag(ghost, originRect) {
  ghost.style.transition = 'left .22s cubic-bezier(.2,.8,.2,1), top .22s cubic-bezier(.2,.8,.2,1), opacity .2s ease .1s';
  ghost.style.left = originRect.left + 'px';
  ghost.style.top = originRect.top + 'px';
  ghost.style.opacity = '0';
  setTimeout(() => ghost.remove(), 260);
}

function spawnPourStream(x, y, color) {
  const s = document.createElement('div');
  s.className = 'pour-stream';
  s.style.left = x + 'px';
  s.style.top = y + 'px';
  s.style.setProperty('--pour-color', color);
  document.body.appendChild(s);
  requestAnimationFrame(() => { s.style.height = '46px'; s.style.opacity = '1'; });
  setTimeout(() => { s.style.opacity = '0'; }, 260);
  setTimeout(() => s.remove(), 460);
}

function bounceCauldron() {
  el.cauldron.classList.remove('gulp');
  void el.cauldron.offsetWidth;
  el.cauldron.classList.add('gulp');
}

function spawnSplash(x, y) {
  if (REDUCED_MOTION) return;
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('span');
    s.className = 'splash-drop';
    s.textContent = '•';
    const angle = Math.PI + Math.random() * Math.PI;
    const dist = 14 + Math.random() * 18;
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
    s.style.setProperty('--dy', (Math.sin(angle) * dist - 6) + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 500);
  }
}

async function pourIntoCauldron(ghost, attrKey, potionId) {
  vibrate(10);
  const t = TIMING[FX];
  const cr = el.cauldron.getBoundingClientRect();
  const gw = ghost.offsetWidth, gh = ghost.offsetHeight;
  const targetLeft = cr.left + cr.width / 2 - gw / 2;
  const targetTop = cr.top - gh * 0.3;
  ghost.style.transition = `left ${t.pourMove}ms cubic-bezier(.2,.8,.2,1), top ${t.pourMove}ms cubic-bezier(.2,.8,.2,1)`;
  ghost.style.left = targetLeft + 'px';
  ghost.style.top = targetTop + 'px';
  await wait(t.pourMove);

  ghost.style.transformOrigin = '70% 85%';
  ghost.style.transition = `transform ${t.pourTilt}ms cubic-bezier(.3,.7,.3,1)`;
  ghost.style.transform = 'rotate(120deg)';
  const color = potionById(attrKey, potionId).color;
  spawnPourStream(targetLeft + gw * 0.78, targetTop + gh * 0.65, color);
  await wait(t.pourTilt);

  selections[attrKey] = potionId;
  renderShelf();
  updateCauldronLiquid();
  renderContentsStrip();
  updatePowderButton();
  bounceCauldron();
  spawnSplash(cr.left + cr.width / 2, cr.top + 18);
  vibrate(14);

  await wait(t.pourHold);
  ghost.style.transition = `opacity ${t.pourFade}ms ease, transform ${t.pourFade}ms ease`;
  ghost.style.opacity = '0';
  ghost.style.transform = 'rotate(120deg) scale(.6)';
  await wait(t.pourFade);
  ghost.remove();
}

/* ===== Collection (도감) ===== */
const COLLECTION_KEY = 'mkTransformCollection';
const GRADE_EMOJI = { PERFECT: '👑', NEAR_SUCCESS: '💫', MIXED: '🌀', FAIL: '🫥', SPECIAL: '🌈', FREE: '🧪' };
const GRADE_RANK = { FAIL: 0, MIXED: 1, NEAR_SUCCESS: 2, SPECIAL: 2, PERFECT: 3, FREE: 1 };
function loadCollection() { try { return JSON.parse(localStorage.getItem(COLLECTION_KEY)) || {}; } catch (e) { return {}; } }
function saveCollection(data) { try { localStorage.setItem(COLLECTION_KEY, JSON.stringify(data)); } catch (e) {} }
function recordDiscovery(resultKey, grade) {
  const collection = loadCollection();
  const entry = collection[resultKey] || { count: 0, bestGrade: grade };
  entry.count += 1;
  if (GRADE_RANK[grade] > GRADE_RANK[entry.bestGrade]) entry.bestGrade = grade;
  collection[resultKey] = entry;
  saveCollection(collection);
}

/* ===== Evaluation (request doc §20) ===== */
function evaluateRecipe() {
  const details = ATTRIBUTES.map(a => {
    const selected = selections[a.key];
    const valid = TARGET.valid[a.key];
    const correct = selected !== null && valid.includes(selected);
    return { attribute: a.key, selected, correct, weight: ATTRIBUTE_WEIGHTS[a.key] };
  });
  const rawCorrectCount = details.filter(d => d.correct).length;
  const totalWeight = details.reduce((s, d) => s + d.weight, 0);
  const correctWeight = details.filter(d => d.correct).reduce((s, d) => s + d.weight, 0);
  const weightedScore = correctWeight / totalWeight;
  const characterCorrect = details.find(d => d.attribute === 'character').correct;

  let grade;
  if (rawCorrectCount === 8) grade = 'PERFECT';
  else if (characterCorrect && weightedScore >= 0.8) grade = 'NEAR_SUCCESS';
  else if (weightedScore >= 0.5) grade = 'MIXED';
  else grade = 'FAIL';

  return { grade, rawCorrectCount, weightedScore, details };
}

/* ===== Easter eggs (request doc §14.2) — checked before the normal grade
   the way composeResult()'s special-combination lookup runs first. ===== */
function hexToHsl(hex) {
  let [r, g, b] = hexToRgb(hex).map(v => v / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0, l = (max + min) / 2;
  const d = max - min;
  if (d !== 0) {
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return { h, s, l };
}
function findSpecialCombination() {
  const picked = ATTRIBUTES.map(a => potionById(a.key, selections[a.key]));
  const hues = picked.map(p => hexToHsl(p.color).h);
  const hueSpread = Math.max(...hues) - Math.min(...hues);
  if (hueSpread <= 28) return { name: '단색 마법 생명체', mirror: '색은 완벽히 통일했는데… 이게 누구였더라?' };

  const allLast = ATTRIBUTES.every(a => {
    const list = POTIONS[a.key];
    return selections[a.key] === list[list.length - 1].id;
  });
  if (allLast) return { name: '혼돈의 대연금술사', mirror: '새로운 생명체를 만들어 낸 건 인정하지.' };

  return null;
}

/* ===== Portrait composition — every attribute visibly changes the result,
   right or wrong (request doc §7.1, §28). Only rendered at RESULT time so
   selecting never previews the final form (request doc §3.1); the cauldron
   liquid color is the only feedback during SELECTING. ===== */
function composePortrait() {
  const eyes = potionById('eyes', selections.eyes);
  const skin = potionById('skin', selections.skin);
  const age = potionById('age', selections.age);
  const gender = potionById('gender', selections.gender);

  el.portraitWrap.className = 'portrait-wrap ' + age.scaleClass;
  el.charHead.style.backgroundColor = skin.color;
  el.charBody.className = 'char-body ' + body.shapeClass;
  el.charBody.style.backgroundColor = skin.color;

  el.charFace.textContent = character.emoji;

  el.charCollar.textContent = gender.badge;

  el.eyeRight.style.setProperty('--eye-color', eyes.color);

  el.portraitWrap.style.display = 'flex';
}

/* ===== Mirror reactions (request doc §8) ===== */
function mirrorLine(evaluation, special) {
  if (MODE === 'free') return '새로운 모습이 완성되었어요.';
  if (special) return special.mirror;
  switch (evaluation.grade) {
    case 'PERFECT': return `완벽해! 정말 ${TARGET.name}, 그 자체잖아!`;
    case 'NEAR_SUCCESS': return '거의 다 왔어… 어딘가 조금 다른 것 같은데?';
    case 'MIXED': return `${TARGET.name}를 닮긴 했지만, 어딘가 많이 섞였군.`;
    case 'FAIL':
    default:
      return evaluation.details.find(d => d.attribute === 'character').correct
        ? '…이것도 나름 개성 있네.'
        : '잠깐, 애초에 다른 존재잖아!';
  }
}

let hintRevealAttr = null;
let hintRevealTag = null;

function hintLine(evaluation) {
  hintRevealTag = null;
  if (evaluation.grade === 'PERFECT') { hintRevealAttr = null; return null; }
  const wrong = evaluation.details.filter(d => !d.correct);
  if (!wrong.length) { hintRevealAttr = null; return null; }
  if (failCount <= 1) { hintRevealAttr = null; return '얼굴과 몸매 쪽을 다시 살펴봐.'; }
  if (failCount === 2) {
    const target = wrong.find(d => d.attribute === 'face') || wrong[0];
    hintRevealAttr = null;
    hintRevealTag = target.attribute;
    return `힌트: ${ATTRIBUTES.find(a => a.key === target.attribute).label} 선반을 다시 살펴봐.`;
  }
  hintRevealAttr = wrong[0].attribute;
  return `힌트: ${ATTRIBUTES.find(a => a.key === hintRevealAttr).label} 선반에서 반짝이는 물약을 솥에 부어봐.`;
}

/* ===== Transformation sequence (request doc §9) ===== */
const TIMING = {
  full: { shake: 650, smoke: 550, flash: 140, reveal: 450, pourMove: 180, pourTilt: 220, pourHold: 180, pourFade: 200 },
  fast: { shake: 180, smoke: 150, flash: 90, reveal: 220, pourMove: 90, pourTilt: 110, pourHold: 80, pourFade: 120 },
};
async function runTransformSequence() {
  const t = TIMING[FX];
  el.mirrorBubble.style.display = 'none';
  el.cauldron.classList.toggle('shake', !REDUCED_MOTION);
  vibrate(15);
  await wait(t.shake);

  el.cauldron.classList.remove('shake');
  el.fxSmoke.classList.add('show');
  await wait(t.smoke);

  if (!REDUCED_MOTION) {
    el.fxFlash.classList.add('show');
    await wait(t.flash);
    el.fxFlash.classList.remove('show');
  }

  composePortrait();
  el.fxSmoke.classList.remove('show');
  await wait(t.reveal);
}

/* ===== Result flow ===== */
function showResult() {
  const special = MODE === 'mission' ? findSpecialCombination() : null;
  const evaluation = MODE === 'mission' ? evaluateRecipe() : null;
  const grade = MODE === 'free' ? 'FREE' : (special ? 'SPECIAL' : evaluation.grade);

  if (MODE === 'mission' && grade !== 'PERFECT') failCount++;
  else if (grade === 'PERFECT') failCount = 0;

  const resultKey = ATTRIBUTES.map(a => selections[a.key]).join('__');
  recordDiscovery(resultKey, grade);

  el.resultGrade.className = 'result-grade ' + grade;
  el.resultGrade.textContent = {
    PERFECT: '완전 성공!', NEAR_SUCCESS: '거의 성공', MIXED: '혼합 변신', FAIL: '대실패',
    SPECIAL: special ? special.name : '특수 결과', FREE: '변신 완료',
  }[grade];
  el.resultMirror.textContent = mirrorLine(evaluation, special);

  if (MODE === 'mission') {
    el.resultScore.textContent = `일치한 속성: ${evaluation.rawCorrectCount} / 8`;
    const hint = hintLine(evaluation);
    el.resultHint.style.display = hint ? 'block' : 'none';
    el.resultHint.textContent = hint || '';
  } else {
    el.resultScore.textContent = '';
    el.resultHint.style.display = 'none';
  }

  el.mirrorBubble.textContent = el.resultMirror.textContent;
  el.mirrorBubble.style.display = 'block';

  if (grade === 'PERFECT' || grade === 'SPECIAL') spawnSparkleBurst();

  phase = 'result';
  el.resultOverlay.classList.add('show');
}

  phase = 'transforming';

/* ===== Ambient sparkles + success burst — pure CSS/SVG visual flourish,
   no external art assets (request doc §22 calls for illustrated layers;
   this project has no art pipeline, so the "look" is built from shapes/
   emoji instead, same convention as the fishing/watermelon minigames). ===== */
function initSparkleField() {
  const symbols = ['✦', '✧', '⋆', '✨'];
  const count = REDUCED_MOTION ? 6 : 16;
  let html = '';
  for (let i = 0; i < count; i++) {
    const left = Math.random() * 100;
    const top = Math.random() * 55;
    const size = 6 + Math.random() * 10;
    const delay = Math.random() * 3.2;
    const duration = 2.6 + Math.random() * 2.4;
    const symbol = symbols[Math.floor(Math.random() * symbols.length)];
    html += `<span class="sparkle" style="left:${left}%;top:${top}%;font-size:${size}px;animation-delay:${delay}s;animation-duration:${duration}s">${symbol}</span>`;
  }
  el.sparkleField.innerHTML = html;
}

function spawnSparkleBurst() {
  if (REDUCED_MOTION) return;
  for (let i = 0; i < 10; i++) {
    const span = document.createElement('span');
    span.className = 'sparkle-burst';
    span.textContent = Math.random() < 0.5 ? '✨' : '✦';
    const angle = Math.random() * Math.PI * 2;
    const dist = 50 + Math.random() * 50;
    span.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
    span.style.setProperty('--dy', (Math.sin(angle) * dist - 20) + 'px');
    span.style.fontSize = (12 + Math.random() * 10) + 'px';
    el.cauldronArea.appendChild(span);
    setTimeout(() => span.remove(), 950);
  }
}

renderShelf();
updateCauldronLiquid();
renderContentsStrip();
updatePowderButton();
initSparkleField();
</script>
