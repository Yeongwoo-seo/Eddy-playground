<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · TRANSFORM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#241442">
<link rel="manifest" href="/dev/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERATION MK DEV">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--green:#3ECF6B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}

.frame{position:relative;width:100%;max-width:430px;min-height:100dvh;min-height:100vh;background:radial-gradient(ellipse 130% 70% at 50% 8%,#3a2465 0%,#241442 45%,#170c2d 80%,#0e0820 100%);display:flex;flex-direction:column;overflow-x:hidden}

.sparkle-field{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sparkle{position:absolute;color:#fff;opacity:0;animation:sparkleTwinkle 3.2s ease-in-out infinite}
@keyframes sparkleTwinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.85;transform:scale(1)}}
.reduced-motion .sparkle{animation:none;opacity:.35}
.sparkle-burst{position:absolute;left:50%;top:50%;pointer-events:none;z-index:9;font-size:16px;animation:sparkleBurst 900ms ease-out forwards}
@keyframes sparkleBurst{0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(1.1)}}

.topbar{position:relative;z-index:6;padding:calc(14px + env(safe-area-inset-top,0)) 16px 8px;display:flex;justify-content:space-between;align-items:center}
.vn-btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:9px 13px;cursor:pointer;text-decoration:none;display:inline-block}
.vn-btn:active{opacity:.75}

/* ===== Mirror + target caption ===== */
.mirror-bubble{position:relative;z-index:3;margin:0 20px 6px;max-width:290px;align-self:center;background:radial-gradient(ellipse at 50% 35%,#2a3550 0%,#161d2e 70%,#0d1220 100%);border:3px solid;border-image:linear-gradient(135deg,#E8D9A8,#B8933F,#F2E4B0,#9c7a33) 1;border-radius:50%/38%;padding:14px 18px;font-size:12px;line-height:1.5;color:#DCE4F0;text-align:center;box-shadow:0 0 0 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.5),inset 0 0 24px rgba(120,150,220,.15)}
.target-line{position:relative;z-index:3;font-family:var(--mono);font-size:11px;color:#C7B1F1;text-align:center;letter-spacing:.02em;padding:0 16px 6px}
.target-line b{color:#FFD12E;font-weight:700}

/* ===== Potion room stage ===== */
.stage{position:relative;z-index:1;display:flex;flex-direction:column}
.potion-room{position:relative;padding:0 8px}
.shelf-row{position:relative;z-index:1;display:flex;gap:4px;align-items:stretch}
.shelf-col{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.shelf-col.shelf-center{flex:1.25}

.shelf-compartment{position:relative;background:linear-gradient(160deg,#9a5940 0%,#8E4E38 40%,#70402F 100%);border:3px solid #4A2A24;border-radius:10px;padding:7px 3px 20px;box-shadow:inset 0 -8px 12px rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.08),0 3px 6px rgba(0,0,0,.35);transition:box-shadow .2s}
.shelf-compartment.small{padding:6px 3px 6px}
.shelf-compartment.flash{box-shadow:0 0 0 3px #FFD12E,inset 0 -8px 12px rgba(0,0,0,.28)}

.cat-plaque{position:absolute;left:50%;bottom:2px;transform:translateX(-50%) rotate(-2deg);background:linear-gradient(160deg,#FF9D1F,#D85A16);border:2px solid #FFD12E;border-radius:14px;padding:2px 9px 3px;font-size:9px;font-weight:800;color:#FFF3EB;text-shadow:0 1px 0 #A52B19;white-space:nowrap;box-shadow:0 2px 3px rgba(0,0,0,.35);z-index:2;letter-spacing:-.2px}

.bottle-rack{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:0 1px}

.potion-bottle{position:relative;touch-action:none;background:none;border:none;padding:4px;width:36px;display:flex;flex-direction:column;align-items:center;cursor:grab;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));transition:transform .15s ease}
.potion-bottle:active{cursor:grabbing}
.potion-bottle svg{display:block}
.potion-bottle.icon-bottle svg{width:22px;height:28px}
.potion-bottle.icon-orb svg{width:24px;height:24px}
.potion-bottle.icon-jar svg{width:23px;height:25px}
.potion-bottle.icon-face svg{width:26px;height:26px}
.potion-bottle.selected{transform:scale(1.12);filter:drop-shadow(0 0 6px #FFD12E) drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.potion-charm{position:absolute;top:-2px;right:1px;font-size:11px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.jar-emoji{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-size:9.5px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.face-emoji{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}

.drag-ghost{z-index:60;pointer-events:none}

/* ===== Floor / cauldron / props ===== */
.floor-area{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:2px;padding:8px 6px 4px;margin-top:2px;background:radial-gradient(ellipse 90% 100% at 50% 100%,rgba(116,91,155,.55) 0%,rgba(91,70,127,.4) 55%,transparent 100%);border-radius:0 0 14px 14px;min-height:186px}

.magic-book-prop{flex-shrink:0;background:linear-gradient(160deg,#E8639B 0%,#C23F7A 55%,#8E2B5A 100%);border:2px solid #6E1C42;border-radius:7px 15px 15px 7px;padding:9px 7px 8px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 4px 10px rgba(0,0,0,.45);transform:rotate(-5deg);min-width:42px;cursor:pointer;margin-bottom:14px}
.magic-book-prop:active{transform:rotate(-5deg) scale(.94)}
.magic-book-prop .prop-icon{font-size:19px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.magic-book-prop .prop-label{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.02em}

.cauldron-area{position:relative;z-index:1;flex:1;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}

.portrait-wrap{position:relative;z-index:2;margin-bottom:-6px;display:flex;flex-direction:column;align-items:center;transition:transform .3s cubic-bezier(.2,.8,.2,1),filter .3s ease}
.portrait-wrap.age-baby{transform:scale(.6)}
.portrait-wrap.age-adult{transform:scale(1.1)}
.portrait-wrap.age-elder{transform:scale(1);filter:grayscale(.4) brightness(.9)}

.char-head{position:relative;z-index:3;width:64px;height:64px;border-radius:50%;background:#2a2f36;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.2);box-shadow:0 4px 10px rgba(0,0,0,.4);transition:background-color .3s ease}
.char-face{font-size:32px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.char-ears{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:20px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.char-decor{position:absolute;top:0;right:-11px;font-size:17px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.char-eye{position:absolute;top:46%;width:7px;height:7px;border-radius:50%;background:var(--eye-color,#555);box-shadow:0 0 4px rgba(255,255,255,.45)}
.char-eye-l{left:26%}
.char-eye-r{right:26%}

.char-collar{position:relative;z-index:2;margin-top:-8px;width:22px;height:22px;border-radius:50%;background:var(--surface-1);border:1.5px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}

.char-body{position:relative;z-index:1;width:104px;height:92px;margin-top:-9px;background:#2a2f36;border-radius:46% 46% 50% 50% / 40% 40% 56% 56%;box-shadow:0 6px 14px rgba(0,0,0,.4);transition:width .3s,height .3s,border-radius .3s,background-color .3s}
.char-body.body-petite{width:86px;height:74px}
.char-body.body-slender{width:88px;height:122px;border-radius:44% 44% 50% 50% / 34% 34% 56% 56%}
.char-body.body-sturdy{width:132px;height:88px;border-radius:42% 42% 48% 48% / 38% 38% 56% 56%}
.char-body.body-hourglass::after{content:'';position:absolute;left:18%;right:18%;top:42%;height:2px;background:rgba(0,0,0,.18);border-radius:2px}

.cauldron{position:relative;width:210px;height:170px;z-index:1;filter:drop-shadow(0 10px 12px rgba(0,0,0,.5));transition:filter .15s ease}
.cauldron.drop-hover{filter:drop-shadow(0 10px 12px rgba(0,0,0,.5)) drop-shadow(0 0 16px #FFD12E)}
.cauldron-svg{width:100%;height:100%;display:block;overflow:visible}
.cauldron-liquid{transform-box:fill-box;transform-origin:center;transition:fill .4s ease;filter:drop-shadow(0 0 8px var(--liquid-color,#2c3440))}
.cauldron-liquid.bubble{animation:cauldronBubble .5s ease-in-out infinite}
@keyframes cauldronBubble{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2.5px) scale(1.03)}}
.cauldron.shake{animation:cauldronShake .12s linear infinite}
@keyframes cauldronShake{0%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-1deg)}75%{transform:translateX(4px) rotate(1deg)}100%{transform:translateX(0)}}
.cauldron.pour-bounce{animation:pourBounce .32s ease}
@keyframes pourBounce{0%,100%{transform:scale(1) translateY(0)}40%{transform:scale(1.035) translateY(-3px)}}

.droplet{position:absolute;width:6px;height:6px;border-radius:50%;top:14%;opacity:.9;pointer-events:none;z-index:4;animation:dropletFall .5s ease-in forwards}
@keyframes dropletFall{0%{transform:translateY(0) scale(1);opacity:.9}100%{transform:translateY(64px) scale(.35);opacity:0}}

.fx-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;transition:opacity .12s ease}
.fx-flash.show{opacity:1}
.fx-smoke{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,rgba(230,230,235,.9) 0%,rgba(230,230,235,0) 70%);opacity:0;pointer-events:none;z-index:4;transition:opacity .3s ease,width .5s ease,height .5s ease}
.fx-smoke.show{opacity:1;width:220px;height:220px}

.powder-pouch-prop{flex-shrink:0;background:linear-gradient(160deg,#D65FC0 0%,#B23F9E 55%,#7A1F6A 100%);border:2px solid #5A1050;border-radius:44% 44% 48% 48% / 55% 55% 45% 45%;padding:9px 9px 10px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 4px 10px rgba(0,0,0,.45);min-width:52px;cursor:pointer;margin-bottom:10px;transition:opacity .2s,filter .2s}
.powder-pouch-prop .prop-icon{font-size:19px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.powder-pouch-prop .prop-label{font-family:var(--mono);font-size:8.5px;font-weight:800;letter-spacing:.02em;text-align:center;line-height:1.35}
.powder-pouch-prop:disabled{opacity:.5;filter:saturate(.4);cursor:not-allowed}
.powder-pouch-prop:active:not(:disabled){transform:scale(.94)}
.powder-pouch-prop.pulse:not(:disabled){animation:powderPulse 1.6s ease-in-out infinite}
@keyframes powderPulse{0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.45),0 0 0 rgba(255,209,46,0)}50%{box-shadow:0 4px 10px rgba(0,0,0,.45),0 0 16px rgba(255,209,46,.65)}}

/* ===== Reagent table ===== */
.reagent-table{position:relative;z-index:1;margin:10px 14px calc(14px + env(safe-area-inset-bottom,0));background:linear-gradient(180deg,#C7B1F1 0%,#EFE7FF 100%);border:2px solid #7650B4;border-radius:16px;padding:9px 8px 7px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.reagent-title{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;color:#3A145A;background:linear-gradient(180deg,#fff,#E3D6FF);padding:3px 10px;border-radius:10px 10px 10px 0;margin:-9px 0 6px -8px;box-shadow:0 2px 3px rgba(0,0,0,.15)}
.reagent-progress{font-family:var(--mono);font-size:9.5px;color:#7650B4;font-weight:700}
.reagent-slots{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
.reagent-slot{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.reagent-slot-box{position:relative;width:38px;height:42px;background:#3A145A;border:2px solid #F7F0FF;border-radius:9px;display:flex;align-items:center;justify-content:center}
.reagent-slot-box svg{width:22px;height:26px}
.reagent-slot-box.filled{box-shadow:0 0 0 2px #FFD12E inset}
.reagent-slot-box.hint-glow{animation:hintGlow 1.1s ease-in-out infinite}
@keyframes hintGlow{0%,100%{box-shadow:0 0 0 rgba(255,209,46,0)}50%{box-shadow:0 0 12px rgba(255,209,46,.7)}}
.reagent-slot-label{writing-mode:vertical-rl;font-size:9px;font-weight:700;color:#3A145A;letter-spacing:0}

/* ===== Sheets (magic book) ===== */
.sheet-overlay{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.sheet-overlay.show{display:flex}
.sheet{width:100%;max-width:430px;max-height:78vh;background:var(--surface-2);border:1px solid var(--divider);border-bottom:none;border-radius:24px 24px 0 0;padding:10px 18px calc(16px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;overflow:hidden}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--divider);margin:2px auto 12px}
.sheet-close{margin-top:12px;font-family:var(--mono);font-size:12.5px;color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:12px;cursor:pointer}

.book-sheet{max-height:82vh}
.book-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid var(--divider)}
.book-tab{flex-shrink:0;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.book-tab.active{color:#04181c;background:var(--cyan);border-color:var(--cyan)}
.book-body{overflow-y:auto;flex:1}
.clue-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--divider)}
.clue-icon{font-size:16px;flex-shrink:0;width:22px;text-align:center}
.clue-label{font-size:11.5px;color:var(--text-muted);font-weight:600;margin-bottom:2px}
.clue-text{font-size:13px;line-height:1.5}
.book-flavor{font-size:12.5px;color:var(--text-secondary);line-height:1.6;margin-bottom:12px;background:var(--surface-1);border-radius:12px;padding:10px 12px}
.encyclo-group{margin-bottom:14px}
.encyclo-title{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
.encyclo-item{display:flex;gap:10px;align-items:center;padding:6px 0}
.encyclo-swatch{position:relative;width:20px;height:26px;flex-shrink:0}
.encyclo-swatch svg{display:block;width:100%;height:100%;overflow:visible}
.encyclo-name{font-size:12.5px;font-weight:600}
.encyclo-desc{font-size:11px;color:var(--text-muted)}
.howto-text{font-size:13px;line-height:1.75;color:var(--text-secondary);white-space:pre-line;margin-bottom:14px}
.replay-btn{font-family:var(--mono);font-size:12px;color:#04181c;background:var(--amber);border:none;border-radius:12px;padding:10px 14px;cursor:pointer}
.collection-empty{font-size:12.5px;color:var(--text-muted);padding:20px 0;text-align:center}
.collection-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.collection-item{background:var(--surface-1);border:1px solid var(--divider);border-radius:12px;padding:10px 4px;text-align:center}
.collection-emoji{font-size:20px}
.collection-count{font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-top:2px}

/* ===== Magic book — parchment/leather theme, deliberately distinct from
   the dev-tool dark shell so it reads as an in-world prop. ===== */
.book-sheet{background:linear-gradient(160deg,#3c2f1f 0%,#2a1f14 100%);border:1px solid #5a4527;box-shadow:0 -10px 32px rgba(0,0,0,.6)}
.book-sheet .sheet-handle{background:rgba(255,255,255,.25)}
.book-sheet .book-tabs{border-bottom-color:rgba(255,255,255,.14)}
.book-sheet .book-tab{background:rgba(0,0,0,.22);color:#D8C7A0;border-color:rgba(255,255,255,.12)}
.book-sheet .book-tab.active{background:linear-gradient(135deg,#EAD9A6,#B8923D);color:#3a2c18;border-color:transparent}
.book-sheet .book-flavor{background:rgba(0,0,0,.24);color:#F0E4C8;border:1px solid rgba(255,255,255,.08)}
.book-sheet .clue-row{border-bottom-color:rgba(255,255,255,.12)}
.book-sheet .clue-label{color:#C9AF7C}
.book-sheet .clue-text{color:#F3E9D2}
.book-sheet .encyclo-title{color:#C9AF7C}
.book-sheet .encyclo-name{color:#F3E9D2}
.book-sheet .encyclo-desc{color:#B8A57D}
.book-sheet .howto-text{color:#EFE3C8}
.book-sheet .collection-empty{color:#B8A57D}
.book-sheet .collection-item{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.12)}
.book-sheet .collection-count{color:#C9AF7C}
.book-sheet .sheet-close{background:rgba(0,0,0,.26);color:#D8C7A0;border-color:rgba(255,255,255,.14)}
.book-sheet .replay-btn{background:linear-gradient(135deg,#EAD9A6,#B8923D);color:#3a2c18}

/* ===== Result / intro overlays ===== */
.overlay{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:32px;background:rgba(5,7,10,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.overlay.show{display:flex}
.result-grade{font-size:26px;font-weight:800}
.result-grade.PERFECT{color:var(--green)}
.result-grade.NEAR_SUCCESS{color:var(--cyan)}
.result-grade.MIXED{color:var(--amber)}
.result-grade.FAIL{color:var(--signal-red)}
.result-grade.SPECIAL{color:#C9A6FF}
.result-grade.FREE{color:var(--cyan)}
.result-mirror{font-size:13.5px;color:var(--text-secondary);max-width:280px;line-height:1.6}
.result-score{font-family:var(--mono);font-size:12px;color:var(--text-muted)}
.result-hint{font-size:12px;color:var(--amber);max-width:260px;line-height:1.5}
.result-actions{display:flex;gap:10px;margin-top:8px}
.result-btn{font-family:var(--mono);font-size:13px;font-weight:700;border:none;border-radius:14px;padding:12px 18px;cursor:pointer}
.result-btn.primary{background:var(--green);color:#08110c}
.result-btn.secondary{background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--divider)}
.intro-title{font-size:20px;font-weight:700}
.intro-text{font-size:13.5px;color:var(--text-secondary);line-height:1.7;max-width:290px;white-space:pre-line}
.reduced-motion .cauldron.shake{animation:none}
.reduced-motion .cauldron-liquid.bubble{animation:none}
.reduced-motion .reagent-slot-box.hint-glow{animation:none}
.reduced-motion .powder-pouch-prop.pulse{animation:none}
</style>
</head>
<body>
<div class="frame" id="frame">

  <div class="topbar">
    <a class="vn-btn" href="/dev/">← DEV</a>
    <a class="vn-btn" href="/dev/minigame-transform/">설정</a>
  </div>

  <div class="sparkle-field" id="sparkleField"></div>

  <div class="mirror-bubble" id="mirrorBubble" style="display:none"></div>
  <div class="target-line" id="targetLine"></div>

  <div class="stage">
    <div class="potion-room">
      <div class="shelf-row">
        <div class="shelf-col shelf-left">
          <div class="shelf-compartment" data-cat="eyes"><div class="bottle-rack" id="rack-eyes"></div><div class="cat-plaque">눈동자약</div></div>

/* ===== Cauldron liquid mix — reflects the whole current combo, not just
   the last pick (request doc §11). ===== */
function hexToRgb(hex) {
  const m = hex.replace('#', '');
  return [parseInt(m.slice(0, 2), 16), parseInt(m.slice(2, 4), 16), parseInt(m.slice(4, 6), 16)];
}
function rgbToHex([r, g, b]) { return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join(''); }

function updateCauldronColor() {
  const picked = ATTRIBUTES.map(a => selections[a.key] && potionById(a.key, selections[a.key])).filter(Boolean);
  if (!picked.length) {
    el.cauldronLiquid.style.setProperty('--liquid-color', '#2c3440');
    el.cauldronLiquid.classList.remove('bubble');
    return;
  }
  const sum = picked.reduce((acc, p) => {
    const [r, g, b] = hexToRgb(p.color);
    return [acc[0] + r, acc[1] + g, acc[2] + b];
  }, [0, 0, 0]);
  const avg = sum.map(v => v / picked.length);
  el.cauldronLiquid.style.setProperty('--liquid-color', rgbToHex(avg));
  el.cauldronLiquid.classList.toggle('bubble', picked.length > 0 && !REDUCED_MOTION);
}

/* ===== Drag + tap → pour into cauldron. Both interaction styles end in the
   same flight-and-splash animation (request doc §8.5/§15.2's "물약이
   가마솥으로 날아가 쏟아지는" flow); a tap is just a zero-distance drag. ===== */
function onBottlePointerDown(e) {
  if (phase !== 'selecting') return;
  if (e.button !== undefined && e.button !== 0) return;
  const btn = e.currentTarget;
  const cat = btn.dataset.cat, id = btn.dataset.id;
  const rect = btn.getBoundingClientRect();
  const startX = e.clientX, startY = e.clientY;
  let moved = false;

  const ghost = btn.cloneNode(true);
  ghost.classList.add('drag-ghost');
  ghost.style.position = 'fixed';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  ghost.style.margin = '0';
  document.body.appendChild(ghost);

  function withinCauldron(ev) {
    const c = el.cauldron.getBoundingClientRect();
    return ev.clientX > c.left - 24 && ev.clientX < c.right + 24 && ev.clientY > c.top - 24 && ev.clientY < c.bottom + 30;
  }

  function onMove(ev) {
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    ghost.style.transition = 'none';
    ghost.style.transform = `translate(${dx}px,${dy}px) scale(1.15)`;
    el.cauldron.classList.toggle('drop-hover', withinCauldron(ev));
  }
  function onUp(ev) {
    document.removeEventListener('pointermove', onMove);
    const overCauldron = withinCauldron(ev);
    el.cauldron.classList.remove('drop-hover');
    if (!moved || overCauldron) {
      animateGhostToCauldron(ghost, () => { ghost.remove(); commitSelection(cat, id); });
    } else {
      ghost.style.transition = 'transform .25s cubic-bezier(.34,1.4,.64,1)';
      requestAnimationFrame(() => { ghost.style.transform = 'translate(0px,0px) scale(1)'; });
      setTimeout(() => ghost.remove(), 260);
    }
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp, { once: true });
}

function animateGhostToCauldron(ghost, onDone) {
  const gRect = ghost.getBoundingClientRect();
  const cRect = el.cauldron.getBoundingClientRect();
  const targetX = cRect.left + cRect.width * 0.5 - gRect.width / 2;
  const targetY = cRect.top + cRect.height * 0.22 - gRect.height / 2;
  const dx = targetX - gRect.left, dy = targetY - gRect.top;
  ghost.style.transition = 'transform .36s cubic-bezier(.32,.6,.34,1), opacity .36s ease .16s';
  requestAnimationFrame(() => {
    ghost.style.transform = `translate(${dx}px,${dy}px) scale(.55) rotate(75deg)`;
    ghost.style.opacity = '0.15';
  });
  setTimeout(onDone, 370);
}

function pourEffect(color) {
  if (REDUCED_MOTION) return;
  el.cauldron.classList.add('pour-bounce');
  setTimeout(() => el.cauldron.classList.remove('pour-bounce'), 320);
  for (let i = 0; i < 6; i++) {
    const d = document.createElement('span');
    d.className = 'droplet';
    d.style.background = color;
    d.style.left = (44 + Math.random() * 12) + '%';
    d.style.animationDelay = (Math.random() * 0.08) + 's';
    el.cauldronArea.appendChild(d);
    setTimeout(() => d.remove(), 560);
  }
}

function commitSelection(cat, id) {
  selections[cat] = id;
  const p = potionById(cat, id);
  vibrate(8);
  renderShelves();
  renderSlots();
  updateCauldronColor();
  updatePowderButton();
  pourEffect(p.color);
}

function scrollToShelf(cat) {

/* ===== Collection (도감) ===== */
const COLLECTION_KEY = 'mkTransformCollection';
const GRADE_EMOJI = { PERFECT: '👑', NEAR_SUCCESS: '💫', MIXED: '🌀', FAIL: '🫥', SPECIAL: '🌈', FREE: '🧪' };
const GRADE_RANK = { FAIL: 0, MIXED: 1, NEAR_SUCCESS: 2, SPECIAL: 2, PERFECT: 3, FREE: 1 };
function loadCollection() { try { return JSON.parse(localStorage.getItem(COLLECTION_KEY)) || {}; } catch (e) { return {}; } }
function saveCollection(data) { try { localStorage.setItem(COLLECTION_KEY, JSON.stringify(data)); } catch (e) {} }
function recordDiscovery(resultKey, grade) {
  const collection = loadCollection();
  const entry = collection[resultKey] || { count: 0, bestGrade: grade };
  entry.count += 1;
  if (GRADE_RANK[grade] > GRADE_RANK[entry.bestGrade]) entry.bestGrade = grade;
  collection[resultKey] = entry;
  saveCollection(collection);
}

/* ===== Evaluation (request doc §20) ===== */
function evaluateRecipe() {
  const details = ATTRIBUTES.map(a => {
    const selected = selections[a.key];
    const valid = TARGET.valid[a.key];
    const correct = selected !== null && valid.includes(selected);
    return { attribute: a.key, selected, correct, weight: ATTRIBUTE_WEIGHTS[a.key] };
  });
  const rawCorrectCount = details.filter(d => d.correct).length;
  const totalWeight = details.reduce((s, d) => s + d.weight, 0);
  const correctWeight = details.filter(d => d.correct).reduce((s, d) => s + d.weight, 0);
  const weightedScore = correctWeight / totalWeight;
  const characterCorrect = details.find(d => d.attribute === 'character').correct;

  let grade;
  if (rawCorrectCount === 8) grade = 'PERFECT';
  else if (characterCorrect && weightedScore >= 0.8) grade = 'NEAR_SUCCESS';
  else if (weightedScore >= 0.5) grade = 'MIXED';
  else grade = 'FAIL';

  return { grade, rawCorrectCount, weightedScore, details };
}

/* ===== Easter eggs (request doc §14.2) — checked before the normal grade
   the way composeResult()'s special-combination lookup runs first. ===== */
function hexToHsl(hex) {
  let [r, g, b] = hexToRgb(hex).map(v => v / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0, l = (max + min) / 2;
  const d = max - min;
  if (d !== 0) {
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return { h, s, l };
}
function findSpecialCombination() {
  const picked = ATTRIBUTES.map(a => potionById(a.key, selections[a.key]));
  const hues = picked.map(p => hexToHsl(p.color).h);
  const hueSpread = Math.max(...hues) - Math.min(...hues);
  if (hueSpread <= 28) return { name: '단색 마법 생명체', mirror: '색은 완벽히 통일했는데… 이게 누구였더라?' };

  const allLast = ATTRIBUTES.every(a => {
    const list = POTIONS[a.key];
    return selections[a.key] === list[list.length - 1].id;
  });
  if (allLast) return { name: '혼돈의 대연금술사', mirror: '새로운 생명체를 만들어 낸 건 인정하지.' };

  return null;
}

/* ===== Portrait composition — every attribute visibly changes the result,
   right or wrong (request doc §7.1, §28). Only rendered at RESULT time so
   selecting never previews the final form (request doc §3.1); the cauldron
   liquid color is the only feedback during SELECTING. ===== */
function composePortrait() {
  const eyes = potionById('eyes', selections.eyes);
  const skin = potionById('skin', selections.skin);
  const age = potionById('age', selections.age);
  const gender = potionById('gender', selections.gender);
  const character = potionById('character', selections.character);
  const decoration = potionById('decoration', selections.decoration);
  const body = potionById('body', selections.body);
  const face = potionById('face', selections.face);

  el.portraitWrap.className = 'portrait-wrap ' + age.scaleClass;
  el.charHead.style.backgroundColor = skin.color;
  el.charBody.className = 'char-body ' + body.shapeClass;
  el.charBody.style.backgroundColor = skin.color;

  el.charFace.textContent = character.emoji;
  el.charEars.textContent = face.emoji;
  el.charDecor.textContent = decoration.emoji;
  el.charCollar.textContent = gender.badge;
  el.eyeLeft.style.setProperty('--eye-color', eyes.color);
  el.eyeRight.style.setProperty('--eye-color', eyes.color);

  el.portraitWrap.style.display = 'flex';
}

/* ===== Mirror reactions (request doc §8) ===== */
function mirrorLine(evaluation, special) {
  if (MODE === 'free') return '새로운 모습이 완성되었어요.';
  if (special) return special.mirror;
  switch (evaluation.grade) {
    case 'PERFECT': return `완벽해! 정말 ${TARGET.name}, 그 자체잖아!`;
    case 'NEAR_SUCCESS': return '거의 다 왔어… 어딘가 조금 다른 것 같은데?';
    case 'MIXED': return `${TARGET.name}를 닮긴 했지만, 어딘가 많이 섞였군.`;
    case 'FAIL':
    default:
      return evaluation.details.find(d => d.attribute === 'character').correct
        ? '…이것도 나름 개성 있네.'
        : '잠깐, 애초에 다른 존재잖아!';
  }
}

function hintLine(evaluation) {
  if (evaluation.grade === 'PERFECT') { hintRevealAttr = null; return null; }
  const wrong = evaluation.details.filter(d => !d.correct);
  if (!wrong.length) { hintRevealAttr = null; return null; }
  if (failCount <= 1) return '얼굴과 몸매 쪽을 다시 살펴봐.';
  if (failCount === 2) {
    const target = wrong.find(d => d.attribute === 'face') || wrong[0];
    return `힌트: ${ATTRIBUTES.find(a => a.key === target.attribute).label}을(를) 다시 골라봐.`;
  }
  hintRevealAttr = wrong[0].attribute;
  return `힌트: ${ATTRIBUTES.find(a => a.key === hintRevealAttr).label} 슬롯이 반짝이고 있어. 진열장에서 반짝이는 물약을 찾아봐.`;
}

/* ===== Transformation sequence (request doc §9) ===== */
const TIMING = {
  full: { shake: 650, smoke: 550, flash: 140, reveal: 450 },
  fast: { shake: 180, smoke: 150, flash: 90, reveal: 220 },
};
async function runTransformSequence() {
  const t = TIMING[FX];
  el.mirrorBubble.style.display = 'none';
  el.cauldron.classList.toggle('shake', !REDUCED_MOTION);
  vibrate(15);
  await wait(t.shake);

  el.cauldron.classList.remove('shake');
  el.fxSmoke.classList.add('show');
  await wait(t.smoke);

  if (!REDUCED_MOTION) {
    el.fxFlash.classList.add('show');
    await wait(t.flash);
    el.fxFlash.classList.remove('show');
  }

  composePortrait();
  el.fxSmoke.classList.remove('show');
  await wait(t.reveal);
}

/* ===== Result flow ===== */
function showResult() {
  const special = MODE === 'mission' ? findSpecialCombination() : null;
  const evaluation = MODE === 'mission' ? evaluateRecipe() : null;
  const grade = MODE === 'free' ? 'FREE' : (special ? 'SPECIAL' : evaluation.grade);

  if (MODE === 'mission' && grade !== 'PERFECT') failCount++;
  else if (grade === 'PERFECT') failCount = 0;

  const resultKey = ATTRIBUTES.map(a => selections[a.key]).join('__');
  recordDiscovery(resultKey, grade);

  el.resultGrade.className = 'result-grade ' + grade;
  el.resultGrade.textContent = {
    PERFECT: '완전 성공!', NEAR_SUCCESS: '거의 성공', MIXED: '혼합 변신', FAIL: '대실패',
    SPECIAL: special ? special.name : '특수 결과', FREE: '변신 완료',
  }[grade];
  el.resultMirror.textContent = mirrorLine(evaluation, special);

  if (MODE === 'mission') {
    el.resultScore.textContent = `일치한 속성: ${evaluation.rawCorrectCount} / 8`;
    const hint = hintLine(evaluation);
    el.resultHint.style.display = hint ? 'block' : 'none';
    el.resultHint.textContent = hint || '';
  } else {
    el.resultScore.textContent = '';
    el.resultHint.style.display = 'none';
  }

  el.mirrorBubble.textContent = el.resultMirror.textContent;
  el.mirrorBubble.style.display = 'block';

  if (grade === 'PERFECT' || grade === 'SPECIAL') spawnSparkleBurst();

  phase = 'result';
  el.resultOverlay.classList.add('show');
}

async function onPowderClick() {
  if (el.powderBtn.disabled || phase !== 'selecting') return;
  phase = 'transforming';
  updatePowderButton();
  await runTransformSequence();
  showResult();
}
el.powderBtn.addEventListener('click', onPowderClick);

function retry() {
  selections = { eyes: null, skin: null, age: null, gender: null, character: null, decoration: null, body: null, face: null };
  phase = 'selecting';
  el.resultOverlay.classList.remove('show');
  el.mirrorBubble.style.display = 'none';

}

/* ===== Ambient sparkles + success burst — doubles as the purple wall's
   star pattern (request doc §4.1) since the frame background already
   supplies the deep-purple wall color; no separate wall-star layer needed. ===== */
function initSparkleField() {
  const symbols = ['✦', '✧', '⋆', '✨'];
  const count = REDUCED_MOTION ? 8 : 20;
  let html = '';
  for (let i = 0; i < count; i++) {
    const left = Math.random() * 100;
    const top = Math.random() * 60;
    const size = 6 + Math.random() * 10;
    const delay = Math.random() * 3.2;
    const duration = 2.6 + Math.random() * 2.4;
    const symbol = symbols[Math.floor(Math.random() * symbols.length)];
    html += `<span class="sparkle" style="left:${left}%;top:${top}%;font-size:${size}px;animation-delay:${delay}s;animation-duration:${duration}s">${symbol}</span>`;
  }
  el.sparkleField.innerHTML = html;
}

function spawnSparkleBurst() {
  if (REDUCED_MOTION) return;
  for (let i = 0; i < 10; i++) {
    const span = document.createElement('span');
    span.className = 'sparkle-burst';
    span.textContent = Math.random() < 0.5 ? '✨' : '✦';
    const angle = Math.random() * Math.PI * 2;
    const dist = 50 + Math.random() * 50;
    span.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
    span.style.setProperty('--dy', (Math.sin(angle) * dist - 20) + 'px');
    span.style.fontSize = (12 + Math.random() * 10) + 'px';
    el.cauldronArea.appendChild(span);
    setTimeout(() => span.remove(), 950);
  }
}

renderShelves();
renderSlots();
updateCauldronColor();
updatePowderButton();
initSparkleField();
</script>
