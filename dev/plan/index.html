<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>개발계획 · OPERATION MK DEV</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(20px + env(safe-area-inset-top,0)) 20px calc(40px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--surface-1);border:1px solid var(--divider);color:var(--text-primary);display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.page-title{font-size:19px;font-weight:700;flex:1}
.save-status{font-family:var(--mono);font-size:11px;color:var(--text-muted);letter-spacing:.04em;white-space:nowrap}
.sub{font-size:13px;color:var(--text-secondary);margin-bottom:18px;line-height:1.6}
.editor{flex:1;display:flex;min-height:50vh}
.plan-textarea{flex:1;width:100%;resize:none;background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;padding:16px;color:var(--text-primary);font-family:var(--mono);font-size:13.5px;line-height:1.7;outline:none}
.plan-textarea:focus{border-color:rgba(89,184,200,.4)}
.plan-textarea::placeholder{color:var(--text-muted)}
</style>
</head>
<body>
<div class="frame">
  <div class="topbar">
    <a class="back-btn" href="/dev/">←</a>
    <div class="page-title">개발계획</div>
    <div class="save-status" id="saveStatus">&nbsp;</div>
  </div>
  <div class="sub">씬·미니게임 작업 순서나 남은 할 일을 자유롭게 적어두세요. 다른 기기에서도 이어서 볼 수 있게 서버에도 저장됩니다.</div>
  <div class="editor">
    <textarea class="plan-textarea" id="planText" placeholder="예)
- [ ] week1 씬3 배경 교체
- [ ] 폰 찾기 미니게임 정답 영역 재조정
- [ ] 업로드 화면 크롭 UX 다듬기"></textarea>
  </div>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script src="/dev/assetDb.js"></script>
<script>
const STORAGE_KEY = 'devPlanNotes';
const textarea = document.getElementById('planText');
const status = document.getElementById('saveStatus');

textarea.value = localStorage.getItem(STORAGE_KEY) || '';

let saveTimer = null;
function persist() {
  localStorage.setItem(STORAGE_KEY, textarea.value);
  AssetDB.setDevPlanNotes(textarea.value)
    .then(() => { status.textContent = '저장됨'; })
    .catch(() => { status.textContent = '저장됨 (이 기기만 · 서버 연결 실패)'; });
}
textarea.addEventListener('input', () => {
  status.textContent = '저장 중...';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 400);
});

// Pull down whatever was last saved from another device — only applied while
// this textarea hasn't been touched yet, so a note the player is mid-typing
// here never gets clobbered by an older/newer copy arriving from the server.
let userHasEdited = false;
textarea.addEventListener('input', () => { userHasEdited = true; }, { once: true });
AssetDB.getDevPlanNotes().then(serverText => {
  if (userHasEdited || serverText === null || serverText === textarea.value) return;
  textarea.value = serverText;
  localStorage.setItem(STORAGE_KEY, serverText);
}).catch(() => {});
</script>
</body>
</html>
