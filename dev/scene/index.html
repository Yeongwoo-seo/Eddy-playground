<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · SCENE EDITOR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERATION MK DEV">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);min-height:100dvh;min-height:100vh}
.page{max-width:900px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0)) 20px calc(40px + env(safe-area-inset-bottom,0))}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-muted);text-transform:uppercase}
.title{font-size:22px;font-weight:700;letter-spacing:-.2px;margin-top:4px}
.back-link{font-family:var(--mono);font-size:12px;color:var(--text-secondary);text-decoration:none;border:1px solid var(--divider);border-radius:20px;padding:9px 14px}

.editor-layout{display:flex;flex-direction:column;gap:28px}
@media (min-width:820px){.editor-layout{flex-direction:row;align-items:flex-start}.preview-col{position:sticky;top:24px}}

.preview-col{display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0}
.preview-box{position:relative;width:100%;max-width:320px;aspect-ratio:414/896;background:#0d1114;border-radius:18px;overflow:hidden;border:1px solid var(--divider);touch-action:none}
.preview-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#0d1114}
.preview-bg.placeholder{background-image:linear-gradient(160deg,#171c22 0%,#0d1114 60%,#080a0c 100%)}
.preview-char{position:absolute;left:50%;top:72%;height:56%;width:auto;max-width:none;object-fit:contain;transform-origin:center center;transform:translate(-50%,-50%);cursor:grab;touch-action:none;user-select:none}
.preview-char.hidden{display:none}
.preview-msg{position:absolute;top:0;left:0;right:0;z-index:4;background:rgba(8,10,12,.78);color:var(--amber);font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-align:center;padding:9px 10px;line-height:1.6;white-space:pre-line}
.preview-msg.hidden{display:none}
.preview-caption{font-family:var(--mono);font-size:10px;color:var(--text-muted);letter-spacing:.06em;text-align:center}

.controls-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:22px}
.section-title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field-label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--text-secondary);text-transform:uppercase;display:flex;justify-content:space-between}
.slider-val{color:var(--cyan);font-weight:600}
select,input[type=text]{width:100%;background:var(--surface-1);color:var(--text-primary);border:1px solid var(--divider);border-radius:10px;padding:12px 14px;font-size:14px;font-family:inherit}
input[type=range]{width:100%;accent-color:var(--cyan)}

.toggle-row{display:flex;gap:10px}
.toggle-btn{flex:1;background:var(--surface-1);border:1px solid var(--divider);border-radius:10px;padding:12px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--text-secondary);cursor:pointer}
.toggle-btn.active{background:rgba(89,184,200,.14);border-color:var(--cyan);color:var(--cyan)}

.card{background:var(--surface-1);border:1px solid var(--divider);border-radius:16px;padding:20px}

.btn-primary{width:100%;background:var(--cyan);color:#06181c;border:none;border-radius:12px;padding:15px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:var(--mono);letter-spacing:.05em}
.btn-primary.outline{background:transparent;color:var(--cyan);border:1px solid rgba(89,184,200,.5)}
.btn-stack{display:flex;flex-direction:column;gap:10px}

.scene-list{display:flex;flex-direction:column;gap:10px}
.scene-empty{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);letter-spacing:.03em;padding:6px 2px}
.scene-card{background:var(--surface-2);border:1px solid var(--divider);border-radius:12px;padding:16px}
.scene-card-name{font-size:15px;font-weight:700;margin-bottom:2px}
.scene-card-meta{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);margin-bottom:12px}
.scene-card-actions{display:flex;gap:8px;flex-wrap:wrap}
.scene-card-actions button{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:8px 12px;border-radius:8px;border:1px solid var(--divider);background:var(--surface-1);color:var(--text-secondary);cursor:pointer}
.scene-card-actions button.primary{color:var(--cyan);border-color:rgba(89,184,200,.4)}
.scene-card-actions button.danger{color:#e88a8a;border-color:rgba(230,120,120,.4)}

.debug-row{display:flex;flex-wrap:wrap;gap:8px}
.debug-row button{font-family:var(--mono);font-size:10.5px;padding:9px 12px;border-radius:8px;border:1px solid var(--divider);background:var(--surface-2);color:var(--text-muted);cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--surface-2);border:1px solid var(--divider);color:var(--text-primary);font-family:var(--mono);font-size:12px;letter-spacing:.05em;padding:12px 18px;border-radius:20px;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div>
      <div class="tag">Operation MK</div>
      <div class="title" id="pageTitle">SCENE EDITOR</div>
    </div>
    <a class="back-link" href="/dev/">← DEV</a>
  </div>

  <div class="editor-layout">
    <div class="preview-col">
      <div class="preview-box" id="previewBox">
        <div class="preview-msg hidden" id="previewMsg"></div>
        <div class="preview-bg placeholder" id="previewBg"></div>
        <img class="preview-char hidden" id="previewChar" alt="">
      </div>
      <div class="preview-caption">GAME PREVIEW · 414×896 기준 · 드래그로 위치 조절 가능</div>
    </div>

    <div class="controls-col">
      <div class="card">
        <div class="section-title">Background &amp; Character</div>
        <div class="field">
          <div class="field-label">BACKGROUND</div>
          <select id="bgSelect"></select>
        </div>
        <div class="field">
          <div class="field-label">CHARACTER</div>
          <select id="charSelect"></select>
        </div>

        <div class="field">
          <div class="field-label">X POSITION <span class="slider-val" id="xVal">0.50</span></div>
          <input type="range" id="xRange" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="field">
          <div class="field-label">Y POSITION <span class="slider-val" id="yVal">0.72</span></div>
          <input type="range" id="yRange" min="0" max="1" step="0.01" value="0.72">
        </div>
        <div class="field">
          <div class="field-label">SCALE <span class="slider-val" id="scaleVal">1.00</span></div>
          <input type="range" id="scaleRange" min="0.5" max="2.5" step="0.01" value="1">
        </div>

        <div class="field">
          <div class="toggle-row">
            <button type="button" class="toggle-btn" id="flipBtn">FLIP HORIZONTAL: OFF</button>
            <button type="button" class="toggle-btn active" id="visibleBtn">HIDE CHARACTER</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">Dialogue</div>
        <div class="field">
          <div class="field-label">DIALOGUE SET</div>
          <select id="dialogueSelect"></select>
        </div>
      </div>

      <div class="card">
        <div class="section-title">Save</div>
        <div class="field">
          <div class="field-label">SCENE NAME</div>
          <input type="text" id="nameInput" placeholder="예: mina-interview-night" maxlength="60">
        </div>
        <div class="btn-stack">
          <button type="button" class="btn-primary" id="saveBtn">SAVE SCENE</button>
          <button type="button" class="btn-primary outline" id="useInGameBtn">USE IN GAME TEST</button>
        </div>
      </div>

      <div class="card">
        <div class="section-title">Saved Scenes</div>
        <div class="scene-list" id="sceneList"></div>
      </div>

      <div class="card">
        <div class="section-title">Debug</div>
        <div class="debug-row">
          <button type="button" id="resetDraftBtn">RESET DRAFT</button>
          <button type="button" id="loadSampleBtn">LOAD SAMPLE SCENE</button>
          <button type="button" id="createSampleBtn">CREATE SAMPLE SCENE</button>
          <button type="button" id="clearAllBtn">CLEAR ALL SCENES</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script src="/dev/assetDb.js"></script>
<script src="/dev/sceneDb.js"></script>
<script src="/dev/dialogueDb.js"></script>
<script>
const el = {
  pageTitle: document.getElementById('pageTitle'),
  previewBox: document.getElementById('previewBox'),
  previewMsg: document.getElementById('previewMsg'),
  previewBg: document.getElementById('previewBg'),
  previewChar: document.getElementById('previewChar'),
  bgSelect: document.getElementById('bgSelect'),
  charSelect: document.getElementById('charSelect'),
  xRange: document.getElementById('xRange'),
  yRange: document.getElementById('yRange'),
  scaleRange: document.getElementById('scaleRange'),
  xVal: document.getElementById('xVal'),
  yVal: document.getElementById('yVal'),
  scaleVal: document.getElementById('scaleVal'),
  flipBtn: document.getElementById('flipBtn'),
  visibleBtn: document.getElementById('visibleBtn'),
  dialogueSelect: document.getElementById('dialogueSelect'),
  nameInput: document.getElementById('nameInput'),
  saveBtn: document.getElementById('saveBtn'),
  useInGameBtn: document.getElementById('useInGameBtn'),
  sceneList: document.getElementById('sceneList'),
  resetDraftBtn: document.getElementById('resetDraftBtn'),
  loadSampleBtn: document.getElementById('loadSampleBtn'),
  createSampleBtn: document.getElementById('createSampleBtn'),
  clearAllBtn: document.getElementById('clearAllBtn'),
  toast: document.getElementById('toast'),
};

function defaultDraft() {
  return { id: null, name: '', backgroundId: null, characterId: null, x: 0.5, y: 0.72, scale: 1.0, flipX: false, visible: true, dialogueSetId: null };
}

let draft = defaultDraft();
let loadedScene = null; // the scene as last loaded/saved, used by RESET DRAFT
const state = { backgrounds: [], characters: [] };

let toastTimer = null;
function toast(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove('show'), 1800);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function findAsset(list, id) {
  return (id && list.find(a => a.id === id)) || null;
}

function fillSelect(selectEl, items, selectedId, emptyLabel) {
  const options = [`<option value="">${escapeHtml(emptyLabel)}</option>`]
    .concat(items.map(item => `<option value="${item.id}"${item.id === selectedId ? ' selected' : ''}>${escapeHtml(item.name)}</option>`));
  selectEl.innerHTML = options.join('');
}

function sceneToDraft(scene) {
  const c = scene.character;
  return {
    id: scene.id,
    name: scene.name || '',
    backgroundId: scene.backgroundId || null,
    characterId: c ? c.assetId : null,
    x: c ? c.x : 0.5,
    y: c ? c.y : 0.72,
    scale: c ? c.scale : 1.0,
    flipX: c ? !!c.flipX : false,
    visible: c ? c.visible !== false : true,
    dialogueSetId: scene.dialogueSetId || null,
  };
}

function draftToPayload() {
  return {
    name: draft.name.trim(),
    backgroundId: draft.backgroundId,
    character: draft.characterId ? { assetId: draft.characterId, x: draft.x, y: draft.y, scale: draft.scale, flipX: draft.flipX, visible: draft.visible } : null,
    dialogueSetId: draft.dialogueSetId,
  };
}

function syncControlsFromDraft() {
  el.bgSelect.value = draft.backgroundId || '';
  el.charSelect.value = draft.characterId || '';
  el.xRange.value = draft.x;
  el.yRange.value = draft.y;
  el.scaleRange.value = draft.scale;
  el.xVal.textContent = draft.x.toFixed(2);
  el.yVal.textContent = draft.y.toFixed(2);
  el.scaleVal.textContent = draft.scale.toFixed(2);
  el.flipBtn.textContent = `FLIP HORIZONTAL: ${draft.flipX ? 'ON' : 'OFF'}`;
  el.flipBtn.classList.toggle('active', draft.flipX);
  el.visibleBtn.textContent = draft.visible ? 'HIDE CHARACTER' : 'SHOW CHARACTER';
  el.visibleBtn.classList.toggle('active', draft.visible);
  el.dialogueSelect.value = draft.dialogueSetId || '';
  el.nameInput.value = draft.name;
  el.pageTitle.textContent = draft.id ? 'EDIT SCENE' : 'SCENE EDITOR';
}

function renderPreview() {
  const messages = [];

  if (!draft.backgroundId) {
    el.previewBg.style.backgroundImage = 'none';
    el.previewBg.classList.add('placeholder');
    messages.push('NO BACKGROUND SELECTED');
  } else {
    const bg = findAsset(state.backgrounds, draft.backgroundId);
    if (!bg) {
      el.previewBg.style.backgroundImage = 'none';
      el.previewBg.classList.add('placeholder');
      messages.push('MISSING BACKGROUND ASSET');
    } else {
      el.previewBg.style.backgroundImage = `url(${bg.dataUrl})`;
      el.previewBg.classList.remove('placeholder');
    }
  }

  if (!draft.characterId) {
    el.previewChar.classList.add('hidden');
    messages.push('NO CHARACTER SELECTED');
  } else {
    const char = findAsset(state.characters, draft.characterId);
    if (!char) {
      el.previewChar.classList.add('hidden');
      messages.push('MISSING CHARACTER ASSET');
    } else if (!draft.visible) {
      el.previewChar.classList.add('hidden');
    } else {
      el.previewChar.src = char.dataUrl;
      el.previewChar.classList.remove('hidden');
      el.previewChar.style.left = `${draft.x * 100}%`;
      el.previewChar.style.top = `${draft.y * 100}%`;
      el.previewChar.style.transform = `translate(-50%, -50%) scale(${draft.scale}) scaleX(${draft.flipX ? -1 : 1})`;
    }
  }

  el.previewMsg.textContent = messages.join('\n');
  el.previewMsg.classList.toggle('hidden', messages.length === 0);
}

function readSceneQueryId() {
  return new URLSearchParams(location.search).get('id');
}

async function loadAssetLists() {
  const [backgrounds, characters] = await Promise.all([
    AssetDB.getAssetsByType('background'),
    AssetDB.getAssetsByType('character'),
  ]);
  state.backgrounds = backgrounds;
  state.characters = characters;
  fillSelect(el.bgSelect, backgrounds, draft.backgroundId, '— 배경 없음 —');
  fillSelect(el.charSelect, characters, draft.characterId, '— 캐릭터 없음 —');
}

async function loadDialogueSelect() {
  const sets = await DialogueDB.getDialogueSets();
  fillSelect(el.dialogueSelect, sets, draft.dialogueSetId, '— 대사 없음 —');
}

async function refreshSceneList() {
  let scenes = [];
  try {
    scenes = await SceneDB.getAllScenes();
  } catch (e) {
    el.sceneList.innerHTML = `<div class="scene-empty">Scene 목록을 불러오지 못했습니다.</div>`;
    return;
  }
  if (!scenes.length) {
    el.sceneList.innerHTML = `<div class="scene-empty">저장된 Scene이 없습니다.</div>`;
    return;
  }
  el.sceneList.innerHTML = scenes.map(scene => `
    <div class="scene-card" data-id="${scene.id}">
      <div class="scene-card-name">${escapeHtml(scene.name)}</div>
      <div class="scene-card-meta">${new Date(scene.updatedAt).toLocaleString('ko-KR')}</div>
      <div class="scene-card-actions">
        <button type="button" class="primary" data-action="edit">EDIT</button>
        <button type="button" class="primary" data-action="use">USE IN TEST</button>
        <button type="button" data-action="duplicate">DUPLICATE</button>
        <button type="button" class="danger" data-action="delete">DELETE</button>
      </div>
    </div>
  `).join('');
}

el.sceneList.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const card = e.target.closest('.scene-card');
  const id = card.dataset.id;
  const action = btn.dataset.action;

  if (action === 'edit') {
    location.href = `/dev/scene/?id=${encodeURIComponent(id)}`;
  } else if (action === 'use') {
    SceneGameState.setSelectedSceneId(id);
    location.href = '/dev/game/';
  } else if (action === 'duplicate') {
    await SceneDB.duplicateScene(id);
    toast('SCENE DUPLICATED');
    await refreshSceneList();
  } else if (action === 'delete') {
    if (!confirm('이 Scene을 삭제하시겠습니까?')) return;
    await SceneDB.deleteScene(id);
    if (draft.id === id) {
      draft = defaultDraft();
      loadedScene = null;
      history.replaceState(null, '', '/dev/scene/');
      syncControlsFromDraft();
      renderPreview();
    }
    toast('SCENE DELETED');
    await refreshSceneList();
  }
});

async function saveCurrentDraft() {
  if (!draft.name.trim()) {
    toast('SCENE NAME을 입력하세요');
    el.nameInput.focus();
    return null;
  }
  const payload = draftToPayload();
  let saved;
  if (draft.id) saved = await SceneDB.updateScene(draft.id, payload);
  else saved = await SceneDB.addScene(payload);
  draft.id = saved.id;
  loadedScene = saved;
  history.replaceState(null, '', `/dev/scene/?id=${encodeURIComponent(saved.id)}`);
  syncControlsFromDraft();
  await refreshSceneList();
  return saved;
}

el.saveBtn.addEventListener('click', async () => {
  const saved = await saveCurrentDraft();
  if (saved) toast('SCENE SAVED');
});

el.useInGameBtn.addEventListener('click', async () => {
  const saved = await saveCurrentDraft();
  if (!saved) return;
  toast('SCENE SAVED');
  SceneGameState.setSelectedSceneId(saved.id);
  location.href = '/dev/game/';
});

el.bgSelect.addEventListener('change', () => {
  draft.backgroundId = el.bgSelect.value || null;
  renderPreview();
});
el.charSelect.addEventListener('change', () => {
  draft.characterId = el.charSelect.value || null;
  renderPreview();
});
el.dialogueSelect.addEventListener('change', () => {
  draft.dialogueSetId = el.dialogueSelect.value || null;
});
el.nameInput.addEventListener('input', () => { draft.name = el.nameInput.value; });

el.xRange.addEventListener('input', () => {
  draft.x = Number(el.xRange.value);
  el.xVal.textContent = draft.x.toFixed(2);
  renderPreview();
});
el.yRange.addEventListener('input', () => {
  draft.y = Number(el.yRange.value);
  el.yVal.textContent = draft.y.toFixed(2);
  renderPreview();
});
el.scaleRange.addEventListener('input', () => {
  draft.scale = Number(el.scaleRange.value);
  el.scaleVal.textContent = draft.scale.toFixed(2);
  renderPreview();
});
el.flipBtn.addEventListener('click', () => {
  draft.flipX = !draft.flipX;
  el.flipBtn.textContent = `FLIP HORIZONTAL: ${draft.flipX ? 'ON' : 'OFF'}`;
  el.flipBtn.classList.toggle('active', draft.flipX);
  renderPreview();
});
el.visibleBtn.addEventListener('click', () => {
  draft.visible = !draft.visible;
  el.visibleBtn.textContent = draft.visible ? 'HIDE CHARACTER' : 'SHOW CHARACTER';
  el.visibleBtn.classList.toggle('active', draft.visible);
  renderPreview();
});

// Drag-to-position: pointer capture keeps delivering pointermove to
// previewChar even once the finger/cursor leaves the image's own bounds.
let dragging = false;
el.previewChar.addEventListener('pointerdown', (e) => {
  if (!draft.characterId) return;
  dragging = true;
  el.previewChar.setPointerCapture(e.pointerId);
  el.previewChar.style.cursor = 'grabbing';
});
el.previewChar.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const rect = el.previewBox.getBoundingClientRect();
  const nx = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  const ny = Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height));
  draft.x = Math.round(nx * 100) / 100;
  draft.y = Math.round(ny * 100) / 100;
  el.xRange.value = draft.x;
  el.yRange.value = draft.y;
  el.xVal.textContent = draft.x.toFixed(2);
  el.yVal.textContent = draft.y.toFixed(2);
  renderPreview();
});
function stopDrag(e) {
  if (!dragging) return;
  dragging = false;
  el.previewChar.style.cursor = 'grab';
}
el.previewChar.addEventListener('pointerup', stopDrag);
el.previewChar.addEventListener('pointercancel', stopDrag);

el.resetDraftBtn.addEventListener('click', () => {
  draft = loadedScene ? sceneToDraft(loadedScene) : defaultDraft();
  syncControlsFromDraft();
  renderPreview();
  toast('DRAFT RESET');
});

// Reuses the Dialogue Editor's own sample set (same fixed id, same
// buildSampleDialogueSet()) instead of a second hardcoded Mina conversation,
// so /dev/scene and /dev/dialogue agree on what "the sample dialogue" is.
async function applySampleValues() {
  draft.name = draft.name || 'Mina Test Scene';
  draft.backgroundId = state.backgrounds[0] ? state.backgrounds[0].id : null;
  draft.characterId = state.characters[0] ? state.characters[0].id : null;
  draft.x = 0.5;
  draft.y = 0.62;
  draft.scale = 1.1;
  draft.flipX = false;
  draft.visible = true;
  await DialogueDB.saveDialogueSet(buildSampleDialogueSet());
  draft.dialogueSetId = SAMPLE_DIALOGUE_SET_ID;
}

el.loadSampleBtn.addEventListener('click', async () => {
  if (!state.backgrounds.length || !state.characters.length) {
    toast('먼저 /dev/upload 에서 배경/캐릭터를 업로드하세요');
    return;
  }
  await applySampleValues();
  fillSelect(el.bgSelect, state.backgrounds, draft.backgroundId, '— 배경 없음 —');
  fillSelect(el.charSelect, state.characters, draft.characterId, '— 캐릭터 없음 —');
  await loadDialogueSelect();
  syncControlsFromDraft();
  renderPreview();
  toast('SAMPLE LOADED (저장되지 않음)');
});

el.createSampleBtn.addEventListener('click', async () => {
  if (!state.backgrounds.length || !state.characters.length) {
    toast('먼저 /dev/upload 에서 배경/캐릭터를 업로드하세요');
    return;
  }
  draft = defaultDraft();
  await applySampleValues();
  const saved = await saveCurrentDraft();
  if (saved) toast('SAMPLE SCENE CREATED');
});

el.clearAllBtn.addEventListener('click', async () => {
  if (!confirm('저장된 모든 Scene을 삭제하시겠습니까?')) return;
  const scenes = await SceneDB.getAllScenes();
  await Promise.all(scenes.map(s => SceneDB.deleteScene(s.id)));
  draft = defaultDraft();
  loadedScene = null;
  history.replaceState(null, '', '/dev/scene/');
  syncControlsFromDraft();
  renderPreview();
  toast('ALL SCENES CLEARED');
  await refreshSceneList();
});

(async function init() {
  const existingId = readSceneQueryId();
  if (existingId) {
    try {
      const scene = await SceneDB.getScene(existingId);
      if (scene) {
        draft = sceneToDraft(scene);
        loadedScene = scene;
      } else {
        toast('Scene을 찾을 수 없습니다. 새 Scene으로 시작합니다.');
      }
    } catch (e) {
      toast('Scene을 불러오지 못했습니다.');
    }
  }
  await loadAssetLists();
  await loadDialogueSelect();
  syncControlsFromDraft();
  renderPreview();
  await refreshSceneList();
})();
</script>
</body>
</html>
