<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · DEV GAME</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERATION MK DEV">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}

/* ===== Layer 0: frame (mobile viewport, 414x896-ish, safe-area aware) ===== */
/* --vh100 (set via JS from window.innerHeight) overrides dvh/vh when present —
   iOS Safari has a history of miscalculating 100dvh after certain navigation/
   scroll sequences, leaving a stale gap below the frame. */
.vn-frame{position:relative;width:100%;max-width:430px;height:100dvh;height:100vh;height:var(--vh100, 100vh);overflow:hidden;background:#0d1114}

/* ===== Layer 1: Background ===== */
.bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#0d1114;transition:background-image .2s ease, opacity 1.2s ease}
.bg-layer.bg-placeholder{background-image:linear-gradient(160deg,#171c22 0%,#0d1114 60%,#080a0c 100%)}

/* ===== Top bar (dev only, removable in real game) ===== */
.vn-topbar{position:absolute;top:0;left:0;right:0;z-index:5;padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px;display:flex;justify-content:space-between;align-items:center}
.vn-btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#fff;background:rgba(8,10,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.vn-btn.dev{color:var(--amber);border-color:rgba(214,168,75,.4)}

/* ===== Layer 2: Character ===== */
.char-wrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s ease}
.char-img{max-height:78%;max-width:88%;object-fit:contain;object-position:bottom;transform:translateY(0)}
.char-placeholder{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:46%;height:62%;opacity:.4;display:flex;align-items:flex-end;justify-content:center;color:var(--text-secondary)}
.char-placeholder svg{width:100%;height:100%}

/* ===== Layer 3: Dialogue ===== */
.dlg-layer{position:absolute;left:0;right:0;bottom:0;z-index:3;min-height:26vh;max-height:34vh;background:rgba(5,7,10,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.08);padding:18px 20px calc(18px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;cursor:pointer}
.dlg-name{font-size:15px;font-weight:700;color:var(--cyan);margin-bottom:8px;flex-shrink:0}
.dlg-name:empty{display:none}
.dlg-body{flex:1;font-size:16px;line-height:1.65;color:#fff;overflow-y:auto;white-space:pre-wrap;word-break:keep-all}
.dlg-foot{display:flex;justify-content:flex-end;padding-top:6px;flex-shrink:0}
.dlg-arrow{font-size:13px;color:var(--text-secondary);visibility:hidden}
@keyframes arrowBob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.dlg-arrow.show{visibility:visible;animation:arrowBob 1.1s ease-in-out infinite}
.dlg-end{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);letter-spacing:.08em;text-align:center;padding-top:8px}

/* ===== Bottom sheet: dev asset selector ===== */
.sheet-overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-overlay.hidden{display:none}
.sheet{width:100%;max-width:430px;background:var(--surface-1);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0));border-top:1px solid var(--divider)}
.sheet-title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-muted);margin-bottom:16px;text-transform:uppercase}
.sheet-field{margin-bottom:14px}
.sheet-field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase}
.sheet-field select{width:100%;background:var(--surface-2);color:var(--text-primary);border:1px solid var(--divider);border-radius:10px;padding:12px 14px;font-size:14px;font-family:inherit}
.sheet-close{width:100%;margin-top:6px;background:var(--surface-2);color:var(--text-primary);border:1px solid var(--divider);border-radius:10px;padding:13px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--mono);letter-spacing:.06em}
.sheet-link{display:block;text-align:center;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--text-muted)}

/* ===== Floating popup: character transform (top-right, doesn't cover the character) ===== */
.transform-popup{position:absolute;top:calc(52px + env(safe-area-inset-top,0));right:16px;z-index:10;width:190px;background:rgba(8,10,12,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.transform-popup.hidden{display:none}
.tp-title{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px}
.tp-field{margin-bottom:10px}
.tp-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--text-secondary);text-transform:uppercase;margin-bottom:4px}
.tp-val{color:var(--cyan);font-weight:600}
.tp-field input[type=range]{width:100%;accent-color:var(--cyan)}
.tp-confirm{width:100%;background:var(--cyan);color:#06181c;border:none;border-radius:8px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--mono);letter-spacing:.05em;margin-top:2px}
.tp-confirm:disabled{opacity:.4;cursor:default}
.transform-output{background:var(--surface-2);border:1px solid var(--divider);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:10px;color:var(--cyan);margin-top:10px;white-space:pre-wrap;word-break:break-all}
.transform-output.hidden{display:none}

/* ===== Opening cinematic: blackout -> "SYDNEY / 09:30" -> reveal ===== */
.intro-overlay{position:absolute;inset:0;z-index:9;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
.intro-overlay.hidden{opacity:0;pointer-events:none}
.intro-card{font-family:var(--mono);color:#fff;font-size:20px;letter-spacing:.18em;text-align:center;line-height:1.9;white-space:pre-line}

/* ===== Closing beat: fade to black + a small unexplained flash ===== */
.ending-fade .bg-layer{opacity:0}
.unknown-signal{position:absolute;bottom:calc(26vh + 14px);right:16px;z-index:6;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:rgba(255,255,255,.4);opacity:0;transition:opacity .3s ease}
.unknown-signal.show{opacity:1}
</style>
<script>
// iOS Safari's 100dvh has a history of getting stuck at a stale (too-small)
// value after certain navigation/scroll sequences, leaving a dead gap below
// the frame. window.innerHeight doesn't have that bug, so measure it
// ourselves and let --vh100 win over dvh/vh in the CSS below.
function setVh100() {
  document.documentElement.style.setProperty('--vh100', window.innerHeight + 'px');
}
setVh100();
window.addEventListener('resize', setVh100);
window.addEventListener('orientationchange', setVh100);
if (window.visualViewport) window.visualViewport.addEventListener('resize', setVh100);
</script>
</head>
<body>
<div class="vn-frame" id="frame">
  <div class="bg-layer bg-placeholder" id="bgLayer"></div>

  <div class="char-wrap" id="charWrap">
    <img class="char-img" id="charImg" style="display:none" alt="">
    <div class="char-placeholder" id="charPlaceholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
    </div>
  </div>

  <div class="vn-topbar">
    <a class="vn-btn" href="/dev/">← DEV</a>
    <div style="display:flex;gap:8px">
      <button class="vn-btn dev" id="transformBtn">POS</button>
      <button class="vn-btn dev" id="devBtn">DEV</button>
    </div>
  </div>

  <div class="transform-popup hidden" id="transformPopup">
    <div class="tp-title">Character Transform</div>
    <div class="tp-field">
      <div class="tp-row"><label>X</label><span class="tp-val" id="xVal">0</span></div>
      <input type="range" id="xRange" min="-150" max="150" value="0">
    </div>
    <div class="tp-field">
      <div class="tp-row"><label>Y</label><span class="tp-val" id="yVal">0</span></div>
      <input type="range" id="yRange" min="-150" max="150" value="0">
    </div>
    <div class="tp-field">
      <div class="tp-row"><label>Scale</label><span class="tp-val" id="scaleVal">1.00</span></div>
      <input type="range" id="scaleRange" min="50" max="150" value="100">
    </div>
    <button class="tp-confirm" id="confirmTransformBtn">위치 확정</button>
    <pre class="transform-output hidden" id="transformOutput"></pre>
  </div>

  <div class="dlg-layer" id="dlgLayer">
    <div class="dlg-name" id="speakerName"></div>
    <div class="dlg-body" id="dialogueText"></div>
    <div class="dlg-foot"><span class="dlg-arrow" id="tapArrow">▼</span></div>
  </div>

  <span class="unknown-signal" id="unknownSignal">UNKNOWN SIGNAL</span>

  <div class="intro-overlay" id="introOverlay">
    <div class="intro-card" id="introCard"></div>
  </div>
</div>

<div class="sheet-overlay hidden" id="sheetOverlay">
  <div class="sheet">
    <div class="sheet-title">Dev · Asset Selector</div>
    <div class="sheet-field">
      <label>Background</label>
      <select id="bgSelect"></select>
    </div>

    <button class="sheet-close" id="sheetCloseBtn">CLOSE</button>
    <a class="sheet-link" id="uploadLink" href="/dev/upload/">+ 새 이미지 업로드</a>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script src="/dev/assetDb.js"></script>
<script src="/dev/dialogueData.js"></script>
<script src="/dev/vnPlayer.js"></script>
<script>
// /dev/week1 links here as /dev/game/?scene=<id> — fall back to the first
// scene so a bare /dev/game/ link still works.
const requestedSceneId = new URLSearchParams(location.search).get('scene');
const activeSceneData = week1Scenes.find(s => s.id === requestedSceneId) || week1Scenes[0];
const activeLines = activeSceneData.lines.map(l => ({ speaker: l.speaker, text: l.text, characterId: l.characterId, expression: l.expression, pauseBeforeMs: l.pauseBeforeMs }));

const el = {
  frame: document.getElementById('frame'),
  bgLayer: document.getElementById('bgLayer'),
  charWrap: document.getElementById('charWrap'),
  charImg: document.getElementById('charImg'),
  charPlaceholder: document.getElementById('charPlaceholder'),
  dlgLayer: document.getElementById('dlgLayer'),
  speakerName: document.getElementById('speakerName'),
  dialogueText: document.getElementById('dialogueText'),
  tapArrow: document.getElementById('tapArrow'),
  devBtn: document.getElementById('devBtn'),
  sheetOverlay: document.getElementById('sheetOverlay'),
  sheetCloseBtn: document.getElementById('sheetCloseBtn'),
  bgSelect: document.getElementById('bgSelect'),
  uploadLink: document.getElementById('uploadLink'),
  transformBtn: document.getElementById('transformBtn'),
  transformPopup: document.getElementById('transformPopup'),
  xRange: document.getElementById('xRange'),
  yRange: document.getElementById('yRange'),
  scaleRange: document.getElementById('scaleRange'),
  xVal: document.getElementById('xVal'),
  yVal: document.getElementById('yVal'),
  scaleVal: document.getElementById('scaleVal'),
  confirmTransformBtn: document.getElementById('confirmTransformBtn'),
  transformOutput: document.getElementById('transformOutput'),
  introOverlay: document.getElementById('introOverlay'),
  introCard: document.getElementById('introCard'),
  unknownSignal: document.getElementById('unknownSignal'),
};

function setBackground(asset) {
  if (asset && asset.dataUrl) {
    el.bgLayer.style.backgroundImage = `url(${asset.dataUrl})`;
    el.bgLayer.classList.remove('bg-placeholder');
  } else {
    el.bgLayer.style.backgroundImage = 'none';
    el.bgLayer.classList.add('bg-placeholder');
  }
}

function setCharacterAsset(asset) {
  if (asset && asset.dataUrl) {
    el.charImg.src = asset.dataUrl;
    el.charImg.style.display = '';
    el.charPlaceholder.style.display = 'none';
  } else {
    el.charImg.removeAttribute('src');
    el.charImg.style.display = 'none';
    el.charPlaceholder.style.display = '';
  }
}

async function applyBackground() {
  const bgAsset = await AssetDB.getAsset(DevGameState.getBackgroundId());
  if (bgAsset) await AssetDB.preloadImage(bgAsset.dataUrl);
  setBackground(bgAsset);
}

// Warms both the metadata cache and the browser's own image cache for every
// (character, expression) pair a line might show, before the first line is
// shown — a mid-dialogue character/expression swap then never waits on the
// network, which is what made the character portrait visibly lag behind the text.
async function preloadCharacterAssetsForLines(lines) {
  const pairs = new Map();
  lines.forEach(l => {
    if (!l.characterId) return;
    pairs.set(`${l.characterId}::${l.expression || 'neutral'}`, l);
  });
  await Promise.all([...pairs.values()].map(async (l) => {
    const assetId = DevGameState.getCharacterAssetId(l.characterId, l.expression);
    if (!assetId) return;
    const asset = await AssetDB.getAsset(assetId).catch(() => null);
    if (asset) await AssetDB.preloadImage(asset.dataUrl);
  }));
}

function applyTransformToImage(transform) {
  el.charImg.style.transform = `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`;
}

// Each named character (from dialogueCharacters) has its own uploaded asset
// per expression, and its own CharacterTransform (x/y/scale) — looked up per
// dialogue line's (characterId, expression) pair.
async function applyCharacterForLine(characterId, expression) {
  if (!characterId) {
    el.charWrap.style.opacity = '0';
    return;
  }
  el.charWrap.style.opacity = '1';
  const assetId = DevGameState.getCharacterAssetId(characterId, expression);
  const asset = await AssetDB.getAsset(assetId);
  setCharacterAsset(asset);
  applyTransformToImage(DevGameState.getCharacterTransform(characterId));
}

function updateArrow(show) {
  el.tapArrow.classList.toggle('show', !!show);
}

// 화면 암전 → 장소/시간 타자기 효과 → 0.8초 정지 → 배경 등장.
function playIntro() {
  const text = `${activeSceneData.introLabel}\n${activeSceneData.time}`;
  return new Promise(resolve => {
    let i = 0;
    const timer = setInterval(() => {
      i++;
      el.introCard.textContent = text.slice(0, i);
      if (i >= text.length) {
        clearInterval(timer);
        setTimeout(() => {
          el.introOverlay.classList.add('hidden');
          resolve();
        }, 800);
      }
    }, 70);
  });
}

// 마지막 대사 직전: 배경이 서서히 어두워지고, 짧은 진동과 함께 화면 우측 아래에
// "UNKNOWN SIGNAL"이 아주 잠깐 떴다 사라진다. 지수·영우는 알아채지 못한다 —
// 공포 연출이나 과도한 글리치 없이, 플레이어만 위화감을 느끼는 정도로.
function playEndingSequence() {
  el.frame.classList.add('ending-fade');
  if (navigator.vibrate) navigator.vibrate(150);
  setTimeout(() => {
    el.unknownSignal.classList.add('show');
    setTimeout(() => el.unknownSignal.classList.remove('show'), 700);
  }, 900);
}

// Scene 001 has no nextSceneId and just loops (onComplete -> restart()), so
// its "UNKNOWN SIGNAL" foreshadowing beat plays on every loop. A scene with
// nextSceneId hands off elsewhere instead (e.g. into a minigame) and skips
// that beat — it's tonally specific to scene 001's ending, not a generic one.
//
// Each built minigame gets its own standalone page (not routed through
// /dev/game, since gameplay differs too much from tap-to-advance dialogue).
// A nextSceneId with no route here isn't built yet, so it just shows a
// placeholder overlay instead of navigating to a dead page.
const MINIGAME_ROUTES = {
  'week1-scene-001-2-minigame': '/dev/minigame-eastwood/',
  'week1-scene-002-2': '/dev/minigame-phone/',
};

function playMinigameTransition(nextSceneId) {
  const route = MINIGAME_ROUTES[nextSceneId];
  if (route) {
    location.href = route;
    return;
  }
  el.introCard.textContent = 'MINIGAME START';
  el.introOverlay.classList.remove('hidden');
  console.log('[OPERATION MK] scene complete -> nextSceneId:', nextSceneId, '(not yet built)');
}

const player = createVNPlayer({
  onLineChange: (line, index, total) => {
    el.speakerName.textContent = line.speaker || '';
    applyCharacterForLine(line.characterId, line.expression);
    if (index === total - 1 && !activeSceneData.nextSceneId) {
      playEndingSequence();
    } else {
      // restart() loops back to line 0 — undo the ending fade/signal from last time.
      el.frame.classList.remove('ending-fade');
      el.unknownSignal.classList.remove('show');
    }
    // Keep the transform popup in sync if it's left open while tapping through lines.
    if (!el.transformPopup.classList.contains('hidden')) loadTransformIntoSliders();
  },
  onTextUpdate: (text) => { el.dialogueText.textContent = text; },
  onArrow: updateArrow,
  onComplete: () => {
    if (activeSceneData.nextSceneId) {
      playMinigameTransition(activeSceneData.nextSceneId);
    } else {
      player.restart();
    }
  },
});

function onTap() {
  player.tap();
}

el.uploadLink.href = '/dev/upload/';

// Character portraits are driven entirely by each line's (characterId,
// expression) pair looked up in 인물 DB (/dev/upload) — this sheet only
// needs a manual override for the one shared background used everywhere.
async function renderAssetSelectors() {
  const bgs = await AssetDB.getAssetsByType('background');
  fillSelect(el.bgSelect, bgs, DevGameState.getBackgroundId());
}

function fillSelect(selectEl, assets, selectedId) {
  const options = ['<option value="">— 기본(없음) —</option>']
    .concat(assets.map(a => `<option value="${a.id}"${a.id === selectedId ? ' selected' : ''}>${escapeHtml(a.name)}</option>`));
  selectEl.innerHTML = options.join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function readSliderTransform() {
  return { x: Number(el.xRange.value), y: Number(el.yRange.value), scale: Number(el.scaleRange.value) / 100 };
}

function updateSliderLabels(transform) {
  el.xVal.textContent = transform.x;
  el.yVal.textContent = transform.y;
  el.scaleVal.textContent = transform.scale.toFixed(2);
}

// Sliders always edit the character currently on screen (the active line's characterId).
function loadTransformIntoSliders() {
  const characterId = activeLines[player.getState().index].characterId;
  const transform = DevGameState.getCharacterTransform(characterId);
  el.xRange.value = transform.x;
  el.yRange.value = transform.y;
  el.scaleRange.value = Math.round(transform.scale * 100);
  updateSliderLabels(transform);
  el.transformOutput.classList.add('hidden');
  const disabled = !characterId;
  [el.xRange, el.yRange, el.scaleRange, el.confirmTransformBtn].forEach(input => { input.disabled = disabled; });
}

[el.xRange, el.yRange, el.scaleRange].forEach(rangeEl => rangeEl.addEventListener('input', () => {
  const transform = readSliderTransform();
  updateSliderLabels(transform);
  applyTransformToImage(transform);
}));

el.confirmTransformBtn.addEventListener('click', () => {
  const characterId = activeLines[player.getState().index].characterId;
  if (!characterId) return;
  const transform = readSliderTransform();
  DevGameState.setCharacterTransform(characterId, transform);
  el.transformOutput.textContent = JSON.stringify({ characterId, ...transform }, null, 2);
  el.transformOutput.classList.remove('hidden');
});

el.frame.addEventListener('click', onTap);

el.devBtn.addEventListener('click', async (e) => {
  e.stopPropagation();
  await renderAssetSelectors();
  el.sheetOverlay.classList.remove('hidden');
});
el.sheetCloseBtn.addEventListener('click', () => el.sheetOverlay.classList.add('hidden'));
el.sheetOverlay.addEventListener('click', (e) => {
  if (e.target === el.sheetOverlay) el.sheetOverlay.classList.add('hidden');
});
el.bgSelect.addEventListener('change', async (e) => {
  DevGameState.setBackgroundId(e.target.value || null);
  await applyBackground();
});

el.transformBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const willShow = el.transformPopup.classList.contains('hidden');
  if (willShow) loadTransformIntoSliders();
  el.transformPopup.classList.toggle('hidden', !willShow);
});
// The popup floats over the tappable game frame — swallow clicks inside it
// so dragging a slider or hitting 확정 doesn't also advance the dialogue.
el.transformPopup.addEventListener('click', (e) => e.stopPropagation());

(async function init() {
  await applyBackground();
  await preloadCharacterAssetsForLines(activeLines);
  await playIntro();
  player.load(activeLines);
})();
</script>
</body>
</html>
