<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · APP START</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERATION MK DEV">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}

/* Full-bleed title screen — this is what a player sees the instant the app
   opens, so it fills the whole frame instead of the usual scrolling page
   layout the other /dev pages use. */
.frame{position:relative;width:100%;max-width:430px;min-height:100dvh;min-height:100vh;overflow:hidden;touch-action:none}

.bg-layer{position:absolute;inset:0;background-size:cover;background-color:#0d1114;transition:background-image .2s ease;cursor:grab}
.bg-layer.placeholder{background-image:linear-gradient(160deg,#171c22 0%,#0d1114 60%,#080a0c 100%)}
.bg-layer.dragging{cursor:grabbing}

.topbar{position:absolute;top:0;left:0;right:0;z-index:5;padding:calc(14px + env(safe-area-inset-top,0)) 16px 0;display:flex;justify-content:space-between;align-items:center}
.back-btn{width:36px;height:36px;border-radius:50%;background:rgba(8,10,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.bg-upload-btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:#fff;background:rgba(8,10,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:9px 13px;cursor:pointer}
.drag-hint{position:absolute;top:calc(58px + env(safe-area-inset-top,0));left:0;right:0;z-index:4;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:rgba(255,255,255,.55);pointer-events:none}

.reset-bg-link{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0));transform:translateX(-50%);z-index:3;font-family:var(--mono);font-size:11px;color:var(--text-muted);background:rgba(8,10,12,.5);border:none;border-radius:12px;padding:5px 10px;cursor:pointer;text-decoration:underline}
.reset-bg-link.hidden{display:none}

/* Freely-positioned buttons: dragged to place, tapped to trigger. Position
   and width are stored as a fraction of the frame so they stay put across
   reloads and viewport sizes. */
.float-btn{position:absolute;transform:translate(-50%,-50%);z-index:3;display:flex;align-items:center;justify-content:center;padding:16px 10px;border-radius:14px;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.05em;cursor:grab;user-select:none;touch-action:none;filter:brightness(1);transition:filter .1s,background-color .1s}
.float-btn.pressed{filter:brightness(.6)}
.float-btn.start{background:var(--cyan);color:#06181c;border:none}
.btn-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}

/* Small grab handle at each floating button's bottom-right corner — drag it
   diagonally to resize width and height independently around its own center. */
.resize-handle{position:absolute;right:-10px;bottom:-10px;width:22px;height:22px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;cursor:nwse-resize;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.45)}

</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="bg-layer placeholder" id="bgLayer"></div>

  <div class="topbar">
    <a class="back-btn" href="/dev/">←</a>
    <button class="bg-upload-btn" id="bgUploadBtn">배경 이미지 테스트</button>
    <input type="file" id="bgInput" accept="image/jpeg,image/png,image/webp" style="display:none">
  </div>
  <div class="drag-hint">배경을 드래그하면 위치가 조정돼요</div>

  <button class="float-btn start" id="startBtn">
    <span class="btn-label">시작하기</span>
    <span class="resize-handle" id="startResizeHandle">↘</span>
  </button>

  <button class="reset-bg-link hidden" id="resetBgBtn">기본 배경으로 초기화</button>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script>
// Everything below is local-preview state for testers — no backend involved.
// Background image/position and button placement persist in localStorage so
// a layout arrangement survives a reload.
const BG_IMG_KEY = 'mkDevStartScreenBg';
const BG_POS_KEY = 'mkDevStartScreenBgPos';
const BTN_POS_KEY = 'mkDevStartScreenBtnPos';
const DRAG_THRESHOLD = 6; // px of movement before a press counts as a drag, not a tap

const el = {
  frame: document.getElementById('frame'),
  bgLayer: document.getElementById('bgLayer'),
  bgUploadBtn: document.getElementById('bgUploadBtn'),
  bgInput: document.getElementById('bgInput'),
  resetBgBtn: document.getElementById('resetBgBtn'),
  startBtn: document.getElementById('startBtn'),
  startResizeHandle: document.getElementById('startResizeHandle'),
};

function goToRealStart() { location.href = '/dev/week0/'; }

/* ===== Background image + drag-to-pan position ===== */
function loadBgPos() {
  try { return JSON.parse(localStorage.getItem(BG_POS_KEY)) || { x: 50, y: 50 }; }
  catch (e) { return { x: 50, y: 50 }; }
}
let bgPos = loadBgPos();

function renderBgPos() {
  el.bgLayer.style.backgroundPosition = `${bgPos.x}% ${bgPos.y}%`;
}

function applyBackground(dataUrl) {
  if (dataUrl) {
    el.bgLayer.classList.remove('placeholder');
    el.bgLayer.style.backgroundImage = `url("${dataUrl}")`;
    el.resetBgBtn.classList.remove('hidden');
  } else {
    el.bgLayer.classList.add('placeholder');
    el.bgLayer.style.backgroundImage = '';
    el.resetBgBtn.classList.add('hidden');
  }
}

el.bgUploadBtn.addEventListener('click', () => el.bgInput.click());
el.bgInput.addEventListener('change', () => {
  const file = el.bgInput.files && el.bgInput.files[0];
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = () => {
    localStorage.setItem(BG_IMG_KEY, reader.result);
    applyBackground(reader.result);
  };
  reader.readAsDataURL(file);
});

el.resetBgBtn.addEventListener('click', () => {
  localStorage.removeItem(BG_IMG_KEY);
  applyBackground(null);
});

let bgDrag = null;
el.bgLayer.addEventListener('pointerdown', (e) => {
  el.bgLayer.setPointerCapture(e.pointerId);
  el.bgLayer.classList.add('dragging');
  bgDrag = { x: e.clientX, y: e.clientY, startPos: { ...bgPos } };
});
el.bgLayer.addEventListener('pointermove', (e) => {
  if (!bgDrag) return;
  const rect = el.frame.getBoundingClientRect();
  const dx = e.clientX - bgDrag.x, dy = e.clientY - bgDrag.y;
  bgPos = {
    x: clamp(bgDrag.startPos.x - (dx / rect.width) * 100, 0, 100),
    y: clamp(bgDrag.startPos.y - (dy / rect.height) * 100, 0, 100),
  };
  renderBgPos();
});
['pointerup', 'pointercancel'].forEach(evt => el.bgLayer.addEventListener(evt, () => {
  if (!bgDrag) return;
  bgDrag = null;
  el.bgLayer.classList.remove('dragging');
  localStorage.setItem(BG_POS_KEY, JSON.stringify(bgPos));
}));

function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }

/* ===== Freely-positioned 시작하기 button ===== */
function loadBtnPos() {
  const defaults = { start: { x: 50, y: 80, w: 46, h: 7 } };
  try {
    const saved = JSON.parse(localStorage.getItem(BTN_POS_KEY));
    return { start: Object.assign({}, defaults.start, saved && saved.start) };
  } catch (e) {
    return defaults;
  }
}
let btnPos = loadBtnPos();

function renderBtnPos() {
  el.startBtn.style.left = btnPos.start.x + '%';
  el.startBtn.style.top = btnPos.start.y + '%';
  el.startBtn.style.width = btnPos.start.w + '%';
  el.startBtn.style.height = btnPos.start.h + '%';
}

function saveBtnPos() {
  localStorage.setItem(BTN_POS_KEY, JSON.stringify(btnPos));
}

function makeDraggable(buttonEl, posKey, onTap) {
  let drag = null;
  let pressedTimer = null;
  buttonEl.addEventListener('pointerdown', (e) => {
    buttonEl.setPointerCapture(e.pointerId);
    clearTimeout(pressedTimer);
    buttonEl.classList.add('pressed');
    const rect = el.frame.getBoundingClientRect();
    drag = { x: e.clientX, y: e.clientY, startPos: { ...btnPos[posKey] }, rect, moved: false };
  });
  buttonEl.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > DRAG_THRESHOLD) drag.moved = true;
    if (!drag.moved) return;
    btnPos[posKey] = {
      x: clamp(drag.startPos.x + (dx / drag.rect.width) * 100, 6, 94),
      y: clamp(drag.startPos.y + (dy / drag.rect.height) * 100, 6, 94),
    };
    renderBtnPos();
  });
  // A tap (as opposed to an actual drag) holds the pressed-darken for 0.2s,
  // clears it, then waits another 0.1s of plain state before firing onTap —
  // otherwise onTap (navigation) fires instantly and the page is gone before
  // the darken is ever seen.
  ['pointerup', 'pointercancel'].forEach(evt => buttonEl.addEventListener(evt, () => {
    if (!drag) return;
    const wasTap = !drag.moved;
    clearTimeout(pressedTimer);
    if (wasTap) {
      pressedTimer = setTimeout(() => {
        buttonEl.classList.remove('pressed');
        setTimeout(onTap, 100);
      }, 200);
    } else {
      buttonEl.classList.remove('pressed');
      saveBtnPos();
    }
    drag = null;
  }));
}

makeDraggable(el.startBtn, 'start', goToRealStart);

// Corner handle grows/shrinks the button symmetrically around its own
// center (opposite edges move equally), since position is anchored via
// translate(-50%,-50%) — dragging the handle by dx/dy moves that corner by
// dx/dy, so width/height each change by 2*dx / 2*dy, independently.
function makeResizable(handleEl, posKey) {
  let resize = null;
  handleEl.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    handleEl.setPointerCapture(e.pointerId);
    const rect = el.frame.getBoundingClientRect();
    resize = { x: e.clientX, y: e.clientY, startW: btnPos[posKey].w, startH: btnPos[posKey].h, rect };
  });
  handleEl.addEventListener('pointermove', (e) => {
    if (!resize) return;
    e.stopPropagation();
    const dx = e.clientX - resize.x, dy = e.clientY - resize.y;
    btnPos[posKey].w = clamp(resize.startW + (dx * 2 / resize.rect.width) * 100, 20, 92);
    btnPos[posKey].h = clamp(resize.startH + (dy * 2 / resize.rect.height) * 100, 6, 50);
    renderBtnPos();
  });
  ['pointerup', 'pointercancel'].forEach(evt => handleEl.addEventListener(evt, (e) => {
    if (!resize) return;
    e.stopPropagation();
    resize = null;
    saveBtnPos();
  }));
}

makeResizable(el.startResizeHandle, 'start');

renderBgPos();
renderBtnPos();
applyBackground(localStorage.getItem(BG_IMG_KEY));
</script>
</body>
</html>
