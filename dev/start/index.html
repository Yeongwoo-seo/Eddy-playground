<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MISSING KEY · APP START</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MISSING KEY DEV">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}

/* Full-bleed title screen — this is what a player sees the instant the app
   opens, so it fills the whole frame instead of the usual scrolling page
   layout the other /dev pages use. */
.frame{position:relative;width:100%;max-width:430px;min-height:100dvh;min-height:100vh;overflow:hidden;touch-action:none}

.bg-layer{position:absolute;inset:0;background-size:cover;background-color:#0d1114;transition:background-image .2s ease;cursor:grab}
.bg-layer.placeholder{background-image:linear-gradient(160deg,#171c22 0%,#0d1114 60%,#080a0c 100%)}
.bg-layer.dragging{cursor:grabbing}

.topbar{position:absolute;top:0;left:0;right:0;z-index:5;padding:calc(14px + env(safe-area-inset-top,0)) 16px 0;display:flex;justify-content:space-between;align-items:center}
.back-btn{width:36px;height:36px;border-radius:50%;background:rgba(8,10,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.bg-upload-btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:#fff;background:rgba(8,10,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:9px 13px;cursor:pointer}
.drag-hint{position:absolute;top:calc(58px + env(safe-area-inset-top,0));left:0;right:0;z-index:4;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:rgba(255,255,255,.55);pointer-events:none}

.reset-bg-link{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0));transform:translateX(-50%);z-index:3;font-family:var(--mono);font-size:11px;color:var(--text-muted);background:rgba(8,10,12,.5);border:none;border-radius:12px;padding:5px 10px;cursor:pointer;text-decoration:underline}
.reset-bg-link.hidden{display:none}

.bg-cutout-btn{position:absolute;left:50%;bottom:calc(38px + env(safe-area-inset-bottom,0));transform:translateX(-50%);z-index:3;font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:#fff;background:rgba(8,10,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:8px 13px;cursor:pointer}
.bg-cutout-btn.hidden{display:none}
.bg-cutout-btn[disabled]{opacity:.5;pointer-events:none}
.bg-cutout-progress{position:absolute;left:50%;bottom:calc(38px + env(safe-area-inset-bottom,0));transform:translateX(-50%);z-index:3;width:200px;max-width:80vw}
.bg-cutout-progress.hidden{display:none}
.bg-cutout-progress-text{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.8);text-align:center;margin-bottom:6px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.bg-cutout-progress-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.bg-cutout-progress-fill{height:100%;background:var(--cyan);width:0%;transition:width .2s ease}

/* 시작하기 버튼 크기 — 코너 핸들 드래그가 실기기 터치에서 먹통이 되는
   경우가 있어(핸들이 <button> 안에 중첩된 자식이라 iOS Safari 등에서
   히트테스트가 버튼 전체로 뭉개지는 사례가 보고됨), 숫자 입력을 항상
   되는 대안 경로로 둔다. 드래그 핸들은 그대로 남겨둔다(되는 기기에서는
   더 빠르므로). */
.size-controls{position:absolute;top:calc(58px + env(safe-area-inset-top,0) + 20px);left:16px;right:16px;z-index:4;display:flex;gap:10px;justify-content:center}
.size-field{display:flex;align-items:center;gap:6px;background:rgba(8,10,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:7px 10px}
.size-field label{font-family:var(--mono);font-size:10.5px;color:rgba(255,255,255,.7);white-space:nowrap}
.size-field input{width:44px;background:transparent;border:none;color:#fff;font-family:var(--mono);font-size:12.5px;text-align:right}
.size-field input:focus{outline:none}

/* Freely-positioned buttons: dragged to place, tapped to trigger. Position
   and width are stored as a fraction of the frame so they stay put across
   reloads and viewport sizes. */
.float-btn{position:absolute;transform:translate(-50%,-50%);z-index:3;display:flex;align-items:center;justify-content:center;padding:16px 10px;border-radius:14px;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.05em;cursor:grab;user-select:none;touch-action:none;filter:brightness(1);transition:filter .1s,background-color .1s}
.float-btn.pressed{filter:brightness(.6)}
.float-btn.start{background:var(--cyan);color:#06181c;border:none}
.btn-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}

/* Small grab handle at each floating button's bottom-right corner — drag it
   diagonally to resize width and height independently around its own center. */
.resize-handle{position:absolute;right:-10px;bottom:-10px;width:22px;height:22px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;cursor:nwse-resize;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.45)}

/* 게임 스타트(시작하기) → 주차 선택 화면. /play/와 동일한 검은 화면 +
   /schedule.html 홈 카드와 같은 스타일의 세로 카드 리스트(1~4주차 + 미니게임).
   2/3/4주차는 아직 구현되지 않아 ???로 잠가둔다. */
.week-select{position:absolute;inset:0;z-index:10;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.week-select.show{display:flex}
.week-grid{display:flex;flex-direction:column;gap:14px;width:100%;max-width:360px}
.week-tile{position:relative;height:120px;border-radius:24px;overflow:hidden;background:linear-gradient(135deg,#1b2a4a 0%,#0d1420 100%)}
.week-tile::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 0%,rgba(0,0,0,.15) 40%,rgba(0,0,0,.75) 100%)}
.week-tile.active{cursor:pointer;transition:transform .15s}
.week-tile.active:active{transform:scale(.98)}
.week-tile.locked{cursor:not-allowed;background:linear-gradient(135deg,#14171c 0%,#000 100%);filter:grayscale(.2)}
.week-tile.minigame{background:linear-gradient(135deg,#2a1b3d 0%,#120d20 100%)}
.week-tile-body{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;color:#fff}
.week-tile-emoji{font-size:20px;margin-bottom:4px;display:block}
.week-tile-name{font-family:var(--sans);font-size:17px;font-weight:800}
.week-tile-desc{font-family:var(--sans);font-size:12px;color:rgba(255,255,255,.8);font-weight:500;margin-top:3px;line-height:1.5}

.minigame-select{position:absolute;inset:0;z-index:11;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
.minigame-select.show{display:flex}
.minigame-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.minigame-item{background:var(--surface-1);border:1px solid var(--divider);border-radius:16px;padding:16px 18px;color:var(--text-primary);font-family:var(--sans);font-weight:700;font-size:15px;text-align:center;cursor:pointer}
.minigame-item:active{background:var(--surface-2)}
.week-back{background:none;border:none;color:var(--text-secondary);font-family:var(--sans);font-size:13px;padding:8px;cursor:pointer}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="bg-layer placeholder" id="bgLayer"></div>

  <div class="topbar">
    <a class="back-btn" href="/dev/">←</a>
    <button class="bg-upload-btn" id="bgUploadBtn">배경 이미지 테스트</button>
    <input type="file" id="bgInput" accept="image/jpeg,image/png,image/webp" style="display:none">
  </div>
  <div class="drag-hint">배경을 드래그하면 위치가 조정돼요</div>

  <div class="size-controls" id="sizeControls">
    <div class="size-field">
      <label for="btnWidthInput">버튼 너비</label>
      <input type="number" id="btnWidthInput" min="20" max="92" step="1">
      <label for="btnWidthInput">%</label>
    </div>
    <div class="size-field">
      <label for="btnHeightInput">버튼 높이</label>
      <input type="number" id="btnHeightInput" min="6" max="50" step="1">
      <label for="btnHeightInput">%</label>
    </div>
  </div>

  <button class="float-btn start" id="startBtn">
    <span class="btn-label">시작하기</span>
    <span class="resize-handle" id="startResizeHandle">↘</span>
  </button>

  <button class="reset-bg-link hidden" id="resetBgBtn">기본 배경으로 초기화</button>
  <button class="bg-cutout-btn hidden" id="bgCutoutBtn">배경 제거 (누끼)</button>
  <div class="bg-cutout-progress hidden" id="bgCutoutProgress">
    <div class="bg-cutout-progress-text" id="bgCutoutProgressText"></div>
    <div class="bg-cutout-progress-bar"><div class="bg-cutout-progress-fill" id="bgCutoutProgressFill"></div></div>
  </div>

  <div class="week-select" id="weekSelect">
    <div class="week-grid" id="weekGrid"></div>
  </div>

  <div class="minigame-select" id="minigameSelect">
    <button class="week-back" id="minigameBackBtn">‹ 뒤로</button>
    <div class="minigame-list" id="minigameList"></div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script src="/dev/assetDb.js"></script>
<script>
// Background image is uploaded to AssetDB (Supabase Storage, same as every
// other game background) and its assetId + bg/button position are saved to
// AssetDB.getGameSettings()'s startScreen field — that's what makes this
// screen look the same on every device instead of only the one it was set
// up on. localStorage keeps a small local echo (public URL string + the
// same position JSON) purely so this editor still paints instantly on
// reload without waiting on a network round trip.
const BG_IMG_KEY = 'mkDevStartScreenBg';
const BG_POS_KEY = 'mkDevStartScreenBgPos';
const BTN_POS_KEY = 'mkDevStartScreenBtnPos';
const DRAG_THRESHOLD = 6; // px of movement before a press counts as a drag, not a tap

const el = {
  frame: document.getElementById('frame'),
  bgLayer: document.getElementById('bgLayer'),
  bgUploadBtn: document.getElementById('bgUploadBtn'),
  bgInput: document.getElementById('bgInput'),
  resetBgBtn: document.getElementById('resetBgBtn'),
  bgCutoutBtn: document.getElementById('bgCutoutBtn'),
  bgCutoutProgress: document.getElementById('bgCutoutProgress'),
  bgCutoutProgressFill: document.getElementById('bgCutoutProgressFill'),
  bgCutoutProgressText: document.getElementById('bgCutoutProgressText'),
  startBtn: document.getElementById('startBtn'),
  startResizeHandle: document.getElementById('startResizeHandle'),
  btnWidthInput: document.getElementById('btnWidthInput'),
  btnHeightInput: document.getElementById('btnHeightInput'),
  weekSelect: document.getElementById('weekSelect'),
  weekGrid: document.getElementById('weekGrid'),
  minigameSelect: document.getElementById('minigameSelect'),
  minigameList: document.getElementById('minigameList'),
  minigameBackBtn: document.getElementById('minigameBackBtn'),
};

// Straight into the prologue's first scene (internal week1, ARRIVAL), not
// the /dev/week1 scene picker — same entry point /play/'s 시작하기 uses, so
// positioning the button here previews the real tap-through-the-whole-story
// flow, not a scene list.
function goToRealStart() { location.href = '/play/game/?scene=week1-scene-flight'; }

// 게임 스타트(시작하기) → 검은 화면에 /schedule.html 홈과 같은 스타일의
// 세로 카드 리스트(1~4주차 + 미니게임). /play/와 동일한 목록 —
// 2/3/4주차는 아직 구현되지 않아 ???로 잠가두고, 1주차를 고르면 프롤로그
// (내부 week1)부터 실제 스토리가 시작된다. 미니게임 버튼은 현재 1주차 분량으로 구현된
// 미니게임만 다시 플레이할 수 있는 목록으로 이어진다.
const WEEK_TILES = [
  { key: 'week1', emoji: '🔍', label: '1주차', desc: '사라진 K-01 — 수사가 시작돼요', locked: false },
  { key: 'week2', emoji: '🔒', label: '???', desc: '다음 업데이트에서 공개돼요', locked: true },
  { key: 'week3', emoji: '🔒', label: '???', desc: '다음 업데이트에서 공개돼요', locked: true },
  { key: 'week4', emoji: '🔒', label: '???', desc: '다음 업데이트에서 공개돼요', locked: true },
  { key: 'minigame', emoji: '🎮', label: '미니게임', desc: '지금까지 나온 미니게임을 다시 플레이해요', locked: false },
];

const WEEK1_MINIGAMES = [
  { name: '사진 속 인물 찾기', route: '/play/minigame-photo-zoom/' },
  { name: '시간대 정리', route: '/play/minigame-timeline/' },
];

el.weekGrid.innerHTML = WEEK_TILES.map(t => `
  <div class="week-tile ${t.locked ? 'locked' : 'active'}${t.key === 'minigame' ? ' minigame' : ''}" data-key="${t.key}">
    <div class="week-tile-body">
      <span class="week-tile-emoji">${t.emoji}</span>
      <div class="week-tile-name">${t.label}</div>
      <div class="week-tile-desc">${t.desc}</div>
    </div>
  </div>
`).join('');

el.minigameList.innerHTML = WEEK1_MINIGAMES.map(m => `
  <div class="minigame-item" data-route="${m.route}">${m.name}</div>
`).join('');

function showWeekSelect() { el.weekSelect.classList.add('show'); }

function showMinigameSelect() {
  el.weekSelect.classList.remove('show');
  el.minigameSelect.classList.add('show');
}

el.weekGrid.addEventListener('click', (e) => {
  const tile = e.target.closest('.week-tile.active');
  if (!tile) return;
  if (tile.dataset.key === 'week1') goToRealStart();
  else if (tile.dataset.key === 'minigame') showMinigameSelect();
});

el.minigameBackBtn.addEventListener('click', () => {
  el.minigameSelect.classList.remove('show');
  el.weekSelect.classList.add('show');
});

el.minigameList.addEventListener('click', (e) => {
  const item = e.target.closest('.minigame-item');
  if (item) location.href = item.dataset.route;
});

/* ===== Background image + drag-to-pan position ===== */
function loadBgPos() {
  try { return JSON.parse(localStorage.getItem(BG_POS_KEY)) || { x: 50, y: 50 }; }
  catch (e) { return { x: 50, y: 50 }; }
}
let bgPos = loadBgPos();

function renderBgPos() {
  el.bgLayer.style.backgroundPosition = `${bgPos.x}% ${bgPos.y}%`;
}

function applyBackground(dataUrl) {
  if (dataUrl) {
    el.bgLayer.classList.remove('placeholder');
    el.bgLayer.style.backgroundImage = `url("${dataUrl}")`;
    el.resetBgBtn.classList.remove('hidden');
    el.bgCutoutBtn.classList.remove('hidden');
  } else {
    el.bgLayer.classList.add('placeholder');
    el.bgLayer.style.backgroundImage = '';
    el.resetBgBtn.classList.add('hidden');
    el.bgCutoutBtn.classList.add('hidden');
  }
}

// AssetDB.getGameSettings()의 startScreen 필드가 이 화면의 진짜 원본이다 —
// 로드 시 한 번 받아와 로컬 캐시(즉시 표시용)를 최신 값으로 덮어쓴다. 이
// 편집기를 여는 사람은 항상 개발자 한 명뿐이라(플레이 중에는 아무도 이
// 값을 쓰지 않는다) 저장 슬롯처럼 updatedAt을 비교할 필요 없이 "서버 값이
// 항상 최신"으로 단순하게 다룬다.
async function pullStartScreenFromServer() {
  try {
    const settings = await AssetDB.getGameSettings();
    const s = settings.startScreen || {};
    if (s.bgAssetId) {
      const asset = await AssetDB.getAsset(s.bgAssetId);
      if (asset && asset.dataUrl) {
        localStorage.setItem(BG_IMG_KEY, asset.dataUrl);
        applyBackground(asset.dataUrl);
      }
    } else {
      localStorage.removeItem(BG_IMG_KEY);
      applyBackground(null);
    }
    if (s.bgPos) {
      bgPos = s.bgPos;
      localStorage.setItem(BG_POS_KEY, JSON.stringify(bgPos));
      renderBgPos();
    }
    if (s.btnPos) {
      btnPos.start = s.btnPos;
      localStorage.setItem(BTN_POS_KEY, JSON.stringify(btnPos));
      renderBtnPos();
    }
  } catch (e) {
    console.error('시작화면 설정을 서버에서 불러오지 못했습니다', e);
  }
}

async function saveStartScreenPatch(patch) {
  try {
    const settings = await AssetDB.getGameSettings();
    const merged = Object.assign({}, settings, {
      startScreen: Object.assign({}, settings.startScreen, patch),
    });
    await AssetDB.setGameSettings(merged);
  } catch (e) {
    console.error('시작화면 설정을 서버에 저장하지 못했습니다', e);
  }
}

el.bgUploadBtn.addEventListener('click', () => el.bgInput.click());
el.bgInput.addEventListener('change', async () => {
  const file = el.bgInput.files && el.bgInput.files[0];
  if (!file || !file.type.startsWith('image/')) return;
  const originalLabel = el.bgUploadBtn.textContent;
  el.bgUploadBtn.textContent = '업로드 중...';
  try {
    // 다른 배경 이미지들과 같은 경로(AssetDB → Supabase Storage) — 기기
    // localStorage에만 base64로 남아있던 예전 방식과 달리 다른 기기에서도
    // 같은 배경이 뜨게 하려는 것.
    const asset = await AssetDB.addAsset({ type: 'startScreenBg', name: file.name, blob: file });
    localStorage.setItem(BG_IMG_KEY, asset.dataUrl);
    applyBackground(asset.dataUrl);
    await saveStartScreenPatch({ bgAssetId: asset.id });
  } catch (e) {
    console.error('배경 업로드 실패', e);
    alert('배경 업로드에 실패했습니다: ' + e.message);
  } finally {
    el.bgUploadBtn.textContent = originalLabel;
    el.bgInput.value = '';
  }
});

el.resetBgBtn.addEventListener('click', async () => {
  localStorage.removeItem(BG_IMG_KEY);
  applyBackground(null);
  await saveStartScreenPatch({ bgAssetId: null });
});

// AI 배경 제거(누끼) — 모듈은 페이지 로드 시 미리 받아두고, 버튼을 누른
// 시점엔 준비 여부만 기다린다. 진행률은 라이브러리의 progress 콜백(모델
// 다운로드/추론 단계별 current/total)을 그대로 프로그레스바에 반영한다.
window.__removeBackgroundReady = import('https://cdn.jsdelivr.net/npm/@imgly/background-removal/+esm')
  .then(mod => {
    if (typeof mod.removeBackground !== 'function') {
      throw new Error('모듈은 로드됐지만 removeBackground 함수를 찾지 못함 (exports: ' + Object.keys(mod).join(', ') + ')');
    }
    window.__removeBackground = mod.removeBackground;
  })
  .catch(err => { window.__removeBackgroundLoadError = err; });

el.bgCutoutBtn.addEventListener('click', async () => {
  const dataUrl = localStorage.getItem(BG_IMG_KEY);
  if (!dataUrl) return;
  const prevLabel = el.bgCutoutBtn.textContent;
  el.bgCutoutBtn.disabled = true;
  el.bgCutoutBtn.textContent = '처리 중...';
  el.bgCutoutProgress.classList.remove('hidden');
  el.bgCutoutProgressFill.style.width = '0%';
  el.bgCutoutProgressText.textContent = '배경 제거 모듈 확인 중...';
  try {
    await window.__removeBackgroundReady;
    if (!window.__removeBackground) {
      const reason = window.__removeBackgroundLoadError;
      throw new Error('배경 제거 모듈 로드 실패: ' + (reason && reason.message ? reason.message : '네트워크 또는 CDN 문제로 모듈을 불러오지 못했습니다.'));
    }
    const sourceBlob = await (await fetch(dataUrl)).blob();
    const resultBlob = await window.__removeBackground(sourceBlob, {
      progress: (key, current, total) => {
        const pct = total ? Math.round(current / total * 100) : 0;
        el.bgCutoutProgressFill.style.width = pct + '%';
        el.bgCutoutProgressText.textContent = '배경 제거 중... ' + pct + '%';
      }
    });
    const asset = await AssetDB.addAsset({ type: 'startScreenBg', name: 'bg-cutout.png', blob: resultBlob });
    localStorage.setItem(BG_IMG_KEY, asset.dataUrl);
    applyBackground(asset.dataUrl);
    await saveStartScreenPatch({ bgAssetId: asset.id });
  } catch (e) {
    alert('배경 제거 실패: ' + (e && e.message ? e.message : e));
  } finally {
    el.bgCutoutBtn.disabled = false;
    el.bgCutoutBtn.textContent = prevLabel;
    el.bgCutoutProgress.classList.add('hidden');
  }
});

let bgDrag = null;
el.bgLayer.addEventListener('pointerdown', (e) => {
  el.bgLayer.setPointerCapture(e.pointerId);
  el.bgLayer.classList.add('dragging');
  bgDrag = { x: e.clientX, y: e.clientY, startPos: { ...bgPos } };
});
el.bgLayer.addEventListener('pointermove', (e) => {
  if (!bgDrag) return;
  const rect = el.frame.getBoundingClientRect();
  const dx = e.clientX - bgDrag.x, dy = e.clientY - bgDrag.y;
  bgPos = {
    x: clamp(bgDrag.startPos.x - (dx / rect.width) * 100, 0, 100),
    y: clamp(bgDrag.startPos.y - (dy / rect.height) * 100, 0, 100),
  };
  renderBgPos();
});
['pointerup', 'pointercancel'].forEach(evt => el.bgLayer.addEventListener(evt, () => {
  if (!bgDrag) return;
  bgDrag = null;
  el.bgLayer.classList.remove('dragging');
  localStorage.setItem(BG_POS_KEY, JSON.stringify(bgPos));
  saveStartScreenPatch({ bgPos });
}));

function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }

/* ===== Freely-positioned 시작하기 button ===== */
function loadBtnPos() {
  const defaults = { start: { x: 50, y: 80, w: 46, h: 7 } };
  try {
    const saved = JSON.parse(localStorage.getItem(BTN_POS_KEY));
    return { start: Object.assign({}, defaults.start, saved && saved.start) };
  } catch (e) {
    return defaults;
  }
}
let btnPos = loadBtnPos();

function renderBtnPos() {
  el.startBtn.style.left = btnPos.start.x + '%';
  el.startBtn.style.top = btnPos.start.y + '%';
  el.startBtn.style.width = btnPos.start.w + '%';
  el.startBtn.style.height = btnPos.start.h + '%';
  // 입력 중(focus)에는 되쓰지 않는다 — 서버 pull이나 드래그로 값이 갱신될
  // 때마다 이 필드를 덮어쓰면, 타이핑 도중 커서 위치가 튀거나 방금 친
  // 숫자가 지워진다.
  if (document.activeElement !== el.btnWidthInput) el.btnWidthInput.value = Math.round(btnPos.start.w);
  if (document.activeElement !== el.btnHeightInput) el.btnHeightInput.value = Math.round(btnPos.start.h);
}

function saveBtnPos() {
  localStorage.setItem(BTN_POS_KEY, JSON.stringify(btnPos));
  saveStartScreenPatch({ btnPos: btnPos.start });
}

function makeDraggable(buttonEl, posKey, onTap) {
  let drag = null;
  let pressedTimer = null;
  buttonEl.addEventListener('pointerdown', (e) => {
    buttonEl.setPointerCapture(e.pointerId);
    clearTimeout(pressedTimer);
    buttonEl.classList.add('pressed');
    const rect = el.frame.getBoundingClientRect();
    drag = { x: e.clientX, y: e.clientY, startPos: { ...btnPos[posKey] }, rect, moved: false };
  });
  buttonEl.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > DRAG_THRESHOLD) drag.moved = true;
    if (!drag.moved) return;
    btnPos[posKey] = {
      x: clamp(drag.startPos.x + (dx / drag.rect.width) * 100, 6, 94),
      y: clamp(drag.startPos.y + (dy / drag.rect.height) * 100, 6, 94),
    };
    renderBtnPos();
  });
  // A tap (as opposed to an actual drag) holds the pressed-darken for 0.2s,
  // clears it, then waits another 0.1s of plain state before firing onTap —
  // otherwise onTap (navigation) fires instantly and the page is gone before
  // the darken is ever seen.
  ['pointerup', 'pointercancel'].forEach(evt => buttonEl.addEventListener(evt, () => {
    if (!drag) return;
    const wasTap = !drag.moved;
    clearTimeout(pressedTimer);
    if (wasTap) {
      pressedTimer = setTimeout(() => {
        buttonEl.classList.remove('pressed');
        setTimeout(onTap, 100);
      }, 200);
    } else {
      buttonEl.classList.remove('pressed');
      saveBtnPos();
    }
    drag = null;
  }));
}

makeDraggable(el.startBtn, 'start', showWeekSelect);

// Corner handle grows/shrinks the button symmetrically around its own
// center (opposite edges move equally), since position is anchored via
// translate(-50%,-50%) — dragging the handle by dx/dy moves that corner by
// dx/dy, so width/height each change by 2*dx / 2*dy, independently.
function makeResizable(handleEl, posKey) {
  let resize = null;
  handleEl.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    handleEl.setPointerCapture(e.pointerId);
    const rect = el.frame.getBoundingClientRect();
    resize = { x: e.clientX, y: e.clientY, startW: btnPos[posKey].w, startH: btnPos[posKey].h, rect };
  });
  handleEl.addEventListener('pointermove', (e) => {
    if (!resize) return;
    e.stopPropagation();
    const dx = e.clientX - resize.x, dy = e.clientY - resize.y;
    btnPos[posKey].w = clamp(resize.startW + (dx * 2 / resize.rect.width) * 100, 20, 92);
    btnPos[posKey].h = clamp(resize.startH + (dy * 2 / resize.rect.height) * 100, 6, 50);
    renderBtnPos();
  });
  ['pointerup', 'pointercancel'].forEach(evt => handleEl.addEventListener(evt, (e) => {
    if (!resize) return;
    e.stopPropagation();
    resize = null;
    saveBtnPos();
  }));
}

makeResizable(el.startResizeHandle, 'start');

// 코너 핸들 드래그의 확실히 되는 대안 — 숫자를 직접 입력해 너비/높이를
// 바꾼다. resize 클램프 범위(20~92 / 6~50)와 동일한 min/max를 input에도
// 걸어뒀다.
el.btnWidthInput.addEventListener('input', () => {
  const v = clamp(Number(el.btnWidthInput.value), 20, 92);
  if (Number.isNaN(v)) return;
  btnPos.start.w = v;
  renderBtnPos();
});
el.btnWidthInput.addEventListener('change', saveBtnPos);
el.btnHeightInput.addEventListener('input', () => {
  const v = clamp(Number(el.btnHeightInput.value), 6, 50);
  if (Number.isNaN(v)) return;
  btnPos.start.h = v;
  renderBtnPos();
});
el.btnHeightInput.addEventListener('change', saveBtnPos);

renderBgPos();
renderBtnPos();
applyBackground(localStorage.getItem(BG_IMG_KEY));
pullStartScreenFromServer();
</script>
