<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · 탐색</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}
.frame{position:relative;width:100%;max-width:430px;height:100dvh;height:100vh;height:var(--vh100,100vh);overflow:hidden;background:#0d1114;display:flex;flex-direction:column}

/* ===== Shared top bar ===== */
.topbar{position:absolute;top:0;left:0;right:0;z-index:6;padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px;display:flex;justify-content:space-between;align-items:center}
.vn-btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#fff;background:rgba(8,10,12,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.point-balance{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--amber);background:rgba(214,168,75,.14);border:1px solid rgba(214,168,75,.4);border-radius:20px;padding:8px 12px}
.point-balance.hidden{display:none}
.topbar-left{display:flex;gap:8px;align-items:center}
#caseMenuMount{display:flex}

/* ===== MAP VIEW (spec §7.2) ===== */
.map-view{position:absolute;inset:0;overflow-y:auto;padding:calc(80px + env(safe-area-inset-top,0)) 16px calc(24px + env(safe-area-inset-bottom,0));display:none}
.map-view.active{display:block}
.map-title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:14px}
.loc-card{position:relative;background:var(--surface-1);border:1px solid var(--divider);border-radius:16px;padding:16px 18px;margin-bottom:12px;cursor:pointer}
.loc-card.locked{opacity:.45}
.loc-card.current{border-color:rgba(89,184,200,.5)}
.loc-name{font-size:15px;font-weight:700}
.loc-meta{font-size:12px;color:var(--text-secondary);margin-top:6px;line-height:1.5}
.loc-badge{position:absolute;top:14px;right:16px;font-family:var(--mono);font-size:10.5px;font-weight:700;color:#06181c;background:var(--cyan);border-radius:10px;padding:3px 8px}
.loc-current-tag{font-family:var(--mono);font-size:10px;color:var(--cyan);margin-top:6px}

/* ===== LOCATION VIEW (spec §7.1) ===== */
.location-view{position:absolute;inset:0;display:none;flex-direction:column}
.location-view.active{display:flex}
/* 배경 사진을 그냥 CSS background-image로 꽉 채우던 것 대신, 팬/핀치줌
   가능한 스테이지+캔버스로 바꿨다 — minigame-phone-search와 같은 방식(§패닝
   탐색 요청). 18:16처럼 세로 화면보다 가로로 넓게 만든 배경을 좌우로
   둘러볼 수 있게 하기 위함. 사진이 없을 때(placeholder)는 그냥 그라데이션만
   보여주고 팬/줌은 비활성. */
.loc-stage{position:absolute;inset:0;overflow:hidden;touch-action:none;background-color:#0d1114}
.loc-stage.placeholder{background-image:linear-gradient(160deg,#171c22 0%,#0d1114 60%,#080a0c 100%)}
.loc-canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.loc-canvas img{display:block;-webkit-user-drag:none;user-select:none}
.bottom-bar{position:relative;z-index:2;margin-top:auto;background:rgba(5,7,10,.86);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.1);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0));transition:transform .25s ease,opacity .25s ease}
.bottom-bar.hidden{transform:translateY(100%);opacity:0;pointer-events:none}
.goal-line{font-size:13px;color:var(--text-secondary);line-height:1.5;margin-bottom:10px;word-break:keep-all}
.goal-line b{color:var(--cyan)}
.enter-scene-btn{background:var(--amber);color:#191206;font-weight:700;text-align:center;border:none}
.enter-scene-btn.hidden{display:none}

/* ===== Hub action bar — 조사/대화/제시/이동, replaces the old map/케이스
   buttons. Plain 2x2 text-only grid (no icons/emoji, no raised FAB) — every
   action reads as an equal peer. ===== */
.hub-actions{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hub-act-btn{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px 6px;color:var(--text-primary);font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer}
.hub-act-btn:active{transform:scale(.97);background:#1c2530}

/* ===== Move (다크→라이트) transition — plays while performMove() swaps the
   background/goal line underneath, so the cut never shows mid-render. ===== */
.move-fade{position:absolute;inset:0;z-index:12;background:#000;opacity:0;pointer-events:none;transition:opacity .28s ease}
.move-fade.show{opacity:1;pointer-events:auto}

/* ===== 조사하기 — toggles hotspot markers over the location's own loc-
   canvas instead of opening a second, duplicate pan/zoom stage: the
   background is already pannable/zoomable at all times (§263's ambient
   loc-stage above), so 조사하기 only needs to add the "here's what's
   actually tappable" layer on top of it. Hotspots come from locationDefs[id]
   .investigateHotspots (optional, {x,y,interactionId,icon} in %, see that
   file); a location with none defined still toggles investigate mode on
   (so the button always does *something*), it just shows the roam hint
   text instead of any marker. Markers are appended as children of
   #locCanvas so they inherit its pan/zoom transform for free. ===== */
.hub-act-btn.active{background:rgba(89,184,200,.22);border-color:rgba(89,184,200,.5)}
.investigate-hotspot{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:2px solid var(--cyan);background:rgba(89,184,200,.22);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;padding:0;animation:investigateHotspotPulse 1.8s ease-in-out infinite}
.investigate-hotspot.done{border-color:var(--amber);background:rgba(214,168,75,.2);animation:none}
@keyframes investigateHotspotPulse{0%,100%{box-shadow:0 0 0 0 rgba(89,184,200,.35)}50%{box-shadow:0 0 0 8px rgba(89,184,200,0)}}
.investigate-hint{position:absolute;left:16px;right:16px;top:calc(96px + env(safe-area-inset-top,0));z-index:2;text-align:center;font-size:13px;color:var(--text-secondary);background:rgba(8,10,12,.65);border-radius:14px;padding:10px 14px;pointer-events:none;opacity:0;transition:opacity .2s ease}
.investigate-hint:empty{display:none}
.investigate-hint.show{opacity:1}
/* 조사하기가 켜지면 bottom-bar(하단 메뉴)를 통째로 치워 배경을 스와이프/줌으로
   온전히 볼 수 있게 한다 — 그 안에 있던 조사하기 토글 버튼도 같이 사라지므로,
   꺼서 원래 화면으로 돌아갈 별도의 떠 있는 버튼이 필요하다. */
.investigate-close-btn{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);z-index:3;font-family:var(--sans);font-size:13px;font-weight:700;color:var(--text-primary);background:rgba(8,10,12,.75);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:11px 22px;cursor:pointer}
.investigate-close-btn:active{background:#1c2530}
.investigate-close-btn.hidden{display:none}

/* ===== Location character chips — who's actually standing here, shown
   above the goal line so presence isn't hidden behind the 대화 sheet. A
   location can list more than one character (§신규); the first one is the
   default selection (currentCharacterId, see renderLocationCharacters) and
   a chip switches which one 대화하기/증거 제시 act on — see selectLocationCharacter. ===== */
.loc-characters{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto}
.loc-characters:empty{display:none;margin-bottom:0}
.loc-char-chip{flex-shrink:0;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:5px 12px 5px 5px;color:var(--text-primary);font-family:inherit;cursor:pointer}
.loc-char-chip:active{background:#1c2530}
.loc-char-chip.active{background:rgba(89,184,200,.18);border-color:rgba(89,184,200,.5)}
.loc-char-portrait{width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--surface-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-secondary)}
.loc-char-portrait img{width:100%;height:100%;object-fit:cover;object-position:top}
.loc-char-name{font-size:12.5px;font-weight:700}

/* ===== Idle character stage — the currently-selected (default: first)
   character stands over the location background, between loc-stage and the
   bottom bar. Same exact size/position spec as the dialogue layer's own
   character display ("A") — see the shared .dlg-char-wrap/.loc-char-stage
   and .dlg-char-img/.loc-char-stage img rules below — so there's no visual
   jump when a conversation actually starts and takes over that spot.
   Switching character (chip tap) fades the old one out before swapping the
   image and fading the new one in — see setLocCharStage — rather than a
   hard cut. z-index only, the rest of the rule lives with dlg-char-wrap. */
.loc-char-stage{z-index:1}

/* ===== Bottom-sheet family (character menu / topic list / evidence / persons) ===== */
.sheet-overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet-overlay.hidden{display:none}
.sheet{width:100%;max-width:430px;background:var(--surface-1);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0));border-top:1px solid var(--divider);max-height:78vh;overflow-y:auto}
.sheet-title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-muted);margin-bottom:14px;text-transform:uppercase}

/* ===== 이동하기 지도 — phaseMaps(dev/data/locationDefs.js)가 정의된 phase는
   exit 목록을 리스트 대신 지도 그림 위 원형 핀으로 보여준다(openMoveMapSheet).
   loc-canvas처럼 픽셀 단위 팬/줌은 필요 없는 정적 오버뷰라, 고정 aspect-ratio
   박스에 %로 위치만 잡으면 된다 — 사진이 아직 배정 전이면 placeholder 그라데이션
   위에도 핀은 그대로 뜬다(좌표는 이미지가 아니라 박스 기준 %이므로). ===== */
.move-map-wrap{position:relative;width:100%;aspect-ratio:4/5;border-radius:16px;overflow:hidden;margin-bottom:12px;background-color:#171c22;background-image:linear-gradient(160deg,#171c22 0%,#0d1114 60%,#080a0c 100%);background-size:cover;background-position:center}
.move-map-pins{position:absolute;inset:0}
.move-pin{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid var(--amber);background:rgba(214,168,75,.3);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.move-pin::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--amber)}
.move-pin:active{transform:scale(.92)}
.move-pin.current{border-color:var(--cyan);background:rgba(89,184,200,.3);cursor:default}
.move-pin.current::after{background:var(--cyan)}
.move-pin-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;font-weight:700;margin-top:4px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.9)}
.move-map-listnote{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;margin:2px 0 8px}
.action-btn{width:100%;text-align:left;background:var(--surface-2);color:var(--text-primary);border:1px solid var(--divider);border-radius:12px;padding:14px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:8px}
.action-btn:active{background:#1c2530}
.action-btn.cancel{color:var(--text-muted);background:none;border:none;text-align:center;margin-top:4px}
.topic-row{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface-2);border:1px solid var(--divider);border-radius:12px;padding:13px 14px;color:var(--text-primary);font-size:13.5px;cursor:pointer;text-align:left;font-family:inherit;margin-bottom:8px}
.topic-row[disabled]{opacity:.4;cursor:default}
.topic-row-main{flex:1;min-width:0}
.topic-state{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.04em;border-radius:8px;padding:3px 7px;flex-shrink:0}
.state-new{color:#06181c;background:var(--cyan)}
.state-updated{color:#191206;background:var(--amber)}
.state-exhausted,.state-resolved{color:var(--text-muted);background:rgba(255,255,255,.08)}
.state-available,.state-in_progress{color:var(--cyan);background:rgba(89,184,200,.12)}
.state-locked{color:var(--text-muted);background:rgba(255,255,255,.05)}
.empty-note{text-align:center;color:var(--text-muted);font-size:13px;padding:24px 0}
.sheet-section-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;margin:14px 0 8px}
.sheet-section-label:first-child{margin-top:0}

/* ===== Dialogue playback (reuses vnPlayer.js) ===== */
.dialogue-layer{position:absolute;inset:0;z-index:15;display:none;flex-direction:column;justify-content:flex-end;cursor:pointer}
.dialogue-layer.show{display:flex}
/* "A" — the one character size/position spec shared by the idle hub stage
   (.loc-char-stage) and the dialogue layer's own character (.dlg-char-wrap):
   same box, same fit, same object-position, so a location's standing
   character and a conversation's speaking character never jump in size or
   place when one hands off to the other (see playInteractionLines, which
   hides .loc-char-stage the moment a conversation starts and restores it
   when the line finishes). */
.dlg-char-wrap,.loc-char-stage{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s ease}
.dlg-char-wrap.show,.loc-char-stage.show{opacity:1}
.dlg-char-img,.loc-char-stage img{max-height:74%;max-width:88%;object-fit:contain;object-position:bottom}
.dlg-box{position:relative;margin:0 16px calc(16px + env(safe-area-inset-bottom,0));background:rgba(5,7,10,.9);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px 20px;min-height:20vh;display:flex;flex-direction:column}
.dlg-name{font-size:15px;font-weight:700;color:var(--cyan);margin-bottom:8px}
.dlg-name:empty{display:none}
.dlg-text{flex:1;font-size:16px;line-height:1.65;color:#fff;white-space:pre-wrap;word-break:keep-all}
.dlg-foot{display:flex;justify-content:flex-end;padding-top:6px}
.dlg-arrow{font-size:13px;color:var(--text-secondary);visibility:hidden}
@keyframes arrowBob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.dlg-arrow.show{visibility:visible;animation:arrowBob 1.1s ease-in-out infinite}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="topbar">
    <div class="topbar-left">
      <span id="caseMenuMount"></span>
      <span class="point-balance hidden" id="pointBalance">P 0</span>
    </div>
    <a class="vn-btn" href="/dev/">← DEV</a>
  </div>

  <div class="map-view" id="mapView">
    <div class="map-title">지도 · SYDNEY</div>
    <div id="mapList"></div>
  </div>

  <div class="location-view" id="locationView">
    <div class="loc-stage placeholder" id="locStage">
      <div class="loc-canvas" id="locCanvas"><img id="locImg" alt=""></div>
    </div>
    <div class="loc-char-stage" id="locCharStage"><img id="locCharStageImg" alt=""></div>
    <div class="investigate-hint" id="investigateHint"></div>
    <button class="investigate-close-btn hidden" id="investigateCloseBtn">조사 종료</button>
    <div class="move-fade" id="moveFade"></div>
    <div class="bottom-bar" id="bottomBar">
      <div class="loc-characters" id="locCharacters"></div>
      <div class="goal-line" id="goalLine"></div>
      <button class="vn-btn enter-scene-btn hidden" id="enterSceneBtn" style="width:100%;margin-bottom:8px"></button>
      <div class="hub-actions">
        <button class="hub-act-btn" id="investigateBtn">조사하기</button>
        <button class="hub-act-btn" id="talkBtn">대화하기</button>
        <button class="hub-act-btn" id="moveBtn">이동하기</button>
        <button class="hub-act-btn" id="presentBtn">증거 제시</button>
      </div>
    </div>
  </div>

  <div class="dialogue-layer" id="dialogueLayer">
    <div class="dlg-char-wrap" id="dlgCharWrap"><img class="dlg-char-img" id="dlgCharImg" style="display:none" alt=""></div>
    <div class="dlg-box">
      <div class="dlg-name" id="dlgName"></div>
      <div class="dlg-text" id="dlgText"></div>
      <div class="dlg-foot"><span class="dlg-arrow" id="dlgArrow">▼</span></div>
    </div>
  </div>
</div>

<div class="sheet-overlay hidden" id="listSheet">
  <div class="sheet">
    <div class="sheet-title" id="listSheetTitle"></div>
    <div id="listSheetBody"></div>
    <button class="action-btn cancel" id="listSheetCloseBtn">닫기</button>
  </div>
</div>

<div class="sheet-overlay hidden" id="moveMapSheet">
  <div class="sheet" style="max-height:88vh">
    <div class="sheet-title">이동하기</div>
    <div class="move-map-wrap" id="moveMapWrap">
      <div class="move-map-pins" id="moveMapPins"></div>
    </div>
    <div id="moveMapListWrap"></div>
    <button class="action-btn cancel" id="moveMapCloseBtn">그만두기</button>
  </div>
</div>

<script>
function setVh100() { document.documentElement.style.setProperty('--vh100', window.innerHeight + 'px'); }
setVh100();
window.addEventListener('resize', setVh100);
window.addEventListener('orientationchange', setVh100);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
</script>
<script src="/dev/assetDb.js"></script>
<script src="/dev/loadingOverlay.js"></script>
<script src="/dev/dialogueData.js"></script>
<script src="/dev/caseFileData.js"></script>
<script src="/dev/caseFileState.js"></script>
<script src="/dev/data/shopItems.js"></script>
<script src="/dev/state/economyState.js"></script>
<script src="/dev/state/wardrobeState.js"></script>
<script src="/dev/state/shopState.js"></script>
<script src="/dev/data/locationDefs.js"></script>
<script src="/dev/data/interactionDefs.js"></script>
<script src="/dev/state/explorationState.js"></script>
<script src="/dev/vnPlayer.js"></script>
<script src="/dev/caseMenu.js"></script>
<script>
/* ===== Exploration hub (The Missing Key v1 §7) — a single page that swaps
   between map/location/sheet/dialogue "views" instead of separate routed
   pages, so hub state (current location, open sheet) stays trivially in
   sync without round-tripping through sessionStorage the way the shop
   hand-off does. Content is read entirely from locationDefs/interactionDefs
   + ExplorationState — this file has no hardcoded Week 1 knowledge beyond
   the initial ?phase=/&location= boot params. */

// ?phase=/&location= boot params are applied from init() at the bottom of
// this script (via moveTo(), not duplicated here) — moveTo needs `el` and
// renderLocation/showView to already exist, and reusing it (rather than
// calling ExplorationState directly) means a deep-linked boot location gets
// the exact same firstVisitFlag/routeOnEnter handling a normal in-hub move does.

const el = {
  frame: document.getElementById('frame'),
  pointBalance: document.getElementById('pointBalance'),
  mapView: document.getElementById('mapView'),
  mapList: document.getElementById('mapList'),
  locationView: document.getElementById('locationView'),
  locStage: document.getElementById('locStage'),
  locCanvas: document.getElementById('locCanvas'),
  locImg: document.getElementById('locImg'),
  moveFade: document.getElementById('moveFade'),
  locCharacters: document.getElementById('locCharacters'),
  locCharStage: document.getElementById('locCharStage'),
  locCharStageImg: document.getElementById('locCharStageImg'),
  goalLine: document.getElementById('goalLine'),
  enterSceneBtn: document.getElementById('enterSceneBtn'),
  investigateBtn: document.getElementById('investigateBtn'),
  talkBtn: document.getElementById('talkBtn'),
  moveBtn: document.getElementById('moveBtn'),
  presentBtn: document.getElementById('presentBtn'),
  investigateHint: document.getElementById('investigateHint'),
  investigateCloseBtn: document.getElementById('investigateCloseBtn'),
  bottomBar: document.getElementById('bottomBar'),
  listSheet: document.getElementById('listSheet'),
  listSheetTitle: document.getElementById('listSheetTitle'),
  listSheetBody: document.getElementById('listSheetBody'),
  listSheetCloseBtn: document.getElementById('listSheetCloseBtn'),
  moveMapSheet: document.getElementById('moveMapSheet'),
  moveMapWrap: document.getElementById('moveMapWrap'),
  moveMapPins: document.getElementById('moveMapPins'),
  moveMapListWrap: document.getElementById('moveMapListWrap'),

  dlgName: document.getElementById('dlgName'),
  dlgText: document.getElementById('dlgText'),
  dlgArrow: document.getElementById('dlgArrow'),

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function updatePointBalance() {
  const introduced = CaseFileState.hasFlag('pointsUiIntroduced');
  el.pointBalance.classList.toggle('hidden', !introduced);
  if (introduced) el.pointBalance.textContent = 'P ' + EconomyState.getPoints();
}

const STATE_LABEL = { locked: '잠김', new: 'NEW', available: '가능', in_progress: '진행 중', exhausted: '완료', updated: 'UPDATED', resolved: '해결됨' };

/* ===== View switching ===== */
let currentView = 'map';
function showView(name) {
  currentView = name;
  el.mapView.classList.toggle('active', name === 'map');
  el.locationView.classList.toggle('active', name === 'location');
}

/* ===== Map view (spec §7.2) ===== */
function renderMap() {
  const locations = ExplorationState.getAllLocationStates();
  el.mapList.innerHTML = locations.map(loc => {
    const cls = ['loc-card'];
    if (!loc.unlocked) cls.push('locked');
    if (loc.current) cls.push('current');
    const chars = (loc.characters || []).map(c => (dialogueCharacters.find(d => d.id === c) || { name: c }).name).join(', ');
    return `
      <div class="${cls.join(' ')}" data-goto="${loc.unlocked ? loc.id : ''}">
        ${loc.newInteractionCount ? `<div class="loc-badge">NEW ${loc.newInteractionCount}</div>` : ''}
        <div class="loc-name">${escapeHtml(loc.name)}</div>
        <div class="loc-meta">${chars ? escapeHtml(chars) : (loc.unlocked ? '현재 아무도 없음' : '아직 갈 수 없는 장소')}</div>
        ${loc.current ? '<div class="loc-current-tag">현재 위치</div>' : ''}
      </div>
    `;
  }).join('');
  el.mapList.querySelectorAll('[data-goto]').forEach(card => card.addEventListener('click', () => {
    const id = card.dataset.goto;
    if (id) moveTo(id);
  }));
}

/* ===== Location photo pan/zoom — same pan+pinch+wheel math as
   minigame-phone-search's photo stage, just without hotspot hit-testing
   (탐색허브 위치는 캐릭터 chip으로만 상호작용하지, 사진 위 특정 지점을
   탭하는 구조가 아니다). Lets a wide 18:16 background actually be explored
   by panning/zooming instead of a static full-bleed CSS crop. baseScale is
   the "cover" fit (same starting view as the old CSS background-size:cover),
   so a wide photo already overflows horizontally at rest and can be panned
   left/right immediately, or pinch/wheel-zoomed in further. ===== */
let locCanvasW = 0, locCanvasH = 0;
let locScale = 1, locBaseScale = 1, locTx = 0, locTy = 0;
const locPointers = new Map();
let locPanStart = null;
// 조사하기(핫스팟 모드)일 때만 배경을 밀거나 확대할 수 있다 — 평소엔 화면이
// 고정되어 있고, 조사하기를 켜야 화면 이동 잠금이 풀리는 식 (아래 pointerdown/
// pointermove/wheel 핸들러들이 이 값을 확인). 실제 선언은 §조사하기 섹션에
// 있지만, 여기 있는 핸들러들이 참조하므로 위치만 앞당겨 선언한다.
let investigateMode = false;
let locPinchStartDist = 0, locPinchStartScale = 1;
const LOC_MAX_SCALE_MULT = 3;

function locDist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function locMid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
function clampLocScale(s) { return Math.min(Math.max(s, locBaseScale), locBaseScale * LOC_MAX_SCALE_MULT); }
function clampLocPan() {
  const rect = el.locStage.getBoundingClientRect();
  const scaledW = locCanvasW * locScale, scaledH = locCanvasH * locScale;
  locTx = scaledW <= rect.width ? (rect.width - scaledW) / 2 : Math.min(0, Math.max(rect.width - scaledW, locTx));
  locTy = scaledH <= rect.height ? (rect.height - scaledH) / 2 : Math.min(0, Math.max(rect.height - scaledH, locTy));
}
function applyLocTransform() { clampLocPan(); el.locCanvas.style.transform = `translate(${locTx}px, ${locTy}px) scale(${locScale})`; }
function fitLocStage() {
  const rect = el.locStage.getBoundingClientRect();
  if (!rect.width || !rect.height || !locCanvasW || !locCanvasH) return;
  locBaseScale = Math.max(rect.width / locCanvasW, rect.height / locCanvasH);
  locScale = locBaseScale;
  locTx = (rect.width - locCanvasW * locScale) / 2;
  locTy = (rect.height - locCanvasH * locScale) / 2;
  applyLocTransform();
}
window.addEventListener('resize', () => { if (locCanvasW) fitLocStage(); });
window.addEventListener('orientationchange', () => { if (locCanvasW) fitLocStage(); });

el.locStage.addEventListener('pointerdown', (e) => {
  if (!locCanvasW || !investigateMode) return; // 조사하기가 켜져 있을 때만 화면 이동(팬/줌) 허용 — 그 전엔 화면 잠금
  if (e.target.closest('.investigate-hotspot')) return; // let the marker's own click fire instead of starting a pan under it
  el.locStage.setPointerCapture(e.pointerId);
  locPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (locPointers.size === 1) {
    locPanStart = { x: e.clientX, y: e.clientY, tx: locTx, ty: locTy };
  } else if (locPointers.size === 2) {
    locPanStart = null;
    const pts = [...locPointers.values()];
    locPinchStartDist = locDist(pts[0], pts[1]);
    locPinchStartScale = locScale;
  }
});
el.locStage.addEventListener('pointermove', (e) => {
  if (!locCanvasW || !investigateMode || !locPointers.has(e.pointerId)) return;
  locPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (locPointers.size === 1 && locPanStart) {
    locTx = locPanStart.tx + (e.clientX - locPanStart.x);
    locTy = locPanStart.ty + (e.clientY - locPanStart.y);
    applyLocTransform();
  } else if (locPointers.size === 2) {
    const pts = [...locPointers.values()];
    const d = locDist(pts[0], pts[1]);
    const newScale = clampLocScale(locPinchStartScale * (d / locPinchStartDist));
    const rect = el.locStage.getBoundingClientRect();
    const midNow = locMid(pts[0], pts[1]);
    const stageX = midNow.x - rect.left, stageY = midNow.y - rect.top;
    const ratio = newScale / locScale;
    locTx = stageX - (stageX - locTx) * ratio;
    locTy = stageY - (stageY - locTy) * ratio;
    locScale = newScale;
    applyLocTransform();
  }
});
['pointerup', 'pointercancel'].forEach(evt => el.locStage.addEventListener(evt, (e) => {
  locPointers.delete(e.pointerId);
  if (locPointers.size < 2) locPinchStartDist = 0;
  if (locPointers.size === 0) locPanStart = null;
}));
el.locStage.addEventListener('wheel', (e) => {
  if (!locCanvasW || !investigateMode) return;
  e.preventDefault();
  const rect = el.locStage.getBoundingClientRect();
  const stageX = e.clientX - rect.left, stageY = e.clientY - rect.top;
  const newScale = clampLocScale(locScale * (e.deltaY < 0 ? 1.1 : 0.9));
  const ratio = newScale / locScale;
  locTx = stageX - (stageX - locTx) * ratio;
  locTy = stageY - (stageY - locTy) * ratio;
  locScale = newScale;
  applyLocTransform();
}, { passive: false });

/* ===== Location view (spec §7.1) ===== */
async function applyLocationBackground(locationId) {
  let asset = null;
  // 탐색허브 위치도 장소 DB 카탈로그에 배정할 수 있다(/dev/upload의 탐색허브
  // 탭이 배경 DB 탭과 같은 장소-배정 UI를 씀) — getBackgroundId가 배정 여부를
  // 먼저 확인하고, 아직 배정 전이면 기존 레거시 sceneId 직접 조회로 폴백한다.
  const assetId = await DevGameState.getBackgroundId(locationId);
  if (assetId) asset = await AssetDB.getAsset(assetId).catch(() => null);
  locPointers.clear();
  locPanStart = null;
  if (asset && asset.dataUrl) {
    el.locStage.classList.remove('placeholder');
    await AssetDB.preloadImage(asset.dataUrl).catch(() => {});
    el.locImg.src = asset.dataUrl;
    locCanvasW = asset.width;
    locCanvasH = asset.height;
    Object.assign(el.locImg.style, { width: locCanvasW + 'px', height: locCanvasH + 'px' });
    fitLocStage();
  } else {
    el.locStage.classList.add('placeholder');
    el.locImg.removeAttribute('src');
    el.locImg.style.width = '';
    el.locImg.style.height = '';
    locCanvasW = 0;
    locCanvasH = 0;
    el.locCanvas.style.transform = 'none';
  }
}

function renderLocation() {
  const id = ExplorationState.getCurrentLocationId();
  const def = locationDefs[id];
  if (!def) return;
  setInvestigateMode(false); // a new location's canvas/hotspots start clean, not mid-투어 from wherever the player last toggled 조사 on
  applyLocationBackground(id);
  renderLocationCharacters();

  // A location can hand off back into the VN (spec §12.2's soft-gate) — e.g.
  // 빈티지 전시장 입구's enterSceneId leaves the hub for good and resumes
  // week1-scene-003, unlike an `exits` chip which just moves within the hub.
  el.enterSceneBtn.classList.toggle('hidden', !def.enterSceneId);
  if (def.enterSceneId) {
    el.enterSceneBtn.textContent = def.enterSceneLabel || '들어간다';
    el.enterSceneBtn.onclick = () => { location.href = `/dev/game/?scene=${encodeURIComponent(def.enterSceneId)}`; };
  }

  const goal = phaseGoals[ExplorationState.getCurrentPhase()];
  if (goal && goal.requiredFactIds && goal.requiredFactIds.length) {
    const p = ExplorationState.checkPhaseCompletion(goal.requiredFactIds);
    el.goalLine.innerHTML = `현재 목표: <b>${p.done}/${p.total}</b> 확인함`;
  } else {
    el.goalLine.textContent = def.name;
  }
}

// opts.animate (§신규 이동 트랜지션) — plays the dark→light .move-fade cover
// around the state swap below, but only for an in-hub move a player actually
// picked from openMoveSheet(); boot-time/first-visit/routeOnEnter calls stay
// instant since those either render nothing yet or navigate away entirely.
function moveTo(locationId, opts) {
  if (opts && opts.animate) {
    el.moveFade.classList.add('show');
    setTimeout(() => {
      performMove(locationId);
      requestAnimationFrame(() => el.moveFade.classList.remove('show'));
    }, 260);
    return;
  }
  performMove(locationId);
}

function performMove(locationId) {
  const def = locationDefs[locationId];
  if (!def) return;
  const firstVisit = !ExplorationState.isLocationVisited(locationId);
  if (firstVisit && def.firstVisitFlag) CaseFileState.setFlag(def.firstVisitFlag, true);
  // firstVisitSceneId (§12.2) — an existing, untouched VN scene that plays
  // automatically the *first* time this location is actually entered (e.g.
  // week1-scene-002's photo-pose loop at 서큘러키), then never again — later
  // visits behave like a normal hub location. Marking it visited/current
  // *before* navigating away is what makes that "never again" stick.
  if (firstVisit && def.firstVisitSceneId) {
    ExplorationState.unlockLocation(locationId);
    ExplorationState.moveToLocation(locationId);
    location.href = `/dev/game/?scene=${encodeURIComponent(def.firstVisitSceneId)}`;
    return;
  }
  if (def.routeOnEnter) {
    // A routeOnEnter location (e.g. the boutique) has no hub content of its
    // own — it's a pure hand-off, so it never becomes "current". The return
    // URL has to be built from ExplorationState's live location/phase, not
    // location.search: this is a single-page app that never touches the
    // address bar after boot, so location.search is stuck on whatever the
    // player originally deep-linked in with, not where they actually are now.
    const returnLocationId = ExplorationState.getCurrentLocationId();
    const returnPhase = ExplorationState.getCurrentPhase();
    sessionStorage.setItem('mkShopReturnUrl', `/dev/explore/?phase=${encodeURIComponent(returnPhase)}&location=${encodeURIComponent(returnLocationId)}`);
    ExplorationState.unlockLocation(locationId);
    ExplorationState.markLocationVisited(locationId);
    location.href = def.routeOnEnter;
    return;
  }
  ExplorationState.unlockLocation(locationId);
  ExplorationState.moveToLocation(locationId);
  renderLocation();
  showView('location');
}

/* ===== Hub action bar (조사/대화/제시/이동) =====
   Replaces the old per-character chip + action-sheet flow: each location
   carries at most one person, but a location can list several (§신규) —
   currentCharacterId tracks which one 대화/제시 currently act on, defaulting
   to the first in def.characters and switchable via a chip tap
   (selectLocationCharacter). */
let currentCharacterId = null;
function locationCharacters() {
  const def = locationDefs[ExplorationState.getCurrentLocationId()];
  return (def && def.characters) || [];
}

// ===== 장소에 있는 사람 캐릭터 표시 (§신규) — 지금 이 장소에 누가 있는지
// 초상화 chip으로 보여준다. 여럿이면 첫 번째가 기본 선택(currentCharacterId)
// — chip을 누르면 선택이 그 인물로 바뀌고(active 표시), 화면 중앙의 캐릭터도
// 페이드아웃 후 그 인물로 페이드인한다(selectLocationCharacter/setLocCharStage).
// 대화하기/증거 제시는 지금 선택된 인물을 대상으로 한다. */
async function renderLocationCharacters() {
  const chars = locationCharacters();
  if (!chars.includes(currentCharacterId)) currentCharacterId = chars[0] || null;
  el.locCharacters.innerHTML = chars.map(charId => {
    const person = dialogueCharacters.find(d => d.id === charId) || { name: charId };
    return `
      <button class="loc-char-chip${charId === currentCharacterId ? ' active' : ''}" data-char="${charId}">
        <span class="loc-char-portrait" id="locCharPortrait-${charId}">${escapeHtml((person.name || '?')[0])}</span>
        <span class="loc-char-name">${escapeHtml(person.name)}</span>
      </button>
    `;
  }).join('');
  el.locCharacters.querySelectorAll('[data-char]').forEach(chip => {
    chip.addEventListener('click', () => selectLocationCharacter(chip.dataset.char));
  });
  chars.forEach(async (charId) => {
    const assetId = DevGameState.getCharacterAssetId(charId, 'neutral');
    const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
    const host = document.getElementById(`locCharPortrait-${charId}`);
    if (host && asset && asset.dataUrl) host.innerHTML = `<img src="${asset.dataUrl}" alt="">`;
  });
  setLocCharStage(currentCharacterId);
}
function selectLocationCharacter(charId) {
  if (charId === currentCharacterId) return;
  currentCharacterId = charId;
  el.locCharacters.querySelectorAll('[data-char]').forEach(chip => chip.classList.toggle('active', chip.dataset.char === charId));
  setLocCharStage(charId);
}

// 화면 중앙의 "지금 선택된 인물" 서있는 그림 — 대화 레이어의 dlg-char-wrap과
// 같은 자리 개념이지만, 대화 중이 아닐 때도(허브를 둘러보는 동안) 늘 떠 있다.
// 이미 떠 있는 상태에서 다른 인물로 바뀌면 CSS transition 시간만큼 기다렸다
// 이미지를 바꿔서, 컷 전환이 아니라 페이드아웃→페이드인처럼 보이게 한다.
const LOC_CHAR_STAGE_FADE_MS = 250;
let locCharStageToken = 0;
async function setLocCharStage(charId) {
  const token = ++locCharStageToken;
  if (el.locCharStage.classList.contains('show')) {
    el.locCharStage.classList.remove('show');
    await new Promise(r => setTimeout(r, LOC_CHAR_STAGE_FADE_MS));
    if (token !== locCharStageToken) return;
  }
  if (!charId) { el.locCharStageImg.removeAttribute('src'); return; }
  const assetId = DevGameState.getCharacterAssetId(charId, 'neutral');
  const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
  if (token !== locCharStageToken) return;
  if (asset && asset.dataUrl) {
    el.locCharStageImg.src = asset.dataUrl;
    el.locCharStage.classList.add('show');
  } else {
    el.locCharStageImg.removeAttribute('src');
  }
}

// Pre-existing gap: listSheet's own 닫기 button had no handler at all (every
// caller only ever closed it indirectly, by picking a row) — now that 이동/
// 대화/제시 all funnel through this same sheet, backing out without picking
// anything has to work too.
el.listSheetCloseBtn.addEventListener('click', () => el.listSheet.classList.add('hidden'));

el.talkBtn.addEventListener('click', () => {
  if (!currentCharacterId) { showToastLine(null, '지금은 대화할 사람이 없어 보인다.'); return; }
  openTopicList(currentCharacterId);
});
el.presentBtn.addEventListener('click', () => {
  if (!currentCharacterId) { showToastLine(null, '지금 이 자리에는 증거를 보여줄 사람이 없다.'); return; }
  openEvidenceSheet(currentCharacterId);
});
el.moveBtn.addEventListener('click', openMoveSheet);

function renderExitListRows(container, exitDefs, emptyText) {
  container.innerHTML = exitDefs.length ? exitDefs.map(exitDef =>
    `<button class="topic-row" data-exit="${exitDef.id}"><div class="topic-row-main">→ ${escapeHtml(exitDef.name)}</div></button>`
  ).join('') : (emptyText ? `<div class="empty-note">${emptyText}</div>` : '');
  container.querySelectorAll('[data-exit]').forEach(btn => btn.addEventListener('click', () => {
    el.listSheet.classList.add('hidden');
    el.moveMapSheet.classList.add('hidden');
    moveTo(btn.dataset.exit, { animate: true });
  }));
}

// 이동하기 — 같은 phase 안이면 지금 있는 곳과 무관하게 어디든 바로 갈 수
// 있다(더 이상 locationDefs.js의 exits로 인접한 곳만 보여주지 않는다 — 그
// 필드는 이제 참고용 기록일 뿐, see locationDefs.js 상단 주석). phaseMaps
// 정의가 있고 mapPosition을 가진 "지도급" 장소가 하나라도 있으면 지도+핀으로,
// 그렇지 않은 phase(용의자 탐문/재검증처럼 좁은 구역을 도는 phase)는 기존
// 리스트 시트 그대로 보여준다.
function openMoveSheet() {
  const currentId = ExplorationState.getCurrentLocationId();
  const phase = ExplorationState.getCurrentPhase();
  const destDefs = Object.values(locationDefs).filter(l => l.id !== currentId && (l.phases || []).includes(phase));
  const phaseMap = (typeof phaseMaps !== 'undefined') ? phaseMaps[phase] : null;
  const mapDests = phaseMap ? destDefs.filter(d => d.mapPosition) : [];
  if (phaseMap && mapDests.length) {
    openMoveMapSheet(phaseMap, mapDests, destDefs.filter(d => !d.mapPosition));
  } else {
    el.listSheetTitle.textContent = '이동하기';
    renderExitListRows(el.listSheetBody, destDefs, '지금은 이동할 곳이 없습니다.');
    el.listSheet.classList.remove('hidden');
  }
}

async function openMoveMapSheet(phaseMap, mapDests, listDests) {
  const currentId = ExplorationState.getCurrentLocationId();
  const currentDef = locationDefs[currentId];
  el.moveMapPins.innerHTML = '';
  el.moveMapWrap.style.backgroundImage = '';
  el.moveMapSheet.classList.remove('hidden');

  // 좌표는 locationDefs.js의 정적 mapPosition이 기본값, /dev/upload 탐색허브
  // 탭의 지도 핀 편집기가 저장한 override(AssetDB.getMapPins)가 있으면 그게
  // 우선한다 — 코드 수정 없이 실제 생성된 지도 그림 보면서 미세 조정 가능.
  const pinOverrides = await AssetDB.getMapPins().catch(() => ({}));
  function pinPosition(locDef) { return pinOverrides[locDef.id] || locDef.mapPosition; }

  // 현재 위치도 그 phase 지도에 좌표가 있으면 (cyan) 핀으로 같이 찍어 방향
  // 감각을 준다 — mapDests엔 없으니 분리해서 그린다.
  const currentPos = currentDef && pinPosition(currentDef);
  if (currentPos) {
    const cur = document.createElement('div');
    cur.className = 'move-pin current';
    cur.style.left = currentPos.x + '%';
    cur.style.top = currentPos.y + '%';
    cur.innerHTML = `<span class="move-pin-label">현재 위치</span>`;
    el.moveMapPins.appendChild(cur);
  }
  mapDests.forEach(destDef => {
    const pos = pinPosition(destDef);
    const btn = document.createElement('button');
    btn.className = 'move-pin';
    btn.style.left = pos.x + '%';
    btn.style.top = pos.y + '%';
    btn.innerHTML = `<span class="move-pin-label">${escapeHtml(destDef.name)}</span>`;
    btn.addEventListener('click', () => {
      el.moveMapSheet.classList.add('hidden');
      moveTo(destDef.id, { animate: true });
    });
    el.moveMapPins.appendChild(btn);
  });

  if (listDests.length) {
    el.moveMapListWrap.innerHTML = '<div class="move-map-listnote">그 밖의 이동 가능한 곳</div>';
    const rows = document.createElement('div');
    el.moveMapListWrap.appendChild(rows);
    renderExitListRows(rows, listDests);
  } else {
    el.moveMapListWrap.innerHTML = '';
  }

  const assetId = await DevGameState.getBackgroundId(phaseMap.id).catch(() => null);
  const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
  if (asset && asset.dataUrl) el.moveMapWrap.style.backgroundImage = `url(${asset.dataUrl})`;
}
el.moveMapCloseBtn.addEventListener('click', () => el.moveMapSheet.classList.add('hidden'));

// 대화하기 — casual topics and 'minigame'-type hand-offs (하버 포토, §12.3;
// suspect 심문하기, §12.6) share one list instead of a separate "말 걸기"
// quick-pick step, so an interrogation scene is reachable the same way a
// throwaway topic is.
function openTopicList(characterId) {
  const locationId = ExplorationState.getCurrentLocationId();
  const topics = ExplorationState.getInteractionsForCharacter(characterId, locationId).filter(i => i.type === 'topic' || i.type === 'minigame');
  el.listSheetTitle.textContent = '대화하기';
  el.listSheetBody.innerHTML = (topics.length ? topics.map(t => `
    <button class="topic-row" data-topic="${t.id}"${t.state === 'locked' ? ' disabled' : ''}>
      <div class="topic-row-main">${t.icon ? t.icon + ' ' : ''}${escapeHtml(t.label || t.id)}</div>
      <span class="topic-state state-${t.state}">${STATE_LABEL[t.state] || t.state}</span>
    </button>
  `).join('') : '<div class="empty-note">아직 나눌 이야기가 없습니다.</div>')
    + `<button class="action-btn" id="askAboutRowBtn">다른 사람에 대해 묻기</button>`;
  el.listSheetBody.querySelectorAll('[data-topic]').forEach(btn => btn.addEventListener('click', () => {
    el.listSheet.classList.add('hidden');
    playInteraction(btn.dataset.topic);
  }));
  el.listSheetBody.querySelector('#askAboutRowBtn').addEventListener('click', () => {
    el.listSheet.classList.add('hidden');
    openAskAboutSheet(characterId);
  });
  el.listSheet.classList.remove('hidden');
}

// 증거 제시 (spec §8) — presentEvidenceRules/defaultPresentReaction now live
// in dev/data/interactionDefs.js (real content for Phase 5 재검증, see that
// file) so both the hub and any future page can share the same rule table.
// A matched rule's `result` (correct/partial/interesting/wrong/blocked, §8.2)
// never costs points or blocks progress either way (§8.4) — it only changes
// the reaction text and, for correct/partial, may carry effects (addFact 등).
// 목록은 CASE FILE 메뉴의 증거 탭(dev/caseMenu.js renderEvidenceTabBody)과
// 같은 분류(EVIDENCE_CATEGORY_ORDER/evidenceCategoryLabel)로 묶어서 보여준다
// — 두 화면이 서로 다른 분류를 보여주면 헷갈리니 하나의 소스만 쓴다.
function openEvidenceSheet(characterId) {
  const items = CaseFileState.getEvidence();
  el.listSheetTitle.textContent = '증거 제시';
  if (!items.length) {
    el.listSheetBody.innerHTML = '<div class="empty-note">아직 제시할 증거가 없습니다.</div>';
  } else {
    const cats = EVIDENCE_CATEGORY_ORDER.filter(c => items.some(ev => (ev.category || 'etc') === c));
    el.listSheetBody.innerHTML = cats.map(c => `
      <div class="sheet-section-label">${evidenceCategoryLabel(c)}</div>
      ${items.filter(ev => (ev.category || 'etc') === c).map(ev => `
        <button class="topic-row" data-evidence="${ev.id}"><div class="topic-row-main">${escapeHtml(ev.title)}</div></button>
      `).join('')}
    `).join('');
  }
  el.listSheetBody.querySelectorAll('[data-evidence]').forEach(btn => btn.addEventListener('click', () => {
    el.listSheet.classList.add('hidden');
    const rule = presentEvidenceRules.find(r => r.characterId === characterId && r.evidenceId === btn.dataset.evidence && (!r.phase || r.phase === ExplorationState.getCurrentPhase()));
    const outcome = rule || defaultPresentReaction;
    if (rule && (rule.result === 'correct' || rule.result === 'partial')) (rule.effects || []).forEach(applyLocalEffect);
    showToastLine(characterId, outcome.reactionText);
  }));
  el.listSheet.classList.remove('hidden');
}

function openAskAboutSheet(characterId) {
  const persons = CaseFileState.getPersons().filter(p => p.id !== characterId);
  el.listSheetTitle.textContent = '인물에 대해 묻기';
  el.listSheetBody.innerHTML = persons.length ? persons.map(p => `
    <button class="topic-row" data-person="${p.id}"><div class="topic-row-main">${escapeHtml(p.name)}에 대해</div></button>
  `).join('') : '<div class="empty-note">아직 물어볼 만한 인물이 없습니다.</div>';
  el.listSheetBody.querySelectorAll('[data-person]').forEach(btn => btn.addEventListener('click', () => {
    el.listSheet.classList.add('hidden');
    showToastLine(characterId, '음, 그 사람에 대해서는 딱히 할 말이 없는데.');
  }));
  el.listSheet.classList.remove('hidden');
}

/* ===== 조사하기 (§신규) =====
   The background is already pannable/zoomable at all times (§263's ambient
   loc-stage/loc-canvas above) — 조사하기 doesn't need a second, duplicate
   pan/zoom stage on top of it, just a toggle that surfaces "here's what's
   actually tappable" as marker buttons layered into the *same* #locCanvas,
   so they inherit its live pan/zoom transform for free. Hotspots come from
   locationDefs[id].investigateHotspots (optional {x,y,interactionId,icon}
   in %, see that file's header comment) — a location with none authored
   yet still toggles the mode on, it just has nothing to mark and no hint
   text either (조사하기 자체가 핫스팟 유무를 알려주는 게 아니라 순수히
   핫스팟을 찾는 도구라, "여긴 특별히 없다"는 안내는 스포일러에 가깝다).
   locStage's own pointerdown (a few lines up) is
   patched to ignore taps on `.investigate-hotspot` so tapping a marker
   doesn't also start a pan-drag underneath it. investigateMode itself is
   declared up with the pan/zoom state above, since that stage's own
   handlers gate on it too (조사하기 off = 화면 이동 잠금). */
function clearInvestigateHotspots() { el.locCanvas.querySelectorAll('.investigate-hotspot').forEach(n => n.remove()); }
function renderInvestigateHotspots() {
  clearInvestigateHotspots();
  const def = locationDefs[ExplorationState.getCurrentLocationId()];
  const hotspots = (!locCanvasW || !locCanvasH) ? [] : ((def && def.investigateHotspots) || []).filter(h => ExplorationState.getInteractionState(h.interactionId) !== 'locked');
  hotspots.forEach(h => {
    const state = ExplorationState.getInteractionState(h.interactionId);
    const btn = document.createElement('button');
    btn.className = 'investigate-hotspot' + (state === 'exhausted' || state === 'resolved' ? ' done' : '');
    btn.style.left = ((h.x / 100) * locCanvasW) + 'px';
    btn.style.top = ((h.y / 100) * locCanvasH) + 'px';
    btn.textContent = h.icon || '🔍';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setInvestigateMode(false);
      playInteraction(h.interactionId);
    });
    el.locCanvas.appendChild(btn);
  });
  el.investigateHint.textContent = hotspots.length ? '반짝이는 지점을 눌러 살펴보세요.' : '';
}
function setInvestigateMode(on) {
  investigateMode = on;
  el.investigateBtn.classList.toggle('active', on);
  el.investigateHint.classList.toggle('show', on);
  // 조사하기 중엔 하단 메뉴(bottom-bar)를 통째로 치워 배경을 스와이프/줌으로
  // 온전히 볼 수 있게 한다 — 그 안의 조사하기 토글도 같이 사라지므로, 대신
  // 뜨는 investigateCloseBtn으로 끌 수 있다.
  el.bottomBar.classList.toggle('hidden', on);
  el.investigateCloseBtn.classList.toggle('hidden', !on);
  if (on) {
    renderInvestigateHotspots();
  } else {
    clearInvestigateHotspots();
    if (locCanvasW) fitLocStage(); // 화면 이동 잠금으로 돌아갈 때 팬/줌 위치도 기본 프레임으로 리셋
  }
}
el.investigateBtn.addEventListener('click', () => setInvestigateMode(!investigateMode));
el.investigateCloseBtn.addEventListener('click', () => setInvestigateMode(false));

// Lightweight single-line reaction (증거 제시/인물에 대해 묻기의 기본 반응처럼
// 대화 재생기까지 띄울 필요는 없는 짧은 피드백) — the dialogue layer with a
// single narration line, tap to dismiss.
function showToastLine(characterId, text) {
  playInteractionLines([{ speaker: '', text, characterId: null }], () => {});
}

/* ===== Dialogue playback (spec §7.3/§7.4 — reuses vnPlayer.js) ===== */
let charRequestToken = 0;
async function applyDialogueCharacter(characterId, expression) {
  const requestToken = ++charRequestToken;
  if (!characterId) { el.dlgCharWrap.classList.remove('show'); return; }
  el.dlgCharWrap.classList.add('show');
  const assetId = DevGameState.getCharacterAssetId(characterId, expression);
  const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
  if (requestToken !== charRequestToken) return;
  if (asset && asset.dataUrl) { el.dlgCharImg.src = asset.dataUrl; el.dlgCharImg.style.display = ''; }
  else { el.dlgCharImg.removeAttribute('src'); el.dlgCharImg.style.display = 'none'; }
}

function playInteraction(interactionId) {
  const def = interactionDefs[interactionId];
  if (!def) return;
  if (def.type === 'minigame' && def.route) {
    // Same hand-off contract routeOnEnter locations use — the minigame's own
    // "계속하기" reads this to come straight back to this exact hub spot.
    ExplorationState.completeInteraction(interactionId);
    sessionStorage.setItem('mkShopReturnUrl', `/dev/explore/?phase=${encodeURIComponent(ExplorationState.getCurrentPhase())}&location=${encodeURIComponent(ExplorationState.getCurrentLocationId())}`);
    location.href = def.route;
    return;
  }
  playInteractionLines(def.lines || [], () => {
    ExplorationState.completeInteraction(interactionId);
    (def.effects || []).forEach(applyLocalEffect);
    renderLocation();
  });
}

// Small effect vocabulary — deliberately narrower than game/index.html's
// applyEffect (this hub content only ever needs setFlag/addFact/addEvidence/
// addQuestion so far); extend in lockstep with what interactionDefs.js
// actually authors.
function applyLocalEffect(effect) {
  if (effect.type === 'setFlag') CaseFileState.setFlag(effect.key, effect.value);
  else if (effect.type === 'addFact') { if (CaseFileState.addFact(effect.fact)) ExplorationState.refreshInteractionsByFact(effect.fact.id); }
  else if (effect.type === 'addEvidence') CaseFileState.addEvidence(effect.evidence);
  else if (effect.type === 'addQuestion') CaseFileState.addQuestion(effect.question);
}

// One persistent click listener delegating to whichever player is currently
// loaded — playInteractionLines can be called many times in a session (every
// topic/observe/toast line), and re-adding a fresh listener on the shared
// dialogueLayer each time would stack up duplicate handlers, making later
// taps advance multiple players' worth of state at once.
let currentDialoguePlayer = null;
el.dialogueLayer.addEventListener('click', () => { if (currentDialoguePlayer) currentDialoguePlayer.tap(); });

function playInteractionLines(lines, onComplete) {
  el.dialogueLayer.classList.add('show');
  // A(캐릭터 크기·위치)는 허브 대기 상태(loc-char-stage)와 대화 레이어
  // (dlg-char-wrap)가 공유하는 같은 자리라, 둘이 동시에 떠 있으면 겹쳐
  // 보인다 — 대화가 시작되는 순간 대기 인물은 내리고, 대화가 끝나면 지금
  // 선택된 인물로 다시 세운다(setLocCharStage).
  el.locCharStage.classList.remove('show');
  currentDialoguePlayer = createVNPlayer({
    onLineChange: (line) => { el.dlgName.textContent = line.speaker || ''; applyDialogueCharacter(line.characterId, line.expression); },
    onTextUpdate: (text) => { el.dlgText.textContent = text; },
    onArrow: (show) => el.dlgArrow.classList.toggle('show', show),
    onComplete: () => {
      el.dialogueLayer.classList.remove('show');
      currentDialoguePlayer = null;
      setLocCharStage(currentCharacterId);
      onComplete();
    },
  });
  currentDialoguePlayer.load(lines);
}

// Every routed page this hub hands off to (shop/wardrobe, and the save-slot
// hub sentinel below) needs the *live* location/phase, never location.search
// — this is a single-page app that never touches the address bar after
// boot, so location.search is permanently stuck on whatever ?phase=/&location=
// the player originally deep-linked in with (same class of bug fixed in
// moveTo()'s routeOnEnter handling above).
function currentHubUrl() {
  return `/dev/explore/?phase=${encodeURIComponent(ExplorationState.getCurrentPhase() || '')}&location=${encodeURIComponent(ExplorationState.getCurrentLocationId() || '')}`;
}

// A hub save has no real VN sceneId to resume into, so it's stored under
// this sentinel — game/index.html's own onResumeToScene checks for it too
// (see that file) and routes back here with the restored phase/location
// instead of trying to treat it as a scene id.
const EXPLORE_HUB_SAVE_SENTINEL = '__EXPLORE_HUB__';

/* ===== CASE FILE menu (shared component, spec §6) ===== */
const caseMenu = initCaseMenu({
  missionTitle: () => (locationDefs[ExplorationState.getCurrentLocationId()] || {}).name || '탐색',
  currentSceneId: null,
  mountSelector: '#caseMenuMount',
  onSaveRequested: (slot) => {
    CaseFileState.saveSlot(slot, {
      sceneId: EXPLORE_HUB_SAVE_SENTINEL,
      lineIndex: 0,
      missionTitle: (locationDefs[ExplorationState.getCurrentLocationId()] || {}).name || '탐색',
    });
  },
  // CaseFileState.loadSlot already restored ExplorationState (and every
  // other state module) *before* this fires — for a hub save there's
  // nothing to navigate to, just re-render this same page against the
  // now-restored location/phase. A save made from a VN scene instead sends
  // the player there, matching what game/index.html's own resume does.
  onResumeToScene: (sceneId, lineIndex) => {
    if (sceneId && sceneId !== EXPLORE_HUB_SAVE_SENTINEL) {
      location.href = `/dev/game/?scene=${encodeURIComponent(sceneId)}&line=${lineIndex || 0}`;
      return;
    }
    updatePointBalance();
    if (ExplorationState.getCurrentLocationId()) { renderLocation(); showView('location'); }
    else { renderMap(); showView('map'); }
  },
  onSettingChange: () => {},
  onOpenShop: () => { sessionStorage.setItem('mkShopReturnUrl', currentHubUrl()); location.href = '/dev/shop/'; },
  onOpenWardrobe: () => { sessionStorage.setItem('mkShopReturnUrl', currentHubUrl()); location.href = '/dev/wardrobe/'; },
});

el.frame.addEventListener('click', (e) => {
  // Nothing extra needed globally yet — kept for parity with dev/game's tap
  // pattern in case a future beat needs a frame-level tap guard.
});

// Phase-wide preload (§신규) — a phase's locations share one small pool of
// background art, so warming all of them up front (one batched metadata
// fetch + parallel decodes, same AssetDB.preloadImage the per-week VN
// preloader already uses — see weekPreloader.js) means 이동하기 never shows
// a bare placeholder flash while a location the player hasn't visited yet
// fetches its own background for the first time. sessionStorage-gated like
// WeekPreloader's own readiness flag, so re-entering an already-warm phase
// this session skips straight past it.
const PHASE_PRELOAD_SESSION_KEY = 'mkPhasePreloadReadyPhase';
async function preloadPhaseBackgrounds(phaseId) {
  if (!phaseId) return;
  try { if (sessionStorage.getItem(PHASE_PRELOAD_SESSION_KEY) === phaseId) return; } catch (e) { /* fall through and preload anyway */ }
  const locationIds = Object.keys(locationDefs).filter(id => (locationDefs[id].phases || []).includes(phaseId));
  if (!locationIds.length) return;
  LoadingOverlay.show('장소를 준비하는 중');
  try {
    const assetIds = (await Promise.all(locationIds.map(id => DevGameState.getBackgroundId(id).catch(() => null)))).filter(Boolean);
    const assets = assetIds.length ? await AssetDB.getAssetsByIds(assetIds) : [];
    await Promise.all(assets.map(a => (a && a.dataUrl) ? AssetDB.preloadImage(a.dataUrl) : Promise.resolve()));
    try { sessionStorage.setItem(PHASE_PRELOAD_SESSION_KEY, phaseId); } catch (e) { /* best-effort */ }
  } finally {
    LoadingOverlay.hide();
  }
}

/* ===== Boot ===== */
(async function init() {
  updatePointBalance();
  const params = new URLSearchParams(location.search);
  const bootPhase = params.get('phase');
  const bootLocation = params.get('location');
  const phaseChanged = !!bootPhase && ExplorationState.getCurrentPhase() !== bootPhase;
  if (bootPhase) ExplorationState.enterExplorationPhase(bootPhase);
  await preloadPhaseBackgrounds(ExplorationState.getCurrentPhase());
  // The `|| phaseChanged` half of this guard matters as soon as there's more
  // than one phase in play: a returning player already has *some*
  // currentLocationId left over from an earlier phase (e.g. still parked at
  // a Phase 1 tourism spot), so the original "only if nothing set yet" check
  // silently no-oped every phase handoff (week1-scene-005b -> 탐문 허브,
  // week1-scene-010 -> 재검증 허브, ...) past the very first one — it just
  // re-rendered the stale old location instead of moving into the new phase.
  // Only ever hit in real continuous play, not the fresh-profile Playwright
  // runs used to test each phase in isolation, which is how it went unnoticed.
  if (bootLocation && (phaseChanged || !ExplorationState.getCurrentLocationId())) {
    moveTo(bootLocation); // handles firstVisitFlag/unlock/render/routeOnEnter itself
    return;
  }
  if (ExplorationState.getCurrentLocationId()) {
    renderLocation();
    showView('location');
  } else {
    renderMap();
    showView('map');
  }
})();
</script>
<script src="/dev/devPlanFab.js"></script>
</body>
