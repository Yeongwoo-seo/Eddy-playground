<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · 수박 게임 설정</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--green:#3ECF6B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(48px + env(safe-area-inset-top,0)) 20px calc(32px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.back{font-family:var(--mono);font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:18px;display:inline-flex;align-items:center;gap:4px;width:fit-content}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
.title{font-size:26px;font-weight:700;letter-spacing:-.2px;margin-bottom:10px}
.sub{font-size:14px;color:var(--text-secondary);margin-bottom:28px;line-height:1.6}

.fruit-list{display:flex;flex-direction:column;border-top:1px solid var(--divider)}
.fruit-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--divider)}
.fruit-preview{width:46px;height:46px;border-radius:50%;background:var(--surface-1);border:1px solid var(--divider);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;flex-shrink:0}
.fruit-preview img{width:100%;height:100%;object-fit:cover}
.fruit-info{flex:1;min-width:0}
.fruit-name{font-size:14.5px;font-weight:600}
.fruit-status{font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-top:2px}
.fruit-actions{display:flex;gap:6px;flex-shrink:0}
.fruit-btn{font-family:var(--mono);font-size:11.5px;font-weight:600;color:#04181c;background:var(--cyan);border:none;border-radius:12px;padding:9px 12px;cursor:pointer;white-space:nowrap}
.fruit-btn:active{transform:scale(.95)}
.fruit-remove{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);background:none;border:1px solid var(--divider);border-radius:12px;padding:9px 10px;cursor:pointer;display:none}
.fruit-remove.show{display:inline-block}
.fruit-remove:active{opacity:.7}
.fruit-input-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.fruit-error{font-size:11.5px;color:var(--signal-red);margin-top:6px;display:none}

.test-btn{margin-top:24px;font-family:var(--mono);font-size:14.5px;font-weight:700;letter-spacing:.04em;color:#08110c;background:var(--green);border:none;border-radius:16px;padding:16px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.test-btn:active{opacity:.8}

.crop-overlay{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.9);padding:24px 20px calc(24px + env(safe-area-inset-bottom,0))}
.crop-overlay.show{display:flex}
.crop-stage{position:relative;width:300px;max-width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:#000;touch-action:none}
#cropCanvas{width:100%;height:100%;display:block;cursor:grab}
.crop-mask{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:92%;height:92%;border-radius:50%;box-shadow:0 0 0 2000px rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.85);pointer-events:none}
.crop-hint{font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-top:14px;text-align:center}
.crop-zoom{width:260px;max-width:100%;margin-top:12px;accent-color:var(--cyan)}
.crop-actions{display:flex;gap:10px;margin-top:20px;width:260px;max-width:100%}
.crop-btn{flex:1;font-family:var(--mono);font-size:13.5px;font-weight:700;border-radius:14px;padding:12px;cursor:pointer;border:none}
.crop-btn.secondary{background:var(--surface-2);color:var(--text-secondary)}
.crop-btn.primary{background:var(--cyan);color:#04181c}
.crop-btn:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="frame">
  <a class="back" href="/dev/minigames/">‹ DEV</a>
  <div class="tag">Minigame · 설정</div>
  <div class="title">🍉 수박 게임</div>
  <div class="sub">과일마다 사진을 설정하면 게임 속 이모지 대신 그 사진이 굴러다녀요. 설정하지 않은 과일은 기본 이모지로 나와요.</div>

  <div class="fruit-list" id="fruitList"></div>
  <div class="fruit-error" id="fruitError"></div>

  <a class="test-btn" id="testBtn" href="/dev/minigame-watermelon/play/">테스트하기</a>
</div>

<div class="crop-overlay" id="cropOverlay">
  <div class="crop-stage">
    <canvas id="cropCanvas"></canvas>
    <div class="crop-mask"></div>
  </div>
  <div class="crop-hint">드래그해서 위치 조정 · 손가락 두 개로 확대/축소</div>
  <input type="range" class="crop-zoom" id="cropZoom" min="100" max="300" value="100">
  <div class="crop-actions">
    <button type="button" class="crop-btn secondary" id="cropCancelBtn">취소</button>
    <button type="button" class="crop-btn primary" id="cropConfirmBtn">확인</button>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script>
/* ===== Per-fruit photo picker — each upload goes through the crop modal
   below (pan/zoom, see CROP_RES) before being stored as a data URL per
   tier in localStorage under FRUIT_IMAGE_KEY, read straight off there by
   the play screen (dev/minigame-watermelon/play/). The fixed crop
   resolution keeps a full-size phone photo from blowing the localStorage
   quota, same goal as the fishing minigame's downscale-on-upload. ===== */
const FRUIT_META = [
  { name: '체리',     emoji: '🍒' },
  { name: '딸기',     emoji: '🍓' },
  { name: '포도',     emoji: '🍇' },
  { name: '귤',       emoji: '🍊' },
  { name: '사과',     emoji: '🍎' },
  { name: '배',       emoji: '🍐' },
  { name: '복숭아',   emoji: '🍑' },
  { name: '파인애플', emoji: '🍍' },
  { name: '코코넛',   emoji: '🥥' },
  { name: '멜론',     emoji: '🍈' },
  { name: '수박',     emoji: '🍉' },
];
const FRUIT_IMAGE_KEY = 'mkWatermelonFruitImages';

function loadImages() {
  try { return JSON.parse(localStorage.getItem(FRUIT_IMAGE_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveImages(data) {
  try {
    localStorage.setItem(FRUIT_IMAGE_KEY, JSON.stringify(data));
  } catch (e) {
    throw new Error(e && e.name === 'QuotaExceededError'
      ? '저장 공간이 부족해요. 다른 과일 사진을 지우고 다시 시도해 보세요.'
      : '이미지 저장에 실패했어요.');
  }
}

/* ===== Crop modal — lets you pan/zoom the uploaded photo before it's
   saved, instead of just center-covering it blindly. The circular mask is
   a preview only: the *square* crop canvas is what gets saved, since the
   play screen already cover-fits + clips any square photo to the fruit's
   circle at render time, so a square crop loses nothing. ===== */
const CROP_RES = 320; // internal canvas resolution, independent of on-screen CSS size
const cropOverlay = document.getElementById('cropOverlay');
const cropCanvas = document.getElementById('cropCanvas');
const cropCtx = cropCanvas.getContext('2d');
const cropZoom = document.getElementById('cropZoom');
cropCanvas.width = CROP_RES;
cropCanvas.height = CROP_RES;

let cropState = null; // { tierIdx, img, baseScale, zoom, scale, dx, dy }
const activePointers = new Map();
let panStart = null;
let pinchStartDist = null;
let pinchStartZoom = null;

function clampCropOffset() {
  const drawnW = cropState.img.naturalWidth * cropState.scale;
  const drawnH = cropState.img.naturalHeight * cropState.scale;
  cropState.dx = Math.min(0, Math.max(CROP_RES - drawnW, cropState.dx));
  cropState.dy = Math.min(0, Math.max(CROP_RES - drawnH, cropState.dy));
}

function drawCrop() {
  cropCtx.clearRect(0, 0, CROP_RES, CROP_RES);
  const { img, scale, dx, dy } = cropState;
  cropCtx.drawImage(img, dx, dy, img.naturalWidth * scale, img.naturalHeight * scale);
}

function setCropZoom(z) {
  cropState.zoom = Math.min(Math.max(z, 1), 3);
  cropZoom.value = Math.round(cropState.zoom * 100);
  cropState.scale = cropState.baseScale * cropState.zoom;
  clampCropOffset();
}

function pointerDistance() {
  const pts = [...activePointers.values()];
  return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
}

function openCropModal(tierIdx, file) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const baseScale = Math.max(CROP_RES / img.naturalWidth, CROP_RES / img.naturalHeight);
      cropState = {
        tierIdx, img, baseScale, zoom: 1, scale: baseScale,
        dx: (CROP_RES - img.naturalWidth * baseScale) / 2,
        dy: (CROP_RES - img.naturalHeight * baseScale) / 2,
      };
      cropZoom.value = 100;
      drawCrop();
      cropOverlay.classList.add('show');
    };
    img.onerror = () => {
      errorEl.textContent = '이미지를 불러오지 못했어요.';
      errorEl.style.display = 'block';
    };
    img.src = reader.result;
  };
  reader.onerror = () => {
    errorEl.textContent = '파일을 읽지 못했어요.';
    errorEl.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function closeCropModal() {
  cropOverlay.classList.remove('show');
  cropState = null;
  activePointers.clear();
  panStart = null;
  pinchStartDist = null;
}

cropCanvas.addEventListener('pointerdown', (e) => {
  if (!cropState) return;
  cropCanvas.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activePointers.size === 1) {
    panStart = { x: e.clientX, y: e.clientY, dx: cropState.dx, dy: cropState.dy };
  } else if (activePointers.size === 2) {
    pinchStartDist = pointerDistance();
    pinchStartZoom = cropState.zoom;
    panStart = null;
  }
});
cropCanvas.addEventListener('pointermove', (e) => {
  if (!cropState || !activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activePointers.size === 2 && pinchStartDist) {
    setCropZoom(pinchStartZoom * (pointerDistance() / pinchStartDist));
  } else if (activePointers.size === 1 && panStart) {
    const rect = cropCanvas.getBoundingClientRect();
    const sf = CROP_RES / rect.width;
    const [p] = activePointers.values();
    cropState.dx = panStart.dx + (p.x - panStart.x) * sf;
    cropState.dy = panStart.dy + (p.y - panStart.y) * sf;
    clampCropOffset();
  }
  drawCrop();
});
function endCropPointer(e) {
  activePointers.delete(e.pointerId);
  pinchStartDist = null;
  if (activePointers.size === 1 && cropState) {
    const [p] = activePointers.values();
    panStart = { x: p.x, y: p.y, dx: cropState.dx, dy: cropState.dy };
  } else {
    panStart = null;
  }
}
cropCanvas.addEventListener('pointerup', endCropPointer);
cropCanvas.addEventListener('pointercancel', endCropPointer);
cropCanvas.addEventListener('wheel', (e) => {
  if (!cropState) return;
  e.preventDefault();
  setCropZoom(cropState.zoom - e.deltaY * 0.0015);
  drawCrop();
}, { passive: false });

cropZoom.addEventListener('input', () => {
  if (!cropState) return;
  setCropZoom(Number(cropZoom.value) / 100);
  drawCrop();
});

document.getElementById('cropCancelBtn').addEventListener('click', closeCropModal);
document.getElementById('cropConfirmBtn').addEventListener('click', () => {
  if (!cropState) return;
  try {
    images[cropState.tierIdx] = cropCanvas.toDataURL('image/jpeg', 0.85);
    saveImages(images);
    updateRow(cropState.tierIdx);
  } catch (err) {
    errorEl.textContent = (err && err.message) || '이미지 저장에 실패했어요.';
    errorEl.style.display = 'block';
  }
  closeCropModal();
});

let images = loadImages();
const listEl = document.getElementById('fruitList');
const errorEl = document.getElementById('fruitError');

function rowHtml(tierIdx, meta) {
  const dataUrl = images[tierIdx];
  return `
    <div class="fruit-row">
      <div class="fruit-preview" id="preview-${tierIdx}">${dataUrl ? `<img src="${dataUrl}" alt="">` : meta.emoji}</div>
      <div class="fruit-info">
        <div class="fruit-name">${meta.name} ${meta.emoji}</div>
        <div class="fruit-status" id="status-${tierIdx}">${dataUrl ? '사진 설정됨' : '기본 이모지'}</div>
      </div>
      <div class="fruit-actions">
        <label class="fruit-btn" for="input-${tierIdx}">사진 설정</label>
        <input type="file" id="input-${tierIdx}" accept="image/*" class="fruit-input-hidden" data-tier="${tierIdx}">
        <button type="button" class="fruit-remove${dataUrl ? ' show' : ''}" id="remove-${tierIdx}" data-tier="${tierIdx}">제거</button>
      </div>
    </div>
  `;
}

function renderList() {
  listEl.innerHTML = FRUIT_META.map((meta, i) => rowHtml(i, meta)).join('');
  FRUIT_META.forEach((meta, i) => {
    document.getElementById(`input-${i}`).addEventListener('change', (e) => onUpload(i, e));
    document.getElementById(`remove-${i}`).addEventListener('click', () => onRemove(i));
  });
}

function updateRow(tierIdx) {
  const meta = FRUIT_META[tierIdx];
  const dataUrl = images[tierIdx];
  document.getElementById(`preview-${tierIdx}`).innerHTML = dataUrl ? `<img src="${dataUrl}" alt="">` : meta.emoji;
  document.getElementById(`status-${tierIdx}`).textContent = dataUrl ? '사진 설정됨' : '기본 이모지';
  document.getElementById(`remove-${tierIdx}`).classList.toggle('show', !!dataUrl);
}

function onUpload(tierIdx, e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  errorEl.style.display = 'none';
  openCropModal(tierIdx, file);
}

function onRemove(tierIdx) {
  delete images[tierIdx];
  saveImages(images);
  updateRow(tierIdx);
}

renderList();
</script>
<script src="/dev/devPlanFab.js"></script>
</body>
</html>
