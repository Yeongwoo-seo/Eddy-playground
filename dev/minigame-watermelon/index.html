<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--green:#3ECF6B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(48px + env(safe-area-inset-top,0)) 20px calc(32px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.back{font-family:var(--mono);font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:18px;display:inline-flex;align-items:center;gap:4px;width:fit-content}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
.title{font-size:26px;font-weight:700;letter-spacing:-.2px;margin-bottom:10px}
.sub{font-size:14px;color:var(--text-secondary);margin-bottom:28px;line-height:1.6}

.fruit-list{display:flex;flex-direction:column;border-top:1px solid var(--divider)}
.fruit-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--divider)}
.fruit-preview{width:46px;height:46px;border-radius:50%;background:var(--surface-1);border:1px solid var(--divider);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;flex-shrink:0}
.fruit-preview img{width:100%;height:100%;object-fit:cover}
.fruit-info{flex:1;min-width:0}
.fruit-name{font-size:14.5px;font-weight:600}
.fruit-status{font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-top:2px}
.fruit-actions{display:flex;gap:6px;flex-shrink:0}
.fruit-btn{font-family:var(--mono);font-size:11.5px;font-weight:600;color:#04181c;background:var(--cyan);border:none;border-radius:12px;padding:9px 12px;cursor:pointer;white-space:nowrap}
.fruit-btn:active{transform:scale(.95)}
.fruit-remove{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);background:none;border:1px solid var(--divider);border-radius:12px;padding:9px 10px;cursor:pointer;display:none}
.fruit-remove.show{display:inline-block}
.fruit-remove:active{opacity:.7}
.fruit-input-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.fruit-error{font-size:11.5px;color:var(--signal-red);margin-top:6px;display:none}

.test-btn{margin-top:24px;font-family:var(--mono);font-size:14.5px;font-weight:700;letter-spacing:.04em;color:#08110c;background:var(--green);border:none;border-radius:16px;padding:16px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.test-btn:active{opacity:.8}
</style>
</head>
<body>
<div class="frame">
  <a class="back" href="/dev/minigames/">‹ DEV</a>
  <div class="tag">Minigame · 설정</div>
  <div class="title">🍉 수박 게임</div>
  <div class="sub">과일마다 사진을 설정하면 게임 속 이모지 대신 그 사진이 굴러다녀요. 설정하지 않은 과일은 기본 이모지로 나와요.</div>

  <div class="fruit-list" id="fruitList"></div>
  <div class="fruit-error" id="fruitError"></div>

  <a class="test-btn" id="testBtn" href="/dev/minigame-watermelon/play/">테스트하기</a>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script>
/* ===== Per-fruit photo picker — stores a downscaled data URL per tier in
   localStorage under FRUIT_IMAGE_KEY, read straight off there by the play
   screen (dev/minigame-watermelon/play/). Same downscale-through-canvas
   approach as the fishing minigame's 설정 screen, so a full-size phone
   photo doesn't blow the localStorage quota. ===== */
const FRUIT_META = [
  { name: '체리',     emoji: '🍒' },
  { name: '딸기',     emoji: '🍓' },
  { name: '포도',     emoji: '🍇' },
  { name: '귤',       emoji: '🍊' },
  { name: '사과',     emoji: '🍎' },
  { name: '배',       emoji: '🍐' },
  { name: '복숭아',   emoji: '🍑' },
  { name: '파인애플', emoji: '🍍' },
  { name: '코코넛',   emoji: '🥥' },
  { name: '멜론',     emoji: '🍈' },
  { name: '수박',     emoji: '🍉' },
];
const FRUIT_IMAGE_KEY = 'mkWatermelonFruitImages';

function loadImages() {
  try { return JSON.parse(localStorage.getItem(FRUIT_IMAGE_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveImages(data) {
  try {
    localStorage.setItem(FRUIT_IMAGE_KEY, JSON.stringify(data));
  } catch (e) {
    throw new Error(e && e.name === 'QuotaExceededError'
      ? '저장 공간이 부족해요. 다른 과일 사진을 지우고 다시 시도해 보세요.'
      : '이미지 저장에 실패했어요.');
  }
}

function resizeImageToDataUrl(file, maxDim, mimeType, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL(mimeType, quality));
      };
      img.onerror = () => reject(new Error('이미지를 불러오지 못했어요.'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽지 못했어요.'));
    reader.readAsDataURL(file);
  });
}

let images = loadImages();
const listEl = document.getElementById('fruitList');
const errorEl = document.getElementById('fruitError');

function rowHtml(tierIdx, meta) {
  const dataUrl = images[tierIdx];
  return `
    <div class="fruit-row">
      <div class="fruit-preview" id="preview-${tierIdx}">${dataUrl ? `<img src="${dataUrl}" alt="">` : meta.emoji}</div>
      <div class="fruit-info">
        <div class="fruit-name">${meta.name} ${meta.emoji}</div>
        <div class="fruit-status" id="status-${tierIdx}">${dataUrl ? '사진 설정됨' : '기본 이모지'}</div>
      </div>
      <div class="fruit-actions">
        <label class="fruit-btn" for="input-${tierIdx}">사진 설정</label>
        <input type="file" id="input-${tierIdx}" accept="image/*" class="fruit-input-hidden" data-tier="${tierIdx}">
        <button type="button" class="fruit-remove${dataUrl ? ' show' : ''}" id="remove-${tierIdx}" data-tier="${tierIdx}">제거</button>
      </div>
    </div>
  `;
}

function renderList() {
  listEl.innerHTML = FRUIT_META.map((meta, i) => rowHtml(i, meta)).join('');
  FRUIT_META.forEach((meta, i) => {
    document.getElementById(`input-${i}`).addEventListener('change', (e) => onUpload(i, e));
    document.getElementById(`remove-${i}`).addEventListener('click', () => onRemove(i));
  });
}

function updateRow(tierIdx) {
  const meta = FRUIT_META[tierIdx];
  const dataUrl = images[tierIdx];
  document.getElementById(`preview-${tierIdx}`).innerHTML = dataUrl ? `<img src="${dataUrl}" alt="">` : meta.emoji;
  document.getElementById(`status-${tierIdx}`).textContent = dataUrl ? '사진 설정됨' : '기본 이모지';
  document.getElementById(`remove-${tierIdx}`).classList.toggle('show', !!dataUrl);
}

async function onUpload(tierIdx, e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  errorEl.style.display = 'none';
  try {
    const dataUrl = await resizeImageToDataUrl(file, 260, 'image/jpeg', 0.8);
    images[tierIdx] = dataUrl;
    saveImages(images);
    updateRow(tierIdx);
  } catch (err) {
    errorEl.textContent = (err && err.message) || '이미지 업로드에 실패했어요.';
    errorEl.style.display = 'block';
  }
}

function onRemove(tierIdx) {
  delete images[tierIdx];
  saveImages(images);
  updateRow(tierIdx);
}

renderList();
</script>
<script src="/dev/devPlanFab.js"></script>
</body>
</html>
