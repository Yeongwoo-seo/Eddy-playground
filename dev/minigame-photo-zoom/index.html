<!DOCTYPE html>
<html lang="ko">
<head>

<title>OPERATION MK · 사진 속 인물 찾기</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}
.frame{position:relative;width:100%;max-width:430px;height:100dvh;height:100vh;height:var(--vh100, 100vh);overflow:hidden;background:var(--bg);display:flex;flex-direction:column;touch-action:none}

/* ===== Shared top bar / pills ===== */
.topbar{position:relative;z-index:6;padding:calc(14px + env(safe-area-inset-top,0)) 16px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.vn-btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block;flex-shrink:0}
.vn-btn:active{transform:scale(.96)}
.progress-pill{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:9px 14px;white-space:nowrap}
.progress-pill .n{color:var(--amber);font-weight:600}

/* ===== Filmstrip grid (default view) ===== */
.grid-view{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0))}
.grid-tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
.grid-title{font-size:22px;font-weight:700;margin-bottom:8px}
.grid-desc{font-size:13.5px;color:var(--text-secondary);line-height:1.6;margin-bottom:20px}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo-card{position:relative;aspect-ratio:640/860;background:var(--surface-1);border:1px solid var(--divider);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s,background .15s}
.photo-card:active{transform:scale(.96);background:var(--surface-2)}
.photo-card .cam-icon{font-size:26px;opacity:.5}
.photo-card .time-label{font-family:var(--mono);font-size:12.5px;color:var(--cyan);font-weight:600}
.photo-card .found-label{font-family:var(--mono);font-size:11px;color:var(--text-muted)}
.photo-card .found-label .n{color:var(--amber)}
.photo-card.complete{border-color:rgba(214,168,75,.5)}
.photo-card .check-badge{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--amber);color:#211703;font-size:13px;font-weight:700;display:none;align-items:center;justify-content:center}
.photo-card.complete .check-badge{display:flex}

/* ===== Full-screen photo viewer ===== */
.viewer-layer{position:absolute;inset:0;z-index:8;background:#05070a;display:none;flex-direction:column}
.viewer-layer.show{display:flex}
.viewer-topbar{position:absolute;top:0;left:0;right:0;z-index:6;padding:calc(14px + env(safe-area-inset-top,0)) 16px 12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.viewer-topbar .vn-btn,.viewer-topbar .progress-pill{pointer-events:auto}
.map-stage{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#05070a}
.map-canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.photo-bg{position:absolute;top:0;left:0;background:linear-gradient(180deg,#8f8873 0%,#8f8873 46%,#6f6a58 46%,#6f6a58 100%)}
.photo-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,0) 45%,rgba(0,0,0,.35) 100%);pointer-events:none}
.case-box{position:absolute;background:rgba(200,220,225,.16);border:2px dashed rgba(230,240,245,.55);border-radius:6px}
.case-glyph{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);background:var(--amber);border-radius:3px;box-shadow:0 0 10px rgba(214,168,75,.6)}
.case-label{position:absolute;left:6px;top:-22px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:rgba(230,240,245,.75)}

.figure{position:absolute;cursor:pointer}
.figure .fig-head{position:absolute;left:50%;top:0;width:46%;padding-top:46%;transform:translateX(-50%);border-radius:50%}
.figure .fig-body{position:absolute;left:12%;top:36%;width:76%;height:64%;border-radius:45% 45% 16% 16%/32% 32% 12% 12%}
.figure .found-ring{position:absolute;left:-14%;top:-10%;width:128%;height:120%;border-radius:50%;border:3px solid var(--amber);opacity:0;box-shadow:0 0 0 3px rgba(214,168,75,.18)}
.figure.found .found-ring{opacity:1;animation:ringPop .5s cubic-bezier(.2,.8,.2,1)}
@keyframes ringPop{0%{transform:scale(.5);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:1}}
.tap-wrong-ring{position:absolute;border-radius:50%;border:3px solid var(--signal-red);opacity:.9;pointer-events:none;animation:tapWrongFade 420ms ease forwards}
@keyframes tapWrongFade{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.4);opacity:0}}

.photo-caption{position:absolute;left:16px;top:calc(58px + env(safe-area-inset-top,0));z-index:6;font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.7);background:rgba(5,7,10,.6);border-radius:10px;padding:6px 10px;max-width:70%}

/* ===== Bottom reaction strip ===== */
.dlg-strip{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0));z-index:7;background:rgba(5,7,10,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.35);padding:14px 16px;display:flex;align-items:flex-end;gap:14px;opacity:0;pointer-events:none;transition:opacity .2s ease}
.dlg-strip.show{opacity:1}
.portrait-wrap{width:52px;height:70px;border-radius:10px;overflow:hidden;background:var(--surface-2);flex-shrink:0;display:flex;align-items:flex-end;justify-content:center}
.portrait-wrap img{width:100%;height:100%;object-fit:cover;object-position:top;display:none}
.portrait-placeholder{width:60%;height:80%;opacity:.35;color:var(--text-secondary)}
.dlg-body-wrap{flex:1;min-width:0}
.dlg-name{font-size:13.5px;font-weight:700;color:var(--cyan);margin-bottom:4px}
.dlg-name:empty{display:none}
.dlg-text{font-size:14.5px;line-height:1.55;color:#fff;white-space:pre-wrap;word-break:keep-all}

/* ===== Success dialogue overlay ===== */
.success-layer{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;justify-content:flex-end;cursor:pointer;background:rgba(0,0,0,.55)}
.success-layer.show{display:flex}
.success-char-wrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s ease}
.success-char-wrap.show{opacity:1}
.success-char-img{max-height:74%;max-width:88%;object-fit:contain;object-position:bottom}
.success-char-placeholder{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:40%;height:58%;opacity:.35;display:flex;align-items:flex-end;justify-content:center;color:var(--text-secondary)}
.success-char-placeholder svg{width:100%;height:100%}
.success-dlg{position:relative;margin:0 16px calc(16px + env(safe-area-inset-bottom,0));background:rgba(5,7,10,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.35);padding:18px 20px;min-height:22vh;display:flex;flex-direction:column}
.success-name{font-size:15px;font-weight:700;color:var(--cyan);margin-bottom:8px}
.success-name:empty{display:none}
.success-text{flex:1;font-size:16px;line-height:1.65;color:#fff;white-space:pre-wrap;word-break:keep-all}
.success-foot{display:flex;justify-content:flex-end;padding-top:6px}
.success-arrow{font-size:13px;color:var(--text-secondary);visibility:hidden}
@keyframes arrowBob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.success-arrow.show{visibility:visible;animation:arrowBob 1.1s ease-in-out infinite}

.fade-overlay{position:absolute;inset:0;z-index:10;background:#000;opacity:0;pointer-events:none;transition:opacity .9s ease}
.fade-overlay.show{opacity:1}
</style>
</head>

<div class="frame" id="frame">

  <div class="grid-view" id="gridView">
    <div class="topbar" style="padding-left:0;padding-right:0">
      <a class="vn-btn" href="/dev/">← DEV</a>

<script>
function setVh100() { document.documentElement.style.setProperty('--vh100', window.innerHeight + 'px'); }
setVh100();
window.addEventListener('resize', setVh100);
window.addEventListener('orientationchange', setVh100);

if ('serviceWorker' in navigator) {

<script src="/dev/assetDb.js"></script>

<script>
/* ===== 사진 속 인물 찾기 — week1-scene-005-minigame =====
   전시장 직원이 건넨 사진 6장. 각 사진은 K-01 진열장(고정 위치)과 그 주변의
   인물 몇 명으로 구성된 순수 CSS/DOM 씬(이미지 파일 없음 — char-placeholder류
   추상 인물 아이콘과 같은 방식). 사진마다 실제로 케이스 근처에 있던 인물
   (correct:true)과 그냥 지나가는 관광객(distractor)이 섞여 있고, 플레이어는
   확대(핀치줌/팬)해서 케이스 근처 인물을 찾아 눌러야 한다.

   6장에 걸쳐 반복 등장하는 세 사람(윤민아/애드리언 콜/레오 박에 해당하는
   베이지 코트·네이비 수트·그레이 후드) + 인파 속에 딱 한 번 나오는 얼굴 없는
   인물, 총 8회 목격을 다 찾으면 완료. 이름은 아직 밝히지 않는다 —
   week1-scene-006/007/008에서 실제로 만나기 전이라 서술만 색/옷차림으로 한다. */
const CANVAS_W = 640, CANVAS_H = 860;
const REQUIRED_TOTAL = 8;

// 모든 사진에서 고정된 K-01 진열장 위치 (같은 방, 같은 케이스).
const CASE_BOX = { cx: 320, cy: 344, w: 150, h: 110 };

const PERSON_DEFS = {
  minah: {
    tag: '베이지 코트 여성', fill: '#D8C4A0',
    evidenceTitle: '베이지 코트를 입은 여성',
    evidenceDesc: 'K-01 진열장 앞에서 여러 번 서성이는 모습이 사진에 반복해서 찍혔다.',
  },
  adrian: {
    tag: '네이비 수트 남성', fill: '#33435E',
    evidenceTitle: '네이비 수트를 입은 남성',
    evidenceDesc: '단정한 정장 차림으로 케이스 주변을 오갔다.',
  },
  leo: {
    tag: '그레이 후드 남성', fill: '#6B7280',
    evidenceTitle: '그레이 후드를 입은 남성',
    evidenceDesc: '인파가 몰려들기 직전까지 케이스 근처에 서 있다가, 그 뒤로는 사진에 나오지 않는다.',
  },
  unknown: {
    tag: '얼굴이 안 보이는 인물', fill: '#15181C',
    evidenceTitle: '얼굴이 찍히지 않은 검은 재킷 인물',
    evidenceDesc: '인파 속에서 카메라를 등지고 있어, 이 사진들 중 어디에서도 얼굴이 나오지 않는다.',
  },
};

const PHOTOS = [
  {
    time: '10:41', caption: '아직 한산한 전시장', hasItem: true,
    figures: [
      { personKey: 'minah', cx: 280, cy: 460, w: 70, h: 150, correct: true },
      { tag: '관광객', cx: 520, cy: 660, w: 60, h: 130, correct: false },
    ],
  },
  {
    time: '10:43', caption: '케이스 앞에 두 사람이 멈춰 선다', hasItem: true,
    figures: [
      { personKey: 'adrian', cx: 230, cy: 440, w: 72, h: 156, correct: true },
      { personKey: 'leo', cx: 410, cy: 450, w: 72, h: 156, correct: true },
      { tag: '관광객', cx: 100, cy: 710, w: 56, h: 120, correct: false },
    ],
  },
  {
    time: '10:45', caption: '다시 케이스 앞, 사진 찍는 손님', hasItem: true,
    figures: [
      { personKey: 'minah', cx: 380, cy: 430, w: 70, h: 150, correct: true },
      { tag: '관광객', cx: 540, cy: 260, w: 50, h: 108, correct: false },
      { tag: '관광객', cx: 130, cy: 720, w: 56, h: 120, correct: false },
    ],
  },
  {
    time: '10:47', caption: '단체 관광객이 밀려들어오는 순간', hasItem: true,
    figures: [
      { personKey: 'leo', cx: 390, cy: 460, w: 66, h: 146, correct: true },
      { personKey: 'unknown', cx: 480, cy: 380, w: 60, h: 136, correct: true },
      { tag: '관광객', cx: 150, cy: 310, w: 50, h: 108, correct: false },
      { tag: '관광객', cx: 210, cy: 610, w: 54, h: 118, correct: false },
      { tag: '관광객', cx: 530, cy: 660, w: 56, h: 122, correct: false },
      { tag: '관광객', cx: 80, cy: 510, w: 48, h: 104, correct: false },
    ],
  },
  {
    time: '10:50', caption: '인파가 절정일 때', hasItem: true,
    figures: [
      { personKey: 'adrian', cx: 260, cy: 440, w: 66, h: 142, correct: true },
      { personKey: 'minah', cx: 430, cy: 420, w: 66, h: 142, correct: true },
      { tag: '관광객', cx: 150, cy: 650, w: 52, h: 112, correct: false },
      { tag: '관광객', cx: 550, cy: 610, w: 52, h: 112, correct: false },
      { tag: '관광객', cx: 330, cy: 710, w: 50, h: 108, correct: false },
    ],
  },
  {
    time: '10:53', caption: '인파가 빠져나간 뒤, 케이스는 비어 있다', hasItem: false,
    figures: [
      { tag: '관광객', cx: 500, cy: 700, w: 56, h: 120, correct: false },
    ],
  },
];

const TAP_RADIUS = 60; // canvas-space px — generous, touch-friendly hit radius per figure

let foundIds = new Set(); // `${photoIdx}-${figIdx}` of every correct figure already found
let sightingCounts = {}; // personKey -> how many correct sightings found so far
let evidenceGranted = new Set(); // personKey already registered as CaseFileState evidence
let activePhotoIdx = -1;
let figureEls = []; // DOM refs for the currently-open photo's figures, index-aligned to PHOTOS[activePhotoIdx].figures
let wrongClickCount = 0;

const el = {
  gridProgressN: document.getElementById('gridProgressN'),
  photoGrid: document.getElementById('photoGrid'),
  viewerLayer: document.getElementById('viewerLayer'),
  viewerProgressN: document.getElementById('viewerProgressN'),
  mapStage: document.getElementById('mapStage'),
  mapCanvas: document.getElementById('mapCanvas'),
  photoCaption: document.getElementById('photoCaption'),
  closeViewerBtn: document.getElementById('closeViewerBtn'),
  dlgStrip: document.getElementById('dlgStrip'),
  portraitWrap: document.getElementById('portraitWrap'),
  portraitImg: document.getElementById('portraitImg'),
  portraitPlaceholder: document.getElementById('portraitPlaceholder'),
  dlgName: document.getElementById('dlgName'),
  dlgText: document.getElementById('dlgText'),
  successLayer: document.getElementById('successLayer'),
  successCharWrap: document.getElementById('successCharWrap'),
  successCharImg: document.getElementById('successCharImg'),
  successCharPlaceholder: document.getElementById('successCharPlaceholder'),
  successName: document.getElementById('successName'),
  successText: document.getElementById('successText'),
  successArrow: document.getElementById('successArrow'),
  fadeOverlay: document.getElementById('fadeOverlay'),
};

function totalFound() { return foundIds.size; }
function foundInPhoto(photoIdx) {
  return PHOTOS[photoIdx].figures.filter((f, i) => f.correct && foundIds.has(`${photoIdx}-${i}`)).length;
}
function correctInPhoto(photoIdx) { return PHOTOS[photoIdx].figures.filter(f => f.correct).length; }

function updateProgressUi() {
  el.gridProgressN.textContent = totalFound();
  el.viewerProgressN.textContent = totalFound();
}

/* ===== Grid (filmstrip) ===== */
function renderGrid() {
  el.photoGrid.innerHTML = PHOTOS.map((p, i) => {
    const need = correctInPhoto(i);
    const have = foundInPhoto(i);
    const complete = need > 0 && have === need;
    return `
      <div class="photo-card${complete ? ' complete' : ''}" data-idx="${i}">
        <div class="check-badge">✓</div>
        <div class="cam-icon">📷</div>
        <div class="time-label">${p.time}</div>
        <div class="found-label">${need ? `발견 <span class="n">${have}</span>/${need}` : '단서 없음'}</div>
      </div>`;
  }).join('');
  el.photoGrid.querySelectorAll('.photo-card').forEach(card => {
    card.addEventListener('click', () => openPhoto(parseInt(card.dataset.idx, 10)));
  });
  updateProgressUi();
}

/* ===== Pan + pinch/wheel zoom (same math as minigame-eastwood) ===== */
let scale = 1, baseScale = 1, tx = 0, ty = 0;
const pointers = new Map();
let panStart = null;
let pinchStartDist = 0, pinchStartScale = 1;
let didPan = false;
let pressedPoint = null;
const MIN_SCALE_MULT = 1, MAX_SCALE_MULT = 3;

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
function clampScale(s) { return Math.min(Math.max(s, baseScale * MIN_SCALE_MULT), baseScale * MAX_SCALE_MULT); }
function clampPan() {
  const rect = el.mapStage.getBoundingClientRect();
  const scaledW = CANVAS_W * scale, scaledH = CANVAS_H * scale;
  tx = scaledW <= rect.width ? (rect.width - scaledW) / 2 : Math.min(0, Math.max(rect.width - scaledW, tx));
  ty = scaledH <= rect.height ? (rect.height - scaledH) / 2 : Math.min(0, Math.max(rect.height - scaledH, ty));
}
function applyTransform() { clampPan(); el.mapCanvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }
function fitToStage() {
  if (activePhotoIdx < 0) return;
  const rect = el.mapStage.getBoundingClientRect();
  if (!rect.height) return;
  baseScale = rect.height / CANVAS_H;
  scale = baseScale;
  tx = (rect.width - CANVAS_W * scale) / 2;
  ty = (rect.height - CANVAS_H * scale) / 2;
  applyTransform();
}
window.addEventListener('resize', fitToStage);
window.addEventListener('orientationchange', fitToStage);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitToStage);

function screenToCanvas(clientX, clientY) {
  const rect = el.mapStage.getBoundingClientRect();
  const stageX = clientX - rect.left, stageY = clientY - rect.top;
  return { x: (stageX - tx) / scale, y: (stageY - ty) / scale };
}

el.mapStage.addEventListener('pointerdown', (e) => {
  if (activePhotoIdx < 0) return;
  el.mapStage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  didPan = false;
  if (pointers.size === 1) {
    panStart = { x: e.clientX, y: e.clientY, tx, ty };
    pressedPoint = screenToCanvas(e.clientX, e.clientY);
  } else if (pointers.size === 2) {
    pressedPoint = null;
    const pts = [...pointers.values()];
    pinchStartDist = dist(pts[0], pts[1]);
    pinchStartScale = scale;
  }
});
el.mapStage.addEventListener('pointermove', (e) => {
  if (activePhotoIdx < 0 || !pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1 && panStart) {
    const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) didPan = true;
    tx = panStart.tx + dx;
    ty = panStart.ty + dy;
    applyTransform();
  } else if (pointers.size === 2) {
    const pts = [...pointers.values()];
    const d = dist(pts[0], pts[1]);
    const newScale = clampScale(pinchStartScale * (d / pinchStartDist));
    const rect = el.mapStage.getBoundingClientRect();
    const midNow = mid(pts[0], pts[1]);
    const stageX = midNow.x - rect.left, stageY = midNow.y - rect.top;
    const ratio = newScale / scale;
    tx = stageX - (stageX - tx) * ratio;
    ty = stageY - (stageY - ty) * ratio;
    scale = newScale;
    didPan = true;
    applyTransform();
  }
});
['pointerup', 'pointercancel'].forEach(evt => el.mapStage.addEventListener(evt, (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStartDist = 0;
  if (pointers.size === 0) {
    panStart = null;
    if (evt === 'pointerup' && !didPan && activePhotoIdx >= 0 && pressedPoint) onCanvasTap(pressedPoint);
    pressedPoint = null;
  }
}));
el.mapStage.addEventListener('wheel', (e) => {
  if (activePhotoIdx < 0) return;
  e.preventDefault();
  const rect = el.mapStage.getBoundingClientRect();
  const stageX = e.clientX - rect.left, stageY = e.clientY - rect.top;
  const newScale = clampScale(scale * (e.deltaY < 0 ? 1.1 : 0.9));
  const ratio = newScale / scale;
  tx = stageX - (stageX - tx) * ratio;
  ty = stageY - (stageY - ty) * ratio;
  scale = newScale;
  applyTransform();
}, { passive: false });

/* ===== Build a photo scene (background + case + figures) ===== */
function buildPhoto(photoIdx) {
  el.mapCanvas.innerHTML = '';
  el.mapCanvas.style.width = CANVAS_W + 'px';
  el.mapCanvas.style.height = CANVAS_H + 'px';
  const photo = PHOTOS[photoIdx];

  const bg = document.createElement('div');
  bg.className = 'photo-bg';
  Object.assign(bg.style, { width: CANVAS_W + 'px', height: CANVAS_H + 'px' });
  el.mapCanvas.appendChild(bg);

  const vignette = document.createElement('div');
  vignette.className = 'photo-vignette';
  Object.assign(vignette.style, { width: CANVAS_W + 'px', height: CANVAS_H + 'px' });
  el.mapCanvas.appendChild(vignette);

  const caseBox = document.createElement('div');
  caseBox.className = 'case-box';
  Object.assign(caseBox.style, {
    left: (CASE_BOX.cx - CASE_BOX.w / 2) + 'px', top: (CASE_BOX.cy - CASE_BOX.h / 2) + 'px',
    width: CASE_BOX.w + 'px', height: CASE_BOX.h + 'px',
  });
  const caseLabel = document.createElement('div');
  caseLabel.className = 'case-label';
  caseLabel.textContent = 'K-01';
  caseBox.appendChild(caseLabel);
  if (photo.hasItem) {
    const glyph = document.createElement('div');
    glyph.className = 'case-glyph';
    caseBox.appendChild(glyph);
  }
  el.mapCanvas.appendChild(caseBox);

  figureEls = photo.figures.map((fig, figIdx) => {
    const wrap = document.createElement('div');
    wrap.className = 'figure';
    Object.assign(wrap.style, {
      left: (fig.cx - fig.w / 2) + 'px', top: (fig.cy - fig.h) + 'px',
      width: fig.w + 'px', height: fig.h + 'px',
    });
    const color = fig.personKey ? PERSON_DEFS[fig.personKey].fill : '#8A93A6';
    const ring = document.createElement('div');
    ring.className = 'found-ring';
    const body = document.createElement('div');
    body.className = 'fig-body';
    body.style.background = color;
    const head = document.createElement('div');
    head.className = 'fig-head';
    head.style.background = color;
    wrap.appendChild(ring);
    wrap.appendChild(body);
    wrap.appendChild(head);
    if (fig.correct && foundIds.has(`${photoIdx}-${figIdx}`)) wrap.classList.add('found');
    el.mapCanvas.appendChild(wrap);
    return wrap;
  });

  el.photoCaption.textContent = `${photo.time} · ${photo.caption}`;
}

function flashWrongAtPoint(point) {
  const ring = document.createElement('div');
  ring.className = 'tap-wrong-ring';
  const r = 40;
  Object.assign(ring.style, { left: (point.x - r) + 'px', top: (point.y - r) + 'px', width: r * 2 + 'px', height: r * 2 + 'px' });
  el.mapCanvas.appendChild(ring);
  setTimeout(() => ring.remove(), 450);
}

/* ===== Portrait + dialogue strip ===== */
async function updatePortrait(characterKey) {
  const assetId = DevGameState.getCharacterAssetId(characterKey, MINIGAME_FACE_EXPRESSION);
  const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
  if (asset && asset.dataUrl) {
    el.portraitImg.src = asset.dataUrl;
    el.portraitImg.style.display = '';
    el.portraitPlaceholder.style.display = 'none';
  } else {
    el.portraitImg.removeAttribute('src');
    el.portraitImg.style.display = 'none';
    el.portraitPlaceholder.style.display = '';
  }
}
const SPEAKER_TO_CHARACTER_KEY = { '지수': 'jisoo', '영우': 'youngwoo' };
let reactionHideTimer = null;
function say(speakerName, text) {
  clearTimeout(reactionHideTimer);
  el.dlgName.textContent = speakerName;
  el.dlgText.textContent = text;
  updatePortrait(SPEAKER_TO_CHARACTER_KEY[speakerName] || null);
  el.dlgStrip.classList.add('show');
  reactionHideTimer = setTimeout(() => el.dlgStrip.classList.remove('show'), 3200);
}

/* ===== Tap logic ===== */
const WRONG_LINES = [
  ['지수', '음... 이 사람은 그냥 지나가던 사람 같은데.'],
  ['지수', '이 사람은 케이스 근처는 아니었어요.'],
  ['영우', '다른 사진도 한번 넘겨서 봐봐.'],
];
const FIRST_FIND_LINES = {
  minah: ['지수', '어? 이분, 케이스 바로 앞에 서 있었네요.'],
  adrian: ['영우', '이쪽은 정장 입은 사람이네. 직원인가?'],
  leo: ['지수', '이 사람도 케이스 앞에 있었어요.'],
  unknown: ['지수', '...잠깐, 이 사람은 얼굴이 하나도 안 보이는데?'],
};
const REPEAT_FIND_LINES = {
  minah: { 2: ['영우', '어, 또 이 여자분이네.'], 3: ['지수', '이걸로 세 번째예요. 계속 여기 있었어요.'] },
  adrian: { 2: ['지수', '이 사람도 두 번째로 나오네요.'] },
  leo: { 2: ['영우', '이 사람도 두 번째... 근데 이게 마지막 사진이네.'] },
};

function onCanvasTap(point) {
  if (activePhotoIdx < 0) return;
  const photo = PHOTOS[activePhotoIdx];
  let bestIdx = -1, bestDist = Infinity;
  photo.figures.forEach((fig, i) => {
    const d = Math.hypot(point.x - fig.cx, point.y - (fig.cy - fig.h / 2));
    if (d <= TAP_RADIUS && d < bestDist) { bestDist = d; bestIdx = i; }
  });
  if (bestIdx === -1) { flashWrongAtPoint(point); return; }
  const fig = photo.figures[bestIdx];
  if (!fig.correct) {
    flashWrongAtPoint(point);
    wrongClickCount++;
    const line = WRONG_LINES[Math.min(wrongClickCount, WRONG_LINES.length) - 1];
    say(line[0], line[1]);
    return;
  }
  const figId = `${activePhotoIdx}-${bestIdx}`;
  if (foundIds.has(figId)) return; // already logged — just no-op, ring already shown
  foundIds.add(figId);
  figureEls[bestIdx].classList.add('found');
  sightingCounts[fig.personKey] = (sightingCounts[fig.personKey] || 0) + 1;
  const count = sightingCounts[fig.personKey];

  if (!evidenceGranted.has(fig.personKey)) {
    evidenceGranted.add(fig.personKey);
    const def = PERSON_DEFS[fig.personKey];
    CaseFileState.addEvidence({
      id: `evidence-photo-${fig.personKey}`, code: 'E-K01', title: def.evidenceTitle,
      description: def.evidenceDesc, discoveredLocationText: 'Pop-up Exhibition · 사건 직전 사진',
    });
  }
  const line = (REPEAT_FIND_LINES[fig.personKey] && REPEAT_FIND_LINES[fig.personKey][count]) || FIRST_FIND_LINES[fig.personKey];
  say(line[0], line[1]);
  updateProgressUi();

  if (totalFound() >= REQUIRED_TOTAL) {
    setTimeout(startSuccessDialogue, 1400);
  }
}

/* ===== Viewer open/close ===== */
function openPhoto(idx) {
  activePhotoIdx = idx;
  wrongClickCount = 0;
  buildPhoto(idx);
  el.viewerLayer.classList.add('show');
  fitToStage();
  el.dlgStrip.classList.remove('show');
}
function closePhoto() {
  activePhotoIdx = -1;
  el.viewerLayer.classList.remove('show');
  renderGrid();
}
el.closeViewerBtn.addEventListener('click', closePhoto);

/* ===== Success sequence ===== */
async function updateSuccessAvatar(characterId, expression) {
  if (!characterId) { el.successCharWrap.classList.remove('show'); return; }
  el.successCharWrap.classList.add('show');
  const assetId = DevGameState.getCharacterAssetId(characterId, expression);
  const asset = await AssetDB.getAsset(assetId).catch(() => null);
  if (asset && asset.dataUrl) {
    el.successCharImg.src = asset.dataUrl;
    el.successCharImg.style.display = '';
    el.successCharPlaceholder.style.display = 'none';
  } else {
    el.successCharImg.removeAttribute('src');
    el.successCharImg.style.display = 'none';
    el.successCharPlaceholder.style.display = '';
  }
  const t = DevGameState.getCharacterTransform(characterId);
  el.successCharImg.style.transform = `translate(${t.x}px, ${t.y}px) scale(${t.scale})`;
}

const successLines = [
  { speaker: '영우', text: '다 찾은 것 같은데?', characterId: 'youngwoo', expression: 'soft' },
  { speaker: '지수', text: '정리해보면...\n케이스 앞에 반복해서 나온 사람이 셋이에요.', characterId: 'jisoo', expression: 'serious' },
  { speaker: '영우', text: '베이지 코트, 수트 입은 사람, 후드 쓴 사람.', characterId: 'youngwoo', expression: 'curious' },
  { speaker: '지수', text: '근데 이거 봐요.\n인파 속에 딱 한 번, 얼굴이 하나도 안 나온 사람도 있어요.', characterId: 'jisoo', expression: 'suspicious' },
  { speaker: '영우', text: '...\n일부러 피한 걸까?', characterId: 'youngwoo', pauseBeforeMs: 300, expression: 'blank' },
  { speaker: '지수', text: '모르겠어요.\n일단 이 세 명부터 찾아서 물어보죠.', characterId: 'jisoo', expression: 'serious' },
];

function startSuccessDialogue() {
  el.viewerLayer.classList.remove('show');
  el.successLayer.classList.add('show');
  const player = createVNPlayer({
    onLineChange: (line) => {
      el.successName.textContent = line.speaker || '';
      updateSuccessAvatar(line.characterId, line.expression);
    },
    onTextUpdate: (text) => { el.successText.textContent = text; },
    onArrow: (show) => el.successArrow.classList.toggle('show', show),
    onComplete: fadeOutAndRedirect,
  });
  player.load(successLines);
  el.successLayer.addEventListener('click', () => player.tap());
}

function fadeOutAndRedirect() {
  el.fadeOverlay.classList.add('show');
  setTimeout(() => { location.href = '/dev/game/?scene=week1-scene-006'; }, 950);
}

/* ===== Boot ===== */
document.getElementById('gridProgressTotal').textContent = REQUIRED_TOTAL;
document.getElementById('viewerProgressTotal').textContent = REQUIRED_TOTAL;
renderGrid();
</script>
