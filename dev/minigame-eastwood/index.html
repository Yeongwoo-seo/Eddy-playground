<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--violet:#8B7BD8;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}

.frame{position:relative;width:100%;max-width:430px;height:100dvh;height:100vh;height:var(--vh100, 100vh);overflow:hidden;background:#0d1114;display:flex;flex-direction:column}

/* ===== Top bar ===== */
.topbar{position:absolute;top:0;left:0;right:0;z-index:6;padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.vn-btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#fff;background:rgba(8,10,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block;pointer-events:auto}

/* ===== Mission card ===== */
.mission-card{position:absolute;top:calc(58px + env(safe-area-inset-top,0));left:16px;right:16px;z-index:5;background:rgba(16,20,25,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--divider);border-radius:16px;padding:12px 16px;pointer-events:none}
.mission-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px}
.mission-target{font-size:19px;font-weight:800;color:var(--amber);letter-spacing:.02em}
.mission-sub{font-size:12px;color:var(--text-secondary);margin-top:4px;line-height:1.4}

/* ===== Map stage ===== */
.map-stage{position:absolute;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(circle at 30% 20%,#141a20 0%,#0a0d10 70%)}
.map-canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
@keyframes areaGlow{0%,100%{opacity:.1}50%{opacity:.4}}

/* ===== Map overlays (uploaded map image + hand-marked hotspot) ===== */
.image-area-glow{position:absolute;border-radius:50%;background:var(--amber);opacity:0;pointer-events:none}
.image-area-glow.show{animation:areaGlow 1.6s ease-in-out infinite}
.image-pulse-ring{position:absolute;border-radius:50%;border:4px solid var(--cyan);opacity:0;pointer-events:none;transform-origin:center}
.image-pulse-ring.success{animation:imgPulseRing 900ms ease-out}
@keyframes imgPulseRing{0%{transform:scale(.3);opacity:.9;border-width:6px}100%{transform:scale(2.2);opacity:0;border-width:1px}}
.tap-wrong-ring{position:absolute;border-radius:50%;border:3px solid var(--signal-red);opacity:.9;pointer-events:none;animation:tapWrongFade 420ms ease forwards}
@keyframes tapWrongFade{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.4);opacity:0}}

/* ===== Final-stop stamp ===== */
.stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);z-index:7;font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:.14em;color:var(--cyan);text-shadow:0 0 24px rgba(89,184,200,.6);opacity:0;pointer-events:none}
.stamp.show{animation:stampPop 1.1s ease-out forwards}
@keyframes stampPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}

/* ===== Bottom dialogue strip (idle/reaction commentary) ===== */
.dlg-strip{position:absolute;left:0;right:0;bottom:0;z-index:5;min-height:22vh;background:rgba(5,7,10,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.08);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0));display:flex;align-items:flex-end;gap:14px;transition:opacity .2s ease}
.dlg-strip.hidden{display:none}
.portrait-wrap{width:64px;height:88px;border-radius:12px;overflow:hidden;background:var(--surface-2);flex-shrink:0;display:flex;align-items:flex-end;justify-content:center}
.portrait-wrap img{width:100%;height:100%;object-fit:cover;object-position:top;display:none}
.portrait-placeholder{width:60%;height:80%;opacity:.35;color:var(--text-secondary)}
.dlg-body-wrap{flex:1;min-width:0}
.dlg-name{font-size:14px;font-weight:700;color:var(--cyan);margin-bottom:4px}
.dlg-name:empty{display:none}
.dlg-text{font-size:15px;line-height:1.55;color:#fff;white-space:pre-wrap;word-break:keep-all}

/* ===== Success dialogue overlay (reuses VN-style tap-to-advance) ===== */
.success-layer{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;justify-content:flex-end;cursor:pointer}
.success-layer.show{display:flex}
.success-dlg{background:rgba(5,7,10,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.08);padding:18px 20px calc(18px + env(safe-area-inset-bottom,0));min-height:24vh;display:flex;flex-direction:column}
.success-name{font-size:15px;font-weight:700;color:var(--cyan);margin-bottom:8px}
.success-name:empty{display:none}
.success-text{flex:1;font-size:16px;line-height:1.65;color:#fff;white-space:pre-wrap;word-break:keep-all}
.success-foot{display:flex;justify-content:flex-end;padding-top:6px}
.success-arrow{font-size:13px;color:var(--text-secondary);visibility:hidden}
@keyframes arrowBob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.success-arrow.show{visibility:visible;animation:arrowBob 1.1s ease-in-out infinite}

/* ===== Fade to black + redirect ===== */
.fade-overlay{position:absolute;inset:0;z-index:9;background:#000;opacity:0;pointer-events:none;transition:opacity .9s ease}
.fade-overlay.show{opacity:1}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="map-stage" id="mapStage">
    <div class="map-canvas" id="mapCanvas"></div>
  </div>

  <div class="mission-card">
    <div class="mission-label" id="missionLabel">목적지 찾기</div>
    <div class="mission-target" id="missionTarget"></div>
    <div class="mission-sub" id="missionSub"></div>
  </div>

  <div class="topbar">
    <a class="vn-btn" href="/dev/">← DEV</a>
    <a class="vn-btn" href="/dev/upload/?scene=week1-scene-001-2&kind=minigame">지도 업로드</a>
  </div>

  <div class="stamp" id="stamp"></div>

  <div class="dlg-strip" id="dlgStrip">
    <div class="portrait-wrap" id="portraitWrap">
      <img id="portraitImg" alt="">
      <svg class="portrait-placeholder" id="portraitPlaceholder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
    </div>
    <div class="dlg-body-wrap">
      <div class="dlg-name" id="dlgName"></div>
      <div class="dlg-text" id="dlgText"></div>
    </div>
  </div>

  <div class="success-layer" id="successLayer">
    <div class="success-dlg">
      <div class="success-name" id="successName"></div>
      <div class="success-text" id="successText"></div>
      <div class="success-foot"><span class="success-arrow" id="successArrow">▼</span></div>
    </div>
  </div>

  <div class="fade-overlay" id="fadeOverlay"></div>
</div>

<script>
function setVh100() { document.documentElement.style.setProperty('--vh100', window.innerHeight + 'px'); }
setVh100();
window.addEventListener('resize', setVh100);
window.addEventListener('orientationchange', setVh100);
if (window.visualViewport) window.visualViewport.addEventListener('resize', setVh100);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script src="/dev/assetDb.js"></script>
<script src="/dev/dialogueData.js"></script>
<script src="/dev/vnPlayer.js"></script>
<script>
/* ===== Route-map minigame: an uploaded map image + hand-marked answer
   hotspots (배경 DB → 미니게임, /dev/upload). Players tap the map image
   itself — there is no schematic fallback map, so a background image and
   all 3 hotspots must be set via /dev/upload before this page works. ===== */
const MINIGAME_ID = 'week1-scene-001-2-minigame';
const HOTSPOT_MIN_FR = 0.035; // floor on tap-target size so a careless hotspot still stays easy to hit

// 3-stop sequence, in find-order. `key` is the display name shown in the
// mission card / spoken dialogue; `label` is its Korean gloss.
const STAGES = [
  { key: 'International Airport', label: '공항' },
  { key: 'Eastwood', label: '이스트우드' },
  { key: 'Marayong', label: '마라용' },
];
let stageIndex = 0;
let CANVAS_W = 0, CANVAS_H = 0;
let hotspots = null; // [{ fx, fy, fr } x3]
let mapImageGlowEls = [], mapImagePulseEls = [];

const el = {
  frame: document.getElementById('frame'),
  mapStage: document.getElementById('mapStage'),
  mapCanvas: document.getElementById('mapCanvas'),
  missionLabelEl: document.getElementById('missionLabel'),
  missionTarget: document.getElementById('missionTarget'),
  missionSub: document.getElementById('missionSub'),
  stamp: document.getElementById('stamp'),
  dlgStrip: document.getElementById('dlgStrip'),
  portraitWrap: document.getElementById('portraitWrap'),
  portraitImg: document.getElementById('portraitImg'),
  portraitPlaceholder: document.getElementById('portraitPlaceholder'),
  dlgName: document.getElementById('dlgName'),
  dlgText: document.getElementById('dlgText'),
  successLayer: document.getElementById('successLayer'),
  successName: document.getElementById('successName'),
  successText: document.getElementById('successText'),
  successArrow: document.getElementById('successArrow'),
  fadeOverlay: document.getElementById('fadeOverlay'),
};

/* ===== Build the map ===== */
// The uploaded background image becomes the map, sized to its natural pixel
// dimensions (CANVAS_W/H) so map-canvas's own pan/zoom transform scales it.
// The hotspots (and their hint-glow / success-pulse) are separate
// absolutely-positioned siblings in that same natural-pixel coordinate space.
function buildImageMap(url) {
  const img = document.createElement('img');
  img.src = url;
  img.alt = '';
  img.draggable = false;
  Object.assign(img.style, { position: 'absolute', left: '0', top: '0', width: CANVAS_W + 'px', height: CANVAS_H + 'px' });
  el.mapCanvas.appendChild(img);

  mapImageGlowEls = [];
  mapImagePulseEls = [];
  hotspots.forEach(hs => {
    const r = Math.max(hs.fr, HOTSPOT_MIN_FR) * CANVAS_W;
    const cx = hs.fx * CANVAS_W, cy = hs.fy * CANVAS_H;

    const glow = document.createElement('div');
    glow.className = 'image-area-glow';
    Object.assign(glow.style, { left: (cx - r * 1.6) + 'px', top: (cy - r * 1.6) + 'px', width: r * 3.2 + 'px', height: r * 3.2 + 'px' });
    el.mapCanvas.appendChild(glow);
    mapImageGlowEls.push(glow);

    const pulse = document.createElement('div');
    pulse.className = 'image-pulse-ring';
    Object.assign(pulse.style, { left: (cx - r) + 'px', top: (cy - r) + 'px', width: r * 2 + 'px', height: r * 2 + 'px' });
    el.mapCanvas.appendChild(pulse);
    mapImagePulseEls.push(pulse);
  });
}

async function initMap() {
  const assetId = DevGameState.getBackgroundId(MINIGAME_ID);
  const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
  const savedHotspots = STAGES.map((_, i) => DevGameState.getMinigameHotspot(MINIGAME_ID, i));
  if (!asset || !asset.dataUrl || !savedHotspots.every(Boolean)) {
    showMissingMapNotice();
    return false;
  }
  hotspots = savedHotspots;
  CANVAS_W = asset.width;
  CANVAS_H = asset.height;
  await AssetDB.preloadImage(asset.dataUrl);
  buildImageMap(asset.dataUrl);
  fitToStage();
  updateMissionCard();
  return true;
}

function showMissingMapNotice() {
  el.missionLabelEl.textContent = '준비 필요';
  el.missionTarget.textContent = '지도 없음';
  el.missionSub.textContent = '오른쪽 위 "지도 업로드"에서 배경 이미지와 정답 영역 3개를 먼저 지정하세요.';
  say('jisoo', 'blank', '지수', '어? 지도가 없는데?');
}

function updateMissionCard() {
  const stage = STAGES[stageIndex];
  el.missionTarget.textContent = stage.key;
  el.missionSub.textContent = `노선도에서 ${stage.label}역을 찾아 클릭하세요. (${stageIndex + 1}/${STAGES.length})`;
}

/* ===== Pan + pinch/wheel zoom ===== */
let scale = 1, baseScale = 1, tx = 0, ty = 0;
const pointers = new Map();
let panStart = null;
let pinchStartDist = 0, pinchStartScale = 1;
let didPan = false;
let pressedPoint = null;
const MIN_SCALE_MULT = 0.7, MAX_SCALE_MULT = 3;

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
function clampScale(s) { return Math.min(Math.max(s, baseScale * MIN_SCALE_MULT), baseScale * MAX_SCALE_MULT); }
function applyTransform() { el.mapCanvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }

function fitToStage() {
  const rect = el.mapStage.getBoundingClientRect();
  baseScale = Math.min(rect.width / CANVAS_W, rect.height / CANVAS_H) * 0.94;
  scale = baseScale;
  tx = (rect.width - CANVAS_W * scale) / 2;
  ty = (rect.height - CANVAS_H * scale) / 2;
  applyTransform();
}
window.addEventListener('resize', fitToStage);

function screenToCanvas(clientX, clientY) {
  const rect = el.mapStage.getBoundingClientRect();
  const stageX = clientX - rect.left, stageY = clientY - rect.top;
  return { x: (stageX - tx) / scale, y: (stageY - ty) / scale };
}

el.mapStage.addEventListener('pointerdown', (e) => {
  if (isCompleted) return;
  // setPointerCapture retargets the synthetic 'click' event to mapStage
  // itself, not whatever was under the finger — so the tap is detected here
  // from the original press point instead of relying on a 'click' listener.
  el.mapStage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  didPan = false;
  if (pointers.size === 1) {
    panStart = { x: e.clientX, y: e.clientY, tx, ty };
    pressedPoint = screenToCanvas(e.clientX, e.clientY);
  } else if (pointers.size === 2) {
    pressedPoint = null; // a second finger down means this is a pinch, not a tap
    const pts = [...pointers.values()];
    pinchStartDist = dist(pts[0], pts[1]);
    pinchStartScale = scale;
  }
});
el.mapStage.addEventListener('pointermove', (e) => {
  if (isCompleted || !pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1 && panStart) {
    const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) didPan = true;
    tx = panStart.tx + dx;
    ty = panStart.ty + dy;
    applyTransform();
  } else if (pointers.size === 2) {
    const pts = [...pointers.values()];
    const d = dist(pts[0], pts[1]);
    const newScale = clampScale(pinchStartScale * (d / pinchStartDist));
    const rect = el.mapStage.getBoundingClientRect();
    const midNow = mid(pts[0], pts[1]);
    const stageX = midNow.x - rect.left, stageY = midNow.y - rect.top;
    const ratio = newScale / scale;
    tx = stageX - (stageX - tx) * ratio;
    ty = stageY - (stageY - ty) * ratio;
    scale = newScale;
    didPan = true;
    applyTransform();
  }
});
['pointerup', 'pointercancel'].forEach(evt => el.mapStage.addEventListener(evt, (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStartDist = 0;
  if (pointers.size === 0) {
    panStart = null;
    if (evt === 'pointerup' && !didPan && !isCompleted && pressedPoint) onImageTap(pressedPoint);
    pressedPoint = null;
  }
}));
el.mapStage.addEventListener('wheel', (e) => {
  if (isCompleted) return;
  e.preventDefault();
  const rect = el.mapStage.getBoundingClientRect();
  const stageX = e.clientX - rect.left, stageY = e.clientY - rect.top;
  const newScale = clampScale(scale * (e.deltaY < 0 ? 1.1 : 0.9));
  const ratio = newScale / scale;
  tx = stageX - (stageX - tx) * ratio;
  ty = stageY - (stageY - ty) * ratio;
  scale = newScale;
  applyTransform();
}, { passive: false });

/* ===== Character portrait + dialogue strip ===== */
async function updatePortrait(characterKey, expression) {
  const assetId = DevGameState.getCharacterAssetId(characterKey, expression);
  const asset = await AssetDB.getAsset(assetId).catch(() => null);
  if (asset && asset.dataUrl) {
    el.portraitImg.src = asset.dataUrl;
    el.portraitImg.style.display = '';
    el.portraitPlaceholder.style.display = 'none';
  } else {
    el.portraitImg.removeAttribute('src');
    el.portraitImg.style.display = 'none';
    el.portraitPlaceholder.style.display = '';
  }
}

function say(characterKey, expression, speakerName, text) {
  el.dlgName.textContent = speakerName;
  el.dlgText.textContent = text;
  updatePortrait(characterKey, expression);
}

/* ===== Game state ===== */
let wrongClickCount = 0;
let hintLevel = 0;
let isCompleted = false; // true once all 3 stages are found
let isStageTransition = false; // true while stage-clear banter is playing (taps ignored)
let hintTimers = [];

function scheduleHints() {
  hintTimers.push(setTimeout(() => triggerHint(1), 20000));
  hintTimers.push(setTimeout(() => triggerHint(2), 40000));
  hintTimers.push(setTimeout(() => triggerHint(3), 60000));
}
function clearHintTimers() { hintTimers.forEach(clearTimeout); hintTimers = []; }

function triggerHint(level) {
  if (isCompleted || isStageTransition) return;
  hintLevel = level;
  if (level === 1) {
    say('jisoo', 'curious', '지수', '영우…\n힌트 하나만 주면 안 돼?');
    setTimeout(() => { if (!isCompleted && !isStageTransition) say('youngwoo', 'soft', '영우', '지도 잘 보고 찾아봐.'); }, 1600);
  } else if (level === 2) {
    say('jisoo', 'curious', '지수', '음…\n이 근처인가…?');
  } else if (level === 3) {
    if (mapImageGlowEls[stageIndex]) mapImageGlowEls[stageIndex].classList.add('show');
  }
}

function flashWrongAtPoint(point) {
  const ring = document.createElement('div');
  ring.className = 'tap-wrong-ring';
  const r = 40;
  Object.assign(ring.style, { left: (point.x - r) + 'px', top: (point.y - r) + 'px', width: r * 2 + 'px', height: r * 2 + 'px' });
  el.mapCanvas.appendChild(ring);
  setTimeout(() => ring.remove(), 450);
}

function reactWrong() {
  wrongClickCount++;
  if (wrongClickCount === 1) say('jisoo', 'suspicious', '지수', '여긴 아닌 것 같은데?');
  else if (wrongClickCount === 2) say('jisoo', 'blank', '지수', `${STAGES[stageIndex].key}가 이렇게 안 보일 일이야…?`);
  else say('jisoo', 'annoyed', '지수', '아 나 진짜 영어 못한다니까;;;;');
}

function onImageTap(point) {
  if (isCompleted || isStageTransition) return;
  const hs = hotspots[stageIndex];
  const r = Math.max(hs.fr, HOTSPOT_MIN_FR) * CANVAS_W;
  const dx = point.x - hs.fx * CANVAS_W, dy = point.y - hs.fy * CANVAS_H;
  if (Math.hypot(dx, dy) <= r) {
    handleStageFound();
    return;
  }
  flashWrongAtPoint(point);
  reactWrong();
}

/* ===== Success sequence ===== */
function playSuccessBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.15);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.4);
  } catch (e) { /* audio unavailable — not critical to gameplay */ }
}

// Bottom-strip banter that plays after finding stage 0 or 1, before the mission
// card advances to the next stop. Stage 2 (the last stop) skips this and goes
// straight to the full-screen success sequence instead.
const STAGE_CLEAR_LINES = [
  [
    { char: 'jisoo', expr: 'happy', name: '지수', text: '오 공항 찾았다!' },
    { char: 'youngwoo', expr: 'happy', name: '영우', text: '나이스. 다음은 Eastwood야.' },
    { char: 'jisoo', expr: 'annoyed', name: '지수', text: '또 찾아야 돼?? ㅠㅠ' },
  ],
  [
    { char: 'jisoo', expr: 'happy', name: '지수', text: '오오 이스트우드도 찾았다!' },
    { char: 'youngwoo', expr: 'happy', name: '영우', text: '좋아. 마지막 하나, Marayong역.' },
    { char: 'jisoo', expr: 'curious', name: '지수', text: '마라용?? 그게 어디야 ㅋㅋㅋ' },
  ],
];

function markStationSuccess() {
  if (mapImagePulseEls[stageIndex]) mapImagePulseEls[stageIndex].classList.add('success');
}

function handleStageFound() {
  clearHintTimers();
  markStationSuccess();
  playSuccessBeep();

  if (stageIndex === STAGES.length - 1) {
    isCompleted = true;
    el.stamp.textContent = STAGES[stageIndex].key.toUpperCase();
    el.stamp.classList.add('show');
    setTimeout(startSuccessDialogue, 850);
    return;
  }

  isStageTransition = true;
  const lines = STAGE_CLEAR_LINES[stageIndex];
  let t = 0;
  lines.forEach(line => {
    setTimeout(() => say(line.char, line.expr, line.name, line.text), t);
    t += 1700;
  });
  setTimeout(() => {
    stageIndex++;
    wrongClickCount = 0;
    hintLevel = 0;
    isStageTransition = false;
    updateMissionCard();
    scheduleHints();
  }, t + 300);
}

const successLines = [
  { speaker: '지수', text: '악 세 개 다 찾았다아아아!!!!!\n야르 ㅎㅎㅎㅎㅎㅎ\n여보 나 다 찾았어!!!!', characterId: 'jisoo', expression: 'happy', typingSpeedMs: 16 },
  { speaker: '영우', text: '오. 생각보다 빨리 찾았는데?', characterId: 'youngwoo', expression: 'curious' },
  { speaker: '지수', text: '헤헤\n내가 또 이런 건 잘하지 ㅎㅎㅎㅎ', characterId: 'jisoo', expression: 'smirk' },
  { speaker: '영우', text: '아까 영어 못한다며.', characterId: 'youngwoo', expression: 'curious' },
  { speaker: '지수', text: '아 그거랑 이거는 다르지 여보;;;;\nㅋㅎㅋㅎㅋㅎㅋㅎㅋㅎ', characterId: 'jisoo', expression: 'smirk' },
  { speaker: '영우', text: '그래그래 ㅋㅋㅋㅋ', characterId: 'youngwoo', expression: 'happy' },
  { speaker: '지수', text: '자, 빨리 가자아!', characterId: 'jisoo', expression: 'happy' },
];

function startSuccessDialogue() {
  el.dlgStrip.classList.add('hidden');
  el.successLayer.classList.add('show');
  const player = createVNPlayer({
    onLineChange: (line) => {
      el.successName.textContent = line.speaker || '';
      updatePortrait(line.characterId, line.expression);
    },
    onTextUpdate: (text) => { el.successText.textContent = text; },
    onArrow: (show) => el.successArrow.classList.toggle('show', show),
    onComplete: fadeOutAndRedirect,
  });
  player.load(successLines.map(l => ({ speaker: l.speaker, text: l.text, characterId: l.characterId, expression: l.expression, pauseBeforeMs: l.pauseBeforeMs, typingSpeedMs: l.typingSpeedMs })));
  el.successLayer.addEventListener('click', () => player.tap());
}

function fadeOutAndRedirect() {
  el.fadeOverlay.classList.add('show');
  setTimeout(() => { location.href = '/dev/game/?scene=week1-scene-002-1'; }, 950);
}

/* ===== Boot ===== */
initMap().then((ready) => {
  if (!ready) return;
  const key = STAGES[stageIndex].key;
  say('jisoo', 'curious', '지수', `${key}… ${key}…`);
  setTimeout(() => { if (!isCompleted && !isStageTransition) say('jisoo', 'annoyed', '지수', '아 역이 왜 이렇게 많아;;'); }, 2200);
  setTimeout(() => { if (!isCompleted && !isStageTransition) say('jisoo', 'blank', '지수', `${key}… 어디 있는데 진짜…`); }, 4600);
  scheduleHints();
});
</script>
