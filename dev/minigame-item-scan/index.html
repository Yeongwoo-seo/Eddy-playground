<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · 특수 능력 테스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERATION MK DEV">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;--surface-3:#1E252D;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;align-items:center}
.frame{position:relative;width:100%;max-width:430px;height:100dvh;height:100vh;height:var(--vh100, 100vh);max-height:932px;overflow:hidden;background:var(--bg);touch-action:none}

.topbar{position:absolute;top:0;left:0;right:0;z-index:6;padding:calc(14px + env(safe-area-inset-top,0)) 16px 10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.vn-btn{pointer-events:auto;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.vn-btn:active{transform:scale(.96)}
.vn-btn[disabled]{opacity:.35;pointer-events:none}
.vn-btn.hidden{display:none}

/* ===== Upload screen ===== */
.upload-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;text-align:center;transition:opacity .3s ease}
.upload-screen.hidden{display:none}
.upload-badge{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--amber);text-transform:uppercase;margin-bottom:14px}
.upload-title{font-size:22px;font-weight:700;margin-bottom:12px}
.upload-desc{font-size:13.5px;color:var(--text-secondary);line-height:1.65;margin-bottom:30px;max-width:300px}
.upload-label{display:inline-flex;align-items:center;gap:8px;background:var(--cyan);color:#04181c;font-weight:700;font-size:14.5px;border-radius:16px;padding:15px 26px;cursor:pointer;transition:transform .15s}
.upload-label:active{transform:scale(.97)}
.upload-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.upload-error{margin-top:18px;font-size:12.5px;color:var(--signal-red);max-width:280px;line-height:1.5}
.upload-label.hidden{display:none}

/* ===== API key setup (first run only — saved to localStorage, never to a file) ===== */
.key-setup{width:100%;max-width:280px;display:flex;flex-direction:column;gap:10px}
.key-setup.hidden{display:none}
.key-setup-label{font-size:12.5px;color:var(--text-secondary);text-align:left}
.key-setup-row{display:flex;gap:8px}
.key-setup-input{flex:1;min-width:0;background:var(--surface-1);border:1px solid var(--divider);border-radius:12px;padding:12px 14px;color:var(--text-primary);font-family:var(--mono);font-size:13px}
.key-setup-input:focus{outline:none;border-color:var(--cyan)}
.key-setup-save{flex-shrink:0;background:var(--cyan);color:#04181c;font-weight:700;font-size:13.5px;border:none;border-radius:12px;padding:0 18px;cursor:pointer}
.key-setup-save:active{transform:scale(.96)}
.key-setup-note{font-size:11.5px;color:var(--text-muted);line-height:1.5;text-align:left}
.key-change-link{margin-top:16px;background:none;border:none;color:var(--text-muted);font-family:var(--mono);font-size:11px;text-decoration:underline;cursor:pointer}
.key-change-link.hidden{display:none}

/* ===== Scan stage ===== */
.scan-stage{position:absolute;inset:0;background:#05070a;display:none;overflow:hidden}
.scan-stage.show{display:block}
.image-wrap{position:absolute;inset:0;overflow:hidden;background:#05070a}
.image-box{position:absolute}
.image-box img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:fill;display:block;-webkit-user-drag:none}

.scan-sweep{position:absolute;left:0;right:0;height:38%;top:-40%;background:linear-gradient(180deg,rgba(89,184,200,0) 0%,rgba(89,184,200,.28) 50%,rgba(89,184,200,0) 100%);pointer-events:none;opacity:0}
.image-box.scanning .scan-sweep{opacity:1;animation:sweepDown 1.4s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sweepDown{0%{top:-40%}100%{top:100%}}
.scan-label{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--cyan);background:rgba(5,7,10,.75);border:1px solid rgba(89,184,200,.35);border-radius:20px;padding:8px 16px;opacity:0;transition:opacity .2s ease;white-space:nowrap;z-index:2}
.image-box.scanning .scan-label{opacity:1}

.marker{position:absolute;border:2px solid var(--cyan);background:rgba(89,184,200,.1);border-radius:8px;cursor:pointer;opacity:0;animation:markerPop .3s cubic-bezier(.2,.8,.2,1) forwards;box-shadow:0 0 0 3px rgba(89,184,200,.12)}
.marker.found{border-color:var(--amber);background:rgba(214,168,75,.12);box-shadow:0 0 0 3px rgba(214,168,75,.14)}
.marker-tag{position:absolute;left:0;bottom:100%;margin-bottom:4px;background:rgba(5,7,10,.88);border:1px solid rgba(89,184,200,.4);color:var(--cyan);font-family:var(--sans);font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap;pointer-events:none}
.marker.found .marker-tag{border-color:rgba(214,168,75,.5);color:var(--amber)}
@keyframes markerPop{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}

.scan-topbar{position:absolute;left:16px;right:16px;top:calc(58px + env(safe-area-inset-top,0));z-index:6;display:flex;justify-content:space-between;align-items:center;gap:8px}
.progress-pill{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:#fff;background:rgba(5,7,10,.75);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:9px 14px}
.progress-pill .n{color:var(--amber);font-weight:600}

.complete-toast{position:absolute;left:50%;top:42%;transform:translate(-50%,16px);z-index:7;background:rgba(5,7,10,.94);border:1px solid rgba(214,168,75,.45);border-radius:16px;padding:14px 22px;opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;font-size:13.5px;font-weight:700;color:var(--amber);text-align:center}
.complete-toast.show{opacity:1;transform:translate(-50%,0)}

.scan-error{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0));z-index:7;background:rgba(58,13,13,.92);border:1px solid rgba(217,65,65,.4);color:#ffb4b4;border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.5;display:none}
.scan-error.show{display:block}
.scan-error-retry{margin-top:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer}

/* ===== Dialogue popup (reused vnPlayer engine, same look as the other minigames) ===== */
.msg-layer{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;justify-content:flex-end;cursor:pointer}
.msg-layer.show{display:flex}
.msg-panel{position:relative;margin:0 16px calc(16px + env(safe-area-inset-bottom,0));background:rgba(5,7,10,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.35);padding:16px 18px;min-height:20vh;display:flex;flex-direction:row;align-items:flex-start;gap:14px}
/* Same 미니게임 얼굴 DB close-up crop minigame-eastwood's dlg-strip uses
   (see /dev/upload) — a dev only has to upload it once per character and
   every minigame's dialogue box picks it up. Hidden entirely for
   speaker-less narration lines instead of showing a placeholder. */
.msg-portrait-wrap{width:56px;height:76px;border-radius:10px;overflow:hidden;background:var(--surface-2, #171C22);flex-shrink:0;display:flex;align-items:flex-end;justify-content:center}
.msg-portrait-wrap.hidden{display:none}
.msg-portrait-wrap img{width:100%;height:100%;object-fit:cover;object-position:top;display:none}
.msg-portrait-placeholder{width:60%;height:78%;opacity:.35;color:var(--text-secondary)}
.msg-body-wrap{flex:1;min-width:0;min-height:20vh;display:flex;flex-direction:column}
.msg-name{font-size:15px;font-weight:700;color:var(--cyan);margin-bottom:8px}
.msg-name:empty{display:none}
.msg-text{flex:1;font-size:16px;line-height:1.65;color:#fff;white-space:pre-wrap;word-break:keep-all}
.msg-foot{display:flex;justify-content:flex-end;padding-top:6px}
.msg-arrow{font-size:13px;color:var(--text-secondary);visibility:hidden}
@keyframes arrowBob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.msg-arrow.show{visibility:visible;animation:arrowBob 1.1s ease-in-out infinite}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="topbar">
    <a class="vn-btn" href="/dev/minigames/">← DEV</a>
    <button class="vn-btn hidden" id="resetBtn" disabled>새 사진</button>
  </div>

  <div class="upload-screen" id="uploadScreen">
    <div class="upload-badge">특수 능력 테스트</div>
    <div class="upload-title">사진 속 물품을 감지합니다</div>
    <div class="upload-desc">사진을 업로드하면 지수의 특수 능력이 발동해 사진 속 물품을 감지합니다.<br>감지된 영역을 눌러 물품을 조사해 보세요.</div>

    <div class="key-setup" id="keySetup">
      <div class="key-setup-label">먼저 Anthropic API 키를 입력해주세요 (최초 1회)</div>
      <div class="key-setup-row">
        <input class="key-setup-input" type="password" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off">
        <button class="key-setup-save" id="apiKeySave">저장</button>
      </div>
      <div class="key-setup-note">키는 이 브라우저에만 저장되며, 여기서 Anthropic API를 직접 호출하는 데만 쓰입니다. 서버나 저장소로 전송되지 않습니다.</div>
    </div>

    <label class="upload-label hidden" for="fileInput" id="uploadLabel">📷 사진 업로드</label>
    <input class="upload-input" type="file" id="fileInput" accept="image/*">

  </div>

  <div class="scan-stage" id="scanStage">
    <div class="scan-topbar">
      <div class="progress-pill" id="progressPill">감지된 물품 <span class="n" id="foundCount">0</span>/<span id="totalCount">0</span></div>
    </div>
    <div class="image-wrap" id="imageWrap">
      <div class="image-box" id="imageBox">
        <img id="scanImg" alt="">
        <div class="scan-sweep"></div>
        <div class="scan-label" id="scanLabel">지수의 특수 능력 발동 중...</div>
        <div id="markerLayer"></div>
      </div>
    </div>
    <div class="complete-toast" id="completeToast">감지된 물품을 모두 조사했다.</div>
    <div class="scan-error" id="scanError">
      <div id="scanErrorText"></div>
      <button class="scan-error-retry" id="scanErrorRetry">다시 시도</button>
    </div>
  </div>

  <div class="msg-layer" id="msgLayer">
    <div class="msg-panel">
      <div class="msg-portrait-wrap hidden" id="msgPortraitWrap">
        <img id="msgPortraitImg" alt="">
        <svg class="msg-portrait-placeholder" id="msgPortraitPlaceholder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      </div>
      <div class="msg-body-wrap">
        <div class="msg-name" id="msgName"></div>
        <div class="msg-text" id="msgText"></div>
        <div class="msg-foot"><span class="msg-arrow" id="msgArrow">▼</span></div>
      </div>
    </div>
  </div>
</div>

<script>
function setVh100() { document.documentElement.style.setProperty('--vh100', window.innerHeight + 'px'); }
setVh100();
window.addEventListener('resize', setVh100);
window.addEventListener('orientationchange', setVh100);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script src="/dev/assetDb.js"></script>
<script src="/dev/dialogueData.js"></script>
<script src="/dev/caseFileData.js"></script>
<script src="/dev/caseFileState.js"></script>
<script src="/dev/vnPlayer.js"></script>
<script>
/* OPERATION MK — 「특수 능력 테스트」 evidence-collection entry.
   Player uploads a photo -> it's downscaled client-side and sent straight
   from the browser to the Anthropic Messages API (vision + a forced tool
   call) to find physical objects and return a bounding box + investigation
   dialogue per object. Detected items are rendered as labeled clickable
   boxes over the photo; tapping one shows the dialogue and registers the
   item as 증거 via CaseFileState.addEvidence. assetDb.js/dialogueData.js
   are only here for the dialogue popup's 미니게임 얼굴 portraits (see
   updateMsgPortrait), same as every other minigame's dialogue box.

   ⚠️ SECURITY: each visitor enters their own Anthropic API key once (below,
   § API key setup) and it's saved to that browser's localStorage — nothing
   is hardcoded in this file or committed to the repo, so no key is ever
   shared across visitors. It's still sent as a plain request header
   straight from this page's JS on every scan, so anyone with devtools
   access to that specific browser/profile can read it back out of
   localStorage or the network tab. That's an acceptable tradeoff for a
   dev-only test page with no backend in this repo to hide it behind, but
   don't reuse this pattern for anything production-facing — set a spend
   limit on any key you enter here regardless. */
const API_KEY_STORAGE_KEY = 'mkItemScanAnthropicApiKey';
function getApiKey() { return localStorage.getItem(API_KEY_STORAGE_KEY) || ''; }
function setApiKey(key) {
  if (key) localStorage.setItem(API_KEY_STORAGE_KEY, key);
  else localStorage.removeItem(API_KEY_STORAGE_KEY);
}
const ANTHROPIC_MODEL = 'claude-sonnet-5';

const DETECT_ITEMS_TOOL = {
  name: 'report_detected_items',
  description: 'Report the distinct physical objects visible in the photo, for a detective visual-novel game\'s item-scan minigame.',
  input_schema: {
    type: 'object',
    properties: {
      items: {
        type: 'array',
        minItems: 1,
        maxItems: 8,
        items: {
          type: 'object',
          properties: {
            label: { type: 'string', description: '짧은 한국어 물품 이름 (예: 지갑, 열쇠, 커피컵). 2~6자 내외.' },
            box: {
              type: 'object',
              description: '물품을 감싸는 사각형 영역. 이미지 가로/세로 대비 0~1 비율.',
              properties: {
                x: { type: 'number', description: '왼쪽 상단 x (0~1)' },
                y: { type: 'number', description: '왼쪽 상단 y (0~1)' },
                w: { type: 'number', description: '너비 (0~1)' },
                h: { type: 'number', description: '높이 (0~1)' },
              },
              required: ['x', 'y', 'w', 'h'],
            },
            description: { type: 'string', description: '이 물품에 대한 한 문장짜리 수사 관찰 (한국어).' },
            dialogue: {
              type: 'array',
              description: '이 물품을 조사할 때 나오는 2~3줄 대사. 지수(호기심 많고 관찰력 좋은 신입 수사관)와 영우(차분한 파트너)가 번갈아 말한다.',
              minItems: 2,
              maxItems: 3,
              items: {
                type: 'object',
                properties: {
                  speaker: { type: 'string', enum: ['지수', '영우'] },
                  text: { type: 'string' },
                },
                required: ['speaker', 'text'],
              },
            },
          },
          required: ['label', 'box', 'description', 'dialogue'],
        },
      },
    },
    required: ['items'],
  },
};

const DETECT_ITEMS_SYSTEM_PROMPT = `당신은 한국어 형사/추리 비주얼노벨 게임 "OPERATION MK"의 물품 인식 기능을 담당합니다.
업로드된 사진을 분석해 뚜렷하게 구분되는 실제 물체를 최대 8개까지 찾아 report_detected_items 도구로 보고하세요.

규칙:
- 배경, 벽, 바닥처럼 개별 "물품"이 아닌 것은 제외하세요.
- 사진 속에 실존 인물로 보이는 사람이 있어도 그 사람이 누구인지 추정하거나 신원을 언급하지 마세요. 사람 자체를 물품으로 보고하지 말고, 사람이 들고 있거나 곁에 있는 물건만 보고하세요.
- 각 물품의 한국어 이름, 0~1 비율의 사각형 영역, 한 문장 관찰, 그리고 지수/영우가 번갈아 말하는 2~3줄의 짧은 수사 대사를 작성하세요.
- 대사는 자연스러운 한국어 구어체로, 게임의 톤(가볍고 티키타카가 있는 파트너 수사관 케미)에 맞게 쓰세요.
- 물품이 하나도 없다면 items를 빈 배열로 두지 말고, 가장 두드러지는 배경 요소 하나라도 보고하세요.`;

const MAX_LONG_EDGE = 1200;
const JPEG_QUALITY = 0.85;
const RUN_ID_LEN = 6;

const el = {
  uploadScreen: document.getElementById('uploadScreen'),
  fileInput: document.getElementById('fileInput'),
  uploadLabel: document.getElementById('uploadLabel'),
  uploadError: document.getElementById('uploadError'),
  keySetup: document.getElementById('keySetup'),
  apiKeyInput: document.getElementById('apiKeyInput'),
  apiKeySave: document.getElementById('apiKeySave'),
  keyChangeLink: document.getElementById('keyChangeLink'),
  scanStage: document.getElementById('scanStage'),
  imageWrap: document.getElementById('imageWrap'),
  imageBox: document.getElementById('imageBox'),
  scanImg: document.getElementById('scanImg'),
  markerLayer: document.getElementById('markerLayer'),
  resetBtn: document.getElementById('resetBtn'),
  foundCount: document.getElementById('foundCount'),
  totalCount: document.getElementById('totalCount'),
  completeToast: document.getElementById('completeToast'),
  scanError: document.getElementById('scanError'),
  scanErrorText: document.getElementById('scanErrorText'),
  scanErrorRetry: document.getElementById('scanErrorRetry'),
  msgLayer: document.getElementById('msgLayer'),
  msgPortraitWrap: document.getElementById('msgPortraitWrap'),
  msgPortraitImg: document.getElementById('msgPortraitImg'),
  msgPortraitPlaceholder: document.getElementById('msgPortraitPlaceholder'),
  msgName: document.getElementById('msgName'),
  msgText: document.getElementById('msgText'),
  msgArrow: document.getElementById('msgArrow'),
};

let activeItems = [];   // [{ label, box:{x,y,w,h}, description, dialogue, found }]
let activeMsgTapHandler = null;
let naturalW = 1, naturalH = 1;
let currentRunId = '';
let lastPayload = null; // retained so "다시 시도" can resend without re-reading the file

// ITEM_POOL's hardcoded lines only ever carry a display speaker name
// ('지수'/'영우'), not a dialogueData.js-style characterId — this is the
// lookup back to the 미니게임 얼굴 DB key (see updateMsgPortrait).
const SPEAKER_TO_CHARACTER_KEY = { '지수': 'jisoo', '영우': 'youngwoo' };

// Same 미니게임 얼굴 DB close-up crop minigame-eastwood's dlg-strip uses —
// a dev only has to upload it once per character (/dev/upload's 미니게임
// 얼굴 탭) and every minigame's dialogue box picks it up from here.
let msgPortraitRequestToken = 0;
async function updateMsgPortrait(characterKey) {
  const requestToken = ++msgPortraitRequestToken;
  if (!characterKey) { el.msgPortraitWrap.classList.add('hidden'); return; }
  el.msgPortraitWrap.classList.remove('hidden');
  const assetId = DevGameState.getCharacterAssetId(characterKey, MINIGAME_FACE_EXPRESSION);
  const asset = assetId ? await AssetDB.getAsset(assetId).catch(() => null) : null;
  if (requestToken !== msgPortraitRequestToken) return; // a later call already superseded this one
  if (asset && asset.dataUrl) {
    el.msgPortraitImg.src = asset.dataUrl;
    el.msgPortraitImg.style.display = '';
    el.msgPortraitPlaceholder.style.display = 'none';
  } else {
    el.msgPortraitImg.removeAttribute('src');
    el.msgPortraitImg.style.display = 'none';
    el.msgPortraitPlaceholder.style.display = '';
  }
}

const player = createVNPlayer({
  onLineChange: (line) => {
    el.msgName.textContent = line.speaker || '';
    updateMsgPortrait(SPEAKER_TO_CHARACTER_KEY[line.speaker] || null);
  },
  onTextUpdate: (text) => { el.msgText.textContent = text; },
  onArrow: (show) => el.msgArrow.classList.toggle('show', show),
  onComplete: () => {
    el.msgLayer.classList.remove('show');
    if (activeMsgTapHandler) { el.msgLayer.removeEventListener('click', activeMsgTapHandler); activeMsgTapHandler = null; }
  },
});
function queueDialogue(lines) {
  if (activeMsgTapHandler) el.msgLayer.removeEventListener('click', activeMsgTapHandler);
  el.msgLayer.classList.add('show');
  activeMsgTapHandler = () => player.tap();
  el.msgLayer.addEventListener('click', activeMsgTapHandler);
  player.load(lines, 0);
}

function randomRunId() {
  return Math.random().toString(36).slice(2, 2 + RUN_ID_LEN);
}

/* ===== Image downscale (also caps the payload sent to the Anthropic API) ===== */
function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 불러올 수 없습니다.')); };
    img.src = url;
  });
}
function downscaleToJpeg(img) {
  const scale = Math.min(1, MAX_LONG_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * scale);
  const h = Math.round(img.naturalHeight * scale);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  const dataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
  return { dataUrl, width: w, height: h, base64: dataUrl.split(',')[1] };
}

/* ===== Layout — position the image + markers as an exact "contain" box
   inside the stage, so bounding-box fractions from the API line up with
   what's actually on screen (object-fit:cover would crop and misalign
   them). Recomputed on resize; markers stay correct since they're
   percentage-positioned within this box. ===== */
function layoutImageBox() {
  const stageW = el.imageWrap.clientWidth, stageH = el.imageWrap.clientHeight;
  if (!stageW || !stageH || !naturalW || !naturalH) return;
  const stageRatio = stageW / stageH, imgRatio = naturalW / naturalH;
  let boxW, boxH;
  if (imgRatio > stageRatio) { boxW = stageW; boxH = boxW / imgRatio; }
  else { boxH = stageH; boxW = boxH * imgRatio; }
  el.imageBox.style.left = ((stageW - boxW) / 2) + 'px';
  el.imageBox.style.top = ((stageH - boxH) / 2) + 'px';
  el.imageBox.style.width = boxW + 'px';
  el.imageBox.style.height = boxH + 'px';
}
window.addEventListener('resize', layoutImageBox);
window.addEventListener('orientationchange', layoutImageBox);

/* ===== Markers ===== */
function renderMarkers() {
  el.markerLayer.innerHTML = '';
  activeItems.forEach((item, index) => {
    const b = item.box || { x: 0.1, y: 0.1, w: 0.2, h: 0.2 };
    const m = document.createElement('div');
    m.className = 'marker' + (item.found ? ' found' : '');
    m.style.left = (clamp01(b.x) * 100) + '%';
    m.style.top = (clamp01(b.y) * 100) + '%';
    m.style.width = (clamp01(b.w) * 100) + '%';
    m.style.height = (clamp01(b.h) * 100) + '%';
    m.style.animationDelay = (index * 60) + 'ms';
    const tag = document.createElement('div');
    tag.className = 'marker-tag';
    tag.textContent = item.label;
    m.appendChild(tag);
    m.addEventListener('click', () => onMarkerTap(item, m));
    el.markerLayer.appendChild(m);
  });
}
function clamp01(n) { return Math.max(0, Math.min(1, typeof n === 'number' ? n : 0)); }

function onMarkerTap(item, markerEl) {
  if (!item.found) {
    item.found = true;
    markerEl.classList.add('found');
    updateProgress();
    CaseFileState.addEvidence({
      id: `special-ability-${currentRunId}-${item.label}`,
      code: 'E-SA',
      title: item.label,
      description: item.description || '',
      discoveredLocationText: '특수 능력 테스트',
    });
  }
  const lines = (item.dialogue && item.dialogue.length ? item.dialogue : [{ speaker: '', text: item.description || '별다른 특이사항은 없다.' }])
    .map(l => ({ speaker: l.speaker || '', text: l.text }));
  queueDialogue(lines);
}

function updateProgress() {
  const foundNum = activeItems.filter(i => i.found).length;
  el.foundCount.textContent = foundNum;
  el.totalCount.textContent = activeItems.length;
  el.completeToast.classList.toggle('show', activeItems.length > 0 && foundNum === activeItems.length);
}

/* ===== Network call — straight to the Anthropic API from the browser.
   `anthropic-dangerous-direct-browser-access` is required by Anthropic for
   any request sent directly from browser JS (as opposed to a server); it
   exists precisely to flag that this pattern exposes the API key to
   anyone viewing page source, which is the tradeoff this page accepts. ===== */
async function detectItems(payload) {
  const apiKey = getApiKey();
  if (!apiKey) {
    throw new Error('Anthropic API 키가 설정되지 않았습니다. 새 사진을 눌러 키를 먼저 입력해주세요.');
  }
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'content-type': 'application/json',
    },
    body: JSON.stringify({
      model: ANTHROPIC_MODEL,
      max_tokens: 2048,
      system: DETECT_ITEMS_SYSTEM_PROMPT,
      tools: [DETECT_ITEMS_TOOL],
      tool_choice: { type: 'tool', name: 'report_detected_items' },
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: payload.mediaType, data: payload.imageBase64 } },
          { type: 'text', text: '이 사진 속 물품들을 감지해주세요.' },
        ],
      }],
    }),
  });
  let data;
  try { data = await res.json(); } catch { data = null; }
  if (!res.ok) {
    const msg = data && data.error && data.error.message;
    throw new Error(msg || `물품 인식에 실패했습니다. (${res.status})`);
  }
  const toolUseBlock = (data.content || []).find(b => b.type === 'tool_use');
  const items = toolUseBlock && toolUseBlock.input && toolUseBlock.input.items;
  if (!Array.isArray(items) || !items.length) {
    throw new Error('사진에서 물품을 찾지 못했습니다.');
  }
  return items;
}

function showScanError(message) {
  el.imageBox.classList.remove('scanning');
  el.scanErrorText.textContent = message;
  el.scanError.classList.add('show');
}
function hideScanError() {
  el.scanError.classList.remove('show');
}

async function runScan(dataUrl, payload) {
  el.uploadScreen.classList.add('hidden');
  el.scanStage.classList.add('show');
  el.resetBtn.classList.remove('hidden');
  el.resetBtn.disabled = false;
  el.completeToast.classList.remove('show');
  hideScanError();
  el.markerLayer.innerHTML = '';
  activeItems = [];
  updateProgress();
  el.scanImg.src = dataUrl;
  el.imageBox.classList.add('scanning');
  // .scan-stage only becomes visible on the line above, so its clientWidth/
  // Height were 0 (display:none) if measured any earlier — lay out the image
  // box now that the stage actually has a size.
  layoutImageBox();

  lastPayload = payload;
  try {
    const items = await detectItems(payload);
    activeItems = items.map(it => ({ ...it, found: false }));
    el.imageBox.classList.remove('scanning');
    renderMarkers();
    updateProgress();
  } catch (err) {
    showScanError(err.message || '물품 인식 중 오류가 발생했습니다.');
  }
}

el.fileInput.addEventListener('change', async () => {
  const file = el.fileInput.files && el.fileInput.files[0];
  el.fileInput.value = '';
  if (!file) return;
  el.uploadError.textContent = '';
  currentRunId = randomRunId();
  try {
    const img = await loadImageFromFile(file);
    const { dataUrl, width, height, base64 } = downscaleToJpeg(img);
    naturalW = width; naturalH = height;
    await runScan(dataUrl, { imageBase64: base64, mediaType: 'image/jpeg' });
  } catch (err) {
    el.uploadError.textContent = err.message || '사진을 처리할 수 없습니다.';
  }
});

el.scanErrorRetry.addEventListener('click', () => {
  if (!lastPayload) return;
  runScan(el.scanImg.src, lastPayload);
});

el.resetBtn.addEventListener('click', () => {
  el.scanStage.classList.remove('show');
  el.uploadScreen.classList.remove('hidden');
  el.resetBtn.classList.add('hidden');
  el.resetBtn.disabled = true;
  activeItems = [];
  hideScanError();
});

/* ===== API key setup screen ===== */
function refreshKeyUi() {
  const hasKey = !!getApiKey();
  el.keySetup.classList.toggle('hidden', hasKey);
  el.uploadLabel.classList.toggle('hidden', !hasKey);
  el.keyChangeLink.classList.toggle('hidden', !hasKey);
}
function saveApiKeyFromInput() {
  const value = el.apiKeyInput.value.trim();
  if (!value) return;
  setApiKey(value);
  el.apiKeyInput.value = '';
  el.uploadError.textContent = '';
  refreshKeyUi();
}
el.apiKeySave.addEventListener('click', saveApiKeyFromInput);
el.apiKeyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveApiKeyFromInput(); });
el.keyChangeLink.addEventListener('click', () => {
  setApiKey('');
  refreshKeyUi();
});
refreshKeyUi();
</script>
</body>
</html>
