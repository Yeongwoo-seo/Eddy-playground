<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · 낚시 설정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--green:#3ECF6B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(48px + env(safe-area-inset-top,0)) 20px calc(32px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.back{font-family:var(--mono);font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:18px;display:inline-flex;align-items:center;gap:4px;width:fit-content}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
.title{font-size:26px;font-weight:700;letter-spacing:-.2px;margin-bottom:10px}
.sub{font-size:14px;color:var(--text-secondary);margin-bottom:32px;line-height:1.6}

.option-group{margin-bottom:28px}
.option-label{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px}
.option-pills{display:flex;flex-wrap:wrap;gap:8px}
.option-pill{font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--divider);border-radius:20px;padding:10px 16px;cursor:pointer;transition:transform .15s,background .15s,color .15s,border-color .15s}
.option-pill:active{transform:scale(.96)}
.option-pill.active{color:#04181c;background:var(--cyan);border-color:var(--cyan)}

.upload-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.upload-btn{font-family:var(--sans);font-size:13.5px;font-weight:600;color:#04181c;background:var(--cyan);border:none;border-radius:14px;padding:11px 16px;cursor:pointer;transition:transform .15s}
.upload-btn:active{transform:scale(.96)}
.upload-input-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.remove-btn{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);background:none;border:1px solid var(--divider);border-radius:12px;padding:9px 12px;cursor:pointer;display:none}
.remove-btn:active{opacity:.7}
.image-preview{display:none;margin-top:10px;max-width:160px;max-height:100px;border-radius:12px;border:1px solid var(--divider);object-fit:cover}
.upload-hint{font-size:12px;color:var(--text-muted);margin-top:8px;line-height:1.5}
.upload-error{font-size:12px;color:var(--signal-red);margin-top:8px;display:none}

.test-btn{margin-top:auto;font-family:var(--mono);font-size:14.5px;font-weight:700;letter-spacing:.04em;color:#08110c;background:var(--green);border:none;border-radius:16px;padding:16px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.test-btn:active{opacity:.8}
</style>
</head>
<body>
<div class="frame">
  <a class="back" href="/dev/minigames/">‹ DEV</a>
  <div class="tag">Minigame · 설정</div>
  <div class="title">🎣 낚시</div>
  <div class="sub">화면을 꾹 누르고 있으면 초록 바가 위로 떠오릅니다. 손을 떼면 서서히 가라앉아요.<br>물고기를 초록 바 안에 가둔 채로 게이지를 100%까지 채우세요.</div>

  <div class="option-group">
    <div class="option-label">난이도</div>
    <div class="option-pills" id="diffPills"></div>
  </div>

  <div class="option-group">
    <div class="option-label">물고기 움직임</div>
    <div class="option-pills" id="motionPills"></div>
  </div>

  <div class="option-group">
    <div class="option-label">배경화면 (선택)</div>
    <div class="upload-row">
      <label class="upload-btn" for="bgInput">🖼️ 배경 업로드</label>
      <input type="file" id="bgInput" accept="image/*" class="upload-input-hidden">
      <button type="button" class="remove-btn" id="bgRemoveBtn">제거</button>
    </div>
    <img class="image-preview" id="bgPreview" alt="배경 미리보기">
    <div class="upload-error" id="bgError"></div>
    <div class="upload-hint">이 브라우저에만 저장돼요. 업로드하지 않으면 기본 배경이 나옵니다. 지수·영우 캐릭터는 여기서 따로 올릴 필요 없이, /dev/upload의 인물 DB · 미니게임 얼굴에 등록해두면 플레이 화면 하단 대사창에 자동으로 반영돼요.</div>
  </div>

  <a class="test-btn" id="testBtn" href="/dev/minigame-fishing/play/">테스트하기</a>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script>
// Bands mirror difficultyLabel()'s cutoffs in play/index.html so "쉬움" here
// picks from the same range the play screen would label "쉬움".
const DIFFICULTY_OPTIONS = [
  { id: 'random', label: '랜덤' },
  { id: 'very-easy', label: '매우 쉬움' },
  { id: 'easy', label: '쉬움' },
  { id: 'normal', label: '보통' },
  { id: 'hard', label: '어려움' },
  { id: 'very-hard', label: '매우 어려움' },
];
const MOTION_OPTIONS = [
  { id: 'random', label: '랜덤' },
  { id: 'mixed', label: '뒤섞임' },
  { id: 'smooth', label: '매끄러움' },
  { id: 'dart', label: '돌진' },
  { id: 'sinker', label: '가라앉음' },
  { id: 'floater', label: '떠오름' },
];

let selectedDifficulty = 'random';
let selectedMotion = 'random';

function renderPills(container, options, selected, onPick) {
  container.innerHTML = options.map(o =>
    `<button type="button" class="option-pill${o.id === selected ? ' active' : ''}" data-id="${o.id}">${o.label}</button>`
  ).join('');
  container.querySelectorAll('.option-pill').forEach(btn => {
    btn.addEventListener('click', () => onPick(btn.dataset.id));
  });
}

const el = {
  diffPills: document.getElementById('diffPills'),
  motionPills: document.getElementById('motionPills'),
  testBtn: document.getElementById('testBtn'),
  bgInput: document.getElementById('bgInput'),
  bgPreview: document.getElementById('bgPreview'),
  bgRemoveBtn: document.getElementById('bgRemoveBtn'),
  bgError: document.getElementById('bgError'),
};

function updateTestBtnHref() {
  const params = new URLSearchParams();
  if (selectedDifficulty !== 'random') params.set('diff', selectedDifficulty);
  if (selectedMotion !== 'random') params.set('motion', selectedMotion);
  const qs = params.toString();
  el.testBtn.href = '/dev/minigame-fishing/play/' + (qs ? '?' + qs : '');
}

function renderAll() {
  renderPills(el.diffPills, DIFFICULTY_OPTIONS, selectedDifficulty, (id) => {
    selectedDifficulty = id;
    renderAll();
  });
  renderPills(el.motionPills, MOTION_OPTIONS, selectedMotion, (id) => {
    selectedMotion = id;
    renderAll();
  });
  updateTestBtnHref();
}
renderAll();
</script>
<script>
/* ===== Background customization — Stardew-style overworld dressing for the
   play screen. Read there straight out of localStorage rather than passed
   via query string, since a raw photo's data URL is far too large for a URL.
   Downscaled through a canvas before storing so a full-size phone photo
   doesn't blow the ~5MB localStorage quota. Character portraits are not part
   of this — they come from the shared 인물 DB · 미니게임 얼굴 (/dev/upload),
   the same source every other minigame's dialogue strip reads from. ===== */
const CUSTOMIZATION_KEY = 'mkFishingCustomization';

function loadCustomization() {
  try { return JSON.parse(localStorage.getItem(CUSTOMIZATION_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveCustomization(data) {
  try {
    localStorage.setItem(CUSTOMIZATION_KEY, JSON.stringify(data));
  } catch (e) {
    throw new Error(e && e.name === 'QuotaExceededError'
      ? '저장 공간이 부족해요. 더 작은 이미지를 사용해 보세요.'
      : '이미지 저장에 실패했어요.');
  }
}

function resizeImageToDataUrl(file, maxDim, mimeType, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL(mimeType, quality));
      };
      img.onerror = () => reject(new Error('이미지를 불러오지 못했어요.'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽지 못했어요.'));
    reader.readAsDataURL(file);
  });
}

let customization = loadCustomization();

function renderImagePreview(key, previewEl, removeBtnEl) {
  const dataUrl = customization[key];
  previewEl.src = dataUrl || '';
  previewEl.style.display = dataUrl ? 'block' : 'none';
  removeBtnEl.style.display = dataUrl ? 'inline-block' : 'none';
}

async function handleImageUpload(file, key, maxDim, mimeType, quality, previewEl, removeBtnEl, errorEl) {
  errorEl.style.display = 'none';
  try {
    const dataUrl = await resizeImageToDataUrl(file, maxDim, mimeType, quality);
    customization[key] = dataUrl;
    saveCustomization(customization);
    renderImagePreview(key, previewEl, removeBtnEl);
  } catch (e) {
    errorEl.textContent = (e && e.message) || '이미지 업로드에 실패했어요.';
    errorEl.style.display = 'block';
  }
}

el.bgInput.addEventListener('change', () => {
  const file = el.bgInput.files && el.bgInput.files[0];
  el.bgInput.value = '';
  if (!file) return;
  handleImageUpload(file, 'background', 960, 'image/jpeg', 0.75, el.bgPreview, el.bgRemoveBtn, el.bgError);
});
el.bgRemoveBtn.addEventListener('click', () => {
  delete customization.background;
  saveCustomization(customization);
  renderImagePreview('background', el.bgPreview, el.bgRemoveBtn);
});

renderImagePreview('background', el.bgPreview, el.bgRemoveBtn);
</script>
<script src="/dev/devPlanFab.js"></script>
</body>
</html>
