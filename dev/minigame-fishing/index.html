<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · 낚시 설정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERATION MK DEV">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--green:#3ECF6B;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(48px + env(safe-area-inset-top,0)) 20px calc(32px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.back{font-family:var(--mono);font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:18px;display:inline-flex;align-items:center;gap:4px;width:fit-content}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
.title{font-size:26px;font-weight:700;letter-spacing:-.2px;margin-bottom:10px}
.sub{font-size:14px;color:var(--text-secondary);margin-bottom:32px;line-height:1.6}

.option-group{margin-bottom:28px}
.option-label{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px}
.option-pills{display:flex;flex-wrap:wrap;gap:8px}
.option-pill{font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--divider);border-radius:20px;padding:10px 16px;cursor:pointer;transition:transform .15s,background .15s,color .15s,border-color .15s}
.option-pill:active{transform:scale(.96)}
.option-pill.active{color:#04181c;background:var(--cyan);border-color:var(--cyan)}

.test-btn{margin-top:auto;font-family:var(--mono);font-size:14.5px;font-weight:700;letter-spacing:.04em;color:#08110c;background:var(--green);border:none;border-radius:16px;padding:16px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.test-btn:active{opacity:.8}
</style>
</head>
<body>
<div class="frame">
  <a class="back" href="/dev/minigames/">‹ DEV</a>
  <div class="tag">Minigame · 설정</div>
  <div class="title">🎣 낚시</div>
  <div class="sub">화면을 꾹 누르고 있으면 초록 바가 위로 떠오릅니다. 손을 떼면 서서히 가라앉아요.<br>물고기를 초록 바 안에 가둔 채로 게이지를 100%까지 채우세요.</div>

  <div class="option-group">
    <div class="option-label">난이도</div>
    <div class="option-pills" id="diffPills"></div>
  </div>

  <div class="option-group">
    <div class="option-label">물고기 움직임</div>
    <div class="option-pills" id="motionPills"></div>
  </div>

  <a class="test-btn" id="testBtn" href="/dev/minigame-fishing/play/">테스트하기</a>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script>
// Bands mirror difficultyLabel()'s cutoffs in play/index.html so "쉬움" here
// picks from the same range the play screen would label "쉬움".
const DIFFICULTY_OPTIONS = [
  { id: 'random', label: '랜덤' },
  { id: 'very-easy', label: '매우 쉬움' },
  { id: 'easy', label: '쉬움' },
  { id: 'normal', label: '보통' },
  { id: 'hard', label: '어려움' },
  { id: 'very-hard', label: '매우 어려움' },
];
const MOTION_OPTIONS = [
  { id: 'random', label: '랜덤' },
  { id: 'mixed', label: '뒤섞임' },
  { id: 'smooth', label: '매끄러움' },
  { id: 'dart', label: '돌진' },
  { id: 'sinker', label: '가라앉음' },
  { id: 'floater', label: '떠오름' },
];

let selectedDifficulty = 'random';
let selectedMotion = 'random';

function renderPills(container, options, selected, onPick) {
  container.innerHTML = options.map(o =>
    `<button type="button" class="option-pill${o.id === selected ? ' active' : ''}" data-id="${o.id}">${o.label}</button>`
  ).join('');
  container.querySelectorAll('.option-pill').forEach(btn => {
    btn.addEventListener('click', () => onPick(btn.dataset.id));
  });
}

const el = {
  diffPills: document.getElementById('diffPills'),
  motionPills: document.getElementById('motionPills'),
  testBtn: document.getElementById('testBtn'),
};

function updateTestBtnHref() {
  const params = new URLSearchParams();
  if (selectedDifficulty !== 'random') params.set('diff', selectedDifficulty);
  if (selectedMotion !== 'random') params.set('motion', selectedMotion);
  const qs = params.toString();
  el.testBtn.href = '/dev/minigame-fishing/play/' + (qs ? '?' + qs : '');
}

function renderAll() {
  renderPills(el.diffPills, DIFFICULTY_OPTIONS, selectedDifficulty, (id) => {
    selectedDifficulty = id;
    renderAll();
  });
  renderPills(el.motionPills, MOTION_OPTIONS, selectedMotion, (id) => {
    selectedMotion = id;
    renderAll();
  });
  updateTestBtnHref();
}
renderAll();
</script>
<script src="/dev/devPlanFab.js"></script>
</body>
</html>
