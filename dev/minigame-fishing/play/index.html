<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · FISHING</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--green:#3ECF6B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}

.frame{position:relative;width:100%;max-width:430px;height:100dvh;height:100vh;height:var(--vh100, 100vh);overflow:hidden;background:#0a0d10;display:flex;flex-direction:column;touch-action:none}

/* ===== Optional Stardew-style dressing from /dev/minigame-fishing/'s 설정
   screen (localStorage, not query string — see that page's comment). Both
   sit below the game-stage/press-zone/topbar in DOM order so they never
   intercept input. ===== */
.bg-layer{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;display:none}
.bg-layer.show{display:block}
.bg-layer::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,10,.4) 0%,rgba(5,7,10,.6) 100%)}
.character-sprite{position:absolute;left:14px;bottom:calc(64px + env(safe-area-inset-bottom,0));max-width:96px;max-height:150px;z-index:1;display:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.character-sprite.show{display:block}

.topbar{position:absolute;top:0;left:0;right:0;z-index:6;padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.topbar-right{display:flex;gap:8px;pointer-events:none}
.vn-btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#fff;background:rgba(8,10,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block;pointer-events:auto;border-width:1px}

/* ===== Game stage ===== */
.game-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:14px;padding:calc(64px + env(safe-area-inset-top,0)) 20px calc(28px + env(safe-area-inset-bottom,0))}

.track-wrap{position:relative;width:132px;height:100%;max-height:100%}
.track{position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#0f2a33 0%,#0a1b21 55%,#081318 100%);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 0 24px rgba(0,0,0,.5)}
.track::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 2px,transparent 2px 26px);pointer-events:none}

.catch-bar{position:absolute;left:6px;right:6px;top:0;border-radius:12px;background:rgba(62,207,107,.22);border:2px solid rgba(62,207,107,.65);box-shadow:0 0 0 rgba(62,207,107,0);transition:background .15s ease,border-color .15s ease,box-shadow .15s ease;will-change:transform}
.catch-bar.hooked{background:rgba(62,207,107,.38);border-color:var(--green);box-shadow:0 0 18px rgba(62,207,107,.45)}

.fish{position:absolute;left:50%;top:0;font-size:28px;line-height:1;width:36px;height:36px;margin-left:-18px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));will-change:transform;transition:filter .15s ease}

.progress-rail{position:relative;width:22px;height:100%;border-radius:11px;background:var(--surface-1);border:1px solid var(--divider);overflow:hidden;flex-shrink:0}
.progress-fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#F2C879 0%,var(--amber) 100%);border-radius:0 0 10px 10px;transition:background .2s ease}
.progress-fill.danger{background:linear-gradient(180deg,#E88686 0%,var(--signal-red) 100%)}
.progress-mid-mark{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.18)}

/* ===== Press zone (full stage minus topbar) ===== */
.press-zone{position:absolute;inset:0;z-index:5;touch-action:none}
.press-hint{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0));z-index:6;text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--text-muted);letter-spacing:.02em;pointer-events:none;transition:opacity .2s ease}
.press-hint.hold{color:var(--green)}

/* ===== Debug panel ===== */
.debug-panel{position:absolute;top:calc(50px + env(safe-area-inset-top,0));left:12px;z-index:6;font-family:var(--mono);font-size:10.5px;line-height:1.55;color:rgba(146,155,165,.9);background:rgba(5,7,10,.7);border:1px solid var(--divider);border-radius:10px;padding:8px 10px;pointer-events:none;white-space:pre;display:none}
.debug-panel.show{display:block}

/* ===== Tune panel — live sliders over FISHING_CONFIG, plus a copy-pasteable
   code block so a value dialed in on-device can go straight back into the
   source's FISHING_CONFIG literal. ===== */
.tune-panel{position:absolute;top:calc(50px + env(safe-area-inset-top,0));right:12px;z-index:7;width:216px;max-height:calc(100% - 90px);overflow-y:auto;touch-action:pan-y;font-family:var(--mono);color:var(--text-secondary);background:rgba(5,7,10,.9);border:1px solid var(--divider);border-radius:12px;padding:12px;display:none}
.tune-panel.show{display:block}
.tune-panel h4{font-size:10px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;margin:12px 0 6px;font-weight:600}
.tune-panel h4:first-child{margin-top:0}
.tune-row{margin-bottom:9px}
.tune-row-label{display:flex;justify-content:space-between;margin-bottom:3px;font-size:10.5px;color:var(--text-secondary)}
.tune-row-label span:last-child{color:var(--amber)}
.tune-row input[type="range"]{width:100%;accent-color:var(--cyan);touch-action:pan-x}
.tune-copy-btn{width:100%;margin-top:4px;font-family:var(--mono);font-size:11px;font-weight:700;color:#04181c;background:var(--green);border:none;border-radius:10px;padding:9px;cursor:pointer}
.tune-copy-btn:active{opacity:.8}
.tune-code{width:100%;margin-top:8px;height:160px;background:var(--surface-1);color:var(--text-primary);border:1px solid var(--divider);border-radius:8px;padding:8px;font-family:var(--mono);font-size:9px;line-height:1.4;resize:none;white-space:pre;-webkit-user-select:text;user-select:text}

/* ===== Overlays ===== */
.overlay{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:32px;background:rgba(5,7,10,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.overlay.show{display:flex}

.result-banner{font-size:30px;font-weight:800}
.result-banner.success{color:var(--green)}
.result-banner.fail{color:var(--signal-red)}
.perfect-tag{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--amber);background:rgba(214,168,75,.14);border:1px solid rgba(214,168,75,.4);border-radius:20px;padding:5px 12px}
</style>
</head>
<body>
<div class="frame" id="frame">

  <div class="bg-layer" id="bgLayer"></div>
  <img class="character-sprite" id="characterSprite" alt="">

  <div class="topbar">
    <a class="vn-btn" href="/dev/">← DEV</a>
    <div class="topbar-right">
      <a class="vn-btn" href="/dev/minigame-fishing/">설정</a>
      <button class="vn-btn" id="debugToggle" type="button">DEBUG</button>
      <button class="vn-btn" id="tuneToggle" type="button">TUNE</button>
    </div>
  </div>

  <div class="debug-panel" id="debugPanel"></div>
  <div class="tune-panel" id="tunePanel">
    <div id="tuneFields"></div>
    <button class="tune-copy-btn" id="tuneCopyBtn" type="button">코드 복사</button>
    <textarea class="tune-code" id="tuneCode" readonly spellcheck="false"></textarea>
  </div>

  <div class="game-stage">
    <div class="track-wrap">
      <div class="track" id="track">
        <div class="catch-bar" id="catchBar"></div>
        <div class="fish" id="fish">🐟</div>
      </div>
    </div>
    <div class="progress-rail" id="progressRail">
      <div class="progress-mid-mark"></div>
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="press-zone" id="pressZone"></div>
  <div class="press-hint" id="pressHint">누르면 위로 떠오르고 · 떼면 가라앉아요</div>

  <div class="overlay" id="resultOverlay">
    <div class="result-banner" id="resultBanner"></div>
    <div class="perfect-tag" id="perfectTag" style="display:none"></div>
  </div>

</div>

<script>
function setVh100() { document.documentElement.style.setProperty('--vh100', window.innerHeight + 'px'); }
setVh100();
window.addEventListener('resize', setVh100);
window.addEventListener('orientationchange', setVh100);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script>
/* =========================================================================
   Stardew-style vertical fishing minigame.
   Simulation is entirely state-driven (barY/fishY/catchProgress are the real
   truth) and stepped on a fixed 60Hz timestep, independent of rAF's dt — see
   FISHING_CONFIG.fixedStep and the accumulator loop at the bottom. Rendering
   only ever reads state and never feeds back into it.

   Reached only via /dev/minigame-fishing/'s 설정 screen (or its own ▶
   플레이 shortcut from /dev/minigames) — this page starts playing
   immediately, same as the other minigames' play routes.
   ========================================================================= */

const FISHING_CONFIG = {
  fixedStep: 1 / 60,

  bar: {
    upAccel: 0.25,
    downAccel: 0.25,
    insideAccelMultiplier: 0.6,
    bounce: 2 / 3,
    heightRatio: 0.30,
  },

  progress: {
    start: 0.5,
    gainPerSecond: 0.20,
    lossPerSecond: 0.085,
  },

  fish: {
    difficultyMin: 15,
    difficultyMax: 95,
    targetDistanceThreshold: 3,
    velocityLerpDivisor: 5,
    biasStep: 0.01,
    biasMax: 1.5,
  },
};

const FISH_HITBOX_INSET = 2; // shrinks the hitbox slightly inside the 36px sprite so the visual and the judgement don't feel mismatched
const FISH_SIZE = 36;

function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }
function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randomBetween(min, max) { return Math.random() * (max - min) + min; }
function weightedRandom(pairs) {
  const total = pairs.reduce((s, [, w]) => s + w, 0);
  let r = Math.random() * total;
  for (const [value, weight] of pairs) {
    r -= weight;
    if (r <= 0) return value;
  }
  return pairs[pairs.length - 1][0];
}

/* ===== Settings from /dev/minigame-fishing/'s 설정 screen — ?diff= picks a
   difficulty band (falls back to the full random range) and ?motion= pins
   every round to one motion type (falls back to the usual weighted mix).
   Bands mirror difficultyLabel()'s cutoffs below. ===== */
const settingsParams = new URLSearchParams(location.search);
const DIFFICULTY_BANDS = {
  'very-easy': [15, 30],
  'easy': [31, 45],
  'normal': [46, 60],
  'hard': [61, 78],
  'very-hard': [79, 95],
};
const MOTION_TYPES = ['mixed', 'smooth', 'dart', 'sinker', 'floater'];
const difficultyRange = DIFFICULTY_BANDS[settingsParams.get('diff')] || [FISHING_CONFIG.fish.difficultyMin, FISHING_CONFIG.fish.difficultyMax];
const fixedMotionType = MOTION_TYPES.includes(settingsParams.get('motion')) ? settingsParams.get('motion') : null;

/* ===== Fish profile: difficulty scalar + motion type, generated fresh
   every round instead of picking from a handful of easy/normal/hard/crazy
   presets — see request doc §11, §40. ===== */
function generateFishProfile() {
  return {
    difficulty: randomInt(difficultyRange[0], difficultyRange[1]),
    motionType: fixedMotionType || weightedRandom([
      ['mixed', 30],
      ['smooth', 20],
      ['dart', 20],
      ['sinker', 15],
      ['floater', 15],
    ]),
  };
}

function difficultyLabel(d) {
  if (d <= 30) return '매우 쉬움';
  if (d <= 45) return '쉬움';
  if (d <= 60) return '보통';
  if (d <= 78) return '어려움';
  return '매우 어려움';
}

/* ===== Runtime state ===== */
const state = {
  gameState: 'playing', // 'playing' | 'success' | 'fail'
  isPressing: false,

  barY: 0,
  barVelocity: 0,
  barHeight: 0,

  fishY: 0,
  fishVelocity: 0,
  fishTargetY: null,
  verticalBias: 0,
  targetCooldownFrames: 0,

  catchProgress: FISHING_CONFIG.progress.start,
  isPerfect: true,
  fishInsideBar: false,

  currentFish: generateFishProfile(),
};

/* ===== Background/character dressing chosen on the 설정 screen — see that
   page's CUSTOMIZATION_KEY comment. Missing/unparsable data just leaves the
   layers hidden, same as never having set them. ===== */
const CUSTOMIZATION_KEY = 'mkFishingCustomization';
let customization = {};
try { customization = JSON.parse(localStorage.getItem(CUSTOMIZATION_KEY)) || {}; }
catch (e) { customization = {}; }

const el = {
  bgLayer: document.getElementById('bgLayer'),
  characterSprite: document.getElementById('characterSprite'),
  track: document.getElementById('track'),
  catchBar: document.getElementById('catchBar'),
  fish: document.getElementById('fish'),
  progressFill: document.getElementById('progressFill'),
  pressZone: document.getElementById('pressZone'),
  pressHint: document.getElementById('pressHint'),
  debugPanel: document.getElementById('debugPanel'),
  debugToggle: document.getElementById('debugToggle'),
  tunePanel: document.getElementById('tunePanel'),
  tuneToggle: document.getElementById('tuneToggle'),
  tuneFields: document.getElementById('tuneFields'),
  tuneCopyBtn: document.getElementById('tuneCopyBtn'),
  tuneCode: document.getElementById('tuneCode'),
  resultOverlay: document.getElementById('resultOverlay'),
  resultBanner: document.getElementById('resultBanner'),
  perfectTag: document.getElementById('perfectTag'),
};

/* ===== Track measurement — cached on resize, never read per-frame ===== */
let trackHeight = 0;
function measure() {
  trackHeight = el.track.clientHeight;
  state.barHeight = trackHeight * FISHING_CONFIG.bar.heightRatio;
}
function maxBarY() { return trackHeight - state.barHeight; }
function maxFishY() { return trackHeight - FISH_SIZE; }
window.addEventListener('resize', () => { measure(); });
window.addEventListener('orientationchange', () => { measure(); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => measure());

/* ===== Fish AI — target-seeking, not sine waves or per-frame random jumps
   (request doc §9-§23, and explicitly forbidden in §50). ===== */
function chooseMainTarget() {
  const mfy = maxFishY();
  const spaceAbove = state.fishY;
  const spaceBelow = mfy - state.fishY;
  const movePercent = Math.min(99, state.currentFish.difficulty + randomInt(10, 44)) / 100;
  const target = Math.random() < 0.5
    ? state.fishY - spaceAbove * movePercent
    : state.fishY + spaceBelow * movePercent;
  state.fishTargetY = clamp(target, 0, mfy);
}

function maybeChooseMainTarget() {
  if (state.targetCooldownFrames > 0) { state.targetCooldownFrames--; return; }
  const difficulty = state.currentFish.difficulty;
  const isSmooth = state.currentFish.motionType === 'smooth';
  const baseChance = difficulty * (isSmooth ? 20 : 1) / 4000;
  if (Math.random() < baseChance && (!isSmooth || state.fishTargetY === null)) {
    chooseMainTarget();
  }
}

function updateMotionBias() {
  const { biasStep, biasMax } = FISHING_CONFIG.fish;
  if (state.currentFish.motionType === 'floater') {
    state.verticalBias = Math.max(state.verticalBias - biasStep, -biasMax);
  } else if (state.currentFish.motionType === 'sinker') {
    state.verticalBias = Math.min(state.verticalBias + biasStep, biasMax);
  }
}

function followTarget() {
  if (state.fishTargetY === null) return;
  const dist = state.fishTargetY - state.fishY;
  const divisor = FISHING_CONFIG.fish.velocityLerpDivisor;
  if (Math.abs(dist) <= FISHING_CONFIG.fish.targetDistanceThreshold) {
    // Target reached — release it so the base reselection logic above (and
    // Smooth's "only pick when there's no target" rule) can kick in again.
    state.fishTargetY = null;
    state.fishVelocity += (0 - state.fishVelocity) / divisor;
    return;
  }
  const denominator = randomInt(10, 29) + (100 - Math.min(100, state.currentFish.difficulty));
  const desiredVelocity = dist / denominator;
  state.fishVelocity += (desiredVelocity - state.fishVelocity) / divisor;
}

function maybeApplyMixedJump() {
  if (state.currentFish.motionType !== 'mixed') return;
  if (Math.random() < state.currentFish.difficulty / 2000) {
    const goUp = Math.random() < 0.5;
    const offset = goUp ? -randomBetween(50, 100) : randomBetween(50, 100);
    state.fishTargetY = clamp(state.fishY + offset, 0, maxFishY());
  }
}

function maybeApplyDartJump() {
  if (state.currentFish.motionType !== 'dart') return;
  if (Math.random() < state.currentFish.difficulty / 1000) {
    const jumpSize = randomBetween(50, 100 + state.currentFish.difficulty * 2);
    const offset = Math.random() < 0.5 ? -jumpSize : jumpSize;
    state.fishTargetY = clamp(state.fishY + offset, 0, maxFishY());
  }
}

function updateFish() {
  maybeChooseMainTarget();
  updateMotionBias();
  followTarget();
  maybeApplyMixedJump();
  maybeApplyDartJump();
  state.fishY = clamp(state.fishY + state.fishVelocity + state.verticalBias, 0, maxFishY());
}

/* ===== Catch-bar physics — acceleration only, never a direct position
   write, and velocity is never zeroed on release (request doc §6, §50). ===== */
function updateBar() {
  const cfg = FISHING_CONFIG.bar;
  let accel = state.isPressing ? -cfg.upAccel : cfg.downAccel;
  if (state.fishInsideBar) accel *= cfg.insideAccelMultiplier;
  state.barVelocity += accel;
  state.barY += state.barVelocity;

  if (state.barY < 0) {
    state.barY = 0;
    state.barVelocity = -state.barVelocity * cfg.bounce;
  }
  const maxY = maxBarY();
  if (state.barY > maxY) {
    state.barY = maxY;
    state.barVelocity = -state.barVelocity * cfg.bounce;
  }
}

/* ===== Collision — full hitbox containment, not a center-point check
   (request doc §24), plus a bottom-edge compensation (§25) so pixel-rounding
   near the floor doesn't make an otherwise-caught fish flicker outside. ===== */
function computeInside() {
  const fishTop = state.fishY + FISH_HITBOX_INSET;
  const fishBottom = state.fishY + FISH_SIZE - FISH_HITBOX_INSET;
  const barTop = state.barY;
  const barBottom = state.barY + state.barHeight;
  let inside = fishTop >= barTop && fishBottom <= barBottom;

  const atBottom = state.barY >= maxBarY() - 4;
  const fishNearBottom = state.fishY >= maxFishY() - state.barHeight;
  if (atBottom && fishNearBottom) inside = true;

  return inside;
}

function updateProgress(inside, dt) {
  const cfg = FISHING_CONFIG.progress;
  state.catchProgress = clamp(
    state.catchProgress + (inside ? cfg.gainPerSecond : -cfg.lossPerSecond) * dt,
    0, 1
  );
  if (!inside) state.isPerfect = false;
  if (state.catchProgress >= 1) success();
  else if (state.catchProgress <= 0) fail();
}

/* ===== Fixed update ===== */
function fixedUpdate(dt) {
  if (state.gameState !== 'playing') return;
  updateBar();
  updateFish();
  const inside = computeInside();
  state.fishInsideBar = inside;
  updateProgress(inside, dt);
}

/* ===== Round lifecycle ===== */
function resetRound() {
  measure();
  state.barY = maxBarY();
  state.barVelocity = 0;

  state.fishY = maxFishY();
  state.fishVelocity = 0;
  state.fishTargetY = null;
  state.verticalBias = 0;
  // Round-start grace period so the fish doesn't snap toward a target the
  // instant the round begins (request doc §37).
  state.targetCooldownFrames = Math.round(randomBetween(0.3, 0.8) / FISHING_CONFIG.fixedStep);

  state.catchProgress = FISHING_CONFIG.progress.start;
  state.currentFish = generateFishProfile();
  state.isPerfect = true;
  state.isPressing = false;
  state.fishInsideBar = false;

  el.resultOverlay.classList.remove('show');
  el.pressHint.style.opacity = '1';
  state.gameState = 'playing';
}

function success() {
  state.gameState = 'success';
  state.isPressing = false;
  el.resultBanner.textContent = '잡았다! 🐟';
  el.resultBanner.className = 'result-banner success';
  el.perfectTag.style.display = state.isPerfect ? '' : 'none';
  el.resultOverlay.classList.add('show');
  setTimeout(resetRound, randomBetween(800, 1200));
}

function fail() {
  state.gameState = 'fail';
  state.isPressing = false;
  el.resultBanner.textContent = '놓쳤다! 💦';
  el.resultBanner.className = 'result-banner fail';
  el.perfectTag.style.display = 'none';
  el.resultOverlay.classList.add('show');
  setTimeout(resetRound, randomBetween(800, 1200));
}

/* ===== Input — hold-based only (a single tap must never move the bar),
   with pointer capture so a dragging finger doesn't drop the hold, plus
   touch/mouse/keyboard fallbacks and app-backgrounding safety (§8, §50). ===== */
function startPress(e) {
  if (e && e.preventDefault) e.preventDefault();
  if (state.gameState !== 'playing') return;
  state.isPressing = true;
}
function endPress(e) {
  if (e && e.preventDefault) e.preventDefault();
  state.isPressing = false;
}

el.pressZone.addEventListener('pointerdown', (e) => {
  el.pressZone.setPointerCapture(e.pointerId);
  startPress(e);
});
el.pressZone.addEventListener('pointerup', endPress);
el.pressZone.addEventListener('pointercancel', endPress);
el.pressZone.addEventListener('lostpointercapture', endPress);
el.pressZone.addEventListener('touchstart', startPress, { passive: false });
el.pressZone.addEventListener('touchend', endPress, { passive: false });
el.pressZone.addEventListener('touchcancel', endPress, { passive: false });
el.pressZone.addEventListener('mousedown', startPress);
window.addEventListener('mouseup', endPress);
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') startPress(e);
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') endPress(e);
});
window.addEventListener('blur', () => endPress());
document.addEventListener('visibilitychange', () => { if (document.hidden) endPress(); });

el.debugToggle.addEventListener('click', () => {
  el.debugPanel.classList.toggle('show');
});

/* ===== Tune panel — sliders bound directly to FISHING_CONFIG so gameplay
   updates live, plus a "코드 복사" button that copies a ready-to-paste
   FISHING_CONFIG literal (same shape as the one at the top of this file)
   with the dialed-in values baked in. ===== */
const TUNE_FIELDS = [
  { group: 'Bar', key: 'bar.upAccel', label: 'Up Accel', min: 0.05, max: 1, step: 0.01 },
  { group: 'Bar', key: 'bar.downAccel', label: 'Down Accel', min: 0.05, max: 1, step: 0.01 },
  { group: 'Bar', key: 'bar.insideAccelMultiplier', label: 'Inside Accel ×', min: 0.1, max: 1, step: 0.01 },
  { group: 'Bar', key: 'bar.bounce', label: 'Bounce', min: 0, max: 1, step: 0.01 },
  { group: 'Bar', key: 'bar.heightRatio', label: 'Height Ratio', min: 0.1, max: 0.6, step: 0.01 },
  { group: 'Progress', key: 'progress.start', label: 'Start', min: 0, max: 1, step: 0.01 },
  { group: 'Progress', key: 'progress.gainPerSecond', label: 'Gain / sec', min: 0.05, max: 1, step: 0.01 },
  { group: 'Progress', key: 'progress.lossPerSecond', label: 'Loss / sec', min: 0.02, max: 0.5, step: 0.005 },
  { group: 'Fish', key: 'fish.difficultyMin', label: 'Difficulty Min', min: 0, max: 100, step: 1 },
  { group: 'Fish', key: 'fish.difficultyMax', label: 'Difficulty Max', min: 0, max: 100, step: 1 },
  { group: 'Fish', key: 'fish.targetDistanceThreshold', label: 'Target Dist Threshold', min: 1, max: 20, step: 1 },
  { group: 'Fish', key: 'fish.velocityLerpDivisor', label: 'Velocity Lerp Divisor', min: 1, max: 20, step: 1 },
  { group: 'Fish', key: 'fish.biasStep', label: 'Bias Step', min: 0, max: 0.1, step: 0.001 },
  { group: 'Fish', key: 'fish.biasMax', label: 'Bias Max', min: 0, max: 5, step: 0.1 },
];

function getByPath(obj, path) { return path.split('.').reduce((o, k) => o[k], obj); }
function setByPath(obj, path, value) {
  const keys = path.split('.');
  const last = keys.pop();
  keys.reduce((o, k) => o[k], obj)[last] = value;
}

function formatConfigCode() {
  const c = FISHING_CONFIG;
  return `const FISHING_CONFIG = {
  fixedStep: 1 / 60,

  bar: {
    upAccel: ${c.bar.upAccel},
    downAccel: ${c.bar.downAccel},
    insideAccelMultiplier: ${c.bar.insideAccelMultiplier},
    bounce: ${c.bar.bounce},
    heightRatio: ${c.bar.heightRatio},
  },

  progress: {
    start: ${c.progress.start},
    gainPerSecond: ${c.progress.gainPerSecond},
    lossPerSecond: ${c.progress.lossPerSecond},
  },

  fish: {
    difficultyMin: ${c.fish.difficultyMin},
    difficultyMax: ${c.fish.difficultyMax},
    targetDistanceThreshold: ${c.fish.targetDistanceThreshold},
    velocityLerpDivisor: ${c.fish.velocityLerpDivisor},
    biasStep: ${c.fish.biasStep},
    biasMax: ${c.fish.biasMax},
  },
};`;
}

function refreshTuneCode() {
  el.tuneCode.value = formatConfigCode();
}

function buildTunePanel() {
  let currentGroup = null;
  TUNE_FIELDS.forEach((f) => {
    if (f.group !== currentGroup) {
      currentGroup = f.group;
      const h = document.createElement('h4');
      h.textContent = f.group;
      el.tuneFields.appendChild(h);
    }
    const value = getByPath(FISHING_CONFIG, f.key);
    const row = document.createElement('div');
    row.className = 'tune-row';
    row.innerHTML =
      `<div class="tune-row-label"><span>${f.label}</span><span data-val>${value}</span></div>` +
      `<input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${value}">`;
    const input = row.querySelector('input');
    const valSpan = row.querySelector('[data-val]');
    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      setByPath(FISHING_CONFIG, f.key, v);
      valSpan.textContent = v;
      if (f.key === 'bar.heightRatio') measure();
      refreshTuneCode();
    });
    el.tuneFields.appendChild(row);
  });
  refreshTuneCode();
}
buildTunePanel();

el.tuneToggle.addEventListener('click', () => {
  el.tunePanel.classList.toggle('show');
});

el.tuneCopyBtn.addEventListener('click', async () => {
  const text = formatConfigCode();
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    el.tuneCode.focus();
    el.tuneCode.select();
    document.execCommand('copy');
  }
  const original = el.tuneCopyBtn.textContent;
  el.tuneCopyBtn.textContent = '복사됨!';
  setTimeout(() => { el.tuneCopyBtn.textContent = original; }, 1200);
});

/* ===== Render — reads state only, never mutates it ===== */
let fps = 0, fpsFrames = 0, fpsAccum = 0;
function render() {
  el.catchBar.style.height = state.barHeight + 'px';
  el.catchBar.style.transform = `translateY(${state.barY}px)`;
  el.catchBar.classList.toggle('hooked', state.fishInsideBar);

  const tilt = clamp(state.fishVelocity * 3, -22, 22);
  el.fish.style.transform = `translateY(${state.fishY}px) rotate(${tilt}deg)`;

  el.progressFill.style.height = (state.catchProgress * 100) + '%';
  el.progressFill.classList.toggle('danger', state.catchProgress < 0.25);

  el.pressHint.classList.toggle('hold', state.isPressing);
  el.pressHint.style.opacity = state.gameState === 'playing' ? '1' : '0';

  if (el.debugPanel.classList.contains('show')) {
    const f = state.currentFish;
    el.debugPanel.textContent =
`State: ${state.gameState}
FPS: ${fps}
Difficulty: ${f.difficulty} (${difficultyLabel(f.difficulty)})
Motion: ${f.motionType}
FishY: ${state.fishY.toFixed(1)}
FishVel: ${state.fishVelocity.toFixed(2)}
FishTarget: ${state.fishTargetY === null ? '-' : state.fishTargetY.toFixed(1)}
BarY: ${state.barY.toFixed(1)}
BarVel: ${state.barVelocity.toFixed(2)}
Progress: ${(state.catchProgress * 100).toFixed(1)}%
Inside: ${state.fishInsideBar}
Perfect: ${state.isPerfect}`;
  }
}

/* ===== Fixed-timestep main loop (request doc §5) ===== */
const FIXED_STEP = FISHING_CONFIG.fixedStep;
let accumulator = 0;
let lastTime = performance.now();

function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  dt = Math.min(dt, 0.1);
  accumulator += dt;

  fpsAccum += dt;
  fpsFrames++;
  if (fpsAccum >= 1) { fps = fpsFrames; fpsFrames = 0; fpsAccum = 0; }

  while (accumulator >= FIXED_STEP) {
    fixedUpdate(FIXED_STEP);
    accumulator -= FIXED_STEP;
  }

  render();
  requestAnimationFrame(frame);
}

function applyCustomization() {
  if (customization.background) {
    el.bgLayer.style.backgroundImage = `url("${customization.background}")`;
    el.bgLayer.classList.add('show');
  }
  if (customization.character) {
    el.characterSprite.src = customization.character;
    el.characterSprite.classList.add('show');
  }
}

applyCustomization();
resetRound();
requestAnimationFrame(frame);
</script>
