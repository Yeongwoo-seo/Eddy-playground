  const frameRect = el.frame.getBoundingClientRect();
  const zoom = effectiveBgZoom();
  const scaledW = worldSize.w * zoom, scaledH = worldSize.h * zoom;
  const charXScaled = charWorldPos.x * zoom;
  const charYFromTopScaled = (worldSize.h - charWorldPos.y) * zoom;
  const camX = clamp(charXScaled - frameRect.width / 2, 0, Math.max(0, scaledW - frameRect.width));
  const camY = clamp(charYFromTopScaled - frameRect.height / 2, 0, Math.max(0, scaledH - frameRect.height));
  camOffset = { x: camX, y: camY };
  if (hasWorldBackground) {
    el.frame.style.backgroundSize = `${scaledW}px ${scaledH}px`;
    el.frame.style.backgroundPosition = `${-camX}px ${-camY}px`;
  }
  el.charStage.style.left = (charXScaled - camX) + 'px';
  el.charStage.style.bottom = (frameRect.height - charYFromTopScaled + camY) + 'px';
}

// 화면 크기가 바뀌면(회전, 리사이즈) — 배경 미업로드 폴백 모드에서는
// worldSize 자체가 "화면 크기"이므로 다시 맞추고 캐릭터 범위도 재조정한다.
// 배경을 업로드했을 땐 이미지 크기(worldSize)는 그대로고 카메라 clamp와
// 캐릭터 화면 위치만 다시 계산하면 된다(updateCamera). loadConfig가 아직
// 안 끝나 charWorldPos가 없으면(최초 로드 전) 아무것도 하지 않는다 —
// loadConfig가 초기 배치를 담당한다.
function onFrameResize() {
  if (!charWorldPos) return;
  if (!hasWorldBackground) {
    const frameRect = el.frame.getBoundingClientRect();
    worldSize = { w: frameRect.width, h: frameRect.height };
    const wb = worldBounds();
    charWorldPos.x = clamp(charWorldPos.x, wb.minX, wb.maxX);
    charWorldPos.y = clamp(charWorldPos.y, wb.minY, wb.maxY);
  }
  updateCamera();
}
window.addEventListener('resize', onFrameResize);
window.addEventListener('orientationchange', onFrameResize);

/* ===== 영역(다각형) 판정 =====
   dev/minigame-fishing/index.html "영역 설정" 탭에서 그린 다각형은 배경
   이미지의 자연 크기(bgDims) 기준 0~1 정규화 좌표(points)로 저장돼 있다.
   캐릭터 위치(charWorldPos)는 배경을 업로드했을 땐 이미 배경 원본 크기
   기준 px라 bgDims로 나누기만 하면 바로 같은 좌표계가 된다
   (worldPosToImageFrac). 반면 추(찌)가 착수하는 지점처럼 el.frame(화면)
   기준 픽셀로 계산되는 좌표는, 카메라가 지금 배경을 얼마나 옮겨뒀는지
   (camOffset)를 더해 배경 원본 좌표로 바꾼 다음에야 bgDims로 나눌 수
   있다(framePxToImageFrac). */
function isPointInPolygon(px, py, points) {
  let inside = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    const xi = points[i].x, yi = points[i].y, xj = points[j].x, yj = points[j].y;
    const intersect = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}
// x/y: charWorldPos와 같은 형식(배경 원본 이미지 기준 px, 왼쪽/아래 기준).
// bgDims를 못 읽었으면(배경 없음 등) 판정 근거가 없으므로 null을 돌려주고,
// 호출부는 이 경우 전부 "제한 없음"으로 취급한다.
function worldPosToImageFrac(x, y) {
  if (!bgDims) return null;
  return { x: x / bgDims.width, y: 1 - y / bgDims.height }; // y는 아래 기준 → 이미지 좌표계(위 기준)로 뒤집는다
}
function isInsideAnyArea(frac, areas) {
  return !!frac && areas.some(a => isPointInPolygon(frac.x, frac.y, a.points));
}
function areaContaining(frac, areas) {
  if (!frac) return null;
  return areas.find(a => isPointInPolygon(frac.x, frac.y, a.points)) || null;
}

// 상호작용 영역(상점/대화 등) — 캐릭터가 들어오고 나갈 때만(매 프레임이
// 아니라 상태가 바뀔 때만) 배지를 갱신하고 이벤트를 쏜다. 이 미니게임
// 자체엔 상점/대화 UI가 없으므로, 실제 동작은 다른 화면이 이 이벤트를
// 구독해서 만들면 된다 — 여기선 영역 감지 + 라벨 배지 표시까지만 한다.
let activeInteractionAreaId = null;
function checkInteractionArea() {
  const area = areaContaining(worldPosToImageFrac(charWorldPos.x, charWorldPos.y), interactionAreas);
  const id = area ? area.id : null;
  if (id === activeInteractionAreaId) return;
  activeInteractionAreaId = id;
  if (area) {
    el.interactionBadge.textContent = area.label || '상호작용';
    el.interactionBadge.classList.remove('hidden');
    vibrate(10);
    window.dispatchEvent(new CustomEvent('fishing:interaction-enter', { detail: { id: area.id, label: area.label } }));
  } else {
    el.interactionBadge.classList.add('hidden');
    window.dispatchEvent(new CustomEvent('fishing:interaction-leave', {}));
  }
}

// 낚시가능 영역(fishableAreas) 판정은 캐릭터가 아니라 "추(찌)가 실제로
// 착수한 지점" 기준이다(throwSinker의 finish에서 씀) — 그래서 배경 원본
// 기준 px가 아니라 el.frame(화면) 기준 픽셀 좌표를 받는 버전이 필요하다.
// camOffset(지금 카메라가 옮겨둔 만큼)을 더해 배경 원본 좌표로 바꾼 뒤
// worldPosToImageFrac과 같은 식으로 이미지 정규화 좌표를 낸다.
function framePxToImageFrac(px, py) {
  if (!bgDims) return null;
  const zoom = effectiveBgZoom();
  const worldX = (px + camOffset.x) / zoom, worldYFromTop = (py + camOffset.y) / zoom;
  return { x: worldX / bgDims.width, y: worldYFromTop / bgDims.height };
}

/* ===== 설정 로드 (AssetDB) — 실패해도 게임은 도형 폴백으로 계속 동작한다. ===== */
async function loadConfig() {
  let cfg = { barDesign: {}, motionSheetAssetId: null, motionFrameOverrides: {} };
  try { cfg = await AssetDB.getFishingConfig(); } catch (e) { /* 오프라인/미설정 — 기본값으로 진행 */ }
  // 캐스팅·올리기(예전엔 각각 castingSheetAssetId 1행 시트/reelingFrames
  // 개별 업로드 배열)는 이제 motionSheetAssetId 6행×6열 시트 한 장을
  // 카테고리(행)별로 잘라 쓴다(dev/minigame-fishing/index.html 참고).
  const ids = [];
  const design = cfg.barDesign || {};
  if (design.fishIconAssetId) ids.push(design.fishIconAssetId);
  if (design.barLayer && design.barLayer.assetId) ids.push(design.barLayer.assetId);
  if (design.catchLayer && design.catchLayer.assetId) ids.push(design.catchLayer.assetId);
  if (design.sinkerImageAssetId) ids.push(design.sinkerImageAssetId);
  if (design.biteStampAssetId) ids.push(design.biteStampAssetId);
  if (design.gaugeImageAssetId) ids.push(design.gaugeImageAssetId);
  if (cfg.fishSheetAssetId) ids.push(cfg.fishSheetAssetId);
  if (cfg.motionSheetAssetId) ids.push(cfg.motionSheetAssetId);
  if (cfg.backgroundAssetId) ids.push(cfg.backgroundAssetId);
  if (cfg.castGaugeAssetId) ids.push(cfg.castGaugeAssetId);
  const itemPopupCfg = cfg.itemPopup || {};
  if (itemPopupCfg.backgroundAssetId) ids.push(itemPopupCfg.backgroundAssetId);
  const dialogueSceneCfg = cfg.dialogueScene || {};
  DIALOGUE_INTRO_LAYERS.forEach(key => { if (dialogueSceneCfg[key] && dialogueSceneCfg[key].assetId) ids.push(dialogueSceneCfg[key].assetId); });
  let assets = [];
  try { assets = await AssetDB.getAssetsByIds(ids); } catch (e) { /* 위와 동일 */ }
  const byId = new Map(assets.map(a => [a.id, a]));
  const motionSheetAsset = cfg.motionSheetAssetId ? byId.get(cfg.motionSheetAssetId) : null;
  const motionOverrides = cfg.motionFrameOverrides || {};
  let motionSheetImg = null;
  if (motionSheetAsset) {
    motionSheetImg = await new Promise(resolve => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => resolve(im);
      im.onerror = () => resolve(null);
      im.src = motionSheetAsset.dataUrl;
    });
  }
  // outputSize를 안 넘긴다 — buildMotionCategoryFrameDataUrls가 원본 크롭
  // 해상도를 그대로 살린다(84px char-stage/96px 미리보기에서 다시 확대되며
  // 흐려지지 않게).
  castFrameUrls = motionSheetImg ? buildMotionCategoryFrameDataUrls(motionSheetImg, MOTION_CATEGORIES.indexOf('cast'), motionOverrides.cast) : [];
  reelFrameUrls = motionSheetImg ? buildMotionCategoryFrameDataUrls(motionSheetImg, MOTION_CATEGORIES.indexOf('reel'), motionOverrides.reel) : [];
  castFrameDurations = (cfg.castingFrameDurations && cfg.castingFrameDurations.length) ? cfg.castingFrameDurations : null;
  castingFrameRodTips = cfg.castingFrameRodTips || {};
  heldFishPos = cfg.heldFishPos || DEFAULT_HELD_FISH_POS;
  castPhysics = Object.assign({ gravityMps2: 9.8, vxScale: 1 }, cfg.castPhysics || {});
  reelMotion = Object.assign({ holdFrameMs: 90 }, cfg.reelMotion || {});

  // 이동 방향별 걷기 프레임 — 캐스팅/올리기와 같은 통합 모션 시트
  // (motionSheetImg)의 up/down/left/right 행에서 잘라 캐시해둔다. 시트
  // 자체를 안 올렸으면 빈 배열로 두고, stepChar가 그 경우 캐릭터 그림을
  // 그대로 둔 채 위치만 옮긴다.
  walkMotion = Object.assign({ stepMs: 200, animFrameMs: 90 }, cfg.walkMotion || {});
  walkFrameUrls = { up: [], down: [], left: [], right: [] };
  if (motionSheetImg) {
    for (const dir of MOVE_DIRS) {
      walkFrameUrls[dir] = buildMotionCategoryFrameDataUrls(motionSheetImg, MOTION_CATEGORIES.indexOf(dir), motionOverrides[dir]);
    }
  }
  const fishSheetAsset = cfg.fishSheetAssetId ? byId.get(cfg.fishSheetAssetId) : null;
  fishSheetUrl = fishSheetAsset ? fishSheetAsset.dataUrl : null;
  fishIconOverrides = cfg.fishIconOverrides || {};
  if (fishSheetUrl) {
    fishSheetDims = await new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
      img.onerror = () => resolve(null);
      img.src = fishSheetUrl;
    });
  }

  // 배경화면 — el.frame 자체는 화면 크기 그대로 두고, background-position만
  // 캐릭터 좌표에 맞춰 옮긴다("그 화면 사이즈에 맞게 로딩") — 배경 전체를
  // 담은 거대한 DOM을 따로 만들어 옮기지 않는다. background-size는 auto라
  // 항상 원본 픽셀 크기(1배율, 늘이거나 잘라내지 않음) 그대로 그려지고,
  // background-position(updateCamera가 캐릭터 좌표 기준으로 매 프레임
  // 계산)만 바뀌어 화면보다 큰 배경도 실제로 돌아다닐 수 있다 — 예전엔
  // background-position:center로 고정해서 화면보다 큰 배경은 가운데 부분만
  // 보이고 나머지로는 아예 이동할 수 없었다. 업로드가 없거나 자연 크기를
  // 못 읽었으면 .frame CSS 기본값(하늘/바다 그라데이션)이 그대로 보이게
  // 하고, 카메라가 움직이지 않는 예전 동작(좁은 범위 안 이동)으로 자연히
  // 폴백한다.
  const backgroundAsset = cfg.backgroundAssetId ? byId.get(cfg.backgroundAssetId) : null;
  // 배경 자연 크기 — "영역 설정" 탭에서 그린 다각형(fishableAreas/
  // blockedAreas/interactionAreas)이 이 크기 기준 0~1 정규화 좌표라,
  // 캐릭터/추 착수 지점과 비교하려면 필요하고(worldPosToImageFrac/
  // framePxToImageFrac 참고), 배경이 있을 땐 캐릭터가 돌아다닐 수 있는
  // 전체 범위(worldSize)로도 그대로 쓴다.
  bgDims = backgroundAsset ? await new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
    img.onerror = () => resolve(null);
    img.src = backgroundAsset.dataUrl;
  }) : null;
  fishableAreas = cfg.fishableAreas || [];
  blockedAreas = cfg.blockedAreas || [];
  interactionAreas = cfg.interactionAreas || [];

  hasWorldBackground = !!(backgroundAsset && bgDims);
  // 배경이 바뀔 때마다(재입장 등) 줌을 1배율로 되돌린다 — 슬라이더는
  // 배경이 있을 때만 보이고, 없으면 숨긴다(effectiveBgZoom이 어차피 1로
  // 강제하지만 슬라이더 자체를 숨겨 조작할 수 없게 한다).
  bgZoom = 1;
  el.layoutBgZoom.value = '1';
  el.layoutBgZoomRow.classList.toggle('hidden', !hasWorldBackground);
  const frameRectForWorld = el.frame.getBoundingClientRect();
  worldSize = hasWorldBackground ? { w: bgDims.width, h: bgDims.height } : { w: frameRectForWorld.width, h: frameRectForWorld.height };
  el.frame.style.backgroundImage = backgroundAsset ? `url(${backgroundAsset.dataUrl})` : '';
  // hasWorldBackground면 background-size:auto(원본 크기 그대로)로 두고
  // updateCamera가 매 프레임 background-position을 옮긴다. 배경은 있는데
  // 자연 크기를 못 읽은 예외 상황에서는(카메라가 못 움직임) 예전처럼
  // auto+center로 최소한 보이게라도 한다.
  el.frame.style.backgroundSize = 'auto';
  el.frame.style.backgroundPosition = hasWorldBackground ? '' : 'center';
  el.frame.style.backgroundRepeat = backgroundAsset ? 'no-repeat' : '';
  const wb = worldBounds();
  if (!charWorldPos) {
    // 예전 CSS 기본값(화면 정중앙)과 같은 자리에서 시작하되, 새 범위(wb)
    // 안으로 clamp한다.
    charWorldPos = { x: clamp(worldSize.w / 2, wb.minX, wb.maxX), y: clamp(worldSize.h / 2, wb.minY, wb.maxY) };
  } else {
    charWorldPos.x = clamp(charWorldPos.x, wb.minX, wb.maxX);
    charWorldPos.y = clamp(charWorldPos.y, wb.minY, wb.maxY);
  }
  updateCamera();

  // 낚시바 모듈 크기 — 설정 화면 슬라이드 에디터(dev/minigame-fishing/
  // index.html)의 슬라이드 실제 px 크기를 그대로 쓴다.
  const slideWidthPx = design.slideWidthPx || 90;
  el.fishbar.style.width = slideWidthPx + 'px';
  el.fishbar.style.height = (design.slideHeightPx || 260) + 'px';

  // 물고기 아이콘 크기 — 설정 화면(fishIconSizeInput)에서 직접 지정한
  // 값을 쓴다. 아직 지정한 적 없는 기존 설정(fishIconSizePx 미설정)은
  // 예전 자동 계산값(기본 폭 90px 기준 26px, 낚시바가 더 좁으면
  // (slideWidthInput min 40px) 그 폭에 비례해 줄어듦 — 폭에 상관없이 항상
  // 26px 고정이면 좁은 낚시바에서 아이콘이 바 너비를 넘어가 튀어나와
  // 보이던 문제가 있었다)으로 그대로 폴백한다.
  const fishIconSizePx = design.fishIconSizePx || Math.min(26, slideWidthPx * 0.4);
  el.fishbarFish.style.setProperty('--fishbar-fish-size', fishIconSizePx + 'px');

  // 낚시바 이미지 — barLayer(x,y,w,h, 슬라이드 기준 0~1 비율)를 그대로
  // 절대위치로 옮겨온다(설정 화면 슬라이드와 좌표계가 동일하므로 변환 없음).
  const barImageAsset = design.barLayer && design.barLayer.assetId ? byId.get(design.barLayer.assetId) : null;
  if (barImageAsset && design.barLayer) {
    el.fishbarBarImg.querySelector('img').src = (await preloadWithRetry(barImageAsset.dataUrl, 3, 500)).url;
    el.fishbarBarImg.style.left = (design.barLayer.x * 100) + '%';
    el.fishbarBarImg.style.top = (design.barLayer.y * 100) + '%';
    el.fishbarBarImg.style.width = (design.barLayer.w * 100) + '%';
    el.fishbarBarImg.style.height = (design.barLayer.h * 100) + '%';
    el.fishbarBarImg.classList.remove('hidden');
  } else {
    el.fishbarBarImg.classList.add('hidden');
  }

  // 캐치바(캐치존) — 좌우 위치/폭은 barLayer/fishRegion과 똑같이 catchLayer의
  // 슬라이드 좌표(x,w)를 그대로 1:1로 쓴다(에디터에서 본 자리 그대로).
  // 예전엔 zoneRegion 기준 상대 위치로 다시 계산했는데, catchLayer가
  // zoneRegion 경계를 살짝 벗어나면 클램프 때문에 실제 화면 위치가
  // 에디터에서 배치한 자리와 어긋나는("이미지 인식이 x축으로 살짝 밀려
  // 보인다" 보고) 문제가 있었다. zoneRegion은 세로 이동 트랙(위아래로
  // 움직이는 범위)과 캐치바 높이 비율(zoneSizePct)에만 쓴다 — 세로 이동
  // 자체(캐치존 y)는 계속 0~100 추상 공간에서 물리대로 계산되고
  // (updateZone), 여기서 정하는 건 트랙의 화면상 배치뿐이다.
  const zoneRegion = design.zoneRegion;
  const catchLayer = design.catchLayer;
  const catchImageAsset = catchLayer && catchLayer.assetId ? byId.get(catchLayer.assetId) : null;
  // 이미지 로드에 성공했을 때만 파란 폴백 색(#59B8C8)을 뺀다 — 예전엔 색을
  // 항상 먼저 채워두고 그 위에 이미지를 얹기만 했는데, 업로드한 이미지에
  // 투명한 부분이 조금이라도 있으면 그 틈으로 파란색이 그대로 비쳐서
  // "이미지를 올렸는데도 이상한 파란 바가 보인다"는 문제가 있었다. 다만
  // 색을 아예 없애버리면 이미지 로드가 실패했을 때(재시도를 다 써도 안 될
  // 때) 색도 이미지도 없어 캐치바가 완전히 안 보이는 문제가 생겨서
  // (사용자 보고: "캐치바가 아예 안떠"), 로드 성공 여부에 따라 나눈다.
  if (catchImageAsset) {
    const catchImage = await preloadWithRetry(catchImageAsset.dataUrl, 3, 500);
    el.fishbarZone.style.background = catchImage.ok ? 'none' : '#59B8C8';
    el.fishbarZone.style.backgroundImage = `url(${catchImage.url})`;
  } else {
    el.fishbarZone.style.background = '#59B8C8';
    el.fishbarZone.style.backgroundImage = '';
  }
  // background(숏핸드)가 방금 위에서 backgroundSize를 auto로 되돌려놨다 —
  // CSS(.fishbar-zone{background-size:100% 100%})만으로는 이 인라인
  // 리셋을 못 이겨서, 매번 다시 명시적으로 채워야 실제로 적용된다.
  el.fishbarZone.style.backgroundSize = '100% 100%';
  if (zoneRegion) {
    zoneTrack = { x: zoneRegion.x * 100, y: zoneRegion.y * 100, w: zoneRegion.w * 100, h: zoneRegion.h * 100 };
    if (catchLayer) {
      zoneSizePct = clamp(catchLayer.h / zoneRegion.h * 100, 5, 95);
      el.fishbarZone.style.left = (catchLayer.x * 100) + '%';
      el.fishbarZone.style.width = (catchLayer.w * 100) + '%';
    } else {
      zoneSizePct = 28;
      el.fishbarZone.style.left = zoneTrack.x + '%';
      el.fishbarZone.style.width = zoneTrack.w + '%';
    }
    el.fishbarZone.style.height = (zoneSizePct / 100 * zoneTrack.h) + '%';
  } else {
    zoneTrack = null;
    zoneSizePct = 28;
    el.fishbarZone.style.left = '0%';
    el.fishbarZone.style.width = '100%';
    el.fishbarZone.style.height = zoneSizePct + '%';
  }

  // 물고기(.fishbar-fish) — fishRegion(트랙, 슬라이드 기준 0~1)이 있으면
  // 그 안에서 움직이고, 없으면 예전처럼 캐치존과 같은 zoneTrack을 그대로
  // 쓴다(fishRegion을 아직 안 만든 기존 설정과의 호환). fish.y는 세로
  // 위치만 담당하므로, 가로 위치는 트랙 가로 중앙에 고정한다.
  const fishRegion = design.fishRegion;
  fishTrack = fishRegion
    ? { x: fishRegion.x * 100, y: fishRegion.y * 100, w: fishRegion.w * 100, h: fishRegion.h * 100 }
    : zoneTrack;
  el.fishbarFish.style.left = fishTrack ? (fishTrack.x + fishTrack.w / 2) + '%' : '50%';

  // 게이지 — gaugeRegion을 지정했을 때만 나타난다(미지정 시 기본 숨김).
  if (design.gaugeRegion) {
    const gr = design.gaugeRegion;
    el.fishbarGauge.style.left = (gr.x * 100) + '%';
    el.fishbarGauge.style.top = (gr.y * 100) + '%';
    el.fishbarGauge.style.width = (gr.w * 100) + '%';
    el.fishbarGauge.style.height = (gr.h * 100) + '%';
    // CSS 기본값이 display:none이라 style.display를 빈 문자열로 되돌리면
    // 그 CSS 규칙이 그대로 이어져 계속 안 보인다 — 반드시 명시적으로
    // 'block'을 지정해야 실제로 나타난다(gaugeRegion을 지정해도 게이지가
    // 화면에 전혀 안 보이던 버그의 원인).
    el.fishbarGauge.style.display = 'block';
  } else {
    el.fishbarGauge.style.display = 'none';
  }

  const fishIconAsset = design.fishIconAssetId ? byId.get(design.fishIconAssetId) : null;
  if (fishIconAsset) el.fishbarFish.innerHTML = `<img src="${fishIconAsset.dataUrl}" alt="">`;

  const sinkerImageAsset = design.sinkerImageAssetId ? byId.get(design.sinkerImageAssetId) : null;
  sinkerImageUrl = sinkerImageAsset ? sinkerImageAsset.dataUrl : null;
  el.castSinker.style.display = sinkerImageUrl ? 'none' : '';
  el.castSinkerImg.style.display = sinkerImageUrl ? '' : 'none';
  if (sinkerImageUrl) el.castSinkerImg.setAttribute('href', sinkerImageUrl);
  // 착수 후 입질 대기 중 계속 떠 있는 bobber(찌)도 같은 추 이미지를 쓴다 —
  // 캐스팅 비행 중에만 이미지가 보이고 착수하자마자 기본 빨간 마름모로
  // 바뀌어 보이던 문제(사용자 보고: "이미지 올려도 적용 안 됨")를 해결한다.
  el.bobberDot.style.display = sinkerImageUrl ? 'none' : '';
  el.bobberImg.style.display = sinkerImageUrl ? 'block' : 'none';
  if (sinkerImageUrl) el.bobberImg.src = sinkerImageUrl;

  // 잡아채기 게이지 채움 이미지 — 있으면 fishbarGauge 배경으로 깔고,
  // 없으면 renderBarFrame이 매 프레임 진행도 색으로 칠한다. 이미지는
  // 한 번만 지정해두면 되니(색은 진행도가 바뀔 때마다 다시 칠해야 해서
  // 매 프레임 갱신) 여기 loadConfig에서 한 번만 적용한다.
  const gaugeImageAsset = design.gaugeImageAssetId ? byId.get(design.gaugeImageAssetId) : null;
  gaugeImageUrl = gaugeImageAsset ? (await preloadWithRetry(gaugeImageAsset.dataUrl, 3, 500)).url : null;
  el.fishbarGauge.style.backgroundImage = gaugeImageUrl ? `url(${gaugeImageUrl})` : 'none';

  // 캐스팅 게이지 이미지 — 이미지와 채움 영역(castGaugeFillRegion)이 둘 다
  // 있어야 커스텀 게이지를 켠다(하나만 있으면 기본 막대 게이지로 그대로
  // 폴백). 게이지 스테이지의 종횡비를 실제 업로드 이미지 크기에 맞춰야
  // fillRegion(이미지 자연 크기 대비 0~1)이 화면에서도 같은 자리를 가리킨다.
  const castGaugeAsset = cfg.castGaugeAssetId ? byId.get(cfg.castGaugeAssetId) : null;
  const castGaugeFillRegion = cfg.castGaugeFillRegion;
  if (castGaugeAsset && castGaugeFillRegion) {
    el.castPowerWrap.classList.add('custom-gauge');
    const gaugeUrl = (await preloadWithRetry(castGaugeAsset.dataUrl, 3, 500)).url;
    el.castPowerGaugeImg.src = gaugeUrl;
    const dims = await new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
      img.onerror = () => resolve(null);
      img.src = gaugeUrl;
    });
    if (dims) el.castPowerStage.style.setProperty('--gauge-ar', dims.w + '/' + dims.h);
    el.castPowerTrack.style.left = (castGaugeFillRegion.x * 100) + '%';
    el.castPowerTrack.style.top = (castGaugeFillRegion.y * 100) + '%';
    el.castPowerTrack.style.width = (castGaugeFillRegion.w * 100) + '%';
    el.castPowerTrack.style.height = (castGaugeFillRegion.h * 100) + '%';
  } else {
    el.castPowerWrap.classList.remove('custom-gauge');
    el.castPowerTrack.style.left = '';
    el.castPowerTrack.style.top = '';
    el.castPowerTrack.style.width = '';
    el.castPowerTrack.style.height = '';
  }

  const biteStampAsset = design.biteStampAssetId ? byId.get(design.biteStampAssetId) : null;
  biteStampImageUrl = biteStampAsset ? biteStampAsset.dataUrl : null;
  el.biteCaughtText.style.display = biteStampImageUrl ? 'none' : '';
  el.biteCaughtImg.style.display = biteStampImageUrl ? 'block' : 'none';
  if (biteStampImageUrl) el.biteCaughtImg.src = biteStampImageUrl;

  idleFrameUrl = castFrameUrls[0] || null;
  if (idleFrameUrl) {
    el.charImg.src = idleFrameUrl;
    el.charImg.classList.remove('hidden');
    el.charFallback.classList.add('hidden');
  }

  // 아이템창 — 낚시 성공 후(물고기가 캐릭터에게 날아온 다음) 뜨는 팝업의
  // 배경/아이콘 위치·크기. dev/minigame-fishing/index.html의 "아이템창" 탭 설정.
  // 카드 종횡비(--item-ar)를 업로드한 배경 이미지의 실제 자연 크기로
  // 맞춰야 액자 그림이 잘리거나 늘어나지 않고 업로드한 그대로 보인다.
  const itemPopupBgAsset = itemPopupCfg.backgroundAssetId ? byId.get(itemPopupCfg.backgroundAssetId) : null;
  if (itemPopupBgAsset) {
    const itemBgUrl = (await preloadWithRetry(itemPopupBgAsset.dataUrl, 3, 500)).url;
    el.itemPopupCard.style.backgroundImage = `url(${itemBgUrl})`;
    el.itemPopupCard.classList.remove('item-popup-card--fallback');
    const itemBgDims = await new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
      img.onerror = () => resolve(null);
      img.src = itemBgUrl;
    });
    if (itemBgDims) el.itemPopupCard.style.setProperty('--item-ar', itemBgDims.w + '/' + itemBgDims.h);
  } else {
    el.itemPopupCard.style.backgroundImage = '';
    el.itemPopupCard.style.removeProperty('--item-ar');
    el.itemPopupCard.classList.add('item-popup-card--fallback');
  }
  itemIconPos = itemPopupCfg.iconPos || { x: 0.5, y: 0.36 };
  itemIconSizePx = itemPopupCfg.iconSizePx || 64;
  el.itemPopupIcon.style.left = (itemIconPos.x * 100) + '%';
  el.itemPopupIcon.style.top = (itemIconPos.y * 100) + '%';
  el.itemPopupIcon.style.width = itemIconSizePx + 'px';
  el.itemPopupIcon.style.height = itemIconSizePx + 'px';

  itemNamePos = itemPopupCfg.namePos || { x: 0.5, y: 0.66 };
  itemMetaPos = itemPopupCfg.metaPos || { x: 0.5, y: 0.8 };
  el.itemPopupName.style.left = (itemNamePos.x * 100) + '%';
  el.itemPopupName.style.top = (itemNamePos.y * 100) + '%';
  el.itemPopupName.style.fontSize = (itemPopupCfg.nameFontSizePx || 16) + 'px';
  el.itemPopupMeta.style.left = (itemMetaPos.x * 100) + '%';
  el.itemPopupMeta.style.top = (itemMetaPos.y * 100) + '%';
  el.itemPopupMeta.style.fontSize = (itemPopupCfg.metaFontSizePx || 12) + 'px';

  preloadFishIcons();

  // 대화 인트로 — 대화창/지수/영우 중 하나라도 배치돼 있으면 idle로 바로
  // 들어가는 대신 이 장면부터 보여준다(설정한 게 하나도 없으면 기존처럼
  // 곧장 idle). renderDialogueIntro가 실제로 뭔가 그렸을 때만 gameState를
  // 바꿔야, 오래된(빈) 설정을 가진 세션에서 화면이 검게 가려진 채 아무
  // 반응도 없는 상태로 남는 일이 없다.
  if (renderDialogueIntro(dialogueSceneCfg, byId)) {
    gameState = 'dialogue';
  }
}
function renderDialogueIntro(dialogueScene, byId) {
  el.dialogueIntro.innerHTML = '';
  const hasAnyLayer = DIALOGUE_INTRO_LAYERS.some(key => dialogueScene[key]);
  if (!hasAnyLayer) {
    el.dialogueIntro.classList.add('hidden');
    return false;
  }
  DIALOGUE_INTRO_LAYERS.forEach(key => {
    const data = dialogueScene[key];
    if (!data) return;
    const layerEl = document.createElement('div');
    layerEl.className = 'dialogue-intro-layer';
    layerEl.style.left = (data.x * 100) + '%';
    layerEl.style.top = (data.y * 100) + '%';
    layerEl.style.width = (data.w * 100) + '%';
    layerEl.style.height = (data.h * 100) + '%';
    const asset = data.assetId ? byId.get(data.assetId) : null;
    if (asset) {
      const img = document.createElement('img');
      img.src = asset.dataUrl;
      img.alt = '';
      layerEl.appendChild(img);
    }
    el.dialogueIntro.appendChild(layerEl);
  });
  el.dialogueIntro.classList.remove('hidden');
  return true;
}
el.dialogueIntro.addEventListener('pointerdown', (e) => {
  if (gameState !== 'dialogue') return;
  e.stopPropagation();
  el.dialogueIntro.classList.add('hidden');
  gameState = 'idle';
});

// 잡은 물고기 아이콘(overlayFishIcon)은 endRun에서 처음 그 fishId의
// background-position으로 그릴 때가 돼서야 브라우저가 그 위치를 실제로
// 디코드/페인트한다 — 시트 자체는 미리 받아놨어도(fishSheetDims 계산용
// new Image()) 첫 catch 때 화면에 "뜨는" 순간 눈에 띄게 느렸다(사용자 보고).
// 그래서 게임이 시작하기 전, 보이지 않는 곳에 67종 전부를 실제로 한 번씩
// 그려서 워밍업해둔다 — display:none은 브라우저가 페인트를 건너뛰어 워밍업
// 효과가 없으므로, 화면 밖(-9999px)에 두되 레이아웃/페인트는 정상적으로
// 일어나게 한다.
function preloadFishIcons() {
  if (!fishSheetUrl) return;
  let host = document.getElementById('fishIconPreload');
  if (!host) {
    host = document.createElement('div');
    host.id = 'fishIconPreload';
    host.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:0;height:0;overflow:hidden;pointer-events:none';
    host.setAttribute('aria-hidden', 'true');
    document.body.appendChild(host);
  }
  host.innerHTML = '';
  Object.values(fishDefs).forEach(fishDef => {
    const override = fishIconOverrides[fishDef.id];
    const style = (override && fishSheetDims)
      ? getFishCropStyle(override, fishSheetDims.width, fishSheetDims.height, 56)
      : getFishSlotStyle(fishDef.slot, 3.5);
    const div = document.createElement('div');
    div.style.cssText = `width:56px;height:56px;background-image:url('${fishSheetUrl}');background-position:${style.backgroundPosition};background-size:${style.backgroundSize};background-repeat:no-repeat`;
    host.appendChild(div);
  });
}

/* ===== 캐스팅/올리기 프레임 순차 재생 =====
   frameMs는 고정 ms 숫자(올리기) 또는 프레임별 ms 배열(캐스팅,
   castFrameDurations — 설정 화면 재생 타임라인에서 조정한 값)을 받는다.
   onFrame(i)는 선택 — 캐스팅 던지기(throwSinker 이전, releasePowerAndCast)만
   써서, 애니메이션이 진행되는 동안에도 매 프레임 낚싯대 끝 위치가 바뀌는
   대로 낚싯줄(현수선)을 다시 그린다. */
function playFrameSequence(urls, frameMs, onFrame) {
  return new Promise(resolve => {
    if (!urls.length) { resolve(); return; }
    el.charImg.classList.remove('hidden');
    el.charFallback.classList.add('hidden');
    let i = 0;
    function showAndScheduleNext() {
      el.charImg.src = urls[i];
      if (onFrame) onFrame(i);
      const ms = Array.isArray(frameMs) ? (frameMs[i] || 90) : frameMs;
      i++;
      setTimeout(i >= urls.length ? resolve : showAndScheduleNext, ms);
    }
    showAndScheduleNext();
  });
}

/* ===== 잡아채기(낚시바) 중 낚싯대 홀드/릴리즈 모션 =====
   캐치바를 올리는 낚시 버튼을 누르고 있는 동안 2번→4번(index 1→3)
   프레임을 순서대로 재생하고 4번에서 멈춰 유지한다. 손을 떼면 그 자리에서
   4번→2번→1번(index 3→1→0) 순서로 되감아 1번(대기 포즈)에서 멈춘다 —
   handleActionPointerDown/Release가 gameState==='catching'일 때 호출한다.
   재생 속도(프레임 간 간격)는 설정 화면 "낚시대 재생속도"(reelMotion.
   holdFrameMs)를 따른다. */
const REEL_HOLD_UP_SEQ = [1, 2, 3];
const REEL_HOLD_DOWN_SEQ = [3, 1, 0];
let reelHoldTimer = null;
function stopReelHoldAnim() {
  if (reelHoldTimer) { clearTimeout(reelHoldTimer); reelHoldTimer = null; }
}
function playReelHoldSeq(seq) {
  stopReelHoldAnim();
  if (reelFrameUrls.length < 4) return;
  el.charImg.classList.remove('hidden');
  el.charFallback.classList.add('hidden');
  let i = 0;
  function step() {
    el.charImg.src = reelFrameUrls[seq[i]];
    i++;
    reelHoldTimer = i < seq.length ? setTimeout(step, reelMotion.holdFrameMs) : null;
  }
  step();
}

/* ===== 캐스팅 모션 윈드업 — 홀드 시작하자마자 1→2번 프레임을 재생하고
   2번에서 멈춰 유지한다(놓을 때까지). 놓으면 releasePowerAndCast가
   3번 프레임부터 이어서 순차 재생한다. 프레임이 2장 미만이면 할 게 없다.
   castWindupFrameIndex는 지금 화면에 보이는 프레임 번호를 따로 기록해둔다
   — 손을 떼는 순간(releasePowerAndCast) 줄/추가 "이미 그 시점에 보이던
   낚싯대 끝"에서 생기게 하려면 항상 1번 프레임이 아니라 이 값을 origin
   계산에 써야 한다. */
let castWindupFrameIndex = 0;
function playCastWindup() {
  castWindupFrameIndex = 0;
  if (castFrameUrls.length < 2) return;
  el.charImg.classList.remove('hidden');
  el.charFallback.classList.add('hidden');
  el.charImg.src = castFrameUrls[0];
  const ms = Array.isArray(castFrameDurations) ? (castFrameDurations[0] || 90) : (castFrameDurations || 90);
  setTimeout(() => {
    if (gameState !== 'charging') return; // 그 사이 이미 놓였으면 덮어쓰지 않는다
    el.charImg.src = castFrameUrls[1];
    castWindupFrameIndex = 1;
  }, ms);
}

/* ===== 캐스팅 세기 조절 (누르고 있는 동안) ===== */
// 세기값 하나로 정해지는 단일 색(낮음=빨강 → 중간=노랑 → 높음=초록)을 계산한다.
// .cast-power-fill 안에서 색이 번지는 그라데이션이 아니라, 막대 전체가 그
// 순간의 세기에 맞는 색 한 가지로 칠해진다. alpha는 커스텀 게이지 모드에서
// 배경 그림이 비치도록 반투명(.55)을 줄 때 쓴다.
function powerToColor(power, alpha) {
  const p = Math.max(0, Math.min(100, power));
  const RED = [217, 65, 65], AMBER = [214, 168, 75], GREEN = [62, 207, 107];
  const [lo, hi, t] = p <= 50 ? [RED, AMBER, p / 50] : [AMBER, GREEN, (p - 50) / 50];
  const r = Math.round(lo[0] + (hi[0] - lo[0]) * t);
  const g = Math.round(lo[1] + (hi[1] - lo[1]) * t);
  const b = Math.round(lo[2] + (hi[2] - lo[2]) * t);
  return `rgba(${r},${g},${b},${alpha == null ? 1 : alpha})`;
}
function startPowerCharge() {
  gameState = 'charging';
  stopMoveHold();
  el.joystick.classList.add('hidden');
  el.castPowerWrap.classList.remove('hidden');
  playCastWindup();
  castChargeStartT = performance.now();
  const periodSec = CAST_POWER_PERIOD_MS / 1000;
  const isCustomGauge = el.castPowerWrap.classList.contains('custom-gauge');
  function tick(ts) {
    if (gameState !== 'charging') return;
    const t = (ts - castChargeStartT) / 1000;
    const phase = (t / periodSec) * (2 * Math.PI);
    castPower = 50 - 50 * Math.cos(phase); // 0 → 100 → 0 사인파
    el.castPowerFill.style.width = castPower + '%';
    el.castPowerFill.style.background = powerToColor(castPower, isCustomGauge ? 0.55 : 1);
    castChargeRaf = requestAnimationFrame(tick);
  }
  castChargeRaf = requestAnimationFrame(tick);
}

/* ===== 세기 확정 → 캐스팅 모션 → 추 던지기(물리) → 입질 대기 =====
   손을 떼는(release) 순간 낚싯줄을 바로 만든다 — origin은 그 순간 화면에
   이미 보이고 있던 윈드업 프레임(castWindupFrameIndex)의 낚싯대 끝이다.
   추 낙하 물리(throwSinker)는 release 즉시 시작한다 — 예전엔 남은
   팔로우스루 프레임(3~6번)이 다 재생될 때까지 기다린 뒤에야 물리를
   시작해서 "손을 떼도 한참 있다가 던져진다"는 체감 지연이 있었다.
   이제 팔로우스루 애니메이션과 추 낙하 물리를 동시에 진행하고, 낚싯줄의
   낚싯대 쪽 끝(rodTip)만 애니메이션 진행에 따라 계속 갱신한다(추 쪽
   끝은 throwSinker가 매 프레임 그린다) — 낚싯대를 따라 줄이 움직이는
   것처럼 보이면서도 추는 릴리즈 순간부터 바로 날아간다. */
async function releasePowerAndCast() {
  if (gameState !== 'charging') return;
  cancelAnimationFrame(castChargeRaf);
  const power = castPower;
  el.castPowerWrap.classList.add('hidden');
  gameState = 'casting';

  const frameRect = el.frame.getBoundingClientRect();
  el.castSvg.setAttribute('viewBox', `0 0 ${frameRect.width} ${frameRect.height}`);
  const origin = rodTipPxForFrame(castWindupFrameIndex, frameRect); // 뗄 때 이미 화면에 보이던 프레임의 낚싯대 끝 — 물리 시작점
  el.bobber.classList.add('hidden');
  el.castSvg.classList.remove('hidden');
  renderCastLine(origin, origin);
  vibrate(15);

  let rodTip = origin; // 팔로우스루 프레임이 재생되는 동안 계속 갱신 — throwSinker의 렌더 루프가 매 프레임 읽는다
  const animPromise = (async () => {
    if (castFrameUrls.length > 2) {
      // 1,2번은 윈드업(playCastWindup)에서 이미 재생했다 — 3번부터 이어서.
      // onFrame(i)의 i는 remainingUrls 기준(0부터 다시 셈)이라, 원래
      // 6프레임 인덱스를 기대하는 rodTipPxForFrame에는 +2해서 넘긴다.
      const remainingUrls = castFrameUrls.slice(2);
      const remainingDurations = Array.isArray(castFrameDurations) ? castFrameDurations.slice(2) : castFrameDurations;
      await playFrameSequence(remainingUrls, remainingDurations || 90, (i) => {
        rodTip = rodTipPxForFrame(i + 2, frameRect);
      });
    } else if (!castFrameUrls.length) {
      el.charFallback.style.transition = 'transform .35s ease';
      el.charFallback.style.transform = 'rotate(-25deg)';
      await wait(350);
      el.charFallback.style.transform = 'rotate(0deg)';
    }
  })();
  // 캐스팅이 끝난 뒤에도 el.charImg는 그대로 두면 캐스팅 마지막 프레임
  // 포즈에 머문다(playFrameSequence가 이미 그렇게 남겨둠) — idle로
  // 되돌리지 않아야 낚싯대 끝 위치가 대기/입질 내내 그 프레임 기준으로
  // 유지된다. idle 포즈로는 resetToIdle(새 판 시작)에서만 되돌아간다.
  const throwPromise = throwSinker(power, origin, frameRect, () => rodTip);
  const [, throwResult] = await Promise.all([animPromise, throwPromise]);
  if (throwResult.blocked) {
    // 추가 낚시가능 영역 안에 떨어지면 낚시가 진행되지 않는다 — 입질을
    // 기다리지 않고 바로 대기 상태로 되돌린다.
    el.bobber.classList.add('hidden');
    el.castSvg.classList.add('hidden');
    resetToIdle();
    return;
  }
  waitForBite();
}

// 낚싯대 끝 위치 — dev/minigame-fishing/index.html의 낚시대 끝 지정
// 도구에서 프레임별로 저장한 정규화 좌표(castingFrameRodTips, char-stage
// 박스 기준 0~1)를 실제 char-stage 박스 픽셀 크기에 곱해 el.frame 기준
// 픽셀 좌표로 바꾼다. 지정 안 한 프레임은 DEFAULT_ROD_TIP_FRAC로 폴백.
function rodTipPxForFrame(frameIndex, frameRect) {
  const charRect = el.charStage.getBoundingClientRect();
  const pt = castingFrameRodTips[frameIndex] || DEFAULT_ROD_TIP_FRAC;
  return {
    x: charRect.left - frameRect.left + pt.x * charRect.width,
    y: charRect.top - frameRect.top + pt.y * charRect.height,
  };
}

// 추를 던진다 — 수평은 등속(v_x = dx/T, dx는 세기(게이지)에 비례)으로
// x축을 따라 무조건 직진하고, 수직은 야구공을 던진 듯 살짝 떠올랐다가
// 떨어지는 포물선(v_y = vy0 + g·t, vy0<0=위로 발사)이다. 체공 시간(T)은
// 1m를 castPhysics.gravityMps2 중력가속도로 자유낙하할 때 걸리는 시간
// (설정 화면 '캐스팅 모션' 탭의 자유낙하 속도 슬라이더로 조절)으로 정하고,
// 그 T 안에 정확히 물 라인까지의 픽셀 거리(h0)만큼 떨어지도록 vy0/픽셀
// 중력(g)을 역산한다 — gravityMps2가 클수록 T가 짧아져(T=√(2H/g)) 더
// 빨리 떨어진다. dx(수평거리)는 세기(게이지)로 정해지는 기본값에
// castPhysics.vxScale(역시 슬라이더)을 곱해 늘리거나 줄인다 — 세기와
// 무관하게 항상 같은 체공 시간이 나오고, 세기는 수평거리(dx)만 늘린다
// ("세질수록 멀리 감"). ARC_STRENGTH는 얼마나 높이 떠올랐다가 떨어지는지
// (평균 낙하속도 h0/T 대비 초기 상승 속도의 비율) 조절하는 값 —
// dev/minigame-fishing/index.html의 추 이동 모션 테스트 도구는 이
// castPhysics 값과 별개로 자체 미리보기 상수를 쓴다. 착수 지점에 기존
// 찌(bobber)를 그대로 가져다 놓아 입질 대기 이후 로직은 손대지 않는다.
function throwSinker(power, origin, frameRect, getRodTip) {
  return new Promise(resolve => {
    const minDx = frameRect.width * 0.10, maxDx = frameRect.width * 0.68;
    const baseDx = minDx + (power / 100) * (maxDx - minDx);
    const dx = baseDx * (castPhysics.vxScale || 1);
    // 착지선(waterY)은 화면 절대 위치(47%) 대신 캐릭터가 서 있는 줄(발 밑,
    // char-stage 아래쪽 끝)에 맞춘다 — 화면 고정 비율로는 캐릭터 위치와
    // 무관하게 항상 같은 높이라, 캐릭터가 화면 아래쪽에 있을 때 추가
    // 캐릭터보다 한참 위에 떠 보이는 문제가 있었다.
    const charRect = el.charStage.getBoundingClientRect();
    const waterY = charRect.bottom - frameRect.top;
    const h0 = Math.max(10, waterY - origin.y);
    const FREE_FALL_HEIGHT_M = 1;
    const gravityMps2 = castPhysics.gravityMps2 || 9.8;
    const ARC_STRENGTH = 1.0;
    const T = Math.sqrt(2 * FREE_FALL_HEIGHT_M / gravityMps2);
    const vy0 = -ARC_STRENGTH * (h0 / T);
    const g = 2 * (h0 - vy0 * T) / (T * T);
    const vx0 = dx / T;

    let start = null;
    function frame(ts) {
      if (start === null) start = ts;
      const t = (ts - start) / 1000;
      if (t >= T) { finish(dx); return; }
      const x = origin.x + vx0 * t;
      const y = origin.y + vy0 * t + 0.5 * g * t * t;
      // 낚싯줄의 낚싯대 쪽 끝은 물리 시작점(origin)에 고정하지 않고, 아직
      // 재생 중인 팔로우스루 애니메이션의 현재 프레임 낚싯대 끝을 따라간다
      // (releasePowerAndCast가 넘겨준 getRodTip) — 던지기는 release 즉시
      // 시작하지만, 손 위치는 애니메이션이 끝날 때까지 계속 움직이므로.
      renderCastLine(getRodTip ? getRodTip() : origin, { x, y });
      castFlightRaf = requestAnimationFrame(frame);
    }
    function finish(finalDx) {
      // 착수해도 castSvg(낚싯줄)는 숨기지 않는다 — 추가 물에 떠 있는 동안
      // (입질 대기 내내) 낚싯대와 추가 계속 줄로 이어져 보여야 한다.
      // handleReactionTap(입질 물어서 잡아채기로 넘어갈 때)과
      // abortWaitingReel/missReaction/resetToIdle(대기 중단·실패·리셋)에서
      // 각자 자기 타이밍에 숨긴다.
      renderCastLine(getRodTip ? getRodTip() : origin, { x: origin.x + finalDx, y: waterY });
      const landingXPct = clamp((origin.x + finalDx) / frameRect.width * 100, 5, 95);
      const landingYPct = waterY / frameRect.height * 100;
      el.bobber.style.transition = 'none';
      el.bobber.style.left = landingXPct + '%';
      el.bobber.style.top = landingYPct + '%';
      el.bobber.classList.remove('hidden');
      // syncLineToBobber는 여기서 바로 부르지 않는다 — 이 시점엔 아직
      // gameState가 'casting'이라(waitForBite가 releasePowerAndCast의
      // Promise.all이 끝난 뒤에야 'waiting'으로 바꾼다) 루프 첫 tick이
      // "대기 중 아님"으로 보고 즉시 멈춰버린다. 낚싯대 끝 좌표만 남겨두고
      // 루프 시작은 waitForBite로 미룬다.
      lastRodTipPt = getRodTip ? getRodTip() : origin;
      // 낚시가능 영역 판정은 캐릭터가 아니라 추가 실제로 착수한 지점
      // 기준이다 — 그 지점이 fishableAreas 안이면 낚시가 진행되지 않는다
      // (호출부 releasePowerAndCast가 blocked를 보고 waitForBite 대신
      // 바로 idle로 되돌린다).
      const landingFrac = framePxToImageFrac(origin.x + finalDx, waterY);
      const blocked = fishableAreas.length > 0 && isInsideAnyArea(landingFrac, fishableAreas);
      resolve({ blocked });
    }
    castFlightRaf = requestAnimationFrame(frame);
  });
}

// 낚싯대 끝(p0)~추(p1) 사이를 현수선(catenary, y=a·cosh(x/a)=a·(e^(x/a)+e^(-x/a))/2)
// 으로 그린다. 실제 줄 길이는 두 점 사이 직선거리(D)에 여유(12%)를 준
// 값(L)으로 정하고, L·dx·dy로부터 현수선 매개변수 a를 이분법으로 구한다
// (전형적인 "두 점을 지나는 현수선" 문제).
const SINKER_IMG_SIZE = 22; // px, css픽셀 = svg viewBox 단위(카메라 좌표계 그대로)
function renderCastLine(p0, p1) {
  el.castSinker.setAttribute('cx', p1.x);
  el.castSinker.setAttribute('cy', p1.y);
  if (sinkerImageUrl) {
    el.castSinkerImg.setAttribute('x', p1.x - SINKER_IMG_SIZE / 2);
    el.castSinkerImg.setAttribute('y', p1.y - SINKER_IMG_SIZE / 2);
    el.castSinkerImg.setAttribute('width', SINKER_IMG_SIZE);
    el.castSinkerImg.setAttribute('height', SINKER_IMG_SIZE);
  }
  const pts = catenaryPoints(p0, p1);
  el.castLinePath.setAttribute('d', 'M' + pts.map(p => `${p.x},${p.y}`).join(' L'));
}

function catenaryPoints(p0, p1, samples) {
  samples = samples || 16;
  const dx = p1.x - p0.x, dy = p1.y - p0.y; // 화면 좌표계 — 아래로 갈수록 y가 커진다
  const D = Math.hypot(dx, dy);
  if (D < 4 || Math.abs(dx) < 2) return [p0, p1]; // 거의 수직/한 점 — 커브 의미 없음
  const L = D * 1.12;
  // y=a·cosh(x/a)+q는 항상 볼록(가운데가 "더 작은" y 쪽으로 처지는) 함수라,
  // 위로 갈수록 y가 커지는 보통의 수학 좌표계에서는 그 처지는 방향이
  // 곧 "아래"라 정확히 늘어진 케이블 모양이 된다. 그런데 여긴 화면
  // 좌표계(아래로 갈수록 y가 커짐)라 dy를 그대로 쓰면 케이블이 화면에서
  // 위로(작은 y) 볼록하게 그려진다 — 다리 아치처럼. dy 부호를 뒤집은
  // mathDy로 풀고, 마지막에 다시 부호를 뒤집어(p0.y - ylMath) 화면
  // 좌표로 되돌린다.
  const mathDy = -dy;
  const target = Math.sqrt(Math.max(L * L - mathDy * mathDy, 0));
  // f(a) = a로 정해지는 케이블 길이 - 목표 길이(target). a가 작을수록
  // 더 팽팽히 휘어 길이가 길어지므로 f는 a에 대해 단조 감소한다 —
  // f(mid)>0(길이 초과)이면 a를 늘려야 하니 lo를 올린다.
  function f(a) { return 2 * a * Math.sinh(dx / (2 * a)) - target; }
  let lo = 1e-3, hi = Math.max(Math.abs(dx), 1) * 50;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (f(mid) > 0) lo = mid; else hi = mid;
  }
  const a = (lo + hi) / 2;
  const p = (dx - a * Math.log((L + mathDy) / (L - mathDy))) / 2;
  const q = -a * Math.cosh(p / a);
  const pts = [];
  for (let i = 0; i <= samples; i++) {
    const xl = dx * i / samples;
    const ylMath = a * Math.cosh((xl - p) / a) + q;
    pts.push({ x: p0.x + xl, y: p0.y - ylMath });
  }
  return pts;
}

// 착수 후(입질 대기 중~입질) el.bobber는 CSS 애니메이션(bob-idle/bite-dip)으로
// 위아래로 움직이는데, renderCastLine은 착수 순간의 좌표에 한 번만 그려두고
// 끝이라 줄(castSvg)이 그 자리에 고정된 채 추만 애니메이션으로 까닥거려서
// 줄과 추가 따로 노는 것처럼 보였다. gameState가 waiting/bite인 동안 매
// 프레임 el.bobber(정확히는 실제 보이는 도트/이미지)의 현재 화면 위치를
// 읽어 줄 끝(p1)을 거기 맞춰 다시 그린다 — CSS 키프레임 수치를 그대로
// 베끼는 대신 실제 렌더된 위치를 읽으므로 애니메이션이 바뀌어도 항상 맞다.
function syncLineToBobber(rodTipPt) {
  cancelAnimationFrame(bobLineRaf);
  function tick() {
    if (gameState !== 'waiting' && gameState !== 'bite') { bobLineRaf = null; return; }
    const frameRect = el.frame.getBoundingClientRect();
    const sinkerEl = sinkerImageUrl ? el.bobberImg : el.bobberDot;
    const rect = sinkerEl.getBoundingClientRect();
    renderCastLine(rodTipPt, {
      x: rect.left + rect.width / 2 - frameRect.left,
      y: rect.top + rect.height / 2 - frameRect.top,
    });
    bobLineRaf = requestAnimationFrame(tick);
  }
  tick();
}

function waitForBite() {
  gameState = 'waiting'; // syncLineToBobber보다 먼저 바뀌어 있어야 루프 첫 tick이 안 죽는다
  el.bobber.classList.add('bob-idle');
  syncLineToBobber(lastRodTipPt);
  const delay = BITE_WAIT_MIN_MS + Math.random() * (BITE_WAIT_MAX_MS - BITE_WAIT_MIN_MS);
  biteTimer = setTimeout(triggerBite, delay);
}

function triggerBite() {
  if (gameState !== 'waiting') return;
  gameState = 'bite';
  el.bobber.classList.remove('bob-idle');
  el.bobber.classList.add('bite-dip');
  el.biteMark.classList.remove('hidden');
  vibrate([0, 60, 40, 60]);
  reactionTimer = setTimeout(missReaction, DIFF_TUNING[DIFFICULTY].reactionWindow);
}

function handleReactionTap() {
  if (gameState !== 'bite') return;
  clearTimeout(reactionTimer);
  cancelAnimationFrame(bobLineRaf);
  gameState = 'caught'; // "물었다!" 연출이 끝날 때까지 다른 입력을 막는 과도 상태
  el.biteMark.classList.add('hidden');
  el.bobber.classList.add('hidden');
  el.bobber.classList.remove('bite-dip');
  el.castSvg.classList.add('hidden'); // 낚시바(잡아채기)로 넘어가면 추/찌 자체가 안 보이니 줄도 같이 숨긴다
  playBiteCaughtAnimation().then(startCatching);
}

// "물었다!" 표시 — 왼쪽 위를 고정점으로 커졌다(120%) 작아지는(0%) 등가속
// 운동. size(t) = 100 + v0*t + 0.5*a*t^2, v0>0(커지는 방향)·a<0(감속) —
// 던지기 물리(throwSinker)와 같은 방식으로, 정점에 닿는 시각(T_PEAK)만
// 정해두면 v0·a가 정해지고, 그 뒤 size가 다시 0에 닿는 시각(T)은 같은
// 공식의 다른 근으로 구한다(포물선이 정점을 지나 출발선 아래까지 내려가는
// 것과 같은 모양 — 여기선 "높이" 대신 "크기(%)"가 오르내린다).
const BITE_CAUGHT_PEAK_SCALE = 120; // %
const BITE_CAUGHT_START_SCALE = 100; // %
const BITE_CAUGHT_T_PEAK = 0.22; // 초 — 120%까지 커지는 데 걸리는 시간
function playBiteCaughtAnimation() {
  return new Promise(resolve => {
    const v0 = 2 * (BITE_CAUGHT_PEAK_SCALE - BITE_CAUGHT_START_SCALE) / BITE_CAUGHT_T_PEAK;
    const a = -v0 / BITE_CAUGHT_T_PEAK;
    // size(T) = 0의 두 근 중 정점(T_PEAK) 이후에 오는 큰 쪽을 취한다.
    const T = (-v0 - Math.sqrt(v0 * v0 - 2 * a * BITE_CAUGHT_START_SCALE)) / a;
    el.biteCaught.style.transform = `scale(${BITE_CAUGHT_START_SCALE / 100 * layoutPrefs.casting.scale})`;
    el.biteCaught.classList.remove('hidden');
    let start = null;
    function frame(ts) {
      if (start === null) start = ts;
      const t = (ts - start) / 1000;
      if (t >= T) { finish(); return; }
      const scale = BITE_CAUGHT_START_SCALE + v0 * t + 0.5 * a * t * t;
      el.biteCaught.style.transform = `scale(${Math.max(scale, 0) / 100 * layoutPrefs.casting.scale})`;
      requestAnimationFrame(frame);
    }
    function finish() {
      el.biteCaught.classList.add('hidden');
      resolve();
    }
    requestAnimationFrame(frame);
  });
}

function missReaction() {
  if (gameState !== 'bite') return;
  el.biteMark.classList.add('hidden');
  el.bobber.classList.add('hidden');
  el.castSvg.classList.add('hidden');
  resetToIdle(); // 실패 — 화면 전환 없이 그냥 대기 상태로 돌아간다
}

// 입질 대기 중(waiting) 화면을 다시 탭하면 입질을 기다리지 않고 바로
// 릴을 감아 올린다 — 당연히 아무것도 안 걸려 있으니 빈손으로 끝난다.
// playReelThenResult(성공 시 릴 감기)와 같은 올리기 프레임을 재생하되
// 물고기가 없으니 flyFishToCharacter/showItemPopup 없이 곧장 대기로
// 돌아간다.
async function abortWaitingReel() {
  if (gameState !== 'waiting') return;
  clearTimeout(biteTimer);
  gameState = 'reeling';
  cancelAnimationFrame(bobLineRaf);
  el.bobber.classList.remove('bob-idle');
  el.bobber.classList.add('hidden');
  el.castSvg.classList.add('hidden');
  if (reelFrameUrls.length) {
    await playFrameSequence(reelFrameUrls, 90);
  } else {
    await wait(300);
  }
  resetToIdle();
}

/* ===== 낚시바(잡아채기) ===== */
function startCatching() {
  gameState = 'catching';
  el.fishbarPanel.classList.remove('hidden');
  fish = { y: 100, vy: -DIFF_TUNING[DIFFICULTY].fishSpeedMult * 34, targetY: 100, pickTimer: 0 };
  zone = { y: 100 - zoneSizePct, vel: 0 };
  progress = 30;
  holding = false;
  // 낚시대가 나타난 시점 — 올리기 1번 프레임(대기 포즈)으로 시작한다.
  stopReelHoldAnim();
  if (reelFrameUrls.length) {
    el.charImg.classList.remove('hidden');
    el.charFallback.classList.add('hidden');
    el.charImg.src = reelFrameUrls[0];
  }
  pendingCatchFish = pickCaughtFish();
  // 아이템창을 화면 밖(left:-9999px)에서 이 시점에 미리 채워둬서, 실제
  // 공개(showItemPopup) 순간엔 위치만 옮기면 되게 한다 — populateItemPopup
  // 주석 참고.
  populateItemPopup(pendingCatchFish);
  lastT = performance.now();
  raf = requestAnimationFrame(catchTick);
}

function updateFish(dt) {
  const tuning = DIFF_TUNING[DIFFICULTY];
  if (MOTION_TYPE === 'linear') {
    fish.y += fish.vy * dt;
    if (fish.y <= 0) { fish.y = 0; fish.vy = Math.abs(fish.vy); }
    if (fish.y >= 100) { fish.y = 100; fish.vy = -Math.abs(fish.vy); }
    return;
  }
  fish.pickTimer -= dt;
  if (fish.pickTimer <= 0) {
    if (MOTION_TYPE === 'zigzag') {
      fish.targetY = clamp(fish.y + (Math.random() * 70 - 35), 4, 96);
      fish.pickTimer = 0.22 + Math.random() * 0.32;
    } else { // random
      fish.targetY = Math.random() * 92 + 4;
      fish.pickTimer = 0.6 + Math.random() * 0.8;
    }
  }
  // 목표 지점까지 등속 직선(딱딱하게 스냅되는 느낌)으로 움직이는 대신,
  // 지수 감쇠 스무딩으로 미끄러지듯 다가간다 — 가까워질수록 느려지고,
  // 새 목표가 잡혀 방향이 바뀌어도 순간적으로 꺾이지 않고 자연스럽게
  // 이어진다. k는 프레임레이트 무관하게(dt 기반) 매 프레임 남은 거리의
  // 몇 %를 좁힐지 정하는 감쇠율이다.
  const smoothRate = (MOTION_TYPE === 'zigzag' ? 8 : 4) * tuning.fishSpeedMult;
  const k = 1 - Math.exp(-smoothRate * dt);
  fish.y += (fish.targetY - fish.y) * k;
}

function updateZone(dt) {
  const RISE_ACCEL = 230, GRAVITY = 190, MAX_SPEED = 140;
  const BOUNCE_DAMPING = 0.6; // 농구공처럼 튈 때마다 속도를 이만큼만 남겨 점점 잦아든다
  zone.vel += (holding ? -RISE_ACCEL : GRAVITY) * dt;
  zone.vel = clamp(zone.vel, -MAX_SPEED, MAX_SPEED);
  zone.y += zone.vel * dt;
  const maxY = 100 - zoneSizePct;
  // 멈춰서는 대신 반대 방향으로 튕겨낸다 — 위(천장, y<=0)에 닿으면 아래로,
  // 아래(바닥, y>=maxY)에 닿으면 위로 되돌아간다.
  if (zone.y <= 0) { zone.y = 0; zone.vel = Math.abs(zone.vel) * BOUNCE_DAMPING; }
  if (zone.y >= maxY) { zone.y = maxY; zone.vel = -Math.abs(zone.vel) * BOUNCE_DAMPING; }
}

function updateProgress(dt) {
  const tuning = DIFF_TUNING[DIFFICULTY];
  const inZone = fish.y >= zone.y && fish.y <= zone.y + zoneSizePct;
  progress += (inZone ? tuning.fillRate : -tuning.drainRate) * dt;
  progress = clamp(progress, 0, 100);
}

function renderBarFrame() {
  el.fishbarFish.style.top = fishTrack ? (fishTrack.y + fish.y / 100 * fishTrack.h) + '%' : fish.y + '%';
  el.fishbarZone.style.top = zoneTrack ? (zoneTrack.y + zone.y / 100 * zoneTrack.h) + '%' : zone.y + '%';
  el.fishbarGaugeMask.style.height = (100 - progress) + '%';
  // 게이지 채움 이미지를 올렸으면 그 이미지를 그대로 두고, 없을 때만
  // 기존처럼 진행도에 따라 색을 다시 칠한다.
  if (!gaugeImageUrl) el.fishbarGauge.style.background = gaugeColorForProgress(progress);
}

function catchTick(ts) {
  if (gameState !== 'catching') return;
  const dt = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;
  updateFish(dt);
  updateZone(dt);
  updateProgress(dt);
  renderBarFrame();
  if (progress >= 100) { endCatch(true); return; }
  if (progress <= 0) { endCatch(false); return; }
  raf = requestAnimationFrame(catchTick);
}

function endCatch(success) {
  if (raf) cancelAnimationFrame(raf);
  raf = null;
  stopReelHoldAnim(); // 홀드/릴리즈 되감기 도중이었어도 결과 연출(5·6번 프레임)이 덮어쓴다
  el.fishbarPanel.classList.add('hidden');
  if (success) playReelThenResult(); else resetToIdle(); // 실패 — 화면 전환 없이 그냥 대기 상태로 돌아간다
}

// 잡힌 물고기 종을 고른다 — fishDefs의 catchRate가 하나라도 채워져 있으면(합이
// 0보다 크면) 그 값을 가중치로 쓰고, 전부 0(§업로드 시점의 플레이스홀더 값)이면
// difficulty가 낮을수록 잘 잡히도록 난이도 제곱의 역수를 가중치로 대신 쓴다.
function pickCaughtFish() {
  const all = Object.values(fishDefs);
  const totalRate = all.reduce((sum, f) => sum + (f.catchRate || 0), 0);
  const weightOf = totalRate > 0 ? (f => f.catchRate || 0) : (f => 1 / (f.difficulty * f.difficulty));
  const weights = all.map(weightOf);
  const totalWeight = weights.reduce((sum, w) => sum + w, 0);
  let r = Math.random() * totalWeight;
  for (let i = 0; i < all.length; i++) {
    r -= weights[i];
    if (r <= 0) return all[i];
  }
  return all[all.length - 1];
}

async function playReelThenResult() {
  gameState = 'reeling';
  // 물고기가 딸려 올라오는 동안(flyFishToCharacter가 실제로 날아가는
  // 연출을 재생) — 올리기 5번 프레임. 도착하면 flyFishToCharacter가 직접
  // 6번 프레임으로 바꾼다.
  if (reelFrameUrls.length > 4) {
    el.charImg.classList.remove('hidden');
    el.charFallback.classList.add('hidden');
    el.charImg.src = reelFrameUrls[4];
  } else {
    await wait(500);
  }
  caughtCount++;
  el.countChip.textContent = caughtCount + '마리';
  const fishCaught = pendingCatchFish;
  // 아이템창 내용(populateItemPopup)은 startCatching 때 이미 화면 밖에서
  // 다 그려놨으니 지연 없이 뜰 준비는 끝났지만, 뜨는 시점 자체는 물고기가
  // 캐릭터에 실제로 도착한 다음이어야 자연스럽다(사용자 요청) — 그래서
  // flyFishToCharacter가 끝날 때까지 기다렸다가 showItemPopup을 부른다.
  await flyFishToCharacter(fishCaught);
  showItemPopup(fishCaught);
}

/* ===== 물고기 날아오기 연출 =====
   추(찌)가 마지막으로 착수했던 자리(el.bobber의 현재 left/top — throwSinker의
   finish에서 남겨둔 값)에서 캐릭터(el.charStage) 쪽으로 물고기 아이콘이
   크기 변화 없이 포물선을 그리며 천천히 날아든다(요청: 크기는 그대로,
   좀 더 느리게, 정점이 캐릭터 위치보다 위로 떠도 됨) — CSS transition
   대신 매 프레임 위치를 직접 계산해서 그린다(throwSinker의 추 궤적과
   같은 방식). 임시 엘리먼트(.fish-fly)를 만들어 el.stage에 얹고, 도착하면
   지운다. */
const FISH_FLY_DURATION_MS = 1600;
const FISH_FLY_ARC_PCT = 18; // 포물선 정점이 시작~도착 직선보다 이만큼(프레임 세로 %) 더 위로 뜬다
function flyFishToCharacter(fishDef) {
  return new Promise(resolve => {
    const frameRect = el.frame.getBoundingClientRect();
    const startLeft = parseFloat(el.bobber.style.left) || 26;
    const startTop = parseFloat(el.bobber.style.top) || 64;
    const charRect = el.charStage.getBoundingClientRect();
    const endLeft = ((charRect.left + charRect.width / 2) - frameRect.left) / frameRect.width * 100;
    const endTop = ((charRect.top + charRect.height * 0.3) - frameRect.top) / frameRect.height * 100;

    const flyEl = document.createElement('div');
    flyEl.className = 'fish-fly';
    if (fishSheetUrl) {
      const override = fishIconOverrides[fishDef.id];
      const style = (override && fishSheetDims)
        ? getFishCropStyle(override, fishSheetDims.width, fishSheetDims.height, 44)
        : getFishSlotStyle(fishDef.slot, 3.5);
      flyEl.style.backgroundImage = `url('${fishSheetUrl}')`;
      flyEl.style.backgroundPosition = style.backgroundPosition;
      flyEl.style.backgroundSize = style.backgroundSize;
    } else {
      flyEl.textContent = '🐟';
    }
    // 설정 화면 물고기 목록과 같은 좌우반전 — 스프라이트시트 크롭(실제
    // 사진)일 때만 뒤집는다. 크기는 날아가는 내내 안 바뀌니 이 transform도
    // 끝까지 고정값이라 애니메이션되지 않는다.
    const flipX = fishSheetUrl ? -1 : 1;
    flyEl.style.transform = `translate(-50%,-50%) scale(${flipX * layoutPrefs.casting.scale},${layoutPrefs.casting.scale})`;
    flyEl.style.left = startLeft + '%';
    flyEl.style.top = startTop + '%';
    el.stage.appendChild(flyEl);
    vibrate(20);

    let start = null;
    function frame(ts) {
      if (start === null) start = ts;
      const t = Math.min((ts - start) / FISH_FLY_DURATION_MS, 1);
      // 4·t·(1-t)는 t=0.5에서 정점(1)을 찍는 포물선 모양이라, 직선 보간에서
      // 이 값만큼 위로(화면 좌표는 위로 갈수록 top%가 작아지므로 빼준다)
      // 띄우면 시작~도착 어느 쪽 y와 비교해도 위로 볼록한 아치가 된다.
      const left = startLeft + (endLeft - startLeft) * t;
      const top = startTop + (endTop - startTop) * t - FISH_FLY_ARC_PCT * 4 * t * (1 - t);
      flyEl.style.left = left + '%';
      flyEl.style.top = top + '%';
      if (t < 1) { requestAnimationFrame(frame); return; }
      flyEl.remove();
      // 물고기가 캐릭터에 도착한 순간 — 올리기 6번(마지막) 프레임, 물고기를
      // 들고 있는 자세(heldFish 오버레이가 이 프레임 위에 그려진다).
      if (reelFrameUrls.length > 5) el.charImg.src = reelFrameUrls[5];
      resolve();
    }
    requestAnimationFrame(frame);
  });
}

/* ===== 아이템창 =====
   실패 시엔 아무 화면도 없이 그냥 대기로 돌아가고(missReaction/endCatch
   참고), 성공해서 물고기가 캐릭터에게 도착한 다음에만 이 팝업이 뜬다.
   배경/아이콘 위치·크기는 dev/minigame-fishing/index.html의 "아이템창" 탭
   (itemPopup config, loadConfig에서 el.itemPopupCard/el.itemPopupIcon에
   이미 적용해둔 상태)을 그대로 쓴다. */
// 아이템창 카드 폭 — .item-popup-card의 고정 width(220px, CSS)와 맞춰야
// 한다. 카드가 화면 밖으로 나가지 않도록 캐릭터 중심에 맞추되 좌우
// ITEM_POPUP_MARGIN 안쪽으로 clamp한다(캐릭터가 화면 가장자리에 가까워도
// 안전 — % 기반 위치만 쓰면 캐릭터가 가장자리에 있을 때 카드가 화면
// 밖으로 잘려 나간다). el.itemPopup(래퍼)은 아직 화면 밖(left:-9999px)에
// 있을 때라도 left/bottom을 미리 계산해 넣을 수 있다 — 실제 크기(220px)는
// CSS 고정값이라 레이아웃 측정 없이 상수로 계산 가능.
const ITEM_POPUP_CARD_WIDTH = 220;
const ITEM_POPUP_GAP = 14;
const ITEM_POPUP_MARGIN = 12;
function positionItemPopupAboveCharacter() {
  const frameRect = el.frame.getBoundingClientRect();
  const charRect = el.charStage.getBoundingClientRect();
  const half = ITEM_POPUP_CARD_WIDTH / 2;
  const charCenterX = charRect.left - frameRect.left + charRect.width / 2;
  const clampedCenterX = clamp(charCenterX, ITEM_POPUP_MARGIN + half, frameRect.width - ITEM_POPUP_MARGIN - half);
  const bottomPx = frameRect.bottom - charRect.top + ITEM_POPUP_GAP;
  el.itemPopup.style.left = clampedCenterX + 'px';
  el.itemPopup.style.bottom = bottomPx + 'px';
  el.itemPopup.style.transform = `translateX(-50%) scale(${layoutPrefs.casting.scale})`;
}

// 카드 배경/이름/등급·가치/아이콘을 채운다 — showItemPopup(실제 공개
// 순간)뿐 아니라 startCatching(어떤 물고기가 걸릴지 정해지자마자, 잡아채기
// 미니게임 + 릴 감기 + 날아오기 연출까지 몇 초의 여유가 있을 때)에서도
// 미리 호출해 화면 밖(.item-popup의 기본 left:-9999px)에서 이미 디코드/
// 페인트가 끝나 있게 한다 — showItemPopup은 그 뒤 위치만 화면 안으로
// 옮기면 되니 그 순간엔 새로 그릴 게 없어 지연이 없다.
function populateItemPopup(fishCaught) {
  el.itemPopupName.textContent = fishCaught.name;
  el.itemPopupName.style.color = GRADE_NAME_COLORS[fishCaught.grade] || '#000';
  el.itemPopupMeta.textContent = `${fishCaught.grade} · ${fishCaught.value}P`;
  if (fishSheetUrl) {
    const override = fishIconOverrides[fishCaught.id];
    const style = (override && fishSheetDims)
      ? getFishCropStyle(override, fishSheetDims.width, fishSheetDims.height, itemIconSizePx)
      : getFishSlotStyle(fishCaught.slot, 3.5);
    el.itemPopupIcon.style.backgroundImage = `url('${fishSheetUrl}')`;
    el.itemPopupIcon.style.backgroundPosition = style.backgroundPosition;
    el.itemPopupIcon.style.backgroundSize = style.backgroundSize;
    // 설정 화면 물고기 목록과 같은 좌우반전 — translate(-50%,-50%)는
    // CSS(.item-popup-icon)가 아니라 여기서 인라인으로 같이 넣어줘야 한다.
    // scaleX(-1)만 인라인으로 넣으면 그 자체가 transform 전체를 덮어써서
    // CSS의 translate(-50%,-50%) 중심정렬이 사라져(아이콘이 지정 위치에서
    // 오른쪽 아래로 반 칸 밀려 보임) 버린다.
    el.itemPopupIcon.style.transform = 'translate(-50%,-50%) scaleX(-1)';
    el.itemPopupIcon.textContent = '';
  } else {
    el.itemPopupIcon.style.backgroundImage = 'none';
    el.itemPopupIcon.style.transform = 'translate(-50%,-50%)';
    el.itemPopupIcon.textContent = '🐟';
  }
}

// 캐릭터가 물고기를 들고 있는 자세(올리기 마지막 프레임 — playFrameSequence가
// el.charImg를 이미 그 프레임에 남겨둔 상태) 위에 잡은 물고기 아이콘을
// heldFishPos 자리에 겹쳐 그린다. 아이템창(showItemPopup)과 같은 타이밍에
// 뜨고, resetToIdle에서 같이 사라진다.
function showHeldFish(fishCaught) {
  el.heldFish.style.left = (heldFishPos.x * 100) + '%';
  el.heldFish.style.top = (heldFishPos.y * 100) + '%';
  if (fishSheetUrl) {
    const override = fishIconOverrides[fishCaught.id];
    const style = (override && fishSheetDims)
      ? getFishCropStyle(override, fishSheetDims.width, fishSheetDims.height, 40)
      : getFishSlotStyle(fishCaught.slot, 3.5);
    el.heldFish.style.backgroundImage = `url('${fishSheetUrl}')`;
    el.heldFish.style.backgroundPosition = style.backgroundPosition;
    el.heldFish.style.backgroundSize = style.backgroundSize;
    el.heldFish.textContent = '';
  } else {
    el.heldFish.style.backgroundImage = 'none';
    el.heldFish.textContent = '🐟';
  }
  el.heldFish.classList.remove('hidden');
}

function showItemPopup(fishCaught) {
  gameState = 'popup';
  populateItemPopup(fishCaught);
  positionItemPopupAboveCharacter();
  showHeldFish(fishCaught);
}

/* ===== 리셋 ===== */
function resetToIdle() {
  el.itemPopup.style.left = '-9999px';
  gameState = 'idle';
  stopReelHoldAnim();
  cancelAnimationFrame(bobLineRaf);
  el.castPowerWrap.classList.add('hidden');
  el.castSvg.classList.add('hidden');
  el.bobber.classList.add('hidden');
  el.bobber.classList.remove('bob-idle', 'bite-dip');
  el.biteCaught.classList.add('hidden');
  el.heldFish.classList.add('hidden');
  el.joystick.classList.remove('hidden');
  if (idleFrameUrl) { el.charImg.src = idleFrameUrl; el.charImg.classList.remove('hidden'); el.charFallback.classList.add('hidden'); }
  else { el.charImg.classList.add('hidden'); el.charFallback.classList.remove('hidden'); }
}

/* ===== 이동 — 격자 스냅 없이 조이스틱을 누르고 있는 동안
   requestAnimationFrame으로 매 프레임 위치를 갱신하는 연속 이동이다.
   속도는 walkMotion.stepMs(설정 화면 "이동 속도" 슬라이더 — "타일 한 칸
   (MOVE_STEP_PX)을 이동하는 데 걸리는 시간"으로 해석)를 px/ms로 환산해
   쓴다. moveHoldVec의 dx/dy는 실제 "위치" 이동 벡터로, 대각선 드래그면
   둘 다 0이 아닐 수 있다(대각선 이동 그대로 허용) — 이때 두 축을 동시에
   같은 속도로 움직이면 대각선이 더 빨라지므로 1/√2로 보정한다. 반면
   걷기 "애니메이션" 방향(좌/우/상/하 스프라이트, spriteDir)은 이동
   벡터와 분리된 값으로 호출자(조이스틱 입력)가 축 고정해서 넘겨준다 —
   같은 방향이 계속 재생 중이면 다시 트리거하지 않는다(applyMoveSprite).
   걷기 프레임은 이동 중엔 계속 순환하고(moveAnimTimer), 멈추면 idle
   프레임으로 되돌아간다. ===== */
function moveSpeedPxPerMs() { return MOVE_STEP_PX / Math.max(1, walkMotion.stepMs); }
function stopMoveAnim() {
  if (moveAnimTimer) { clearInterval(moveAnimTimer); moveAnimTimer = null; }
}
function spriteDirFor(dx, dy) {
  return dx !== 0 ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'up' : 'down');
}
function playMoveAnim(spriteDir) {
  stopMoveAnim();
  const frames = walkFrameUrls[spriteDir];
  if (!frames || !frames.length) return; // 방향 시트가 없으면 그림은 그대로 두고 위치만 바뀐다
  let i = 0;
  el.charImg.src = frames[i];
  el.charImg.classList.remove('hidden');
  el.charFallback.classList.add('hidden');
  if (frames.length <= 1) return;
  moveAnimTimer = setInterval(() => {
    i = (i + 1) % frames.length;
    el.charImg.src = frames[i];
  }, walkMotion.animFrameMs);
}
let currentSpriteDir = null; // 지금 재생 중인 걷기 방향 — 실제로 바뀔 때만 playMoveAnim을 다시 걸어서 프레임이 튀지 않게 한다
function applyMoveSprite(spriteDir) {
  if (!spriteDir || spriteDir === currentSpriteDir) return;
  currentSpriteDir = spriteDir;
  playMoveAnim(spriteDir);
}
// 이동 불가 영역(blockedAreas)이 있으면 후보 위치가 그 안에 들어가는지
// 검사한다 — bgDims를 못 읽었으면(배경 없음) 판정 근거가 없으니 항상 허용.
function isPositionBlocked(x, y) {
  if (!blockedAreas.length) return false;
  return isInsideAnyArea(worldPosToImageFrac(x, y), blockedAreas);
}
function moveTick(ts) {
  if (!moveHoldVec) { moveRaf = null; return; }
  if (!moveLastT) moveLastT = ts;
  let distPx = moveSpeedPxPerMs() * (ts - moveLastT);
  moveLastT = ts;
  if (moveHoldVec.dx && moveHoldVec.dy) distPx /= Math.SQRT2; // 대각선은 두 축을 동시에 움직이므로 축당 속도를 낮춰 체감 속도를 맞춘다
  const wb = worldBounds();
  // X축, Y축을 따로 검사해서 막힌 축만 취소한다 — 벽에 대각선으로 부딪혀도
  // 막히지 않은 축으로는 계속 미끄러지듯 움직일 수 있다.
  let nextX = charWorldPos.x, nextY = charWorldPos.y;
  if (moveHoldVec.dx) {
    const candidate = clamp(charWorldPos.x + moveHoldVec.dx * distPx, wb.minX, wb.maxX);
    if (!isPositionBlocked(candidate, nextY)) nextX = candidate;
  }
  if (moveHoldVec.dy) {
    const candidate = clamp(charWorldPos.y + moveHoldVec.dy * distPx, wb.minY, wb.maxY);
    if (!isPositionBlocked(nextX, candidate)) nextY = candidate;
  }
  charWorldPos.x = nextX;
  charWorldPos.y = nextY;
  updateCamera(); // 카메라 오프셋 재계산 + 캐릭터 화면 위치(left/bottom)까지 함께 반영한다
  checkInteractionArea();
  moveRaf = requestAnimationFrame(moveTick);
}
function startMoveHold(dx, dy, spriteDir) {
  if (gameState !== 'idle') return;
  moveHoldVec = { dx, dy };
  applyMoveSprite(spriteDir);
  if (!moveRaf) { moveLastT = 0; moveRaf = requestAnimationFrame(moveTick); }
}
function stopMoveHold() {
  moveHoldVec = null;
  currentSpriteDir = null;
  stopMoveAnim();
  if (idleFrameUrl) el.charImg.src = idleFrameUrl; // 걷기 멈추면 원래 idle 프레임(있으면)으로 되돌린다
}

/* ===== 입력 =====
   화면 아무 곳이나 누르면 캐스팅 세기 조절이 시작되던 것을 오른쪽 아래
   낚시 버튼(el.fishBtn) 하나로 옮겼다("낚시 버튼 = 낚싯대를 든다"는
   뜻이라, 안 누르고 있는 게 기본값이고 그 사이엔 왼쪽 아래 조이스틱
   (el.joystick)으로 캐릭터를 이동한다). 낚시 시작(idle→charging)뿐
   아니라 캐스팅(놓으면 던지기), 입질 반응, 잡아채기 중 홀드(캐스팅바를
   밀어올리는 것), 입질 대기 중 조기 올리기, 아이템창 닫기까지 이 버튼
   하나로 전부 되게 handleActionPointerDown/Release를 el.frame(화면
   전체 — 기존처럼 어디를 눌러도 동작)과 el.fishBtn 양쪽에 같이 건다.
   다만 idle→charging(낚시 시작)만은 el.fishBtn 전용이다 — el.frame에도
   걸면 이동 중 화면 탭이 다시 캐스팅을 트리거해버려 조이스틱 이동 UX가
   깨진다. */
function handleActionPointerDown() {
  if (gameState === 'bite') { handleReactionTap(); return; }
  if (gameState === 'catching') { holding = true; playReelHoldSeq(REEL_HOLD_UP_SEQ); return; }
  if (gameState === 'waiting') { abortWaitingReel(); return; }
  if (gameState === 'popup') { resetToIdle(); return; }
}
function handleActionPointerRelease() {
  const wasHolding = holding;
  holding = false;
  if (gameState === 'catching' && wasHolding) playReelHoldSeq(REEL_HOLD_DOWN_SEQ);
  if (gameState === 'charging') releasePowerAndCast();
}
el.frame.addEventListener('pointerdown', handleActionPointerDown);
['pointerup', 'pointercancel', 'pointerleave'].forEach(evt => {
  el.frame.addEventListener(evt, handleActionPointerRelease);
});
el.fishBtn.addEventListener('pointerdown', (e) => {
  e.stopPropagation(); // el.frame의 pointerdown까지 뚫고 내려가 같은 동작을 두 번 건드리지 않게 막는다
  if (layoutEditMode) { fishBtnDragPointerId = e.pointerId; el.fishBtn.setPointerCapture(e.pointerId); startLayoutDrag('fishBtn', e); return; }
  if (gameState === 'idle') { startPowerCharge(); return; } // 캐스팅 게이지/애니메이션은 위치와 무관하게 항상 정상적으로 시작한다 — 낚시가능 여부는 추가 착수한 뒤(throwSinker)에 판정한다
  handleActionPointerDown();
});
el.fishBtn.addEventListener('pointermove', (e) => {
  if (!layoutEditMode || e.pointerId !== fishBtnDragPointerId) return;
  updateLayoutDrag(e);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(evt => {
  el.fishBtn.addEventListener(evt, (e) => {
    e.stopPropagation();
    if (layoutEditMode) { // 편집 중 손을 뗀 걸 낚시 릴리즈 로직으로 보내지 않고 배치 드래그 종료로만 처리한다
      if (e.pointerId !== fishBtnDragPointerId) return;
      endLayoutDrag();
      fishBtnDragPointerId = null;
      return;
    }
    handleActionPointerRelease();
  });
});

/* ===== 이동 조이스틱 입력 =====
   실제 캐릭터 "위치" 이동은 8방향 그대로 자유롭다 — 손잡이 각도를 45도
   단위 8구역으로 스냅해서 zoneDx/zoneDy를 구한다(JOYSTICK_ZONE_DX/DY,
   대각선이면 둘 다 0이 아니다). 화면 좌표는 아래로 갈수록 y가 커지는데
   (포인터 dy>0 = 아래로 드래그) 캐릭터 이동은 반대로 bottom%가 커질수록
   위로 올라가므로, 이 구역 표를 만들 때 이미 세로 부호를 뒤집어 넣어뒀다.

   걷기 "애니메이션" 방향은 spriteDirFor(zoneDx, zoneDy)로 실제 이동
   벡터에서 그대로 파생시킨다 — 가로 성분(zoneDx)이 있으면 항상 좌/우를
   우선한다(대각선이어도 세로 시트를 섞지 않고 수평 이동 애니메이션을
   보여준다), 순수 상/하로만 밀 때만 위/아래를 쓴다. */
// 손잡이 반지름/데드존(px)은 조이스틱 크기가 편집 모드에서 바뀔 수 있어 상수가 아니라
// joystickRadiusPx()/joystickDeadzonePx()(배치 편집 섹션)로 매번 현재 크기 기준으로 계산한다.
// zone index 0~7 = 오른쪽, 오른쪽아래, 아래, 왼쪽아래, 왼쪽, 왼쪽위, 위, 오른쪽위 (캐릭터 이동 기준, dy는 이미 화면↔캐릭터 좌표계 반전 반영)
const JOYSTICK_ZONE_DX = [1, 1, 0, -1, -1, -1, 0, 1];
const JOYSTICK_ZONE_DY = [0, -1, -1, -1, 0, 1, 1, 1];
let joystickPointerId = null;
let joystickCenter = null;
let activeMoveDir = null; // { dx, dy } — 실제 위치 이동 벡터(대각선 가능), 디버그/테스트용으로도 노출
function updateJoystickFromPointer(clientX, clientY) {
  const dx = clientX - joystickCenter.x;
  const dy = clientY - joystickCenter.y;
  const dist = Math.hypot(dx, dy);
  const clampedDist = Math.min(dist, joystickRadiusPx());
  const angle = Math.atan2(dy, dx);
  el.joystickKnob.style.transform = `translate(${Math.cos(angle) * clampedDist}px, ${Math.sin(angle) * clampedDist}px)`;
  if (dist < joystickDeadzonePx()) {
    activeMoveDir = null;
    stopMoveHold();
    return;
  }
  const angle360 = (angle * 180 / Math.PI + 360) % 360;
  const zoneIndex = Math.round(angle360 / 45) % 8;
  const zoneDx = JOYSTICK_ZONE_DX[zoneIndex];
  const zoneDy = JOYSTICK_ZONE_DY[zoneIndex];
  activeMoveDir = { dx: zoneDx, dy: zoneDy };
  startMoveHold(zoneDx, zoneDy, spriteDirFor(zoneDx, zoneDy));
}
function resetJoystick() {
  joystickPointerId = null;
  activeMoveDir = null;
  el.joystickKnob.style.transform = 'translate(0,0)';
  stopMoveHold();
}
el.joystick.addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  if (layoutEditMode) { joystickPointerId = e.pointerId; el.joystick.setPointerCapture(e.pointerId); startLayoutDrag('joystick', e); return; }
  if (gameState !== 'idle') return;
  joystickPointerId = e.pointerId;
  el.joystick.setPointerCapture(e.pointerId);
  const rect = el.joystick.getBoundingClientRect();
  joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  updateJoystickFromPointer(e.clientX, e.clientY);
});
el.joystick.addEventListener('pointermove', (e) => {
  if (e.pointerId !== joystickPointerId) return;
  if (layoutEditMode) { updateLayoutDrag(e); return; }
  updateJoystickFromPointer(e.clientX, e.clientY);
});
['pointerup', 'pointercancel'].forEach(evt => el.joystick.addEventListener(evt, (e) => {
  if (e.pointerId !== joystickPointerId) return;
  if (layoutEditMode) { endLayoutDrag(); joystickPointerId = null; return; }
  resetJoystick();
}));

/* ===== 배치 편집 =====
   우상단 연필 버튼(el.layoutEditBtn)을 누르면 조이스틱/낚시 버튼/캐릭터/
   캐스팅 UI/배경화면의 크기(배율)를 바꿀 수 있는 편집 모드로 들어간다
   (idle 상태에서만). 크기는 슬라이더로, 위치는 조이스틱·낚시 버튼을
   직접 드래그해서 바꾼다 — 드래그하는 동안은 실제 그림 대신 점선 네모
   (el.layoutDragGhost)만 보여주고, 손을 떼면 그 자리로 실제 그림이
   다시 나타난다(syncDragGhost). 편집 모드일 땐 위의 pointerdown
   분기들이 원래 하던 일(이동/캐스팅) 대신 이 startLayoutDrag/
   updateLayoutDrag/endLayoutDrag로 빠진다. 값은 layoutPrefs에 모아두고
   CSS 변수(applyLayoutPrefs)로 즉시 반영하며, localStorage에 저장해
   다음 접속에도 유지한다 — 배경화면 배율(bgZoom)만은 예외로, 배경마다
   다시 맞춰야 하는 값이라 layoutPrefs가 아니라 별도 변수로 관리하고
   저장하지 않는다(loadConfig 참고). */
const LAYOUT_PREFS_KEY = 'fishingLayoutPrefs_v1';
let layoutPrefs = {
  joystick: { size: 130, left: 12, bottom: 57 }, // size=.joystick-base 지름(px), left/bottom=.joystick 앵커(px) — 요청한 스크린샷 실측값으로 기본값 고정
  fishBtn: { size: 114, right: 23, bottom: 82 }, // 요청한 스크린샷 실측 크기·위치로 기본값 고정
  heldFish: { size: 40 }, // 낚시 성공 후 캐릭터가 들고 있는 물고기 아이콘 크기(px) — .held-fish 기본값과 맞춤
  char: { scale: 1 }, // 캐릭터(.char-stage) 전체 배율 — --char-scale, char-stage의 transform:scale에 그대로 들어간다
  casting: { scale: 1 }, // 캐스팅 파워바/잡아채기 낚시바/찌/입질 팝업/아이템 팝업/물고기 날아가는 연출을 한 번에 묶어 조절하는 배율 — --casting-scale과 각 요소의 JS 계산 transform에 곱해진다. 추 던지기 궤적(cast-svg)은 낚싯대 끝의 실제 화면 좌표에 맞춰야 해서 일부러 빼뒀다(비율만 바꾸면 궤적 시작점이 캐릭터 손끝에서 어긋나 보인다).
};
let layoutEditMode = false;
let layoutDragTarget = null; // 'joystick' | 'fishBtn' | null
let layoutDragStartPointer = null;
let layoutDragStartPos = null;
let fishBtnDragPointerId = null;
function loadLayoutPrefs() {
  try {
    const raw = localStorage.getItem(LAYOUT_PREFS_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.joystick) Object.assign(layoutPrefs.joystick, saved.joystick);
    if (saved.fishBtn) Object.assign(layoutPrefs.fishBtn, saved.fishBtn);
    if (saved.heldFish) Object.assign(layoutPrefs.heldFish, saved.heldFish);
    if (saved.char) Object.assign(layoutPrefs.char, saved.char);
    if (saved.casting) Object.assign(layoutPrefs.casting, saved.casting);
  } catch (err) { /* 저장값이 깨졌으면 기본값 그대로 쓴다 */ }
}
function saveLayoutPrefs() {
  try { localStorage.setItem(LAYOUT_PREFS_KEY, JSON.stringify(layoutPrefs)); } catch (err) { /* 저장 실패해도 이번 세션 값은 그대로 쓸 수 있으니 무시 */ }
}
function applyLayoutPrefs() {
  const root = document.documentElement.style;
  root.setProperty('--joy-base-size', layoutPrefs.joystick.size + 'px');
  root.setProperty('--joy-hit-size', (layoutPrefs.joystick.size + 40) + 'px'); // 히트박스는 시각적 원보다 사방 20px씩 더 크게
  root.setProperty('--joy-knob-size', Math.round(layoutPrefs.joystick.size * 0.43) + 'px');
  root.setProperty('--joy-left', layoutPrefs.joystick.left + 'px');
  root.setProperty('--joy-bottom', layoutPrefs.joystick.bottom + 'px');
  root.setProperty('--fish-size', layoutPrefs.fishBtn.size + 'px');
  root.setProperty('--fish-right', layoutPrefs.fishBtn.right + 'px');
  root.setProperty('--fish-bottom', layoutPrefs.fishBtn.bottom + 'px');
  root.setProperty('--held-fish-size', layoutPrefs.heldFish.size + 'px');
  root.setProperty('--char-scale', layoutPrefs.char.scale);
  root.setProperty('--casting-scale', layoutPrefs.casting.scale);
}
// 조이스틱 반지름/데드존은 --joy-base-size에 비례해서 커진 원 크기에 맞게 매번 다시 계산한다(고정 상수 대신).
function joystickRadiusPx() { return layoutPrefs.joystick.size * 0.4; }
function joystickDeadzonePx() { return layoutPrefs.joystick.size * 0.1; }
// 위치 드래그 중엔 실제 그림(조이스틱/낚시 버튼) 대신 이 점선 네모만
// 보여준다 — 드래그 대상을 opacity:0으로 숨기되(포인터 캡처는 그대로라
// 드래그는 안 끊긴다) el.layoutDragGhost를 그 자리·크기에 맞춰 얹는다.
function syncDragGhost(targetEl) {
  const frameRect = el.frame.getBoundingClientRect();
  const rect = targetEl.getBoundingClientRect();
  el.layoutDragGhost.style.left = (rect.left - frameRect.left) + 'px';
  el.layoutDragGhost.style.top = (rect.top - frameRect.top) + 'px';
  el.layoutDragGhost.style.width = rect.width + 'px';
  el.layoutDragGhost.style.height = rect.height + 'px';
}
function layoutDragTargetEl() { return layoutDragTarget === 'joystick' ? el.joystick : el.fishBtn; }
function startLayoutDrag(target, e) {
  layoutDragTarget = target;
  layoutDragStartPointer = { x: e.clientX, y: e.clientY };
  layoutDragStartPos = target === 'joystick'
    ? { left: layoutPrefs.joystick.left, bottom: layoutPrefs.joystick.bottom }
    : { right: layoutPrefs.fishBtn.right, bottom: layoutPrefs.fishBtn.bottom };
  layoutDragTargetEl().classList.add('layout-drag-hide');
  el.layoutDragGhost.classList.remove('hidden');
  syncDragGhost(layoutDragTargetEl());
}
function updateLayoutDrag(e) {
  if (!layoutDragTarget) return;
  const dx = e.clientX - layoutDragStartPointer.x;
  const dy = e.clientY - layoutDragStartPointer.y;
  if (layoutDragTarget === 'joystick') {
    layoutPrefs.joystick.left = Math.max(0, layoutDragStartPos.left + dx);
    layoutPrefs.joystick.bottom = Math.max(0, layoutDragStartPos.bottom - dy); // 화면 y는 아래로 갈수록 커지지만 bottom%는 반대라 부호를 뒤집는다
  } else {
    layoutPrefs.fishBtn.right = Math.max(0, layoutDragStartPos.right - dx);
    layoutPrefs.fishBtn.bottom = Math.max(0, layoutDragStartPos.bottom - dy);
  }
  applyLayoutPrefs();
  syncDragGhost(layoutDragTargetEl());
}
function endLayoutDrag() {
  if (!layoutDragTarget) return;
  layoutDragTargetEl().classList.remove('layout-drag-hide');
  el.layoutDragGhost.classList.add('hidden');
  layoutDragTarget = null;
  saveLayoutPrefs();
}
el.layoutEditBtn.addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  if (gameState !== 'idle') return;
  layoutEditMode = !layoutEditMode;
  el.layoutEditBtn.classList.toggle('active', layoutEditMode);
  el.layoutEditPanel.classList.toggle('hidden', !layoutEditMode);
  el.layoutEditHint.classList.toggle('hidden', !layoutEditMode);
  if (layoutEditMode) {
    el.layoutJoySize.value = layoutPrefs.joystick.size;
    el.layoutFishSize.value = layoutPrefs.fishBtn.size;
    el.layoutHeldFishSize.value = layoutPrefs.heldFish.size;
    el.layoutCharScale.value = layoutPrefs.char.scale;
    el.layoutCastingScale.value = layoutPrefs.casting.scale;
    el.layoutBgZoom.value = bgZoom;
    stopMoveHold();
  }
});
el.layoutJoySize.addEventListener('input', () => {
  layoutPrefs.joystick.size = Number(el.layoutJoySize.value);
  applyLayoutPrefs();
});
el.layoutJoySize.addEventListener('change', saveLayoutPrefs);
el.layoutFishSize.addEventListener('input', () => {
  layoutPrefs.fishBtn.size = Number(el.layoutFishSize.value);
  applyLayoutPrefs();
});
el.layoutFishSize.addEventListener('change', saveLayoutPrefs);
el.layoutHeldFishSize.addEventListener('input', () => {
  layoutPrefs.heldFish.size = Number(el.layoutHeldFishSize.value);
  applyLayoutPrefs();
});
el.layoutHeldFishSize.addEventListener('change', saveLayoutPrefs);
el.layoutCharScale.addEventListener('input', () => {
  layoutPrefs.char.scale = Number(el.layoutCharScale.value);
  applyLayoutPrefs();
});
el.layoutCharScale.addEventListener('change', saveLayoutPrefs);
el.layoutCastingScale.addEventListener('input', () => {
  layoutPrefs.casting.scale = Number(el.layoutCastingScale.value);
  applyLayoutPrefs();
});
el.layoutCastingScale.addEventListener('change', saveLayoutPrefs);
// 배경화면 배율 — 배경을 업로드했을 때만 이 행이 보인다(loadConfig가
// layoutBgZoomRow의 hidden을 토글). 값이 바뀔 때마다 즉시 카메라를 다시
// 계산해 확대/축소와 카메라 위치(camOffset)를 함께 반영한다(charWorldPos
// 자체는 원본 좌표 그대로라 캐릭터가 걷는 로직/영역 판정엔 영향이 없다).
// 배경별로 다시 맞춰야 하는 값이라 다른 배치값과 달리 localStorage에는
// 저장하지 않는다(loadConfig가 배경을 새로 불러올 때마다 1배율로 리셋).
el.layoutBgZoom.addEventListener('input', () => {
  bgZoom = Number(el.layoutBgZoom.value);
  updateCamera();
});
el.layoutEditDoneBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  layoutEditMode = false;
  el.layoutEditBtn.classList.remove('active');
  el.layoutEditPanel.classList.add('hidden');
  el.layoutEditHint.classList.add('hidden');
});
loadLayoutPrefs();
applyLayoutPrefs();

loadConfig().then(() => checkInteractionArea()); // 초기 스폰 위치가 이미 상호작용 영역 안일 수도 있으니 로드 직후 한 번 확인
</script>
<script src="/dev/devPlanFab.js"></script>
</body>
