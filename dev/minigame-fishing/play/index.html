<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--green:#3ECF6B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --sky-top:#8FD4E8;--sky-bottom:#C7ECDD;--water-top:#2E7DA6;--water-bottom:#0F3C55;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}

.frame{position:relative;width:100%;max-width:430px;height:100dvh;height:100vh;height:var(--vh100, 100vh);overflow:hidden;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 55%,var(--water-top) 55%,var(--water-bottom) 100%);display:flex;flex-direction:column;touch-action:none}

.topbar{position:absolute;top:0;left:0;right:0;z-index:6;padding:calc(14px + env(safe-area-inset-top,0)) 16px 10px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.back-chip{pointer-events:auto;flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.4);border:1px solid rgba(10,40,50,.25);color:#0A2A3A;font-size:18px;font-weight:700;line-height:1;text-decoration:none}
.back-chip:active{transform:scale(.92)}
.count-chip{pointer-events:none;font-family:var(--mono);font-size:11.5px;font-weight:700;color:#0A2A3A;background:rgba(255,255,255,.45);border-radius:14px;padding:6px 12px}

.stage{position:absolute;inset:0;z-index:1}

.status-line{position:absolute;top:calc(60px + env(safe-area-inset-top,0));left:0;right:0;z-index:5;text-align:center;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.03em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}

.char-stage{position:absolute;left:9%;bottom:41%;z-index:2;width:84px;height:84px;display:flex;align-items:flex-end;justify-content:center}
.char-stage img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.char-fallback{font-size:46px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.char-fallback.hidden,.char-stage img.hidden{display:none}

.bobber{position:absolute;left:26%;top:64%;z-index:3;width:0;height:0;transform:translate(-50%,-50%)}
.bobber.hidden{display:none}
.bobber-dot{width:16px;height:16px;border-radius:50% 50% 50% 0;background:radial-gradient(circle at 35% 30%,#FF7A6E,#D9455B);box-shadow:0 2px 6px rgba(0,0,0,.35);transform:translate(-50%,-50%) rotate(45deg)}
.bobber.bob-idle .bobber-dot{animation:bobberIdle 1.1s ease-in-out infinite}
.bobber.bite-dip .bobber-dot{animation:bobberDip .35s ease-in-out infinite}
@keyframes bobberIdle{0%,100%{transform:translate(-50%,-50%) rotate(45deg) translateY(0)}50%{transform:translate(-50%,-50%) rotate(45deg) translateY(-4px)}}
@keyframes bobberDip{0%,100%{transform:translate(-50%,-50%) rotate(45deg) translateY(0)}50%{transform:translate(-50%,-50%) rotate(45deg) translateY(10px)}}
.bite-mark{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-family:var(--mono);font-weight:800;font-size:22px;color:#FFD12E;text-shadow:0 2px 4px rgba(0,0,0,.5);animation:biteMarkPop .4s ease}
.bite-mark.hidden{display:none}
@keyframes biteMarkPop{0%{transform:translateX(-50%) scale(.3);opacity:0}60%{transform:translateX(-50%) scale(1.25);opacity:1}100%{transform:translateX(-50%) scale(1)}}

/* 캐스팅 버튼 대신 화면을 꾹 눌러 세기(0~100, 왔다리갔다리)를 맞추고
   손을 떼면 그 순간 값으로 던진다(startPowerCharge/releasePowerAndCast) —
   이 바는 누르고 있는 동안만 보인다. */
.cast-power-wrap{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0));transform:translateX(-50%);z-index:5;width:220px;display:flex;flex-direction:column;align-items:center;gap:6px}
.cast-power-wrap.hidden{display:none}
.cast-power-track{width:100%;height:20px;border-radius:10px;background:rgba(5,20,28,.45);border:1px solid rgba(255,255,255,.35);overflow:hidden}
.cast-power-fill{height:100%;width:0%;background:var(--green);border-radius:10px 0 0 10px}
.cast-power-label{font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}

/* 추(sinker) 던지기 물리 시뮬레이션 — 낚싯대 끝~추 사이는 현수선(catenary)
   커브로 그린다(catenaryPoints/renderCastLine). 좌표계는 el.frame 픽셀
   그대로 써서(viewBox) 물리 계산과 그리기가 같은 단위를 쓴다. */
.cast-svg{position:absolute;inset:0;z-index:3;pointer-events:none}
.cast-svg.hidden{display:none}
.cast-line{fill:none;stroke:rgba(230,230,220,.9);stroke-width:1.5}
.cast-sinker{fill:#5a5f66;stroke:rgba(0,0,0,.4);stroke-width:1}

.catch-hint{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0));z-index:5;text-align:center;font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(0,0,0,.5)}
.catch-hint.hidden{display:none}

.fishbar-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;display:flex;align-items:center;gap:14px;background:rgba(5,20,28,.35);border-radius:20px;padding:18px 20px;backdrop-filter:blur(2px)}
.fishbar-panel.hidden{display:none}
.fishbar{position:relative;width:52px;height:230px;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.5);box-shadow:inset 0 0 12px rgba(0,0,0,.4);background-size:cover;background-position:center}
/* 게이지는 사용자 요청으로 화면에서 숨겼다(코드/로직은 그대로 남겨둠 —
   나중에 다시 켤 수 있게 display:none만 추가). 낚시바 크기/캐치바 크기를
   직접 조절하는 새 낚시바 모듈로 대체하는 중이라 진행도 채우기 효과는
   잠시 보이지 않는다. */
.fishbar-gauge{position:absolute;inset:0;overflow:hidden;background:rgb(151,126,83);display:none}
.fishbar-gauge-mask{position:absolute;left:0;right:0;top:0;background:rgba(5,7,10,.82)}
.fishbar-zone{position:absolute;left:0;right:0;border-radius:6px;opacity:.85;transition:background .2s;background-size:cover;background-position:center}
.fishbar-fish{position:absolute;left:50%;transform:translate(-50%,-50%);font-size:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.fishbar-fish img{width:26px;height:26px;object-fit:contain;image-rendering:pixelated}

.overlay{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:32px;background:rgba(5,7,10,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.overlay.show{display:flex}
.overlay-title{font-family:var(--mono);font-size:16px;font-weight:800;letter-spacing:.08em;color:var(--signal-red)}
.overlay-title.success{color:var(--green)}
.overlay-message{font-size:14px;color:var(--text-primary)}
.overlay-fish{display:none;flex-direction:column;align-items:center;gap:6px;margin:2px 0}
.overlay-fish.show{display:flex}
.overlay-fish-icon{width:56px;height:56px;border-radius:14px;background-color:rgba(255,255,255,.12);background-repeat:no-repeat;image-rendering:pixelated;display:flex;align-items:center;justify-content:center;font-size:30px}
.overlay-fish-name{font-size:16px;font-weight:700}
.overlay-fish-meta{font-family:var(--mono);font-size:11.5px;color:var(--text-secondary)}
.overlay-count{font-family:var(--mono);font-size:12px;color:var(--text-secondary);margin-bottom:6px}
.overlay-btn-row{display:flex;gap:10px}
.overlay-btn{font-family:var(--mono);font-size:13.5px;font-weight:700;letter-spacing:.03em;border:none;border-radius:16px;padding:13px 20px;cursor:pointer;text-decoration:none}
.overlay-btn.primary{color:#08110c;background:var(--green)}
.overlay-btn.secondary{color:var(--text-primary);background:rgba(255,255,255,.14)}
.overlay-btn:active{opacity:.8}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="topbar">
    <a class="back-chip" href="/dev/minigame-fishing/" aria-label="뒤로">‹</a>
    <div class="count-chip" id="countChip">0마리</div>
  </div>

  <div class="stage" id="stage">
    <div class="status-line" id="statusLine">화면을 꾹 눌러 캐스팅 세기를 조절하세요</div>

<script>
function setVh100() { document.documentElement.style.setProperty('--vh100', window.innerHeight + 'px'); }
setVh100();
window.addEventListener('resize', setVh100);
window.addEventListener('orientationchange', setVh100);
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script src="/dev/assetDb.js"></script>
<script src="/dev/data/fishDefs.js"></script>
<script>
/* =========================================================================
   낚시 미니게임 플레이 화면. 흐름: 캐스팅(대기 탭) → 캐스팅 모션 재생 →
   찌 던지기 → 입질 대기 → 입질(반응 탭) → 낚시바(잡아채기, 홀드/릴리즈로
   캐치존을 움직여 물고기를 가둔다) → 올리기 모션 재생 → 결과.

   설정은 /dev/minigame-fishing/'s 설정 screen에서 넘어온다 — 난이도/모션
   타입(물고기 움직임 패턴)은 다른 미니게임들과 같은 관례로 쿼리스트링
   (?diff=&motion=), 캐스팅·올리기 프레임과 낚시바 디자인은 AssetDB.
   getFishingConfig()로 직접 불러온다(watermelon/play가 fruit 이미지를
   localStorage에서 직접 읽는 것과 같은 자산-데이터 취급).
   ========================================================================= */

const settingsParams = new URLSearchParams(location.search);
const DIFFICULTY = ['easy', 'hard'].includes(settingsParams.get('diff')) ? settingsParams.get('diff') : 'normal';
const MOTION_TYPE = ['linear', 'random'].includes(settingsParams.get('motion')) ? settingsParams.get('motion') : 'zigzag';

const DIFF_TUNING = {
  easy: { biteDelayMin: 700, biteDelayMax: 1500, reactionWindow: 900, fishSpeedMult: 0.85, fillRate: 30, drainRate: 14 },
  normal: { biteDelayMin: 900, biteDelayMax: 1900, reactionWindow: 700, fishSpeedMult: 1.0, fillRate: 24, drainRate: 18 },
  hard: { biteDelayMin: 1100, biteDelayMax: 2300, reactionWindow: 520, fishSpeedMult: 1.3, fillRate: 20, drainRate: 24 },
};

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
function vibrate(pattern) { if (navigator.vibrate) navigator.vibrate(pattern); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// 게이지 색 — 고정 그라데이션(항상 빨강~연두 전체 범위를 깔아두고 마스크로
// 일부만 드러내는 방식) 대신, "지금 진행도 값"을 0%(빨강)~70%(연두) 사이에서
// 내분해 하나의 단색으로 계산한다. 예: 35%면 주황/노랑 계열, 70% 이상은
// 그 이상 색이 안 바뀌고 연두로 고정. --signal-red(#D94141)/--green(#3ECF6B)
// CSS 변수와 같은 값을 RGB로 하드코딩해서 매 프레임 보간한다.
const GAUGE_COLOR_STOPS = { red: [217, 65, 65], green: [62, 207, 107], capPct: 70 };
function gaugeColorForProgress(pct) {
  const t = clamp(pct, 0, GAUGE_COLOR_STOPS.capPct) / GAUGE_COLOR_STOPS.capPct;
  const [r0, g0, b0] = GAUGE_COLOR_STOPS.red;
  const [r1, g1, b1] = GAUGE_COLOR_STOPS.green;
  const r = Math.round(r0 + (r1 - r0) * t);
  const g = Math.round(g0 + (g1 - g0) * t);
  const b = Math.round(b0 + (b1 - b0) * t);
  return `rgb(${r},${g},${b})`;
}

const el = {
  frame: document.getElementById('frame'),
  statusLine: document.getElementById('statusLine'),
  charStage: document.getElementById('charStage'),
  charImg: document.getElementById('charImg'),
  charFallback: document.getElementById('charFallback'),
  bobber: document.getElementById('bobber'),
  biteMark: document.getElementById('biteMark'),
  castPowerWrap: document.getElementById('castPowerWrap'),
  castPowerFill: document.getElementById('castPowerFill'),
  castPowerLabel: document.getElementById('castPowerLabel'),
  castSvg: document.getElementById('castSvg'),
  castLinePath: document.getElementById('castLinePath'),
  castSinker: document.getElementById('castSinker'),
  fishbarPanel: document.getElementById('fishbarPanel'),
  fishbar: document.getElementById('fishbar'),
  fishbarZone: document.getElementById('fishbarZone'),
  fishbarFish: document.getElementById('fishbarFish'),
  fishbarGauge: document.getElementById('fishbarGauge'),
  fishbarGaugeMask: document.getElementById('fishbarGaugeMask'),
  catchHint: document.getElementById('catchHint'),
  countChip: document.getElementById('countChip'),
  overlay: document.getElementById('overlay'),
  overlayTitle: document.getElementById('overlayTitle'),
  overlayMessage: document.getElementById('overlayMessage'),
  overlayCount: document.getElementById('overlayCount'),
  overlayFish: document.getElementById('overlayFish'),
  overlayFishIcon: document.getElementById('overlayFishIcon'),
  overlayFishName: document.getElementById('overlayFishName'),
  overlayFishMeta: document.getElementById('overlayFishMeta'),
  retryBtn: document.getElementById('retryBtn'),
};

let castFrameUrls = [];
let castFrameDurations = null; // per-frame ms, dev/minigame-fishing/index.html 재생 타임라인에서 설정
let reelFrameUrls = [];
let idleFrameUrl = null;
let fishSheetUrl = null;
let fishSheetDims = null; // { width, height } of the *actual* loaded sheet — needed to turn a fishIconOverrides rect (normalized 0~1) into pixel background-position/size, see getFishCropStyle in fishDefs.js
let fishIconOverrides = {};
let zoneSizePct = 28;
// zoneRegion이 설정돼 있으면 캐치존/물고기를 낚시바 전체(0~100%)가 아니라
// 이 안(트랙)에서 위치를 계산한다 — 실제 물리(updateFish/updateZone/
// updateProgress)는 항상 추상적인 0~100 공간에서 그대로 돌아가고, 렌더링
// (renderBarFrame)만 이 트랙으로 다시 매핑한다. 게이지는 더 이상 별도
// 영역지정이 없다 — 낚시바 모듈 자체(.fishbar 전체)가 게이지다.
let zoneTrack = null; // { x, y, w, h } — 낚시바 기준 %
let caughtCount = 0;
let gameState = 'idle'; // idle | charging | casting | waiting | bite | catching | reeling | result
let biteTimer = null;
let reactionTimer = null;
let holding = false;
let raf = null;
let lastT = 0;
let fish = { y: 50, vy: 0, targetY: 50, pickTimer: 0 };
let zone = { y: 36, vel: 0 };
let progress = 30; // 기본 시작 게이지 30%

/* ===== 캐스팅 세기 — 화면을 누르고 있는 동안 0→100→0을 계속 왔다리갔다리
   (사인파)하다가, 손을 떼는 순간의 값이 캐스팅 세기가 된다. ===== */
let castPower = 0;
let castChargeStartT = 0;
let castChargeRaf = null;
const CAST_POWER_PERIOD_MS = 1100; // 0→100→0 한 바퀴 도는 시간

/* ===== 추 던지기 물리 — 낚싯대 끝에서 목표 수평거리(세기에 비례)까지
   포물선 운동으로 날아간다. 피크 높이(H)와 중력(g)을 프레임 높이에 비례한
   값으로 고정해두면 세기와 무관하게 항상 같은 체공 시간(T)이 나오고,
   수평속도(vx0)만 세기에 따라 달라져 "세질수록 멀리 감"이 자연스럽게
   나온다. ===== */
let castFlightRaf = null;

/* ===== 설정 로드 (AssetDB) — 실패해도 게임은 도형 폴백으로 계속 동작한다. ===== */
async function loadConfig() {
  let cfg = { castingFrames: [], reelingFrames: [], barDesign: {}, castingSheetAssetId: null, castingFrameOverrides: {} };
  try { cfg = await AssetDB.getFishingConfig(); } catch (e) { /* 오프라인/미설정 — 기본값으로 진행 */ }
  // castingFrames(개별 업로드 배열)는 더 이상 안 쓴다 — 캐스팅은 이제
  // castingSheetAssetId 시트 1장을 잘라 쓴다(dev/minigame-fishing/index.html
  // 참고). 올리기(reelingFrames)는 여전히 예전 방식 그대로.
  const ids = [].concat(cfg.reelingFrames || []);
  const design = cfg.barDesign || {};
  if (design.fishIconAssetId) ids.push(design.fishIconAssetId);
  if (design.barImageAssetId) ids.push(design.barImageAssetId);
  if (design.zoneImageAssetId) ids.push(design.zoneImageAssetId);
  if (cfg.fishSheetAssetId) ids.push(cfg.fishSheetAssetId);
  if (cfg.castingSheetAssetId) ids.push(cfg.castingSheetAssetId);
  let assets = [];
  try { assets = await AssetDB.getAssetsByIds(ids); } catch (e) { /* 위와 동일 */ }
  const byId = new Map(assets.map(a => [a.id, a]));
  reelFrameUrls = (cfg.reelingFrames || []).map(id => byId.get(id)).filter(Boolean).map(a => a.dataUrl);
  const castingSheetAsset = cfg.castingSheetAssetId ? byId.get(cfg.castingSheetAssetId) : null;
  if (castingSheetAsset) {
    const img = await new Promise(resolve => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => resolve(im);
      im.onerror = () => resolve(null);
      im.src = castingSheetAsset.dataUrl;
    });
    castFrameUrls = img ? buildCastingFrameDataUrls(img, cfg.castingFrameOverrides, 64) : [];
  } else {
    castFrameUrls = [];
  }
  castFrameDurations = (cfg.castingFrameDurations && cfg.castingFrameDurations.length) ? cfg.castingFrameDurations : null;
  const fishSheetAsset = cfg.fishSheetAssetId ? byId.get(cfg.fishSheetAssetId) : null;
  fishSheetUrl = fishSheetAsset ? fishSheetAsset.dataUrl : null;
  fishIconOverrides = cfg.fishIconOverrides || {};
  if (fishSheetUrl) {
    fishSheetDims = await new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
      img.onerror = () => resolve(null);
      img.src = fishSheetUrl;
    });
  }

  el.fishbar.style.width = (design.barWidthPx || 52) + 'px';
  el.fishbar.style.height = (design.barHeightPx || 230) + 'px';
  el.fishbar.style.background = design.barColor || '#171C22';
  el.fishbar.style.backgroundImage = '';
  const barImageAsset = design.barImageAssetId ? byId.get(design.barImageAssetId) : null;
  if (barImageAsset) el.fishbar.style.backgroundImage = `url(${barImageAsset.dataUrl})`;

  el.fishbarZone.style.background = design.zoneColor || '#59B8C8';
  el.fishbarZone.style.backgroundImage = '';
  const zoneImageAsset = design.zoneImageAssetId ? byId.get(design.zoneImageAssetId) : null;
  if (zoneImageAsset) el.fishbarZone.style.backgroundImage = `url(${zoneImageAsset.dataUrl})`;

  zoneSizePct = design.zoneSizePct || 28;
  // zoneRegion은 낚시바 그림 위 "트랙" 사각형(캐치존이 오르내리는 실제 폭·
  // 범위) — 캐치존의 좌우 폭·세로 높이는 이 트랙을 기준으로 정하고, 물고기/
  // 캐치존의 세로 위치는 매 프레임 renderBarFrame이 이 트랙 안으로 다시
  // 매핑한다(물리 계산 자체는 손대지 않음).
  if (design.zoneRegion) {
    const r = design.zoneRegion;
    zoneTrack = { x: r.x * 100, y: r.y * 100, w: r.w * 100, h: r.h * 100 };
    el.fishbarZone.style.left = zoneTrack.x + '%';
    el.fishbarZone.style.width = zoneTrack.w + '%';
    el.fishbarZone.style.height = (zoneSizePct / 100 * zoneTrack.h) + '%';
  } else {
    zoneTrack = null;
    const zoneWidthPct = design.zoneWidthPct || 100;
    el.fishbarZone.style.left = ((100 - zoneWidthPct) / 2) + '%';
    el.fishbarZone.style.width = zoneWidthPct + '%';
    el.fishbarZone.style.height = zoneSizePct + '%';
  }

  const fishIconAsset = design.fishIconAssetId ? byId.get(design.fishIconAssetId) : null;
  if (fishIconAsset) el.fishbarFish.innerHTML = `<img src="${fishIconAsset.dataUrl}" alt="">`;

  idleFrameUrl = castFrameUrls[0] || null;
  if (idleFrameUrl) {
    el.charImg.src = idleFrameUrl;
    el.charImg.classList.remove('hidden');
    el.charFallback.classList.add('hidden');
  }
}

/* ===== 캐스팅/올리기 프레임 순차 재생 =====
   frameMs는 고정 ms 숫자(올리기) 또는 프레임별 ms 배열(캐스팅,
   castFrameDurations — 설정 화면 재생 타임라인에서 조정한 값)을 받는다. */
function playFrameSequence(urls, frameMs) {
  return new Promise(resolve => {
    if (!urls.length) { resolve(); return; }
    el.charImg.classList.remove('hidden');
    el.charFallback.classList.add('hidden');
    let i = 0;
    function showAndScheduleNext() {
      el.charImg.src = urls[i];
      const ms = Array.isArray(frameMs) ? (frameMs[i] || 90) : frameMs;
      i++;
      setTimeout(i >= urls.length ? resolve : showAndScheduleNext, ms);
    }
    showAndScheduleNext();
  });
}

/* ===== 캐스팅 세기 조절 (누르고 있는 동안) ===== */
function startPowerCharge() {
  gameState = 'charging';
  el.statusLine.textContent = '세기 조절 중... 손을 떼면 캐스팅!';
  el.castPowerWrap.classList.remove('hidden');
  castChargeStartT = performance.now();
  const periodSec = CAST_POWER_PERIOD_MS / 1000;
  function tick(ts) {
    if (gameState !== 'charging') return;
    const t = (ts - castChargeStartT) / 1000;
    const phase = (t / periodSec) * (2 * Math.PI);
    castPower = 50 - 50 * Math.cos(phase); // 0 → 100 → 0 사인파
    el.castPowerFill.style.width = castPower + '%';
    el.castPowerLabel.textContent = Math.round(castPower) + '%';
    castChargeRaf = requestAnimationFrame(tick);
  }
  castChargeRaf = requestAnimationFrame(tick);
}

/* ===== 세기 확정 → 캐스팅 모션 → 추 던지기(물리) → 입질 대기 ===== */
async function releasePowerAndCast() {
  if (gameState !== 'charging') return;
  cancelAnimationFrame(castChargeRaf);
  const power = castPower;
  el.castPowerWrap.classList.add('hidden');
  gameState = 'casting';
  el.statusLine.textContent = '캐스팅...';
  if (castFrameUrls.length) {
    await playFrameSequence(castFrameUrls, castFrameDurations || 90);
  } else {
    el.charFallback.style.transition = 'transform .35s ease';
    el.charFallback.style.transform = 'rotate(-25deg)';
    await wait(350);
    el.charFallback.style.transform = 'rotate(0deg)';
  }
  vibrate(15);
  if (idleFrameUrl) el.charImg.src = idleFrameUrl;
  await throwSinker(power);
  waitForBite();
}

// 낚싯대 끝 위치 — 캐릭터가 낚싯대를 앞으로 들어 올린 채 서 있다고 가정한
// 눈대중 지점(캐릭터 스테이지 박스 위쪽에서 한 번 더 위·오른쪽으로).
// char-stage 박스 자체는 캐릭터 몸통 높이라 물 라인(47%)보다 아래일 수
// 있어 그대로 쓰면 안 되고, 반드시 물 라인보다 위(작은 y)에 있어야 한다.
function rodTipPx(frameRect) {
  const charRect = el.charStage.getBoundingClientRect();
  return { x: charRect.right - frameRect.left + 6, y: charRect.top - frameRect.top - 50 };
}

// 포물선 운동으로 추를 던진다 — 피크 높이(H)·중력(g)을 프레임 높이 비례
// 상수로 고정해 세기와 무관하게 항상 같은 체공 시간이 나오게 하고, 세기는
// 수평거리(dx)만 늘린다("세질수록 멀리 감"). 착수 지점에 기존 찌(bobber)를
// 그대로 가져다 놓아 입질 대기 이후 로직은 손대지 않는다.
function throwSinker(power) {
  return new Promise(resolve => {
    const frameRect = el.frame.getBoundingClientRect();
    el.castSvg.setAttribute('viewBox', `0 0 ${frameRect.width} ${frameRect.height}`);
    const origin = rodTipPx(frameRect);
    const minDx = frameRect.width * 0.10, maxDx = frameRect.width * 0.68;
    const dx = minDx + (power / 100) * (maxDx - minDx);
    const waterY = frameRect.height * 0.47; // 기존 찌 착지 y(47%)와 동일
    const h0 = Math.max(10, waterY - origin.y);
    const H = frameRect.height * 0.09; // 최고점 높이(낚싯대 끝 기준)
    const g = frameRect.height * 3.4; // 중력 — 프레임 높이 비례라 기기 크기와 무관하게 체공 시간이 일정
    const vy0 = -Math.sqrt(2 * g * H);
    const T = (-vy0 + Math.sqrt(vy0 * vy0 + 2 * g * h0)) / g;
    const vx0 = dx / T;

    el.bobber.classList.add('hidden');
    el.castSvg.classList.remove('hidden');
    let start = null;
    function frame(ts) {
      if (start === null) start = ts;
      const t = (ts - start) / 1000;
      if (t >= T) { finish(dx); return; }
      const x = origin.x + vx0 * t;
      const y = origin.y + vy0 * t + 0.5 * g * t * t;
      renderCastLine(origin, { x, y });
      castFlightRaf = requestAnimationFrame(frame);
    }
    function finish(finalDx) {
      renderCastLine(origin, { x: origin.x + finalDx, y: waterY });
      el.castSvg.classList.add('hidden');
      const landingXPct = clamp((origin.x + finalDx) / frameRect.width * 100, 5, 95);
      const landingYPct = waterY / frameRect.height * 100;
      el.bobber.style.transition = 'none';
      el.bobber.style.left = landingXPct + '%';
      el.bobber.style.top = landingYPct + '%';
      el.bobber.classList.remove('hidden');
      resolve();
    }
    castFlightRaf = requestAnimationFrame(frame);
  });
}

// 낚싯대 끝(p0)~추(p1) 사이를 현수선(catenary)으로 그린다. 실제 줄 길이는
// 두 점 사이 직선거리(D)에 여유(12%)를 준 값(L)으로 정하고, L·dx·dy로부터
// 현수선 매개변수 a를 이분법으로 구한다(전형적인 "두 점을 지나는 현수선"
// 문제 — a>0에서 단조 함수라 이분법이 항상 수렴한다).
function renderCastLine(p0, p1) {
  el.castSinker.setAttribute('cx', p1.x);
  el.castSinker.setAttribute('cy', p1.y);
  const pts = catenaryPoints(p0, p1);
  el.castLinePath.setAttribute('d', 'M' + pts.map(p => `${p.x},${p.y}`).join(' L'));
}
function catenaryPoints(p0, p1, samples) {
  samples = samples || 16;
  const dx = p1.x - p0.x, dy = p1.y - p0.y;
  const D = Math.hypot(dx, dy);
  if (D < 4 || Math.abs(dx) < 2) return [p0, p1]; // 거의 수직/한 점 — 커브 의미 없음
  const L = D * 1.12;
  const target = Math.sqrt(Math.max(L * L - dy * dy, 0));
  function f(a) { return 2 * a * Math.sinh(dx / (2 * a)) - target; }
  let lo = 1e-3, hi = Math.max(Math.abs(dx), 1) * 50;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (f(mid) > 0) hi = mid; else lo = mid;
  }
  const a = (lo + hi) / 2;
  const p = (dx - a * Math.log((L + dy) / (L - dy))) / 2;
  const q = -a * Math.cosh(p / a);
  const pts = [];
  for (let i = 0; i <= samples; i++) {
    const xl = dx * i / samples;
    const yl = a * Math.cosh((xl - p) / a) + q;
    pts.push({ x: p0.x + xl, y: p0.y + yl });
  }
  return pts;
}

function waitForBite() {
  gameState = 'waiting';
  el.statusLine.textContent = '입질을 기다리는 중...';
  el.bobber.classList.add('bob-idle');
  const tuning = DIFF_TUNING[DIFFICULTY];
  const delay = tuning.biteDelayMin + Math.random() * (tuning.biteDelayMax - tuning.biteDelayMin);
  biteTimer = setTimeout(triggerBite, delay);
}

function triggerBite() {
  if (gameState !== 'waiting') return;
  gameState = 'bite';
  el.bobber.classList.remove('bob-idle');
  el.bobber.classList.add('bite-dip');
  el.biteMark.classList.remove('hidden');
  el.statusLine.textContent = '지금이야! 탭!';
  vibrate([0, 60, 40, 60]);
  reactionTimer = setTimeout(missReaction, DIFF_TUNING[DIFFICULTY].reactionWindow);
}

function handleReactionTap() {
  if (gameState !== 'bite') return;
  clearTimeout(reactionTimer);
  el.biteMark.classList.add('hidden');
  el.bobber.classList.add('hidden');
  el.bobber.classList.remove('bite-dip');
  startCatching();
}

function missReaction() {
  if (gameState !== 'bite') return;
  el.biteMark.classList.add('hidden');
  el.bobber.classList.add('hidden');
  endRun(false, '반응이 늦었어요...');
}

/* ===== 낚시바(잡아채기) ===== */
function startCatching() {
  gameState = 'catching';
  el.statusLine.textContent = '잡아채기!';
  el.catchHint.classList.remove('hidden');
  el.fishbarPanel.classList.remove('hidden');
  fish = { y: 50, vy: DIFF_TUNING[DIFFICULTY].fishSpeedMult * 34, targetY: 50, pickTimer: 0 };
  zone = { y: clamp(50 - zoneSizePct / 2, 0, 100 - zoneSizePct), vel: 0 };
  progress = 30;
  holding = false;
  lastT = performance.now();
  raf = requestAnimationFrame(catchTick);
}

function updateFish(dt) {
  const tuning = DIFF_TUNING[DIFFICULTY];
  const baseSpeed = 40 * tuning.fishSpeedMult;
  if (MOTION_TYPE === 'linear') {
    fish.y += fish.vy * dt;
    if (fish.y <= 0) { fish.y = 0; fish.vy = Math.abs(fish.vy); }
    if (fish.y >= 100) { fish.y = 100; fish.vy = -Math.abs(fish.vy); }
    return;
  }
  fish.pickTimer -= dt;
  if (fish.pickTimer <= 0) {
    if (MOTION_TYPE === 'zigzag') {
      fish.targetY = clamp(fish.y + (Math.random() * 70 - 35), 4, 96);
      fish.pickTimer = 0.22 + Math.random() * 0.32;
    } else { // random
      fish.targetY = Math.random() * 92 + 4;
      fish.pickTimer = 0.6 + Math.random() * 0.8;
    }
  }
  const approachSpeed = baseSpeed * (MOTION_TYPE === 'zigzag' ? 1.7 : 0.95);
  const diff = fish.targetY - fish.y;
  const step = Math.sign(diff) * Math.min(Math.abs(diff), approachSpeed * dt);
  fish.y += step;
}

function updateZone(dt) {
  const RISE_ACCEL = 230, GRAVITY = 190, MAX_SPEED = 140;
  zone.vel += (holding ? -RISE_ACCEL : GRAVITY) * dt;
  zone.vel = clamp(zone.vel, -MAX_SPEED, MAX_SPEED);
  zone.y += zone.vel * dt;
  const maxY = 100 - zoneSizePct;
  if (zone.y <= 0) { zone.y = 0; zone.vel = 0; }
  if (zone.y >= maxY) { zone.y = maxY; zone.vel = 0; }
}

function updateProgress(dt) {
  const tuning = DIFF_TUNING[DIFFICULTY];
  const inZone = fish.y >= zone.y && fish.y <= zone.y + zoneSizePct;
  progress += (inZone ? tuning.fillRate : -tuning.drainRate) * dt;
  progress = clamp(progress, 0, 100);
}

function renderBarFrame() {
  if (zoneTrack) {
    el.fishbarFish.style.top = (zoneTrack.y + fish.y / 100 * zoneTrack.h) + '%';
    el.fishbarZone.style.top = (zoneTrack.y + zone.y / 100 * zoneTrack.h) + '%';
  } else {
    el.fishbarFish.style.top = fish.y + '%';
    el.fishbarZone.style.top = zone.y + '%';
  }
  const gaugeColor = gaugeColorForProgress(progress);
  el.fishbarGaugeMask.style.height = (100 - progress) + '%';
  el.fishbarGauge.style.background = gaugeColor;
}

function catchTick(ts) {
  if (gameState !== 'catching') return;
  const dt = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;
  updateFish(dt);
  updateZone(dt);
  updateProgress(dt);
  renderBarFrame();
  if (progress >= 100) { endCatch(true); return; }
  if (progress <= 0) { endCatch(false); return; }
  raf = requestAnimationFrame(catchTick);
}

function endCatch(success) {
  if (raf) cancelAnimationFrame(raf);
  raf = null;
  el.fishbarPanel.classList.add('hidden');
  el.catchHint.classList.add('hidden');
  if (success) playReelThenResult(); else endRun(false, '물고기가 도망쳤어요...');
}

// 잡힌 물고기 종을 고른다 — fishDefs의 catchRate가 하나라도 채워져 있으면(합이
// 0보다 크면) 그 값을 가중치로 쓰고, 전부 0(§업로드 시점의 플레이스홀더 값)이면
// difficulty가 낮을수록 잘 잡히도록 난이도 제곱의 역수를 가중치로 대신 쓴다.
function pickCaughtFish() {
  const all = Object.values(fishDefs);
  const totalRate = all.reduce((sum, f) => sum + (f.catchRate || 0), 0);
  const weightOf = totalRate > 0 ? (f => f.catchRate || 0) : (f => 1 / (f.difficulty * f.difficulty));
  const weights = all.map(weightOf);
  const totalWeight = weights.reduce((sum, w) => sum + w, 0);
  let r = Math.random() * totalWeight;
  for (let i = 0; i < all.length; i++) {
    r -= weights[i];
    if (r <= 0) return all[i];
  }
  return all[all.length - 1];
}

async function playReelThenResult() {
  gameState = 'reeling';
  el.statusLine.textContent = '끌어올리는 중...';
  if (reelFrameUrls.length) {
    await playFrameSequence(reelFrameUrls, 90);
    await playFrameSequence(reelFrameUrls, 90);
  } else {
    await wait(500);
  }
  caughtCount++;
  el.countChip.textContent = caughtCount + '마리';
  endRun(true, '손맛 좋다! 낚았어요!', pickCaughtFish());
}

/* ===== 결과 / 리셋 ===== */
function endRun(success, message, fishCaught) {
  gameState = 'result';
  el.overlayTitle.textContent = success ? '낚시 성공' : '낚시 실패';
  el.overlayTitle.classList.toggle('success', success);
  el.overlayMessage.textContent = message;
  el.overlayCount.textContent = `이번 세션 ${caughtCount}마리`;
  if (fishCaught) {
    el.overlayFishName.textContent = fishCaught.name;
    el.overlayFishMeta.textContent = `${fishCaught.grade} · ${fishCaught.value}P`;
    if (fishSheetUrl) {
      const override = fishIconOverrides[fishCaught.id];
      const style = (override && fishSheetDims)
        ? getFishCropStyle(override, fishSheetDims.width, fishSheetDims.height, 56)
        : getFishSlotStyle(fishCaught.slot, 3.5);
      el.overlayFishIcon.style.backgroundImage = `url('${fishSheetUrl}')`;
      el.overlayFishIcon.style.backgroundPosition = style.backgroundPosition;
      el.overlayFishIcon.style.backgroundSize = style.backgroundSize;
      el.overlayFishIcon.textContent = '';
    } else {
      el.overlayFishIcon.style.backgroundImage = 'none';
      el.overlayFishIcon.textContent = '🐟';
    }
    el.overlayFish.classList.add('show');
  } else {
    el.overlayFish.classList.remove('show');
  }
  el.overlay.classList.add('show');
}

function resetToIdle() {
  el.overlay.classList.remove('show');
  gameState = 'idle';
  el.statusLine.textContent = '화면을 꾹 눌러 캐스팅 세기를 조절하세요';
  el.castPowerWrap.classList.add('hidden');
  el.castSvg.classList.add('hidden');
  el.bobber.classList.add('hidden');
  el.bobber.classList.remove('bob-idle', 'bite-dip');
  if (idleFrameUrl) { el.charImg.src = idleFrameUrl; el.charImg.classList.remove('hidden'); el.charFallback.classList.add('hidden'); }
  else { el.charImg.classList.add('hidden'); el.charFallback.classList.remove('hidden'); }
}

/* ===== 입력 =====
   캐스팅 버튼 대신 idle 상태에서 화면을 누르고 있으면 세기 게이지가
   왔다리갔다리 돌아가다가(startPowerCharge), 손을 떼는 순간 값으로 던진다
   (releasePowerAndCast) — 잡아채기(catching) 중 홀드와 같은 pointerdown/up
   쌍을 gameState로 나눠 재사용한다. */
el.retryBtn.addEventListener('click', resetToIdle);
el.frame.addEventListener('pointerdown', () => {
  if (gameState === 'bite') { handleReactionTap(); return; }
  if (gameState === 'catching') { holding = true; return; }
  if (gameState === 'idle') { startPowerCharge(); return; }
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(evt => {
  el.frame.addEventListener(evt, () => {
    holding = false;
    if (gameState === 'charging') releasePowerAndCast();
  });
});

loadConfig();
</script>
