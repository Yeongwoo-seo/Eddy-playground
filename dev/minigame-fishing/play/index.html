<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OPERATION MK · 낚시</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#0A2A3A">
<link rel="manifest" href="/dev/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPERATION MK DEV">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--green:#3ECF6B;--signal-red:#D94141;--divider:rgba(255,255,255,0.08);
  --sky-top:#8FD4E8;--sky-bottom:#C7ECDD;--water-top:#2E7DA6;--water-bottom:#0F3C55;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#000;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center}

.frame{position:relative;width:100%;max-width:430px;height:100dvh;height:100vh;height:var(--vh100, 100vh);overflow:hidden;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 55%,var(--water-top) 55%,var(--water-bottom) 100%);display:flex;flex-direction:column;touch-action:none}

.topbar{position:absolute;top:0;left:0;right:0;z-index:6;padding:calc(14px + env(safe-area-inset-top,0)) 16px 10px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.back-chip{pointer-events:auto;flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.4);border:1px solid rgba(10,40,50,.25);color:#0A2A3A;font-size:18px;font-weight:700;line-height:1;text-decoration:none}
.back-chip:active{transform:scale(.92)}
.count-chip{pointer-events:none;font-family:var(--mono);font-size:11.5px;font-weight:700;color:#0A2A3A;background:rgba(255,255,255,.45);border-radius:14px;padding:6px 12px}

.stage{position:absolute;inset:0;z-index:1}

.status-line{position:absolute;top:calc(60px + env(safe-area-inset-top,0));left:0;right:0;z-index:5;text-align:center;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.03em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}

.char-stage{position:absolute;left:9%;bottom:41%;z-index:2;width:84px;height:84px;display:flex;align-items:flex-end;justify-content:center}
.char-stage img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.char-fallback{font-size:46px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.char-fallback.hidden,.char-stage img.hidden{display:none}

.bobber{position:absolute;left:26%;top:64%;z-index:3;width:0;height:0;transform:translate(-50%,-50%)}
.bobber.hidden{display:none}
.bobber-dot{width:16px;height:16px;border-radius:50% 50% 50% 0;background:radial-gradient(circle at 35% 30%,#FF7A6E,#D9455B);box-shadow:0 2px 6px rgba(0,0,0,.35);transform:translate(-50%,-50%) rotate(45deg)}
.bobber.bob-idle .bobber-dot{animation:bobberIdle 1.1s ease-in-out infinite}
.bobber.bite-dip .bobber-dot{animation:bobberDip .35s ease-in-out infinite}
@keyframes bobberIdle{0%,100%{transform:translate(-50%,-50%) rotate(45deg) translateY(0)}50%{transform:translate(-50%,-50%) rotate(45deg) translateY(-4px)}}
@keyframes bobberDip{0%,100%{transform:translate(-50%,-50%) rotate(45deg) translateY(0)}50%{transform:translate(-50%,-50%) rotate(45deg) translateY(10px)}}
/* 낚시 추 이미지를 올린 경우, 착수 후 입질 대기 중 계속 떠 있는 건
   bobber-dot(기본 빨간 마름모)가 아니라 이 이미지다 — loadConfig가
   sinkerImageUrl 유무로 둘 중 하나만 보이게 display를 직접 토글한다
   (bobber-dot처럼 rotate(45deg)를 얹으면 업로드한 그림이 45도 기울어져
   보이므로 회전 없는 별도 키프레임을 쓴다). */
.bobber-img{width:22px;height:22px;object-fit:contain;transform:translate(-50%,-50%);display:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.bobber.bob-idle .bobber-img{animation:bobberIdleImg 1.1s ease-in-out infinite}
.bobber.bite-dip .bobber-img{animation:bobberDipImg .35s ease-in-out infinite}
@keyframes bobberIdleImg{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-4px)}}
@keyframes bobberDipImg{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(10px)}}
.bite-mark{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-family:var(--mono);font-weight:800;font-size:22px;color:#FFD12E;text-shadow:0 2px 4px rgba(0,0,0,.5);animation:biteMarkPop .4s ease}
.bite-mark.hidden{display:none}
@keyframes biteMarkPop{0%{transform:translateX(-50%) scale(.3);opacity:0}60%{transform:translateX(-50%) scale(1.25);opacity:1}100%{transform:translateX(-50%) scale(1)}}

/* 입질(느낌표) 탭 반응 시 뜨는 "물었다!" 표시 — 왼쪽 위 모서리를 고정점
   (transform-origin:0 0)으로 두고 오른쪽 아래 방향으로만 커졌다 작아진다.
   크기(scale, %)는 playBiteCaughtAnimation이 매 프레임 등가속 운동 공식
   (size = 100 + v0*t + 0.5*a*t^2, v0>0·a<0)으로 계산해 transform에 직접
   적용하고, 0%에 닿으면 스스로 숨기고 낚시바로 넘어간다. */
.bite-caught{position:absolute;left:30%;top:32%;z-index:6;transform-origin:0 0;pointer-events:none}
.bite-caught.hidden{display:none}
.bite-caught-text{font-family:var(--mono);font-weight:800;font-size:26px;letter-spacing:.03em;color:#FFD12E;text-shadow:0 2px 6px rgba(0,0,0,.6);white-space:nowrap}
.bite-caught-img{display:none;max-width:140px;max-height:140px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}

/* 캐스팅 버튼 대신 화면을 꾹 눌러 세기(0~100, 왔다리갔다리)를 맞추고
   손을 떼면 그 순간 값으로 던진다(startPowerCharge/releasePowerAndCast) —
   이 바는 누르고 있는 동안만 보인다. */
.cast-power-wrap{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0));transform:translateX(-50%);z-index:5;width:220px;display:flex;flex-direction:column;align-items:center;gap:6px}
.cast-power-wrap.hidden{display:none}
.cast-power-stage{position:relative;width:100%}
.cast-power-track{width:100%;height:20px;border-radius:10px;background:rgba(5,20,28,.45);border:1px solid rgba(255,255,255,.35);overflow:hidden}
.cast-power-fill{height:100%;width:0%;background:var(--green);border-radius:10px 0 0 10px}
.cast-power-label{font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
/* 캐스팅 게이지 이미지 — 설정 화면(dev/minigame-fishing/index.html)에서
   업로드하면 기본 막대 게이지 대신 이 그림이 배경으로 깔리고, 채움 영역
   (castGaugeFillRegion)이 지정한 자리에만 진행도 막대(cast-power-fill)가
   자리잡는다(둘 다 있어야 커스텀 게이지가 켜진다 — loadConfig 참고). */
.cast-power-gauge-img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;display:none}
.cast-power-wrap.custom-gauge .cast-power-gauge-img{display:block}
.cast-power-wrap.custom-gauge .cast-power-stage{aspect-ratio:var(--gauge-ar,220/20)}
.cast-power-wrap.custom-gauge .cast-power-track{position:absolute;background:transparent;border:none;border-radius:0}
.cast-power-wrap.custom-gauge .cast-power-fill{background:rgba(62,207,107,.55);border-radius:0}

/* 추(sinker) 던지기 물리 시뮬레이션 — 낚싯대 끝~추 사이는 현수선(catenary)
   커브로 그린다(catenaryPoints/renderCastLine). 좌표계는 el.frame 픽셀
   그대로 써서(viewBox) 물리 계산과 그리기가 같은 단위를 쓴다. */
.cast-svg{position:absolute;inset:0;z-index:3;pointer-events:none}
.cast-svg.hidden{display:none}
.cast-line{fill:none;stroke:rgba(230,230,220,.9);stroke-width:1.5}
.cast-sinker{fill:#5a5f66;stroke:rgba(0,0,0,.4);stroke-width:1}
.cast-sinker-img{display:none}

.catch-hint{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0));z-index:5;text-align:center;font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(0,0,0,.5)}
.catch-hint.hidden{display:none}

/* 낚시바를 감싸던 반투명 둥근 배경 패널은 사용자 요청으로 없앴다 —
   낚시바(.fishbar)만 화면에 떠 있고, 그 뒤 배경은 그대로 비친다. .fishbar
   자체도 배경을 투명하게 둔다 — 예전엔 #171C22 하드코딩 색이 채워져
   있었는데, "PPT 슬라이드형 에디터"로 바뀌면서 색상 피커(barColor)가
   빠진 채 그 하드코딩 색만 남아, 낚시바 이미지를 안 올렸거나 슬라이드
   전체를 안 덮으면 안 덮인 부분이 그냥 검게 보이는 문제가 있었다. */
.fishbar-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;display:flex;align-items:center;gap:14px;padding:18px 20px}
.fishbar-panel.hidden{display:none}
.fishbar{position:relative;width:52px;height:230px;border-radius:12px;overflow:hidden}
/* 낚시바 이미지 — 설정 화면(dev/minigame-fishing/index.html) 슬라이드
   에디터의 barLayer 배치(x,y,w,h, 슬라이드 기준 0~1)를 그대로 옮겨와
   절대위치로 놓는다. */
.fishbar-bar-img{position:absolute;pointer-events:none}
.fishbar-bar-img.hidden{display:none}
.fishbar-bar-img img{width:100%;height:100%;object-fit:fill;display:block}
/* 게이지 — 설정 화면에서 gaugeRegion을 지정해야만 나타난다(미지정 시
   기본 display:none). 위치/크기는 loadConfig가 gaugeRegion 기준으로
   매 판마다 한 번 정해준다. */
.fishbar-gauge{position:absolute;overflow:hidden;background:rgb(151,126,83);background-size:cover;background-repeat:no-repeat;background-position:center;display:none}
.fishbar-gauge-mask{position:absolute;left:0;right:0;top:0;background:rgba(5,7,10,.82)}
.fishbar-zone{position:absolute;border-radius:6px;opacity:.85;transition:background .2s;background-size:cover;background-position:center}
/* --fishbar-fish-size — loadConfig가 낚시바 폭(slideWidthPx) 기준으로 채운다.
   기본값(22px/26px)은 기본 폭(90px) 기준 크기와 같아 CSS 변수가 아직 안
   채워졌을 때도(로드 전 잠깐) 결과가 같다. */
.fishbar-fish{position:absolute;left:50%;transform:translate(-50%,-50%);font-size:var(--fishbar-fish-size,22px);filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.fishbar-fish img{width:var(--fishbar-fish-size,26px);height:var(--fishbar-fish-size,26px);object-fit:contain;image-rendering:pixelated}

/* 낚시 성공 시 잡은 물고기 아이콘이 추(찌) 자리에서 캐릭터에게로 천천히
   날아오는 연출용 임시 엘리먼트 — flyFishToCharacter가 매 캐치마다
   새로 만들고(el.stage에 추가) 도착하면 제거한다. */
.fish-fly{position:absolute;z-index:7;width:44px;height:44px;border-radius:12px;border:2px solid transparent;background-color:rgba(255,255,255,.12);background-repeat:no-repeat;image-rendering:pixelated;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));font-size:28px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}

/* ===== 아이템창 — 낚시 성공(물고기가 캐릭터에게 날아온 다음)에만 뜨는
   말풍선형 카드. 실패했을 때는 아무 화면도 뜨지 않고 그냥 대기 상태로
   돌아간다(missReaction/endCatch 참고). 화면 전체를 덮는 모달이 아니라
   캐릭터 머리 위에 떠 있는 인게임 엘리먼트다(positionItemPopup이 매번
   el.charStage 기준으로 위치를 다시 잡는다) — 확인 버튼 없이 화면
   아무 곳이나 탭하면 사라진다(pointer-events:none이라 카드 위를 눌러도
   그대로 el.frame의 pointerdown으로 뚫고 내려가 resetToIdle이 불린다).
   배경(액자) 그림과 아이콘 위치/크기는 dev/minigame-fishing/index.html의
   "아이템창" 탭(itemPopup config)에서 지정한다. */
.item-popup{position:absolute;z-index:9;display:none;pointer-events:none;transform:translate(-50%,-100%)}
.item-popup.show{display:block}
/* 카드 종횡비 — 업로드한 배경(액자) 이미지의 실제 자연 크기를 그대로
   따라간다(loadConfig가 --item-ar을 이미지 자연 크기로 채워줌). cover
   대신 contain을 쓰는 이유: 종횡비가 이미지와 정확히 같으므로 어느 쪽을
   써도 결과는 같지만, 이미지 로드가 늦어 기본 종횡비(280/260)로 잠깐
   그려질 때 contain이어야 그 사이에도 잘리지 않는다. */
.item-popup-card{position:relative;width:180px;aspect-ratio:var(--item-ar,280/260);border-radius:16px;background-size:contain;background-repeat:no-repeat;background-position:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:14px;gap:4px;overflow:hidden}
/* 업로드한 배경(액자) 그림이 없을 때만 쓰는 기본 카드 배경 — 업로드한
   그림은 이미 누끼 딴(투명 배경) 액자라 이 사각 배경/테두리/그림자까지
   같이 깔면 그 뒤로 각진 박스가 비쳐 보인다. loadConfig가 배경 자산
   유무에 따라 이 클래스를 토글한다. */
.item-popup-card.item-popup-card--fallback{background-color:var(--surface-1);border:1px solid rgba(255,255,255,.12);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.item-popup-title{position:absolute;top:10px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--green);text-transform:uppercase}
.item-popup-icon{position:absolute;border-radius:14px;background-color:rgba(255,255,255,.12);background-repeat:no-repeat;background-size:cover;background-position:center;image-rendering:pixelated;display:flex;align-items:center;justify-content:center;font-size:28px;transform:translate(-50%,-50%)}
.item-popup-name{font-size:14px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.item-popup-meta{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.75)}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="topbar">
    <a class="back-chip" href="/dev/minigame-fishing/" aria-label="뒤로">‹</a>
    <div class="count-chip" id="countChip">0마리</div>
  </div>

  <div class="stage" id="stage">
    <div class="status-line" id="statusLine">화면을 꾹 눌러 캐스팅 세기를 조절하세요</div>

    <div class="char-stage" id="charStage">
      <img id="charImg" class="hidden" alt="">
      <div class="char-fallback" id="charFallback">🧍</div>
    </div>

    <div class="bobber hidden" id="bobber">
      <div class="bobber-dot" id="bobberDot"></div>
      <img class="bobber-img" id="bobberImg" alt="">
      <div class="bite-mark hidden" id="biteMark">!</div>
    </div>

    <div class="bite-caught hidden" id="biteCaught">
      <div class="bite-caught-text" id="biteCaughtText">물었다!</div>
      <img class="bite-caught-img" id="biteCaughtImg" alt="">
    </div>

    <svg class="cast-svg hidden" id="castSvg">
      <path class="cast-line" id="castLinePath"></path>
      <circle class="cast-sinker" id="castSinker" r="5"></circle>
      <image class="cast-sinker-img" id="castSinkerImg" href="" preserveAspectRatio="xMidYMid meet"></image>
    </svg>

    <div class="fishbar-panel hidden" id="fishbarPanel">
      <div class="fishbar" id="fishbar">
        <div class="fishbar-bar-img hidden" id="fishbarBarImg"><img alt=""></div>
        <div class="fishbar-gauge" id="fishbarGauge">
          <div class="fishbar-gauge-mask" id="fishbarGaugeMask"></div>
        </div>
        <div class="fishbar-zone" id="fishbarZone"></div>
        <div class="fishbar-fish" id="fishbarFish">🐟</div>
      </div>
    </div>

  </div>

  <div class="cast-power-wrap hidden" id="castPowerWrap">
    <div class="cast-power-stage" id="castPowerStage">
      <img class="cast-power-gauge-img" id="castPowerGaugeImg" alt="">
      <div class="cast-power-track" id="castPowerTrack"><div class="cast-power-fill" id="castPowerFill"></div></div>
    </div>
    <div class="cast-power-label" id="castPowerLabel">0%</div>
  </div>
  <div class="catch-hint hidden" id="catchHint">누르고 있으면 캐치존이 올라가요 · 떼면 내려가요</div>

  <div class="item-popup" id="itemPopup">
    <div class="item-popup-card item-popup-card--fallback" id="itemPopupCard">
      <div class="item-popup-title">낚시 성공!</div>
      <div class="item-popup-icon" id="itemPopupIcon">🐟</div>
      <div class="item-popup-name" id="itemPopupName"></div>
      <div class="item-popup-meta" id="itemPopupMeta"></div>
    </div>
  </div>
</div>
<script>
function setVh100() { document.documentElement.style.setProperty('--vh100', window.innerHeight + 'px'); }
setVh100();
window.addEventListener('resize', setVh100);
window.addEventListener('orientationchange', setVh100);
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script src="/dev/assetDb.js"></script>
<script src="/dev/data/fishDefs.js"></script>
<script>
/* =========================================================================
   낚시 미니게임 플레이 화면. 흐름: 캐스팅(대기 탭) → 캐스팅 모션 재생 →
   찌 던지기 → 입질 대기 → 입질(반응 탭) → 낚시바(잡아채기, 홀드/릴리즈로
   캐치존을 움직여 물고기를 가둔다) → 올리기 모션 재생 → 결과.

   타입(물고기 움직임 패턴)은 다른 미니게임들과 같은 관례로 쿼리스트링
   (?diff=&motion=), 캐스팅·올리기 프레임과 낚시바 디자인은 AssetDB.

   localStorage에서 직접 읽는 것과 같은 자산-데이터 취급).
   ========================================================================= */

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// assetDb.js의 dataUrl은 더 이상 base64가 아니라 실제 Supabase Storage 공개
// URL이다 — 업로드 직후 곧바로 재생 화면을 열면 Storage 쪽 전파가 아직
// 안 끝나 첫 로드가 실패하고(그 자리엔 background-color만 남아 "단색으로만
// 보임") 새로고침하면 되던 증상의 유력한 원인이라, background-image로 바로
// 꽂기 전에 이 헬퍼로 먼저 로드를 검증하고 실패하면 짧게 대기 후 재시도한다.
function preloadWithRetry(url, retries, delayMs) {
  return new Promise(resolve => {
    const attempt = (remaining) => {
      const img = new Image();
      img.onload = () => resolve(url);
      img.onerror = () => {
        if (remaining > 0) setTimeout(() => attempt(remaining - 1), delayMs);
        else resolve(url); // 재시도 다 써도 일단 원래 URL로 시도는 하게 둔다
      };
      img.src = url;
    };
    attempt(retries);
  });
}

// 게이지 색 — 고정 그라데이션(항상 빨강~연두 전체 범위를 깔아두고 마스크로
// 일부만 드러내는 방식) 대신, "지금 진행도 값"을 0%(빨강)~70%(연두) 사이에서
// 내분해 하나의 단색으로 계산한다. 예: 35%면 주황/노랑 계열, 70% 이상은
// 그 이상 색이 안 바뀌고 연두로 고정. --signal-red(#D94141)/--green(#3ECF6B)
// CSS 변수와 같은 값을 RGB로 하드코딩해서 매 프레임 보간한다.
const GAUGE_COLOR_STOPS = { red: [217, 65, 65], green: [62, 207, 107], capPct: 70 };

// 물고기 등급 테두리 색 — 날아오는 물고기 아이콘(.fish-fly)에서 잡은
// 물고기의 등급(fishDefs.js grade)을 테두리로 바로 알아볼 수 있게 한다.
const GRADE_BORDER_COLORS = { '일반': '#8B95A1', '레어': '#3B82F6', '희귀': '#A855F7', '전설': '#FFD12E' };
function gaugeColorForProgress(pct) {
  const t = clamp(pct, 0, GAUGE_COLOR_STOPS.capPct) / GAUGE_COLOR_STOPS.capPct;
  const [r0, g0, b0] = GAUGE_COLOR_STOPS.red;
  const [r1, g1, b1] = GAUGE_COLOR_STOPS.green;
  const r = Math.round(r0 + (r1 - r0) * t);
  const g = Math.round(g0 + (g1 - g0) * t);
  const b = Math.round(b0 + (b1 - b0) * t);
  return `rgb(${r},${g},${b})`;
}

/* ===== 설정 로드 (AssetDB) — 실패해도 게임은 도형 폴백으로 계속 동작한다. ===== */
async function loadConfig() {
  let cfg = { castingFrames: [], reelingFrames: [], barDesign: {}, castingSheetAssetId: null, castingFrameOverrides: {} };
  try { cfg = await AssetDB.getFishingConfig(); } catch (e) { /* 오프라인/미설정 — 기본값으로 진행 */ }
  // castingFrames(개별 업로드 배열)는 더 이상 안 쓴다 — 캐스팅은 이제
  // castingSheetAssetId 시트 1장을 잘라 쓴다(dev/minigame-fishing/index.html
  // 참고). 올리기(reelingFrames)는 여전히 예전 방식 그대로.
  const ids = [].concat(cfg.reelingFrames || []);
  const design = cfg.barDesign || {};
  if (design.fishIconAssetId) ids.push(design.fishIconAssetId);
  if (design.barLayer && design.barLayer.assetId) ids.push(design.barLayer.assetId);
  if (design.catchLayer && design.catchLayer.assetId) ids.push(design.catchLayer.assetId);
  if (design.sinkerImageAssetId) ids.push(design.sinkerImageAssetId);
  if (design.biteStampAssetId) ids.push(design.biteStampAssetId);
  if (design.gaugeImageAssetId) ids.push(design.gaugeImageAssetId);
  if (cfg.fishSheetAssetId) ids.push(cfg.fishSheetAssetId);
  if (cfg.castingSheetAssetId) ids.push(cfg.castingSheetAssetId);
  if (cfg.backgroundAssetId) ids.push(cfg.backgroundAssetId);
  if (cfg.castGaugeAssetId) ids.push(cfg.castGaugeAssetId);
  const itemPopupCfg = cfg.itemPopup || {};
  if (itemPopupCfg.backgroundAssetId) ids.push(itemPopupCfg.backgroundAssetId);
  let assets = [];
  try { assets = await AssetDB.getAssetsByIds(ids); } catch (e) { /* 위와 동일 */ }
  const byId = new Map(assets.map(a => [a.id, a]));
  reelFrameUrls = (cfg.reelingFrames || []).map(id => byId.get(id)).filter(Boolean).map(a => a.dataUrl);
  const castingSheetAsset = cfg.castingSheetAssetId ? byId.get(cfg.castingSheetAssetId) : null;
  if (castingSheetAsset) {
    const img = await new Promise(resolve => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => resolve(im);
      im.onerror = () => resolve(null);
      im.src = castingSheetAsset.dataUrl;
    });
    // outputSize를 안 넘긴다 — buildMotionFrameDataUrls가 원본 크롭 해상도를
    // 그대로 살린다(§신규 버그 수정: 예전엔 64px로 강제 축소해서 84px
    // char-stage에서 다시 확대되며 흐리게 보였다).
    castFrameUrls = img ? buildMotionFrameDataUrls(img, cfg.castingFrameOverrides) : [];
  } else {
    castFrameUrls = [];
  }
  castFrameDurations = (cfg.castingFrameDurations && cfg.castingFrameDurations.length) ? cfg.castingFrameDurations : null;
  castingFrameRodTips = cfg.castingFrameRodTips || {};
  castPhysics = Object.assign({ gravityMps2: 9.8, vxScale: 1 }, cfg.castPhysics || {});
  const fishSheetAsset = cfg.fishSheetAssetId ? byId.get(cfg.fishSheetAssetId) : null;
  fishSheetUrl = fishSheetAsset ? fishSheetAsset.dataUrl : null;
  fishIconOverrides = cfg.fishIconOverrides || {};
  if (fishSheetUrl) {
    fishSheetDims = await new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
      img.onerror = () => resolve(null);
      img.src = fishSheetUrl;
    });
  }

  // 배경화면 — 업로드가 없으면 .frame CSS 기본값(하늘/바다 그라데이션)이
  // 그대로 보이도록 인라인 스타일을 비워둔다. 업로드가 있으면 cover로
  // 화면을 꽉 채운다 — .frame의 background 단축 속성이 gradient의
  // position/size/repeat를 초기값으로 리셋해두므로 image만이 아니라
  // 세 속성 모두 함께 지정해야 한다.
  const backgroundAsset = cfg.backgroundAssetId ? byId.get(cfg.backgroundAssetId) : null;
  el.frame.style.backgroundImage = backgroundAsset ? `url(${backgroundAsset.dataUrl})` : '';
  el.frame.style.backgroundSize = backgroundAsset ? 'cover' : '';
  el.frame.style.backgroundPosition = backgroundAsset ? 'center' : '';
  el.frame.style.backgroundRepeat = backgroundAsset ? 'no-repeat' : '';

  // 낚시바 모듈 크기 — 설정 화면 슬라이드 에디터(dev/minigame-fishing/
  // index.html)의 슬라이드 실제 px 크기를 그대로 쓴다.
  const slideWidthPx = design.slideWidthPx || 90;
  el.fishbar.style.width = slideWidthPx + 'px';
  el.fishbar.style.height = (design.slideHeightPx || 260) + 'px';

  // 물고기 아이콘 크기 — 기본 폭(90px) 기준 26px를 넘지 않되, 낚시바가
  // 그보다 좁게 설정되면(slideWidthInput min 40px) 그 폭에 비례해서
  // 줄어든다. 폭에 상관없이 항상 26px 고정이면 좁은 낚시바에서 아이콘이
  // 바 너비를 넘어가 튀어나와 보이던 문제가 있었다.
  const fishIconSizePx = Math.min(26, slideWidthPx * 0.4);
  el.fishbarFish.style.setProperty('--fishbar-fish-size', fishIconSizePx + 'px');

  // 낚시바 이미지 — barLayer(x,y,w,h, 슬라이드 기준 0~1 비율)를 그대로
  // 절대위치로 옮겨온다(설정 화면 슬라이드와 좌표계가 동일하므로 변환 없음).
  const barImageAsset = design.barLayer && design.barLayer.assetId ? byId.get(design.barLayer.assetId) : null;
  if (barImageAsset && design.barLayer) {
    el.fishbarBarImg.querySelector('img').src = await preloadWithRetry(barImageAsset.dataUrl, 3, 500);
    el.fishbarBarImg.style.left = (design.barLayer.x * 100) + '%';
    el.fishbarBarImg.style.top = (design.barLayer.y * 100) + '%';
    el.fishbarBarImg.style.width = (design.barLayer.w * 100) + '%';
    el.fishbarBarImg.style.height = (design.barLayer.h * 100) + '%';
    el.fishbarBarImg.classList.remove('hidden');
  } else {
    el.fishbarBarImg.classList.add('hidden');
  }

  // 캐치바(캐치존) — zoneRegion(트랙, 슬라이드 기준 0~1)이 화면상 어디에
  // 놓이는지 정하고, catchLayer(캐치바 이미지가 슬라이드 위 어디에 얼마나
  // 크게 배치됐는지)를 그 트랙 기준 비율로 다시 매핑해 좌우 위치/폭/높이를
  // 정한다. 세로 이동 자체(캐치존 y)는 계속 0~100 추상 공간에서 물리대로
  // 계산되고(updateZone), 여기서 정하는 건 트랙의 화면상 배치뿐이다.
  const zoneRegion = design.zoneRegion;
  const catchLayer = design.catchLayer;
  const catchImageAsset = catchLayer && catchLayer.assetId ? byId.get(catchLayer.assetId) : null;
  // background(숏핸드)를 먼저 설정해야 한다 — backgroundImage 다음에 설정하면
  // 숏핸드가 방금 지정한 background-image를 초기화해버린다.
  el.fishbarZone.style.background = '#59B8C8';
  el.fishbarZone.style.backgroundImage = catchImageAsset ? `url(${await preloadWithRetry(catchImageAsset.dataUrl, 3, 500)})` : '';
  if (zoneRegion) {
    zoneTrack = { x: zoneRegion.x * 100, y: zoneRegion.y * 100, w: zoneRegion.w * 100, h: zoneRegion.h * 100 };
    if (catchLayer) {
      const relX = clamp((catchLayer.x - zoneRegion.x) / zoneRegion.w, 0, 1);
      const relW = clamp(catchLayer.w / zoneRegion.w, 0.05, 1);
      zoneSizePct = clamp(catchLayer.h / zoneRegion.h * 100, 5, 95);
      el.fishbarZone.style.left = (zoneTrack.x + relX * zoneTrack.w) + '%';
      el.fishbarZone.style.width = (relW * zoneTrack.w) + '%';
    } else {
      zoneSizePct = 28;
      el.fishbarZone.style.left = zoneTrack.x + '%';
      el.fishbarZone.style.width = zoneTrack.w + '%';
    }
    el.fishbarZone.style.height = (zoneSizePct / 100 * zoneTrack.h) + '%';
  } else {
    zoneTrack = null;
    zoneSizePct = 28;
    el.fishbarZone.style.left = '0%';
    el.fishbarZone.style.width = '100%';
    el.fishbarZone.style.height = zoneSizePct + '%';
  }

  // 게이지 — gaugeRegion을 지정했을 때만 나타난다(미지정 시 기본 숨김).
  if (design.gaugeRegion) {
    const gr = design.gaugeRegion;
    el.fishbarGauge.style.left = (gr.x * 100) + '%';
    el.fishbarGauge.style.top = (gr.y * 100) + '%';
    el.fishbarGauge.style.width = (gr.w * 100) + '%';
    el.fishbarGauge.style.height = (gr.h * 100) + '%';
    // CSS 기본값이 display:none이라 style.display를 빈 문자열로 되돌리면
    // 그 CSS 규칙이 그대로 이어져 계속 안 보인다 — 반드시 명시적으로
    // 'block'을 지정해야 실제로 나타난다(gaugeRegion을 지정해도 게이지가
    // 화면에 전혀 안 보이던 버그의 원인).
    el.fishbarGauge.style.display = 'block';
  } else {
    el.fishbarGauge.style.display = 'none';
  }

  const fishIconAsset = design.fishIconAssetId ? byId.get(design.fishIconAssetId) : null;
  if (fishIconAsset) el.fishbarFish.innerHTML = `<img src="${fishIconAsset.dataUrl}" alt="">`;

  const sinkerImageAsset = design.sinkerImageAssetId ? byId.get(design.sinkerImageAssetId) : null;
  sinkerImageUrl = sinkerImageAsset ? sinkerImageAsset.dataUrl : null;
  el.castSinker.style.display = sinkerImageUrl ? 'none' : '';
  el.castSinkerImg.style.display = sinkerImageUrl ? '' : 'none';
  if (sinkerImageUrl) el.castSinkerImg.setAttribute('href', sinkerImageUrl);
  // 착수 후 입질 대기 중 계속 떠 있는 bobber(찌)도 같은 추 이미지를 쓴다 —
  // 캐스팅 비행 중에만 이미지가 보이고 착수하자마자 기본 빨간 마름모로
  // 바뀌어 보이던 문제(사용자 보고: "이미지 올려도 적용 안 됨")를 해결한다.
  el.bobberDot.style.display = sinkerImageUrl ? 'none' : '';
  el.bobberImg.style.display = sinkerImageUrl ? 'block' : 'none';
  if (sinkerImageUrl) el.bobberImg.src = sinkerImageUrl;

  // 잡아채기 게이지 채움 이미지 — 있으면 fishbarGauge 배경으로 깔고,
  // 없으면 renderBarFrame이 매 프레임 진행도 색으로 칠한다. 이미지는
  // 한 번만 지정해두면 되니(색은 진행도가 바뀔 때마다 다시 칠해야 해서
  // 매 프레임 갱신) 여기 loadConfig에서 한 번만 적용한다.
  const gaugeImageAsset = design.gaugeImageAssetId ? byId.get(design.gaugeImageAssetId) : null;
  gaugeImageUrl = gaugeImageAsset ? await preloadWithRetry(gaugeImageAsset.dataUrl, 3, 500) : null;
  el.fishbarGauge.style.backgroundImage = gaugeImageUrl ? `url(${gaugeImageUrl})` : 'none';

  // 캐스팅 게이지 이미지 — 이미지와 채움 영역(castGaugeFillRegion)이 둘 다
  // 있어야 커스텀 게이지를 켠다(하나만 있으면 기본 막대 게이지로 그대로
  // 폴백). 게이지 스테이지의 종횡비를 실제 업로드 이미지 크기에 맞춰야
  // fillRegion(이미지 자연 크기 대비 0~1)이 화면에서도 같은 자리를 가리킨다.
  const castGaugeAsset = cfg.castGaugeAssetId ? byId.get(cfg.castGaugeAssetId) : null;
  const castGaugeFillRegion = cfg.castGaugeFillRegion;
  if (castGaugeAsset && castGaugeFillRegion) {
    el.castPowerWrap.classList.add('custom-gauge');
    const gaugeUrl = await preloadWithRetry(castGaugeAsset.dataUrl, 3, 500);
    el.castPowerGaugeImg.src = gaugeUrl;
    const dims = await new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
      img.onerror = () => resolve(null);
      img.src = gaugeUrl;
    });
    if (dims) el.castPowerStage.style.setProperty('--gauge-ar', dims.w + '/' + dims.h);
    el.castPowerTrack.style.left = (castGaugeFillRegion.x * 100) + '%';
    el.castPowerTrack.style.top = (castGaugeFillRegion.y * 100) + '%';
    el.castPowerTrack.style.width = (castGaugeFillRegion.w * 100) + '%';
    el.castPowerTrack.style.height = (castGaugeFillRegion.h * 100) + '%';
  } else {
    el.castPowerWrap.classList.remove('custom-gauge');
    el.castPowerTrack.style.left = '';
    el.castPowerTrack.style.top = '';
    el.castPowerTrack.style.width = '';
    el.castPowerTrack.style.height = '';
  }

  const biteStampAsset = design.biteStampAssetId ? byId.get(design.biteStampAssetId) : null;
  biteStampImageUrl = biteStampAsset ? biteStampAsset.dataUrl : null;
  el.biteCaughtText.style.display = biteStampImageUrl ? 'none' : '';
  el.biteCaughtImg.style.display = biteStampImageUrl ? 'block' : 'none';
  if (biteStampImageUrl) el.biteCaughtImg.src = biteStampImageUrl;

  idleFrameUrl = castFrameUrls[0] || null;
  if (idleFrameUrl) {
    el.charImg.src = idleFrameUrl;
    el.charImg.classList.remove('hidden');
    el.charFallback.classList.add('hidden');
  }

  // 아이템창 — 낚시 성공 후(물고기가 캐릭터에게 날아온 다음) 뜨는 팝업의
  // 배경/아이콘 위치·크기. dev/minigame-fishing/index.html의 "아이템창" 탭 설정.
  // 카드 종횡비(--item-ar)를 업로드한 배경 이미지의 실제 자연 크기로
  // 맞춰야 액자 그림이 잘리거나 늘어나지 않고 업로드한 그대로 보인다.
  const itemPopupBgAsset = itemPopupCfg.backgroundAssetId ? byId.get(itemPopupCfg.backgroundAssetId) : null;
  if (itemPopupBgAsset) {
    const itemBgUrl = await preloadWithRetry(itemPopupBgAsset.dataUrl, 3, 500);
    el.itemPopupCard.style.backgroundImage = `url(${itemBgUrl})`;
    el.itemPopupCard.classList.remove('item-popup-card--fallback');
    const itemBgDims = await new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
      img.onerror = () => resolve(null);
      img.src = itemBgUrl;
    });
    if (itemBgDims) el.itemPopupCard.style.setProperty('--item-ar', itemBgDims.w + '/' + itemBgDims.h);
  } else {
    el.itemPopupCard.style.backgroundImage = '';
    el.itemPopupCard.style.removeProperty('--item-ar');
    el.itemPopupCard.classList.add('item-popup-card--fallback');
  }
  itemIconPos = itemPopupCfg.iconPos || { x: 0.5, y: 0.36 };
  itemIconSizePx = itemPopupCfg.iconSizePx || 64;
  el.itemPopupIcon.style.left = (itemIconPos.x * 100) + '%';
  el.itemPopupIcon.style.top = (itemIconPos.y * 100) + '%';
  el.itemPopupIcon.style.width = itemIconSizePx + 'px';
  el.itemPopupIcon.style.height = itemIconSizePx + 'px';
}

/* ===== 캐스팅/올리기 프레임 순차 재생 =====
   frameMs는 고정 ms 숫자(올리기) 또는 프레임별 ms 배열(캐스팅,
   castFrameDurations — 설정 화면 재생 타임라인에서 조정한 값)을 받는다.
   onFrame(i)는 선택 — 캐스팅 던지기(throwSinker 이전, releasePowerAndCast)만
   써서, 애니메이션이 진행되는 동안에도 매 프레임 낚싯대 끝 위치가 바뀌는
   대로 낚싯줄(현수선)을 다시 그린다. */
function playFrameSequence(urls, frameMs, onFrame) {
  return new Promise(resolve => {
    if (!urls.length) { resolve(); return; }
    el.charImg.classList.remove('hidden');
    el.charFallback.classList.add('hidden');
    let i = 0;
    function showAndScheduleNext() {
      el.charImg.src = urls[i];
      if (onFrame) onFrame(i);
      const ms = Array.isArray(frameMs) ? (frameMs[i] || 90) : frameMs;
      i++;
      setTimeout(i >= urls.length ? resolve : showAndScheduleNext, ms);
    }
    showAndScheduleNext();
  });
}

/* ===== 캐스팅 모션 윈드업 — 홀드 시작하자마자 1→2번 프레임을 재생하고
   2번에서 멈춰 유지한다(놓을 때까지). 놓으면 releasePowerAndCast가
   3번 프레임부터 이어서 순차 재생한다. 프레임이 2장 미만이면 할 게 없다.
   castWindupFrameIndex는 지금 화면에 보이는 프레임 번호를 따로 기록해둔다
   — 손을 떼는 순간(releasePowerAndCast) 줄/추가 "이미 그 시점에 보이던
   낚싯대 끝"에서 생기게 하려면 항상 1번 프레임이 아니라 이 값을 origin
   계산에 써야 한다. */
let castWindupFrameIndex = 0;
function playCastWindup() {
  castWindupFrameIndex = 0;
  if (castFrameUrls.length < 2) return;
  el.charImg.classList.remove('hidden');
  el.charFallback.classList.add('hidden');
  el.charImg.src = castFrameUrls[0];
  const ms = Array.isArray(castFrameDurations) ? (castFrameDurations[0] || 90) : (castFrameDurations || 90);
  setTimeout(() => {
    if (gameState !== 'charging') return; // 그 사이 이미 놓였으면 덮어쓰지 않는다
    el.charImg.src = castFrameUrls[1];
    castWindupFrameIndex = 1;
  }, ms);
}

/* ===== 캐스팅 세기 조절 (누르고 있는 동안) ===== */
function startPowerCharge() {
  gameState = 'charging';
  el.statusLine.textContent = '세기 조절 중... 손을 떼면 캐스팅!';
  el.castPowerWrap.classList.remove('hidden');
  playCastWindup();
  castChargeStartT = performance.now();
  const periodSec = CAST_POWER_PERIOD_MS / 1000;
  function tick(ts) {
    if (gameState !== 'charging') return;
    const t = (ts - castChargeStartT) / 1000;
    const phase = (t / periodSec) * (2 * Math.PI);
    castPower = 50 - 50 * Math.cos(phase); // 0 → 100 → 0 사인파
    el.castPowerFill.style.width = castPower + '%';
    el.castPowerLabel.textContent = Math.round(castPower) + '%';
    castChargeRaf = requestAnimationFrame(tick);
  }
  castChargeRaf = requestAnimationFrame(tick);
}

/* ===== 세기 확정 → 캐스팅 모션 → 추 던지기(물리) → 입질 대기 =====
   손을 떼는(release) 순간 낚싯줄을 바로 만든다 — origin은 그 순간 화면에
   이미 보이고 있던 윈드업 프레임(castWindupFrameIndex)의 낚싯대 끝이다.
   추 낙하 물리(throwSinker)는 release 즉시 시작한다 — 예전엔 남은
   팔로우스루 프레임(3~6번)이 다 재생될 때까지 기다린 뒤에야 물리를
   시작해서 "손을 떼도 한참 있다가 던져진다"는 체감 지연이 있었다.
   이제 팔로우스루 애니메이션과 추 낙하 물리를 동시에 진행하고, 낚싯줄의
   낚싯대 쪽 끝(rodTip)만 애니메이션 진행에 따라 계속 갱신한다(추 쪽
   끝은 throwSinker가 매 프레임 그린다) — 낚싯대를 따라 줄이 움직이는
   것처럼 보이면서도 추는 릴리즈 순간부터 바로 날아간다. */
async function releasePowerAndCast() {
  if (gameState !== 'charging') return;
  cancelAnimationFrame(castChargeRaf);
  const power = castPower;
  el.castPowerWrap.classList.add('hidden');
  gameState = 'casting';
  el.statusLine.textContent = '캐스팅...';

  const frameRect = el.frame.getBoundingClientRect();
  el.castSvg.setAttribute('viewBox', `0 0 ${frameRect.width} ${frameRect.height}`);
  const origin = rodTipPxForFrame(castWindupFrameIndex, frameRect); // 뗄 때 이미 화면에 보이던 프레임의 낚싯대 끝 — 물리 시작점
  el.bobber.classList.add('hidden');
  el.castSvg.classList.remove('hidden');
  renderCastLine(origin, origin);
  vibrate(15);

  let rodTip = origin; // 팔로우스루 프레임이 재생되는 동안 계속 갱신 — throwSinker의 렌더 루프가 매 프레임 읽는다
  const animPromise = (async () => {
    if (castFrameUrls.length > 2) {
      // 1,2번은 윈드업(playCastWindup)에서 이미 재생했다 — 3번부터 이어서.
      // onFrame(i)의 i는 remainingUrls 기준(0부터 다시 셈)이라, 원래
      // 6프레임 인덱스를 기대하는 rodTipPxForFrame에는 +2해서 넘긴다.
      const remainingUrls = castFrameUrls.slice(2);
      const remainingDurations = Array.isArray(castFrameDurations) ? castFrameDurations.slice(2) : castFrameDurations;
      await playFrameSequence(remainingUrls, remainingDurations || 90, (i) => {
        rodTip = rodTipPxForFrame(i + 2, frameRect);
      });
    } else if (!castFrameUrls.length) {
      el.charFallback.style.transition = 'transform .35s ease';
      el.charFallback.style.transform = 'rotate(-25deg)';
      await wait(350);
      el.charFallback.style.transform = 'rotate(0deg)';
    }
  })();
  // 캐스팅이 끝난 뒤에도 el.charImg는 그대로 두면 캐스팅 마지막 프레임
  // 포즈에 머문다(playFrameSequence가 이미 그렇게 남겨둠) — idle로
  // 되돌리지 않아야 낚싯대 끝 위치가 대기/입질 내내 그 프레임 기준으로
  // 유지된다. idle 포즈로는 resetToIdle(새 판 시작)에서만 되돌아간다.
  const throwPromise = throwSinker(power, origin, frameRect, () => rodTip);
  await Promise.all([animPromise, throwPromise]);
  waitForBite();
}

// 낚싯대 끝 위치 — dev/minigame-fishing/index.html의 낚시대 끝 지정
// 도구에서 프레임별로 저장한 정규화 좌표(castingFrameRodTips, char-stage
// 박스 기준 0~1)를 실제 char-stage 박스 픽셀 크기에 곱해 el.frame 기준
// 픽셀 좌표로 바꾼다. 지정 안 한 프레임은 DEFAULT_ROD_TIP_FRAC로 폴백.
function rodTipPxForFrame(frameIndex, frameRect) {
  const charRect = el.charStage.getBoundingClientRect();
  const pt = castingFrameRodTips[frameIndex] || DEFAULT_ROD_TIP_FRAC;
  return {
    x: charRect.left - frameRect.left + pt.x * charRect.width,
    y: charRect.top - frameRect.top + pt.y * charRect.height,
  };
}

// 추를 던진다 — 수평은 등속(v_x = dx/T, dx는 세기(게이지)에 비례)으로
// x축을 따라 무조건 직진하고, 수직은 야구공을 던진 듯 살짝 떠올랐다가
// 떨어지는 포물선(v_y = vy0 + g·t, vy0<0=위로 발사)이다. 체공 시간(T)은
// 1m를 castPhysics.gravityMps2 중력가속도로 자유낙하할 때 걸리는 시간
// (설정 화면 '캐스팅 모션' 탭의 자유낙하 속도 슬라이더로 조절)으로 정하고,
// 그 T 안에 정확히 물 라인까지의 픽셀 거리(h0)만큼 떨어지도록 vy0/픽셀
// 중력(g)을 역산한다 — gravityMps2가 클수록 T가 짧아져(T=√(2H/g)) 더
// 빨리 떨어진다. dx(수평거리)는 세기(게이지)로 정해지는 기본값에
// castPhysics.vxScale(역시 슬라이더)을 곱해 늘리거나 줄인다 — 세기와
// 무관하게 항상 같은 체공 시간이 나오고, 세기는 수평거리(dx)만 늘린다
// ("세질수록 멀리 감"). ARC_STRENGTH는 얼마나 높이 떠올랐다가 떨어지는지
// (평균 낙하속도 h0/T 대비 초기 상승 속도의 비율) 조절하는 값 —
// dev/minigame-fishing/index.html의 추 이동 모션 테스트 도구는 이
// castPhysics 값과 별개로 자체 미리보기 상수를 쓴다. 착수 지점에 기존
// 찌(bobber)를 그대로 가져다 놓아 입질 대기 이후 로직은 손대지 않는다.
function throwSinker(power, origin, frameRect, getRodTip) {
  return new Promise(resolve => {
    const minDx = frameRect.width * 0.10, maxDx = frameRect.width * 0.68;
    const baseDx = minDx + (power / 100) * (maxDx - minDx);
    const dx = baseDx * (castPhysics.vxScale || 1);
    // 착지선(waterY)은 화면 절대 위치(47%) 대신 캐릭터가 서 있는 줄(발 밑,
    // char-stage 아래쪽 끝)에 맞춘다 — 화면 고정 비율로는 캐릭터 위치와
    // 무관하게 항상 같은 높이라, 캐릭터가 화면 아래쪽에 있을 때 추가
    // 캐릭터보다 한참 위에 떠 보이는 문제가 있었다.
    const charRect = el.charStage.getBoundingClientRect();
    const waterY = charRect.bottom - frameRect.top;
    const h0 = Math.max(10, waterY - origin.y);
    const FREE_FALL_HEIGHT_M = 1;
    const gravityMps2 = castPhysics.gravityMps2 || 9.8;
    const ARC_STRENGTH = 1.0;
    const T = Math.sqrt(2 * FREE_FALL_HEIGHT_M / gravityMps2);
    const vy0 = -ARC_STRENGTH * (h0 / T);
    const g = 2 * (h0 - vy0 * T) / (T * T);
    const vx0 = dx / T;

    let start = null;
    function frame(ts) {
      if (start === null) start = ts;
      const t = (ts - start) / 1000;
      if (t >= T) { finish(dx); return; }
      const x = origin.x + vx0 * t;
      const y = origin.y + vy0 * t + 0.5 * g * t * t;
      // 낚싯줄의 낚싯대 쪽 끝은 물리 시작점(origin)에 고정하지 않고, 아직
      // 재생 중인 팔로우스루 애니메이션의 현재 프레임 낚싯대 끝을 따라간다
      // (releasePowerAndCast가 넘겨준 getRodTip) — 던지기는 release 즉시
      // 시작하지만, 손 위치는 애니메이션이 끝날 때까지 계속 움직이므로.
      renderCastLine(getRodTip ? getRodTip() : origin, { x, y });
      castFlightRaf = requestAnimationFrame(frame);
    }
    function finish(finalDx) {
      // 착수해도 castSvg(낚싯줄)는 숨기지 않는다 — 추가 물에 떠 있는 동안
      // (입질 대기 내내) 낚싯대와 추가 계속 줄로 이어져 보여야 한다.
      // handleReactionTap(입질 물어서 잡아채기로 넘어갈 때)과
      // abortWaitingReel/missReaction/resetToIdle(대기 중단·실패·리셋)에서
      // 각자 자기 타이밍에 숨긴다.
      renderCastLine(getRodTip ? getRodTip() : origin, { x: origin.x + finalDx, y: waterY });
      const landingXPct = clamp((origin.x + finalDx) / frameRect.width * 100, 5, 95);
      const landingYPct = waterY / frameRect.height * 100;
      el.bobber.style.transition = 'none';
      el.bobber.style.left = landingXPct + '%';
      el.bobber.style.top = landingYPct + '%';
      el.bobber.classList.remove('hidden');
      // syncLineToBobber는 여기서 바로 부르지 않는다 — 이 시점엔 아직
      // gameState가 'casting'이라(waitForBite가 releasePowerAndCast의
      // Promise.all이 끝난 뒤에야 'waiting'으로 바꾼다) 루프 첫 tick이
      // "대기 중 아님"으로 보고 즉시 멈춰버린다. 낚싯대 끝 좌표만 남겨두고
      // 루프 시작은 waitForBite로 미룬다.
      lastRodTipPt = getRodTip ? getRodTip() : origin;
      resolve();
    }
    castFlightRaf = requestAnimationFrame(frame);
  });
}

// 낚싯대 끝(p0)~추(p1) 사이를 현수선(catenary, y=a·cosh(x/a)=a·(e^(x/a)+e^(-x/a))/2)
// 으로 그린다. 실제 줄 길이는 두 점 사이 직선거리(D)에 여유(12%)를 준
// 값(L)으로 정하고, L·dx·dy로부터 현수선 매개변수 a를 이분법으로 구한다
// (전형적인 "두 점을 지나는 현수선" 문제).
const SINKER_IMG_SIZE = 22; // px, css픽셀 = svg viewBox 단위(카메라 좌표계 그대로)
function renderCastLine(p0, p1) {
  el.castSinker.setAttribute('cx', p1.x);
  el.castSinker.setAttribute('cy', p1.y);
  if (sinkerImageUrl) {
    el.castSinkerImg.setAttribute('x', p1.x - SINKER_IMG_SIZE / 2);
    el.castSinkerImg.setAttribute('y', p1.y - SINKER_IMG_SIZE / 2);
    el.castSinkerImg.setAttribute('width', SINKER_IMG_SIZE);
    el.castSinkerImg.setAttribute('height', SINKER_IMG_SIZE);
  }
  const pts = catenaryPoints(p0, p1);
  el.castLinePath.setAttribute('d', 'M' + pts.map(p => `${p.x},${p.y}`).join(' L'));
}

function catenaryPoints(p0, p1, samples) {
  samples = samples || 16;
  const dx = p1.x - p0.x, dy = p1.y - p0.y; // 화면 좌표계 — 아래로 갈수록 y가 커진다
  const D = Math.hypot(dx, dy);
  if (D < 4 || Math.abs(dx) < 2) return [p0, p1]; // 거의 수직/한 점 — 커브 의미 없음
  const L = D * 1.12;
  // y=a·cosh(x/a)+q는 항상 볼록(가운데가 "더 작은" y 쪽으로 처지는) 함수라,
  // 위로 갈수록 y가 커지는 보통의 수학 좌표계에서는 그 처지는 방향이
  // 곧 "아래"라 정확히 늘어진 케이블 모양이 된다. 그런데 여긴 화면
  // 좌표계(아래로 갈수록 y가 커짐)라 dy를 그대로 쓰면 케이블이 화면에서
  // 위로(작은 y) 볼록하게 그려진다 — 다리 아치처럼. dy 부호를 뒤집은
  // mathDy로 풀고, 마지막에 다시 부호를 뒤집어(p0.y - ylMath) 화면
  // 좌표로 되돌린다.
  const mathDy = -dy;
  const target = Math.sqrt(Math.max(L * L - mathDy * mathDy, 0));
  // f(a) = a로 정해지는 케이블 길이 - 목표 길이(target). a가 작을수록
  // 더 팽팽히 휘어 길이가 길어지므로 f는 a에 대해 단조 감소한다 —
  // f(mid)>0(길이 초과)이면 a를 늘려야 하니 lo를 올린다.
  function f(a) { return 2 * a * Math.sinh(dx / (2 * a)) - target; }
  let lo = 1e-3, hi = Math.max(Math.abs(dx), 1) * 50;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (f(mid) > 0) lo = mid; else hi = mid;
  }
  const a = (lo + hi) / 2;
  const p = (dx - a * Math.log((L + mathDy) / (L - mathDy))) / 2;
  const q = -a * Math.cosh(p / a);
  const pts = [];
  for (let i = 0; i <= samples; i++) {
    const xl = dx * i / samples;
    const ylMath = a * Math.cosh((xl - p) / a) + q;
    pts.push({ x: p0.x + xl, y: p0.y - ylMath });
  }
  return pts;
}

// 착수 후(입질 대기 중~입질) el.bobber는 CSS 애니메이션(bob-idle/bite-dip)으로
// 위아래로 움직이는데, renderCastLine은 착수 순간의 좌표에 한 번만 그려두고
// 끝이라 줄(castSvg)이 그 자리에 고정된 채 추만 애니메이션으로 까닥거려서
// 줄과 추가 따로 노는 것처럼 보였다. gameState가 waiting/bite인 동안 매
// 프레임 el.bobber(정확히는 실제 보이는 도트/이미지)의 현재 화면 위치를
// 읽어 줄 끝(p1)을 거기 맞춰 다시 그린다 — CSS 키프레임 수치를 그대로
// 베끼는 대신 실제 렌더된 위치를 읽으므로 애니메이션이 바뀌어도 항상 맞다.
function syncLineToBobber(rodTipPt) {
  cancelAnimationFrame(bobLineRaf);
  function tick() {
    if (gameState !== 'waiting' && gameState !== 'bite') { bobLineRaf = null; return; }
    const frameRect = el.frame.getBoundingClientRect();
    const sinkerEl = sinkerImageUrl ? el.bobberImg : el.bobberDot;
    const rect = sinkerEl.getBoundingClientRect();
    renderCastLine(rodTipPt, {
      x: rect.left + rect.width / 2 - frameRect.left,
      y: rect.top + rect.height / 2 - frameRect.top,
    });
    bobLineRaf = requestAnimationFrame(tick);
  }
  tick();
}

function waitForBite() {
  gameState = 'waiting'; // syncLineToBobber보다 먼저 바뀌어 있어야 루프 첫 tick이 안 죽는다
  el.statusLine.textContent = '입질을 기다리는 중...';
  el.bobber.classList.add('bob-idle');
  syncLineToBobber(lastRodTipPt);
  const delay = BITE_WAIT_MIN_MS + Math.random() * (BITE_WAIT_MAX_MS - BITE_WAIT_MIN_MS);
  biteTimer = setTimeout(triggerBite, delay);
}

function triggerBite() {
  if (gameState !== 'waiting') return;
  gameState = 'bite';
  el.bobber.classList.remove('bob-idle');
  el.bobber.classList.add('bite-dip');
  el.biteMark.classList.remove('hidden');
  el.statusLine.textContent = '지금이야! 탭!';
  vibrate([0, 60, 40, 60]);
  reactionTimer = setTimeout(missReaction, DIFF_TUNING[DIFFICULTY].reactionWindow);
}

function handleReactionTap() {
  if (gameState !== 'bite') return;
  clearTimeout(reactionTimer);
  cancelAnimationFrame(bobLineRaf);
  gameState = 'caught'; // "물었다!" 연출이 끝날 때까지 다른 입력을 막는 과도 상태
  el.biteMark.classList.add('hidden');
  el.bobber.classList.add('hidden');
  el.bobber.classList.remove('bite-dip');
  el.castSvg.classList.add('hidden'); // 낚시바(잡아채기)로 넘어가면 추/찌 자체가 안 보이니 줄도 같이 숨긴다
  playBiteCaughtAnimation().then(startCatching);
}

// "물었다!" 표시 — 왼쪽 위를 고정점으로 커졌다(120%) 작아지는(0%) 등가속
// 운동. size(t) = 100 + v0*t + 0.5*a*t^2, v0>0(커지는 방향)·a<0(감속) —
// 던지기 물리(throwSinker)와 같은 방식으로, 정점에 닿는 시각(T_PEAK)만
// 정해두면 v0·a가 정해지고, 그 뒤 size가 다시 0에 닿는 시각(T)은 같은
// 공식의 다른 근으로 구한다(포물선이 정점을 지나 출발선 아래까지 내려가는
// 것과 같은 모양 — 여기선 "높이" 대신 "크기(%)"가 오르내린다).
const BITE_CAUGHT_PEAK_SCALE = 120; // %
const BITE_CAUGHT_START_SCALE = 100; // %
const BITE_CAUGHT_T_PEAK = 0.22; // 초 — 120%까지 커지는 데 걸리는 시간
function playBiteCaughtAnimation() {
  return new Promise(resolve => {
    const v0 = 2 * (BITE_CAUGHT_PEAK_SCALE - BITE_CAUGHT_START_SCALE) / BITE_CAUGHT_T_PEAK;
    const a = -v0 / BITE_CAUGHT_T_PEAK;
    // size(T) = 0의 두 근 중 정점(T_PEAK) 이후에 오는 큰 쪽을 취한다.
    const T = (-v0 - Math.sqrt(v0 * v0 - 2 * a * BITE_CAUGHT_START_SCALE)) / a;
    el.biteCaught.style.transform = `scale(${BITE_CAUGHT_START_SCALE / 100})`;
    el.biteCaught.classList.remove('hidden');
    let start = null;
    function frame(ts) {
      if (start === null) start = ts;
      const t = (ts - start) / 1000;
      if (t >= T) { finish(); return; }
      const scale = BITE_CAUGHT_START_SCALE + v0 * t + 0.5 * a * t * t;
      el.biteCaught.style.transform = `scale(${Math.max(scale, 0) / 100})`;
      requestAnimationFrame(frame);
    }
    function finish() {
      el.biteCaught.classList.add('hidden');
      resolve();
    }
    requestAnimationFrame(frame);
  });
}

function missReaction() {
  if (gameState !== 'bite') return;
  el.biteMark.classList.add('hidden');
  el.bobber.classList.add('hidden');
  el.castSvg.classList.add('hidden');
  resetToIdle(); // 실패 — 화면 전환 없이 그냥 대기 상태로 돌아간다
}

// 입질 대기 중(waiting) 화면을 다시 탭하면 입질을 기다리지 않고 바로
// 릴을 감아 올린다 — 당연히 아무것도 안 걸려 있으니 빈손으로 끝난다.
// playReelThenResult(성공 시 릴 감기)와 같은 올리기 프레임을 재생하되
// 물고기가 없으니 flyFishToCharacter/showItemPopup 없이 곧장 대기로
// 돌아간다.
async function abortWaitingReel() {
  if (gameState !== 'waiting') return;
  clearTimeout(biteTimer);
  gameState = 'reeling';
  cancelAnimationFrame(bobLineRaf);
  el.statusLine.textContent = '허탕... 다시 던져보세요';
  el.bobber.classList.remove('bob-idle');
  el.bobber.classList.add('hidden');
  el.castSvg.classList.add('hidden');
  if (reelFrameUrls.length) {
    await playFrameSequence(reelFrameUrls, 90);
  } else {
    await wait(300);
  }
  resetToIdle();
}

/* ===== 낚시바(잡아채기) ===== */
function startCatching() {
  gameState = 'catching';
  el.statusLine.textContent = '잡아채기!';
  el.catchHint.classList.remove('hidden');
  el.fishbarPanel.classList.remove('hidden');
  fish = { y: 50, vy: DIFF_TUNING[DIFFICULTY].fishSpeedMult * 34, targetY: 50, pickTimer: 0 };
  zone = { y: clamp(50 - zoneSizePct / 2, 0, 100 - zoneSizePct), vel: 0 };
  progress = 30;
  holding = false;
  lastT = performance.now();
  raf = requestAnimationFrame(catchTick);
}

function updateFish(dt) {
  const tuning = DIFF_TUNING[DIFFICULTY];
  const baseSpeed = 40 * tuning.fishSpeedMult;
  if (MOTION_TYPE === 'linear') {
    fish.y += fish.vy * dt;
    if (fish.y <= 0) { fish.y = 0; fish.vy = Math.abs(fish.vy); }
    if (fish.y >= 100) { fish.y = 100; fish.vy = -Math.abs(fish.vy); }
    return;
  }
  fish.pickTimer -= dt;
  if (fish.pickTimer <= 0) {
    if (MOTION_TYPE === 'zigzag') {
      fish.targetY = clamp(fish.y + (Math.random() * 70 - 35), 4, 96);
      fish.pickTimer = 0.22 + Math.random() * 0.32;
    } else { // random
      fish.targetY = Math.random() * 92 + 4;
      fish.pickTimer = 0.6 + Math.random() * 0.8;
    }
  }
  const approachSpeed = baseSpeed * (MOTION_TYPE === 'zigzag' ? 1.7 : 0.95);
  const diff = fish.targetY - fish.y;
  const step = Math.sign(diff) * Math.min(Math.abs(diff), approachSpeed * dt);
  fish.y += step;
}

function updateZone(dt) {
  const RISE_ACCEL = 230, GRAVITY = 190, MAX_SPEED = 140;
  zone.vel += (holding ? -RISE_ACCEL : GRAVITY) * dt;
  zone.vel = clamp(zone.vel, -MAX_SPEED, MAX_SPEED);
  zone.y += zone.vel * dt;
  const maxY = 100 - zoneSizePct;
  if (zone.y <= 0) { zone.y = 0; zone.vel = 0; }
  if (zone.y >= maxY) { zone.y = maxY; zone.vel = 0; }
}

function updateProgress(dt) {
  const tuning = DIFF_TUNING[DIFFICULTY];
  const inZone = fish.y >= zone.y && fish.y <= zone.y + zoneSizePct;
  progress += (inZone ? tuning.fillRate : -tuning.drainRate) * dt;
  progress = clamp(progress, 0, 100);
}

function renderBarFrame() {
  if (zoneTrack) {
    el.fishbarFish.style.top = (zoneTrack.y + fish.y / 100 * zoneTrack.h) + '%';
    el.fishbarZone.style.top = (zoneTrack.y + zone.y / 100 * zoneTrack.h) + '%';
  } else {
    el.fishbarFish.style.top = fish.y + '%';
    el.fishbarZone.style.top = zone.y + '%';
  }
  el.fishbarGaugeMask.style.height = (100 - progress) + '%';
  // 게이지 채움 이미지를 올렸으면 그 이미지를 그대로 두고, 없을 때만
  // 기존처럼 진행도에 따라 색을 다시 칠한다.
  if (!gaugeImageUrl) el.fishbarGauge.style.background = gaugeColorForProgress(progress);
}

function catchTick(ts) {
  if (gameState !== 'catching') return;
  const dt = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;
  updateFish(dt);
  updateZone(dt);
  updateProgress(dt);
  renderBarFrame();
  if (progress >= 100) { endCatch(true); return; }
  if (progress <= 0) { endCatch(false); return; }
  raf = requestAnimationFrame(catchTick);
}

function endCatch(success) {
  if (raf) cancelAnimationFrame(raf);
  raf = null;
  el.fishbarPanel.classList.add('hidden');
  el.catchHint.classList.add('hidden');
  if (success) playReelThenResult(); else resetToIdle(); // 실패 — 화면 전환 없이 그냥 대기 상태로 돌아간다
}

// 잡힌 물고기 종을 고른다 — fishDefs의 catchRate가 하나라도 채워져 있으면(합이
// 0보다 크면) 그 값을 가중치로 쓰고, 전부 0(§업로드 시점의 플레이스홀더 값)이면
// difficulty가 낮을수록 잘 잡히도록 난이도 제곱의 역수를 가중치로 대신 쓴다.
function pickCaughtFish() {
  const all = Object.values(fishDefs);
  const totalRate = all.reduce((sum, f) => sum + (f.catchRate || 0), 0);
  const weightOf = totalRate > 0 ? (f => f.catchRate || 0) : (f => 1 / (f.difficulty * f.difficulty));
  const weights = all.map(weightOf);
  const totalWeight = weights.reduce((sum, w) => sum + w, 0);
  let r = Math.random() * totalWeight;
  for (let i = 0; i < all.length; i++) {
    r -= weights[i];
    if (r <= 0) return all[i];
  }
  return all[all.length - 1];
}

async function playReelThenResult() {
  gameState = 'reeling';
  el.statusLine.textContent = '끌어올리는 중...';
  if (reelFrameUrls.length) {
    await playFrameSequence(reelFrameUrls, 90);
  } else {
    await wait(500);
  }
  caughtCount++;
  el.countChip.textContent = caughtCount + '마리';
  const fishCaught = pickCaughtFish();
  el.statusLine.textContent = '손맛 좋다! 낚았어요!';
  await flyFishToCharacter(fishCaught);
  showItemPopup(fishCaught);
}

/* ===== 물고기 날아오기 연출 =====
   추(찌)가 마지막으로 착수했던 자리(el.bobber의 현재 left/top — throwSinker의
   finish에서 남겨둔 값)에서 캐릭터(el.charStage) 쪽으로 물고기 아이콘이
   천천히 날아든다. 임시 엘리먼트(.fish-fly)를 만들어 el.stage에 얹고,
   도착하면 지운다. */
function flyFishToCharacter(fishDef) {
  return new Promise(resolve => {
    const frameRect = el.frame.getBoundingClientRect();
    const startLeft = parseFloat(el.bobber.style.left) || 26;
    const startTop = parseFloat(el.bobber.style.top) || 64;
    const charRect = el.charStage.getBoundingClientRect();
    const endLeft = ((charRect.left + charRect.width / 2) - frameRect.left) / frameRect.width * 100;
    const endTop = ((charRect.top + charRect.height * 0.3) - frameRect.top) / frameRect.height * 100;

    const flyEl = document.createElement('div');
    flyEl.className = 'fish-fly';
    flyEl.style.borderColor = GRADE_BORDER_COLORS[fishDef.grade] || 'transparent';
    if (fishSheetUrl) {
      const override = fishIconOverrides[fishDef.id];
      const style = (override && fishSheetDims)
        ? getFishCropStyle(override, fishSheetDims.width, fishSheetDims.height, 44)
        : getFishSlotStyle(fishDef.slot, 3.5);
      flyEl.style.backgroundImage = `url('${fishSheetUrl}')`;
      flyEl.style.backgroundPosition = style.backgroundPosition;
      flyEl.style.backgroundSize = style.backgroundSize;
    } else {
      flyEl.textContent = '🐟';
    }
    // 설정 화면 물고기 목록과 같은 좌우반전 — 스프라이트시트 크롭(실제
    // 사진)일 때만 뒤집는다. 시작 transform에도 미리 넣어둬야 한다 —
    // transition이 걸린 상태로 도착 시점에만 scaleX(-1)을 추가하면
    // "날아가는 동안 좌우가 뒤집히는" 애니메이션처럼 보인다(요청: 반전은
    // 애니메이션이 아니라 처음부터 반전된 상태로 보여야 함). 시작/도착
    // 값에 똑같이 넣어두면 그 값 자체는 transition 동안 그대로라
    // 애니메이션되지 않고, translate/scale만 움직인다.
    const flip = fishSheetUrl ? ' scaleX(-1)' : '';
    flyEl.style.left = startLeft + '%';
    flyEl.style.top = startTop + '%';
    flyEl.style.transform = 'translate(-50%,-50%)' + flip;
    el.stage.appendChild(flyEl);
    vibrate(20);
    requestAnimationFrame(() => {
      flyEl.style.transition = 'left .9s cubic-bezier(0.25,0.8,0.25,1), top .9s cubic-bezier(0.25,0.8,0.25,1), transform .9s ease';
      flyEl.style.left = endLeft + '%';
      flyEl.style.top = endTop + '%';
      flyEl.style.transform = 'translate(-50%,-50%) scale(0.55)' + flip;
    });
    setTimeout(() => { flyEl.remove(); resolve(); }, 920);
  });
}

/* ===== 아이템창 =====
   실패 시엔 아무 화면도 없이 그냥 대기로 돌아가고(missReaction/endCatch
   참고), 성공해서 물고기가 캐릭터에게 도착한 다음에만 이 팝업이 뜬다.
   배경/아이콘 위치·크기는 dev/minigame-fishing/index.html의 "아이템창" 탭
   (itemPopup config, loadConfig에서 el.itemPopupCard/el.itemPopupIcon에
   이미 적용해둔 상태)을 그대로 쓴다. */
// 캐릭터 머리 위에 뜨도록 el.charStage 기준으로 위치를 잡는다 —
// flyFishToCharacter가 도착 지점을 계산하는 방식과 같다. .item-popup 자체가
// transform:translate(-50%,-100%)라 이 left/top이 카드의 "아래쪽 중앙
// 꼭짓점"이 된다(카드가 그 점에서부터 위로 펼쳐짐).
function positionItemPopup() {
  const frameRect = el.frame.getBoundingClientRect();
  const charRect = el.charStage.getBoundingClientRect();
  const leftPct = ((charRect.left + charRect.width / 2) - frameRect.left) / frameRect.width * 100;
  const topPct = ((charRect.top - 12) - frameRect.top) / frameRect.height * 100; // 머리 위 12px 여백
  el.itemPopup.style.left = leftPct + '%';
  el.itemPopup.style.top = topPct + '%';
}

function showItemPopup(fishCaught) {
  gameState = 'popup';
  positionItemPopup();
  el.itemPopupName.textContent = fishCaught.name;
  el.itemPopupMeta.textContent = `${fishCaught.grade} · ${fishCaught.value}P`;
  if (fishSheetUrl) {
    const override = fishIconOverrides[fishCaught.id];
    const style = (override && fishSheetDims)
      ? getFishCropStyle(override, fishSheetDims.width, fishSheetDims.height, itemIconSizePx)
      : getFishSlotStyle(fishCaught.slot, 3.5);
    el.itemPopupIcon.style.backgroundImage = `url('${fishSheetUrl}')`;
    el.itemPopupIcon.style.backgroundPosition = style.backgroundPosition;
    el.itemPopupIcon.style.backgroundSize = style.backgroundSize;
    // 설정 화면 물고기 목록과 같은 좌우반전 — translate(-50%,-50%)는
    // CSS(.item-popup-icon)가 아니라 여기서 인라인으로 같이 넣어줘야 한다.
    // scaleX(-1)만 인라인으로 넣으면 그 자체가 transform 전체를 덮어써서
    // CSS의 translate(-50%,-50%) 중심정렬이 사라져(아이콘이 지정 위치에서
    // 오른쪽 아래로 반 칸 밀려 보임) 버린다.
    el.itemPopupIcon.style.transform = 'translate(-50%,-50%) scaleX(-1)';
    el.itemPopupIcon.textContent = '';
  } else {
    el.itemPopupIcon.style.backgroundImage = 'none';
    el.itemPopupIcon.style.transform = 'translate(-50%,-50%)';
    el.itemPopupIcon.textContent = '🐟';
  }
  // 등급 테두리(GRADE_BORDER_COLORS)는 날아오는 중(.fish-fly, flyFishToCharacter)에만
  // 보여주는 연출이다 — 액자(아이템창 카드)에 자리잡은 뒤에는 테두리 없이
  // 깔끔하게 보이도록 명시적으로 지운다(.item-popup-icon 자체엔 border가
  // 없어 지금도 안 보이지만, 나중에 border를 추가하는 변경이 들어와도
  // 이 자리에서 항상 투명하게 리셋해 실수로 남는 걸 막는다).
  el.itemPopupIcon.style.borderColor = 'transparent';
  el.itemPopup.classList.add('show');
}

/* ===== 리셋 ===== */
function resetToIdle() {
  el.itemPopup.classList.remove('show');
  gameState = 'idle';
  cancelAnimationFrame(bobLineRaf);
  el.statusLine.textContent = '화면을 꾹 눌러 캐스팅 세기를 조절하세요';
  el.castPowerWrap.classList.add('hidden');
  el.castSvg.classList.add('hidden');
  el.bobber.classList.add('hidden');
  el.bobber.classList.remove('bob-idle', 'bite-dip');
  el.biteCaught.classList.add('hidden');
  if (idleFrameUrl) { el.charImg.src = idleFrameUrl; el.charImg.classList.remove('hidden'); el.charFallback.classList.add('hidden'); }
  else { el.charImg.classList.add('hidden'); el.charFallback.classList.remove('hidden'); }
}

/* ===== 입력 =====
   캐스팅 버튼 대신 idle 상태에서 화면을 누르고 있으면 세기 게이지가
   왔다리갔다리 돌아가다가(startPowerCharge), 손을 떼는 순간 값으로 던진다
   (releasePowerAndCast) — 잡아채기(catching) 중 홀드와 같은 pointerdown/up
   쌍을 gameState로 나눠 재사용한다. waiting(입질 대기 중) 탭은 기다리지
   않고 바로 빈손으로 릴을 감고, popup(아이템창 뜬 상태) 탭은 그냥
   닫는다(아이템창엔 확인 버튼이 따로 없다 — el.itemPopup이
   pointer-events:none이라 카드를 눌러도 그대로 여기까지 뚫고 내려온다). */
el.frame.addEventListener('pointerdown', () => {
  if (gameState === 'bite') { handleReactionTap(); return; }
  if (gameState === 'catching') { holding = true; return; }
  if (gameState === 'waiting') { abortWaitingReel(); return; }
  if (gameState === 'popup') { resetToIdle(); return; }
  if (gameState === 'idle') { startPowerCharge(); return; }
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(evt => {
  el.frame.addEventListener(evt, () => {
    holding = false;
    if (gameState === 'charging') releasePowerAndCast();
  });
});

loadConfig();
</script>
