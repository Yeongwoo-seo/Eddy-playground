<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>스토리 · OPERATION MK DEV</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(48px + env(safe-area-inset-top,0)) 20px calc(32px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.back{font-family:var(--mono);font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:18px;display:inline-flex;align-items:center;gap:4px;width:fit-content}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
.title{font-size:26px;font-weight:700;letter-spacing:-.2px;margin-bottom:10px}
.sub{font-size:14px;color:var(--text-secondary);margin-bottom:32px;line-height:1.6}
.week-list{display:flex;flex-direction:column;gap:14px}
.week-btn{display:flex;align-items:center;gap:14px;background:var(--surface-1);border:1px solid var(--divider);border-radius:12px;padding:18px 20px;text-decoration:none;color:inherit;transition:transform .15s,background .15s}
.week-btn:active{transform:scale(.98);background:var(--surface-2)}
.week-num{font-family:var(--mono);font-size:13px;color:var(--cyan);flex-shrink:0}
.week-txt{flex:1;min-width:0}
.week-name{font-size:16px;font-weight:700}
.week-meta{font-size:12.5px;color:var(--text-secondary);margin-top:3px;line-height:1.5;font-family:var(--mono)}
.week-arrow{color:var(--text-muted);font-size:18px;flex-shrink:0}
</style>
</head>
<body>
<div class="frame">
  <a class="back" href="/dev/">‹ DEV</a>
  <div class="tag">Operation MK</div>
  <div class="title">스토리</div>
  <div class="sub">주차를 선택하면 그 주차의 씬 목록으로 이동합니다.</div>
  <div class="week-list" id="weekList"></div>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script src="/dev/dialogueData.js"></script>
<script>
// Hardcoded per-week blurb + real scene array (not weeks[]'s
// week0UploadScenes, which also carries /dev/upload's room-search
// pseudo-scenes) so the count shown here matches /dev/weekN's own list.
const STORY_WEEKS = [
  { id: 'week0', label: '0주차', title: 'ARRIVAL', desc: '재회와 황동 열쇠의 첫 발견', scenes: week0Scenes },
  { id: 'week1', label: '1주차', title: '사라진 K-01', desc: '첫 사건, 그리고 M.K.라는 이름', scenes: week1Scenes },
  { id: 'week2', label: '2주차', title: '존재하지 않는 여자', desc: '가짜 목격담과 두 번째 흔적', scenes: week2Scenes },
  { id: 'week3', label: '3주차', title: '사라진 원본 열쇠', desc: '위조된 열쇠, 첫 직접 연락', scenes: week3Scenes },
  { id: 'week4', label: '4주차', title: 'M.K.는 미카 코바치인가', desc: '대면, 붕괴, 그리고 최종 정체', scenes: week4Scenes },
];
document.getElementById('weekList').innerHTML = STORY_WEEKS.map(w => `
  <a class="week-btn" href="/dev/${w.id}/">
    <div class="week-num">${w.label}</div>
    <div class="week-txt">
      <div class="week-name">${w.title}</div>
      <div class="week-meta">${w.desc} · 씬 ${w.scenes.length}개</div>
    </div>
    <div class="week-arrow">›</div>
  </a>
`).join('');
</script>
<script src="/dev/devPlanFab.js"></script>
</body>
</html>
