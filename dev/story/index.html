<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>메인 스토리 · MISSING KEY DEV</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="theme-color" content="#080A0C">
<link rel="manifest" href="/dev/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080A0C;--surface-1:#101419;--surface-2:#171C22;
  --text-primary:#EDF1F4;--text-secondary:#929BA5;--text-muted:#5F6872;
  --cyan:#59B8C8;--amber:#D6A84B;--divider:rgba(255,255,255,0.08);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{height:100%}
body{background:#050607;color:var(--text-primary);font-family:var(--sans);display:flex;justify-content:center;min-height:100dvh}
.frame{width:100%;max-width:430px;min-height:100dvh;min-height:100vh;padding:calc(48px + env(safe-area-inset-top,0)) 20px calc(32px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column}
.back{font-family:var(--mono);font-size:12px;color:var(--text-muted);text-decoration:none;margin-bottom:18px;display:inline-flex;align-items:center;gap:4px;width:fit-content}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px}
.title{font-size:26px;font-weight:700;letter-spacing:-.2px;margin-bottom:10px}
.sub{font-size:14px;color:var(--text-secondary);margin-bottom:32px;line-height:1.6}
.week-list{display:flex;flex-direction:column;gap:16px}
.week-card{position:relative;display:block;min-height:196px;border-radius:24px;overflow:hidden;text-decoration:none;color:inherit;background-size:cover;background-position:center;transition:transform .15s}
.week-card:active{transform:scale(.98)}
.week-card::before{content:'';position:absolute;inset:0;background:linear-gradient(to top, rgba(3,4,5,.88) 0%, rgba(3,4,5,.42) 48%, rgba(3,4,5,.05) 78%)}
.week-icon{position:absolute;top:16px;left:16px;z-index:1;width:38px;height:38px;border-radius:50%;background:rgba(8,10,12,.55);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:18px;backdrop-filter:blur(4px)}
.week-body{position:absolute;left:20px;right:20px;bottom:18px;z-index:1}
.week-card-num{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;color:rgba(237,241,244,.65);margin-bottom:4px}
.week-card-title{font-size:21px;font-weight:800;letter-spacing:-.2px;line-height:1.25;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.week-card-sub{font-size:13.5px;color:rgba(237,241,244,.82);margin-top:6px;line-height:1.5}
.week-card-meta{font-family:var(--mono);font-size:11px;color:var(--cyan);margin-top:9px;letter-spacing:.03em}
.week-card.locked{background-image:none !important;background-color:#050506;cursor:default}
.week-card.locked:active{transform:none}
.week-card.locked .week-icon{background:rgba(8,10,12,.7)}
.week-card.locked .week-card-title{color:var(--text-muted);font-size:22px}
.week-card.locked .week-card-meta{color:var(--text-muted)}
</style>
</head>
<body>
<div class="frame">
  <a class="back" href="/dev/">‹ DEV</a>
  <div class="tag">Missing Key</div>
  <div class="title">메인 스토리</div>
  <div class="sub">주차를 선택하면 그 주차의 씬 목록으로 이동합니다. 탐색허브는 별도 페이지가 아니라, 씬 사이사이에 놓인 허브 칸으로 함께 표시됩니다.</div>
  <div class="week-list" id="weekList"></div>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/dev/sw.js', { scope: '/dev/' });
}
</script>
<script src="/dev/dialogueData.js"></script>
<script>
// Hardcoded per-week blurb + real scene array (not weeks[]'s
// week1UploadScenes, which also carries /dev/upload's room-search
// pseudo-scenes) so the count shown here matches /dev/weekN's own list.
// locked 플래그 — /play/index.html의 주차 선택 화면(WEEK_TILES)과
// 같은 기준: 2주차까지만 실제 플레이어에게 공개되고, 3~4주차는 아직
// "???"로 잠겨 있다(그 파일의 header 주석 참고). 여기서도 같은 기준을
// 따라 잠긴 주차는 제목·설명·씬 개수를 전부 가리고 이동도 막는다.
const STORY_WEEKS = [
  { id: 'week1', label: '1주차', title: 'ARRIVAL', desc: '재회와 황동 열쇠의 첫 발견', scenes: week1Scenes, icon: '✈️', bg: 'linear-gradient(135deg,#233541 0%,#0e1319 65%,#080a0c 100%)', locked: false },
  { id: 'week2', label: '2주차', title: '사라진 K-01', desc: '첫 사건, 그리고 M.K.라는 이름', scenes: week2Scenes, icon: '🔍', bg: 'linear-gradient(135deg,#2b2320 0%,#150f0d 65%,#080a0c 100%)', locked: false },
  { id: 'week3', label: '3주차', title: '존재하지 않는 여자', desc: '가짜 목격담과 두 번째 흔적', scenes: week3Scenes, icon: '🕵️', bg: 'linear-gradient(135deg,#2a2233 0%,#140f19 65%,#080a0c 100%)', locked: true },
  { id: 'week4', label: '4주차', title: 'M.K.는 미카 코바치인가', desc: '대면, 붕괴, 그리고 최종 정체', scenes: week4Scenes, icon: '🎭', bg: 'linear-gradient(135deg,#1c1c1f 0%,#0c0c0d 65%,#050506 100%)', locked: true },
];
document.getElementById('weekList').innerHTML = STORY_WEEKS.map(w => w.locked ? `
  <div class="week-card locked">
    <div class="week-icon">🔒</div>
    <div class="week-body">
      <div class="week-card-num">${w.label}</div>
      <div class="week-card-title">???</div>
      <div class="week-card-meta">공개 예정</div>
    </div>
  </div>
` : `
  <a class="week-card" href="/dev/${w.id}/" style="background-image:${w.bg}">
    <div class="week-icon">${w.icon}</div>
    <div class="week-body">
      <div class="week-card-num">${w.label}</div>
      <div class="week-card-title">${w.title}</div>
      <div class="week-card-sub">${w.desc}</div>
      <div class="week-card-meta">씬 ${w.scenes.length}개</div>
    </div>
  </a>
`).join('');
</script>
<script src="/dev/devPlanFab.js"></script>
</body>
</html>
